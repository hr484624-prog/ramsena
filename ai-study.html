<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GyanSetu AI Study</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#17213f;
}

button,
textarea{
  font-family:inherit;
}

button{
  border:0;
  outline:0;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  margin:auto;
  background:#fff;
  position:relative;
  padding-bottom:145px;
}

/* ================= HEADER ================= */

.header{
  height:64px;
  background:#fff;
  border-bottom:1px solid #e9edf4;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  position:sticky;
  top:0;
  z-index:30;
}

.headerLeft{
  display:flex;
  align-items:center;
  gap:10px;
}

.backBtn{
  width:40px;
  height:40px;
  border-radius:12px;
  background:#f1f4f9;
  color:#17213f;
  font-size:28px;
}

.logo{
  width:38px;
  height:38px;
  border-radius:12px;
  background:linear-gradient(135deg,#2457ff,#6597ff);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:21px;
  box-shadow:0 5px 15px rgba(36,87,255,.22);
}

.titleBox{
  display:flex;
  flex-direction:column;
}

.title{
  font-size:15px;
  font-weight:800;
}

.online{
  color:#19a463;
  font-size:10px;
  margin-top:2px;
}

.newBtn{
  width:40px;
  height:40px;
  border-radius:12px;
  background:#f1f4f9;
  color:#17213f;
  font-size:24px;
}

/* ================= CHAT ================= */

.chat{
  min-height:calc(100vh - 130px);
  padding:18px 13px 20px;
  background:
    radial-gradient(
      circle at top,
      #edf3ff 0,
      #fff 32%
    );
}

.welcome{
  text-align:center;
  padding:42px 12px 30px;
}

.robot{
  width:76px;
  height:76px;
  margin:auto;
  border-radius:24px;
  background:linear-gradient(
    135deg,
    #2457ff,
    #70a0ff
  );
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  box-shadow:0 12px 28px rgba(36,87,255,.23);
}

.welcome h1{
  margin-top:17px;
  font-size:25px;
}

.welcome p{
  max-width:320px;
  margin:9px auto;
  color:#7d8799;
  font-size:13px;
  line-height:1.6;
}

/* ================= MESSAGE ================= */

.message{
  display:flex;
  margin:17px 0;
  animation:appear .2s ease;
}

@keyframes appear{
  from{
    opacity:0;
    transform:translateY(6px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.message.user{
  justify-content:flex-end;
}

.message.ai{
  justify-content:flex-start;
}

.messageContent{
  max-width:88%;
}

.avatar{
  width:29px;
  height:29px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  margin-bottom:6px;
}

.aiAvatar{
  background:#edf3ff;
}

.userAvatar{
  background:#17213f;
  color:#fff;
}

.bubble{
  padding:12px 14px;
  border-radius:17px;
  font-size:14px;
  line-height:1.6;
  white-space:pre-wrap;
  word-break:break-word;
}

.userBubble{
  background:#2457ff;
  color:#fff;
  border-bottom-right-radius:5px;
}

.aiBubble{
  background:#f0f3f8;
  color:#27324b;
  border-bottom-left-radius:5px;
}

.time{
  margin-top:5px;
  color:#9ba3b2;
  font-size:9px;
}

/* ================= PHOTO ================= */

.chatPhoto{
  width:210px;
  max-width:100%;
  max-height:230px;
  object-fit:cover;
  border-radius:13px;
  display:block;
  margin-bottom:8px;
}

/* ================= ACTIONS ================= */

.actions{
  display:flex;
  gap:6px;
  margin-top:7px;
}

.action{
  background:#fff;
  border:1px solid #e1e6ee;
  color:#667086;
  padding:6px 9px;
  border-radius:9px;
  font-size:10px;
}

/* ================= THINKING ================= */

.thinking{
  display:flex;
  gap:5px;
  align-items:center;
  background:#f0f3f8;
  padding:14px 16px;
  border-radius:17px;
  border-bottom-left-radius:5px;
  width:max-content;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#68758d;
  animation:dot 1s infinite;
}

.dot:nth-child(2){
  animation-delay:.15s;
}

.dot:nth-child(3){
  animation-delay:.3s;
}

@keyframes dot{
  0%,100%{
    transform:translateY(0);
    opacity:.35;
  }
  50%{
    transform:translateY(-5px);
    opacity:1;
  }
}

/* ================= COMPOSER ================= */

.composerArea{
  position:fixed;
  left:50%;
  bottom:68px;
  transform:translateX(-50%);
  width:100%;
  max-width:480px;
  background:rgba(255,255,255,.97);
  padding:8px 11px 9px;
  border-top:1px solid #e9edf4;
  z-index:40;
}

.composer{
  background:#fff;
  border:1.5px solid #dce2ec;
  border-radius:19px;
  overflow:hidden;
  box-shadow:0 5px 20px rgba(24,40,70,.08);
}

.preview{
  display:none;
  padding:9px;
  border-bottom:1px solid #edf0f5;
}

.previewBox{
  position:relative;
  width:72px;
  height:72px;
}

.previewImage{
  width:72px;
  height:72px;
  object-fit:cover;
  border-radius:12px;
}

.remove{
  position:absolute;
  top:-7px;
  right:-7px;
  width:23px;
  height:23px;
  border-radius:50%;
  background:#17213f;
  color:#fff;
  font-size:15px;
  border:2px solid #fff;
}

.inputRow{
  display:flex;
  align-items:flex-end;
  gap:6px;
  padding:7px;
}

#question{
  flex:1;
  min-height:42px;
  max-height:120px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  padding:11px 7px;
  font-size:14px;
  line-height:1.4;
  color:#17213f;
}

#question::placeholder{
  color:#9aa3b3;
}

.tool{
  width:40px;
  height:40px;
  flex:0 0 40px;
  border-radius:12px;
  background:#f1f4f9;
  font-size:18px;
}

.send{
  width:42px;
  height:42px;
  flex:0 0 42px;
  border-radius:13px;
  background:#2457ff;
  color:#fff;
  font-size:18px;
  box-shadow:0 5px 14px rgba(36,87,255,.25);
}

.send:disabled{
  opacity:.5;
}

/* ================= BOTTOM NAV ================= */

.bottom{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:100%;
  max-width:480px;
  height:68px;
  background:#fff;
  border-top:1px solid #e7ebf1;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:50;
}

.nav{
  text-align:center;
  color:#8b94a5;
  font-size:10px;
}

.navIcon{
  display:block;
  font-size:21px;
  margin-bottom:3px;
}

.nav.active{
  color:#2457ff;
  font-weight:bold;
}

/* ================= POPUP ================= */

.popupBg{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(10,20,40,.4);
  backdrop-filter:blur(4px);
  z-index:100;
  align-items:flex-end;
  justify-content:center;
}

.popup{
  width:100%;
  max-width:480px;
  background:#fff;
  border-radius:25px 25px 0 0;
  padding:23px 20px 25px;
  animation:popup .22s ease;
}

@keyframes popup{
  from{
    transform:translateY(100%);
  }
  to{
    transform:translateY(0);
  }
}

.popupIcon{
  width:48px;
  height:48px;
  border-radius:15px;
  background:#edf3ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
}

.popup h3{
  margin-top:13px;
  font-size:18px;
}

.popup p{
  margin-top:6px;
  color:#7c8698;
  font-size:13px;
  line-height:1.5;
}

.popupButtons{
  display:flex;
  gap:9px;
  margin-top:18px;
}

.popupButton{
  flex:1;
  height:45px;
  border-radius:13px;
  font-weight:bold;
}

.cancel{
  background:#eef1f5;
  color:#586276;
}

.ok{
  background:#2457ff;
  color:#fff;
}

#imageInput{
  display:none;
}

</style>
</head>


<body>

<div class="app">


<!-- ================= HEADER ================= -->

<div class="header">

  <div class="headerLeft">

    <button
      class="backBtn"
      onclick="goHome()"
    >
      ‹
    </button>

    <div class="logo">
      🤖
    </div>

    <div class="titleBox">

      <div class="title">
        GyanSetu AI
      </div>

      <div class="online">
        ● Online
      </div>

    </div>

  </div>


  <button
    class="newBtn"
    onclick="newChat()"
  >
    ＋
  </button>

</div>


<!-- ================= CHAT ================= -->

<div
  class="chat"
  id="chat"
>

  <div
    class="welcome"
    id="welcome"
  >

    <div class="robot">
      🤖
    </div>

    <h1>
      How can I help you?
    </h1>

    <p>
      Ask your study question, type in Hindi or English,
      or attach a photo of your question.
    </p>

  </div>

</div>


<!-- ================= COMPOSER ================= -->

<div class="composerArea">

  <div class="composer">


    <!-- PHOTO PREVIEW -->

    <div
      class="preview"
      id="preview"
    >

      <div class="previewBox">

        <img
          id="previewImage"
          class="previewImage"
          alt="Selected photo"
        >

        <button
          class="remove"
          onclick="removeImage()"
        >
          ×
        </button>

      </div>

    </div>


    <!-- INPUT -->

    <div class="inputRow">

      <button
        class="tool"
        onclick="chooseImage()"
      >
        ＋
      </button>


      <textarea
        id="question"
        placeholder="Message GyanSetu AI..."
        rows="1"
        oninput="resizeInput()"
        onkeydown="enterSend(event)"
      ></textarea>


      <button
        class="tool"
        id="micButton"
        onclick="voiceInput()"
      >
        🎤
      </button>


      <button
        class="send"
        id="sendButton"
        onclick="askAI()"
      >
        ➤
      </button>

    </div>

  </div>

</div>


<!-- ================= IMAGE INPUT ================= -->

<input
  type="file"
  id="imageInput"
  accept="image/*"
  onchange="imageSelected(event)"
>


<!-- ================= BOTTOM ================= -->

<div class="bottom">

  <div
    class="nav"
    onclick="goHome()"
  >
    <span class="navIcon">🏠</span>
    Home
  </div>

  <div
    class="nav"
    onclick="goLearn()"
  >
    <span class="navIcon">📚</span>
    Learn
  </div>

  <div class="nav active">
    <span class="navIcon">🤖</span>
    AI
  </div>

  <div
    class="nav"
    onclick="goRank()"
  >
    <span class="navIcon">🏆</span>
    Rank
  </div>

  <div
    class="nav"
    onclick="goProfile()"
  >
    <span class="navIcon">👤</span>
    Profile
  </div>

</div>


<!-- ================= POPUP ================= -->

<div
  class="popupBg"
  id="popupBg"
>

  <div class="popup">

    <div
      class="popupIcon"
      id="popupIcon"
    >
      ℹ️
    </div>

    <h3 id="popupTitle">
      GyanSetu AI
    </h3>

    <p id="popupText">
      Message
    </p>

    <div class="popupButtons">

      <button
        class="popupButton cancel"
        onclick="closePopup()"
      >
        Cancel
      </button>

      <button
        class="popupButton ok"
        id="popupOk"
        onclick="popupOK()"
      >
        OK
      </button>

    </div>

  </div>

</div>


</div>


<script>

/* =====================================================
   VARIABLES
===================================================== */

let selectedImage = null;
let selectedImageType = null;

let thinking = false;

let popupFunction = null;

let recognition = null;
let listening = false;


/* =====================================================
   ELEMENTS
===================================================== */

const chat =
  document.getElementById("chat");

const welcome =
  document.getElementById("welcome");

const question =
  document.getElementById("question");

const sendButton =
  document.getElementById("sendButton");

const imageInput =
  document.getElementById("imageInput");

const preview =
  document.getElementById("preview");

const previewImage =
  document.getElementById("previewImage");

const micButton =
  document.getElementById("micButton");


/* =====================================================
   POPUP
===================================================== */

function showPopup(
  title,
  text,
  icon,
  callback
){

  document.getElementById(
    "popupTitle"
  ).innerText = title;

  document.getElementById(
    "popupText"
  ).innerText = text;

  document.getElementById(
    "popupIcon"
  ).innerText = icon || "ℹ️";

  popupFunction =
    callback || null;

  document.getElementById(
    "popupBg"
  ).style.display = "flex";

}


function closePopup(){

  document.getElementById(
    "popupBg"
  ).style.display = "none";

  popupFunction = null;

}


function popupOK(){

  const fn =
    popupFunction;

  closePopup();

  if(typeof fn === "function"){
    fn();
  }

}


/* =====================================================
   IMAGE
===================================================== */

function chooseImage(){

  imageInput.click();

}


function imageSelected(event){

  const file =
    event.target.files[0];

  if(!file){
    return;
  }


  if(!file.type.startsWith("image/")){

    showPopup(
      "Invalid Image",
      "Please select a valid image.",
      "🖼️"
    );

    imageInput.value = "";

    return;
  }


  if(file.size > 8 * 1024 * 1024){

    showPopup(
      "Image Too Large",
      "Please select an image smaller than 8 MB.",
      "📦"
    );

    imageInput.value = "";

    return;
  }


  selectedImageType =
    file.type;


  const reader =
    new FileReader();


  reader.onload =
    function(e){

      selectedImage =
        e.target.result;

      previewImage.src =
        selectedImage;

      preview.style.display =
        "block";

    };


  reader.readAsDataURL(file);

}


function removeImage(){

  selectedImage = null;

  selectedImageType = null;

  previewImage.removeAttribute(
    "src"
  );

  preview.style.display =
    "none";

  imageInput.value = "";

}


/* =====================================================
   TEXT INPUT
===================================================== */

function resizeInput(){

  question.style.height =
    "auto";

  question.style.height =
    Math.min(
      question.scrollHeight,
      120
    ) + "px";

}


function enterSend(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    askAI();

  }

}


/* =====================================================
   TIME
===================================================== */

function currentTime(){

  return new Date()
    .toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}


/* =====================================================
   USER MESSAGE
===================================================== */

function addUserMessage(
  text,
  image
){

  welcome.style.display =
    "none";


  const message =
    document.createElement("div");

  message.className =
    "message user";


  const content =
    document.createElement("div");

  content.className =
    "messageContent";


  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar userAvatar";

  avatar.innerText =
    "👤";


  content.appendChild(
    avatar
  );


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble userBubble";


  if(image){

    const img =
      document.createElement("img");

    img.className =
      "chatPhoto";

    img.src =
      image;

    bubble.appendChild(
      img
    );

  }


  if(text){

    const textDiv =
      document.createElement("div");

    textDiv.innerText =
      text;

    bubble.appendChild(
      textDiv
    );

  }


  content.appendChild(
    bubble
  );


  const time =
    document.createElement("div");

  time.className =
    "time";

  time.innerText =
    currentTime();


  content.appendChild(
    time
  );

  message.appendChild(
    content
  );

  chat.appendChild(
    message
  );

  scrollDown();

}


/* =====================================================
   THINKING
===================================================== */

function showThinking(){

  removeThinking();


  const message =
    document.createElement("div");

  message.className =
    "message ai";

  message.id =
    "thinkingMessage";


  const content =
    document.createElement("div");

  content.className =
    "messageContent";


  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar aiAvatar";

  avatar.innerText =
    "🤖";


  content.appendChild(
    avatar
  );


  const thinkingBox =
    document.createElement("div");

  thinkingBox.className =
    "thinking";

  thinkingBox.innerHTML =
    `
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    `;


  content.appendChild(
    thinkingBox
  );

  message.appendChild(
    content
  );

  chat.appendChild(
    message
  );

  scrollDown();

}


function removeThinking(){

  const element =
    document.getElementById(
      "thinkingMessage"
    );

  if(element){
    element.remove();
  }

}


/* =====================================================
   AI MESSAGE
===================================================== */

function addAIMessage(text){

  removeThinking();


  const message =
    document.createElement("div");

  message.className =
    "message ai";


  const content =
    document.createElement("div");

  content.className =
    "messageContent";


  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar aiAvatar";

  avatar.innerText =
    "🤖";


  content.appendChild(
    avatar
  );


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble aiBubble";

  bubble.innerText =
    text;


  content.appendChild(
    bubble
  );


  const actions =
    document.createElement("div");

  actions.className =
    "actions";


  const copy =
    document.createElement("button");

  copy.className =
    "action";

  copy.innerText =
    "📋 Copy";


  copy.onclick =
    function(){

      copyAnswer(text);

    };


  const listen =
    document.createElement("button");

  listen.className =
    "action";

  listen.innerText =
    "🔊 Listen";


  listen.onclick =
    function(){

      speakAnswer(text);

    };


  actions.appendChild(
    copy
  );

  actions.appendChild(
    listen
  );


  content.appendChild(
    actions
  );


  const time =
    document.createElement("div");

  time.className =
    "time";

  time.innerText =
    currentTime();


  content.appendChild(
    time
  );


  message.appendChild(
    content
  );

  chat.appendChild(
    message
  );

  scrollDown();

}


/* =====================================================
   MAIN AI FUNCTION
===================================================== */

async function askAI(){

  if(thinking){
    return;
  }


  const text =
    question.value.trim();


  const image =
    selectedImage;

  const imageType =
    selectedImageType;


  if(!text && !image){

    showPopup(
      "Ask GyanSetu AI",
      "Please type a question or attach a photo first.",
      "💬"
    );

    return;
  }


  thinking = true;

  sendButton.disabled =
    true;

  question.disabled =
    true;


  /*
     Add user's message
  */

  addUserMessage(
    text,
    image
  );


  /*
     Clear composer
  */

  removeImage();

  question.value =
    "";

  question.style.height =
    "42px";


  /*
     Show thinking
  */

  showThinking();


  try{

    /*
       YOUR EXISTING API
    */

    const response =
      await fetch(
        "https://gyan-setu-self.vercel.app/api/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            question:
              text,

            image:
              image || null,

            imageType:
              imageType || null

          })
        }
      );


    let data;


    try{

      data =
        await response.json();

    }catch(error){

      throw new Error(
        "Invalid server response"
      );

    }


    if(!response.ok){

      throw new Error(
        data.error ||
        "AI request failed"
      );

    }


    const answer =
      data.answer;


    if(!answer){

  throw new Error(
    "No answer received"
  );

}


addAIMessage(
  answer
);

}catch(error){

console.error(
  "GyanSetu AI Error:",
  error
);


addAIMessage(
  "Sorry, GyanSetu AI could not connect right now. Please try again."
);

}

thinking = false;

sendButton.disabled =
false;

question.disabled =
false;

question.focus();

}

/* =====================================================
COPY ANSWER
===================================================== */

async function copyAnswer(text){

try{

if(
  navigator.clipboard &&
  navigator.clipboard.writeText
){

  await navigator.clipboard.writeText(
    text
  );

}else{

  const temp =
    document.createElement(
      "textarea"
    );

  temp.value =
    text;

  document.body.appendChild(
    temp
  );

  temp.select();

  document.execCommand(
    "copy"
  );

  temp.remove();

}


showPopup(
  "Copied!",
  "AI answer has been copied.",
  "📋"
);

}catch(error){

showPopup(
  "Copy Failed",
  "Could not copy the answer.",
  "⚠️"
);

}

}

/* =====================================================
SPEAK ANSWER
===================================================== */

function speakAnswer(text){

if(
!("speechSynthesis" in window)
){

showPopup(
  "Voice Not Available",
  "Voice playback is not supported on this device.",
  "🔊"
);

return;

}

window.speechSynthesis.cancel();

const speech =
new SpeechSynthesisUtterance(
text
);

speech.lang =
"en-IN";

speech.rate =
0.9;

speech.pitch =
1;

window.speechSynthesis.speak(
speech
);

}

/* =====================================================
VOICE INPUT
===================================================== */

function voiceInput(){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

showPopup(
  "Voice Not Available",
  "Voice input is not supported on this browser.",
  "🎤"
);

return;

}

if(listening){

if(recognition){
  recognition.stop();
}

return;

}

recognition =
new SpeechRecognition();

recognition.lang =
"en-IN";

recognition.interimResults =
false;

recognition.continuous =
false;

listening =
true;

micButton.innerText =
"🔴";

recognition.start();

recognition.onresult =
function(event){

  question.value =
    event.results[0][0].transcript;

  resizeInput();

};

recognition.onerror =
function(){

  showPopup(
    "Voice Input",
    "I couldn't hear you clearly. Please try again.",
    "🎤"
  );

};

recognition.onend =
function(){

  listening =
    false;

  micButton.innerText =
    "🎤";

};

}

/* =====================================================
NEW CHAT
===================================================== */

function newChat(){

const messages =
chat.querySelectorAll(
".message"
);

if(messages.length === 0){

showPopup(
  "New Chat",
  "You are already in a new chat.",
  "✨"
);

return;

}

showPopup(
"Start New Chat?",
"Your current conversation will be cleared.",
"🆕",
function(){

  chat.innerHTML =
    "";

  const newWelcome =
    document.createElement(
      "div"
    );

  newWelcome.className =
    "welcome";

  newWelcome.innerHTML =
    `
      <div class="robot">
        🤖
      </div>

      <h1>
        How can I help you?
      </h1>

      <p>
        Ask your study question, type in Hindi or English,
        or attach a photo of your question.
      </p>
    `;

  chat.appendChild(
    newWelcome
  );

  question.value =
    "";

  question.style.height =
    "42px";

  removeImage();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

);

}

function scrollDown(){

setTimeout(
function(){

  window.scrollTo({

    behavior:"smooth"

80

);

}
