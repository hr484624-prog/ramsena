<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GyanSetu AI Study</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f9ff;
  color:#123;
}

.app{
  max-width:480px;
  margin:auto;
  min-height:100vh;
  background:white;
  display:flex;
  flex-direction:column;
}

/* HEADER */

.header{
  height:65px;
  background:white;
  border-bottom:1px solid #e3edf7;
  display:flex;
  align-items:center;
  padding:0 14px;
  gap:12px;
  position:sticky;
  top:0;
  z-index:10;
}

.back-btn,
.new-chat-btn{
  border:none;
  background:#eef6ff;
  color:#087cff;
  width:40px;
  height:40px;
  border-radius:12px;
  font-size:20px;
  cursor:pointer;
}

.logo{
  flex:1;
}

.logo h2{
  color:#087cff;
  font-size:20px;
}

.logo p{
  font-size:11px;
  color:#777;
}

.online{
  font-size:11px;
  color:#168a3a;
}

/* CHAT */

.chat-area{
  flex:1;
  padding:18px 14px 100px;
  overflow-y:auto;
}

.welcome{
  text-align:center;
  padding:35px 10px 25px;
}

.robot{
  width:80px;
  height:80px;
  background:#eaf4ff;
  border-radius:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
  margin:0 auto 15px;
}

.welcome h1{
  color:#087cff;
  font-size:25px;
  margin-bottom:8px;
}

.welcome p{
  color:#777;
  font-size:14px;
  line-height:1.5;
}

/* MESSAGES */

.message{
  display:flex;
  margin:14px 0;
}

.message.user{
  justify-content:flex-end;
}

.message.ai{
  justify-content:flex-start;
}

.bubble{
  max-width:85%;
  padding:12px 14px;
  border-radius:17px;
  font-size:14px;
  line-height:1.5;
  white-space:pre-wrap;
}

.user .bubble{
  background:#087cff;
  color:white;
  border-bottom-right-radius:5px;
}

.ai .bubble{
  background:#eef6ff;
  color:#123;
  border-bottom-left-radius:5px;
}

.copy-btn,
.speak-btn{
  border:none;
  background:transparent;
  color:#087cff;
  font-size:12px;
  margin-top:6px;
  cursor:pointer;
}

/* IMAGE */

.image-preview{
  display:none;
  position:relative;
  margin:8px 0;
}

.image-preview img{
  max-width:120px;
  max-height:120px;
  border-radius:12px;
  border:1px solid #dbeaff;
}

.remove-image{
  position:absolute;
  top:-7px;
  left:105px;
  width:25px;
  height:25px;
  border:none;
  border-radius:50%;
  background:#ff4444;
  color:white;
  cursor:pointer;
}

/* COMPOSER */

.composer-wrap{
  position:fixed;
  bottom:58px;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:480px;
  background:white;
  border-top:1px solid #e5eef8;
  padding:8px 10px;
  z-index:20;
}

.composer{
  display:flex;
  align-items:flex-end;
  gap:7px;
  background:#f3f8ff;
  border:1px solid #dcecff;
  border-radius:18px;
  padding:7px;
}

.icon-btn{
  width:38px;
  height:38px;
  border:none;
  border-radius:12px;
  background:white;
  color:#087cff;
  font-size:19px;
  cursor:pointer;
  flex-shrink:0;
}

textarea{
  flex:1;
  border:none;
  outline:none;
  resize:none;
  background:transparent;
  min-height:38px;
  max-height:100px;
  font-size:14px;
  padding:10px 5px;
}

.send-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:13px;
  background:#087cff;
  color:white;
  font-size:19px;
  cursor:pointer;
}

.send-btn:disabled{
  opacity:.5;
}

/* THINKING */

.thinking{
  display:none;
  align-items:center;
  gap:6px;
  color:#087cff;
  font-size:13px;
  margin:10px;
}

.dot{
  width:7px;
  height:7px;
  background:#087cff;
  border-radius:50%;
  animation:blink 1s infinite;
}

.dot:nth-child(2){
  animation-delay:.2s;
}

.dot:nth-child(3){
  animation-delay:.4s;
}

@keyframes blink{
  0%,100%{opacity:.2}
  50%{opacity:1}
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:480px;
  height:58px;
  background:white;
  border-top:1px solid #e5eef8;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:30;
}

.nav-item{
  border:none;
  background:transparent;
  color:#777;
  font-size:11px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
}

.nav-item span{
  font-size:20px;
}

.nav-item.active{
  color:#087cff;
}

/* POPUP */

.popup{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.popup-box{
  background:white;
  width:100%;
  max-width:400px;
  border-radius:20px;
  padding:22px;
  text-align:center;
}

.popup-box h3{
  color:#087cff;
  margin-bottom:10px;
}

.popup-box p{
  color:#666;
  font-size:14px;
  margin-bottom:18px;
}

.popup-btn{
  width:100%;
  border:none;
  background:#087cff;
  color:white;
  padding:12px;
  border-radius:12px;
  margin-top:8px;
  font-size:14px;
  cursor:pointer;
}

.close-btn{
  background:#eef6ff;
  color:#087cff;
}

/* HIDDEN */

.hidden{
  display:none !important;
}

</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <div class="header">

    <button
      class="back-btn"
      onclick="goHome()">
      ←
    </button>

    <div class="logo">
      <h2>🤖 GyanSetu AI</h2>
      <p>AI Study Assistant</p>
    </div>

    <div class="online">
      ● Online
    </div>

    <button
      class="new-chat-btn"
      onclick="newChat()">
      ✨
    </button>

  </div>


  <!-- CHAT AREA -->

  <div
    class="chat-area"
    id="chatArea">

    <div
      class="welcome"
      id="welcome">

      <div class="robot">
        🤖
      </div>

      <h1>GyanSetu AI</h1>

      <p>
        अभ्यास, प्रश्न, गणित, विज्ञान किंवा
        कोणत्याही study topic बद्दल प्रश्न विचारा.
      </p>

    </div>

    <div
      class="thinking"
      id="thinking">

      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>

      <span>AI विचार करत आहे...</span>

    </div>

  </div>


  <!-- IMAGE PREVIEW -->

  <div
    class="image-preview"
    id="imagePreview">

    <img
      id="previewImg"
      alt="Selected image">

    <button
      class="remove-image"
      onclick="removeImage()">
      ×
    </button>

  </div>


  <!-- COMPOSER -->

  <div class="composer-wrap">

    <div class="composer">

      <button
        class="icon-btn"
        onclick="selectImage()">
        🖼️
      </button>

      <input
        type="file"
        id="imageInput"
        accept="image/*"
        hidden
        onchange="handleImage(event)">

      <textarea
        id="question"
        placeholder="तुमचा प्रश्न विचारा..."
        rows="1"
        onkeydown="handleEnter(event)"></textarea>

      <button
        class="icon-btn"
        id="micBtn"
        onclick="startVoice()">
        🎙️
      </button>

      <button
        class="send-btn"
        id="sendBtn"
        onclick="askAI()">
        ➤
      </button>

    </div>

  </div>


  <!-- BOTTOM NAV -->

  <div class="bottom-nav">

    <button
      class="nav-item"
      onclick="goHome()">

      <span>🏠</span>
      Home

    </button>

    <button
      class="nav-item"
      onclick="goLearn()">

      <span>📚</span>
      Learn

    </button>

    <button
      class="nav-item active">

      <span>🤖</span>
      AI

    </button>

    <button
      class="nav-item"
      onclick="goRank()">

      <span>🏆</span>
      Rank

    </button>

    <button
      class="nav-item"
      onclick="goProfile()">

      <span>👤</span>
      Profile

    </button>

  </div>

</div>


<!-- POPUP -->

<div
  class="popup"
  id="messagePopup">

  <div class="popup-box">

    <h3 id="popupTitle">
      GyanSetu
    </h3>

    <p id="popupText"></p>

    <button
      class="popup-btn close-btn"
      onclick="closePopup()">
      OK
    </button>

  </div>

</div>


<script>

/* =========================
   VARIABLES
========================= */

let selectedImage=null;
let selectedImageType=null;
let thinking=false;


/* =========================
   HELPER
========================= */

function $(id){
  return document.getElementById(id);
}


/* =========================
   POPUP
========================= */

function showMessage(title,text){

  $("popupTitle").textContent=title;
  $("popupText").textContent=text;

  $("messagePopup").style.display="flex";

}

function closePopup(){

  $("messagePopup").style.display="none";

}


/* =========================
   IMAGE SELECT
========================= */

function selectImage(){

  $("imageInput").click();

}


function handleImage(event){

  const file=event.target.files[0];

  if(!file){
    return;
  }

  if(file.size>8*1024*1024){

    showMessage(
      "Image मोठी आहे",
      "कृपया 8MB पेक्षा कमी image निवडा."
    );

    $("imageInput").value="";
    return;

  }

  selectedImageType=file.type;

  const reader=new FileReader();

  reader.onload=function(e){

    selectedImage=e.target.result;

    $("previewImg").src=selectedImage;

    $("imagePreview").style.display="block";

  };

  reader.readAsDataURL(file);

}


function removeImage(){

  selectedImage=null;
  selectedImageType=null;

  $("imageInput").value="";

  $("imagePreview").style.display="none";

  $("previewImg").src="";

}


/* =========================
   ADD USER MESSAGE
========================= */

function addUserMessage(text,image){

  const message=document.createElement("div");

  message.className="message user";

  let html="";

  if(image){

    html+=`
      <img
        src="${image}"
        style="
          max-width:180px;
          max-height:180px;
          border-radius:12px;
          display:block;
          margin-bottom:7px;
        ">
    `;

  }

  if(text){

    html+=text;

  }

  message.innerHTML=`
    <div class="bubble">
      ${html}
    </div>
  `;

  $("chatArea").insertBefore(
    message,
    $("thinking")
  );

}


/* =========================
   ADD AI MESSAGE
========================= */

function addAIMessage(text){

  const message=document.createElement("div");

  message.className="message ai";

  message.innerHTML=`

    <div>

      <div class="bubble">
        ${escapeHTML(text)}
      </div>

      <button
        class="copy-btn"
        onclick="copyAnswer(this)">
        📋 Copy
      </button>

      <button
        class="speak-btn"
        onclick="speakAnswer(this)">
        🔊 Listen
      </button>

    </div>

  `;

  $("chatArea").insertBefore(
    message,
    $("thinking")
  );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text){

  const div=document.createElement("div");

  div.textContent=text;

  return div.innerHTML
    .replace(/\n/g,"<br>");

}


/* =========================
   COPY
========================= */

function copyAnswer(button){

  const bubble=button
    .parentElement
    .querySelector(".bubble");

  const text=bubble.innerText;

  navigator.clipboard
    .writeText(text)
    .then(function(){

      button.textContent="✅ Copied";

      setTimeout(function(){

        button.textContent="📋 Copy";

      },1500);

    });

}


/* =========================
   SPEAK
========================= */

function speakAnswer(button){

  const bubble=button
    .parentElement
    .querySelector(".bubble");

  const text=bubble.innerText;

  if(!("speechSynthesis" in window)){

    showMessage(
      "Voice unavailable",
      "या device/browser मध्ये voice support उपलब्ध नाही."
    );

    return;

  }

  speechSynthesis.cancel();

  const speech=new SpeechSynthesisUtterance(text);

  speech.lang="mr-IN";
  speech.rate=.95;

  speechSynthesis.speak(speech);

}


/* =========================
   VOICE INPUT
========================= */

function startVoice(){

  const SpeechRecognition=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    showMessage(
      "Voice unavailable",
      "तुमच्या browser मध्ये voice input support नाही."
    );

    return;

  }

  const recognition=
    new SpeechRecognition();

  recognition.lang="mr-IN";
  recognition.interimResults=false;
  recognition.continuous=false;

  $("micBtn").textContent="🔴";

  recognition.onresult=function(event){

    const text=
      event.results[0][0].transcript;

    $("question").value+=
      ($("question").value ? " " : "")+
      text;

  };

  recognition.onerror=function(){

    showMessage(
      "Voice error",
      "Voice input सुरू करता आले नाही."
    );

  };

  recognition.onend=function(){

    $("micBtn").textContent="🎙️";

  };

  recognition.start();

}


/* =========================
   ENTER
========================= */

function handleEnter(event){

  if(event.key==="Enter" && !event.shiftKey){

    event.preventDefault();

    askAI();

  }

}


/* =========================
   ASK AI
========================= */

async function askAI(){

  if(thinking){
    return;
  }

  const question=
    $("question").value.trim();

  if(!question && !selectedImage){

    showMessage(
      "प्रश्न लिहा",
      "कृपया तुमचा प्रश्न किंवा image पाठवा."
    );

    return;

  }

  thinking=true;

  $("sendBtn").disabled=true;

  $("welcome").style.display="none";

  addUserMessage(
    question,
    selectedImage
  );

  $("question").value="";

  const imageToSend=selectedImage;
  const imageTypeToSend=selectedImageType;

  removeImage();

  $("thinking").style.display="flex";

  $("chatArea").scrollTop=
    $("chatArea").scrollHeight;


  try{

    const response=await fetch(
      "https://gyan-setu-self.vercel.app/api/chat",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({

          question:question,

          image:imageToSend,

          imageType:imageTypeToSend

        })

      }
    );


    if(!response.ok){

      throw new Error(
        "API error: "+response.status
      );

    }


    const data=
      await response.json();


    let answer=
      data.answer ||
      data.message ||
      data.response ||
      data.text;


    if(!answer){

      answer=
        "AI कडून उत्तर मिळाले नाही.";
    }


    addAIMessage(answer);

  }
  catch(error){

    console.error(error);

    addAIMessage(
      "⚠️ AI शी connect होता आले नाही. Internet connection तपासा आणि पुन्हा प्रयत्न करा."
    );

  }
  finally{

    thinking=false;

    $("sendBtn").disabled=false;

    $("thinking").style.display="none";

    $("chatArea").scrollTop=
      $("chatArea").scrollHeight;

  }

}


/* =========================
   NEW CHAT
========================= */

function newChat(){

  $("chatArea")
    .querySelectorAll(".message")
    .forEach(function(item){

      item.remove();

    });

  $("welcome").style.display="block";

  $("question").value="";

  removeImage();

  speechSynthesis.cancel();

}


/* =========================
   NAVIGATION
========================= */

function goHome(){

  window.location.href="home.html";

}

function goLearn(){

  window.location.href="learn.html";

}

function goRank(){

  window.location.href="leaderboard.html";

}

function goProfile(){

  window.location.href="profile.html";

}


/* =========================
   AUTO TEXTAREA HEIGHT
========================= */

$("question").addEventListener(
  "input",
  function(){

    this.style.height="auto";

    this.style.height=
      Math.min(this.scrollHeight,100)+"px";

  }
);


/* =========================
   POPUP CLOSE
========================= */

$("messagePopup").addEventListener(
  "click",
  function(event){

    if(event.target===this){

      closePopup();

    }

  }
);

</script>

</body>
</html>
