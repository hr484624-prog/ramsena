<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GyanSetu - AI Study</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f9fc;
  color:#17213f;
}

button,
textarea{
  font-family:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  margin:auto;
  background:#fff;
  position:relative;
  padding-bottom:82px;
}

/* ================= HEADER ================= */

.header{
  height:64px;
  background:#fff;
  border-bottom:1px solid #edf0f5;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  position:sticky;
  top:0;
  z-index:50;
}

.header-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.back-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  background:#f3f6fb;
  color:#17213f;
  font-size:28px;
  line-height:40px;
  cursor:pointer;
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
}

.brand-icon{
  width:38px;
  height:38px;
  border-radius:12px;
  background:linear-gradient(135deg,#2457ff,#4d8dff);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:21px;
  box-shadow:0 5px 14px rgba(36,87,255,.22);
}

.brand-text{
  display:flex;
  flex-direction:column;
}

.brand-name{
  font-size:15px;
  font-weight:800;
}

.brand-status{
  font-size:10px;
  color:#20a464;
  margin-top:2px;
}

.header-actions{
  display:flex;
  gap:7px;
}

.header-btn{
  width:38px;
  height:38px;
  border:0;
  border-radius:11px;
  background:#f4f6fa;
  cursor:pointer;
  font-size:18px;
}

/* ================= CHAT AREA ================= */

.chat-area{
  min-height:calc(100vh - 146px);
  padding:22px 15px 18px;
  background:
    radial-gradient(circle at 50% 0%,#eef4ff 0,#fff 34%);
}

.welcome{
  text-align:center;
  padding:34px 8px 28px;
}

.welcome-logo{
  width:72px;
  height:72px;
  margin:0 auto 16px;
  border-radius:23px;
  background:linear-gradient(135deg,#2457ff,#70a1ff);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:37px;
  box-shadow:0 12px 28px rgba(36,87,255,.22);
}

.welcome h1{
  font-size:25px;
  font-weight:800;
  color:#17213f;
}

.welcome p{
  max-width:310px;
  margin:9px auto 0;
  color:#7b8497;
  font-size:13px;
  line-height:1.55;
}

/* ================= MESSAGE ================= */

.message{
  width:100%;
  display:flex;
  margin:18px 0;
  animation:messageIn .25s ease;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(7px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.message.user{
  justify-content:flex-end;
}

.message.ai{
  justify-content:flex-start;
}

.message-inner{
  max-width:88%;
}

.message.user .message-inner{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
}

.avatar{
  width:30px;
  height:30px;
  flex:0 0 30px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  margin-bottom:6px;
}

.ai-avatar{
  background:#edf3ff;
  color:#2457ff;
}

.user-avatar{
  background:#17213f;
  color:white;
}

.bubble{
  padding:12px 14px;
  border-radius:17px;
  font-size:14px;
  line-height:1.6;
  word-wrap:break-word;
}

.user-bubble{
  background:#2457ff;
  color:white;
  border-bottom-right-radius:5px;
}

.ai-bubble{
  background:#f2f5fa;
  color:#27324d;
  border-bottom-left-radius:5px;
}

.message-time{
  color:#9aa2b2;
  font-size:9px;
  margin-top:5px;
}

/* ================= PHOTO IN MESSAGE ================= */

.message-photo{
  display:block;
  max-width:220px;
  max-height:230px;
  object-fit:cover;
  border-radius:14px;
  margin-bottom:8px;
}

/* ================= AI ACTIONS ================= */

.ai-actions{
  display:flex;
  gap:7px;
  margin-top:7px;
}

.ai-action{
  border:1px solid #e2e7f0;
  background:white;
  color:#687188;
  border-radius:9px;
  padding:6px 9px;
  font-size:10px;
  cursor:pointer;
}

.ai-action:active{
  transform:scale(.96);
}

/* ================= THINKING ================= */

.thinking-bubble{
  background:#f2f5fa;
  border-radius:17px;
  border-bottom-left-radius:5px;
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:5px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#6c7890;
  animation:bounce 1.1s infinite;
}

.dot:nth-child(2){
  animation-delay:.15s;
}

.dot:nth-child(3){
  animation-delay:.30s;
}

@keyframes bounce{
  0%,60%,100%{
    transform:translateY(0);
    opacity:.45;
  }
  30%{
    transform:translateY(-5px);
    opacity:1;
  }
}

/* ================= COMPOSER ================= */

.composer-wrap{
  position:fixed;
  left:50%;
  bottom:68px;
  transform:translateX(-50%);
  width:100%;
  max-width:480px;
  padding:8px 12px 10px;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);
  border-top:1px solid #edf0f5;
  z-index:40;
}

.composer{
  border:1.5px solid #dfe5ee;
  border-radius:19px;
  background:#fff;
  box-shadow:0 5px 20px rgba(25,43,75,.08);
  overflow:hidden;
}

.photo-preview{
  display:none;
  padding:9px;
  border-bottom:1px solid #edf0f5;
}

.preview-box{
  position:relative;
  width:70px;
  height:70px;
}

.preview-img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:12px;
  border:1px solid #e0e5ed;
}

.remove-photo{
  position:absolute;
  top:-6px;
  right:-6px;
  width:22px;
  height:22px;
  border:2px solid white;
  border-radius:50%;
  background:#17213f;
  color:white;
  font-size:12px;
  cursor:pointer;
}

.input-row{
  display:flex;
  align-items:flex-end;
  padding:8px;
  gap:6px;
}

#question{
  flex:1;
  border:0;
  outline:0;
  resize:none;
  min-height:42px;
  max-height:130px;
  padding:11px 8px;
  font-size:14px;
  line-height:1.4;
  color:#17213f;
  background:transparent;
}

#question::placeholder{
  color:#9aa2b2;
}

.tool-btn{
  width:39px;
  height:39px;
  flex:0 0 39px;
  border:0;
  border-radius:12px;
  background:#f1f4f9;
  cursor:pointer;
  font-size:18px;
}

.send-btn{
  width:42px;
  height:42px;
  flex:0 0 42px;
  border:0;
  border-radius:13px;
  background:#2457ff;
  color:white;
  cursor:pointer;
  font-size:18px;
  box-shadow:0 5px 14px rgba(36,87,255,.25);
}

.send-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
  box-shadow:none;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:480px;
  height:68px;
  background:white;
  border-top:1px solid #e9edf3;
  display:flex;
  align-items:center;
  justify-content:space-around;
  z-index:60;
}

.nav-item{
  min-width:55px;
  text-align:center;
  color:#8991a2;
  font-size:10px;
  cursor:pointer;
}

.nav-icon{
  display:block;
  font-size:21px;
  margin-bottom:3px;
}

.nav-item.active{
  color:#2457ff;
  font-weight:700;
}

/* ================= POPUP ================= */

.popup-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(12,22,43,.38);
  backdrop-filter:blur(4px);
  z-index:100;
  align-items:flex-end;
  justify-content:center;
}

.popup{
  width:100%;
  max-width:480px;
  background:white;
  border-radius:25px 25px 0 0;
  padding:23px 20px 25px;
  box-shadow:0 -10px 35px rgba(0,0,0,.15);
  animation:popupIn .25s ease;
}

@keyframes popupIn{
  from{
    transform:translateY(100%);
  }
  to{
    transform:translateY(0);
  }
}

.popup-icon{
  width:48px;
  height:48px;
  border-radius:15px;
  background:#edf3ff;
  color:#2457ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  margin-bottom:12px;
}

.popup h3{
  font-size:18px;
  color:#17213f;
}

.popup p{
  color:#7b8497;
  font-size:13px;
  line-height:1.5;
  margin-top:6px;
}

.popup-buttons{
  display:flex;
  gap:9px;
  margin-top:18px;
}

.popup-btn{
  flex:1;
  height:46px;
  border:0;
  border-radius:13px;
  font-weight:700;
  cursor:pointer;
}

.popup-cancel{
  background:#f0f3f7;
  color:#4e586c;
}

.popup-ok{
  background:#2457ff;
  color:white;
}

/* ================= FILE INPUT ================= */

#imageInput{
  display:none;
}

/* ================= RESPONSIVE ================= */

@media(max-width:430px){

  .chat-area{
    padding-left:12px;
    padding-right:12px;
  }

  .message-inner{
    max-width:91%;
  }

  .welcome{
    padding-top:27px;
  }

}

</style>
</head>

<body>

<div class="app">

<!-- HEADER -->

<div class="header">

  <div class="header-left">

    <button class="back-btn" onclick="goHome()">‹</button>

    <div class="brand">

      <div class="brand-icon">🤖</div>

      <div class="brand-text">
        <div class="brand-name">GyanSetu AI</div>
        <div class="brand-status">● Online</div>
      </div>

    </div>

  </div>

  <div class="header-actions">

    <button
      class="header-btn"
      onclick="newChat()"
      title="New Chat"
    >＋</button>

  </div>

</div>


<!-- CHAT -->

<div class="chat-area" id="chatArea">

  <div class="welcome" id="welcome">

    <div class="welcome-logo">
      🤖
    </div>

    <h1>How can I help you?</h1>

    <p>
      Ask anything about your studies.
      You can also send a photo of a question.
    </p>

  </div>

</div>


<!-- COMPOSER -->

<div class="composer-wrap">

  <div class="composer">

    <div
      class="photo-preview"
      id="photoPreview"
    >

      <div class="preview-box">

        <img
          id="previewImg"
          class="preview-img"
          alt="Selected image"
        >

        <button
          class="remove-photo"
          onclick="removePhoto()"
        >×</button>

      </div>

    </div>


    <div class="input-row">

      <button
        class="tool-btn"
        onclick="openImagePicker()"
        title="Attach photo"
      >
        ＋
      </button>

      <textarea
        id="question"
        rows="1"
        placeholder="Message GyanSetu AI..."
        oninput="autoResize(this)"
        onkeydown="handleEnter(event)"
      ></textarea>

      <button
        class="tool-btn"
        id="micBtn"
        onclick="startVoiceInput()"
        title="Voice"
      >
        🎤
      </button>

      <button
        class="send-btn"
        id="sendBtn"
        onclick="askAI()"
      >
        ➤
      </button>

    </div>

  </div>

</div>


<!-- HIDDEN IMAGE INPUT -->

<input
  type="file"
  id="imageInput"
  accept="image/*"
  onchange="handleImage(event)"
>


<!-- BOTTOM NAV -->

<div class="bottom-nav">

  <div
    class="nav-item"
    onclick="goHome()"
  >
    <span class="nav-icon">🏠</span>
    Home
  </div>

  <div
    class="nav-item"
    onclick="goLearn()"
  >
    <span class="nav-icon">📚</span>
    Learn
  </div>

  <div class="nav-item active">
    <span class="nav-icon">🤖</span>
    AI
  </div>

  <div
    class="nav-item"
    onclick="goRank()"
  >
    <span class="nav-icon">🏆</span>
    Rank
  </div>

  <div
    class="nav-item"
    onclick="goProfile()"
  >
    <span class="nav-icon">👤</span>
    Profile
  </div>

</div>


<!-- POPUP -->

<div
  class="popup-overlay"
  id="popupOverlay"
  onclick="closePopupOutside(event)"
>

  <div class="popup">

    <div
      class="popup-icon"
      id="popupIcon"
    >
      ℹ️
    </div>

    <h3 id="popupTitle">
      GyanSetu AI
    </h3>

    <p id="popupMessage">
      Message
    </p>

    <div class="popup-buttons">

      <button
        class="popup-btn popup-cancel"
        onclick="closePopup()"
      >
        Cancel
      </button>

      <button
        class="popup-btn popup-ok"
        id="popupOk"
        onclick="popupAction()"
      >
        OK
      </button>

    </div>

  </div>

  </div>
  <script>

/* =====================================================
   GYANSETU AI STATE
===================================================== */

let selectedImage = null;
let selectedImageType = null;

let isThinking = false;

let popupCallback = null;


/* =====================================================
   ELEMENTS
===================================================== */

const questionInput =
  document.getElementById("question");

const chatArea =
  document.getElementById("chatArea");

const welcome =
  document.getElementById("welcome");

const sendBtn =
  document.getElementById("sendBtn");

const imageInput =
  document.getElementById("imageInput");

const photoPreview =
  document.getElementById("photoPreview");

const previewImg =
  document.getElementById("previewImg");


/* =====================================================
   CUSTOM POPUP
===================================================== */

function showPopup(
  title,
  message,
  icon = "ℹ️",
  callback = null
){

  document.getElementById("popupTitle")
    .innerText = title;

  document.getElementById("popupMessage")
    .innerText = message;

  document.getElementById("popupIcon")
    .innerText = icon;

  popupCallback = callback;

  document.getElementById("popupOverlay")
    .style.display = "flex";
}


function closePopup(){

  document.getElementById("popupOverlay")
    .style.display = "none";

  popupCallback = null;
}


function popupAction(){

  if(typeof popupCallback === "function"){
    const callback = popupCallback;
    popupCallback = null;
    closePopup();
    callback();
  }else{
    closePopup();
  }

}


function closePopupOutside(event){

  if(event.target.id === "popupOverlay"){
    closePopup();
  }

}


/* =====================================================
   IMAGE PICKER
===================================================== */

function openImagePicker(){

  imageInput.click();

}


function handleImage(event){

  const file =
    event.target.files[0];

  if(!file){
    return;
  }

  if(!file.type.startsWith("image/")){

    showPopup(
      "Invalid File",
      "Please select an image file.",
      "🖼️"
    );

    imageInput.value = "";
    return;
  }

  if(file.size > 8 * 1024 * 1024){

    showPopup(
      "Image Too Large",
      "Please select an image smaller than 8 MB.",
      "📦"
    );

    imageInput.value = "";
    return;
  }

  selectedImageType = file.type;

  const reader =
    new FileReader();

  reader.onload = function(e){

    selectedImage =
      e.target.result;

    previewImg.src =
      selectedImage;

    photoPreview.style.display =
      "block";

  };

  reader.readAsDataURL(file);

}


function removePhoto(){

  selectedImage = null;
  selectedImageType = null;

  previewImg.removeAttribute("src");

  photoPreview.style.display =
    "none";

  imageInput.value = "";

}


/* =====================================================
   TEXTAREA AUTO RESIZE
===================================================== */

function autoResize(element){

  element.style.height = "auto";

  element.style.height =
    Math.min(element.scrollHeight,130) + "px";

}


/* =====================================================
   ENTER TO SEND
===================================================== */

function handleEnter(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    askAI();

  }

}


/* =====================================================
   TIME
===================================================== */

function getTime(){

  const now = new Date();

  return now.toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =====================================================
   ADD USER MESSAGE
===================================================== */

function addUserMessage(
  text,
  image = null
){

  if(welcome){
    welcome.style.display = "none";
  }

  const message =
    document.createElement("div");

  message.className =
    "message user";

  const inner =
    document.createElement("div");

  inner.className =
    "message-inner";

  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar user-avatar";

  avatar.innerText =
    "👤";

  inner.appendChild(avatar);


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble user-bubble";


  if(image){

    const img =
      document.createElement("img");

    img.className =
      "message-photo";

    img.src =
      image;

    bubble.appendChild(img);

  }


  if(text){

    const textNode =
      document.createElement("div");

    textNode.innerText =
      text;

    bubble.appendChild(textNode);

  }


  inner.appendChild(bubble);


  const time =
    document.createElement("div");

  time.className =
    "message-time";

  time.innerText =
    getTime();

  inner.appendChild(time);


  message.appendChild(inner);

  chatArea.appendChild(message);

  scrollToBottom();

}


/* =====================================================
   ADD THINKING
===================================================== */

function showThinking(){

  removeThinking();

  const message =
    document.createElement("div");

  message.className =
    "message ai";

  message.id =
    "thinkingMessage";

  const inner =
    document.createElement("div");

  inner.className =
    "message-inner";

  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar ai-avatar";

  avatar.innerText =
    "🤖";

  inner.appendChild(avatar);


  const bubble =
    document.createElement("div");

  bubble.className =
    "thinking-bubble";

  bubble.innerHTML =
    `
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    `;

  inner.appendChild(bubble);

  message.appendChild(inner);

  chatArea.appendChild(message);

  scrollToBottom();

}


function removeThinking(){

  const old =
    document.getElementById(
      "thinkingMessage"
    );

  if(old){
    old.remove();
  }

}


/* =====================================================
   ADD AI MESSAGE
===================================================== */

function addAIMessage(text){

  removeThinking();

  const message =
    document.createElement("div");

  message.className =
    "message ai";

  const inner =
    document.createElement("div");

  inner.className =
    "message-inner";

  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar ai-avatar";

  avatar.innerText =
    "🤖";

  inner.appendChild(avatar);


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble ai-bubble";

  bubble.innerText =
    text || "No answer received.";

  inner.appendChild(bubble);


  const actions =
    document.createElement("div");

  actions.className =
    "ai-actions";


  const copyBtn =
    document.createElement("button");

  copyBtn.className =
    "ai-action";

  copyBtn.innerText =
    "📋 Copy";

  copyBtn.onclick =
    function(){
      copyText(text);
    };


  const listenBtn =
    document.createElement("button");

  listenBtn.className =
    "ai-action";

  listenBtn.innerText =
    "🔊 Listen";

  listenBtn.onclick =
    function(){
      speakText(text);
    };


  actions.appendChild(copyBtn);
  actions.appendChild(listenBtn);

  inner.appendChild(actions);


  const time =
    document.createElement("div");

  time.className =
    "message-time";

  time.innerText =
    getTime();

  inner.appendChild(time);


  message.appendChild(inner);

  chatArea.appendChild(message);

  scrollToBottom();

}


/* =====================================================
   SCROLL
===================================================== */

function scrollToBottom(){

  setTimeout(function(){

    window.scrollTo({
      top:document.body.scrollHeight,
      behavior:"smooth"
    });

  },50);

}


/* =====================================================
   ASK AI
===================================================== */

async function askAI(){

  if(isThinking){
    return;
  }

  const question =
    questionInput.value.trim();

  const imageToSend =
    selectedImage;

  const imageTypeToSend =
    selectedImageType;


  if(!question && !imageToSend){

    showPopup(
      "Ask GyanSetu AI",
      "Type a question or attach a photo first.",
      "💬"
    );

    return;
  }


  isThinking = true;

  sendBtn.disabled = true;

  questionInput.disabled = true;


  addUserMessage(
    question,
    imageToSend
  );


  showThinking();


  /*
     IMPORTANT:
     Copy image values BEFORE clearing
     the composer.
  */

  removePhoto();

  questionInput.value = "";

  questionInput.style.height =
    "42px";


  try{

    const response =
      await fetch(
        "https://gyan-setu-self.vercel.app/api/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            question:
              question,

            image:
              imageToSend || null,

            imageType:
              imageTypeToSend || null

          })

        }
      );


    let data = {};

    try{
      data =
        await response.json();
    }catch(e){
      data = {};
    }


    if(!response.ok){

      throw new Error(
        data.error ||
        "AI request failed"
      );

    }


    const answer =
      data.answer ||
      "Sorry, I could not generate an answer.";


    addAIMessage(answer);


  }catch(error){

    console.error(error);

    removeThinking();

    addAIMessage(
      "❌ GyanSetu AI could not connect right now. Please try again."
    );

  }finally{

    isThinking = false;

    sendBtn.disabled = false;

    questionInput.disabled = false;

    questionInput.focus();

  }

}


/* =====================================================
   COPY
===================================================== */

async function copyText(text){

  if(!text){
    return;
  }

  try{

    await navigator.clipboard.writeText(text);

    showPopup(
      "Copied",
      "AI answer copied to clipboard.",
      "📋"
    );

  }catch(error){

    showPopup(
      "Copy Failed",
      "Your device did not allow copying.",
      "⚠️"
    );

  }

}


/* =====================================================
   TEXT TO SPEECH
===================================================== */

function speakText(text){

  if(
    !("speechSynthesis" in window)
  ){

    showPopup(
      "Voice Not Supported",
      "Voice playback is not supported on this device.",
      "🔊"
    );

    return;
  }


  if(!text){
    return;
  }


  window.speechSynthesis.cancel();


  const speech =
    new SpeechSynthesisUtterance(text);

  speech.lang =
    "en-IN";

  speech.rate =
    0.9;

  speech.pitch =
    1;


  window.speechSynthesis.speak(
    speech
  );

}
    <script>

/* =====================================================
   VOICE INPUT
===================================================== */

let recognition = null;
let isListening = false;


function startVoiceInput(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    showPopup(
      "Voice Not Supported",
      "Voice input is not supported on this browser/device.",
      "🎤"
    );

    return;
  }


  if(isListening){

    if(recognition){
      recognition.stop();
    }

    return;
  }


  recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-IN";

  recognition.interimResults =
    false;

  recognition.continuous =
    false;


  const micBtn =
    document.getElementById(
      "micBtn"
    );


  isListening = true;

  micBtn.innerText =
    "🔴";


  recognition.start();


  recognition.onresult =
    function(event){

      const text =
        event.results[0][0].transcript;

      questionInput.value =
        text;

      autoResize(questionInput);

    };


  recognition.onerror =
    function(){

      showPopup(
        "Voice Input",
        "I couldn't hear you clearly. Please try again.",
        "🎤"
      );

    };


  recognition.onend =
    function(){

      isListening = false;

      micBtn.innerText =
        "🎤";

    };

}
