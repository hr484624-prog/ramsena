<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>GyanSetu AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#080808;
  color:#fff;
}

button{
  font-family:inherit;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:520px;
  height:100dvh;
  margin:auto;
  position:relative;
  overflow:hidden;
  background:#0b0b0b;
}

/* ================= HEADER ================= */

.header{
  height:62px;
  padding:0 12px;
  display:flex;
  align-items:center;
  gap:10px;
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:20;
  background:rgba(11,11,11,.94);
  border-bottom:1px solid #252525;
  backdrop-filter:blur(18px);
}

.header-btn{
  width:40px;
  height:40px;
  border:1px solid #303030;
  border-radius:12px;
  background:#151515;
  color:#fff;
  font-size:19px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.header-title{
  flex:1;
  min-width:0;
}

.header-title h2{
  font-size:17px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.header-title p{
  color:#8b8b8b;
  font-size:10px;
  margin-top:2px;
}

.status{
  font-size:10px;
  color:#42d392;
  white-space:nowrap;
}

/* ================= CHAT ================= */

.chat{
  position:absolute;
  inset:0;
  padding-top:62px;
  padding-bottom:82px;
  overflow-y:auto;
  scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
  width:3px;
}

.chat::-webkit-scrollbar-thumb{
  background:#333;
  border-radius:10px;
}

/* ================= WELCOME ================= */

.welcome{
  min-height:calc(100dvh - 144px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:30px 22px 80px;
  text-align:center;
}

.ai-logo{
  width:76px;
  height:76px;
  border-radius:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:39px;
  background:
    linear-gradient(145deg,#1d1d1d,#111);
  border:1px solid #333;
  box-shadow:0 15px 45px rgba(0,0,0,.45);
  margin-bottom:20px;
}

.welcome h1{
  font-size:27px;
  font-weight:800;
  letter-spacing:-.5px;
}

.gradient-text{
  background:linear-gradient(90deg,#ff1493,#9b5cff,#168cff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.welcome p{
  color:#999;
  font-size:14px;
  line-height:1.55;
  max-width:330px;
  margin-top:9px;
}

.suggestions{
  width:100%;
  max-width:390px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:28px;
}

.suggestion{
  min-height:65px;
  padding:11px;
  text-align:left;
  border:1px solid #292929;
  border-radius:15px;
  background:#121212;
  color:#ddd;
}

.suggestion strong{
  display:block;
  font-size:12px;
  margin-bottom:4px;
}

.suggestion span{
  color:#777;
  font-size:10px;
}

/* ================= MESSAGES ================= */

.message{
  width:100%;
  padding:12px 15px;
  display:flex;
}

.message.user{
  justify-content:flex-end;
}

.message.ai{
  justify-content:flex-start;
}

.message-inner{
  max-width:88%;
}

.avatar{
  width:29px;
  height:29px;
  border-radius:9px;
  background:#1b1b1b;
  border:1px solid #303030;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  margin-bottom:5px;
}

.user .avatar{
  display:none;
}

.bubble{
  font-size:14px;
  line-height:1.65;
  word-break:break-word;
}

.user .bubble{
  padding:11px 14px;
  border-radius:19px;
  border-bottom-right-radius:5px;
  background:#2b2b2b;
  color:#fff;
}

.ai .bubble{
  color:#ededed;
  padding-right:5px;
}

.ai .bubble h3{
  font-size:17px;
  margin:12px 0 7px;
}

.ai .bubble strong{
  color:#fff;
}

.ai .bubble ul,
.ai .bubble ol{
  margin:7px 0 7px 20px;
}

.ai .bubble li{
  margin:4px 0;
}

/* ================= CODE ================= */

.code-wrap{
  margin:12px 0;
  border:1px solid #303030;
  border-radius:13px;
  overflow:hidden;
  background:#090909;
}

.code-head{
  height:36px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  background:#151515;
  border-bottom:1px solid #292929;
  color:#888;
  font-size:10px;
}

.code-copy{
  border:1px solid #333;
  border-radius:7px;
  background:#202020;
  color:#ddd;
  padding:5px 8px;
  font-size:10px;
}

.code-content{
  padding:12px;
  overflow-x:auto;
  font-family:monospace;
  font-size:12px;
  line-height:1.6;
  color:#ddd;
  white-space:pre;
}

/* ================= MESSAGE ACTIONS ================= */

.actions{
  display:flex;
  gap:4px;
  margin-top:7px;
}

.action-btn{
  border:none;
  background:transparent;
  color:#777;
  padding:5px 7px;
  border-radius:7px;
  font-size:11px;
}

.action-btn:active{
  background:#1d1d1d;
}

/* ================= THINKING ================= */

.thinking{
  display:none;
  padding:12px 15px;
  align-items:flex-start;
}

.thinking-box{
  display:flex;
  align-items:center;
  gap:5px;
  color:#888;
  font-size:12px;
}

.thinking-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#aaa;
  animation:thinking 1.2s infinite;
}

.thinking-dot:nth-child(2){
  animation-delay:.15s;
}

.thinking-dot:nth-child(3){
  animation-delay:.3s;
}

@keyframes thinking{
  0%,100%{
    opacity:.25;
    transform:translateY(0);
  }
  50%{
    opacity:1;
    transform:translateY(-3px);
  }
}

/* ================= IMAGE ================= */

.user-image{
  max-width:220px;
  max-height:220px;
  border-radius:15px;
  display:block;
  margin-bottom:7px;
  border:1px solid #333;
}

.image-preview{
  display:none;
  position:absolute;
  left:10px;
  right:10px;
  bottom:75px;
  z-index:40;
  padding:8px;
  background:#171717;
  border:1px solid #333;
  border-radius:13px;
}

.image-preview img{
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:9px;
}

.remove-image{
  position:absolute;
  top:2px;
  left:67px;
  width:22px;
  height:22px;
  border:0;
  border-radius:50%;
  background:#e63964;
  color:#fff;
}

/* ================= COMPOSER ================= */

.composer-area{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:30;
  padding:8px 10px 10px;
  background:linear-gradient(
    to top,
    #0b0b0b 65%,
    rgba(11,11,11,.92)
  );
}

.composer{
  display:flex;
  align-items:flex-end;
  gap:6px;
  padding:6px;
  border:1px solid #353535;
  background:#151515;
  border-radius:18px;
}

.tool-btn{
  flex:0 0 38px;
  width:38px;
  height:38px;
  border:0;
  border-radius:12px;
  background:#222;
  color:#ddd;
  font-size:18px;
}

.textarea{
  flex:1;
  min-width:0;
  max-height:110px;
  min-height:38px;
  resize:none;
  overflow-y:auto;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-size:14px;
  line-height:1.4;
  padding:10px 4px;
}

.textarea::placeholder{
  color:#777;
}

.send{
  flex:0 0 40px;
  width:40px;
  height:40px;
  border:0;
  border-radius:13px;
  background:#fff;
  color:#000;
  font-size:18px;
}

.send:disabled{
  opacity:.35;
}

/* ================= NEW CHAT MENU ================= */

.side-overlay{
  display:none;
  position:absolute;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.65);
}

.side-panel{
  position:absolute;
  top:0;
  bottom:0;
  left:0;
  width:82%;
  max-width:350px;
  background:#101010;
  border-right:1px solid #303030;
  padding:18px 13px;
  box-shadow:15px 0 45px rgba(0,0,0,.5);
}

.side-top{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:20px;
}

.side-top h3{
  flex:1;
  font-size:18px;
}

.close-side{
  width:36px;
  height:36px;
  border:1px solid #333;
  background:#191919;
  color:#fff;
  border-radius:10px;
}

.new-chat{
  width:100%;
  border:1px solid #333;
  background:#191919;
  color:#fff;
  border-radius:12px;
  padding:12px;
  text-align:left;
  margin-bottom:18px;
}

.history-title{
  color:#777;
  font-size:11px;
  margin-bottom:9px;
}

.history-empty{
  color:#666;
  font-size:12px;
  line-height:1.5;
}

/* ================= POPUP ================= */

.popup{
  display:none;
  position:absolute;
  inset:0;
  z-index:200;
  background:rgba(0,0,0,.72);
  align-items:center;
  justify-content:center;
  padding:20px;
}

.popup-box{
  width:100%;
  max-width:370px;
  background:#171717;
  border:1px solid #333;
  border-radius:18px;
  padding:20px;
}

.popup-box h3{
  font-size:18px;
  margin-bottom:8px;
}

.popup-box p{
  color:#aaa;
  font-size:13px;
  line-height:1.5;
}

.popup-close{
  width:100%;
  margin-top:16px;
  padding:11px;
  border:0;
  border-radius:11px;
  background:#fff;
  color:#000;
}

/* ================= MOBILE ================= */

@media(max-width:380px){
  .suggestions{
    grid-template-columns:1fr;
  }

  .welcome h1{
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">

    <button class="header-btn" onclick="goHome()">←</button>

    <button
      class="header-btn"
      onclick="openHistory()">
      ☰
    </button>

    <div class="header-title">
      <h2>GyanSetu AI</h2>
      <p>AI Study Assistant</p>
    </div>

    <div class="status">● Online</div>

    <button
      class="header-btn"
      onclick="newChat()">
      ＋
    </button>

  </header>


  <!-- CHAT -->
  <main
    class="chat"
    id="chat">

    <!-- WELCOME -->
    <section
      class="welcome"
      id="welcome">

      <div class="ai-logo">🤖</div>

      <h1>
        <span class="gradient-text">
          GyanSetu AI
        </span>
      </h1>

      <p>
        अभ्यास, प्रश्न, गणित, विज्ञान, coding
        किंवा कोणत्याही विषयाबद्दल मला विचारा.
      </p>

      <div class="suggestions">

        <button
          class="suggestion"
          onclick="useSuggestion('मला गणिताचा प्रश्न step by step समजावून सांग')">
          <strong>📐 गणित शिकायचं?</strong>
          <span>Step-by-step solution</span>
        </button>

        <button
          class="suggestion"
          onclick="useSuggestion('मला 10वी बोर्ड परीक्षेची तयारी करून दे')">
          <strong>📚 Board तयारी</strong>
          <span>Exam preparation</span>
        </button>

        <button
          class="suggestion"
          onclick="useSuggestion('हा विषय मला सोप्या मराठीत समजावून सांग')">
          <strong>🧠 Topic समजून घ्या</strong>
          <span>Simple explanation</span>
        </button>

        <button
          class="suggestion"
          onclick="useSuggestion('मला HTML coding शिकव')">
          <strong>💻 Coding</strong>
          <span>Learn & practice</span>
        </button>

      </div>

    </section>


    <!-- THINKING -->
    <div
      class="thinking"
      id="thinking">

      <div class="avatar">🤖</div>

      <div class="thinking-box">
        <span>GyanSetu AI विचार करत आहे</span>
        <div class="thinking-dot"></div>
        <div class="thinking-dot"></div>
        <div class="thinking-dot"></div>
      </div>

    </div>

  </main>


  <!-- IMAGE PREVIEW -->
  <div
    class="image-preview"
    id="imagePreview">

    <img id="previewImg">

    <button
      class="remove-image"
      onclick="removeImage()">
      ×
    </button>

  </div>


  <!-- COMPOSER -->
  <div class="composer-area">

    <div class="composer">

      <button
        class="tool-btn"
        onclick="selectImage()">
        ＋
      </button>

      <input
        type="file"
        id="imageInput"
        accept="image/*"
        hidden
        onchange="handleImage(event)">

      <textarea
        id="question"
        class="textarea"
        rows="1"
        placeholder="GyanSetu AI ला विचारा..."
        onkeydown="handleEnter(event)"></textarea>

      <button
        class="tool-btn"
        id="micBtn"
        onclick="startVoice()">
        🎙️
      </button>

      <button
        class="send"
        id="sendBtn"
        onclick="askAI()">
        ↑
      </button>

    </div>

  </div>


  <!-- SIDE HISTORY -->
  <div
    class="side-overlay"
    id="sideOverlay"
    onclick="closeHistory(event)">

    <aside
      class="side-panel"
      onclick="event.stopPropagation()">

      <div class="side-top">

        <h3>GyanSetu AI</h3>

        <button
          class="close-side"
          onclick="closeHistory()">
          ×
        </button>

      </div>

      <button
        class="new-chat"
        onclick="newChat();closeHistory();">
        ＋ New Chat
      </button>

      <div class="history-title">
        RECENT CHATS
      </div>

      <div
        id="historyList"
        class="history-empty">
        अजून कोणतीही chat history नाही.
      </div>

    </aside>

  </div>


  <!-- POPUP -->
  <div
    class="popup"
    id="popup">

    <div class="popup-box">

      <h3 id="popupTitle">GyanSetu</h3>

      <p id="popupText"></p>

      <button
        class="popup-close"
        onclick="closePopup()">
        OK
      </button>

    </div>

  </div>

</div>


<script>

/* =====================================================
   GYANSETU AI
===================================================== */

const API_URL =
"https://gyan-setu-self.vercel.app/api/chat";

let selectedImage = null;
let selectedImageType = null;
let thinking = false;

let chatMessages = [];


/* =========================
   HELPER
========================= */

function $(id){
  return document.getElementById(id);
}


/* =========================
   POPUP
========================= */

function showPopup(title,text){

  $("popupTitle").textContent = title;
  $("popupText").textContent = text;

  $("popup").style.display = "flex";
}

function closePopup(){

  $("popup").style.display = "none";
}


/* =========================
   HOME
========================= */

function goHome(){

  window.location.href = "home.html";
}


/* =========================
   SUGGESTION
========================= */

function useSuggestion(text){

  $("question").value = text;

  autoResize();

  $("question").focus();

}


/* =========================
   IMAGE
========================= */

function selectImage(){

  $("imageInput").click();

}


function handleImage(event){

  const file = event.target.files[0];

  if(!file) return;

  if(file.size > 8 * 1024 * 1024){

    showPopup(
      "Image मोठी आहे",
      "कृपया 8MB पेक्षा कमी image निवडा."
    );

    $("imageInput").value = "";

    return;
  }

  selectedImageType = file.type;

  const reader = new FileReader();

  reader.onload = function(e){

    selectedImage = e.target.result;

    $("previewImg").src = selectedImage;

    $("imagePreview").style.display = "block";
  };

  reader.readAsDataURL(file);
}


function removeImage(){

  selectedImage = null;
  selectedImageType = null;

  $("imageInput").value = "";

  $("previewImg").src = "";

  $("imagePreview").style.display = "none";
}


/* =========================
   ENTER
========================= */

function handleEnter(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    askAI();
  }
}


/* =========================
   AUTO RESIZE
========================= */

$("question").addEventListener(
  "input",
  autoResize
);

function autoResize(){

  const box = $("question");

  box.style.height = "auto";

  box.style.height =
    Math.min(box.scrollHeight,110) + "px";
}


/* =========================
   ESCAPE
========================= */

function escapeHTML(text){

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


/* =========================
   FORMAT AI TEXT
========================= */

function formatAIText(text){

  if(!text) return "";

  let escaped = escapeHTML(text);

  /*
    Code blocks
  */

  escaped = escaped.replace(
    /```([\w+-]*)\n?([\s\S]*?)```/g,
    function(match,language,code){

      const safeCode =
        code
          .replace(/^\n/,"")
          .replace(/\n$/,"");

      return `
        <div class="code-wrap">

          <div class="code-head">

            <span>${language || "code"}</span>

            <button
              class="code-copy"
              onclick="copyCode(this)">
              Copy
            </button>

          </div>

          <pre class="code-content">${safeCode}</pre>

        </div>
      `;
    }
  );

  /*
    Headings
  */

  escaped = escaped.replace(
    /^### (.*)$/gm,
    "<h3>$1</h3>"
  );

  escaped = escaped.replace(
    /^## (.*)$/gm,
    "<h3>$1</h3>"
  );

  /*
    Bold
  */

  escaped = escaped.replace(
    /\*\*(.*?)\*\*/g,
    "<strong>$1</strong>"
  );

  /*
    Bullet points
  */

  escaped = escaped.replace(
    /^[•*-] (.*)$/gm,
    "• $1"
  );

  /*
    New lines
  */

  escaped = escaped.replace(
    /\n/g,
    "<br>"
  );

  return escaped;
}


/* =========================
   ADD USER
========================= */

function addUserMessage(
  text,
  image
){

  const message =
    document.createElement("div");

  message.className =
    "message user";

  let content = "";

  if(image){

    content += `
      <img
        class="user-image"
        src="${image}">
    `;
  }

  if(text){

    content +=
      escapeHTML(text)
        .replace(/\n/g,"<br>");
  }

  message.innerHTML = `

    <div class="message-inner">

      <div class="bubble">
        ${content}
      </div>

    </div>

  `;

  $("chat").insertBefore(
    message,
    $("thinking")
  );
}


/* =========================
   ADD AI
========================= */

function addAIMessage(text){

  const message =
    document.createElement("div");

  message.className =
    "message ai";

  message.innerHTML = `

    <div class="message-inner">

      <div class="avatar">
        🤖
      </div>

      <div class="bubble">
        ${formatAIText(text)}
      </div>

      <div class="actions">

        <button
          class="action-btn"
          onclick="copyAnswer(this)">
          📋 Copy
        </button>

        <button
          class="action-btn"
          onclick="speakAnswer(this)">
          🔊 Listen
        </button>

        <button
          class="action-btn"
          onclick="regenerate()">
          🔄 Retry
        </button>

      </div>

    </div>

  `;

  $("chat").insertBefore(
    message,
    $("thinking")
  );

  scrollBottom();
}


/* =========================
   COPY ANSWER
========================= */

function copyAnswer(button){

  const bubble =
    button
      .closest(".message-inner")
      .querySelector(".bubble");

  const text =
    bubble.innerText;

  navigator.clipboard
    .writeText(text)
    .then(function(){

      button.textContent =
        "✅ Copied";

      setTimeout(
        function(){
          button.textContent =
            "📋 Copy";
        },
        1500
      );

    });
}


/* =========================
   COPY CODE
========================= */

function copyCode(button){

  const code =
    button
      .closest(".code-wrap")
      .querySelector(".code-content")
      .innerText;

  navigator.clipboard
    .writeText(code)
    .then(function(){

      button.textContent =
        "Copied!";

      setTimeout(
        function(){
          button.textContent =
            "Copy";
        },
        1500
      );

    });
}


/* =========================
   SPEAK
========================= */

function speakAnswer(button){

  const bubble =
    button
      .closest(".message-inner")
      .querySelector(".bubble");

  const text =
    bubble.innerText;

  if(!("speechSynthesis" in window)){

    showPopup(
      "Voice unavailable",
      "या browser मध्ये voice support उपलब्ध नाही."
    );

    return;
  }

  speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(text);

  speech.lang = "mr-IN";

  speech.rate = .95;

  speech.pitch = 1;

  speechSynthesis.speak(speech);
}


/* =========================
   VOICE INPUT
========================= */

function startVoice(){

  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!Recognition){

    showPopup(
      "Voice unavailable",
      "तुमच्या browser मध्ये voice input support उपलब्ध नाही."
    );

    return;
  }

  const recognition =
    new Recognition();

  recognition.lang = "mr-IN";

  recognition.interimResults = false;

  recognition.continuous = false;

  $("micBtn").textContent = "🔴";

  recognition.onresult =
    function(event){

      const text =
        event.results[0][0].transcript;

      $("question").value +=
        (
          $("question").value
            ? " "
            : ""
        ) + text;

      autoResize();
    };

  recognition.onerror =
    function(){

      showPopup(
        "Voice error",
        "Voice input सुरू करता आले नाही."
      );
    };

  recognition.onend =
    function(){

      $("micBtn").textContent =
        "🎙️";
    };

  recognition.start();
}


/* =========================
   ASK AI
========================= */

async function askAI(){

  if(thinking) return;

  const question =
    $("question").value.trim();

  if(
    !question &&
    !selectedImage
  ){

    showPopup(
      "प्रश्न लिहा",
      "कृपया प्रश्न लिहा किंवा image पाठवा."
    );

    return;
  }

  thinking = true;

  $("sendBtn").disabled = true;

  $("welcome").style.display = "none";


  /*
    Save current question
  */

  chatMessages.push({
    role:"user",
    content:question
  });


  /*
    Show user
  */

  addUserMessage(
    question,
    selectedImage
  );


  const imageToSend =
    selectedImage;

  const imageTypeToSend =
    selectedImageType;


  $("question").value = "";

  autoResize();

  removeImage();


  /*
    Thinking
  */

  $("thinking").style.display =
    "flex";

  scrollBottom();


  try{

    const response =
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            question:question,

            image:imageToSend,

            imageType:imageTypeToSend

          })
        }
      );


    if(!response.ok){

      throw new Error(
        "HTTP " + response.status
      );
    }


    const data =
      await response.json();


    const answer =
      data.answer ||
      data.message ||
      data.response ||
      data.text;


    if(!answer){

      throw new Error(
        "Empty AI response"
      );
    }


    chatMessages.push({
      role:"assistant",
      content:answer
    });


    addAIMessage(answer);


    saveHistory();


  }
  catch(error){

    console.error(
      "GyanSetu AI Error:",
      error
    );


    const errorText =
      "⚠️ GyanSetu AI शी connect होता आले नाही. Internet connection तपासा आणि पुन्हा प्रयत्न करा.";


    addAIMessage(
      errorText
    );

  }
  finally{

    thinking = false;

    $("sendBtn").disabled =
      false;

    $("thinking").style.display =
      "none";

    scrollBottom();
  }
}


/* =========================
   SCROLL
========================= */

function scrollBottom(){

  setTimeout(
    function(){

      $("chat").scrollTop =
        $("chat").scrollHeight;

    },
    50
  );
}


/* =========================
   NEW CHAT
========================= */

function newChat(){

  if(thinking) return;

  $("chat")
    .querySelectorAll(
      ".message"
    )
    .forEach(function(item){

      item.remove();
    });


  chatMessages = [];


  $("welcome").style.display =
    "flex";


  $("question").value = "";

  autoResize();

  removeImage();

  speechSynthesis.cancel();

  scrollBottom();
}


/* =========================
   HISTORY
========================= */

function openHistory(){

  $("sideOverlay").style.display =
    "block";

  renderHistory();
}


function closeHistory(event){

  if(
    event &&
    event.target !==
    $("sideOverlay")
  ){
    return;
  }

  $("sideOverlay").style.display =
    "none";
}


function saveHistory(){

  try{

    const history =
      JSON.parse(
        localStorage.getItem(
          "gyansetu_ai_history"
        ) || "[]"
      );


    history.unshift({
      title:
        chatMessages[0]
          ?.content
          ?.slice(0,50) ||
        "New Chat",

      messages:
        chatMessages,

      time:
        Date.now()
    });


    /*
      Keep latest 10 chats
    */

    const limited =
      history.slice(0,10);


    localStorage.setItem(
      "gyansetu_ai_history",
      JSON.stringify(limited)
    );

  }
  catch(error){

    console.log(
      "History save error",
      error
    );
  }
}


function renderHistory(){

  const list =
    $("historyList");

  try{

    const history =
      JSON.parse(
        localStorage.getItem(
          "gyansetu_ai_history"
        ) || "[]"
      );


    if(!history.length){

      list.innerHTML =
        "अजून कोणतीही chat history नाही.";

      return;
    }


    list.innerHTML = "";


    history.forEach(
      function(item,index){

        const button =
          document.createElement(
            "button"
          );

        button.style.width =
          "100%";

        button.style.padding =
          "11px";

        button.style.marginBottom =
          "7px";

        button.style.textAlign =
          "left";

        button.style.background =
          "#181818";

        button.style.color =
          "#ddd";

        button.style.border =
          "1px solid #2d2d2d";

        button.style.borderRadius =
          "11px";

        button.textContent =
          item.title || "Chat";


        button.onclick =
          function(){

            loadHistory(index);
          };


        list.appendChild(
          button
        );
      }
    );

  }
  catch(error){

    list.textContent =
      "History load करता आली नाही.";
  }
}


function loadHistory(index){

  try{

    const history =
      JSON.parse(
        localStorage.getItem(
          "gyansetu_ai_history"
        ) || "[]"
      );


    const item =
      history[index];


    if(!item) return;


    newChat();


    item.messages.forEach(
      function(message){

        if(message.role === "user"){

          addUserMessage(
            message.content,
            null
          );

        }
        else if(
          message.role === "assistant"
        ){

          addAIMessage(
            message.content
          );
        }
      }
    );


    chatMessages =
      item.messages || [];


    closeHistory();

    scrollBottom();

  }
  catch(error){

    console.log(error);
  }
}


/* =========================
   CLOSE POPUP
========================= */

$("popup").addEventListener(
  "click",
  function(event){

    if(
      event.target ===
      $("popup")
    ){

      closePopup();
    }
  }
);


/* =========================
   INITIAL
========================= */

window.addEventListener(
  "load",
  function(){

    $("question").focus();

  }
);

</script>
