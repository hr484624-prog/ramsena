<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GyanSetu Virtual Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap">
<style>
:root{--ink:#14213d;--paper:#f2f5fa;--card:#fff;--line:#d5deeb;--teal:#0b8f8f;--saf:#f59e0b;--mut:#56627f;--sky:#eaf4fc;--grid:#cddbea;--ground:#b9c9a7;--red:#e5484d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e8eefc;--paper:#0d1424;--card:#151f38;--line:#2a3757;--teal:#37c6c6;--saf:#fbbf24;--mut:#9aa8c9;--sky:#101c34;--grid:#223250;--ground:#27382f;--red:#ff6b70;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#e8eefc;--paper:#0d1424;--card:#151f38;--line:#2a3757;--teal:#37c6c6;--saf:#fbbf24;--mut:#9aa8c9;--sky:#101c34;--grid:#223250;--ground:#27382f;--red:#ff6b70;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Mukta","Noto Sans Devanagari",system-ui,sans-serif;font-size:16px;line-height:1.4;max-width:680px;margin:0 auto;padding:0 12px 90px;touch-action:manipulation}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 0 4px;gap:8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
.brand small{display:block;font-weight:600;color:var(--mut);font-size:12px;line-height:1}
.lang{display:flex;gap:4px}
button{font:inherit;color:var(--ink)}
.lang button{border:1.5px solid var(--line);background:var(--card);font-weight:600;padding:4px 10px;border-radius:999px;min-height:36px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0 8px;scrollbar-width:none}
.tabs button{flex:none;min-height:42px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.stage{border:1.5px solid var(--line);border-radius:16px;overflow:hidden;background:var(--sky)}
canvas{display:block;width:100%;height:min(50vh,340px);min-height:250px;touch-action:none}
#rd{display:grid;grid-template-columns:repeat(auto-fit,minmax(76px,1fr));gap:6px;margin:8px 0}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:5px 8px}
.tile small{display:block;color:var(--mut);font-size:12px}
.tile b{font-size:16px;font-variant-numeric:tabular-nums}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:10px 14px}
.row{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;margin-top:4px}
.row output{color:var(--teal);font-weight:800;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:34px;accent-color:var(--teal)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 6px}
.chips button{flex:1;min-width:84px;min-height:42px;border:1.5px solid var(--line);background:var(--paper);font-weight:600;border-radius:12px}
.chips button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal);color:#fff}
.hint{color:var(--mut);font-size:14px;margin:8px 2px}
.bar{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 0 12px;background:linear-gradient(transparent,var(--paper) 28%)}
.bar button{min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:800;font-size:16px}
#go{flex:2;background:var(--saf);color:#14213d;border-color:var(--saf)}
#rs,#hw{flex:1}
dialog{border:none;border-radius:18px;padding:18px;max-width:420px;width:calc(100% - 28px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,15,30,.6)}
dialog h2{margin:0 0 8px;font-size:20px}
dialog ol{padding-left:20px;margin:0 0 12px}
dialog li{margin-bottom:6px}
dialog button{width:100%;min-height:48px;border-radius:12px;border:0;background:var(--ink);color:var(--paper);font-weight:800}
.chg{border:1.5px solid var(--line);background:var(--card);font-weight:600;padding:4px 12px;border-radius:999px;min-height:36px}
.back{margin:4px 0;min-height:40px;border:0;background:none;font-weight:800;color:var(--teal);padding:0}
.ex{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;min-height:60px}
.ex b{display:block;font-size:17px}.ex span{color:var(--mut);font-size:14px}
.ex.soon{opacity:.65}.badge{float:right;font-size:12px;font-weight:600;font-style:normal;color:var(--teal)}
dialog .pk{display:flex;align-items:center;gap:12px;text-align:left;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);margin-bottom:8px;min-height:64px;padding:0 14px;font-size:18px}
dialog .pk span{font-size:26px}
.ex[hidden]{display:none}
.ex{min-height:48px;padding:10px 14px;margin-bottom:6px}.ex b{display:inline;font-size:16px}
summary{font-weight:800;padding:10px 2px;cursor:pointer}
.q{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;padding:0 12px;margin-bottom:6px}
</style>
</head>

<header>
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="8" fill="#14213d"/><path d="M5 23 Q15 0 25 23" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/><circle cx="25" cy="23" r="2.6" fill="#37c6c6"/></svg>
    <div>GyanSetu Lab<small id="u_sub"></small></div>

<div id="rd"></div>

<script>
const $=id=>document.getElementById(id);
const LI=2;
const tr=s=>{const a=s.split("|");return a[LI]||a[a.length-1]};
const U={start:"सुरू|शुरू|Start",pause:"थांबा|रोकें|Pause",resume:"पुढे|आगे|Resume",reset:"रीसेट|रीसेट|Reset",guide:"सूचना|निर्देश|Guide",close:"समजले|समझ गया|Got it",sub:"भौतिकशास्त्र प्रयोगशाळा|भौतिकी प्रयोगशाला|Physics Lab",hint:"स्लायडर हलवा आणि निकाल बदलताना पाहा.|स्लाइडर हिलाएँ और परिणाम बदलते देखें।|Move the sliders and watch the results change.",gt:"प्रयोग कसा करावा|प्रयोग कैसे करें|How to do it"};
let c,C,W,H,dpr=1,cpos=null;
const L=(a,b,x,y)=>{c.beginPath();c.moveTo(a,b);c.lineTo(x,y);c.stroke()};
const B=(x,y,r,f)=>{c.beginPath();c.arc(x,y,r,0,7);if(f){c.fillStyle=f;c.fill()}};
const DS=a=>c.setLineDash(a||[]);
const A=(a,b,x,y,col)=>{c.strokeStyle=col;c.fillStyle=col;c.lineWidth=3;L(a,b,x,y);const g=Math.atan2(y-b,x-a);c.beginPath();c.moveTo(x,y);c.lineTo(x-9*Math.cos(g-.4),y-9*Math.sin(g-.4));c.lineTo(x-9*Math.cos(g+.4),y-9*Math.sin(g+.4));c.fill()};
const GG=[9.8,1.6,3.7,24.8];
const gRaw=(g,q,vt)=>vt?(vt*vt/g)*Math.log(Math.cosh(g*q/vt)):.5*g*q*q;
const gT=(p,vt)=>{const g=GG[p.g];let q=0;while(gRaw(g,q,vt)<p.h&&q<60)q+=.02;return q};
const PL=["पृथ्वी|पृथ्वी|Earth","चंद्र|चंद्रमा|Moon","मंगळ|मंगल|Mars","गुरू|बृहस्पति|Jupiter"];

const E=[
{n:"विद्युत मंडल|विद्युत परिपथ|Circuit",
 p:[{k:"V",l:"बॅटरी|बैटरी|Battery",min:1,max:12,step:1,v:6,u:"V"},{k:"R1",l:"बल्ब १ रोध|बल्ब 1 प्रतिरोध|Bulb 1 resistance",min:1,max:20,step:1,v:5,u:"Ω"},{k:"R2",l:"बल्ब २ रोध|बल्ब 2 प्रतिरोध|Bulb 2 resistance",min:1,max:20,step:1,v:5,u:"Ω"},{k:"m",l:"जोडणी|जोड़|Wiring",o:["श्रेणी|श्रेणी|Series","समांतर|समानांतर|Parallel"],v:0},{k:"s",l:"स्विच|स्विच|Switch",o:["OFF|OFF|OFF","ON|ON|ON"],v:1}],
 how:"बॅटरी व्होल्टेज आणि बल्बचा रोध बदला.~श्रेणी किंवा समांतर जोडणी निवडा आणि स्विच ON/OFF करा.~चमक, विद्युतधारा (I) आणि व्होल्टेज (V) पाहा.|बैटरी वोल्टेज और बल्ब का प्रतिरोध बदलें।~श्रेणी या समानांतर जोड़ चुनें और स्विच ON/OFF करें।~चमक, धारा (I) और वोल्टेज (V) देखें।|Change the battery voltage and bulb resistance.~Choose series or parallel wiring and flip the switch.~Watch the brightness, current (I) and voltage (V).",
 d(p,t){
  const{V,R1,R2}=p,par=p.m,on=p.s;let I1=0,I2=0;
  if(on){if(par){I1=V/R1;I2=V/R2}else I1=I2=V/(R1+R2)}
  const I=par?I1+I2:I1,V1=on?(par?V:I1*R1):0,V2=on?(par?V:I2*R2):0;
  const x0=W*.12,x1=W*.88,y0=H*.22,y1=H*.78,ym=H/2,w=x1-x0,h=y1-y0;
  c.strokeStyle=C.ink;c.lineWidth=3;c.beginPath();c.moveTo(x0,ym-6);c.lineTo(x0,y0);c.lineTo(x1,y0);c.lineTo(x1,y1);c.lineTo(x0,y1);c.lineTo(x0,ym+6);c.stroke();
  if(par)L(W*.6,y0,W*.6,y1);
  L(x0-18,ym-6,x0+18,ym-6);L(x0-10,ym+6,x0+10,ym+6);c.fillStyle=C.ink;c.fillText("+",x0+24,ym-3);
  const sx=W*.27,sw=W*.09;c.fillStyle=C.sky;c.fillRect(sx-4,y0-5,sw+8,10);B(sx,y0,4,C.ink);B(sx+sw,y0,4,C.ink);c.strokeStyle=C.ink;L(sx,y0,on?sx+sw:sx+sw*.8,on?y0:y0-24);
  const bu=(x,y,q)=>{B(x,y,17,C.sky);B(x,y,17,"rgba(245,158,11,"+Math.min(1,Math.sqrt(q/6))+")");c.strokeStyle=C.ink;c.lineWidth=2;c.beginPath();c.arc(x,y,17,0,7);c.stroke();L(x-6,y+6,x-3,y-4);L(x-3,y-4,x+3,y+4);L(x+3,y+4,x+6,y-6)};
  const b=par?[[W*.6,ym],[x1,ym]]:[[W*.5,y0],[W*.72,y0]];bu(b[0][0],b[0][1],I1*V1);bu(b[1][0],b[1][1],I2*V2);
  if(I>0){const per=2*(w+h);for(let i=0;i<14;i++){const d=((i/14+t*.15*Math.min(I,4))%1)*per;let x,y;if(d<w){x=x0+d;y=y0}else if(d<w+h){x=x1;y=y0+d-w}else if(d<2*w+h){x=x1-(d-w-h);y=y1}else{x=x0;y=y1-(d-2*w-h)}B(x,y,3.5,C.teal)}}
  return[["I (A)",I.toFixed(2)],["V₁ (V)",V1.toFixed(1)],["V₂ (V)",V2.toFixed(1)],["P (W)",(I1*V1+I2*V2).toFixed(1)]]}},

{n:"प्रकाश अपवर्तन|प्रकाश अपवर्तन|Refraction",
 p:[{k:"i",l:"आपात कोन|आपतन कोण|Incident angle",min:0,max:85,step:1,v:40,u:"°"},{k:"n",l:"काचेचा n|काँच का n|Glass n",min:1,max:2.4,step:.1,v:1.5,u:""},{k:"d",l:"दिशा|दिशा|Direction",o:["हवा → काच|हवा → काँच|Air → Glass","काच → हवा|काँच → हवा|Glass → Air"],v:0}],
 how:"आपात कोन बदलून परावर्तित व अपवर्तित किरण पाहा.~काचेचा n वाढवा: किरण जास्त वाकतो.~‘काच → हवा’ निवडा आणि कोन वाढवा: पूर्ण आंतर परावर्तन (TIR) दिसेल.|आपतन कोण बदलकर परावर्तित व अपवर्तित किरण देखें।~काँच का n बढ़ाएँ: किरण अधिक मुड़ती है।~‘काँच → हवा’ चुनें और कोण बढ़ाएँ: पूर्ण आंतरिक परावर्तन (TIR) दिखेगा।|Change the incident angle and see the reflected and refracted rays.~Raise glass n: the ray bends more.~Pick Glass → Air and raise the angle: total internal reflection (TIR) appears.",
 d(p,t){
  const cx=W/2,cy=H/2,Ln=Math.min(W,H)*.42,i=p.i*Math.PI/180,na=p.d?p.n:1,nb=p.d?1:p.n,s=na/nb*Math.sin(i),tir=s>1,r=tir?0:Math.asin(s);
  c.fillStyle=C.teal;c.globalAlpha=.1+.07*(p.n-1);c.fillRect(0,p.d?0:cy,W,H/2);c.globalAlpha=1;
  c.strokeStyle=C.mut;c.lineWidth=1.5;L(0,cy,W,cy);DS([4,5]);L(cx,cy-Ln,cx,cy+Ln);
  c.lineWidth=4;DS([12,8]);c.lineDashOffset=-t*40;
  c.strokeStyle=C.saf;L(cx-Ln*Math.sin(i),cy-Ln*Math.cos(i),cx,cy);
  c.strokeStyle=C.teal;L(cx,cy,cx+Ln*Math.sin(i),cy-Ln*Math.cos(i));
  if(!tir){c.strokeStyle=C.red;L(cx,cy,cx+Ln*Math.sin(r),cy+Ln*Math.cos(r))}
  DS();c.lineDashOffset=0;c.fillStyle=C.ink;c.fillText("n = "+(p.d?p.n:1).toFixed(1),8,18);c.fillText("n = "+(p.d?1:p.n).toFixed(1),8,H-8);
  return[["∠i (°)",p.i],["∠r (°)",p.i],["∠t (°)",tir?"TIR":(r*180/Math.PI).toFixed(1)],["n₂/n₁",(nb/na).toFixed(2)]]}},

{n:"भिंग व आरसा|लेंस व दर्पण|Lens & Mirror",
 p:[{k:"ty",l:"साधन|साधन|Device",o:["उत्तल भिंग|उत्तल लेंस|Convex lens","अवतल भिंग|अवतल लेंस|Concave lens","अवतल आरसा|अवतल दर्पण|Concave mirror","उत्तल आरसा|उत्तल दर्पण|Convex mirror"],v:0},{k:"f",l:"नाभीय अंतर|फोकस दूरी|Focal length",min:5,max:15,step:1,v:10,u:"cm"},{k:"u",l:"वस्तू अंतर|वस्तु दूरी|Object distance",min:5,max:40,step:1,v:25,u:"cm"}],
 how:"साधन निवडा: भिंग किंवा आरसा.~वस्तू अंतर (u) आणि नाभीय अंतर (f) बदला.~प्रतिमेचे अंतर (v), मोठेपणा (m) आणि प्रकार पाहा.|साधन चुनें: लेंस या दर्पण।~वस्तु दूरी (u) और फोकस दूरी (f) बदलें।~प्रतिबिंब की दूरी (v), आवर्धन (m) और प्रकार देखें।|Choose a lens or a mirror.~Change the object distance (u) and focal length (f).~Watch the image distance (v), magnification (m) and its nature.",
 d(p,t){
  const ty=p.ty,mir=ty>1,sg=mir?-1:1,F=p.f,u=p.u,fs=(ty===0||ty===2)?F:-F,inv=1/fs-1/u,v=Math.abs(inv)<1e-9?Infinity:1/inv,m=-v/u;
  const cx=W/2,ay=H/2,s=(W*.46)/42,ho=6*s,xo=cx-u*s,yo=ay-ho,xe=sg>0?W:0;
  c.strokeStyle=C.mut;c.lineWidth=1;L(0,ay,W,ay);c.fillStyle=C.mut;c.textAlign="center";
  (mir?[fs>0?-1:1]:[-1,1]).forEach(z=>{B(cx+z*F*s,ay,3,C.mut);c.fillText("F",cx+z*F*s,ay+16)});
  const tp=ay-H*.36,bt=ay+H*.36;c.strokeStyle=C.ink;c.lineWidth=3;
  if(!mir){L(cx,tp,cx,bt);const e=ty===0?1:-1;[tp,bt].forEach((y,i)=>{const d2=(i?-1:1)*e*9;c.beginPath();c.moveTo(cx-6,y+d2);c.lineTo(cx,y);c.lineTo(cx+6,y+d2);c.stroke()})}
  else{c.beginPath();c.moveTo(cx,tp);c.quadraticCurveTo(cx+(ty===2?18:-18),ay,cx,bt);c.stroke()}
  const xi=cx+sg*v*s,yi=ay+(v/u)*ho,fin=isFinite(v);
  c.strokeStyle=C.saf;c.lineWidth=2;L(xo,yo,cx,yo);L(xo,yo,cx,ay);
  let ux,uy;if(!fin){ux=sg*F*s;uy=ay-yo}else if(v>0){ux=xi-cx;uy=yi-yo}else{ux=cx-xi;uy=yo-yi}
  L(cx,yo,xe,yo+uy*(xe-cx)/ux);const m1=(ay-yo)/(cx-xo);L(cx,ay,xe,ay+m1*sg*(xe-cx));
  if(fin&&v<0){DS([5,5]);c.strokeStyle=C.red;L(cx,yo,xi,yi);L(cx,ay,xi,yi);DS()}
  A(xo,ay,xo,yo,C.ink);
  if(fin&&xi>0&&xi<W){if(v<0)DS([4,4]);A(xi,ay,xi,yi,C.red);DS()}
  c.textAlign="left";
  return[["v (cm)",fin?Math.abs(v).toFixed(1):"∞"],["m",fin?m.toFixed(2):"∞"],[tr("प्रतिमा|प्रतिबिंब|Image"),fin?(v>0?tr("वास्तविक, उलटी|वास्तविक, उल्टा|Real, inverted"):tr("आभासी, सुलटी|आभासी, सीधा|Virtual, erect")):"—"],["f (cm)",F]]}},

{n:"प्रक्षेप गती|प्रक्षेप्य गति|Projectile",
