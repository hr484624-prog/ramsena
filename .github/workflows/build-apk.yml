name: Build GYANSETU APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # 3. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      # 4. Install Capacitor
      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7


      # 5. Prepare website
      - name: Prepare www folder
        run: |
          rm -rf www
          mkdir -p www

          find . -maxdepth 1 -mindepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "node_modules" \
            ! -name "android" \
            ! -name "www" \
            ! -name "package.json" \
            ! -name "package-lock.json" \
            -exec cp -r {} www/ \;

          echo "===== WWW FILES ====="
          find www -maxdepth 2 -type f | head -100


      # 6. Create Capacitor config
      - name: Create Capacitor config
        run: |
          rm -f capacitor.config.ts

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ramsena.xi",
            "appName": "GYAN-SETU",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          echo "===== CAPACITOR CONFIG ====="
          cat capacitor.config.json


      # 7. Add Android
      - name: Add Android platform
        run: |
          npx cap add android


      # 8. Configure Android permissions
      - name: Configure Android permissions
        run: |
          python3 - <<'PY'
          path = "android/app/src/main/AndroidManifest.xml"

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.VIBRATE"
          ]

          for permission in permissions:

              tag = f'<uses-permission android:name="{permission}" />'

              if tag not in text:

                  text = text.replace(
                      "<application",
                      "    " + tag + "\n\n    <application",
                      1
                  )

          features = [
              '<uses-feature android:name="android.hardware.camera" android:required="false" />',
              '<uses-feature android:name="android.hardware.microphone" android:required="false" />'
          ]

          for feature in features:

              if feature not in text:

                  text = text.replace(
                      "<application",
                      "    " + feature + "\n\n    <application",
                      1
                  )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Camera + Microphone permissions configured")
          PY


      # 9. Configure MainActivity
      - name: Configure MainActivity
        run: |
          mkdir -p android/app/src/main/java/com/ramsena/xi

          cat > android/app/src/main/java/com/ramsena/xi/MainActivity.java <<'EOF'
          package com.ramsena.xi;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;

          import androidx.annotation.NonNull;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              private static final int CAMERA_MIC_PERMISSION = 1001;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  requestCameraAndMicrophone();

                  WebView webView = getBridge().getWebView();

                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebChromeClient(new WebChromeClient() {

                      @Override
                      public void onPermissionRequest(
                              final PermissionRequest request) {

                          runOnUiThread(new Runnable() {

                              @Override
                              public void run() {

                                  if (checkSelfPermission(
                                          Manifest.permission.CAMERA
                                      ) == PackageManager.PERMISSION_GRANTED
                                      &&
                                      checkSelfPermission(
                                          Manifest.permission.RECORD_AUDIO
                                      ) == PackageManager.PERMISSION_GRANTED) {

                                      request.grant(
                                          request.getResources()
                                      );

                                  } else {

                                      request.deny();
                                  }
                              }
                          });
                      }
                  });
              }


              private void requestCameraAndMicrophone() {

                  boolean cameraGranted =
                      checkSelfPermission(
                          Manifest.permission.CAMERA
                      ) == PackageManager.PERMISSION_GRANTED;

                  boolean microphoneGranted =
                      checkSelfPermission(
                          Manifest.permission.RECORD_AUDIO
                      ) == PackageManager.PERMISSION_GRANTED;

                  if (!cameraGranted || !microphoneGranted) {

                      requestPermissions(
                          new String[]{
                              Manifest.permission.CAMERA,
                              Manifest.permission.RECORD_AUDIO
                          },
                          CAMERA_MIC_PERMISSION
                      );
                  }
              }


              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      @NonNull String[] permissions,
                      @NonNull int[] grantResults) {

                  super.onRequestPermissionsResult(
                      requestCode,
                      permissions,
                      grantResults
                  );

                  if (requestCode == CAMERA_MIC_PERMISSION) {

                      boolean allGranted = true;

                      for (int result : grantResults) {

                          if (result != PackageManager.PERMISSION_GRANTED) {

                              allGranted = false;
                              break;
                          }
                      }

                      if (allGranted) {

                          WebView webView = getBridge().getWebView();

                          if (webView != null) {
                              webView.reload();
                          }
                      }
                  }
              }
          }
          EOF

          echo "===== MAIN ACTIVITY ====="
          cat android/app/src/main/java/com/ramsena/xi/MainActivity.java


      # 10. Sync Capacitor
      - name: Sync Capacitor
        run: |
          npx cap sync android


      # 11. Configure debug APK signing
      - name: Configure APK signing
        run: |
          python3 - <<'PY'
          path = "android/app/build.gradle"

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          if "enableV1Signing false" not in text:

              signing_config = """
              signingConfigs {
                  debug {
                      enableV1Signing false
                      enableV2Signing true
                  }
              }
              """

              marker = "android {"

              if marker not in text:
                  raise SystemExit("android { block not found")

              text = text.replace(
                  marker,
                  marker + signing_config,
                  1
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Debug APK signing configured")
          PY


      # 12. Build APK
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace


      # 13. Check APK
      - name: Check APK
        run: |
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then

            echo "================================"
            echo "GYANSETU APK BUILD SUCCESSFUL"
            echo "================================"

            ls -lh android/app/build/outputs/apk/debug/app-debug.apk

          else

            echo "APK NOT FOUND"
            exit 1

          fi


      # 14. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GYANSETU-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error