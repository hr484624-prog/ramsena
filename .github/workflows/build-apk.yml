name: Build RAMSENA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Prepare web files
        run: |
          mkdir -p www

          find . -maxdepth 1 -type f \
            ! -name "build-apk.yml" \
            ! -name "package.json" \
            -exec cp {} www/ \;

          find . -maxdepth 1 -type d \
            ! -name "." \
            ! -name ".git" \
            ! -name "www" \
            ! -name "android" \
            -exec cp -r {} www/ \;

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ramsena.xi",
            "appName": "RAMSENA XI",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Add Android platform
        run: |
          npx cap add android

      - name: Sync Android project
        run: |
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAMSENA-XI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
