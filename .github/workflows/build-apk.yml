name: Build GYANSETU APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==================================================
      # NODE + JAVA
      # ==================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ==================================================
      # CHECK REQUIRED FILES
      # ==================================================
      - name: Check required files
        run: |
          for f in google-services.json index.html file_00000000333c82089b2140630d08f97c.png; do
            if [ ! -f "$f" ]; then
              echo "ERROR: $f not found in repository root."
              exit 1
            fi
          done
          echo "All required files found."

      # ==================================================
      # INSTALL CAPACITOR + ONESIGNAL
      # (Capacitor sathi official package: onesignal-cordova-plugin)
      # ==================================================
      - name: Install Capacitor and OneSignal
        run: |
          [ -f package.json ] || npm init -y
          npm install \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7 \
            onesignal-cordova-plugin@5
          npm install --save-dev esbuild

      # ==================================================
      # CREATE WWW (sarva files + folders, android/node_modules vagale)
      # ==================================================
      - name: Create www folder
        run: |
          rm -rf www
          mkdir -p www
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='android' \
            --exclude='www' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='capacitor.config.json' \
            --exclude='google-services.json' \
            --exclude='onesignal-init.js' \
            --exclude='*.yml' \
            --exclude='*.yaml' \
            --exclude='*.md' \
            ./ www/
          echo "www contents:"
          ls -la www

      # ==================================================
      # CAPACITOR CONFIG
      # ==================================================
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ramsena.xi",
            "appName": "GYAN-SETU",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      # ==================================================
      # ADD ANDROID
      # ==================================================
      - name: Add Android
        run: |
          rm -rf android
          npx cap add android

      # ==================================================
      # FIREBASE / GOOGLE SERVICES
      # ==================================================
      - name: Add Firebase google-services.json
        run: |
          cp google-services.json android/app/google-services.json

      - name: Configure Google Services (only if missing)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Project level: classpath fakt tevha taka jevha nasel
          project_gradle = Path("android/build.gradle")
          text = project_gradle.read_text()

          if "com.google.gms:google-services" not in text:
              text = re.sub(
                  r"(classpath\s+['\"]com\.android\.tools\.build:gradle:[^'\"]+['\"])",
                  r"\1\n        classpath 'com.google.gms:google-services:4.4.2'",
                  text,
                  count=1,
              )
              project_gradle.write_text(text)
              print("Added google-services classpath")
          else:
              print("google-services classpath already present")

          # App level: plugin fakt tevha apply kara jevha nasel
          app_gradle = Path("android/app/build.gradle")
          text = app_gradle.read_text()

          if "com.google.gms.google-services" not in text:
              text += "\napply plugin: 'com.google.gms.google-services'\n"
              app_gradle.write_text(text)
              print("Applied google-services plugin")
          else:
              print("google-services plugin already applied")
          PY

      # ==================================================
      # GS APP ICON (proper launcher icons: legacy + adaptive)
      # ==================================================
      - name: Create GyanSetu launcher icons
        run: |
          pip install pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Image.open("file_00000000333c82089b2140630d08f97c.png").convert("RGBA")
          res = Path("android/app/src/main/res")

          legacy = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          foreground = {"mdpi": 108, "hdpi": 162, "xhdpi": 216, "xxhdpi": 324, "xxxhdpi": 432}

          for d, size in legacy.items():
              folder = res / f"mipmap-{d}"
              folder.mkdir(parents=True, exist_ok=True)
              img = src.resize((size, size), Image.LANCZOS)
              img.save(folder / "ic_launcher.png")
              img.save(folder / "ic_launcher_round.png")

          for d, size in foreground.items():
              folder = res / f"mipmap-{d}"
              folder.mkdir(parents=True, exist_ok=True)
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              inner = int(size * 0.60)  # adaptive icon safe zone
              logo = src.resize((inner, inner), Image.LANCZOS)
              offset = (size - inner) // 2
              canvas.paste(logo, (offset, offset), logo)
              canvas.save(folder / "ic_launcher_foreground.png")

          print("GyanSetu icons created.")
          PY

      # ==================================================
      # ANDROID PERMISSIONS
      # ==================================================
      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.VIBRATE",
          ]

          # <manifest ...> chya nantar nahi, <application chya adhi taka
          additions = [
              f'    <uses-permission android:name="{p}" />'
              for p in permissions
              if p not in text
          ]

          if additions:
              idx = text.index("<application")
              text = text[:idx] + "\n".join(additions).lstrip() + "\n\n    " + text[idx:]

          manifest.write_text(text)
          print(text)
          PY

      # ==================================================
      # MAINACTIVITY (Capacitor cha swatacha WebChromeClient todu nako)
      # Camera/mic permission Capacitor swatah handle karto.
      # ==================================================
      - name: Write MainActivity
        run: |
          mkdir -p android/app/src/main/java/com/ramsena/xi

          cat > android/app/src/main/java/com/ramsena/xi/MainActivity.java <<'EOF'
          package com.ramsena.xi;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;

          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              private static final int REQUEST_MEDIA = 1001;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView()
                          .getSettings()
                          .setMediaPlaybackRequiresUserGesture(false);
                  }

                  requestMediaPermissions();
              }

              private void requestMediaPermissions() {
                  boolean needCamera =
                      ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA)
                          != PackageManager.PERMISSION_GRANTED;

                  boolean needMic =
                      ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED;

                  if (needCamera || needMic) {
                      ActivityCompat.requestPermissions(
                          this,
                          new String[] {
                              Manifest.permission.CAMERA,
                              Manifest.permission.RECORD_AUDIO
                          },
                          REQUEST_MEDIA
                      );
                  }
              }
          }
          EOF

      # ==================================================
      # ONESIGNAL INITIALIZATION
      # ==================================================
      - name: Create OneSignal initialization
        run: |
          cat > onesignal-init.js <<'EOF'
          import OneSignal from "onesignal-cordova-plugin";

          const ONESIGNAL_APP_ID = "b09e5ecd-3f5e-4030-8ddf-96a8f1645e6e";

          function isNativeApp() {
            return !!(
              window.Capacitor &&
              typeof window.Capacitor.isNativePlatform === "function" &&
              window.Capacitor.isNativePlatform()
            );
          }

          function linkSupabaseUser() {
            const timer = setInterval(async () => {
              try {
                if (typeof window.supabaseClient === "undefined") return;

                const { data } = await window.supabaseClient.auth.getSession();

                if (data && data.session && data.session.user) {
                  OneSignal.login(data.session.user.id);
                  console.log("OneSignal user linked:", data.session.user.id);
                  clearInterval(timer);
                }
              } catch (error) {
                console.error("OneSignal Supabase sync error:", error);
              }
            }, 1000);

            setTimeout(() => clearInterval(timer), 30000);
          }

          function initOneSignal() {
            try {
              OneSignal.initialize(ONESIGNAL_APP_ID);
              console.log("OneSignal initialized");

              OneSignal.Notifications.requestPermission(true);

              linkSupabaseUser();
            } catch (error) {
              // OneSignal madhe error aala tari app crash hou naye
              console.error("OneSignal initialization error:", error);
            }
          }

          // Fakt Android app madhe chalva, browser madhe nahi
          if (isNativeApp()) {
            // Native bridge tayar hoyla thoda vel dya
            window.addEventListener("load", () => setTimeout(initOneSignal, 1500));
          }
          EOF

      - name: Build OneSignal bundle
        run: |
          npx esbuild onesignal-init.js \
            --bundle \
            --format=iife \
            --platform=browser \
            --outfile=www/onesignal-init.bundle.js

      - name: Inject OneSignal into HTML pages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script = '\n<script src="/onesignal-init.bundle.js"></script>\n'

          for html in Path("www").rglob("*.html"):
              text = html.read_text(encoding="utf-8")

              if "onesignal-init.bundle.js" in text:
                  continue

              if "</body>" in text:
                  text = text.replace("</body>", script + "</body>", 1)
              else:
                  text += script

              html.write_text(text, encoding="utf-8")
              print("Injected:", html)
          PY

      # ==================================================
      # SYNC CAPACITOR
      # ==================================================
      - name: Sync Capacitor
        run: |
          npx cap sync android

      # ==================================================
      # BUILD APK
      # ==================================================
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Check APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      # ==================================================
      # UPLOAD APK
      # ==================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GYANSETU-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
