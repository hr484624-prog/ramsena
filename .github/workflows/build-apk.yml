name: Build GYANSETU APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      # --------------------------------------------------
      # Install Capacitor + OneSignal
      # --------------------------------------------------

      - name: Install Capacitor and OneSignal
        run: |
          npm init -y

          npm install \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7 \
            @onesignal/capacitor-plugin@latest


      # --------------------------------------------------
      # Create www folder
      # IMPORTANT:
      # google-services.json is NOT copied to www
      # --------------------------------------------------

      - name: Create www folder
        run: |
          rm -rf www
          mkdir -p www

          find . -maxdepth 1 -type f \( \
            -name "*.html" \
            -o -name "*.css" \
            -o -name "*.js" \
            -o -name "*.png" \
            -o -name "*.jpg" \
            -o -name "*.jpeg" \
            -o -name "*.webp" \
          \) -exec cp {} www/ \;


      # --------------------------------------------------
      # Check Firebase configuration
      # --------------------------------------------------

      - name: Check Firebase configuration
        run: |
          if [ ! -f "google-services.json" ]; then
            echo "ERROR: google-services.json not found in repository root."
            exit 1
          fi

          echo "Firebase google-services.json found."


      # --------------------------------------------------
      # Capacitor configuration
      # --------------------------------------------------

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ramsena.xi",
            "appName": "GYAN-SETU",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF


      # --------------------------------------------------
      # Add Android
      # --------------------------------------------------

      - name: Add Android
        run: |
          npx cap add android


      # --------------------------------------------------
      # Firebase configuration
      # --------------------------------------------------

      - name: Add Firebase google-services.json
        run: |
          cp google-services.json android/app/google-services.json


      # --------------------------------------------------
      # Google Services Gradle plugin
      # --------------------------------------------------

      - name: Configure Google Services
        run: |
          python3 - <<'PY'
          from pathlib import Path

          project_gradle = Path("android/build.gradle")
          text = project_gradle.read_text()

          if "com.google.gms:google-services" not in text:

              text += """

          buildscript {
              dependencies {
                  classpath 'com.google.gms:google-services:4.4.4'
              }
          }
          """

          project_gradle.write_text(text)


          app_gradle = Path("android/app/build.gradle")
          text = app_gradle.read_text()

          if "com.google.gms.google-services" not in text:

              text += """

          apply plugin: 'com.google.gms.google-services'
          """

          app_gradle.write_text(text)
          PY


      # --------------------------------------------------
      # Android permissions
      # --------------------------------------------------

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.VIBRATE"
          ]

          match = re.search(
              r'(<manifest\b[^>]*>)',
              text
          )

          if match:

              additions = []

              for permission in permissions:

                  if permission not in text:

                      additions.append(
                          f'    <uses-permission '
                          f'android:name="{permission}" />'
                      )

              if additions:

                  text = (
                      text[:match.end()]
                      + "\n"
                      + "\n".join(additions)
                      + "\n"
                      + text[match.end():]
                  )

          manifest.write_text(text)
          PY


      # --------------------------------------------------
      # Camera + Microphone WebView
      # --------------------------------------------------

      - name: Configure WebView camera microphone
        run: |
          mkdir -p android/app/src/main/java/com/ramsena/xi

          cat > android/app/src/main/java/com/ramsena/xi/MainActivity.java <<'EOF'
          package com.ramsena.xi;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;

          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              private static final int REQUEST_MEDIA = 1001;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  requestMediaPermissions();

                  WebView webView = this.bridge.getWebView();

                  webView.getSettings().setJavaScriptEnabled(true);

                  webView.getSettings()
                      .setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebChromeClient(
                      new WebChromeClient() {

                          @Override
                          public void onPermissionRequest(
                              PermissionRequest request
                          ) {

                              runOnUiThread(() -> {

                                  boolean camera =
                                      ContextCompat.checkSelfPermission(
                                          MainActivity.this,
                                          Manifest.permission.CAMERA
                                      ) == PackageManager.PERMISSION_GRANTED;

                                  boolean microphone =
                                      ContextCompat.checkSelfPermission(
                                          MainActivity.this,
                                          Manifest.permission.RECORD_AUDIO
                                      ) == PackageManager.PERMISSION_GRANTED;

                                  if (camera && microphone) {

                                      request.grant(
                                          request.getResources()
                                      );

                                  } else {

                                      request.deny();
                                  }
                              });
                          }
                      }
                  );
              }


              private void requestMediaPermissions() {

                  boolean camera =
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.CAMERA
                      ) != PackageManager.PERMISSION_GRANTED;

                  boolean microphone =
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.RECORD_AUDIO
                      ) != PackageManager.PERMISSION_GRANTED;

                  if (camera || microphone) {

                      ActivityCompat.requestPermissions(
                          this,
                          new String[] {
                              Manifest.permission.CAMERA,
                              Manifest.permission.RECORD_AUDIO
                          },
                          REQUEST_MEDIA
                      );
                  }
              }


              @Override
              public void onRequestPermissionsResult(
                  int requestCode,
                  String[] permissions,
                  int[] grantResults
              ) {

                  super.onRequestPermissionsResult(
                      requestCode,
                      permissions,
                      grantResults
                  );

                  if (requestCode == REQUEST_MEDIA) {

                      if (
                          this.bridge != null &&
                          this.bridge.getWebView() != null
                      ) {

                          this.bridge.getWebView().reload();
                      }
                  }
              }
          }
          EOF


      # --------------------------------------------------
      # Create OneSignal initialization
      # --------------------------------------------------

      - name: Create OneSignal initialization
        run: |
          cat > onesignal-init.js <<'EOF'
          import OneSignal from "@onesignal/capacitor-plugin";

          const ONESIGNAL_APP_ID =
            "b09e5ecd-3f5e-4030-8ddf-96a8f1645e6e";


          async function initOneSignal() {

              try {

                  await OneSignal.initialize({
                      appId: ONESIGNAL_APP_ID
                  });

                  console.log(
                      "OneSignal initialized"
                  );


                  const hasPermission =
                      await OneSignal.Notifications.hasPermission();


                  if (!hasPermission) {

                      await OneSignal.Notifications.requestPermission(
                          true
                      );
                  }


                  /*
                   * Wait for Supabase session.
                   *
                   * GyanSetu pages already load
                   * Supabase from CDN.
                   */

                  const waitForSupabase =
                      setInterval(async () => {

                          try {

                              if (
                                  typeof window.supabaseClient ===
                                  "undefined"
                              ) {
                                  return;
                              }


                              const {
                                  data
                              } =
                                  await window.supabaseClient.auth.getSession();


                              if (
                                  data &&
                                  data.session &&
                                  data.session.user
                              ) {

                                  await OneSignal.login(
                                      data.session.user.id
                                  );

                                  console.log(
                                      "OneSignal user linked:",
                                      data.session.user.id
                                  );

                                  clearInterval(
                                      waitForSupabase
                                  );
                              }

                          } catch (error) {

                              console.error(
                                  "OneSignal Supabase sync error:",
                                  error
                              );
                          }

                      }, 1000);


                  /*
                   * Stop checking after 30 seconds.
                   */

                  setTimeout(() => {

                      clearInterval(
                          waitForSupabase
                      );

                  }, 30000);


              } catch (error) {

                  console.error(
                      "OneSignal initialization error:",
                      error
                  );
              }
          }


          initOneSignal();
          EOF


      # --------------------------------------------------
      # Bundle OneSignal
      # --------------------------------------------------

      - name: Install esbuild
        run: |
          npm install --save-dev esbuild


      - name: Build OneSignal bundle
        run: |
          npx esbuild onesignal-init.js \
            --bundle \
            --format=esm \
            --platform=browser \
            --outfile=www/onesignal-init.bundle.js


      # --------------------------------------------------
      # Inject OneSignal into HTML
      # --------------------------------------------------

      - name: Inject OneSignal into HTML pages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for html in Path("www").glob("*.html"):

              text = html.read_text(
                  encoding="utf-8"
              )

              script = (
                  '\n<script type="module" '
                  'src="onesignal-init.bundle.js"></script>\n'
              )

              if "onesignal-init.bundle.js" not in text:

                  if "</body>" in text:

                      text = text.replace(
                          "</body>",
                          script + "</body>"
                      )

                  else:

                      text += script

                  html.write_text(
                      text,
                      encoding="utf-8"
                  )
          PY


      # --------------------------------------------------
      # Sync Capacitor
      # --------------------------------------------------

      - name: Sync Capacitor
        run: |
          npx cap sync android


      # --------------------------------------------------
      # Build APK
      # --------------------------------------------------

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug


      # --------------------------------------------------
      # Check APK
      # --------------------------------------------------

      - name: Check APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk


      # --------------------------------------------------
      # Upload APK
      # --------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GYANSETU-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk