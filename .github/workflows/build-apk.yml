name: Build RAMSENA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # 3. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      # 4. Install Capacitor
      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7


      # 5. Prepare website files
      - name: Prepare www folder
        run: |
          rm -rf www
          mkdir -p www

          find . -maxdepth 1 -mindepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "node_modules" \
            ! -name "android" \
            ! -name "www" \
            ! -name "package.json" \
            ! -name "package-lock.json" \
            -exec cp -r {} www/ \;

          echo "Website files:"
          find www -maxdepth 2 -type f | head -100


      # 6. Create Capacitor config
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.ramsena.xi',
            appName: 'GYAN-SETU',
            webDir: 'www',
            server: {
              androidScheme: 'https'
            }
          };

          export default config;
          EOF


      # 7. Add Android
      - name: Add Android platform
        run: |
          npx cap add android


      # 8. Add Android permissions
      - name: Configure Android permissions
        run: |
          python3 - <<'PY'
          path = "android/app/src/main/AndroidManifest.xml"

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.READ_CONTACTS",
              "android.permission.WRITE_CONTACTS",
              "android.permission.READ_CALENDAR",
              "android.permission.WRITE_CALENDAR",
              "android.permission.VIBRATE"
          ]

          for permission in permissions:
              tag = f'<uses-permission android:name="{permission}" />'
              if tag not in text:
                  text = text.replace(
                      "<application",
                      tag + "\n\n    <application",
                      1
                  )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Android permissions configured")
          PY


      # 9. Configure MainActivity
      - name: Configure MainActivity
        run: |
          mkdir -p android/app/src/main/java/com/ramsena/xi

          cat > android/app/src/main/java/com/ramsena/xi/MainActivity.java <<'EOF'
          package com.ramsena.xi;

          import android.Manifest;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  requestPermissions(
                      new String[]{
                          Manifest.permission.CAMERA,
                          Manifest.permission.RECORD_AUDIO
                      },
                      1001
                  );

                  WebView webView = getBridge().getWebView();

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> {
                              request.grant(request.getResources());
                          });
                      }
                  });
              }
          }
          EOF


      # 10. Sync Capacitor
      - name: Sync Capacitor
        run: |
          npx cap sync android


      # 11. Fix debug APK V1 signing
      - name: Configure APK signing
        run: |
          python3 - <<'PY'
          path = "android/app/build.gradle"

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          signing_block = r'''
              signingConfigs {
                  debug {
                      enableV1Signing false
                      enableV2Signing true
                  }
              }
          '''

          if "signingConfigs {" not in text:
              marker = "android {"
              if marker in text:
                  text = text.replace(
                      marker,
                      marker + "\n" + signing_block,
                      1
                  )
              else:
                  raise SystemExit("android { block not found")

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("APK signing configuration added")
          PY


      # 12. Show Gradle configuration
      - name: Check Gradle configuration
        run: |
          echo "===== android/app/build.gradle ====="
          sed -n '1,180p' android/app/build.gradle

          echo "===== Gradle version ====="
          cd android
          ./gradlew --version


      # 13. Build APK
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace


      # 14. Check APK
      - name: Check APK
        run: |
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "======================================"
            echo "APK BUILD SUCCESSFUL"
            echo "======================================"
            ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          else
            echo "APK NOT FOUND"
            exit 1
          fi


      # 15. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAMSENA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
