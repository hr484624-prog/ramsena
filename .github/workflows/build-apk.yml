name: Build GYANSETU APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7


      - name: Create www folder
        run: |
          mkdir -p www
          cp -r *.html *.css *.js *.json *.png *.jpg *.jpeg *.webp www/ 2>/dev/null || true


      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ramsena.xi",
            "appName": "GYAN-SETU",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF


      - name: Add Android
        run: npx cap add android


      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
            "android/app/src/main/AndroidManifest.xml"
          )

          text = p.read_text()

          permissions = [
            'android.permission.INTERNET',
            'android.permission.ACCESS_NETWORK_STATE',
            'android.permission.CAMERA',
            'android.permission.RECORD_AUDIO',
            'android.permission.MODIFY_AUDIO_SETTINGS',
            'android.permission.ACCESS_FINE_LOCATION',
            'android.permission.ACCESS_COARSE_LOCATION',
            'android.permission.POST_NOTIFICATIONS',
            'android.permission.VIBRATE'
          ]

          lines = []

          for perm in permissions:
              tag = f'<uses-permission android:name="{perm}" />'

              if tag not in text:
                  lines.append(tag)

          if lines:
              text = text.replace(
                  '<manifest',
                  '<manifest',
                  1
              )

              first_tag_end = text.find(">") + 1

              text = (
                  text[:first_tag_end]
                  + "\n"
                  + "\n".join(lines)
                  + text[first_tag_end:]
              )

          p.write_text(text)
          PY


      - name: Configure camera and microphone
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
            "android/app/src/main/java/com/ramsena/xi/MainActivity.java"
          )

          p.parent.mkdir(
            parents=True,
            exist_ok=True
          )

          code = r'''
          package com.ramsena.xi;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;

          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              private static final int REQUEST_MEDIA = 1001;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  requestMediaPermissions();

                  WebView webView =
                      this.bridge.getWebView();

                  webView.getSettings()
                      .setJavaScriptEnabled(true);

                  webView.getSettings()
                      .setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebChromeClient(
                      new WebChromeClient() {

                          @Override
                          public void onPermissionRequest(
                              PermissionRequest request
                          ) {

                              runOnUiThread(() -> {

                                  if (
                                      ContextCompat.checkSelfPermission(
                                          MainActivity.this,
                                          Manifest.permission.CAMERA
                                      ) == PackageManager.PERMISSION_GRANTED
                                      &&
                                      ContextCompat.checkSelfPermission(
                                          MainActivity.this,
                                          Manifest.permission.RECORD_AUDIO
                                      ) == PackageManager.PERMISSION_GRANTED
                                  ) {

                                      request.grant(
                                          request.getResources()
                                      );

                                  } else {

                                      request.deny();

                                  }

                              });
                          }
                      }
                  );
              }

              private void requestMediaPermissions() {

                  boolean camera =
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.CAMERA
                      ) != PackageManager.PERMISSION_GRANTED;

                  boolean audio =
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.RECORD_AUDIO
                      ) != PackageManager.PERMISSION_GRANTED;

                  if (camera || audio) {

                      ActivityCompat.requestPermissions(
                          this,
                          new String[] {
                              Manifest.permission.CAMERA,
                              Manifest.permission.RECORD_AUDIO
                          },
                          REQUEST_MEDIA
                      );
                  }
              }

              @Override
              public void onRequestPermissionsResult(
                  int requestCode,
                  String[] permissions,
                  int[] grantResults
              ) {

                  super.onRequestPermissionsResult(
                      requestCode,
                      permissions,
                      grantResults
                  );

                  if (requestCode == REQUEST_MEDIA) {

                      if (
                          this.bridge != null &&
                          this.bridge.getWebView() != null
                      ) {

                          this.bridge
                              .getWebView()
                              .reload();
                      }
                  }
              }
          }
          '''

          p.write_text(code)
          PY


      - name: Sync Capacitor
        run: npx cap sync android


      - name: Configure debug signing
        run: |
          cd android

          chmod +x gradlew

          ./gradlew assembleDebug


      - name: Check APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GYANSETU-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk