name: Build GYANSETU APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ONESIGNAL_DISABLE_LOCATION: true

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Node.js
      # --------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # --------------------------------------------------
      # 3. Java
      # --------------------------------------------------

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      # --------------------------------------------------
      # 4. Install Capacitor + OneSignal
      # --------------------------------------------------

      - name: Install Capacitor and OneSignal
        run: |
          npm init -y

          npm install \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7 \
            @onesignal/capacitor-plugin@latest

          npm install esbuild


      # --------------------------------------------------
      # 5. Create www folder
      #
      # IMPORTANT:
      # google-services.json is NOT copied to www.
      # --------------------------------------------------

      - name: Create www folder
        run: |
          rm -rf www
          mkdir -p www

          find . -maxdepth 1 -type f \( \
            -name "*.html" \
            -o -name "*.css" \
            -o -name "*.js" \
            -o -name "*.png" \
            -o -name "*.jpg" \
            -o -name "*.jpeg" \
            -o -name "*.webp" \
          \) -exec cp {} www/ \;


      # --------------------------------------------------
      # 6. Check Firebase file
      # --------------------------------------------------

      - name: Check Firebase configuration
        run: |
          if [ ! -f "google-services.json" ]; then
            echo "ERROR: google-services.json not found in repository root."
            exit 1
          fi

          echo "Firebase google-services.json found."


      # --------------------------------------------------
      # 7. Create Capacitor config
      # --------------------------------------------------

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ramsena.xi",
            "appName": "GYAN-SETU",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF


      # --------------------------------------------------
      # 8. Add Android
      # --------------------------------------------------

      - name: Add Android
        run: |
          npx cap add android


      # --------------------------------------------------
      # 9. Copy Firebase configuration
      # --------------------------------------------------

      - name: Add Firebase google-services.json
        run: |
          cp google-services.json android/app/google-services.json


      # --------------------------------------------------
      # 10. Configure Google Services Gradle plugin
      # --------------------------------------------------

      - name: Configure Google Services
        run: |
          python3 - <<'PY'
          from pathlib import Path

          project_gradle = Path("android/build.gradle")

          text = project_gradle.read_text()

          if "com.google.gms:google-services" not in text:
              text += """

          buildscript {
              dependencies {
                  classpath 'com.google.gms:google-services:4.4.4'
              }
          }
          """

          project_gradle.write_text(text)


          app_gradle = Path("android/app/build.gradle")

          text = app_gradle.read_text()

          if "com.google.gms.google-services" not in text:
              text += """

          apply plugin: 'com.google.gms.google-services'
          """

          app_gradle.write_text(text)
          PY


      # --------------------------------------------------
      # 11. Android permissions
      # --------------------------------------------------

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.VIBRATE"
          ]

          for permission in permissions:

              if permission not in text:

                  match = re.search(
                      r'(<manifest\b[^>]*>)',
                      text
                  )

                  if match:

                      permission_line = (
                          f'\n    <uses-permission '
                          f'android:name="{permission}" />'
                      )

                      text = (
                          text[:match.end()]
                          + permission_line
                          + text[match.end():]
                      )

          manifest.write_text(text)
          PY


      # --------------------------------------------------
      # 12. Configure WebView camera + microphone
      # --------------------------------------------------

      - name: Configure WebView camera microphone
        run: |
          mkdir -p android/app/src/main/java/com/ramsena/xi

          cat > android/app/src/main/java/com/ramsena/xi/MainActivity.java <<'EOF'
          package com.ramsena.xi;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;

          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              private static final int REQUEST_MEDIA = 1001;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  requestMediaPermissions();

                  WebView webView = this.bridge.getWebView();

                  webView.getSettings().setJavaScriptEnabled(true);

                  webView.getSettings()
                      .setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebChromeClient(
                      new WebChromeClient() {

                          @Override
                          public void onPermissionRequest(
                              PermissionRequest request
                          ) {

                              runOnUiThread(() -> {

                                  boolean camera =
                                      ContextCompat.checkSelfPermission(
                                          MainActivity.this,
                                          Manifest.permission.CAMERA
                                      ) == PackageManager.PERMISSION_GRANTED;

                                  boolean microphone =
                                      ContextCompat.checkSelfPermission(
                                          MainActivity.this,
                                          Manifest.permission.RECORD_AUDIO
                                      ) == PackageManager.PERMISSION_GRANTED;

                                  if (camera && microphone) {

                                      request.grant(
                                          request.getResources()
                                      );

                                  } else {

                                      request.deny();
                                  }
                              });
                          }
                      }
                  );
              }


              private void requestMediaPermissions() {

                  boolean camera =
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.CAMERA
                      ) != PackageManager.PERMISSION_GRANTED;

                  boolean microphone =
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.RECORD_AUDIO
                      ) != PackageManager.PERMISSION_GRANTED;

                  if (camera || microphone) {

                      ActivityCompat.requestPermissions(
                          this,
                          new String[] {
                              Manifest.permission.CAMERA,
                              Manifest.permission.RECORD_AUDIO
                          },
                          REQUEST_MEDIA
                      );
                  }
              }


              @Override
              public void onRequestPermissionsResult(
                  int requestCode,
                  String[] permissions,
                  int[] grantResults
              ) {

                  super.onRequestPermissionsResult(
                      requestCode,
                      permissions,
                      grantResults
                  );

                  if (requestCode == REQUEST_MEDIA) {

                      if (
                          this.bridge != null &&
                          this.bridge.getWebView() != null
                      ) {

                          this.bridge.getWebView().reload();
                      }
                  }
              }
          }
          EOF


      # --------------------------------------------------
      # 13. Create OneSignal bridge initialization
      # --------------------------------------------------

      - name: Create OneSignal initialization
        run: |
          mkdir -p onesignal

          cat > onesignal/onesignal-init.js <<'EOF'
          import OneSignal from "@onesignal/capacitor-plugin";
          import { createClient } from "@supabase/supabase-js";

          const SUPABASE_URL =
            "https://eqglttfffhvoyvrclzse.supabase.co";

          const SUPABASE_KEY =
            "sb_publishable_rR4xxl0dW5DJrhhjqiFHLw_uJ-HakAb";

          const ONESIGNAL_APP_ID =
            "b09e5ecd-3f5e-4030-8ddf-96a8f1645e6e";

          const supabaseClient =
            createClient(
              SUPABASE_URL,
              SUPABASE_KEY
            );


          async function initOneSignal() {

              try {

                  await OneSignal.initialize({
                      appId: ONESIGNAL_APP_ID
                  });

                  console.log(
                      "OneSignal initialized"
                  );


                  const permission =
                      await OneSignal.Notifications.hasPermission();

                  if (!permission) {

                      await OneSignal.Notifications.requestPermission(
                          true
                      );
                  }


                  const {
                      data: {
                          session
                      }
                  } =
                      await supabaseClient.auth.getSession();


                  if (session?.user?.id) {

                      await OneSignal.login(
                          session.user.id
                      );

                      console.log(
                          "OneSignal user linked:",
                          session.user.id
                      );
                  }


                  supabaseClient.auth.onAuthStateChange(
                      async (event, session) => {

                          try {

                              if (
                                  session?.user?.id
                              ) {

                                  await OneSignal.login(
                                      session.user.id
                                  );

                                  console.log(
                                      "OneSignal login:",
                                      session.user.id
                                  );

                              } else {

                                  await OneSignal.logout();

                                  console.log(
                                      "OneSignal logout"
                                  );
                              }

                          } catch (error) {

                              console.error(
                                  "OneSignal auth sync error:",
                                  error
                              );
                          }
                      }
                  );


              } catch (error) {

                  console.error(
                      "OneSignal initialization error:",
                      error
                  );
              }
          }


          initOneSignal();
          EOF


      # --------------------------------------------------
      # 14. Create Supabase + OneSignal bundle
      # --------------------------------------------------

      - name: Build OneSignal JavaScript bundle
        run: |
          npx esbuild onesignal/onesignal-init.js \
            --bundle \
            --format=esm \
            --platform=browser \
            --outfile=www/onesignal-init.bundle.js


      # --------------------------------------------------
      # 15. Add OneSignal script to every HTML page
      # --------------------------------------------------

      - name: Inject OneSignal into HTML pages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for html in Path("www").glob("*.html"):

              text = html.read_text(
                  encoding="utf-8"
              )

              script = (
                  '\n<script type="module" '
                  'src="onesignal-init.bundle.js"></script>\n'
              )

              if "onesignal-init.bundle.js" not in text:

                  if "</body>" in text:

                      text = text.replace(
                          "</body>",
                          script + "</body>"
                      )

                  else:

                      text += script

                  html.write_text(
                      text,
                      encoding="utf-8"
                  )
          PY


      # --------------------------------------------------
      # 16. Sync Capacitor
      # --------------------------------------------------

      - name: Sync Capacitor
        run: |
          npx cap sync android


      # --------------------------------------------------
      # 17. Build APK
      # --------------------------------------------------

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug


      # --------------------------------------------------
      # 18. Check APK
      # --------------------------------------------------

      - name: Check APK
        run: |
          ls -lh \
            android/app/build/outputs/apk/debug/app-debug.apk


      # --------------------------------------------------
      # 19. Upload APK
      # --------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GYANSETU-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk