name: Build RAMSENA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================
      # CHECKOUT
      # =========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================
      # NODE.JS
      # =========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # =========================================
      # JAVA
      # =========================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      # =========================================
      # INSTALL CAPACITOR
      # =========================================

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7


      # =========================================
      # PREPARE WEB FILES
      # =========================================

      - name: Prepare web files
        run: |
          mkdir -p www

          find . -maxdepth 1 -type f \
            ! -name "build-apk.yml" \
            ! -name "package.json" \
            -exec cp {} www/ \;

          find . -maxdepth 1 -type d \
            ! -name "." \
            ! -name ".git" \
            ! -name "www" \
            ! -name "android" \
            -exec cp -r {} www/ \;


      # =========================================
      # CAPACITOR CONFIG
      # =========================================

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ramsena.xi",
            "appName": "GYAN-SETU",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF


      # =========================================
      # ADD ANDROID PLATFORM
      # =========================================

      - name: Add Android platform
        run: |
          npx cap add android


      # =========================================
      # ADD ANDROID PERMISSIONS
      # =========================================

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",

              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",

              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",

              "android.permission.POST_NOTIFICATIONS",

              "android.permission.READ_CONTACTS",
              "android.permission.WRITE_CONTACTS",

              "android.permission.READ_CALENDAR",
              "android.permission.WRITE_CALENDAR",

              "android.permission.READ_MEDIA_IMAGES",
              "android.permission.READ_MEDIA_VIDEO",
              "android.permission.READ_MEDIA_AUDIO",

              "android.permission.READ_EXTERNAL_STORAGE",
              "android.permission.WRITE_EXTERNAL_STORAGE",

              "android.permission.VIBRATE"
          ]

          additions = []

          for permission in permissions:
              if permission not in text:
                  additions.append(
                      f'    <uses-permission android:name="{permission}" />'
                  )

          if additions:
              text = text.replace(
                  "<application",
                  "\n".join(additions) + "\n\n    <application",
                  1
              )

          manifest.write_text(text)

          print("GyanSetu Android permissions added.")
          PY


      # =========================================
      # CREATE MAIN ACTIVITY
      # =========================================

      - name: Configure MainActivity
        run: |
          cat > android/app/src/main/java/com/ramsena/xi/MainActivity.java <<'EOF'
          package com.ramsena.xi;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;

          import androidx.annotation.NonNull;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              private static final int MEDIA_PERMISSION_REQUEST = 1001;

              private PermissionRequest pendingPermissionRequest;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  requestCameraMicrophonePermission();

                  WebView webView = getBridge().getWebView();

                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebChromeClient(new WebChromeClient() {

                      @Override
                      public void onPermissionRequest(
                              final PermissionRequest request) {

                          runOnUiThread(() -> {

                              String[] resources = request.getResources();

                              boolean needsCamera = false;
                              boolean needsMicrophone = false;

                              for (String resource : resources) {

                                  if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(resource)) {
                                      needsCamera = true;
                                  }

                                  if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource)) {
                                      needsMicrophone = true;
                                  }
                              }

                              boolean cameraGranted =
                                      !needsCamera ||
                                      ContextCompat.checkSelfPermission(
                                              MainActivity.this,
                                              Manifest.permission.CAMERA
                                      ) == PackageManager.PERMISSION_GRANTED;

                              boolean microphoneGranted =
                                      !needsMicrophone ||
                                      ContextCompat.checkSelfPermission(
                                              MainActivity.this,
                                              Manifest.permission.RECORD_AUDIO
                                      ) == PackageManager.PERMISSION_GRANTED;

                              if (cameraGranted && microphoneGranted) {

                                  request.grant(resources);

                              } else {

                                  pendingPermissionRequest = request;

                                  requestCameraMicrophonePermission();
                              }
                          });
                      }
                  });
              }

              private void requestCameraMicrophonePermission() {

                  boolean cameraGranted =
                          ContextCompat.checkSelfPermission(
                                  this,
                                  Manifest.permission.CAMERA
                          ) == PackageManager.PERMISSION_GRANTED;

                  boolean microphoneGranted =
                          ContextCompat.checkSelfPermission(
                                  this,
                                  Manifest.permission.RECORD_AUDIO
                          ) == PackageManager.PERMISSION_GRANTED;

                  if (!cameraGranted || !microphoneGranted) {

                      ActivityCompat.requestPermissions(
                              this,
                              new String[]{
                                      Manifest.permission.CAMERA,
                                      Manifest.permission.RECORD_AUDIO
                              },
                              MEDIA_PERMISSION_REQUEST
                      );
                  }
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      @NonNull String[] permissions,
                      @NonNull int[] grantResults) {

                  super.onRequestPermissionsResult(
                          requestCode,
                          permissions,
                          grantResults
                  );

                  if (requestCode == MEDIA_PERMISSION_REQUEST) {

                      if (pendingPermissionRequest != null) {

                          boolean cameraGranted =
                                  ContextCompat.checkSelfPermission(
                                          this,
                                          Manifest.permission.CAMERA
                                  ) == PackageManager.PERMISSION_GRANTED;

                          boolean microphoneGranted =
                                  ContextCompat.checkSelfPermission(
                                          this,
                                          Manifest.permission.RECORD_AUDIO
                                  ) == PackageManager.PERMISSION_GRANTED;

                          if (cameraGranted && microphoneGranted) {

                              pendingPermissionRequest.grant(
                                      pendingPermissionRequest.getResources()
                              );

                          } else {

                              pendingPermissionRequest.deny();
                          }

                          pendingPermissionRequest = null;
                      }
                  }
              }
          }
          EOF

          echo "MainActivity.java created successfully."


      # =========================================
      # SYNC CAPACITOR
      # =========================================

      - name: Sync Capacitor
        run: |
          npx cap sync android


      # =========================================
      # BUILD APK
      # =========================================

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug


      # =========================================
      # UPLOAD APK
      # =========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAMSENA-XI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
