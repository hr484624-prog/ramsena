<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>My Profile - GyanSetu</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#000;--tx:#f5f5f5;--mu:#a8a8a8;--ln:#262626;--cd:#1a1a1a;--bl:#0095f6;--ig:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)}
[data-theme=light]{--bg:#fff;--tx:#262626;--mu:#737373;--ln:#dbdbdb;--cd:#efefef}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,Roboto,Arial,sans-serif;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:var(--tx);outline:0}
svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.hidden{display:none!important}
.hdr{position:sticky;top:0;z-index:50;height:52px;display:flex;align-items:center;gap:4px;padding:0 10px 0 14px;background:var(--bg)}
.hdr .un{flex:1;font-size:21px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.hdr .un small{font-size:14px;margin-left:4px}
.hdr button{padding:7px}
.wrap{max-width:600px;margin:auto}
.top{padding:6px 16px 0}
.r1{display:flex;align-items:center;gap:24px}
.avw{position:relative;flex-shrink:0}
.ring{padding:3px;border-radius:50%;background:var(--ln);display:inline-flex}.ring.has{background:var(--ig)}
.av{width:86px;height:86px;border-radius:50%;border:3px solid var(--bg);background:linear-gradient(135deg,#ff28cf,#416cff);color:#fff;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;overflow:hidden;cursor:pointer}
.av img{width:100%;height:100%;object-fit:cover}
.pl{position:absolute;right:0;bottom:2px;width:24px;height:24px;border-radius:50%;background:var(--bl);color:#fff;border:3px solid var(--bg);font-size:16px;line-height:16px;text-align:center}
.stats{flex:1;display:flex;justify-content:space-around;text-align:center}.stats>div{cursor:pointer}
.stats b{display:block;font-size:17px}.stats span{font-size:13.5px}
.bio{margin-top:12px;font-size:14px;line-height:1.45}.bio b{font-size:14.5px}.bio .mu{color:var(--mu)}.bio .gl{color:#4aa8ff}
.btns{display:flex;gap:6px;margin-top:14px}
.btns button{flex:1;padding:8px 6px;border-radius:8px;background:var(--cd);font-weight:600;font-size:14px}
.btns .sq{flex:none;width:38px;display:flex;align-items:center;justify-content:center}.btns .sq svg{width:20px;height:20px}
.sts{display:flex;gap:14px;padding:14px 16px 2px;overflow-x:auto}.sts::-webkit-scrollbar{display:none}
.st1{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;width:64px;font-size:11.5px;cursor:pointer}
.st1 .c{width:62px;height:62px;border-radius:50%;padding:2.5px;background:var(--ig)}.st1 .c>div{width:100%;height:100%;border-radius:50%;border:2.5px solid var(--bg);background:#111;overflow:hidden}
.st1 .c video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.st1 .nw{width:62px;height:62px;border-radius:50%;border:1.5px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--mu)}
.st1 span{color:var(--mu)}
.tabs{display:flex;margin-top:14px;border-top:1px solid var(--ln)}
.tabs button{flex:1;padding:11px 0;display:flex;justify-content:center;color:var(--mu);border-top:1.5px solid transparent;margin-top:-1px}
.tabs button.on{color:var(--tx);border-top-color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.cell{position:relative;aspect-ratio:3/4;background:#111;overflow:hidden;cursor:pointer}
.cell video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.cell .pi{position:absolute;top:6px;right:6px;color:#fff;filter:drop-shadow(0 1px 3px #000)}.cell .pi svg{width:18px;height:18px;fill:#fff}
.cell .ct{position:absolute;left:6px;bottom:5px;color:#fff;font-size:12px;font-weight:600;text-shadow:0 1px 3px #000}
.empty{text-align:center;color:var(--mu);padding:50px 24px;line-height:1.7}.empty .big{font-size:46px}
.empty button{margin-top:14px;padding:10px 22px;border-radius:8px;background:var(--bl);color:#fff;font-weight:700}
.about{padding:4px 16px}.arow{display:flex;justify-content:space-between;gap:15px;padding:14px 0;border-bottom:1px solid var(--ln);font-size:14px}.arow span:first-child{color:var(--mu)}.arow span:last-child{text-align:right;font-weight:600;max-width:62%;word-break:break-word}
.nav .av2{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#ff28cf,#416cff);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--tx);overflow:hidden}.nav .av2 img{width:100%;height:100%;object-fit:cover}
.sbg{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center}.sbg.show{display:flex}
.sheet{width:100%;max-width:520px;max-height:90vh;overflow-y:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));border:1px solid var(--ln)}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--ln);margin:6px auto 12px}
.sheet h3{font-size:16px;text-align:center;margin-bottom:10px}.sheet p{font-size:13.5px;line-height:1.6;color:var(--mu);margin:8px 0}
.row{display:flex;align-items:center;gap:12px;padding:13px 4px;font-size:15px;width:100%;text-align:left;border-bottom:1px solid var(--ln)}.row small{color:var(--mu);margin-left:auto}
.mini{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#ff28cf,#416cff);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.fb{margin-left:auto;padding:7px 16px;border-radius:8px;background:var(--bl);color:#fff;font-weight:600;font-size:13px}.fb.on{background:var(--cd);color:var(--tx)}
.sheet label{display:block;font-size:12.5px;color:var(--mu);margin:8px 0 4px}
.sheet input,.sheet textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--cd);font-size:16px}.sheet textarea{height:80px;resize:none}
.seg{display:flex;gap:6px;justify-content:center;margin-bottom:6px}.seg button{padding:7px 16px;border-radius:9px;background:var(--cd);font-size:13px;font-weight:600}.seg button.on{background:var(--tx);color:var(--bg)}
.pbtn{width:100%;padding:12px;border-radius:10px;background:var(--bl);color:#fff;font-weight:700;margin-top:14px}.pbtn:disabled{opacity:.5}
.cbtn{width:100%;padding:12px;border-radius:10px;background:var(--cd);font-weight:600;margin-top:8px}
.viewer{position:fixed;inset:0;z-index:300;background:#000;color:#fff;display:none;flex-direction:column}.viewer.show{display:flex}
.vtop{display:flex;align-items:center;gap:8px;padding:8px 10px;font-weight:700}.vtop .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vtop button{padding:7px;color:#fff}
.vbody{flex:1;min-height:0;display:flex;align-items:center}.vbody video{width:100%;max-height:100%;background:#000}
.vinfo{padding:10px 16px calc(14px + env(safe-area-inset-bottom));font-size:14px;line-height:1.5;max-height:34vh;overflow:auto}.vinfo small{color:#a8a8a8}
.vcnt{display:flex;gap:18px;margin:6px 0 8px;font-size:14px;align-items:center}.vcnt a{margin-left:auto;color:#4aa8ff;font-weight:600;cursor:pointer}
.vw{display:flex;align-items:center;gap:10px;padding:6px 0}.vw small{margin-left:auto}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--cd);color:var(--tx);padding:10px 18px;border-radius:12px;display:none;z-index:900;font-size:13px;max-width:90%;text-align:center}.toast.show{display:block}

/* LIQUID GLASS NAV */
.nav{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,420px);height:64px;padding:6px;display:flex;align-items:center;border-radius:34px;z-index:100;isolation:isolate;
 background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.05));
 -webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);
 border:1px solid rgba(255,255,255,.24);
 box-shadow:0 14px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.07),inset 0 0 18px rgba(255,255,255,.05)}
.nav::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 100% at 15% 0%,rgba(255,255,255,.3),transparent 52%);opacity:.55;pointer-events:none;z-index:0}
.nav button{position:relative;z-index:2;flex:1;height:100%;display:flex;align-items:center;justify-content:center;color:var(--tx);opacity:.72;transition:opacity .25s,transform .2s;border-radius:28px}
.nav button:active{transform:scale(.88)}
.nav button.on{opacity:1}.nav button.on svg{stroke-width:2.6}
.nav .ind{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:28px;z-index:1;pointer-events:none;
 background:linear-gradient(180deg,rgba(255,255,255,.36),rgba(255,255,255,.12));
 border:1px solid rgba(255,255,255,.3);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -6px 12px rgba(255,255,255,.06),0 4px 14px rgba(0,0,0,.28);
 transition:transform .5s cubic-bezier(.34,1.45,.5,1),width .5s cubic-bezier(.34,1.45,.5,1)}
[data-theme=light] .nav{background:linear-gradient(135deg,rgba(255,255,255,.8),rgba(255,255,255,.5));border-color:rgba(255,255,255,.9);box-shadow:0 12px 30px rgba(0,0,0,.16),inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.05)}
[data-theme=light] .nav::before{opacity:.35}
[data-theme=light] .nav .ind{background:linear-gradient(180deg,rgba(0,0,0,.09),rgba(0,0,0,.04));border-color:rgba(0,0,0,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 3px 10px rgba(0,0,0,.1)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.nav{background:rgba(28,28,30,.92)}[data-theme=light] .nav{background:rgba(255,255,255,.95)}}
</style>
</head>
<body>
<header class="hdr">
  <div class="un" onclick="openMenu()"><span id="hname">Profile</span><small>⌄</small></div>
  <button onclick="openVideoModal()" id="bP"></button>
  <button onclick="openMenu()" id="bX"></button>
</header>

<main class="wrap">
  <section class="top">
    <div class="r1">
      <div class="avw"><div class="ring" id="aring"><div class="av" id="avatar" onclick="avatarTap()">G</div></div><div class="pl" onclick="$('photoInput').click()">+</div></div>
      <div class="stats">
        <div onclick="setTab('posts')"><b id="stPosts">0</b><span>Posts</span></div>
        <div onclick="openFollow('followers')"><b id="stFol">0</b><span>Followers</span></div>
        <div onclick="openFollow('following')"><b id="stFing">0</b><span>Following</span></div>
      </div>
    </div>
    <div class="bio">
      <b id="name">User</b>
      <div class="mu" id="bioSchool"></div><div class="mu" id="bioCity"></div><div class="gl" id="bioGoal"></div>
      <div class="mu" id="bioStat" style="font-size:12.5px;margin-top:2px"></div>
    </div>
    <div class="btns">
      <button onclick="openEdit()">Edit profile</button>
      <button onclick="shareProfile()">Share profile</button>
      <button class="sq" onclick="openDiscover()" id="bA"></button>
    </div>
  </section>

  <div class="sts" id="sts"></div>

  <div class="tabs" id="tabs"></div>
  <section id="paneposts">
    <div class="grid" id="grid"></div>
    <div class="empty hidden" id="noPosts"><div class="big">🎬</div><span id="noTxt"></span><br><button id="noBtn" onclick="openVideoModal()">Share your first video</button></div>
  </section>
  <section id="paneabout" class="about hidden"></section>
</main>

<nav class="nav" id="nav"></nav>

<div class="viewer" id="viewer">
  <div class="vtop"><button onclick="closeViewer()" id="vBack"></button><div class="t" id="vTitle"></div><button id="vDel" onclick="deletePost()"></button></div>
  <div class="vbody"><video id="vVideo" controls playsinline></video></div>
  <div class="vinfo" id="vInfo"></div>
</div>

<div class="sbg" id="sbg" onclick="if(event.target.id==='sbg')closeSheet()"><div class="sheet" id="sheet"></div></div>
<input type="file" id="photoInput" accept="image/*" style="display:none" onchange="changePhoto(event)">
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL="https://eqglttfffhvoyvrclzse.supabase.co";
const SUPABASE_KEY="sb_publishable_rR4xxl0dW5DJrhhjqiFHLw_uJ-HakAb";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
const escA=t=>String(t??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/'/g,"&#39;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function lsGet(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const ago=v=>{const s=(Date.now()-new Date(v))/1000;return s<60?"now":s<3600?Math.floor(s/60)+"m":s<86400?Math.floor(s/3600)+"h":Math.floor(s/86400)+"d"};
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2600)}
document.documentElement.dataset.theme=lsGet("gs_theme","dark");

const P={home:'<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/>',plus:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/>',reel:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M3 9h18M9 3l3 6M15 3l3 6"/><path d="M10 13l5 3-5 3z"/>',send:'<path d="M22 3L9.500 13.500M22 3l-7 18-5.500-7.500L2 9z"/>',mark:'<path d="M6 3h12v18l-6-5-6 5z"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',back:'<path d="M15 5l-7 7 7 7"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.500v.1"/>',userplus:'<circle cx="10" cy="8" r="4"/><path d="M3 21a7 7 0 0114 0M19 8v6M16 11h6"/>'};
const ic=n=>`<svg viewBox="0 0 24 24">${P[n]}</svg>`;
$("bP").innerHTML=ic("plus");$("bX").innerHTML=ic("menu");$("bA").innerHTML=ic("userplus");$("vBack").innerHTML=ic("back");$("vDel").innerHTML=ic("trash");

let me=null,PR={},uname="User",posts=[],saved=[],shown=[],LK={},CC={},tab="posts",openId=null;
let FOLLOWERS=[],FOLLOWING=[],MS=[],SVW=[],vmode="post",UM="post",socialReady=true;

/* NAV */
function photoHtml(){const ph=localStorage.getItem("profilePhoto");return ph?`<img src="${escA(ph)}">`:escA(uname.charAt(0).toUpperCase())}
function buildNav(){$("nav").innerHTML=`<button onclick="location.href='timepass.html'">${ic("home")}</button><button onclick="location.href='reels.html'">${ic("reel")}</button><button onclick="location.href='Junkfile.html'">${ic("send")}</button><button onclick="location.href='vibesearch.html'">${ic("search")}</button><button class="on"><div class="av2">${photoHtml()}</div></button>`}
buildNav();

/* TABS */
function drawTabs(){$("tabs").innerHTML=[["posts","grid"],["saved","mark"],["about","info"]].map(t=>`<button class="${tab===t[0]?"on":""}" onclick="setTab('${t[0]}')">${ic(t[1])}</button>`).join("")}
async function setTab(t){tab=t;drawTabs();$("paneposts").classList.toggle("hidden",t==="about");$("paneabout").classList.toggle("hidden",t!=="about");if(t==="saved")await loadSaved();draw()}

/* LOAD */
async function loadProfile(){
  try{
    const {data,error}=await supabaseClient.auth.getUser();
    if(error||!data.user){location.href="username.html";return}
    me=data.user;
    const {data:pr,error:pe}=await supabaseClient.from("Profiles").select("*").eq("id",me.id).maybeSingle();
    if(pe)console.error("PROFILE ERROR:",pe);
    PR=pr||{};uname=PR.username||(me.user_metadata||{}).username||"User";
    $("hname").textContent=uname;$("name").textContent=PR.full_name||uname;
    $("bioSchool").textContent=PR.school?"🏫 "+PR.school+(PR.class_name?" • "+PR.class_name:"")+(PR.medium?" • "+PR.medium:""):"";
    $("bioCity").textContent=PR.city?"📍 "+PR.city:"";$("bioGoal").textContent=PR.career_goal?"🎯 "+PR.career_goal:"";
    const ph=localStorage.getItem("profilePhoto");$("avatar").innerHTML=ph?`<img src="${escA(ph)}">`:escA(uname.charAt(0).toUpperCase());
    const rows=[["Full Name",PR.full_name],["Email",me.email],["Date of Birth",PR.dob],["School / College",PR.school],["Class",PR.class_name],["Medium",PR.medium],["City / Village",PR.city],["Career Goal",PR.career_goal],["Mobile",PR.mobile],["GyanSetu ID",me.id]];
    $("paneabout").innerHTML=rows.map(r=>`<div class="arow"><span>${r[0]}</span><span>${escA(r[1]||"-")}</span></div>`).join("");
    buildNav();drawTabs();loadSocial();loadPosts();
  }catch(e){console.error("LOAD PROFILE ERROR:",e);location.href="username.html"}
}
async function loadSocial(){
  const [a,b]=await Promise.all([supabaseClient.from("Follows").select("follower_id").eq("following_id",me.id),supabaseClient.from("Follows").select("following_id").eq("follower_id",me.id)]);
  socialReady=!a.error&&!b.error;
  FOLLOWERS=(a.data||[]).map(r=>r.follower_id);FOLLOWING=(b.data||[]).map(r=>r.following_id);
  $("stFol").textContent=FOLLOWERS.length;$("stFing").textContent=FOLLOWING.length;
  await loadMyStories();
}
async function loadMyStories(){
  const since=new Date(Date.now()-24*3600e3).toISOString();
  const {data,error}=await supabaseClient.from("Stories").select("*").eq("user_id",me.id).gte("created_at",since).order("created_at",{ascending:true});
  MS=error?[]:(data||[]);SVW=[];
  if(MS.length){const {data:v}=await supabaseClient.from("StoryViews").select("*").in("story_id",MS.map(s=>s.id)).order("created_at",{ascending:false});SVW=v||[]}
  $("aring").classList.toggle("has",MS.length>0);
  $("sts").innerHTML=MS.map((s,i)=>`<div class="st1" onclick="openStoryView(${i})"><div class="c"><div><video src="${escA(s.video_url)}#t=0.5" preload="metadata" muted playsinline></video></div></div><span>👁 ${SVW.filter(x=>x.story_id===s.id).length}</span></div>`).join("")+`<div class="st1" onclick="openVideoModal('story')"><div class="nw">+</div><span>New story</span></div>`;
}
async function loadPosts(){
  const {data,error}=await supabaseClient.from("Videos").select("*").eq("user_id",me.id);
  if(error){console.error(error);return toast("Posts load झाले नाहीत")}
  posts=(data||[]).sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
  const ids=posts.map(p=>String(p.id));LK={};CC={};
  if(ids.length){
    const [l,c]=await Promise.all([supabaseClient.from("VideoLikes").select("video_id").in("video_id",ids),supabaseClient.from("VideoComments").select("video_id").in("video_id",ids)]);
    (l.data||[]).forEach(r=>{const k=String(r.video_id);LK[k]=(LK[k]||0)+1});(c.data||[]).forEach(r=>{const k=String(r.video_id);CC[k]=(CC[k]||0)+1});
  }
  draw();
}
async function loadSaved(){
  const ids=lsGet("gs_saved_videos",[]);if(!ids.length){saved=[];return}
  const {data}=await supabaseClient.from("Videos").select("*").in("id",ids);
  saved=(data||[]).sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
}
function draw(){
  $("stPosts").textContent=posts.length;
  $("bioStat").textContent=`❤️ ${posts.reduce((a,p)=>a+(LK[String(p.id)]||0),0)} likes  •  💬 ${posts.reduce((a,p)=>a+(CC[String(p.id)]||0),0)} comments`;
  if(tab==="about")return;
  shown=tab==="saved"?saved:posts;
  $("noPosts").classList.toggle("hidden",shown.length>0);
  $("noTxt").textContent=tab==="saved"?"अजून काहीही save केलेले नाही.":"अजून एकही post नाही.";
  $("noBtn").style.display=tab==="saved"?"none":"";
  $("grid").innerHTML=shown.map((p,i)=>`<div class="cell" onclick="openPost(${i})"><video src="${escA(p.video_url)}#t=0.5" preload="metadata" muted playsinline></video><span class="pi">${ic("reel")}</span><div class="ct">♥ ${LK[String(p.id)]||0}</div></div>`).join("");
}
function avatarTap(){if(MS.length)openStoryView(0);else $("photoInput").click()}

/* FOLLOWERS / FOLLOWING / DISCOVER */
const fRow=(p,mineSet)=>`<div class="row"><div class="mini">${escA((p.username||p.full_name||"?").charAt(0).toUpperCase())}</div><b style="font-weight:600">${escA(p.username||p.full_name||"User")}</b>${p.id===me.id?"":`<button class="fb ${mineSet.has(p.id)?"on":""}" data-f="${escA(p.id)}" onclick="toggleF('${escA(p.id)}',this)">${mineSet.has(p.id)?"Following":(FOLLOWERS.includes(p.id)?"Follow back":"Follow")}</button>`}</div>`;
async function openFollow(kind){
  const ids=kind==="followers"?FOLLOWERS:FOLLOWING;
  openSheet(`<h3>${kind==="followers"?"Followers":"Following"}</h3><div id="fl"><p>Loading...</p></div>`);
  if(!ids.length){$("fl").innerHTML=`<div class="empty" style="padding:30px 0">${kind==="followers"?"अजून कोणी Follow केले नाही.":"तुम्ही अजून कोणाला Follow करत नाही."}</div>`;return}
  const {data}=await supabaseClient.from("Profiles").select("id,username,full_name").in("id",ids);
  const set=new Set(FOLLOWING);$("fl").innerHTML=(data||[]).map(p=>fRow(p,set)).join("")||"<p>कोणी सापडले नाही.</p>";
}
async function openDiscover(){
  openSheet(`<h3>लोक शोधा</h3><div id="fl"><p>Loading...</p></div>`);
  const {data}=await supabaseClient.from("Profiles").select("id,username,full_name").neq("id",me.id).limit(50);
  const set=new Set(FOLLOWING);$("fl").innerHTML=(data||[]).map(p=>fRow(p,set)).join("")||"<p>दुसरे users सापडले नाहीत.</p>";
}
async function toggleF(uid,btn){
  if(!socialReady)return toast("Follows table तयार नाही (setup.sql चालवा)");
  const was=FOLLOWING.includes(uid),q=supabaseClient.from("Follows");btn.disabled=true;
  const {error}=was?await q.delete().eq("follower_id",me.id).eq("following_id",uid):await q.insert({follower_id:me.id,following_id:uid});
  btn.disabled=false;if(error)return toast("बदलता आले नाही");
  FOLLOWING=was?FOLLOWING.filter(x=>x!==uid):[...FOLLOWING,uid];
  btn.classList.toggle("on",!was);btn.textContent=was?(FOLLOWERS.includes(uid)?"Follow back":"Follow"):"Following";
  $("stFing").textContent=FOLLOWING.length;
}

/* VIEWER (post + story) */
function openPost(i){
  const p=shown[i];if(!p)return;openId=p.id;vmode="post";
  const mine=p.user_id===me.id,k=String(p.id);
  $("vTitle").textContent=p.username||uname;$("vDel").style.display=mine?"":"none";
  const d=p.created_at?new Date(p.created_at).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}):"";
  $("vInfo").innerHTML=`<div class="vcnt"><span>❤️ ${LK[k]||0}</span><span>💬 ${CC[k]||0}</span><a onclick="location.href='timepass.html?v=${encodeURIComponent(p.id)}'">Comments बघा</a></div><b>${escA(p.title||"")}</b>${p.description?"<br>"+escA(p.description):""}<br><small>${d}</small>`;
  const v=$("vVideo");v.src=p.video_url;$("viewer").classList.add("show");v.play().catch(()=>{});
}
function openStoryView(i){
  const s=MS[i];if(!s)return;openId=s.id;vmode="story";
  const L=SVW.filter(x=>x.story_id===s.id);
  $("vTitle").textContent="तुमची story • "+ago(s.created_at);$("vDel").style.display="";
  $("vInfo").innerHTML=(s.caption?`<b>${escA(s.caption)}</b><br>`:"")+`<div class="vcnt"><span>👁 ${L.length} जणांनी पाहिले</span></div>`+(L.map(x=>`<div class="vw"><div class="mini" style="width:32px;height:32px;font-size:13px">${escA((x.viewer_name||"?").charAt(0).toUpperCase())}</div>${escA(x.viewer_name||"User")}<small>${ago(x.created_at)}</small></div>`).join("")||"<small>अजून कोणी पाहिले नाही</small>");
  const v=$("vVideo");v.src=s.video_url;$("viewer").classList.add("show");v.play().catch(()=>{});
}
function closeViewer(){const v=$("vVideo");v.pause();v.removeAttribute("src");v.load();$("viewer").classList.remove("show");openId=null}
async function deletePost(){
  if(vmode==="story"){
    if(!openId||!confirm("ही story delete करायची?"))return;
    const {error}=await supabaseClient.from("Stories").delete().eq("id",openId).eq("user_id",me.id);
    if(error)return toast("Delete झाले नाही");
    closeViewer();await loadMyStories();toast("Story delete झाली");return;
  }
  const p=posts.find(x=>x.id===openId);if(!p||!confirm("हा video delete करायचा आहे का?"))return;
  try{await supabaseClient.from("VideoLikes").delete().eq("video_id",String(p.id))}catch(e){}
  try{await supabaseClient.from("VideoComments").delete().eq("video_id",String(p.id))}catch(e){}
  const {error}=await supabaseClient.from("Videos").delete().eq("id",p.id).eq("user_id",me.id);
  if(error){console.error(error);return toast("Delete झाले नाही")}
  try{const m=String(p.video_url).split("/videos/")[1];if(m)await supabaseClient.storage.from("videos").remove([decodeURIComponent(m.split("?")[0])])}catch(e){}
  closeViewer();posts=posts.filter(x=>x.id!==p.id);draw();toast("Video delete झाला");
}

function closeSheet(){$("sbg").classList.remove("show")}

function privacySheet(){openSheet(`<h3>🛡️ Privacy Policy</h3><p><b>आम्ही काय साठवतो:</b> तुमचे email/username, profile माहिती, तुम्ही post केलेले videos आणि stories, likes, comments, followers आणि तुमची story कोणी पाहिली ही माहिती.</p><p><b>कुठे:</b> हा data Supabase वर साठवला जातो. आम्ही तो कोणाला विकत नाही.</p><p><b>Public content:</b> तुमचे videos, stories आणि comments इतरांना दिसतात. फोन नंबर, पैसे, पासवर्ड किंवा खाजगी माहिती टाकू नका.</p><p><b>तुमचे नियंत्रण:</b> तुम्ही तुमची माहिती edit करू शकता आणि videos/stories/comments कधीही delete करू शकता. Stories 24 तासांनी दिसणे बंद होतात.</p><p><b>फोनवर साठवलेले:</b> Profile photo, Saved videos, Theme फक्त तुमच्या browser मध्ये साठवले जातात.</p><p><b>नियम:</b> अश्लील, त्रासदायक किंवा बेकायदेशीर content ला परवानगी नाही.</p><p style="font-size:11.5px">हा सामान्य मसुदा आहे; app प्रसिद्ध करण्यापूर्वी आपला संपर्क/email जोडा आणि कायदेशीर तपासणी करा.</p><button class="pbtn" onclick="closeSheet()">ठीक आहे</button>`)}
async function shareProfile(){
  const url=location.href,t=uname+" - GyanSetu";
  try{if(navigator.share){await navigator.share({title:t,url});return}}catch(e){if(e&&e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(url);toast("✅ Link copy झाली")}catch(e){prompt("Link copy करा:",url)}
}

/* UPLOAD (Post / Story) */
function openVideoModal(m){UM=m==="story"?"story":"post";upSheet()}
function upSheet(){
  const p=UM==="post";
  openSheet(`<h3>नवीन ${p?"Video":"Story"}</h3><div class="seg"><button class="${p?"on":""}" onclick="UM='post';upSheet()">Post</button><button class="${p?"":"on"}" onclick="UM='story';upSheet()">Story (24 तास)</button></div><label>Video निवडा</label><input type="file" id="videoInput" accept="video/*">${p?'<label>Title</label><input id="videoTitle" maxlength="150" placeholder="Video चे नाव">':""}<label>Caption</label><textarea id="videoDescription" maxlength="2000" placeholder="${p?"या video बद्दल थोडी माहिती लिहा...":"Story caption (optional)"}"></textarea><button class="pbtn" id="uploadButton" onclick="uploadVideo()">${p?"Share":"Story टाका"}</button><button class="cbtn" onclick="closeSheet()">Cancel</button>`);
}
async function uploadVideo(){
  if(!me)return toast("Please login first.");
  const isS=UM==="story",file=$("videoInput").files[0],title=isS?"":$("videoTitle").value.trim(),description=$("videoDescription").value.trim();
  if(!file)return toast("Video select करा.");if(!file.type.startsWith("video/"))return toast("फक्त video file निवडा.");
  if(!isS&&!title)return toast("Video title टाका.");if(file.size>100*1024*1024)return toast("Video 100 MB पेक्षा कमी असावा.");
  const b=$("uploadButton");b.disabled=true;b.textContent="Uploading...";
  try{
    const ext=file.name.split(".").pop().toLowerCase()||"mp4",path=me.id+"/"+(isS?"s_":"")+Date.now()+"-"+Math.random().toString(36).substring(2,8)+"."+ext;
    const {error:u}=await supabaseClient.storage.from("videos").upload(path,file,{cacheControl:"3600",upsert:false,contentType:file.type});if(u)throw u;
    const {data:ud}=supabaseClient.storage.from("videos").getPublicUrl(path);
    const {error:d}=isS?await supabaseClient.from("Stories").insert({user_id:me.id,username:uname,caption:description,video_url:ud.publicUrl}):await supabaseClient.from("Videos").insert({user_id:me.id,username:uname,title,description,video_url:ud.publicUrl});if(d)throw d;
    closeSheet();toast(isS?"✅ Story टाकली!":"✅ Video post झाला!");
    if(isS)await loadMyStories();else{await setTab("posts");await loadPosts()}
  }catch(e){console.error("UPLOAD ERROR:",e);toast("Upload failed.");b.disabled=false;b.textContent=isS?"Story टाका":"Share"}
}

/* EDIT PROFILE */
function openEdit(){
  const f=(id,l,v,t)=>`<label>${l}</label><input id="${id}" type="${t||"text"}" value="${escA(v||"")}">`;
  openSheet(`<h3>Edit profile</h3>${f("eFull","Full Name",PR.full_name)}${f("eDob","Date of Birth",PR.dob,"date")}${f("eSchool","School / College",PR.school)}${f("eClass","Class",PR.class_name)}${f("eMed","Medium",PR.medium)}${f("eCity","City / Village",PR.city)}${f("eCareer","Career Goal",PR.career_goal)}${f("eMob","Mobile",PR.mobile)}<button class="pbtn" onclick="saveInformation()">Save</button><button class="cbtn" onclick="closeSheet()">Cancel</button>`);
}
async function saveInformation(){
  if(!me)return toast("Please login first.");
  const d={full_name:$("eFull").value.trim(),dob:$("eDob").value||null,school:$("eSchool").value.trim(),class_name:$("eClass").value.trim(),medium:$("eMed").value.trim(),city:$("eCity").value.trim(),career_goal:$("eCareer").value.trim(),mobile:$("eMob").value.trim(),email:me.email};
  const {error}=await supabaseClient.from("Profiles").update(d).eq("id",me.id);
  if(error){console.error("SAVE PROFILE ERROR:",error);return toast("Information save झाली नाही.")}
  closeSheet();await loadProfile();toast("Information saved.");
}
function changePhoto(ev){
  const f=ev.target.files[0];if(!f)return;if(!f.type.startsWith("image/"))return toast("फक्त image select करा.");
  const r=new FileReader();r.onload=e=>{localStorage.setItem("profilePhoto",e.target.result);$("avatar").innerHTML=`<img src="${escA(e.target.result)}">`;buildNav();toast("Profile photo updated.")};r.readAsDataURL(f);
}
async function logoutUser(){
  if(!confirm("तुम्हाला GyanSetu मधून logout करायचे आहे का?"))return;
  try{
    const {error}=await supabaseClient.auth.signOut();if(error){console.error(error);return toast("Logout failed.")}
    ["gyansetu_username","gyansetu_email","gyansetu_user_id","profilePhoto"].forEach(k=>localStorage.removeItem(k));
    location.href="username.html";
  }catch(e){console.error(e);toast("Logout failed.")}
}
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if($("viewer").classList.contains("show"))closeViewer();else closeSheet()});
loadProfile();
</script>

i.style.width=(b.offsetWidth-6)+"px";i.style.transform="translateX("+(b.offsetLeft+3)+"px)"}
