<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Messages - VIBRA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
      padding-bottom: 80px;
    }

    .top {
      background: white;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 1px solid #ddd;
    }

    .message {
      background: white;
      margin: 12px 20px;
      padding: 16px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #ddd;
    }

    .message b {
      font-size: 17px;
    }

    .message p {
      margin-top: 5px;
      color: #777;
      font-size: 14px;
    }

    .empty {
      text-align: center;
      margin-top: 50px;
      color: #777;
    }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 65px;
      background: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #ddd;
      font-size: 28px;
    }

    .bottom a {
      color: #111;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="top">
    Messages ✉
  </div>

  <div class="message">
    <div class="avatar"></div>

    <div>
      <b>Hitesh</b>
      <p>Welcome to VIBRA 👋</p>
    </div>
  </div>

  <div class="message">
    <div class="avatar"></div>

    <div>
      <b>Krishna</b>
      <p>Hello!</p>
    </div>
  </div>

  <div class="empty">
    More messages will appear here.
  </div>

  <div class="bottom">
    <a href="index.html">⌂</a>
    <a href="search.html">⌕</a>
    <a href="create.html">＋</a>
    <a href="likes.html">♡</a>
    <a href="profile.html">◯</a>
  </div>

</body>
</html>
