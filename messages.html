<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAMSENA Messages</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
}

.header {
    height: 72px;
    background: #111;
    border-bottom: 3px solid #ff7a00;
    display: flex;
    align-items: center;
    padding: 0 18px;
}

.logo {
    font-size: 32px;
    margin-right: 10px;
}

.title {
    color: #ff7a00;
    font-size: 27px;
    font-weight: bold;
}

.search-box {
    margin: 18px;
    background: #222;
    border: 2px solid #333;
    border-radius: 30px;
    padding: 13px 18px;
}

.search-box input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font-size: 17px;
}

.search-box input::placeholder {
    color: #999;
}

.section-title {
    color: #ff7a00;
    font-size: 20px;
    font-weight: bold;
    margin: 20px;
}

.user {
    display: flex;
    align-items: center;
    padding: 14px 20px;
    border-bottom: 1px solid #222;
    cursor: pointer;
}

.user-avatar {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: #222;
    border: 2px solid #ff7a00;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin-right: 14px;
}

.user-info {
    flex: 1;
}

.user-name {
    font-size: 18px;
    font-weight: bold;
}

.last-message {
    color: #999;
    font-size: 14px;
    margin-top: 5px;
}

.time {
    color: #777;
    font-size: 12px;
}

.bottom {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 75px;
    background: #111;
    border-top: 2px solid #222;
    display: flex;
    justify-content: space-around;
    align-items: center;
}

.bottom-item {
    text-align: center;
    font-size: 13px;
    cursor: pointer;
}

.bottom-icon {
    display: block;
    font-size: 27px;
    margin-bottom: 3px;
}

</style>
</head>

<body>

<div class="header">
    <div class="logo">🐯</div>
    <div class="title">Messages</div>
</div>

<div class="search-box">
    <input type="text" placeholder="🔍 Search users..." onkeyup="searchUsers(this.value)">
</div>

<div class="section-title">Chats</div>

<div id="userList">

    <div class="user" onclick="openChat('Hitesh')">
        <div class="user-avatar">🐯</div>
        <div class="user-info">
            <div class="user-name">Hitesh</div>
            <div class="last-message">Start a conversation</div>
        </div>
        <div class="time">Now</div>
    </div>

    <div class="user" onclick="openChat('Krishna')">
        <div class="user-avatar">🏏</div>
        <div class="user-info">
            <div class="user-name">Krishna</div>
            <div class="last-message">Start a conversation</div>
        </div>
        <div class="time">Now</div>
    </div>

</div>

<div class="bottom">

    <div class="bottom-item" onclick="location.href='wall.html'">
        <span class="bottom-icon">🏠</span>
        Home
    </div>

    <div class="bottom-item">
        <span class="bottom-icon">💬</span>
        Messages
    </div>

    <div class="bottom-item">
        <span class="bottom-icon">🎬</span>
        Reels
    </div>

    <div class="bottom-item" onclick="location.href='profile.html'">
        <span class="bottom-icon">👤</span>
        Profile
    </div>

</div>

<script>

function openChat(name) {
    alert("Chat with " + name + " will open here.");
}

function searchUsers(value) {
    const users = document.querySelectorAll(".user");
    value = value.toLowerCase();

    users.forEach(function(user) {
        const name = user.querySelector(".user-name").innerText.toLowerCase();

        if (name.includes(value)) {
            user.style.display = "flex";
        } else {
            user.style.display = "none";
        }
    });
}

</script>

</body>
  </html>
