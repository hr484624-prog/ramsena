<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Search - VIBRA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
      padding-bottom: 80px;
    }

    .top {
      background: white;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 1px solid #ddd;
    }

    .search-box {
      padding: 20px;
    }

    .search-box input {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid #ccc;
      border-radius: 25px;
      font-size: 16px;
      outline: none;
    }

    .players {
      padding: 0 20px;
    }

    .player {
      background: white;
      padding: 15px;
      margin-bottom: 12px;
      border-radius: 12px;
      cursor: pointer;
      border: 1px solid #eee;
    }

    .player b {
      font-size: 18px;
    }

    .player p {
      margin-top: 5px;
      color: #777;
    }

    .no-result {
      text-align: center;
      color: #777;
      margin-top: 30px;
      display: none;
    }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 65px;
      background: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #ddd;
      font-size: 28px;
    }

    .bottom a {
      color: #111;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="top">
    Search 🔍
  </div>

  <div class="search-box">
    <input
      type="text"
      id="searchInput"
      placeholder="Search player..."
      onkeyup="searchPlayers()"
    >
  </div>

  <div class="players" id="players">

    <div class="player" onclick="openProfile('hitesh')">
      <b>Hitesh</b>
      <p>Player</p>
    </div>

    <div class="player" onclick="openProfile('ramsena')">
      <b>Ramsena</b>
      <p>Player</p>
    </div>

    <div class="player" onclick="openProfile('siddharth')">
      <b>Siddharth</b>
      <p>Player</p>
    </div>

  </div>

  <div class="no-result" id="noResult">
    No player found 😕
  </div>

  <div class="bottom">
    <a href="index.html">⌂</a>
    <span>⌕</span>
    <span>＋</span>
    <span>♡</span>
    <a href="profile.html">◯</a>
  </div>

  <script>

    function searchPlayers() {

      let input = document
        .getElementById("searchInput")
        .value
        .toLowerCase();

      let players = document
        .querySelectorAll(".player");

      let found = false;

      players.forEach(function(player) {

        let name = player
          .querySelector("b")
          .innerText
          .toLowerCase();

        if (name.includes(input)) {
          player.style.display = "block";
          found = true;
        } else {
          player.style.display = "none";
        }

      });

      document.getElementById("noResult").style.display =
        found ? "none" : "block";
    }

    function openProfile(name) {

      if (name === "hitesh") {
        window.location.href = "profile.html";
      }

      if (name === "ramsena") {
        window.location.href = "profile.html";
      }

      if (name === "siddharth") {
        window.location.href = "profile.html";
      }

    }

  </script>

</body>
</html>
