<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dragon Game</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

body{
    overflow:hidden;
    background:#050914;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
    background:linear-gradient(#07142b,#10294a 55%,#050914);
}

#ui{
    position:fixed;
    top:15px;
    left:15px;
    right:15px;
    display:flex;
    justify-content:space-between;
    color:white;
    font-weight:bold;
    pointer-events:none;
    z-index:5;
}

.box{
    background:rgba(0,0,0,.45);
    padding:10px 15px;
    border-radius:12px;
    backdrop-filter:blur(5px);
}

#start{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.55);
    z-index:10;
}

.panel{
    width:min(90%,380px);
    padding:30px;
    text-align:center;
    color:white;
    background:#101b31;
    border:2px solid #31578f;
    border-radius:22px;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.panel h1{
    font-size:35px;
    margin-bottom:12px;
}

.panel p{
    opacity:.8;
    margin-bottom:20px;
    line-height:1.5;
}

button{
    border:0;
    padding:13px 25px;
    border-radius:12px;
    background:#2675ff;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

#gameOver{
    display:none;
    position:fixed;
    inset:0;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.65);
    z-index:10;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
    <div class="box">🐉 Dragon</div>
    <div class="box">⭐ Score: <span id="score">0</span></div>
</div>

<div id="start">
    <div class="panel">
        <h1>🐉 Dragon Flight</h1>
        <p>
            Control the dragon with your mouse or finger.<br>
            Collect stars and avoid the rocks!
        </p>
        <button onclick="startGame()">START GAME</button>
    </div>
</div>

<div id="gameOver">
    <div class="panel">
        <h1>Game Over 💥</h1>
        <p>Your Score: <b id="finalScore">0</b></p>
        <button onclick="restartGame()">PLAY AGAIN</button>
    </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W,H;
let running=false;
let score=0;
let lastTime=0;

const Input={
    mouse:{
        x:0,
        y:0,
        left:false,
        middle:false,
        right:false
    }
};

function resize(){
    W=canvas.width=window.innerWidth;
    H=canvas.height=window.innerHeight;
}

resize();
window.addEventListener("resize",resize);


/* =========================
   MOUSE INPUT
========================= */

canvas.addEventListener("mousemove",function(event){
    Input.mouse.x=event.clientX;
    Input.mouse.y=event.clientY;
});

canvas.addEventListener("mousedown",function(event){
    if(event.button===0){
        Input.mouse.left=true;
    }

    if(event.button===1){
        Input.mouse.middle=true;
    }

    if(event.button===2){
        Input.mouse.right=true;
    }
});

document.addEventListener("mouseup",function(event){

    if(event.button===0){
        Input.mouse.left=false;
    }

    if(event.button===1){
        Input.mouse.middle=false;
    }

    if(event.button===2){
        Input.mouse.right=false;
    }

});


/* =========================
   TOUCH INPUT
========================= */

canvas.addEventListener("touchstart",function(e){
    const t=e.touches[0];

    Input.mouse.x=t.clientX;
    Input.mouse.y=t.clientY;
    Input.mouse.left=true;

    e.preventDefault();
},{passive:false});

canvas.addEventListener("touchmove",function(e){
    const t=e.touches[0];

    Input.mouse.x=t.clientX;
    Input.mouse.y=t.clientY;

    e.preventDefault();
},{passive:false});

canvas.addEventListener("touchend",function(){
    Input.mouse.left=false;
});


/* =========================
   DRAGON
========================= */

const dragon={
    x:180,
    y:300,
    vx:0,
    vy:0,
    size:48,
    angle:0
};


/* =========================
   STARS
========================= */

let stars=[];

function createStar(){

    stars.push({
        x:W+50,
        y:70+Math.random()*(H-140),
        r:10+Math.random()*7,
        speed:3+Math.random()*2,
        rotation:Math.random()*Math.PI*2
    });

}


/* =========================
   ROCKS
========================= */

let rocks=[];

function createRock(){

    const size=30+Math.random()*45;

    rocks.push({
        x:W+80,
        y:80+Math.random()*(H-160),
        size:size,
        speed:3.5+Math.random()*2
    });

}


/* =========================
   CLOUDS
========================= */

let clouds=[];

for(let i=0;i<12;i++){

    clouds.push({
        x:Math.random()*W,
        y:40+Math.random()*H*.55,
        size:30+Math.random()*70,
        speed:.3+Math.random()*.5
    });

}


/* =========================
   BACKGROUND
========================= */

function drawBackground(){

    const gradient=ctx.createLinearGradient(0,0,0,H);

    gradient.addColorStop(0,"#07142b");
    gradient.addColorStop(.55,"#12335a");
    gradient.addColorStop(1,"#050914");

    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,W,H);

    /* moon */

    ctx.beginPath();
    ctx.arc(W-100,100,45,0,Math.PI*2);
    ctx.fillStyle="#e9f3ff";
    ctx.fill();

    /* stars */

    for(let i=0;i<70;i++){

        const x=(i*137)%W;
        const y=(i*83)%H;

        ctx.fillStyle="rgba(255,255,255,.7)";
        ctx.fillRect(x,y,2,2);
    }

    /* clouds */

    for(const c of clouds){

        c.x-=c.speed;

        if(c.x<-150){
            c.x=W+150;
        }

        ctx.fillStyle="rgba(255,255,255,.08)";

        ctx.beginPath();
        ctx.arc(c.x,c.y,c.size*.35,0,Math.PI*2);
        ctx.arc(c.x+c.size*.3,c.y-15,c.size*.45,0,Math.PI*2);
        ctx.arc(c.x+c.size*.65,c.y,c.size*.35,0,Math.PI*2);
        ctx.fill();
    }

    /* ground */

    ctx.fillStyle="#07101c";
    ctx.fillRect(0,H-50,W,50);

}


/* =========================
   DRAW STAR
========================= */

function drawStar(s){

    ctx.save();

    ctx.translate(s.x,s.y);
    ctx.rotate(s.rotation);

    ctx.beginPath();

    for(let i=0;i<10;i++){

        const r=i%2===0?s.r:s.r*.45;
        const a=-Math.PI/2+i*Math.PI/5;

        const x=Math.cos(a)*r;
        const y=Math.sin(a)*r;

        if(i===0)ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
    }

    ctx.closePath();

    ctx.fillStyle="#ffe66d";
    ctx.shadowColor="#fff1a8";
    ctx.shadowBlur=15;
    ctx.fill();

    ctx.restore();
}


/* =========================
   DRAW ROCK
========================= */

function drawRock(r){

    ctx.save();

    ctx.translate(r.x,r.y);

    ctx.fillStyle="#596579";

    ctx.beginPath();

    ctx.moveTo(-r.size*.5,r.size*.4);
    ctx.lineTo(-r.size*.35,-r.size*.35);
    ctx.lineTo(-r.size*.05,-r.size*.6);
    ctx.lineTo(r.size*.45,-r.size*.35);
    ctx.lineTo(r.size*.55,r.size*.35);
    ctx.lineTo(r.size*.15,r.size*.55);
    ctx.closePath();

    ctx.fill();

    ctx.fillStyle="rgba(255,255,255,.15)";

    ctx.beginPath();
    ctx.moveTo(-r.size*.25,-r.size*.3);
    ctx.lineTo(-r.size*.05,-r.size*.48);
    ctx.lineTo(r.size*.15,-r.size*.3);
    ctx.lineTo(0,-r.size*.1);
    ctx.closePath();

    ctx.fill();

    ctx.restore();
}


/* =========================
   DRAW DRAGON
========================= */

function drawDragon(){

    ctx.save();

    ctx.translate(dragon.x,dragon.y);
    ctx.rotate(dragon.angle);

    /* tail */

    ctx.beginPath();
    ctx.moveTo(-28,8);
    ctx.quadraticCurveTo(-55,25,-75,5);
    ctx.quadraticCurveTo(-52,4,-35,-8);

    ctx.fillStyle="#9b3cff";
    ctx.fill();

    /* left wing */

    ctx.beginPath();
    ctx.moveTo(-5,-12);
    ctx.lineTo(-35,-55);
    ctx.lineTo(-10,-38);
    ctx.lineTo(8,-60);
    ctx.lineTo(15,-10);
    ctx.closePath();

    ctx.fillStyle="#6f2ed8";
    ctx.fill();

    /* right wing */

    ctx.beginPath();
    ctx.moveTo(4,-8);
    ctx.lineTo(38,-48);
    ctx.lineTo(28,-18);
    ctx.lineTo(52,-28);
    ctx.lineTo(25,10);
    ctx.closePath();

    ctx.fillStyle="#8435ed";
    ctx.fill();

    /* body */

    ctx.beginPath();
    ctx.ellipse(0,0,35,23,0,0,Math.PI*2);

    ctx.fillStyle="#a83cff";
    ctx.shadowColor="#8d32ff";
    ctx.shadowBlur=15;
    ctx.fill();

    /* head */

    ctx.shadowBlur=0;

    ctx.beginPath();
    ctx.arc(30,-10,24,0,Math.PI*2);

    ctx.fillStyle="#b84dff";
    ctx.fill();

    /* snout */

    ctx.beginPath();
    ctx.ellipse(48,-5,15,9,0,0,Math.PI*2);

    ctx.fillStyle="#c65aff";
    ctx.fill();

    /* eye */

    ctx.beginPath();
    ctx.arc(37,-17,5,0,Math.PI*2);

    ctx.fillStyle="#fff";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(39,-17,2,0,Math.PI*2);

    ctx.fillStyle="#111";
    ctx.fill();

    /* horn */

    ctx.beginPath();
    ctx.moveTo(25,-28);
    ctx.lineTo(18,-48);
    ctx.lineTo(32,-34);
    ctx.closePath();

    ctx.fillStyle="#f1d5ff";
    ctx.fill();

    /* nostril */

    ctx.beginPath();
    ctx.arc(55,-6,2,0,Math.PI*2);

    ctx.fillStyle="#291033";
    ctx.fill();

    /* fire */

    ctx.beginPath();
    ctx.moveTo(61,-2);
    ctx.lineTo(90,8);
    ctx.lineTo(64,13);
    ctx.lineTo(78,23);
    ctx.lineTo(54,12);
    ctx.closePath();

    ctx.fillStyle="#ff9f1c";
    ctx.shadowColor="#ff6b00";
    ctx.shadowBlur=12;
    ctx.fill();

    ctx.restore();
}


/* =========================
   COLLISION
========================= */

function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );
}


/* =========================
   UPDATE
========================= */

function update(){

    if(!running)return;

    /* dragon movement */

    const targetX=Math.max(
        70,
        Math.min(W*.38,Input.mouse.x)
    );

    const targetY=Math.max(
        70,
        Math.min(H-80,Input.mouse.y)
    );

    dragon.vx+=(targetX-dragon.x)*.015;
    dragon.vy+=(targetY-dragon.y)*.015;

    dragon.vx*=.88;
    dragon.vy*=.88;

    dragon.x+=dragon.vx;
    dragon.y+=dragon.vy;

    dragon.angle=dragon.vy*.025;

    /* stars */

    for(let i=stars.length-1;i>=0;i--){

        const s=stars[i];

        s.x-=s.speed;
        s.rotation+=.04;

        if(distance(dragon,s)<dragon.size+s.r){

            stars.splice(i,1);

            score+=10;

            document.getElementById("score").textContent=score;

            continue;
        }

        if(s.x<-50){
            stars.splice(i,1);
        }
    }

    /* rocks */

    for(let i=rocks.length-1;i>=0;i--){

        const r=rocks[i];

        r.x-=r.speed;

        if(
            distance(dragon,r)
            <
            dragon.size*.7+r.size*.45
        ){

            endGame();
            return;
        }

        if(r.x<-100){
            rocks.splice(i,1);
        }
    }

    /* spawn */

    if(Math.random()<.025){
        createStar();
    }

    if(Math.random()<.012){
        createRock();
    }

}


/* =========================
   DRAW
========================= */

function draw(){

    drawBackground();

    for(const s of stars){
        drawStar(s);
    }

    for(const r of rocks){
        drawRock(r);
    }

    drawDragon();

}


/* =========================
   GAME LOOP
========================= */

function loop(time){

    const delta=time-lastTime;

    lastTime=time;

    update();
    draw();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);


/* =========================
   START
========================= */

function startGame(){

    document.getElementById("start").style.display="none";

    score=0;

    document.getElementById("score").textContent="0";

    dragon.x=180;
    dragon.y=H/2;
    dragon.vx=0;
    dragon.vy=0;

    stars=[];
    rocks=[];

    running=true;
}


/* =========================
   GAME OVER
========================= */

function endGame(){

    running=false;

    document.getElementById("finalScore").textContent=score;

    document.getElementById("gameOver").style.display="flex";
}


/* =========================
   RESTART
========================= */

function restartGame(){

    document.getElementById("gameOver").style.display="none";

    startGame();
}


/* =========================
   PREVENT RIGHT CLICK
========================= */

canvas.addEventListener("contextmenu",function(e){
    e.preventDefault();
});

</script>

</body>
</html>
