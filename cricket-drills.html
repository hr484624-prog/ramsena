<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,
      maximum-scale=1.0,user-scalable=no">

<title>Battle Arena</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  touch-action:none;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

#hud{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
  z-index:5;
}

.box{
  color:white;
  background:rgba(0,0,0,.55);
  padding:8px 12px;
  border-radius:12px;
  font-size:13px;
  font-weight:bold;
}

#healthOuter{
  width:130px;
  height:10px;
  background:#333;
  border-radius:20px;
  overflow:hidden;
  margin-top:5px;
}

#health{
  width:100%;
  height:100%;
  background:#22d46b;
}

#joystick{
  position:absolute;
  left:22px;
  bottom:28px;
  width:145px;
  height:145px;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  border:2px solid rgba(255,255,255,.18);
  z-index:10;
}

#stick{
  position:absolute;
  width:62px;
  height:62px;
  left:41px;
  top:41px;
  border-radius:50%;
  background:rgba(255,255,255,.35);
}

#actions{
  position:absolute;
  right:20px;
  bottom:28px;
  display:flex;
  gap:14px;
  align-items:center;
  z-index:10;
}

.action{
  border:0;
  color:white;
  border-radius:50%;
  font-weight:bold;
  background:rgba(0,0,0,.6);
}

#fire{
  width:82px;
  height:82px;
  background:rgba(210,45,45,.8);
}

#reload{
  width:58px;
  height:58px;
  font-size:10px;
}

#auto{
  position:absolute;
  top:65px;
  right:12px;
  border:0;
  color:white;
  background:rgba(0,0,0,.55);
  padding:9px 12px;
  border-radius:12px;
  font-size:12px;
  z-index:10;
}

#message{
  display:none;
  position:absolute;
  inset:0;
  z-index:30;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:white;
  background:rgba(0,0,0,.55);
  font-size:32px;
  font-weight:bold;
}

#restart{
  margin-top:20px;
  padding:13px 25px;
  border:0;
  border-radius:12px;
  background:#1769e0;
  color:white;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">

  <div class="box">
    ❤️ HP
    <div id="healthOuter">
      <div id="health"></div>
    </div>
  </div>

  <div class="box">
    👥 <span id="players">25</span>
  </div>

  <div class="box">
    🔫 <span id="ammo">30</span>
  </div>

</div>

<button id="auto">
  🔄 AUTO ROTATE: ON
</button>

<div id="joystick">
  <div id="stick"></div>
</div>

<div id="actions">

  <button
    class="action"
    id="reload">
    RELOAD
  </button>

  <button
    class="action"
    id="fire">
    FIRE
  </button>

</div>

<div id="message">
  <div id="messageText"></div>
  <button id="restart">
    PLAY AGAIN
  </button>
</div>

</div>

<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){

  W=innerWidth;
  H=innerHeight;

  canvas.width=
  W*devicePixelRatio;

  canvas.height=
  H*devicePixelRatio;

  canvas.style.width=
  W+"px";

  canvas.style.height=
  H+"px";

  ctx.setTransform(
    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0
  );
}

resize();

window.addEventListener(
  "resize",
  resize
);


/* =====================
   GAME
===================== */

let gameOver=false;

let health=100;

let ammo=30;

let players=25;

let autoRotate=true;

let world=2600;

let cameraX=0;
let cameraY=0;

let bullets=[];

let enemies=[];

let trees=[];

let rocks=[];


/* =====================
   PLAYER
===================== */

const player={

  x:world/2,

  y:world/2,

  radius:18,

  speed:4,

  angle:0

};


/* =====================
   JOYSTICK
===================== */

const joystick=
document.getElementById(
  "joystick"
);

const stick=
document.getElementById(
  "stick"
);

let joyActive=false;

let joyX=0;

let joyY=0;

let joyPointer=null;


function joystickMove(e){

  const rect=
  joystick.getBoundingClientRect();

  let x=
  e.clientX-
  (rect.left+
   rect.width/2);

  let y=
  e.clientY-
  (rect.top+
   rect.height/2);

  const max=55;

  const distance=
  Math.hypot(x,y);

  if(distance>max){

    x=
    x/distance*max;

    y=
    y/distance*max;

  }

  joyX=x/max;

  joyY=y/max;

  stick.style.transform=
  `translate(${x}px,${y}px)`;

}


joystick.addEventListener(
  "pointerdown",
  e=>{

    joyActive=true;

    joyPointer=e.pointerId;

    joystick.setPointerCapture(
      e.pointerId
    );

    joystickMove(e);

  }
);


joystick.addEventListener(
  "pointermove",
  e=>{

    if(
      joyActive &&
      e.pointerId===joyPointer
    ){

      joystickMove(e);

    }

  }
);


function joystickEnd(){

  joyActive=false;

  joyX=0;

  joyY=0;

  stick.style.transform=
  "translate(0,0)";

}


joystick.addEventListener(
  "pointerup",
  joystickEnd
);

joystick.addEventListener(
  "pointercancel",
  joystickEnd
);


/* =====================
   ENEMIES
===================== */

function createEnemies(){

  enemies=[];

  for(let i=0;i<24;i++){

    let x;
    let y;

    do{

      x=
      Math.random()*world;

      y=
      Math.random()*world;

    }
    while(
      Math.hypot(
        x-player.x,
        y-player.y
      )<350
    );

    enemies.push({

      x:x,

      y:y,

      radius:16,

      hp:100,

      speed:
      .45+
      Math.random()*.7,

      angle:
      Math.random()*Math.PI*2,

      timer:
      Math.random()*100

    });

  }

}


/* =====================
   MAP
===================== */

function createMap(){

  trees=[];

  rocks=[];

  for(let i=0;i<100;i++){

    trees.push({

      x:Math.random()*world,

      y:Math.random()*world,

      size:
      18+
      Math.random()*22

    });

  }

  for(let i=0;i<55;i++){

    rocks.push({

      x:Math.random()*world,

      y:Math.random()*world,

      size:
      8+
      Math.random()*14

    });

  }

}


createMap();

createEnemies();


/* =====================
   SAFE ZONE
===================== */

const zone={

  x:world/2,

  y:world/2,

  radius:1100

};


/* =====================
   AUTO ROTATION
===================== */

function autoRotateCamera(){

  if(!autoRotate)
    return;

  /*
    Camera smoothly follows player.
    The player automatically turns
    toward the nearest enemy.
  */

  let nearest=null;

  let best=Infinity;

  for(
    const enemy of enemies
  ){

    const d=
    Math.hypot(
      enemy.x-player.x,
      enemy.y-player.y
    );

    if(
      d<best &&
      d<650
    ){

      best=d;

      nearest=enemy;

    }

  }


  if(nearest){

    const targetAngle=
    Math.atan2(
      nearest.y-player.y,
      nearest.x-player.x
    );


    let difference=
    targetAngle-
    player.angle;


    while(
      difference>Math.PI
    )
      difference-=Math.PI*2;

    while(
      difference<-Math.PI
    )
      difference+=Math.PI*2;


    player.angle +=
    difference*.08;

  }

}


/* =====================
   PLAYER
===================== */

function updatePlayer(){

  if(
    Math.abs(joyX)>.05 ||
    Math.abs(joyY)>.05
  ){

    player.x +=
    joyX*player.speed;

    player.y +=
    joyY*player.speed;


    /*
      Auto rotate direction
      according to movement.
    */

    if(!autoRotate){

      player.angle=
      Math.atan2(
        joyY,
        joyX
      );

    }

  }


  player.x=
  Math.max(
    20,
    Math.min(
      world-20,
      player.x
    )
  );

  player.y=
  Math.max(
    20,
    Math.min(
      world-20,
      player.y
    )
  );

}


/* =====================
   ENEMIES
===================== */

function updateEnemies(){

  for(
    const enemy of enemies
  ){

    enemy.timer--;

    if(enemy.timer<=0){

      enemy.angle=
      Math.random()*
      Math.PI*2;

      enemy.timer=
      40+
      Math.random()*120;

    }


    const distance=
    Math.hypot(
      player.x-enemy.x,
      player.y-enemy.y
    );


    if(distance<400){

      enemy.angle=
      Math.atan2(
        player.y-enemy.y,
        player.x-enemy.x
      );

    }


    enemy.x +=
    Math.cos(enemy.angle)*
    enemy.speed;

    enemy.y +=
    Math.sin(enemy.angle)*
    enemy.speed;


    if(distance<38){

      health-=.12;

      if(health<=0){

        health=0;

        finish(false);

      }

    }

  }

}


/* =====================
   SHOOT
===================== */

function shoot(){

  if(gameOver)
    return;

  if(ammo<=0)
    return;

  ammo--;

  let angle=
  player.angle;


  /*
    Auto-aim toward nearest enemy.
  */

  if(autoRotate){

    let nearest=null;

    let best=Infinity;

    for(
      const enemy of enemies
    ){

      const d=
      Math.hypot(
        enemy.x-player.x,
        enemy.y-player.y
      );

      if(
        d<best &&
        d<650
      ){

        best=d;

        nearest=enemy;

      }

    }


    if(nearest){

      angle=
      Math.atan2(
        nearest.y-player.y,
        nearest.x-player.x
      );

      player.angle=angle;

    }

  }


  bullets.push({

    x:player.x,

    y:player.y,

    vx:Math.cos(angle)*13,

    vy:Math.sin(angle)*13,

    life:70

  });

  updateHUD();

}


document
.getElementById("fire")
.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    shoot();
  }
);


/* =====================
   RELOAD
===================== */

document
.getElementById("reload")
.addEventListener(
  "click",
  ()=>{

    ammo=30;

    updateHUD();

  }
);


/* =====================
   BULLETS
===================== */

function updateBullets(){

  for(
    let i=bullets.length-1;
    i>=0;
    i--
  ){

    const b=bullets[i];

    b.x+=b.vx;

    b.y+=b.vy;

    b.life--;


    let remove=false;


    for(
      let j=enemies.length-1;
      j>=0;
      j--
    ){

      const enemy=
      enemies[j];


      const distance=
      Math.hypot(
        b.x-enemy.x,
        b.y-enemy.y
      );


      if(
        distance<
        enemy.radius+5
      ){

        enemy.hp-=50;

        remove=true;


        if(enemy.hp<=0){

          enemies.splice(j,1);

          players--;

        }

        break;

      }

    }


    if(
      remove ||
      b.life<=0 ||
      b.x<0 ||
      b.y<0 ||
      b.x>world ||
      b.y>world
    ){

      bullets.splice(i,1);

    }

  }

}


/* =====================
   ZONE
===================== */

function updateZone(){

  zone.radius-=.012;

  if(zone.radius<180)
    zone.radius=180;


  const distance=
  Math.hypot(
    player.x-zone.x,
    player.y-zone.y
  );


  if(
    distance>zone.radius
  ){

    health-=.035;

    if(health<=0){

      health=0;

      finish(false);

    }

  }

}


/* =====================
   CAMERA
===================== */

function updateCamera(){

  /*
    Smooth camera follow.
    This creates the automatic
    rotating-follow feeling.
  */

  const targetX=
  player.x-W/2;

  const targetY=
  player.y-H/2;


  cameraX +=
  (targetX-cameraX)*.12;

  cameraY +=
  (targetY-cameraY)*.12;


  cameraX=
  Math.max(
    0,
    Math.min(
      world-W,
      cameraX
    )
  );

  cameraY=
  Math.max(
    0,
    Math.min(
      world-H,
      cameraY
    )
  );

}


/* =====================
   DRAW
===================== */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  ctx.save();

  ctx.translate(
    -cameraX,
    -cameraY
  );


  /* Ground */

  ctx.fillStyle="#31572d";

  ctx.fillRect(
    0,
    0,
    world,
    world
  );


  /* Ground grid */

  ctx.strokeStyle=
  "rgba(255,255,255,.035)";

  for(
    let x=0;
    x<world;
    x+=80
  ){

    ctx.beginPath();

    ctx.moveTo(x,0);

    ctx.lineTo(x,world);

    ctx.stroke();

  }


  for(
    let y=0;
    y<world;
    y+=80
  ){

    ctx.beginPath();

    ctx.moveTo(0,y);

    ctx.lineTo(world,y);

    ctx.stroke();

  }


  /* Rocks */

  for(
    const rock of rocks
  ){

    ctx.fillStyle="#707468";

    ctx.beginPath();

    ctx.arc(
      rock.x,
      rock.y,
      rock.size,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  /* Trees */

  for(
    const tree of trees
  ){

    ctx.fillStyle="#563a21";

    ctx.fillRect(
      tree.x-4,
      tree.y,
      8,
      tree.size
    );


    ctx.fillStyle="#175027";

    ctx.beginPath();

    ctx.arc(
      tree.x,
      tree.y,
      tree.size,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  /* Safe zone */

  ctx.beginPath();

  ctx.arc(
    zone.x,
    zone.y,
    zone.radius,
    0,
    Math.PI*2
  );

  ctx.strokeStyle=
  "rgba(60,180,255,.9)";

  ctx.lineWidth=5;

  ctx.stroke();


  /* Bullets */

  for(
    const b of bullets
  ){

    ctx.fillStyle="#ffe45c";

    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      5,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  /* Enemies */

  for(
    const enemy of enemies
  ){

    ctx.fillStyle="#dc3939";

    ctx.beginPath();

    ctx.arc(
      enemy.x,
      enemy.y,
      enemy.radius,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#222";

    ctx.fillRect(
      enemy.x-17,
      enemy.y-25,
      34,
      5
    );


    ctx.fillStyle="#30df6b";

    ctx.fillRect(
      enemy.x-17,
      enemy.y-25,
      34*
      Math.max(
        0,
        enemy.hp/100
      ),
      5
    );

  }


  /* PLAYER */

  ctx.save();

  ctx.translate(
    player.x,
    player.y
  );

  ctx.rotate(
    player.angle
  );


  ctx.fillStyle="#1769e0";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    player.radius,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* Direction */

  ctx.fillStyle="#222";

  ctx.fillRect(
    7,
    -5,
    34,
    10
  );


  ctx.fillStyle="#7fc5ff";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    8,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.restore();

  ctx.restore();

}


/* =====================
   HUD
===================== */

function updateHUD(){

  document.getElementById(
    "health"
  ).style.width=
  health+"%";


  document.getElementById(
    "ammo"
  ).textContent=
  ammo;


  document.getElementById(
    "players"
  ).textContent=
  Math.max(
    1,
    players
  );

}


/* =====================
   AUTO BUTTON
===================== */

document
.getElementById("auto")
.addEventListener(
  "click",
  ()=>{

    autoRotate=
    !autoRotate;

    document
    .getElementById("auto")
    .textContent=
    autoRotate
    ? "🔄 AUTO ROTATE: ON"
    : "🔄 AUTO ROTATE: OFF";

  }
);


/* =====================
   FINISH
===================== */

function finish(win){

  if(gameOver)
    return;

  gameOver=true;

  const message=
  document.getElementById(
    "message"
  );

  message.style.display="flex";

  document.getElementById(
    "messageText"
  ).textContent=
  win
  ? "🏆 YOU WIN!"
  : "GAME OVER";

}


/* =====================
   WIN
===================== */

function checkWin(){

  if(
    enemies.length===0
  ){

    players=1;

    updateHUD();

    finish(true);

  }

}


/* =====================
   RESTART
===================== */

document
.getElementById("restart")
.addEventListener(
  "click",
  ()=>{

    health=100;

    ammo=30;

    players=25;

    bullets=[];

    player.x=world/2;

    player.y=world/2;

    player.angle=0;

    zone.radius=1100;

    gameOver=false;

    createEnemies();

    document
    .getElementById("message")
    .style.display="none";

    updateHUD();

  }
);


/* =====================
   LOOP
===================== */

function loop(){

  if(!gameOver){

    updatePlayer();

    autoRotateCamera();

    updateEnemies();

    updateBullets();

    updateZone();

    updateCamera();

    checkWin();

    updateHUD();

  }

  draw();

  requestAnimationFrame(loop);

}


updateHUD();

loop();

</script>

</body>
</html>
