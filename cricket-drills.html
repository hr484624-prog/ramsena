<!DOCTYPE html>
<html lang="mr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GyanSetu - AI Interview</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#eef5ff;
  color:#172554;
}

.app{
  width:100%;
  max-width:430px;
  min-height:100vh;
  margin:auto;
  background:#fff;
}

header{
  background:linear-gradient(135deg,#1769e0,#4d9cff);
  color:white;
  padding:18px;
  position:sticky;
  top:0;
  z-index:10;
}

.header-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.back{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  color:white;
  font-size:24px;
}

.header-title{
  font-size:20px;
  font-weight:bold;
}

.header-sub{
  font-size:12px;
  opacity:.9;
  margin-top:3px;
}

.content{
  padding:18px;
}

.card{
  background:#f7faff;
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 4px 15px rgba(23,105,224,.08);
}

.label{
  font-size:13px;
  color:#64748b;
  margin-bottom:7px;
}

input,
textarea{
  width:100%;
  border:1px solid #d7e3f5;
  border-radius:12px;
  padding:13px;
  font-size:15px;
  outline:none;
  background:white;
}

textarea{
  min-height:110px;
  resize:none;
}

button{
  font-family:inherit;
  cursor:pointer;
}

.primary{
  width:100%;
  border:0;
  background:#1769e0;
  color:white;
  padding:14px;
  border-radius:13px;
  font-size:16px;
  font-weight:bold;
}

.primary:disabled{
  opacity:.5;
}

.ai{
  background:#eaf3ff;
  border-radius:14px;
  padding:14px;
  margin-bottom:15px;
  line-height:1.5;
}

.user{
  background:#1769e0;
  color:white;
  border-radius:14px;
  padding:14px;
  margin-bottom:15px;
  line-height:1.5;
}

.small{
  font-size:12px;
  color:#64748b;
  text-align:center;
  margin-top:12px;
}

.loading{
  display:none;
  text-align:center;
  padding:12px;
  color:#1769e0;
  font-weight:bold;
}

/* AUDIO MODE */

.audio-card{
  background:linear-gradient(
    135deg,
    #eaf3ff,
    #f7faff
  );
  border:1px solid #d6e7ff;
}

.audio-toggle{
  width:100%;
  border:0;
  background:#fff;
  color:#1769e0;
  border:2px solid #1769e0;
  padding:13px;
  border-radius:14px;
  font-size:16px;
  font-weight:bold;
}

.audio-toggle.active{
  background:#1769e0;
  color:white;
}

.mic-area{
  text-align:center;
  padding:12px 0 4px;
}

.mic-button{
  width:82px;
  height:82px;
  border:0;
  border-radius:50%;
  background:#1769e0;
  color:white;
  font-size:35px;
  box-shadow:0 7px 20px rgba(23,105,224,.25);
}

.mic-button.listening{
  background:#dc2626;
  transform:scale(1.08);
  animation:pulse 1.2s infinite;
}

@keyframes pulse{
  0%{
    box-shadow:0 0 0 0 rgba(220,38,38,.35);
  }
  70%{
    box-shadow:0 0 0 18px rgba(220,38,38,0);
  }
  100%{
    box-shadow:0 0 0 0 rgba(220,38,38,0);
  }
}

.mic-status{
  margin-top:10px;
  font-size:14px;
  color:#64748b;
}

.audio-answer{
  margin-top:14px;
  background:white;
  border:1px solid #d7e3f5;
  border-radius:13px;
  padding:13px;
  min-height:55px;
  line-height:1.5;
}

.speak-button{
  width:100%;
  border:1px solid #1769e0;
  background:white;
  color:#1769e0;
  padding:11px;
  border-radius:12px;
  margin-top:10px;
  font-size:14px;
  font-weight:bold;
}

/* POPUP */

.popup-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.popup{
  width:100%;
  max-width:400px;
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:22px;
  padding:20px;
}

.popup h2{
  margin-bottom:6px;
  color:#172554;
}

.popup p{
  color:#64748b;
  font-size:13px;
  margin-bottom:15px;
}

.option{
  width:100%;
  border:1px solid #d9e5f5;
  background:#f8fbff;
  padding:14px;
  border-radius:13px;
  margin-bottom:9px;
  text-align:left;
  font-size:15px;
  color:#172554;
}

.option:hover{
  background:#eaf3ff;
  border-color:#1769e0;
}

.search{
  margin-bottom:12px;
}

.hidden{
  display:none !important;
}

.language-list{
  max-height:420px;
  overflow:auto;
}

</style>
</head>

<body>

<div class="app">

<header>

  <div class="header-row">

    <button class="back" onclick="goBack()">‹</button>

    <div>
      <div class="header-title">🤖 AI Interview</div>

      <div class="header-sub">
        GyanSetu • Smart Learning
      </div>
    </div>

  </div>

</header>


<div class="content">

  <div class="card">

    <div class="label">
      Interview Type
    </div>

    <input
      id="typeDisplay"
      value="Select interview type"
      readonly
    >

  </div>


  <div class="card">

    <div class="label">
      Language
    </div>

    <input
      id="languageDisplay"
      value="Select language"
      readonly
    >

  </div>


  <!-- AUDIO MODE -->

  <div
    id="audioCard"
    class="card audio-card hidden"
  >

    <button
      id="audioToggle"
      class="audio-toggle"
      onclick="toggleAudioMode()"
    >
      🎙️ Audio Mode OFF
    </button>

    <div
      id="micArea"
      class="mic-area hidden"
    >

      <button
        id="micButton"
        class="mic-button"
        onclick="toggleListening()"
      >
        🎤
      </button>

      <div
        id="micStatus"
        class="mic-status"
      >
        बोलण्यासाठी Mic वर tap करा
      </div>

      <div
        id="audioAnswer"
        class="audio-answer"
      >
        तुमचं बोललेलं उत्तर येथे दिसेल...
      </div>

      <button
        class="speak-button"
        onclick="speakCurrentQuestion()"
      >
        🔊 प्रश्न पुन्हा ऐका
      </button>

    </div>

  </div>


  <div id="startCard" class="card">

    <button
      class="primary"
      onclick="startInterview()"
    >
      🎤 Start AI Interview
    </button>

  </div>


  <div id="interviewArea" class="hidden">

    <div id="chatBox"></div>


    <div id="answerBox">

      <div class="card">

        <div class="label">
          Your Answer
        </div>

        <textarea
          id="answer"
          placeholder="तुमचे उत्तर येथे लिहा..."
        ></textarea>

        <br><br>

        <button
          id="sendBtn"
          class="primary"
          onclick="sendAnswer()"
        >
          Send Answer
        </button>

        <div
          id="loading"
          class="loading"
        >
          🤖 Gemini विचार करत आहे...
        </div>

      </div>

    </div>

  </div>


  <div class="small">
    Powered by GyanSetu AI
  </div>

</div>

</div>


<!-- INTERVIEW TYPE POPUP -->

<div
  id="typePopup"
  class="popup-bg"
>

  <div class="popup">

    <h2>🎯 Interview Type</h2>

    <p>
      कोणत्या प्रकारची interview द्यायची आहे?
    </p>

    <button class="option" onclick="chooseType('Business')">
      💼 Business Interview
    </button>

    <button class="option" onclick="chooseType('Job')">
      🧑‍💼 Job Interview
    </button>

    <button class="option" onclick="chooseType('School Admission')">
      🏫 School Admission
    </button>

    <button class="option" onclick="chooseType('College Admission')">
      🎓 College Admission
    </button>

    <button class="option" onclick="chooseType('Scholarship')">
      🏆 Scholarship Interview
    </button>

    <button class="option" onclick="chooseType('Viva')">
      📚 Viva
    </button>

    <button class="option" onclick="chooseType('Career')">
      🚀 Career Interview
    </button>

    <button class="option" onclick="chooseType('General')">
      💬 General Interview
    </button>

  </div>

</div>


<!-- LANGUAGE POPUP -->

<div
  id="languagePopup"
  class="popup-bg hidden"
>

  <div class="popup">

    <h2>🌐 Language</h2>

    <p>
      Interview कोणत्या भाषेत हवी?
    </p>

    <input
      id="languageSearch"
      class="search"
      placeholder="भाषा शोधा..."
      oninput="searchLanguages()"
    >

    <div
      id="languageList"
      class="language-list"
    ></div>

  </div>

</div>


<script>

/* =========================
   LANGUAGES
========================= */

const languages = [

  ["Assamese","অসমীয়া","as-IN"],
  ["Bengali","বাংলা","bn-IN"],
  ["Bodo","बड़ो","hi-IN"],
  ["Dogri","डोगरी","hi-IN"],
  ["Gujarati","ગુજરાતી","gu-IN"],
  ["Hindi","हिन्दी","hi-IN"],
  ["Kannada","ಕನ್ನಡ","kn-IN"],
  ["Kashmiri","कश्मीरी","hi-IN"],
  ["Konkani","कोंकणी","kok-IN"],
  ["Maithili","मैथिली","hi-IN"],
  ["Malayalam","മലയാളം","ml-IN"],
  ["Manipuri","মণিপুরী","mni-IN"],
  ["Marathi","मराठी","mr-IN"],
  ["Nepali","नेपाली","ne-IN"],
  ["Odia","ଓଡ଼ିଆ","or-IN"],
  ["Punjabi","ਪੰਜਾਬੀ","pa-IN"],
  ["Sanskrit","संस्कृत","sa-IN"],
  ["Santali","संताली","sat-IN"],
  ["Sindhi","सिन्धी","sd-IN"],
  ["Tamil","தமிழ்","ta-IN"],
  ["Telugu","తెలుగు","te-IN"],
  ["Urdu","اردو","ur-IN"]

];


let selectedType = "";

let selectedLanguage = "";

let selectedLanguageCode = "mr-IN";

let currentQuestion = "";

let interviewStarted = false;

let audioMode = false;

let recognition = null;

let isListening = false;


/* =========================
   TYPE
========================= */

function chooseType(type){

  selectedType = type;

  document
    .getElementById("typeDisplay")
    .value = type;

  document
    .getElementById("typePopup")
    .classList.add("hidden");

  document
    .getElementById("languagePopup")
    .classList.remove("hidden");

  showLanguages();

}


/* =========================
   LANGUAGES
========================= */

function showLanguages(){

  const box =
    document.getElementById("languageList");

  box.innerHTML = "";

  languages.forEach(item => {

    const button =
      document.createElement("button");

    button.className = "option";

    button.innerHTML =
      item[1] +
      " <small>(" +
      item[0] +
      ")</small>";

    button.onclick = function(){

      chooseLanguage(
        item[0],
        item[1],
        item[2]
      );

    };

    box.appendChild(button);

  });

}


function searchLanguages(){

  const search =
    document
      .getElementById("languageSearch")
      .value
      .toLowerCase();

  const box =
    document.getElementById("languageList");

  box.innerHTML = "";

  languages
    .filter(item =>
      item[0]
        .toLowerCase()
        .includes(search) ||

      item[1]
        .toLowerCase()
        .includes(search)
    )
    .forEach(item => {

      const button =
        document.createElement("button");

      button.className = "option";

      button.innerHTML =
        item[1] +
        " <small>(" +
        item[0] +
        ")</small>";

      button.onclick = function(){

        chooseLanguage(
          item[0],
          item[1],
          item[2]
        );

      };

      box.appendChild(button);

    });

}


function chooseLanguage(
  englishName,
  nativeName,
  languageCode
){

  selectedLanguage = nativeName;

  selectedLanguageCode = languageCode;

  document
    .getElementById("languageDisplay")
    .value =
      nativeName +
      " (" +
      englishName +
      ")";

  document
    .getElementById("languagePopup")
    .classList.add("hidden");

}


/* =========================
   START
========================= */

async function startInterview(){

  if(!selectedType){

    document
      .getElementById("typePopup")
      .classList.remove("hidden");

    return;

  }

  if(!selectedLanguage){

    document
      .getElementById("languagePopup")
      .classList.remove("hidden");

    return;

  }

  interviewStarted = true;

  document
    .getElementById("startCard")
    .classList.add("hidden");

  document
    .getElementById("interviewArea")
    .classList.remove("hidden");

  document
    .getElementById("audioCard")
    .classList.remove("hidden");

  addAIMessage(
    "नमस्कार! 👋 तुमची " +
    selectedType +
    " interview सुरू करूया."
  );

  await getFirstQuestion();

}


/* =========================
   FIRST QUESTION
========================= */

async function getFirstQuestion(){

  setLoading(true);

  try{

    const response =
      await fetch(
        "/api/interview",
        {

          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({

            interviewType:selectedType,

            language:selectedLanguage,

            userAnswer:
              "Start the interview and ask the first question.",

            previousQuestion:""

          })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "API error"
      );

    }


    currentQuestion =
      data.reply || "";


    addAIMessage(
      currentQuestion
    );


    if(audioMode){

      speakText(currentQuestion);

    }


  }catch(error){

    addAIMessage(
      "❌ Interview सुरू करताना समस्या आली. पुन्हा प्रयत्न करा."
    );

    console.error(error);

  }finally{

    setLoading(false);

  }

}


/* =========================
   SEND ANSWER
========================= */

async function sendAnswer(){

  const answerBox =
    document.getElementById("answer");

  const answer =
    answerBox.value.trim();


  if(!answer){

    return;

  }


  addUserMessage(answer);

  answerBox.value = "";

  document
    .getElementById("audioAnswer")
    .textContent =
      answer;

  setLoading(true);


  try{

    const response =
      await fetch(
        "/api/interview",
        {

          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({

            interviewType:selectedType,

            language:selectedLanguage,

            userAnswer:answer,

            previousQuestion:currentQuestion

          })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "API error"
      );

    }


    currentQuestion =
      data.reply || "";


    addAIMessage(
      currentQuestion
    );


    if(audioMode){

      speakText(currentQuestion);

    }


  }catch(error){

    addAIMessage(
      "❌ उत्तर तपासताना समस्या आली. पुन्हा प्रयत्न करा."
    );

    console.error(error);

  }finally{

    setLoading(false);

  }

}


/* =========================
   AUDIO MODE
========================= */

function toggleAudioMode(){

  audioMode = !audioMode;

  const toggle =
    document.getElementById("audioToggle");

  const micArea =
    document.getElementById("micArea");


  if(audioMode){

    toggle.innerHTML =
      "🎙️ Audio Mode ON";

    toggle.classList.add("active");

    micArea.classList.remove("hidden");

    if(currentQuestion){

      speakText(currentQuestion);

    }

  }else{

    toggle.innerHTML =
      "🎙️ Audio Mode OFF";

    toggle.classList.remove("active");

    micArea.classList.add("hidden");

    stopListening();

    window.speechSynthesis.cancel();

  }

}


/* =========================
   SPEECH RECOGNITION
========================= */

function createRecognition(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    return null;

  }


  const rec =
    new SpeechRecognition();

  rec.lang =
    selectedLanguageCode;

  rec.continuous = false;

  rec.interimResults = true;

  rec.maxAlternatives = 1;


  rec.onstart = function(){

    isListening = true;

    document
      .getElementById("micButton")
      .classList.add("listening");

    document
      .getElementById("micStatus")
      .textContent =
        "🔴 ऐकत आहे... बोला";


  };


  rec.onresult = function(event){

    let finalText = "";

    let interimText = "";


    for(
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ){

      const text =
        event.results[i][0].transcript;

      if(
        event.results[i].isFinal
      ){

        finalText += text;

      }else{

        interimText += text;

      }

    }


    const answerText =
      finalText ||
      interimText;


    document
      .getElementById("answer")
      .value =
        answerText;

    document
      .getElementById("audioAnswer")
      .textContent =
        answerText ||
        "ऐकत आहे...";

  };


  rec.onerror = function(event){

    console.error(
      "Speech error:",
      event.error
    );

    isListening = false;

    document
      .getElementById("micButton")
      .classList.remove("listening");

    document
      .getElementById("micStatus")
      .textContent =
        "Mic मध्ये समस्या आली. पुन्हा tap करा.";

  };


  rec.onend = function(){

    isListening = false;

    document
      .getElementById("micButton")
      .classList.remove("listening");

    document
      .getElementById("micStatus")
      .textContent =
        "उत्तर पूर्ण झाले असल्यास Send Answer दाबा.";

  };


  return rec;

}


/* =========================
   START / STOP MIC
========================= */

function toggleListening(){

  if(!audioMode){

    return;

  }


  if(isListening){

    stopListening();

  }else{

    startListening();

  }

}


function startListening(){

  if(
    !(
      window.SpeechRecognition ||
      window.webkitSpeechRecognition
    )
  ){

    document
      .getElementById("micStatus")
      .textContent =
        "या browser मध्ये voice input उपलब्ध नाही.";

    return;

  }


  recognition =
    createRecognition();


  if(!recognition){

    return;

  }


  try{

    recognition.start();

  }catch(error){

    console.error(error);

  }

}


function stopListening(){

  if(recognition){

    try{

      recognition.stop();

    }catch(error){

      console.error(error);

    }

  }

  isListening = false;

  const button =
    document.getElementById("micButton");

  if(button){

    button.classList.remove(
      "listening"
    );

  }

}


/* =========================
   TEXT TO SPEECH
========================= */

function speakText(text){

  if(
    !("speechSynthesis" in window)
  ){

    return;

  }


  if(!text){

    return;

  }


  window.speechSynthesis.cancel();


  const speech =
    new SpeechSynthesisUtterance(
      text
    );


  speech.lang =
    selectedLanguageCode;

  speech.rate = 0.95;

  speech.pitch = 1;

  speech.volume = 1;


  speech.onstart = function(){

    document
      .getElementById("micStatus")
      .textContent =
        "🔊 प्रश्न ऐका...";

  };


  speech.onend = function(){

    if(audioMode){

      document
        .getElementById("micStatus")
        .textContent =
          "🎤 उत्तर देण्यासाठी Mic वर tap करा";

    }

  };


  window.speechSynthesis.speak(
    speech
  );

}


/* =========================
   REPEAT QUESTION
========================= */

function speakCurrentQuestion(){

  if(currentQuestion){

    speakText(
      currentQuestion
    );

  }

}


/* =========================
   CHAT
========================= */

function addAIMessage(text){

  const chat =
    document.getElementById(
      "chatBox"
    );

  const div =
    document.createElement("div");

  div.className = "ai";

  div.innerHTML =
    "<b>🤖 GyanSetu AI</b><br><br>" +
    escapeHTML(text)
      .replace(/\n/g,"<br>");

  chat.appendChild(div);

  scrollBottom();

}


function addUserMessage(text){

  const chat =
    document.getElementById(
      "chatBox"
    );

  const div =
    document.createElement("div");

  div.className = "user";

  div.innerHTML =
    "<b>👤 You</b><br><br>" +
    escapeHTML(text)
      .replace(/\n/g,"<br>");

  chat.appendChild(div);

  scrollBottom();

}


function scrollBottom(){

  window.scrollTo({

    top:
      document.body.scrollHeight,

    behavior:"smooth"

  });

}


/* =========================
   LOADING
========================= */

function setLoading(show){

  document
    .getElementById("loading")
    .style.display =
      show
        ? "block"
        : "none";


  document
    .getElementById("sendBtn")
    .disabled =
      show;

}


/* =========================
   SECURITY
========================= */

function escapeHTML(text){

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   BACK
========================= */

function goBack(){

  window.history.back();

}


/* =========================
   INITIAL
========================= */

showLanguages();

</script>

</body>
</html>
