<!DOCTYPE html>
<html lang="mr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GyanSetu - AI Interview</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#eef5ff;
  color:#172554;
}

.app{
  width:100%;
  max-width:430px;
  min-height:100vh;
  margin:auto;
  background:#fff;
}

header{
  background:linear-gradient(135deg,#1769e0,#4d9cff);
  color:white;
  padding:18px;
  position:sticky;
  top:0;
  z-index:10;
}

.header-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.back{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  color:white;
  font-size:24px;
}

.header-title{
  font-size:20px;
  font-weight:bold;
}

.header-sub{
  font-size:12px;
  opacity:.9;
  margin-top:3px;
}

.content{
  padding:18px;
}

.card{
  background:#f7faff;
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 4px 15px rgba(23,105,224,.08);
}

.label{
  font-size:13px;
  color:#64748b;
  margin-bottom:7px;
}

select,
textarea,
input{
  width:100%;
  border:1px solid #d7e3f5;
  border-radius:12px;
  padding:13px;
  font-size:15px;
  outline:none;
  background:white;
}

textarea{
  min-height:110px;
  resize:none;
}

button{
  font-family:inherit;
  cursor:pointer;
}

.primary{
  width:100%;
  border:0;
  background:#1769e0;
  color:white;
  padding:14px;
  border-radius:13px;
  font-size:16px;
  font-weight:bold;
}

.primary:disabled{
  opacity:.5;
}

.question{
  font-size:19px;
  line-height:1.5;
  font-weight:bold;
  margin-bottom:15px;
}

.ai{
  background:#eaf3ff;
  border-radius:14px;
  padding:14px;
  margin-bottom:15px;
  line-height:1.5;
}

.user{
  background:#1769e0;
  color:white;
  border-radius:14px;
  padding:14px;
  margin-bottom:15px;
  line-height:1.5;
}

.small{
  font-size:12px;
  color:#64748b;
  text-align:center;
  margin-top:12px;
}

.loading{
  display:none;
  text-align:center;
  padding:12px;
  color:#1769e0;
  font-weight:bold;
}

/* POPUP */

.popup-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.popup{
  width:100%;
  max-width:400px;
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:22px;
  padding:20px;
}

.popup h2{
  margin-bottom:6px;
  color:#172554;
}

.popup p{
  color:#64748b;
  font-size:13px;
  margin-bottom:15px;
}

.option{
  width:100%;
  border:1px solid #d9e5f5;
  background:#f8fbff;
  padding:14px;
  border-radius:13px;
  margin-bottom:9px;
  text-align:left;
  font-size:15px;
  color:#172554;
}

.option:hover{
  background:#eaf3ff;
  border-color:#1769e0;
}

.search{
  margin-bottom:12px;
}

.hidden{
  display:none !important;
}

.language-list{
  max-height:420px;
  overflow:auto;
}

.status{
  font-size:12px;
  color:#64748b;
  margin-top:10px;
}

</style>
</head>

<body>

<div class="app">

<header>

  <div class="header-row">

    <button class="back" onclick="goBack()">‹</button>

    <div>
      <div class="header-title">🤖 AI Interview</div>
      <div class="header-sub">
        GyanSetu • Smart Learning
      </div>
    </div>

  </div>

</header>


<div class="content">

  <div class="card">

    <div class="label">Interview Type</div>

    <input
      id="typeDisplay"
      value="Select interview type"
      readonly
    >

  </div>


  <div class="card">

    <div class="label">Language</div>

    <input
      id="languageDisplay"
      value="Select language"
      readonly
    >

  </div>


  <div id="startCard" class="card">

    <button
      class="primary"
      onclick="startInterview()"
    >
      🎤 Start AI Interview
    </button>

  </div>


  <div id="interviewArea" class="hidden">

    <div id="chatBox"></div>

    <div id="answerBox">

      <div class="card">

        <div class="label">
          Your Answer
        </div>

        <textarea
          id="answer"
          placeholder="तुमचे उत्तर येथे लिहा..."
        ></textarea>

        <br><br>

        <button
          id="sendBtn"
          class="primary"
          onclick="sendAnswer()"
        >
          Send Answer
        </button>

        <div
          id="loading"
          class="loading"
        >
          🤖 Gemini विचार करत आहे...
        </div>

      </div>

    </div>

  </div>

  <div class="small">
    Powered by GyanSetu AI
  </div>

</div>

</div>


<!-- INTERVIEW TYPE POPUP -->

<div
  id="typePopup"
  class="popup-bg"
>

  <div class="popup">

    <h2>🎯 Interview Type</h2>

    <p>
      कोणत्या प्रकारची interview द्यायची आहे?
    </p>

    <button class="option" onclick="chooseType('Business')">
      💼 Business Interview
    </button>

    <button class="option" onclick="chooseType('Job')">
      🧑‍💼 Job Interview
    </button>

    <button class="option" onclick="chooseType('School Admission')">
      🏫 School Admission
    </button>

    <button class="option" onclick="chooseType('College Admission')">
      🎓 College Admission
    </button>

    <button class="option" onclick="chooseType('Scholarship')">
      🏆 Scholarship Interview
    </button>

    <button class="option" onclick="chooseType('Viva')">
      📚 Viva
    </button>

    <button class="option" onclick="chooseType('Career')">
      🚀 Career Interview
    </button>

    <button class="option" onclick="chooseType('General')">
      💬 General Interview
    </button>

  </div>

</div>


<!-- LANGUAGE POPUP -->

<div
  id="languagePopup"
  class="popup-bg hidden"
>

  <div class="popup">

    <h2>🌐 Language</h2>

    <p>
      Interview कोणत्या भाषेत हवी?
    </p>

    <input
      id="languageSearch"
      class="search"
      placeholder="भाषा शोधा..."
      oninput="searchLanguages()"
    >

    <div
      id="languageList"
      class="language-list"
    ></div>

  </div>

</div>


<script>

/* =========================
   DATA
========================= */

const languages = [

  ["Assamese","অসমীয়া"],
  ["Bengali","বাংলা"],
  ["Bodo","बड़ो"],
  ["Dogri","डोगरी"],
  ["Gujarati","ગુજરાતી"],
  ["Hindi","हिन्दी"],
  ["Kannada","ಕನ್ನಡ"],
  ["Kashmiri","कश्मीरी"],
  ["Konkani","कोंकणी"],
  ["Maithili","मैथिली"],
  ["Malayalam","മലയാളം"],
  ["Manipuri","মণিপুরী"],
  ["Marathi","मराठी"],
  ["Nepali","नेपाली"],
  ["Odia","ଓଡ଼ିଆ"],
  ["Punjabi","ਪੰਜਾਬੀ"],
  ["Sanskrit","संस्कृत"],
  ["Santali","संताली"],
  ["Sindhi","सिन्धी"],
  ["Tamil","தமிழ்"],
  ["Telugu","తెలుగు"],
  ["Urdu","اردو"]

];


let selectedType = "";
let selectedLanguage = "";

let currentQuestion = "";

let interviewStarted = false;


/* =========================
   TYPE
========================= */

function chooseType(type){

  selectedType = type;

  document.getElementById("typeDisplay").value = type;

  document
    .getElementById("typePopup")
    .classList.add("hidden");

  document
    .getElementById("languagePopup")
    .classList.remove("hidden");

  showLanguages();

}


/* =========================
   LANGUAGES
========================= */

function showLanguages(){

  const box =
    document.getElementById("languageList");

  box.innerHTML = "";

  languages.forEach(item => {

    const button =
      document.createElement("button");

    button.className = "option";

    button.innerHTML =
      item[1] + " <small>(" + item[0] + ")</small>";

    button.onclick = function(){

      chooseLanguage(
        item[0],
        item[1]
      );

    };

    box.appendChild(button);

  });

}


function searchLanguages(){

  const search =
    document
      .getElementById("languageSearch")
      .value
      .toLowerCase();

  const box =
    document.getElementById("languageList");

  box.innerHTML = "";

  languages
    .filter(item =>
      item[0].toLowerCase().includes(search) ||
      item[1].toLowerCase().includes(search)
    )
    .forEach(item => {

      const button =
        document.createElement("button");

      button.className = "option";

      button.innerHTML =
        item[1] +
        " <small>(" +
        item[0] +
        ")</small>";

      button.onclick = function(){

        chooseLanguage(
          item[0],
          item[1]
        );

      };

      box.appendChild(button);

    });

}


function chooseLanguage(
  englishName,
  nativeName
){

  selectedLanguage = nativeName;

  document
    .getElementById("languageDisplay")
    .value =
      nativeName +
      " (" +
      englishName +
      ")";

  document
    .getElementById("languagePopup")
    .classList.add("hidden");

}


/* =========================
   START
========================= */

async function startInterview(){

  if(!selectedType){

    alert("Interview type निवडा.");

    return;
  }

  if(!selectedLanguage){

    alert("Language निवडा.");

    return;
  }

  interviewStarted = true;

  document
    .getElementById("startCard")
    .classList.add("hidden");

  document
    .getElementById("interviewArea")
    .classList.remove("hidden");

  addAIMessage(
    "नमस्कार! 👋 तुमची " +
    selectedType +
    " interview सुरू करूया."
  );

  await getFirstQuestion();

}


/* =========================
   FIRST QUESTION
========================= */

async function getFirstQuestion(){

  setLoading(true);

  try{

    const response =
      await fetch("/api/interview", {

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({

          interviewType:selectedType,

          language:selectedLanguage,

          userAnswer:
            "Start the interview and ask the first question.",

          previousQuestion:""

        })

      });


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "API error"
      );

    }


    currentQuestion =
      data.reply || "";


    addAIMessage(currentQuestion);


  }catch(error){

    addAIMessage(
      "❌ Interview सुरू करताना समस्या आली. पुन्हा प्रयत्न करा."
    );

    console.error(error);

  }finally{

    setLoading(false);

  }

}


/* =========================
   SEND ANSWER
========================= */

async function sendAnswer(){

  const answerBox =
    document.getElementById("answer");

  const answer =
    answerBox.value.trim();


  if(!answer){

    return;

  }


  addUserMessage(answer);

  answerBox.value = "";

  setLoading(true);


  try{

    const response =
      await fetch("/api/interview", {

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({

          interviewType:selectedType,

          language:selectedLanguage,

          userAnswer:answer,

          previousQuestion:currentQuestion

        })

      });


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "API error"
      );

    }


    currentQuestion =
      data.reply || "";


    addAIMessage(currentQuestion);


  }catch(error){

    addAIMessage(
      "❌ उत्तर तपासताना समस्या आली. पुन्हा प्रयत्न करा."
    );

    console.error(error);

  }finally{

    setLoading(false);

  }

}


/* =========================
   CHAT
========================= */

function addAIMessage(text){

  const chat =
    document.getElementById("chatBox");

  const div =
    document.createElement("div");

  div.className = "ai";

  div.innerHTML =
    "<b>🤖 GyanSetu AI</b><br><br>" +
    escapeHTML(text)
      .replace(/\n/g,"<br>");

  chat.appendChild(div);

  scrollBottom();

}


function addUserMessage(text){

  const chat =
    document.getElementById("chatBox");

  const div =
    document.createElement("div");

  div.className = "user";

  div.innerHTML =
    "<b>👤 You</b><br><br>" +
    escapeHTML(text)
      .replace(/\n/g,"<br>");

  chat.appendChild(div);

  scrollBottom();

}


function scrollBottom(){

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });

}


/* =========================
   LOADING
========================= */

function setLoading(show){

  document
    .getElementById("loading")
    .style.display =
      show ? "block" : "none";

  document
    .getElementById("sendBtn")
    .disabled = show;

}


/* =========================
   SECURITY
========================= */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   BACK
========================= */

function goBack(){

  window.history.back();

}


/* =========================
   INITIAL
========================= */

showLanguages();

</script>

</body>
</html>
