<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GyanSetu - AI Interview</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial, sans-serif;
}

body{
  background:#eef5ff;
  color:#172554;
}

.app{
  width:100%;
  max-width:430px;
  min-height:100vh;
  margin:auto;
  background:white;
  position:relative;
  overflow:hidden;
}

/* HEADER */

.header{
  height:65px;
  background:linear-gradient(135deg,#1769e0,#4d9cff);
  color:white;
  display:flex;
  align-items:center;
  padding:0 16px;
  gap:12px;
}

.back{
  font-size:25px;
  cursor:pointer;
}

.headerTitle{
  font-size:20px;
  font-weight:bold;
}

/* SETUP */

.setup{
  padding:20px 16px 30px;
}

.setupTitle{
  font-size:25px;
  font-weight:bold;
  margin-bottom:7px;
}

.setupSub{
  color:#64748b;
  font-size:14px;
  margin-bottom:22px;
}

.optionCard{
  border:1px solid #dbeafe;
  border-radius:16px;
  padding:17px;
  margin-bottom:14px;
  background:#f8fbff;
  cursor:pointer;
  transition:.2s;
}

.optionCard:active{
  transform:scale(.98);
}

.optionTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.optionLeft{
  display:flex;
  align-items:center;
  gap:13px;
}

.optionIcon{
  width:43px;
  height:43px;
  border-radius:12px;
  background:#e0edff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.optionName{
  font-size:16px;
  font-weight:bold;
}

.optionValue{
  margin-top:5px;
  font-size:14px;
  color:#1769e0;
}

.arrow{
  font-size:22px;
  color:#64748b;
}

.startBtn{
  width:100%;
  border:0;
  border-radius:15px;
  padding:16px;
  background:linear-gradient(135deg,#1769e0,#4d9cff);
  color:white;
  font-size:17px;
  font-weight:bold;
  margin-top:8px;
  cursor:pointer;
}

.startBtn:disabled{
  opacity:.45;
}

/* POPUP */

.popupBg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:50;
}

.popup{
  width:100%;
  max-width:430px;
  background:white;
  border-radius:22px 22px 0 0;
  padding:20px;
  max-height:80vh;
  overflow:auto;
}

.popupTitle{
  font-size:20px;
  font-weight:bold;
  margin-bottom:15px;
}

.closePopup{
  float:right;
  border:0;
  background:#eef5ff;
  width:35px;
  height:35px;
  border-radius:50%;
  font-size:18px;
}

.popupOption{
  padding:14px;
  border:1px solid #e2e8f0;
  border-radius:12px;
  margin-bottom:9px;
  cursor:pointer;
}

.popupOption:active{
  background:#eef5ff;
}

.searchBox{
  width:100%;
  padding:13px;
  border:1px solid #cbd5e1;
  border-radius:12px;
  outline:none;
  margin-bottom:12px;
  font-size:15px;
}

/* INTERVIEW */

.interview{
  display:none;
  min-height:calc(100vh - 65px);
  position:relative;
  padding-bottom:85px;
}

.infoBar{
  padding:11px 15px;
  background:#f1f6ff;
  border-bottom:1px solid #dbeafe;
  font-size:12px;
  color:#475569;
}

.chat{
  padding:15px 12px;
}

.message{
  display:flex;
  margin-bottom:14px;
}

.message.ai{
  justify-content:flex-start;
}

.message.user{
  justify-content:flex-end;
}

.bubble{
  max-width:82%;
  padding:12px 14px;
  border-radius:17px;
  line-height:1.45;
  font-size:15px;
  white-space:pre-wrap;
}

.ai .bubble{
  background:#f1f5f9;
  color:#172554;
  border-bottom-left-radius:5px;
}

.user .bubble{
  background:#1769e0;
  color:white;
  border-bottom-right-radius:5px;
}

/* BOTTOM */

.bottom{
  position:fixed;
  bottom:0;
  width:100%;
  max-width:430px;
  background:white;
  border-top:1px solid #dbeafe;
  padding:9px 10px;
  z-index:20;
}

.voiceRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}

.voiceToggle{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:13px;
}

.voiceToggle input{
  width:18px;
  height:18px;
}

.micStatus{
  font-size:12px;
  color:#64748b;
}

.inputRow{
  display:flex;
  gap:7px;
}

.textInput{
  flex:1;
  min-width:0;
  border:1px solid #cbd5e1;
  border-radius:14px;
  padding:13px;
  outline:none;
  font-size:15px;
}

.micBtn,
.sendBtn{
  width:48px;
  height:48px;
  border:0;
  border-radius:14px;
  cursor:pointer;
  font-size:21px;
}

.micBtn{
  background:#e0edff;
}

.micBtn.active{
  background:#1769e0;
  color:white;
}

.sendBtn{
  background:#1769e0;
  color:white;
}

.loading{
  opacity:.65;
}

/* DESCRIPTION */

.descriptionBox{
  width:100%;
  min-height:130px;
  resize:none;
  border:1px solid #cbd5e1;
  border-radius:13px;
  padding:13px;
  font-size:15px;
  outline:none;
  margin-bottom:12px;
}

.saveDescription{
  width:100%;
  border:0;
  background:#1769e0;
  color:white;
  padding:14px;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="back" onclick="goBack()">‹</div>
    <div class="headerTitle">🤖 AI Interview</div>
  </div>

  <!-- SETUP -->

  <div class="setup" id="setup">

    <div class="setupTitle">AI Interview</div>

    <div class="setupSub">
      Interview सुरू करण्यासाठी खालील 3 गोष्टी निवडा.
    </div>

    <!-- DESCRIPTION -->

    <div class="optionCard" onclick="openDescription()">

      <div class="optionTop">

        <div class="optionLeft">

          <div class="optionIcon">📝</div>

          <div>
            <div class="optionName">Description</div>
            <div class="optionValue" id="descriptionValue">
              Interview बद्दल सांगा
            </div>
          </div>

        </div>

        <div class="arrow">›</div>

      </div>

    </div>

    <!-- LANGUAGE -->

    <div class="optionCard" onclick="openLanguage()">

      <div class="optionTop">

        <div class="optionLeft">

          <div class="optionIcon">🌐</div>

          <div>

            <div class="optionName">Languages</div>

            <div class="optionValue" id="languageValue">
              Select language
            </div>

          </div>

        </div>

        <div class="arrow">›</div>

      </div>

    </div>

    <!-- FIELD -->

    <div class="optionCard" onclick="openField()">

      <div class="optionTop">

        <div class="optionLeft">

          <div class="optionIcon">🎯</div>

          <div>

            <div class="optionName">Field</div>

            <div class="optionValue" id="fieldValue">
              Select field
            </div>

          </div>

        </div>

        <div class="arrow">›</div>

      </div>

    </div>

    <button
      class="startBtn"
      id="startButton"
      onclick="startInterview()"
      disabled>
      🎤 Start AI Interview
    </button>

  </div>


  <!-- INTERVIEW -->

  <div class="interview" id="interview">

    <div class="infoBar">
      <span id="interviewInfo"></span>
    </div>

    <div class="chat" id="chat"></div>

  </div>

</div>


<!-- DESCRIPTION POPUP -->

<div class="popupBg" id="descriptionPopup">

  <div class="popup">

    <button class="closePopup" onclick="closePopups()">×</button>

    <div class="popupTitle">📝 Interview Description</div>

    <textarea
      id="descriptionInput"
      class="descriptionBox"
      placeholder="उदा. मला software developer job interview ची तयारी करायची आहे. AI ने technical आणि HR questions विचारावेत."></textarea>

    <button
      class="saveDescription"
      onclick="saveDescription()">
      Save Description
    </button>

  </div>

</div>


<!-- LANGUAGE POPUP -->

<div class="popupBg" id="languagePopup">

  <div class="popup">

    <button class="closePopup" onclick="closePopups()">×</button>

    <div class="popupTitle">🌐 Select Language</div>

    <input
      class="searchBox"
      id="languageSearch"
      placeholder="Search language..."
      oninput="searchLanguages()">

    <div id="languageList"></div>

  </div>

</div>


<!-- FIELD POPUP -->

<div class="popupBg" id="fieldPopup">

  <div class="popup">

    <button class="closePopup" onclick="closePopups()">×</button>

    <div class="popupTitle">🎯 Select Field</div>

    <div id="fieldList"></div>

  </div>

</div>


<!-- BOTTOM INTERVIEW CONTROLS -->

<div class="bottom" id="bottom" style="display:none">

  <div class="voiceRow">

    <label class="voiceToggle">
      <input
        type="checkbox"
        id="aiVoice"
        checked>
      🔊 AI Voice
    </label>

    <div
      class="micStatus"
      id="micStatus">
      Mic OFF
    </div>

  </div>

  <div class="inputRow">

    <input
      id="textInput"
      class="textInput"
      placeholder="Type your answer..."
      autocomplete="off">

    <button
      id="micBtn"
      class="micBtn"
      onclick="toggleMic()">
      🎤
    </button>

    <button
      class="sendBtn"
      onclick="sendTextAnswer()">
      ➤
    </button>

  </div>

</div>


<script>

/* =========================
   DATA
========================= */

const languages = [

  ["Assamese","অসমীয়া","as-IN"],
  ["Bengali","বাংলা","bn-IN"],
  ["Bodo","बड़ो","brx-IN"],
  ["Dogri","डोगरी","doi-IN"],
  ["Gujarati","ગુજરાતી","gu-IN"],
  ["Hindi","हिन्दी","hi-IN"],
  ["Kannada","ಕನ್ನಡ","kn-IN"],
  ["Kashmiri","कॉशुर","ks-IN"],
  ["Konkani","कोंकणी","kok-IN"],
  ["Maithili","मैथिली","mai-IN"],
  ["Malayalam","മലയാളം","ml-IN"],
  ["Manipuri","মণিপুরী","mni-IN"],
  ["Marathi","मराठी","mr-IN"],
  ["Nepali","नेपाली","ne-IN"],
  ["Odia","ଓଡ଼ିଆ","or-IN"],
  ["Punjabi","ਪੰਜਾਬੀ","pa-IN"],
  ["Sanskrit","संस्कृतम्","sa-IN"],
  ["Santali","ᱥᱟᱱᱛᱟᱲᱤ","sat-IN"],
  ["Sindhi","सिन्धी","sd-IN"],
  ["Tamil","தமிழ்","ta-IN"],
  ["Telugu","తెలుగు","te-IN"],
  ["Urdu","اردو","ur-IN"],
  ["English","English","en-IN"]

];


const fields = [

  "Business",
  "Job",
  "School Admission",
  "College Admission",
  "Scholarship",
  "Viva",
  "Career",
  "General"

];


/* =========================
   STATE
========================= */

let description = "";

let selectedLanguage = "";

let selectedLanguageCode = "";

let selectedField = "";

let conversation = [];

let interviewStarted = false;


/* =========================
   GO BACK
========================= */

function goBack(){

  stopMic();

  window.location.href = "home.html";

}


/* =========================
   DESCRIPTION
========================= */

function openDescription(){

  document.getElementById("descriptionInput").value =
    description;

  document.getElementById("descriptionPopup").style.display =
    "flex";

}


function saveDescription(){

  const value =
    document.getElementById("descriptionInput")
    .value
    .trim();

  if(!value){

    alert("Interview description लिहा.");

    return;

  }

  description = value;

  document.getElementById("descriptionValue")
    .textContent =
    description.length > 45
      ? description.substring(0,45) + "..."
      : description;

  closePopups();

  checkStart();

}


/* =========================
   LANGUAGE
========================= */

function openLanguage(){

  renderLanguages(languages);

  document.getElementById("languageSearch").value = "";

  document.getElementById("languagePopup").style.display =
    "flex";

}


function renderLanguages(list){

  const box =
    document.getElementById("languageList");

  box.innerHTML = "";

  list.forEach(item => {

    const div =
      document.createElement("div");

    div.className = "popupOption";

    div.innerHTML =
      `<b>${item[0]}</b><br>
       <small>${item[1]}</small>`;

    div.onclick = function(){

      selectedLanguage = item[0];

      selectedLanguageCode = item[2];

      document.getElementById("languageValue")
        .textContent =
        `${item[0]} • ${item[1]}`;

      closePopups();

      checkStart();

    };

    box.appendChild(div);

  });

}


function searchLanguages(){

  const query =
    document.getElementById("languageSearch")
    .value
    .toLowerCase()
    .trim();

  const result =
    languages.filter(item =>
      item[0].toLowerCase().includes(query) ||
      item[1].toLowerCase().includes(query)
    );

  renderLanguages(result);

}


/* =========================
   FIELD
========================= */

function openField(){

  const box =
    document.getElementById("fieldList");

  box.innerHTML = "";

  fields.forEach(field => {

    const div =
      document.createElement("div");

    div.className = "popupOption";

    div.textContent = field;

    div.onclick = function(){

      selectedField = field;

      document.getElementById("fieldValue")
        .textContent = field;

      closePopups();

      checkStart();

    };

    box.appendChild(div);

  });

  document.getElementById("fieldPopup").style.display =
    "flex";

}


/* =========================
   POPUP CLOSE
========================= */

function closePopups(){

  document.querySelectorAll(".popupBg")
    .forEach(p => p.style.display = "none");

}


/* =========================
   START BUTTON
========================= */

function checkStart(){

  const ready =
    description &&
    selectedLanguage &&
    selectedField;

  document.getElementById("startButton")
    .disabled = !ready;

}


/* =========================
   START INTERVIEW
========================= */

async function startInterview(){

  if(
    !description ||
    !selectedLanguage ||
    !selectedField
  ){

    return;

  }

  interviewStarted = true;

  document.getElementById("setup")
    .style.display = "none";

  document.getElementById("interview")
    .style.display = "block";

  document.getElementById("bottom")
    .style.display = "block";

  document.getElementById("interviewInfo")
    .textContent =
    `${selectedField} • ${selectedLanguage}`;

  await getFirstQuestion();

}


/* =========================
   CHAT
========================= */

function addMessage(role,text){

  const chat =
    document.getElementById("chat");

  const message =
    document.createElement("div");

  message.className =
    "message " +
    (role === "user" ? "user" : "ai");

  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent = text;

  message.appendChild(bubble);

  chat.appendChild(message);

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });

}


function addLoading(){

  const chat =
    document.getElementById("chat");

  const message =
    document.createElement("div");

  message.className = "message ai";

  message.id = "loadingMessage";

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble loading";

  bubble.textContent =
    "🤖 AI विचार करत आहे...";

  message.appendChild(bubble);

  chat.appendChild(message);

}


function removeLoading(){

  const loading =
    document.getElementById("loadingMessage");

  if(loading){

    loading.remove();

  }

}


/* =========================
   FIRST QUESTION
========================= */

async function getFirstQuestion(){

  addLoading();

  try{

    const response =
      await callAI("");

    removeLoading();

    if(response){

      addMessage("ai",response);

      speakAI(response);

    }

  }catch(error){

    removeLoading();

    addMessage(
      "ai",
      "क्षमस्व 😕 AI response मिळाली नाही. कृपया पुन्हा प्रयत्न करा."
    );

    console.error(error);

  }

}


/* =========================
   AI API
========================= */

async function callAI(userAnswer){

  const response =
    await fetch("/api/interview",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({

        interviewType:selectedField,

        field:selectedField,

        description:description,

        language:selectedLanguage,

        userAnswer:userAnswer,

        conversation:conversation

      })

    });


  const data =
    await response.json();


  if(!response.ok){

    console.error(
      "API ERROR:",
      data
    );

    throw new Error(
      data?.error ||
      "API request failed"
    );

  }


  if(!data.success){

    throw new Error(
      data?.error ||
      "AI response failed"
    );

  }


  const text =
    data.response?.trim();


  if(!text){

    throw new Error(
      "Empty AI response"
    );

  }


  return text;

}


/* =========================
   TEXT ANSWER
========================= */

async function sendTextAnswer(){

  const input =
    document.getElementById("textInput");

  const answer =
    input.value.trim();

  if(!answer) return;

  input.value = "";

  await sendAnswer(answer);

}


/* =========================
   SEND ANSWER
========================= */

let aiThinking = false;


async function sendAnswer(answer){

  if(!answer || aiThinking) return;

  aiThinking = true;

  addMessage("user",answer);

  conversation.push({

    role:"user",

    content:answer

  });


  addLoading();


  try{

    const response =
      await callAI(answer);

    removeLoading();

    addMessage("ai",response);


    conversation.push({

      role:"assistant",

      content:response

    });


    speakAI(response);

  }catch(error){

    removeLoading();

    addMessage(
      "ai",
      "क्षमस्व 😕 AI response मिळाली नाही. कृपया पुन्हा प्रयत्न करा."
    );

    console.error(error);

  }


  aiThinking = false;

}


/* =================================================
   NATURAL VOICE SYSTEM
================================================= */

let recognition = null;

let listening = false;

let recognitionRunning = false;

let finalSpeech = "";

let silenceTimer = null;

let restarting = false;


/* =========================
   CREATE RECOGNITION
========================= */

function createRecognition(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert(
      "तुझ्या browser मध्ये Voice Recognition support नाही."
    );

    return null;

  }


  const rec =
    new SpeechRecognition();


  rec.continuous = true;

  rec.interimResults = true;

  rec.lang =
    selectedLanguageCode || "en-IN";


  rec.onstart = function(){

    recognitionRunning = true;

    updateMicUI();

  };


  rec.onresult = function(event){

    let interim = "";

    let currentFinal = "";


    for(
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ){

      const transcript =
        event.results[i][0].transcript;


      if(event.results[i].isFinal){

        currentFinal += transcript + " ";

      }else{

        interim += transcript;

      }

    }


    if(currentFinal){

      finalSpeech += currentFinal;

    }


    const currentText =
      (finalSpeech + interim).trim();


    document.getElementById("textInput")
      .value = currentText;


    clearTimeout(silenceTimer);


    if(currentText){

      silenceTimer =
        setTimeout(
          autoSendVoice,
          1500
        );

    }

  };


  rec.onerror = function(event){

    console.log(
      "Speech error:",
      event.error
    );


    recognitionRunning = false;


    /*
      काही mobile browsers मध्ये
      no-speech / aborted / network
      नंतर recognition बंद होते.
      Voice mode ON असेल तर पुन्हा सुरू करतो.
    */

    if(
      listening &&
      event.error !== "not-allowed"
    ){

      setTimeout(
        restartRecognition,
        500
      );

    }else{

      updateMicUI();

    }

  };


  rec.onend = function(){

    recognitionRunning = false;

    updateMicUI();


    /*
      User ने Mic OFF केलेला नसेल,
      तर recognition पुन्हा सुरू.
    */

    if(listening){

      setTimeout(
        restartRecognition,
        400
      );

    }

  };


  return rec;

}


/* =========================
   START RECOGNITION
========================= */

function startRecognition(){

  if(!listening) return;


  if(
    !recognition
  ){

    recognition =
      createRecognition();

  }


  if(
    !recognition ||
    recognitionRunning ||
    restarting
  ){

    return;

  }


  try{

    restarting = true;

    recognition.lang =
      selectedLanguageCode || "en-IN";

    recognition.start();

  }catch(error){

    console.log(
      "Recognition start:",
      error
    );

  }


  setTimeout(
    () => {
      restarting = false;
    },
    700
  );

}


/* =========================
   RESTART
========================= */

function restartRecognition(){

  if(!listening) return;

  if(
    recognitionRunning ||
    restarting
  ){

    return;

  }

  startRecognition();

}


/* =========================
   STOP MIC
========================= */

function stopMic(){

  listening = false;

  clearTimeout(silenceTimer);

  finalSpeech = "";

  recognitionRunning = false;

  restarting = false;


  if(recognition){

    try{

      recognition.stop();

    }catch(e){}

  }


  recognition = null;

  updateMicUI();

}


/* =========================
   TOGGLE MIC
========================= */

function toggleMic(){

  if(listening){

    stopMic();

    return;

  }


  /*
    User ने manually ON केल्यावर
    listening true राहते.
  */

  listening = true;

  finalSpeech = "";

  document.getElementById("textInput")
    .value = "";


  recognition = createRecognition();


  if(recognition){

    startRecognition();

  }

  updateMicUI();

}


/* =========================
   AUTO SEND VOICE
========================= */

function autoSendVoice(){

  if(!listening) return;

  if(aiThinking) return;


  const input =
    document.getElementById("textInput");


  const answer =
    input.value.trim();


  if(!answer) return;


  /*
    Answer capture झाल्यावर text clear.
    पण listening = trueच राहते.
    त्यामुळे Mic OFF होत नाही.
  */

  finalSpeech = "";

  input.value = "";

  clearTimeout(silenceTimer);


  sendAnswer(answer);

}


/* =========================
   MIC UI
========================= */

function updateMicUI(){

  const button =
    document.getElementById("micBtn");

  const status =
    document.getElementById("micStatus");


  if(listening){

    button.classList.add("active");

    button.textContent = "🎙️";

    status.textContent =
      recognitionRunning
        ? "Mic ON • Listening..."
        : "Mic ON • Starting...";

  }else{

    button.classList.remove("active");

    button.textContent = "🎤";

    status.textContent =
      "Mic OFF";

  }

}


/* =================================================
   AI VOICE
================================================= */

let speechActive = false;


function speakAI(text){

  const voiceToggle =
    document.getElementById("aiVoice");


  if(!voiceToggle.checked){

    /*
      AI voice OFF असेल तर mic चालूच राहील.
    */

    if(listening){

      setTimeout(
        restartRecognition,
        300
      );

    }

    return;

  }


  if(
    !("speechSynthesis" in window)
  ){

    return;

  }


  /*
    AI बोलण्याआधी recognition pause.
    यामुळे AI चा आवाज answer म्हणून capture होत नाही.
  */

  if(listening && recognition){

    try{

      recognition.stop();

    }catch(e){}

  }


  speechActive = true;


  window.speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(text);


  utterance.lang =
    selectedLanguageCode || "en-IN";


  utterance.rate = 0.95;

  utterance.pitch = 1;


  utterance.onend = function(){

    speechActive = false;


    /*
      AI बोलून झाल्यावर
      User ने Mic ON ठेवले असेल तर
      पुन्हा automatically listening.
    */

    if(listening){

      setTimeout(
        restartRecognition,
        300
      );

    }

  };


  utterance.onerror = function(){

    speechActive = false;


    if(listening){

      setTimeout(
        restartRecognition,
        300
      );

    }

  };


  window.speechSynthesis.speak(
    utterance
  );

}


/* =========================
   ENTER TO SEND
========================= */

document
  .getElementById("textInput")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){

        event.preventDefault();

        sendTextAnswer();

      }

    }
  );


/* =========================
   CLEANUP
========================= */

window.addEventListener(
  "beforeunload",
  function(){

    stopMic();

    if(
      "speechSynthesis" in window
    ){

      window.speechSynthesis.cancel();

    }

  }
);


/* =========================
   INITIAL
========================= */

checkStart();

</script>
