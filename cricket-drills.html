<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Battle Arena</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070b;
  font-family:Arial,sans-serif;
}

.game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#05070b;
}

/* =========================
   CONTINUOUS ROTATING WORLD
========================= */

.rotateWorld{
  position:absolute;
  width:180vmax;
  height:180vmax;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  animation:worldRotate 18s linear infinite;
}

@keyframes worldRotate{

  from{
    transform:
      translate(-50%,-50%)
      rotate(0deg);
  }

  to{
    transform:
      translate(-50%,-50%)
      rotate(360deg);
  }

}

/* =========================
   BACKGROUND
========================= */

.sky{
  position:absolute;
  inset:0;

  background:
    radial-gradient(
      circle at center,
      #304c72 0%,
      #17283d 30%,
      #0b111b 60%,
      #030509 100%
    );
}

/* glowing circles */

.glow{
  position:absolute;
  border-radius:50%;
  filter:blur(50px);
  opacity:.35;
}

.glow1{
  width:320px;
  height:320px;
  background:#1769e0;
  left:8%;
  top:10%;
}

.glow2{
  width:280px;
  height:280px;
  background:#e36a25;
  right:5%;
  top:35%;
}

.glow3{
  width:250px;
  height:250px;
  background:#1769e0;
  left:35%;
  bottom:5%;
}

/* =========================
   ROTATING RINGS
========================= */

.ring{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  border:2px solid rgba(80,170,255,.25);
}

.ring1{
  width:500px;
  height:500px;
}

.ring2{
  width:850px;
  height:850px;
}

.ring3{
  width:1200px;
  height:1200px;
}

/* =========================
   MOUNTAINS
========================= */

.mountain{
  position:absolute;
  bottom:0;
  width:100%;
  height:48%;

  background:
    linear-gradient(
      135deg,
      transparent 0 15%,
      #101925 15% 32%,
      transparent 32% 42%,
      #0b121d 42% 65%,
      transparent 65%
    );
}

/* =========================
   STARS / PARTICLES
========================= */

.particle{
  position:absolute;
  width:4px;
  height:4px;
  border-radius:50%;
  background:white;
  opacity:.6;
}

/* =========================
   CHARACTER
========================= */

.character{
  position:absolute;
  left:50%;
  top:45%;

  width:190px;
  height:330px;

  transform:
    translate(-50%,-50%);

  animation:
    characterFloat 2.5s ease-in-out infinite;

  z-index:4;
}

@keyframes characterFloat{

  0%,100%{
    transform:
      translate(-50%,-50%)
      translateY(0);
  }

  50%{
    transform:
      translate(-50%,-50%)
      translateY(-10px);
  }

}

/* head */

.head{
  position:absolute;

  width:72px;
  height:80px;

  left:59px;
  top:22px;

  border-radius:45%;

  background:
    linear-gradient(
      90deg,
      #b87555,
      #d79570
    );
}

/* hair */

.hair{
  position:absolute;

  width:80px;
  height:48px;

  left:55px;
  top:10px;

  border-radius:
    50% 50% 20% 20%;

  background:#15171b;

  z-index:2;
}

/* body */

.body{
  position:absolute;

  width:108px;
  height:150px;

  left:41px;
  top:91px;

  border-radius:
    30px 30px 18px 18px;

  background:
    linear-gradient(
      90deg,
      #151f2c,
      #40556b,
      #151f2c
    );
}

/* shoulders */

.shoulder{
  position:absolute;

  width:150px;
  height:35px;

  left:20px;
  top:95px;

  border-radius:30px;

  background:#273747;
}

/* arms */

.arm{
  position:absolute;

  width:34px;
  height:130px;

  top:105px;

  border-radius:20px;

  background:#253544;
}

.arm1{
  left:18px;
  transform:rotate(13deg);
}

.arm2{
  right:18px;
  transform:rotate(-13deg);
}

/* gun */

.gun{
  position:absolute;

  width:120px;
  height:18px;

  right:-50px;
  top:170px;

  border-radius:5px;

  background:#101419;

  transform:rotate(-17deg);
}

.gun2{
  position:absolute;

  width:35px;
  height:8px;

  right:35px;
  top:183px;

  background:#252b31;

  transform:rotate(-17deg);
}

/* legs */

.leg{
  position:absolute;

  width:42px;
  height:115px;

  top:225px;

  border-radius:12px;

  background:
    linear-gradient(
      90deg,
      #111821,
      #293846
    );
}

.leg1{
  left:48px;
}

.leg2{
  right:48px;
}

/* =========================
   LOGO
========================= */

.logo{
  position:absolute;

  top:7%;
  left:50%;

  transform:
    translateX(-50%);

  z-index:10;

  text-align:center;

  color:white;

  white-space:nowrap;
}

.logo h1{

  font-size:34px;

  font-weight:900;

  letter-spacing:3px;

  text-shadow:
    0 4px 18px #000;
}

.logo p{

  margin-top:5px;

  font-size:10px;

  letter-spacing:6px;

  opacity:.75;
}

/* =========================
   LOADING
========================= */

.loading{

  position:absolute;

  width:min(82%,430px);

  left:50%;
  bottom:11%;

  transform:
    translateX(-50%);

  z-index:20;

  color:white;

  text-align:center;
}

.loadingTop{

  display:flex;

  justify-content:space-between;

  font-size:13px;

  margin-bottom:8px;
}

.bar{

  width:100%;

  height:7px;

  border-radius:20px;

  overflow:hidden;

  background:
    rgba(255,255,255,.18);
}

.progress{

  width:0%;

  height:100%;

  border-radius:20px;

  background:
    linear-gradient(
      90deg,
      #1769e0,
      #5cb7ff
    );

  box-shadow:
    0 0 14px #1769e0;

  transition:
    width .15s linear;
}

.tip{

  margin-top:12px;

  font-size:11px;

  color:#c9d5e2;
}

/* =========================
   START BUTTON
========================= */

.start{

  display:none;

  position:absolute;

  left:50%;
  bottom:7%;

  transform:
    translateX(-50%);

  width:220px;
  height:52px;

  border:0;

  border-radius:10px;

  color:white;

  font-size:18px;

  font-weight:bold;

  letter-spacing:2px;

  background:
    linear-gradient(
      90deg,
      #1769e0,
      #4b9cff
    );

  box-shadow:
    0 5px 25px
    rgba(23,105,224,.5);

  z-index:20;
}

.start:active{
  transform:
    translateX(-50%)
    scale(.96);
}

/* =========================
   VERSION
========================= */

.version{

  position:absolute;

  bottom:2%;

  left:50%;

  transform:
    translateX(-50%);

  color:
    rgba(255,255,255,.4);

  font-size:9px;

  z-index:20;
}

</style>
</head>

<body>

<div class="game">

  <!-- Continuously rotating background -->

  <div class="rotateWorld">

    <div class="sky"></div>

    <div class="glow glow1"></div>
    <div class="glow glow2"></div>
    <div class="glow glow3"></div>

    <div class="ring ring1"></div>
    <div class="ring ring2"></div>
    <div class="ring ring3"></div>

    <div class="mountain"></div>

    <div class="particle"
         style="left:20%;top:18%"></div>

    <div class="particle"
         style="left:70%;top:15%"></div>

    <div class="particle"
         style="left:85%;top:50%"></div>

    <div class="particle"
         style="left:35%;top:70%"></div>

    <div class="particle"
         style="left:60%;top:80%"></div>

  </div>


  <!-- Character -->

  <div class="character">

    <div class="hair"></div>

    <div class="head"></div>

    <div class="shoulder"></div>

    <div class="body"></div>

    <div class="arm arm1"></div>

    <div class="arm arm2"></div>

    <div class="gun"></div>

    <div class="gun2"></div>

    <div class="leg leg1"></div>

    <div class="leg leg2"></div>

  </div>


  <!-- Logo -->

  <div class="logo">

    <h1>BATTLE ARENA</h1>

    <p>
      BATTLE • SURVIVE • WIN
    </p>

  </div>


  <!-- Loading -->

  <div
    class="loading"
    id="loading">

    <div class="loadingTop">

      <span id="status">
        Loading resources...
      </span>

      <span id="percent">
        0%
      </span>

    </div>

    <div class="bar">

      <div
        class="progress"
        id="progress">
      </div>

    </div>

    <div class="tip">
      Preparing the battlefield...
    </div>

  </div>


  <!-- Start -->

  <button
    class="start"
    id="start">

    START GAME

  </button>


  <div class="version">
    VERSION 1.0
  </div>

</div>


<script>

let progress=0;

const progressBar=
document.getElementById(
  "progress"
);

const percent=
document.getElementById(
  "percent"
);

const status=
document.getElementById(
  "status"
);

const loading=
document.getElementById(
  "loading"
);

const start=
document.getElementById(
  "start"
);


const texts=[

  "Loading resources...",

  "Preparing battlefield...",

  "Loading characters...",

  "Loading weapons...",

  "Generating world...",

  "Connecting server...",

  "Almost ready..."

];


let textIndex=0;


const loadingTimer=
setInterval(()=>{

  progress +=
    Math.floor(
      Math.random()*3
    )+1;


  if(progress>100)
    progress=100;


  progressBar.style.width=
    progress+"%";


  percent.textContent=
    progress+"%";


  if(
    progress>=
    (textIndex+1)*14
    &&
    textIndex<
    texts.length-1
  ){

    textIndex++;

    status.textContent=
      texts[textIndex];

  }


  if(progress>=100){

    clearInterval(
      loadingTimer
    );

    status.textContent=
      "Ready to battle!";


    setTimeout(()=>{

      loading.style.display=
        "none";

      start.style.display=
        "block";

    },700);

  }

},120);


/* Start button */

start.onclick=()=>{

  start.textContent=
    "STARTING...";

  start.disabled=true;

};

</script>

</body>
</html>
