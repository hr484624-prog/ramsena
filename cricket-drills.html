<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Battle Arena</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#080b12;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

.screen{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 50% 35%,
      #304c70 0%,
      #111c2c 42%,
      #05070c 100%
    );
}

/* Background lights */

.light{
  position:absolute;
  border-radius:50%;
  filter:blur(35px);
  opacity:.35;
}

.light.one{
  width:180px;
  height:180px;
  background:#1769e0;
  top:12%;
  left:-40px;
}

.light.two{
  width:220px;
  height:220px;
  background:#e05a17;
  right:-80px;
  top:28%;
}

.light.three{
  width:170px;
  height:170px;
  background:#1769e0;
  bottom:5%;
  left:30%;
}

/* Fake mountain background */

.mountains{
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  height:48%;
  background:
    linear-gradient(
      135deg,
      transparent 0 20%,
      #111925 20% 35%,
      transparent 35% 45%,
      #0c131d 45% 65%,
      transparent 65%
    );
  opacity:.9;
}

/* Character */

.character{
  position:absolute;
  left:50%;
  top:43%;
  transform:
    translate(-50%,-50%);
  width:170px;
  height:300px;
  animation:
    float 2.8s ease-in-out infinite;
}

.head{
  position:absolute;
  width:72px;
  height:78px;
  border-radius:45%;
  background:#c88662;
  top:25px;
  left:49px;
  box-shadow:
    inset -8px -4px 0 rgba(0,0,0,.12);
}

.hair{
  position:absolute;
  width:78px;
  height:42px;
  border-radius:50% 50% 20% 20%;
  background:#171717;
  top:15px;
  left:46px;
  z-index:2;
}

.body{
  position:absolute;
  width:100px;
  height:145px;
  border-radius:30px 30px 15px 15px;
  background:
    linear-gradient(
      90deg,
      #182331,
      #39495a,
      #182331
    );
  top:92px;
  left:35px;
}

.arm{
  position:absolute;
  width:30px;
  height:125px;
  border-radius:20px;
  background:#263545;
  top:105px;
}

.arm.left{
  left:15px;
  transform:rotate(15deg);
}

.arm.right{
  right:15px;
  transform:rotate(-15deg);
}

.gun{
  position:absolute;
  width:110px;
  height:18px;
  background:#15191e;
  right:-45px;
  top:175px;
  transform:rotate(-18deg);
  border-radius:5px;
}

.leg{
  position:absolute;
  width:38px;
  height:110px;
  background:#18212b;
  top:220px;
  border-radius:10px;
}

.leg.left{
  left:47px;
  transform:rotate(3deg);
}

.leg.right{
  right:47px;
  transform:rotate(-3deg);
}

@keyframes float{
  0%,100%{
    transform:
      translate(-50%,-50%)
      translateY(0);
  }

  50%{
    transform:
      translate(-50%,-50%)
      translateY(-8px);
  }
}

/* Logo */

.logo{
  position:absolute;
  top:8%;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  color:white;
  letter-spacing:2px;
}

.logo h1{
  font-size:34px;
  font-weight:900;
  text-shadow:
    0 4px 15px rgba(0,0,0,.8);
}

.logo p{
  margin-top:5px;
  font-size:11px;
  letter-spacing:5px;
  opacity:.7;
}

/* Loading */

.loading{
  position:absolute;
  left:50%;
  bottom:13%;
  transform:translateX(-50%);
  width:min(82%,430px);
  text-align:center;
  color:white;
}

.loadingText{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  margin-bottom:9px;
  opacity:.9;
}

.bar{
  width:100%;
  height:7px;
  background:rgba(255,255,255,.2);
  border-radius:20px;
  overflow:hidden;
}

.progress{
  width:0%;
  height:100%;
  background:
    linear-gradient(
      90deg,
      #1769e0,
      #65b5ff
    );
  border-radius:20px;
  box-shadow:
    0 0 12px #1769e0;
}

.tip{
  margin-top:13px;
  font-size:11px;
  color:#c9d3df;
}

/* Start */

.start{
  display:none;
  position:absolute;
  left:50%;
  bottom:8%;
  transform:translateX(-50%);
  width:210px;
  height:50px;
  border:0;
  border-radius:10px;
  color:white;
  font-size:18px;
  font-weight:bold;
  letter-spacing:2px;
  background:
    linear-gradient(
      90deg,
      #1769e0,
      #398cff
    );
  box-shadow:
    0 5px 25px rgba(23,105,224,.45);
}

.start:active{
  transform:
    translateX(-50%)
    scale(.96);
}

/* Version */

.version{
  position:absolute;
  bottom:2%;
  left:50%;
  transform:translateX(-50%);
  color:rgba(255,255,255,.4);
  font-size:10px;
}

</style>
</head>

<body>

<div class="screen">

  <div class="light one"></div>
  <div class="light two"></div>
  <div class="light three"></div>

  <div class="mountains"></div>

  <div class="logo">
    <h1>BATTLE ARENA</h1>
    <p>BATTLE • SURVIVE • WIN</p>
  </div>

  <!-- Original character -->

  <div class="character">

    <div class="hair"></div>
    <div class="head"></div>

    <div class="body"></div>

    <div class="arm left"></div>
    <div class="arm right"></div>

    <div class="gun"></div>

    <div class="leg left"></div>
    <div class="leg right"></div>

  </div>

  <!-- Loading -->

  <div class="loading" id="loading">

    <div class="loadingText">
      <span id="status">
        Loading resources...
      </span>

      <span id="percent">
        0%
      </span>
    </div>

    <div class="bar">
      <div
        class="progress"
        id="progress">
      </div>
    </div>

    <div class="tip">
      Preparing the battlefield...
    </div>

  </div>

  <button
    class="start"
    id="start">
    START GAME
  </button>

  <div class="version">
    VERSION 1.0
  </div>

</div>

<script>

let progress = 0;

const bar =
document.getElementById(
  "progress"
);

const percent =
document.getElementById(
  "percent"
);

const status =
document.getElementById(
  "status"
);

const loading =
document.getElementById(
  "loading"
);

const start =
document.getElementById(
  "start"
);


const messages = [

  "Loading resources...",

  "Preparing battlefield...",

  "Loading characters...",

  "Preparing weapons...",

  "Generating world...",

  "Almost ready..."

];


let messageIndex=0;


const timer =
setInterval(()=>{

  progress +=
  Math.floor(
    Math.random()*4
  ) + 1;


  if(progress>100)
    progress=100;


  bar.style.width=
  progress+"%";

  percent.textContent=
  progress+"%";


  if(
    progress>
    (messageIndex+1)*15 &&
    messageIndex<
    messages.length-1
  ){

    messageIndex++;

    status.textContent=
    messages[messageIndex];

  }


  if(progress>=100){

    clearInterval(timer);

    status.textContent=
    "Ready to battle!";

    setTimeout(()=>{

      loading.style.display=
      "none";

      start.style.display=
      "block";

    },500);

  }

},100);


/* Start button */

start.addEventListener(
  "click",
  ()=>{

    start.textContent=
    "STARTING...";

    start.disabled=true;

    /*
      Yahan baad mein actual
      3D game start kar sakte ho.
    */

    setTimeout(()=>{

      start.textContent=
      "GAME READY";

    },1000);

  }
);

</script>

</body>
</html>
