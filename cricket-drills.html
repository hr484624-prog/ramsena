<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Battle Arena</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070b;
  font-family:Arial,sans-serif;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

.page{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#080d16;
}

/* =========================
   ROTATING BACKGROUND
========================= */

.rotate-bg{
  position:absolute;
  width:170vmax;
  height:170vmax;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  animation:rotateWorld 18s linear infinite;

  background:
    conic-gradient(
      from 0deg,
      #07111e,
      #17395c,
      #08101b,
      #304a62,
      #090e17,
      #1c4166,
      #07111e
    );
}

.rotate-bg::before{
  content:"";
  position:absolute;
  inset:12%;
  border-radius:50%;
  border:2px solid rgba(100,180,255,.18);
  box-shadow:
    0 0 80px rgba(30,130,255,.25),
    inset 0 0 80px rgba(30,130,255,.18);
}

@keyframes rotateWorld{
  from{
    transform:
      translate(-50%,-50%)
      rotate(0deg);
  }

  to{
    transform:
      translate(-50%,-50%)
      rotate(360deg);
  }
}

/* =========================
   MOVING LIGHTS
========================= */

.light{
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  filter:blur(45px);
  opacity:.35;
  animation:
    moveLight 5s ease-in-out infinite alternate;
}

.light1{
  background:#1684ff;
  left:-60px;
  top:10%;
}

.light2{
  background:#ff681c;
  right:-70px;
  top:30%;
  animation-delay:1s;
}

.light3{
  background:#1675ff;
  left:40%;
  bottom:-90px;
  animation-delay:2s;
}

@keyframes moveLight{
  from{
    transform:translate(0,0);
  }

  to{
    transform:translate(60px,-35px);
  }
}

/* =========================
   DARK OVERLAY
========================= */

.overlay{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.35),
      rgba(0,0,0,.15) 45%,
      rgba(0,0,0,.8)
    );
}

/* =========================
   LOGO
========================= */

.logo{
  position:absolute;
  top:9%;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  color:white;
  z-index:5;
}

.logo h1{
  font-size:36px;
  font-weight:900;
  letter-spacing:3px;
  text-shadow:
    0 4px 18px rgba(0,0,0,.9);
}

.logo p{
  margin-top:6px;
  font-size:10px;
  letter-spacing:6px;
  opacity:.75;
}

/* =========================
   CENTER CHARACTER
========================= */

.character{
  position:absolute;
  width:190px;
  height:350px;
  left:50%;
  top:45%;
  transform:
    translate(-50%,-50%);
  z-index:4;

  animation:
    characterFloat 2.5s ease-in-out infinite;
}

.head{
  position:absolute;
  width:70px;
  height:78px;
  left:60px;
  top:15px;
  border-radius:45%;
  background:#bd7959;
  z-index:3;
}

.hair{
  position:absolute;
  width:78px;
  height:45px;
  left:56px;
  top:5px;
  border-radius:50% 50% 20% 20%;
  background:#111;
  z-index:4;
}

.body{
  position:absolute;
  width:105px;
  height:150px;
  left:43px;
  top:82px;
  border-radius:30px 30px 15px 15px;

  background:
    linear-gradient(
      90deg,
      #101923,
      #405469,
      #17222e
    );
}

.arm{
  position:absolute;
  width:32px;
  height:125px;
  top:95px;
  border-radius:20px;
  background:#253443;
}

.arm1{
  left:20px;
  transform:rotate(15deg);
}

.arm2{
  right:20px;
  transform:rotate(-15deg);
}

.gun{
  position:absolute;
  width:125px;
  height:17px;
  right:-55px;
  top:170px;
  border-radius:5px;
  background:#11171d;
  transform:rotate(-18deg);
  box-shadow:0 3px 8px #000;
}

.leg{
  position:absolute;
  width:40px;
  height:115px;
  top:220px;
  border-radius:10px;
  background:#131c25;
}

.leg1{
  left:52px;
}

.leg2{
  right:52px;
}

@keyframes characterFloat{
  0%,100%{
    transform:
      translate(-50%,-50%)
      translateY(0);
  }

  50%{
    transform:
      translate(-50%,-50%)
      translateY(-9px);
  }
}

/* =========================
   LOADING
========================= */

.loading{
  position:absolute;
  left:50%;
  bottom:13%;
  transform:translateX(-50%);
  width:min(82%,430px);
  color:white;
  z-index:8;
}

.loadingTop{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
  font-size:12px;
}

.bar{
  width:100%;
  height:7px;
  border-radius:20px;
  background:rgba(255,255,255,.2);
  overflow:hidden;
}

.progress{
  width:0%;
  height:100%;
  border-radius:20px;

  background:
    linear-gradient(
      90deg,
      #1769e0,
      #65b8ff
    );

  box-shadow:
    0 0 15px #1769e0;

  transition:
    width .1s linear;
}

.tip{
  text-align:center;
  margin-top:10px;
  font-size:10px;
  opacity:.65;
}

/* =========================
   START BUTTON
========================= */

.start{
  display:none;

  position:absolute;
  left:50%;
  bottom:8%;
  transform:translateX(-50%);

  width:220px;
  height:52px;

  border:0;
  border-radius:10px;

  color:white;
  font-size:18px;
  font-weight:900;
  letter-spacing:2px;

  background:
    linear-gradient(
      90deg,
      #1769e0,
      #4b9dff
    );

  box-shadow:
    0 5px 25px
    rgba(23,105,224,.55);

  z-index:10;
}

.start:active{
  transform:
    translateX(-50%)
    scale(.96);
}

/* =========================
   VERSION
========================= */

.version{
  position:absolute;
  bottom:2%;
  left:50%;
  transform:translateX(-50%);
  color:rgba(255,255,255,.35);
  font-size:9px;
  z-index:5;
}

</style>
</head>

<body>

<div class="page">

  <div class="rotate-bg"></div>

  <div class="light light1"></div>
  <div class="light light2"></div>
  <div class="light light3"></div>

  <div class="overlay"></div>

  <!-- LOGO -->

  <div class="logo">

    <h1>BATTLE ARENA</h1>

    <p>
      BATTLE • SURVIVE • WIN
    </p>

  </div>


  <!-- CHARACTER -->

  <div class="character">

    <div class="hair"></div>

    <div class="head"></div>

    <div class="body"></div>

    <div class="arm arm1"></div>

    <div class="arm arm2"></div>

    <div class="gun"></div>

    <div class="leg leg1"></div>

    <div class="leg leg2"></div>

  </div>


  <!-- LOADING -->

  <div
    class="loading"
    id="loading">

    <div class="loadingTop">

      <span id="status">
        Loading resources...
      </span>

      <span id="percent">
        0%
      </span>

    </div>

    <div class="bar">

      <div
        class="progress"
        id="progress">
      </div>

    </div>

    <div class="tip">
      Preparing the battlefield...
    </div>

  </div>


  <!-- START -->

  <button
    class="start"
    id="start">

    START

  </button>


  <div class="version">
    VERSION 1.0
  </div>

</div>


<script>

let progress=0;

const progressBar=
document.getElementById(
  "progress"
);

const percent=
document.getElementById(
  "percent"
);

const status=
document.getElementById(
  "status"
);

const loading=
document.getElementById(
  "loading"
);

const start=
document.getElementById(
  "start"
);


const loadingMessages=[

  "Loading resources...",

  "Preparing battlefield...",

  "Loading characters...",

  "Loading weapons...",

  "Preparing world...",

  "Almost ready..."

];


let messageIndex=0;


const loader=setInterval(()=>{

  progress +=
    Math.floor(
      Math.random()*3
    )+1;

  if(progress>100)
    progress=100;


  progressBar.style.width=
    progress+"%";

  percent.textContent=
    progress+"%";


  if(
    progress>=
    (messageIndex+1)*16
  ){

    if(
      messageIndex<
      loadingMessages.length-1
    ){

      messageIndex++;

      status.textContent=
        loadingMessages[
          messageIndex
        ];

    }

  }


  if(progress>=100){

    clearInterval(loader);

    status.textContent=
      "Ready!";

    setTimeout(()=>{

      loading.style.display=
        "none";

      start.style.display=
        "block";

    },600);

  }

},100);


/* =========================
   OPEN start.html
========================= */

start.addEventListener(
  "click",
  function(){

    window.location.href=
      "start.html";

  }
);

</script>

</body>
</html>
