<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GyanSetu AI Study - Class 5</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc);color:#111827}
header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:white;padding:25px 15px;text-align:center}
header h1{font-size:28px;margin-bottom:7px}
.container{max-width:900px;margin:auto;padding:20px 15px}
.lesson-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}
.lesson-card{background:white;border-radius:18px;padding:20px;box-shadow:0 5px 18px #00000012;cursor:pointer;transition:.2s}
.lesson-card:hover{transform:translateY(-3px)}
.lesson-number{font-size:28px;margin-bottom:10px}
.lesson-card h3{margin-bottom:7px}
.lesson-card p{color:#6b7280;font-size:13px}

.overlay{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:1000}
.popup{width:100%;max-width:430px;background:white;border-radius:22px;padding:25px}
.popup h2{margin-bottom:10px}
.popup p{color:#6b7280;margin-bottom:18px}
.popup input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px;margin-bottom:18px}
.popup-buttons{display:flex;gap:10px}
.popup-buttons button{flex:1;padding:13px;border:0;border-radius:12px;font-weight:bold}
.cancel{background:#e5e7eb}
.start{background:#4f46e5;color:white}

.class-screen{position:fixed;inset:0;background:#f8fafc;z-index:2000;display:none;flex-direction:column}
.class-header{min-height:65px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:white;display:flex;align-items:center;justify-content:space-between;padding:10px 15px}
.class-title{font-weight:bold}
.close{width:42px;height:42px;border:0;border-radius:50%;background:#ef4444;color:white;font-size:25px}
.class-body{flex:1;overflow-y:auto;padding:20px}
.ai-area{text-align:center;margin-bottom:20px}
.ai-sir{width:150px;height:150px;margin:auto;position:relative;animation:float 2.5s infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.head{position:absolute;width:105px;height:105px;border-radius:50%;background:#ffd6b3;left:22px;top:5px;border:4px solid #312e81}
.hair{position:absolute;width:90px;height:45px;background:#111827;border-radius:50px 50px 15px 15px;left:7px;top:-4px}
.eye{position:absolute;width:10px;height:10px;background:#111;border-radius:50%;top:45px}
.left{left:28px}.right{right:28px}
.nose{position:absolute;width:7px;height:12px;border-left:2px solid #b77955;left:49px;top:52px}
.mouth{position:absolute;width:32px;height:7px;border-bottom:4px solid #dc2626;border-radius:50%;left:34px;top:72px}
.ai-speaking .mouth{height:20px;background:#991b1b;border-radius:50%}
.body{position:absolute;width:125px;height:70px;background:#4f46e5;border-radius:45px 45px 15px 15px;bottom:0;left:12px}
.tie{position:absolute;border-left:12px solid transparent;border-right:12px solid transparent;border-top:35px solid #ef4444;left:50px;top:10px}
.ai-status{color:#4f46e5;font-weight:bold}
.lesson-content,.question-box{background:white;border-radius:18px;padding:20px;box-shadow:0 4px 15px #00000012;margin-bottom:18px;line-height:1.7}
.lesson-content h2{color:#4f46e5;margin-bottom:12px}
.controls{display:flex;gap:10px;margin-bottom:18px}
.controls button{border:0;padding:12px 18px;border-radius:12px;font-weight:bold}
.speak{background:#4f46e5;color:white}
.stop{background:#fee2e2;color:#b91c1c}
.question-row{display:flex;gap:10px;margin-top:12px}
.question-row input{flex:1;padding:13px;border:1px solid #ddd;border-radius:12px}
.question-row button{padding:13px 18px;background:#16a34a;color:white;border:0;border-radius:12px}
.answer{display:none;margin-top:15px;padding:15px;background:#f0fdf4;border-left:4px solid #16a34a}
@media(max-width:600px){.lesson-grid{grid-template-columns:1fr}.question-row{flex-direction:column}}
</style>
</head>

<body>

<header>
<h1>🤖 GyanSetu AI Study</h1>
<p>Class 5 Mathematics • Learn with AI Sir</p>
</header>

<div class="container">
<div class="lesson-grid" id="lessonGrid"></div>
</div>

<div class="overlay" id="overlay">
<div class="popup">
<h2>👨‍🏫 Start Your Class</h2>
<p id="selectedText"></p>
<input id="studentName" placeholder="Your name (optional)">
<div class="popup-buttons">
<button class="cancel" onclick="closePopup()">Cancel</button>
<button class="start" onclick="startClass()">Start Class</button>
</div>
</div>
</div>

<div class="class-screen" id="classScreen">

<div class="class-header">
<div class="class-title" id="classTitle"></div>
<button class="close" onclick="closeClass()">×</button>
</div>

<div class="class-body">

<div class="ai-area">
<div class="ai-sir" id="aiSir">
<div class="head">
<div class="hair"></div>
<div class="eye left"></div>
<div class="eye right"></div>
<div class="nose"></div>
<div class="mouth"></div>
</div>
<div class="body"><div class="tie"></div></div>
</div>
<div class="ai-status" id="status">AI Sir is ready 👨‍🏫</div>
</div>

<div class="lesson-content" id="lessonContent">
📚 AI Sir is preparing your lesson...
</div>

<div class="controls">
<button class="speak" onclick="speakLesson()">🔊 Start / Replay</button>
<button class="stop" onclick="stopSpeaking()">⏹ Stop</button>
</div>

<div class="question-box">
<h3>❓ Ask AI Sir</h3>
<div class="question-row">
<input id="question" placeholder="तुमचा प्रश्न लिहा..." onkeydown="if(event.key==='Enter')askAI()">
<button onclick="askAI()">Ask</button>
</div>
<div class="answer" id="answer"></div>
</div>

</div>
</div>

<script>

const API="https://gyan-setu-ai-study-backend.vercel.app";

const topics=[
"Numbers and Numeration",
"Four Operations",
"Factors and Multiples",
"Fractions",
"Decimals",
"Geometry",
"Measurement",
"Perimeter and Area",
"Patterns",
"Data Handling",
"Time",
"Money",
"Shapes and Spatial Understanding",
"Mapping",
"Symmetry",
"Volume"
];

let selectedTopic="";
let studentName="";

const grid=document.getElementById("lessonGrid");

topics.forEach((title,i)=>{
grid.innerHTML+=`
<div class="lesson-card" onclick="openPopup('${title.replace(/'/g,"\\'")}')">
<div class="lesson-number">📚</div>
<h3>${i+1}. ${title}</h3>
<p>Learn ${title} with AI Sir 👨‍🏫</p>
</div>`;
});

function openPopup(topic){
selectedTopic=topic;
document.getElementById("selectedText").innerHTML=
`You are starting: <b>${topic}</b><br>Enter your name (optional).`;
document.getElementById("studentName").value="";
document.getElementById("overlay").style.display="flex";
}

function closePopup(){
document.getElementById("overlay").style.display="none";
}

async function startClass(){

studentName=document.getElementById("studentName").value.trim();

closePopup();

document.getElementById("classScreen").style.display="flex";
document.getElementById("classTitle").textContent=
"Class 5 Mathematics • "+selectedTopic;

document.getElementById("lessonContent").innerHTML=
"🤖 AI Sir is preparing the lesson...";

await generateLesson();
}

async function generateLesson(){

try{

const res=await fetch(API+"/api/ai/lesson",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
topic:"Class 5 Mathematics - "+selectedTopic,
language:"Marathi"
})
});

const data=await res.json();

if(!res.ok)throw new Error(data.error||"Lesson failed");

let lesson=data.lesson||data.answer||data.content||data.message||"";

document.getElementById("lessonContent").innerHTML=
`<h2>📚 ${selectedTopic}</h2><p>${formatText(lesson)}</p>`;

document.getElementById("status").textContent=
studentName
?`नमस्कार ${studentName}! 👋 AI Sir तयार आहे.`
:"नमस्कार! 👋 AI Sir तयार आहे.";

speakText(
(studentName?`नमस्कार ${studentName}. `:"नमस्कार. ")+
clean(lesson)
);

}catch(e){

document.getElementById("lessonContent").innerHTML=
`<h2>⚠️ Error</h2><p>Lesson load करता आला नाही.</p>`;

console.error(e);

}

}

async function askAI(){

const q=document.getElementById("question").value.trim();
if(!q)return;

const box=document.getElementById("answer");
box.style.display="block";
box.innerHTML="🤖 AI Sir विचार करत आहे...";

try{

const res=await fetch(API+"/api/ai/ask",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
question:q,
topic:"Class 5 Mathematics - "+selectedTopic,
language:"Marathi"
})
});

const data=await res.json();

if(!res.ok)throw new Error(data.error);

let answer=data.answer||data.response||data.content||data.message||"";

box.innerHTML=`<b>👨‍🏫 AI Sir:</b><br><br>${formatText(answer)}`;

speakText((studentName?studentName+", ":"")+clean(answer));

document.getElementById("question").value="";

}catch(e){
box.innerHTML="❌ उत्तर मिळाले नाही.";
}

}

function speakLesson(){
const text=document.getElementById("lessonContent").innerText;
speakText(clean(text));
}

function speakText(text){

window.speechSynthesis.cancel();

const u=new SpeechSynthesisUtterance(text);
u.lang="mr-IN";
u.rate=.9;

u.onstart=()=>{
document.getElementById("aiSir").classList.add("ai-speaking");
document.getElementById("status").textContent="🔊 AI Sir बोलत आहे...";
};

u.onend=()=>{
document.getElementById("aiSir").classList.remove("ai-speaking");
document.getElementById("status").textContent="AI Sir is ready 👨‍🏫";
};

window.speechSynthesis.speak(u);
}

function stopSpeaking(){
window.speechSynthesis.cancel();
document.getElementById("aiSir").classList.remove("ai-speaking");
}

function closeClass(){
stopSpeaking();
document.getElementById("classScreen").style.display="none";
}

function clean(text){
return String(text).replace(/\*\*/g,"").replace(/[#*_`]/g,"").replace(/\s+/g," ").trim();
}

function formatText(text){
return escapeHTML(text).replace(/\*\*(.*?)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>");
}

function escapeHTML(text){
const d=document.createElement("div");
d.textContent=text;
return d.innerHTML;
}

</script>

</body>
</html>
