<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GyanSetu - Users</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
    }

    .header {
      background: white;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .back {
      border: none;
      background: none;
      font-size: 25px;
      cursor: pointer;
    }

    .title {
      font-size: 21px;
      font-weight: bold;
    }

    .search-box {
      padding: 15px;
    }

    .search-box input {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    #usersList {
      padding: 0 15px 20px;
    }

    .user-card {
      background: white;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 13px;
      box-shadow: 0 2px 7px rgba(0,0,0,0.06);
      cursor: pointer;
      position: relative;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #e8f0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .user-info {
      min-width: 0;
      flex: 1;
    }

    .username {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .email {
      font-size: 13px;
      color: #777;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 🔵 Unread message dot */
    .unread-dot {
      width: 10px;
      height: 10px;
      background: #1877f2;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px white;
    }

    .unread-badge {
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 12px;
      background: #1877f2;
      color: white;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: auto;
    }

    .loading,
    .empty,
    .error {
      text-align: center;
      padding: 40px 20px;
      color: #777;
    }

    .error {
      color: #d93025;
    }

    .refresh {
      margin-left: auto;
      border: none;
      background: #f1f3f5;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="header">

    <button class="back" onclick="goBack()">‹</button>

    <div class="title">GyanSetu Users</div>

    <button class="refresh" onclick="loadUsers()">↻</button>

  </div>


  <div class="search-box">

    <input
      type="text"
      id="searchInput"
      placeholder="Search user..."
      oninput="searchUsers()"
    >

  </div>


  <div id="usersList">

    <div class="loading">
      Users loading...
    </div>

  </div>


  <script>

    const SUPABASE_URL =
      "https://eqglttfffhvoyvrclzse.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_rR4xxl0dW5DJrhhjqiFHLw_uJ-HakAb";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let allUsers = [];

    let currentUser = null;

    let unreadMessages = {};


    // ==========================================
    // GET CURRENT LOGGED-IN USER
    // ==========================================

    async function getCurrentUser() {

      const {
        data,
        error
      } =
      await supabaseClient.auth.getUser();

      if (error) {

        console.error(
          "Current user error:",
          error
        );

        return null;
      }

      currentUser = data.user;

      return currentUser;
    }


    // ==========================================
    // LOAD USERS
    // ==========================================

    async function loadUsers() {

      const usersList =
        document.getElementById("usersList");


      usersList.innerHTML =
        '<div class="loading">Users loading...</div>';


      // Current user मिळवा
      if (!currentUser) {

        await getCurrentUser();

      }


      // ------------------------------------------
      // LOAD PROFILES
      // ------------------------------------------

      const {
        data: users,
        error
      } =
      await supabaseClient
        .from("Profiles")
        .select("*")
        .order("username", {
          ascending: true
        });


      if (error) {

        console.error(error);

        usersList.innerHTML = `
          <div class="error">

            Users load झाले नाहीत.

            <br><br>

            ${escapeHTML(error.message)}

          </div>
        `;

        return;
      }


      allUsers = users || [];


      // ------------------------------------------
      // LOAD UNREAD MESSAGES
      // ------------------------------------------

      await loadUnreadMessages();


      displayUsers(allUsers);

    }


    // ==========================================
    // LOAD UNREAD MESSAGES
    // ==========================================

    async function loadUnreadMessages() {

      unreadMessages = {};


      if (!currentUser) {

        return;

      }


      const {
        data: messages,
        error
      } =
      await supabaseClient
        .from("Messages")
        .select("id, sender_id, receiver_id, is_read, created_at")
        .eq("receiver_id", currentUser.id)
        .eq("is_read", false);


      if (error) {

        console.error(
          "Unread messages error:",
          error
        );

        return;
      }


      (messages || []).forEach(message => {

        const senderId =
          message.sender_id;


        if (!unreadMessages[senderId]) {

          unreadMessages[senderId] = 0;

        }


        unreadMessages[senderId]++;

      });

    }


    // ==========================================
    // DISPLAY USERS
    // ==========================================

    function displayUsers(users) {

      const usersList =
        document.getElementById("usersList");


      if (!users || users.length === 0) {

        usersList.innerHTML = `
          <div class="empty">

            सध्या कोणताही user उपलब्ध नाही.

          </div>
        `;

        return;
      }


      usersList.innerHTML =
        users.map(user => {

          const username =
            user.username ||
            "Unknown User";


          const email =
            user.email ||
            "";


          const firstLetter =
            username
              .charAt(0)
              .toUpperCase();


          const unreadCount =
            unreadMessages[user.id] || 0;


          const unreadHTML =
            unreadCount > 0

            ? `
                <span
                  class="unread-dot"
                  title="${unreadCount} unread message${unreadCount > 1 ? 's' : ''}"
                ></span>
              `

            : "";


          const badgeHTML =
            unreadCount > 1

            ? `
                <span class="unread-badge">
                  ${unreadCount > 99 ? "99+" : unreadCount}
                </span>
              `

            : "";


          return `

            <div
              class="user-card"
              onclick="openUser('${escapeHTML(user.id)}')"
            >

              <div class="avatar">
                ${escapeHTML(firstLetter)}
              </div>


              <div class="user-info">

                <div class="username">

                  ${escapeHTML(username)}

                  ${unreadHTML}

                </div>


                ${
                  email

                  ? `
                    <div class="email">
                      ${escapeHTML(email)}
                    </div>
                  `

                  : ""
                }

              </div>


              ${badgeHTML}

            </div>

          `;

        }).join("");

    }


    // ==========================================
    // SEARCH USERS
    // ==========================================

    function searchUsers() {

      const search =
        document
          .getElementById("searchInput")
          .value
          .toLowerCase()
          .trim();


      if (!search) {

        displayUsers(allUsers);

        return;

      }


      const filtered =
        allUsers.filter(user => {

          const username =
            (user.username || "")
              .toLowerCase();


          const email =
            (user.email || "")
              .toLowerCase();


          return (
            username.includes(search) ||
            email.includes(search)
          );

        });


      displayUsers(filtered);

    }


    // ==========================================
    // OPEN USER
    // ==========================================

    async function openUser(id) {

      if (!id) return;


      /*
        User उघडताना त्या user कडून आलेले
        unread messages read करण्याचा प्रयत्न.

        त्यामुळे user/profile/chat उघडल्यानंतर
        users page वर परत आल्यावर dot गायब होईल.
      */

      if (currentUser) {

        const {
          error
        } =
        await supabaseClient
          .from("Messages")
          .update({
            is_read: true
          })
          .eq("sender_id", id)
          .eq("receiver_id", currentUser.id)
          .eq("is_read", false);


        if (error) {

          console.error(
            "Read update error:",
            error
          );

        }

      }


      window.location.href =
        "user-profile.html?id=" +
        encodeURIComponent(id);

    }


    // ==========================================
    // REALTIME NEW MESSAGE LISTENER
    // ==========================================

    function startRealtime() {

      if (!currentUser) {

        return;

      }


      supabaseClient
        .channel(
          "users-unread-messages-" +
          currentUser.id
        )

        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: "Messages",
            filter:
              "receiver_id=eq." +
              currentUser.id
          },

          async function(payload) {

            console.log(
              "New message received:",
              payload.new
            );


            const senderId =
              payload.new.sender_id;


            if (!unreadMessages[senderId]) {

              unreadMessages[senderId] = 0;

            }


            unreadMessages[senderId]++;


            displayUsers(
              getFilteredUsers()
            );

          }
        )

        .subscribe();

    }


    // ==========================================
    // CURRENT SEARCH FILTER
    // ==========================================

    function getFilteredUsers() {

      const search =
        document
          .getElementById("searchInput")
          .value
          .toLowerCase()
          .trim();


      if (!search) {

        return allUsers;

      }


      return allUsers.filter(user => {

        const username =
          (user.username || "")
            .toLowerCase();


        const email =
          (user.email || "")
            .toLowerCase();


        return (
          username.includes(search) ||
          email.includes(search)
        );

      });

    }


    // ==========================================
    // BACK
    // ==========================================

    function goBack() {

      window.history.back();

    }


    // ==========================================
    // ESCAPE HTML
    // ==========================================

    function escapeHTML(text) {

      return String(text)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    // ==========================================
    // START
    // ==========================================

    async function startPage() {

      await getCurrentUser();

      await loadUsers();

      startRealtime();

    }


    startPage();

  </script>

</body>
</html>
