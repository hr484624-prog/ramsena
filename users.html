<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GyanSetu - Users</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
    }

    .header {
      background: white;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .back {
      border: none;
      background: none;
      font-size: 25px;
      cursor: pointer;
    }

    .title {
      font-size: 21px;
      font-weight: bold;
    }

    .search-box {
      padding: 15px;
    }

    .search-box input {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    #usersList {
      padding: 0 15px 20px;
    }

    .user-card {
      background: white;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 13px;
      box-shadow: 0 2px 7px rgba(0,0,0,0.06);
      cursor: pointer;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #e8f0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .user-info {
      min-width: 0;
    }

    .username {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .email {
      font-size: 13px;
      color: #777;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .loading,
    .empty,
    .error {
      text-align: center;
      padding: 40px 20px;
      color: #777;
    }

    .error {
      color: #d93025;
    }

    .refresh {
      margin-left: auto;
      border: none;
      background: #f1f3f5;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="header">
    <button class="back" onclick="goBack()">‹</button>

    <div class="title">GyanSetu Users</div>

    <button class="refresh" onclick="loadUsers()">↻</button>
  </div>

  <div class="search-box">
    <input
      type="text"
      id="searchInput"
      placeholder="Search user..."
      oninput="searchUsers()"
    >
  </div>

  <div id="usersList">
    <div class="loading">Users loading...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://eqglttfffhvoyvrclzse.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_rR4xxl0dW5DJrhhjqiFHLw_uJ-HakAb";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    let allUsers = [];

    async function loadUsers() {

      const usersList = document.getElementById("usersList");

      usersList.innerHTML =
        '<div class="loading">Users loading...</div>';

      const {
        data: users,
        error
      } = await supabaseClient
        .from("Profiles")
        .select("*")
        .order("username", { ascending: true });

      if (error) {

        console.error(error);

        usersList.innerHTML = `
          <div class="error">
            Users load झाले नाहीत.<br><br>
            ${error.message}
          </div>
        `;

        return;
      }

      allUsers = users || [];

      displayUsers(allUsers);
    }


    function displayUsers(users) {

      const usersList = document.getElementById("usersList");

      if (!users || users.length === 0) {

        usersList.innerHTML = `
          <div class="empty">
            सध्या कोणताही user उपलब्ध नाही.
          </div>
        `;

        return;
      }

      usersList.innerHTML = users.map(user => {

        const username =
          user.username || "Unknown User";

        const email =
          user.email || "";

        const firstLetter =
          username.charAt(0).toUpperCase();

        return `
          <div
            class="user-card"
            onclick="openUser('${user.id}')"
          >

            <div class="avatar">
              ${firstLetter}
            </div>

            <div class="user-info">

              <div class="username">
                ${escapeHTML(username)}
              </div>

              ${
                email
                ? `<div class="email">${escapeHTML(email)}</div>`
                : ""
              }

            </div>

          </div>
        `;

      }).join("");
    }


    function searchUsers() {

      const search =
        document
          .getElementById("searchInput")
          .value
          .toLowerCase()
          .trim();

      if (!search) {

        displayUsers(allUsers);

        return;
      }

      const filtered =
        allUsers.filter(user => {

          const username =
            (user.username || "").toLowerCase();

          const email =
            (user.email || "").toLowerCase();

          return (
            username.includes(search) ||
            email.includes(search)
          );

        });

      displayUsers(filtered);
    }


    function openUser(id) {

      if (!id) return;

      window.location.href =
        "user-profile.html?id=" +
        encodeURIComponent(id);
    }


    function goBack() {

      window.history.back();
    }


    function escapeHTML(text) {

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    loadUsers();
  </script>

</body>
</html>
