<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Users - GyanSetu</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f6f9;
  color:#222;
  padding-bottom:20px;
}

body.dark{
  background:#121212;
  color:#fff;
}


/* HEADER */

.header{
  height:60px;
  background:#fff;
  display:flex;
  align-items:center;
  padding:0 12px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.dark .header{
  background:#1e1e1e;
}

.back-btn{
  width:42px;
  height:42px;
  border:none;
  background:transparent;
  font-size:27px;
  cursor:pointer;
  border-radius:50%;
}

.back-btn:hover{
  background:#eee;
}

.dark .back-btn:hover{
  background:#333;
}

.header-title{
  flex:1;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  margin-right:42px;
}


/* CONTAINER */

.container{
  max-width:600px;
  margin:auto;
  padding:15px;
}


/* SEARCH */

.search-box{
  background:#fff;
  border-radius:14px;
  padding:10px 14px;
  display:flex;
  align-items:center;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  margin-bottom:15px;
}

.dark .search-box{
  background:#1e1e1e;
}

.search-icon{
  font-size:20px;
  margin-right:8px;
}

.search-box input{
  border:none;
  outline:none;
  width:100%;
  background:transparent;
  font-size:16px;
  color:#222;
}

.dark .search-box input{
  color:#fff;
}


/* USER LIST */

.users-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.user-card{
  background:#fff;
  border-radius:15px;
  padding:13px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.07);
  transition:.15s;
}

.user-card:active{
  transform:scale(.98);
}

.dark .user-card{
  background:#1e1e1e;
}

.user-avatar{
  width:52px;
  height:52px;
  min-width:52px;
  border-radius:50%;
  background:#1976d2;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:bold;
}

.user-info{
  flex:1;
  min-width:0;
}

.username{
  font-size:17px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.user-email{
  font-size:13px;
  color:#777;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.dark .user-email{
  color:#aaa;
}

.arrow{
  font-size:22px;
  color:#888;
}


/* STATUS */

.status{
  text-align:center;
  padding:35px 15px;
  color:#777;
  font-size:15px;
}

.dark .status{
  color:#aaa;
}


/* REFRESH */

.refresh-btn{
  width:100%;
  border:none;
  background:#1976d2;
  color:white;
  padding:13px;
  border-radius:12px;
  font-size:15px;
  font-weight:bold;
  margin-bottom:15px;
  cursor:pointer;
}

</style>
</head>

<body>


<!-- HEADER -->

<header class="header">

  <button class="back-btn" onclick="goBack()">
    ←
  </button>

  <div class="header-title">
    Users
  </div>

</header>


<main class="container">


  <!-- SEARCH -->

  <div class="search-box">

    <span class="search-icon">
      🔍
    </span>

    <input
      type="text"
      id="searchInput"
      placeholder="Search users..."
      oninput="searchUsers()"
    >

  </div>


  <!-- REFRESH -->

  <button
    class="refresh-btn"
    onclick="loadUsers()">

    🔄 Refresh Users

  </button>


  <!-- USERS -->

  <div
    class="users-list"
    id="usersList">

    <div class="status">
      Users loading...
    </div>

  </div>


</main>


<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://eqglttfffhvoyvrclzse.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rR4xxl0dW5DJrhhjqiFHLw_uJ-HakAb";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================
   VARIABLES
===================================== */

let allUsers = [];


/* =====================================
   BACK
===================================== */

function goBack(){

  window.location.href="profile.html";

}


/* =====================================
   LOAD USERS
===================================== */

async function loadUsers(){

  const usersList =
    document.getElementById("usersList");

  usersList.innerHTML = `
    <div class="status">
      Users loading...
    </div>
  `;


  try{

    /*
      Profiles table मधून
      सर्व registered users घेणे
    */

    const {
      data,
      error
    } = await supabaseClient
      .from("Profiles")
      .select("*")
      .order("username", {
        ascending:true
      });


    if(error){

      console.error(
        "Users loading error:",
        error
      );

      usersList.innerHTML = `
        <div class="status">
          Users load होत नाहीत.<br><br>
          ${error.message}
        </div>
      `;

      return;
    }


    allUsers = data || [];


    if(allUsers.length === 0){

      usersList.innerHTML = `
        <div class="status">
          सध्या एकही user नाही.
        </div>
      `;

      return;
    }


    displayUsers(allUsers);


  }catch(error){

    console.error(error);

    usersList.innerHTML = `
      <div class="status">
        Users load करताना error आला.
      </div>
    `;

  }

}


/* =====================================
   DISPLAY USERS
===================================== */

function displayUsers(users){

  const usersList =
    document.getElementById("usersList");


  if(!users || users.length === 0){

    usersList.innerHTML = `
      <div class="status">
        User सापडला नाही.
      </div>
    `;

    return;
  }


  usersList.innerHTML = "";


  users.forEach(function(user){

    const username =
      user.username ||
      "User";


    const firstLetter =
      username
      .charAt(0)
      .toUpperCase();


    const email =
      user.email ||
      "";


    const card =
      document.createElement("div");

    card.className =
      "user-card";


    card.onclick = function(){

      openUserProfile(user.id);

    };


    card.innerHTML = `

      <div class="user-avatar">
        ${escapeHtml(firstLetter)}
      </div>

      <div class="user-info">

        <div class="username">
          ${escapeHtml(username)}
        </div>

        ${
          email
          ?
          `<div class="user-email">
             ${escapeHtml(email)}
           </div>`
          :
          ""
        }

      </div>

      <div class="arrow">
        ›
      </div>

    `;


    usersList.appendChild(card);

  });

}


/* =====================================
   SEARCH USERS
===================================== */

function searchUsers(){

  const search =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();


  if(!search){

    displayUsers(allUsers);

    return;
  }


  const filtered =
    allUsers.filter(function(user){

      const username =
        (user.username || "")
        .toLowerCase();

      const email =
        (user.email || "")
        .toLowerCase();


      return (
        username.includes(search) ||
        email.includes(search)
      );

    });


  displayUsers(filtered);

}


/* =====================================
   OPEN USER PROFILE
===================================== */

function openUserProfile(userId){

  /*
    User ID पुढच्या profile page ला
    URL मधून पाठवला आहे.
  */

  window.location.href =
    "user-profile.html?id=" +
    encodeURIComponent(userId);

}


/* =====================================
   HTML SECURITY
===================================== */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================
   DARK MODE
===================================== */

function loadDarkMode(){

  if(
    localStorage.getItem("darkMode")
    === "true"
  ){

    document.body.classList.add("dark");

  }

}


/* =====================================
   START
===================================== */

loadDarkMode();

loadUsers();

</script>

</body>
</html>
