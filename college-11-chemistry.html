let currentQuestion = 0;
let score = 0;
let answered = false;


/* =========================
   RENDER CHAPTERS
========================= */

function renderChapters(){

  const list =
    document.getElementById("chapterList");

  list.innerHTML = "";

  chapters.forEach(function(chapter){

    const button =
      document.createElement("button");

    button.type = "button";

    button.className = "chapter-btn";

    button.innerHTML = `

      <div class="chapter-number">
        ${chapter.number}
      </div>

      <div class="chapter-info">

        <h3>
          Chapter ${chapter.number}: ${chapter.title}
        </h3>

        <p>
          Explanation पाहण्यासाठी येथे tap करा
        </p>

      </div>

      <div class="chapter-arrow">
        ›
      </div>

    `;

    button.onclick = function(){

      openChapter(chapter);

    };

    list.appendChild(button);

  });

}


/* =========================
   OPEN CHAPTER
========================= */

function openChapter(chapter){

  document.getElementById("popupTitle").textContent =
    "Chapter " + chapter.number + ": " + chapter.title;

  document.getElementById("popupIcon").textContent =
    chapter.icon;

  document.getElementById("popupIntro").textContent =
    chapter.intro;

  const explanation =
    document.getElementById("popupExplanation");

  explanation.innerHTML = "";

  chapter.lines.forEach(function(line,index){

    const div =
      document.createElement("div");

    div.className =
      "explanation-line";

    div.innerHTML =
      "<b>" + (index + 1) + ".</b> " + line;

    explanation.appendChild(div);

  });

  document.getElementById("popupRemember").textContent =
    chapter.remember;

  document.getElementById("popupBg").style.display =
    "flex";

  document.body.style.overflow =
    "hidden";

}


/* =========================
   CLOSE CHAPTER POPUP
========================= */

function closePopup(){

  document.getElementById("popupBg").style.display =
    "none";

  document.body.style.overflow =
    "";

}


/* =========================
   OUTSIDE CLICK
========================= */

function closeOutside(event){

  if(event.target.id === "popupBg"){

    closePopup();

  }

}


/* =========================
   OPEN TEST
========================= */

function openTest(){

  currentQuestion = 0;
  score = 0;
  answered = false;

  document.getElementById("testBg").style.display =
    "flex";

  document.body.style.overflow =
    "hidden";

  showQuestion();

}


/* =========================
   SHOW QUESTION
========================= */

function showQuestion(){

  const area =
    document.getElementById("testArea");

  const q =
    questions[currentQuestion];

  document.getElementById("progress").textContent =
    "Question " +
    (currentQuestion + 1) +
    " / " +
    questions.length;

  area.innerHTML = `

    <div class="question">
      ${q.q}
    </div>

    <div class="options">

      ${q.o.map(function(option,index){

        return `

          <button
            class="option"
            onclick="selectAnswer(${index})">

            ${String.fromCharCode(65 + index)}.
            ${option}

          </button>

        `;

      }).join("")}

    </div>

    <button
      class="next-btn"
      id="nextBtn"
      onclick="nextQuestion()">

      ${currentQuestion === questions.length - 1
        ? "🏁 Test Complete"
        : "Next Question →"}

    </button>

  `;

}


/* =========================
   SELECT ANSWER
========================= */

function selectAnswer(index){

  if(answered) return;

  answered = true;

  const q =
    questions[currentQuestion];

  const options =
    document.querySelectorAll(".option");

  if(index === q.a){

    score++;

    options[index].style.background =
      "#dff7e5";

    options[index].style.borderColor =
      "#45a35a";

  }else{

    options[index].style.background =
      "#ffe2e2";

    options[index].style.borderColor =
      "#d9534f";

    options[q.a].style.background =
      "#dff7e5";

    options[q.a].style.borderColor =
      "#45a35a";

  }

  document.getElementById("nextBtn").style.display =
    "block";

}


/* =========================
   NEXT QUESTION
========================= */

function nextQuestion(){

  if(currentQuestion <
     questions.length - 1){

    currentQuestion++;

    answered = false;

    showQuestion();

  }else{

    showResult();

  }

}


/* =========================
   RESULT
========================= */

function showResult(){

  const percentage =
    Math.round(
      (score / questions.length) * 100
    );

  document.getElementById("progress").textContent =
    "Test Completed ✅";

  document.getElementById("testArea").innerHTML = `

    <div class="result">

      <div style="font-size:55px;">
        🎉
      </div>

      <h2>
        Chemistry Test Complete!
      </h2>

      <div class="result-score">
        ${score} / ${questions.length}
      </div>

      <p>
        Percentage: <b>${percentage}%</b>
      </p>

      <p style="margin-top:8px;">
        Correct Answers:
        <b>${score}</b>
      </p>

      <p style="margin-top:5px;">
        Wrong Answers:
        <b>${questions.length - score}</b>
      </p>

      <button
        class="restart-btn"
        onclick="openTest()"
        style="margin-top:20px;">

        🔄 Restart Test

      </button>

    </div>

  `;

}


/* =========================
   CLOSE TEST
========================= */

function closeTest(){

  document.getElementById("testBg").style.display =
    "none";

  document.body.style.overflow =
    "";

}


/* =========================
   ESC KEY
========================= */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Escape"){

      closePopup();
      closeTest();

    }

  }
);
