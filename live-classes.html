<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>GyanSetu - Live Classes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;background:#0b0f17;color:#fff}
input,textarea,button{font:inherit;font-size:16px}
button{border:0;color:#fff;cursor:pointer}
.hidden{display:none!important}
header{height:56px;display:flex;align-items:center;gap:10px;padding:0 12px;background:linear-gradient(135deg,#0b0f17,#1b2a55);position:sticky;top:0;z-index:20}
.ib{width:40px;height:40px;border-radius:50%;background:#1b2436;font-size:20px;flex:none}
header h2{font-size:18px}
main{max-width:720px;margin:auto;padding:14px 12px 40px}
.pri{width:100%;padding:14px;border-radius:12px;background:linear-gradient(135deg,#3d6cff,#6a4dff);font-weight:700}
.pri:disabled{opacity:.6}
.sec{padding:12px;border-radius:12px;background:#1b2436;font-weight:700}
.red{background:#ff3b5c}
.card{position:relative;background:#131a26;border:1px solid #232d42;border-radius:16px;padding:14px;margin-top:10px}
.cov{margin:-14px -14px 12px;border-radius:16px 16px 0 0;overflow:hidden;aspect-ratio:16/9;background:#0a0e16}
.cov img{width:100%;height:100%;object-fit:cover;display:block}
.ct{font-weight:700;font-size:17px;padding-right:44px}
.sub{color:#8f9bb3;font-size:13px;margin-top:5px}
.lvt{display:inline-block;margin-top:8px;background:#ff3b5c;border-radius:20px;padding:4px 10px;font-size:12px;font-weight:700}
.ic{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;background:#1b2436}
.card .cov + .ct{padding-right:44px}
.empty{text-align:center;color:#6c778f;padding:26px}
.inp{width:100%;margin-top:10px;padding:13px;border-radius:11px;border:1px solid #2c3850;background:#0b1018;color:#fff;outline:none}
.chips{display:flex;gap:8px;margin-top:10px}.chips .sec{flex:1;padding:10px;font-size:14px}.chips .on{background:#3d6cff}
.pv{margin-top:10px;border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:#0a0e16;display:flex;align-items:center;justify-content:center;color:#6c778f;font-size:14px}
.pv img{width:100%;height:100%;object-fit:cover}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.pop{width:100%;max-width:480px;max-height:90vh;overflow:auto;background:#10151f;border:1px solid #2a3550;border-radius:20px;padding:20px}
.pop p{color:#9aa6bd;margin-top:6px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.roles button{background:#151c28;border:1px solid #30394a;border-radius:16px;padding:24px 8px;font-weight:700}
.roles span{display:block;font-size:38px;margin-bottom:8px}
.room{position:fixed;inset:0;display:flex;flex-direction:column;background:#0b0f17;z-index:30}
.rh{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#10151f}
.rh small{display:block;color:#8f9bb3}
.pl{position:relative;background:#000;aspect-ratio:16/9;max-height:42vh;width:100%;margin:auto;flex:none}
.pl video{width:100%;height:100%;object-fit:contain;background:#000}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#8f9bb3;background:#0a0e16;line-height:1.6}
.lvb,.vcb{position:absolute;top:8px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;background:#ff3b5c}
.lvb{left:8px}.vcb{left:86px;background:#000a}
.pip{position:absolute;right:8px;top:8px;width:30%;border:2px solid #3d6cff;border-radius:10px;overflow:hidden;background:#000}
.pip video{aspect-ratio:3/4;object-fit:cover}
.pip small{position:absolute;bottom:0;left:0;right:0;background:#000a;font-size:11px;text-align:center}
.fsb,.flip{position:absolute;bottom:8px;height:38px;min-width:38px;border-radius:9px;background:#000a}
.fsb{right:8px}.flip{left:8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px;align-items:center}.bar .pri{padding:11px}.bar .sec{flex:1;min-width:80px}
.tabs{display:flex;border-bottom:1px solid #232d42}
.tabs button{flex:1;padding:11px 2px;background:none;font-size:14px;font-weight:700;color:#8f9bb3;border-bottom:3px solid transparent}
.tabs .on{color:#fff;border-color:#3d6cff}
.pane{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:7px}
.m{background:#171e2c;border-radius:10px;padding:7px 10px;font-size:14px;word-break:break-word}.m.sir{border:1px solid #3d6cff}
.m b{display:block;color:#8bb0ff;font-size:12px}.m i{float:right;font-style:normal}
.send{display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}.send .inp{margin:0}.send button{width:48px;border-radius:11px;background:#3d6cff}
.scroll{overflow:auto;padding:12px;line-height:1.7}
.row{display:flex;gap:6px;align-items:center;background:#171e2c;border-radius:10px;padding:8px;margin-bottom:6px}.row span{flex:1}.row button{padding:7px 10px;border-radius:8px;background:#1b2436;font-size:13px}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#1f2937;border:1px solid #3d6cff;border-radius:12px;padding:10px 16px;z-index:500;font-size:14px;text-align:center;max-width:90%}
/* blue tick */
.fb{margin-left:8px;padding:3px 10px;border-radius:14px;background:#3d6cff;font-size:12px;font-weight:700;vertical-align:middle}.fb.on{background:#1b2436;border:1px solid #3d6cff}
.vt{display:inline-block;width:16px;height:16px;line-height:16px;text-align:center;border-radius:50%;background:#1d9bf0;color:#fff;font-size:11px;font-weight:700;margin-left:5px;vertical-align:middle;cursor:pointer}
/* BOARD (Sir) */
#board{position:fixed;inset:0;z-index:150;background:#0b0f17;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.bbar{display:flex;align-items:center;gap:8px;padding:8px 12px;flex:none}
.bbar b{font-size:15px;flex:1}
#bth{display:none}
.btools{display:flex;gap:8px;align-items:center;padding:0 12px 8px;overflow-x:auto;flex:none}
.btools button{width:36px;height:36px;border-radius:50%;border:2px solid #ffffff44;background:#1b2436;flex:none;font-size:16px}
.btools button.on{border-color:#3d6cff;box-shadow:0 0 0 2px #3d6cff88}
.bmain{flex:1;min-height:0;display:flex;gap:8px;padding:0 8px calc(8px + env(safe-area-inset-bottom))}
#bwrap{flex:1;min-width:0;position:relative;overflow:hidden;border-radius:8px;border:2px solid #3d6cff88}
#bc{position:absolute;left:0;top:0;touch-action:none;cursor:crosshair}
#bside{width:30%;max-width:220px;flex:none;display:flex;flex-direction:column;gap:6px}
#bvid video{width:100%;height:auto;aspect-ratio:16/9;border-radius:10px;border:1px solid #3d6cff88;background:#000;object-fit:cover}
.bnote{font-size:12px;color:#8f9bb3;text-align:center}
/* BOARD FULLSCREEN: canvas = पूर्ण phone screen, tools/cam overlay */
#board.bfs{padding-top:0}
#board.bfs .bbar{position:absolute;top:4px;right:4px;padding:0;gap:6px;z-index:8}
#board.bfs .bbar b{display:none}
#board.bfs #bth{display:block}
#board.bfs .btools{position:absolute;left:4px;top:4px;bottom:4px;width:42px;flex-direction:column;padding:0;gap:6px;overflow-y:auto;overflow-x:hidden;z-index:7}
#board.bfs .btools button{width:34px;height:34px;font-size:15px;opacity:.92}
#board.bfs.thide .btools{display:none}
#board.bfs .bmain{position:absolute;inset:0;padding:0}
#board.bfs #bwrap{border:0;border-radius:0}
#board.bfs #bside{position:absolute;right:8px;bottom:8px;width:22%;max-width:170px;z-index:5}
#board.bfs .bnote{display:none}
</style>
</head>
<body>
<div id="toast" class="toast hidden"></div>
<header><button class="ib" onclick="back()">←</button><h2 id="ttl">🎥 GyanSetu Live</h2></header>
<main id="view"></main>

<div id="roleOv" class="ov">
  <div class="pop">
    <h2>🎓 Live Class</h2>
    <p>तुम्ही कोण आहात?</p>
    <div class="roles">
      <button onclick="pickRole('sir')"><span>👨‍🏫</span>Sir</button>
      <button onclick="pickRole('student')"><span>👨‍🎓</span>Student</button>
    </div>
  </div>
</div>
<div id="saveOv" class="ov hidden" style="z-index:200"><div class="pop" style="text-align:center"><h2>⏳ Recording save होत आहे</h2><p>कृपया page बंद करू नका...</p></div></div>
<div id="md" class="ov hidden" onclick="if(event.target===this)closeModal()"><div class="pop" id="mx"></div></div>

<div id="board" class="hidden">
  <div class="bbar"><button class="ib" onclick="stopBoard()">←</button><b id="btt">📝 Board</b><button class="ib" id="bth" onclick="$('board').classList.toggle('thide')">🎛</button><button class="ib" id="bfsb" onclick="toggleBoardFs()">⛶</button></div>
  <div class="btools" id="bpal"></div>
  <div class="bmain">
    <div id="bwrap"><canvas id="bc"></canvas></div>
    <div id="bside"><div id="bvid"></div><div class="bnote">👨‍🏫 तुमचा Cam • ← दाबल्यास Board बंद</div></div>
  </div>
  <input type="file" id="bimg" accept="image/*" class="hidden" onchange="bimgPick(this)">
</div>

<script>
const sb=supabase.createClient("https://eqglttfffhvoyvrclzse.supabase.co","sb_publishable_rR4xxl0dW5DJrhhjqiFHLw_uJ-HakAb");
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let user=null,myName='Student',role=null,C={},saved=new Set(),sTab='all',q='',poll=null;
let batch=null,mine=false,tab='chat',msgs=[],blocked=new Map(),ch=null;
let peer=null,stream=null,live=false,conns=new Map(),calls=[],facing='user',t0=0,tmr=null;
let sc=null,sirId='',gs=null,gcall=null,retry=null;
let hid=null;
let rec=null,segTimer=null,recPart=0,recMime='',upQ=Promise.resolve();
const SEG_MS=8*60*1000;
let newPhoto=null,rmPhoto=false,saving=false;
const ver=new Set(); /* verified (blue tick) user ids */
const fol=new Set(); /* Sir ids I follow */
let pol=null,pollShown=false; /* live poll (Sir side) */

/* ---------- no zoom ---------- */
['gesturestart','gesturechange','gestureend'].forEach(e=>document.addEventListener(e,x=>x.preventDefault()));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});

/* ---------- helpers ---------- */
let tt;
function toast(t){const e=$('toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(tt);tt=setTimeout(()=>e.classList.add('hidden'),3000)}
function modal(h){pollShown=false;$('mx').innerHTML=h;$('md').classList.remove('hidden')}
function closeModal(){pollShown=false;$('md').classList.add('hidden')}
function title(t){$('ttl').textContent=t}
function back(){
  if(role&&$('roleOv').classList.contains('hidden')){clearInterval(poll);role=null;$('view').innerHTML='';title('🎥 GyanSetu Live');$('roleOv').classList.remove('hidden')}
  else location.href='home.html';
}
function pickRole(r){
  if(!user){toast('आधी Login करा');return}
  role=r;$('roleOv').classList.add('hidden');r==='sir'?showSir():showStudent();
}

/* ---------- blue tick ---------- */
const tk=id=>ver.has(id)?'<span class="vt" onclick="event.stopPropagation();tickInfo()">✓</span>':'';
async function loadVer(ids){
  ids=[...new Set(ids.filter(Boolean))];if(!ids.length)return;
  const {data}=await sb.from('Profiles').select('id,is_verified').in('id',ids);
  (data||[]).forEach(p=>{p.is_verified?ver.add(p.id):ver.delete(p.id)});
}
function tickInfo(){
  modal(`<h2><span class="vt" style="margin:0 6px 0 0">✓</span>Blue Tick</h2>
  <p>ज्या Sir चे <b>100 followers</b> होतात त्यांना Blue Tick आपोआप मिळतो.<br>एकदा मिळाला की तो कायम राहतो.</p>
  <button class="pri" style="margin-top:14px" onclick="closeModal()">OK</button>`);
}

/* ---------- follow Sir ---------- */
async function loadFol(){
  const {data}=await sb.from('Follows').select('following_id').eq('follower_id',user.id);
  fol.clear();(data||[]).forEach(r=>fol.add(r.following_id));
}
const folBtn=id=>id===user.id?'':`<button class="fb ${fol.has(id)?'on':''}" onclick="event.stopPropagation();toggleFol('${id}')">${fol.has(id)?'✓ Following':'➕ Follow'}</button>`;
function refreshFol(){
  renderList();
  const e=$('rfol');if(e&&batch)e.innerHTML=folBtn(batch.owner_id);
}
async function toggleFol(id){
  const had=fol.has(id);
  had?fol.delete(id):fol.add(id);refreshFol();
  const r=had?await sb.from('Follows').delete().eq('follower_id',user.id).eq('following_id',id)
             :await sb.from('Follows').insert({follower_id:user.id,following_id:id});
  if(r.error){had?fol.add(id):fol.delete(id);refreshFol();toast('Follow error: '+r.error.message);return}
  await loadVer([id]);refreshFol();
}

/* ---------- batch card ---------- */
function card(b,m){
  return `<div class="card" onclick="openRoom('${b.id}')">
    ${b.photo_url?`<div class="cov"><img src="${esc(b.photo_url)}" loading="lazy" alt=""></div>`:''}
    <div class="ct">${esc(b.name)}</div>
    <div class="sub">📘 ${esc(b.subject||'-')} &nbsp; ⏰ ${esc(b.timings||'-')}</div>
    <div class="sub">👨‍🏫 ${esc(b.owner_name||'Sir')}${tk(b.owner_id)}${m?'':folBtn(b.owner_id)}</div>
    ${b.is_live?'<span class="lvt">🔴 LIVE</span>':''}
    ${m?`<button class="ic" onclick="event.stopPropagation();batchForm('${b.id}')">✏️</button>`
       :`<button class="ic" onclick="event.stopPropagation();toggleSave('${b.id}')">${saved.has(b.id)?'⭐':'☆'}</button>`}
  </div>`;
}

/* ---------- SIR: my batches ---------- */
async function showSir(){
  title('👨‍🏫 माझ्या Batches');
  $('view').innerHTML='<div class="empty">⏳ Loading...</div>';
  const [r,fc]=await Promise.all([
    sb.from('gs_batches').select('*').eq('owner_id',user.id).order('created_at',{ascending:false}),
    sb.from('Follows').select('*',{count:'exact',head:true}).eq('following_id',user.id),
    loadVer([user.id])
  ]);
  const data=r.data;
  (data||[]).forEach(b=>C[b.id]=b);
  let st='';
  if(!fc.error&&fc.count!=null){
    st=`<div class="sub" style="text-align:center;margin-top:12px" onclick="tickInfo()">👥 ${fc.count} followers • ${ver.has(user.id)?'Blue Tick '+tk(user.id):'Blue Tick साठी अजून '+Math.max(0,100-fc.count)}</div>`;
  }
  $('view').innerHTML=`<button class="pri" onclick="batchForm()">➕ Add Batch</button>`+st+
    ((data||[]).map(b=>card(b,true)).join('')||'<div class="empty">अजून Batch नाही.<br>➕ Add Batch वर क्लिक करा.</div>');
}
function batchForm(id){
  const b=id?C[id]:{};
  newPhoto=null;rmPhoto=false;
  modal(`<h2>${id?'✏️ Batch Edit':'➕ नवी Batch'}</h2>
  <div class="pv" id="pv">${b.photo_url?`<img src="${esc(b.photo_url)}">`:'🖼️ Batch Photo'}</div>
  <div class="chips">
    <button class="sec" onclick="$('pf').click()">📷 Photo निवडा</button>
    ${b.photo_url?'<button class="sec" onclick="rmPh()">❌ Photo काढा</button>':''}
  </div>
  <input type="file" id="pf" accept="image/*" class="hidden" onchange="pickPhoto(this)">
  <input class="inp" id="bn" maxlength="80" placeholder="Batch नाव (उदा. 10वी Science)" value="${esc(b.name)}">
  <input class="inp" id="bs" maxlength="80" placeholder="Subjects (उदा. Maths, Science)" value="${esc(b.subject)}">
  <input class="inp" id="bt" maxlength="80" placeholder="Timings (उदा. सोम-शनि 6-8 PM)" value="${esc(b.timings)}">
  <textarea class="inp" id="bd" rows="3" maxlength="500" placeholder="Batch बद्दल माहिती">${esc(b.description)}</textarea>
  <button class="pri" id="sv" style="margin-top:12px" onclick="saveBatch('${id||''}')">💾 Save</button>
  ${id?`<button class="pri red" style="margin-top:8px" onclick="delBatch('${id}')">🗑️ Batch Delete</button>`:''}
  <button class="pri" style="margin-top:8px;background:#1b2436" onclick="closeModal()">Cancel</button>`);
}
function pickPhoto(inp){
  const f=inp.files[0];if(!f)return;
  if(!f.type.startsWith('image/')){toast('फक्त image निवडा');return}
  const img=new Image(),u=URL.createObjectURL(f);
  img.onload=()=>{
    const W=1280,H=720,c=document.createElement('canvas');c.width=W;c.height=H;
    const x=c.getContext('2d'),s=Math.max(W/img.width,H/img.height);
    const w=img.width*s,h=img.height*s;
    x.fillStyle='#fff';x.fillRect(0,0,W,H);
    x.drawImage(img,(W-w)/2,(H-h)/2,w,h);
    c.toBlob(bl=>{
      if(!bl){toast('Photo process झाला नाही');return}
      newPhoto=bl;rmPhoto=false;
      $('pv').innerHTML=`<img src="${URL.createObjectURL(bl)}">`;
    },'image/jpeg',0.85);
    URL.revokeObjectURL(u);
  };
  img.onerror=()=>toast('Image उघडता आली नाही');
  img.src=u;
}
function rmPh(){newPhoto=null;rmPhoto=true;$('pv').textContent='🖼️ Batch Photo'}
async function saveBatch(id){
  const v={name:$('bn').value.trim(),subject:$('bs').value.trim(),timings:$('bt').value.trim(),description:$('bd').value.trim()};
  if(!v.name){toast('Batch नाव टाका');return}
  const btn=$('sv');btn.disabled=true;btn.textContent='⏳ Saving...';
  if(newPhoto){
    const path=user.id+'/'+Date.now()+'.jpg';
    const up=await sb.storage.from('batch-photos').upload(path,newPhoto,{contentType:'image/jpeg',cacheControl:'31536000'});
    if(up.error){toast('Photo upload error: '+up.error.message);btn.disabled=false;btn.textContent='💾 Save';return}
    v.photo_url=sb.storage.from('batch-photos').getPublicUrl(path).data.publicUrl;
  }else if(rmPhoto){v.photo_url=null}
  const r=id?await sb.from('gs_batches').update(v).eq('id',id)
            :await sb.from('gs_batches').insert({...v,owner_id:user.id,owner_name:myName});
  if(r.error){toast('Error: '+r.error.message);btn.disabled=false;btn.textContent='💾 Save';return}
  closeModal();showSir();
}
async function delBatch(id){
  if(!confirm('ही Batch कायमची delete करायची?'))return;
  await sb.from('gs_batches').delete().eq('id',id);closeModal();showSir();
}

/* ---------- STUDENT: all batches ---------- */
async function showStudent(){
  title('👨‍🎓 Batches');
  sTab='all';q='';
  $('view').innerHTML=`<button class="pri" onclick="location.href='discover-space.html'">🧭 Discover Space</button>
  <input class="inp" id="sq" placeholder="🔍 Batch / Subject / Sir शोधा" oninput="q=this.value;renderList()">
  <div class="chips"><button class="sec on" id="t_all" onclick="setST('all')">सर्व</button><button class="sec" id="t_live" onclick="setST('live')">🔴 Live</button><button class="sec" id="t_saved" onclick="setST('saved')">⭐ Saved</button></div>
  <div id="bl"></div>`;
  await loadAll();
  clearInterval(poll);poll=setInterval(loadAll,8000);
}
async function loadAll(){
  const [a,s]=await Promise.all([sb.from('gs_batches').select('*'),sb.from('gs_saved').select('batch_id').eq('user_id',user.id)]);
  C={};(a.data||[]).forEach(b=>C[b.id]=b);
  saved=new Set((s.data||[]).map(r=>r.batch_id));
  await Promise.all([loadVer(Object.values(C).map(b=>b.owner_id)),loadFol()]);
  renderList();
}
function setST(t){sTab=t;['all','live','saved'].forEach(x=>$('t_'+x).classList.toggle('on',x===t));renderList()}
function renderList(){
  if(!$('bl'))return;
  const k=q.toLowerCase();
  const a=Object.values(C).filter(b=>(sTab==='all'||(sTab==='live'&&b.is_live)||(sTab==='saved'&&saved.has(b.id)))
    &&(!k||[b.name,b.subject,b.owner_name].join(' ').toLowerCase().includes(k)))
    .sort((x,y)=>(y.is_live?1:0)-(x.is_live?1:0));
  $('bl').innerHTML=a.map(b=>card(b,false)).join('')||'<div class="empty">Batch सापडली नाही.</div>';
}
async function toggleSave(id){
  if(saved.has(id)){saved.delete(id);await sb.from('gs_saved').delete().eq('user_id',user.id).eq('batch_id',id)}

function setTab(t){
  tab=t;

  $('tabs').innerHTML=L.map(x=>`<button class="${x[0]===t?'on':''}" onclick="setTab('${x[0]}')">${x[1]}</button>`).join('');
  const p=$('pane');
  if(t==='info'){
    p.innerHTML=`<div class="scroll">${batch.photo_url?`<div class="pv" style="margin:0 0 12px"><img src="${esc(batch.photo_url)}"></div>`:''}<h3>${esc(batch.name)}</h3>📘 ${esc(batch.subject||'-')}<br>⏰ ${esc(batch.timings||'-')}<br>👨‍🏫 ${esc(batch.owner_name||'Sir')}${tk(batch.owner_id)}<br><br>${esc(batch.description||'')}</div>`;

    rMsgs();

function rMsgs(){

  e.innerHTML=l.map(m=>`<div class="m ${m.is_sir?'sir':''}"><b>${esc(m.user_name)}${m.is_sir?' 👨‍🏫'+tk(batch.owner_id):''}${mine?`<i onclick="delMsg(${m.id})">🗑</i>`:''}</b>${esc(m.body)}</div>`).join('')||'<div class="empty">अजून काही नाही</div>';

let bLive=false,bmode='black',pages=[[]],pg=0,bobjs=pages[0],rdo=[],pen='#ffffff',tool='pen',bsi=0,bw=0.003;
let bdraw=null,bpv=null,bbuf=[],bbid='',bsid=0,bft=null,bvt=null,lzt=null,bact=null,gest=null,lz=null,bview={z:1,x:0,y:0},ba=0.5625;
const BW=[0.003,0.006,0.012],ptrs=new Map();
const bcv=$('bc'),bx=bcv.getContext('2d');
const bbg=()=>bmode==='white'?'#ffffff':'#111111';
const bcol=c=>c==='erase'?bbg():c;
const bdef=()=>bmode==='white'?'#111111':'#ffffff';
const SER=s=>{const {im,...r}=s;return r};
const bfullData=()=>({mode:bmode,a:ba,pg,n:pages.length,strokes:bobjs.map(SER)});

/* ---- drawing (world coords: x = px/width, y = px/width; zoom/pan via bview) ---- */
const tr=p=>{const W=bcv.width,z=bview.z;return [(p[0]-bview.x)*z*W,(p[1]-bview.y)*z*W]};
function bclamp(){const v=bview;v.z=Math.min(5,Math.max(1,v.z));v.x=Math.min(Math.max(0,v.x),1-1/v.z);v.y=Math.min(Math.max(0,v.y),Math.max(0,ba-ba/v.z))}
function bseg(s,i){
  const a=tr(s.p[i-1]||s.p[i]),b=tr(s.p[i]);
  bx.strokeStyle=bcol(s.c);bx.lineWidth=Math.max(1,(s.w||0.004)*bview.z*bcv.width);bx.lineCap='round';bx.lineJoin='round';
  bx.beginPath();bx.moveTo(a[0],a[1]);bx.lineTo(b[0],b[1]);bx.stroke();
}
function barrow(x1,y1,x2,y2){
  const an=Math.atan2(y2-y1,x2-x1),h=12*(window.devicePixelRatio||1);
  bx.moveTo(x1,y1);bx.lineTo(x2,y2);
  [2.7,-2.7].forEach(d=>{bx.moveTo(x2,y2);bx.lineTo(x2+h*Math.cos(an+d),y2+h*Math.sin(an+d))});
}
function bobj(s){
  if(!s.k||s.k==='pen'){for(let i=0;i<s.p.length;i++)bseg(s,i);return}
  if(s.k==='i'){
    if(!s.im){s.im=new Image();s.im.onload=bredraw;s.im.src=s.src}
    else if(s.im.complete&&s.im.naturalWidth){const a=tr(s.p[0]),b=tr(s.p[1]);bx.drawImage(s.im,a[0],a[1],b[0]-a[0],b[1]-a[1])}
    return;
  }
  if(s.k==='t'){
    const a=tr(s.p[0]);bx.fillStyle=bcol(s.c);bx.font='600 '+Math.max(8,s.w*bview.z*bcv.width)+'px system-ui,Arial';bx.textBaseline='top';bx.fillText(s.tx||'',a[0],a[1]);return;
  }
  const a=tr(s.p[0]),b=tr(s.p[s.p.length-1]);
  bx.strokeStyle=bcol(s.c);bx.lineWidth=Math.max(1,s.w*bview.z*bcv.width);bx.lineCap='round';bx.lineJoin='round';bx.beginPath();
  if(s.k==='l'){bx.moveTo(a[0],a[1]);bx.lineTo(b[0],b[1])}
  else if(s.k==='r')bx.rect(a[0],a[1],b[0]-a[0],b[1]-a[1]);
  else if(s.k==='c')bx.ellipse((a[0]+b[0])/2,(a[1]+b[1])/2,Math.abs(b[0]-a[0])/2,Math.abs(b[1]-a[1])/2,0,0,7);
  else if(s.k==='a'){
    const cx=(a[0]+b[0])/2,cy=(a[1]+b[1])/2;
    barrow(cx,cy,b[0],cy);barrow(cx,cy,a[0],cy);barrow(cx,cy,cx,a[1]);barrow(cx,cy,cx,b[1]);
  }
  bx.stroke();
}
function bredraw(){
  const w=$('bwrap');if(w)w.style.background=bbg();
  bx.fillStyle=bbg();bx.fillRect(0,0,bcv.width,bcv.height);
  bobjs.forEach(bobj);if(bpv)bobj(bpv);
  if(lz){const x=lz[0]*bcv.width,y=lz[1]*bcv.height,r=9*(window.devicePixelRatio||1);bx.fillStyle='#ff2d2d';bx.shadowColor='#ff2d2d';bx.shadowBlur=r*2;bx.beginPath();bx.arc(x,y,r,0,7);bx.fill();bx.shadowBlur=0}
}

/* ---- board fullscreen: canvas = पूर्ण phone screen ---- */
const fsE=()=>document.fullscreenElement||document.webkitFullscreenElement;
function bfsUpdate(on){
  const b=$('board');b.classList.toggle('bfs',on);if(!on)b.classList.remove('thide');
  $('bfsb').textContent=on?'🗗':'⛶';
  [100,350,800].forEach(ms=>setTimeout(()=>{if(bLive)bfit()},ms));
}
async function toggleBoardFs(){
  const b=$('board');
  if(b.classList.contains('bfs')){
    if(fsE()){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(e){bfsUpdate(false)}}
    else bfsUpdate(false);
    try{screen.orientation.unlock()}catch(e){}
    return;
  }
  bfsUpdate(true); /* iPhone वर browser fullscreen नसले तरी पूर्ण screen layout लगेच लागू */
  const r=b.requestFullscreen||b.webkitRequestFullscreen;
  if(r){try{await r.call(b)}catch(e){}}
  try{await screen.orientation.lock('landscape')}catch(e){}
}
['fullscreenchange','webkitfullscreenchange'].forEach(e=>document.addEventListener(e,()=>{
  const f=fsE();
  if(f&&f.id==='board')bfsUpdate(true);
  else if(!f&&$('board').classList.contains('bfs'))bfsUpdate(false);
}));

function boardMenu(){

  modal(`<h2>📝 Board</h2><p>कोणता Board चालू करायचा?</p>

  <button class="pri" style="margin-top:10px;background:#1b2436" onclick="closeModal()">Cancel</button>`);
}
function btitle(){$('btt').textContent=(bmode==='white'?'📝 White Board':'📝 Black Board')+(pages.length>1?' • '+(pg+1)+'/'+pages.length:'')}
function bpal(){
  const cols=[bdef(),'#ffd400','#00c8ff','#ff2d87','#3ddc84'];
  const T=(t,l)=>`<button class="${tool===t?'on':''}" onclick="setTool('${t}')">${l}</button>`;
  $('bpal').innerHTML=cols.map(c=>`<button style="background:${c}" class="${tool==='pen'&&pen===c?'on':''}" onclick="setPen('${c}')"></button>`).join('')
   +`<button onclick="cycleW()">✏${bsi+1}</button>`
   +T('erase','🧽')+`<button onclick="bundo()">↩</button><button onclick="brdo()">↪</button>`
   +T('l','╱')+T('r','▭')+T('c','◯')+T('a','📈')+T('text','🔤')
   +`<button onclick="$('bimg').click()">🖼</button>`+T('laser','🔴')
   +`<button onclick="bzoom(1.4)">＋</button><button onclick="bzoom(1/1.4)">－</button>`
   +`<button onclick="bpage(-1)">◀</button><button style="width:auto;padding:0 8px;border-radius:18px">${pg+1}/${pages.length}</button><button onclick="bpage(1)">▶</button><button onclick="bnew()">➕</button>`
   +`<button onclick="bclear()">🗑</button><button onclick="bsave()">💾</button>`
   +`<button id="bcam" onclick="togCam()">${camOn?'📷':'🚫'}</button><button id="bmic" onclick="togMic()">${micOn?'🎤':'🔇'}</button>`;
}
function setTool(t){tool=t;bpal()}
function setPen(c){pen=c;if(tool==='erase'||tool==='laser')tool='pen';bpal()}
function cycleW(){bsi=(bsi+1)%BW.length;bw=BW[bsi];bpal()}
function bfit(){
  const w=$('bwrap'),cw=Math.max(60,w.clientWidth),chh=Math.max(60,w.clientHeight),dpr=window.devicePixelRatio||1;
  bcv.style.width=cw+'px';bcv.style.height=chh+'px';
  bcv.width=Math.round(cw*dpr);bcv.height=Math.round(chh*dpr);
  ba=chh/cw;bclamp();bredraw();bcast({t:'basp',a:ba});
}
function bsync(){bredraw();bcast({t:'bfull',...bfullData()});bpal();btitle()}
function bundo(){const o=bobjs.pop();if(o){rdo.push(o);bsync()}}
function brdo(){const o=rdo.pop();if(o){bobjs.push(o);bsync()}}
function bclear(){if(!bobjs.length)return;if(!confirm('हा page पुसायचा?'))return;pages[pg]=bobjs=[];rdo=[];bsync()}
function bgo(i){pg=i;bobjs=pages[pg];rdo=[];bview={z:1,x:0,y:0};bsync();bcast({t:'bview',...bview})}
function bpage(d){const n=pg+d;if(n<0||n>=pages.length)return;bgo(n)}
function bnew(){pages.splice(pg+1,0,[]);bgo(pg+1)}
function bviewSend(){if(!bvt)bvt=setTimeout(()=>{bvt=null;bcast({t:'bview',z:bview.z,x:bview.x,y:bview.y})},50)}
function bzoom(f){
  const v=bview,cx=v.x+0.5/v.z,cy=v.y+ba/2/v.z;
  v.z=Math.min(5,Math.max(1,v.z*f));v.x=cx-0.5/v.z;v.y=cy-ba/2/v.z;
  bclamp();bredraw();bviewSend();
}
function bpush(s){bobjs.push(s);rdo=[];bredraw();bcast({t:'add',o:SER(s)});bpal()}
function bimgPick(inp){
  const f=inp.files[0];inp.value='';
  if(!f||!f.type.startsWith('image/')){toast('फक्त image निवडा');return}
  const img=new Image(),u=URL.createObjectURL(f);
  img.onload=()=>{
    const m=900,sc=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(u);
    const src=c.toDataURL('image/jpeg',0.7),v=bview;
    let w=0.5/v.z,h=w*c.height/c.width;if(h>ba*0.8/v.z){h=ba*0.8/v.z;w=h*c.width/c.height}
    const cx=v.x+0.5/v.z,cy=v.y+ba/2/v.z;
    bpush({k:'i',src,p:[[cx-w/2,cy-h/2],[cx+w/2,cy+h/2]].map(p=>p.map(n=>+n.toFixed(4)))});
  };
  img.onerror=()=>toast('Image उघडता आली नाही');
  img.src=u;
}
function bsave(){
  bcv.toBlob(async bl=>{
    if(!bl){toast('Save झाले नाही');return}
    const f=new File([bl],'board-'+(pg+1)+'.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e&&e.name==='AbortError')return}}
    const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=f.name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('💾 Board save झाला');
  },'image/png');
}
function startBoard(mode){
  closeModal();if(!live)return;
  bmode=mode;bLive=true;pages=[[]];pg=0;bobjs=pages[0];rdo=[];bview={z:1,x:0,y:0};pen=bdef();tool='pen';bsi=0;bw=BW[0];lz=null;
  $('board').classList.remove('hidden');
  $('bvid').appendChild($('vid'));$('vid').play().catch(()=>{});
  bcast({t:'board',v:true,mode});
  btitle();bpal();bfit();
}
function stopBoard(){
  if(!bLive)return;
  bflush();bLive=false;bdraw=null;bpv=null;lz=null;gest=null;ptrs.clear();bact=null;
  if(fsE()){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(e){}}
  try{screen.orientation.unlock()}catch(e){}
  $('board').classList.remove('bfs','thide');$('bfsb').textContent='⛶';
  $('board').classList.add('hidden');
  const p=$('pl');if(p){p.insertBefore($('vid'),p.firstChild);$('vid').play().catch(()=>{})}
  bcast({t:'board',v:false});
  pages=[[]];pg=0;bobjs=pages[0];rdo=[];
}
function bpt(e){
  const r=bcv.getBoundingClientRect(),z=bview.z;
  const fx=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),fy=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
  return [fx/z+bview.x,fy*ba/z+bview.y].map(v=>+v.toFixed(4));
}
function bflush(){
  clearTimeout(bft);bft=null;
  if(!bbuf.length||!bdraw)return;
  const p=bbuf;bbuf=[];
  bcast({t:'bp',id:bbid,c:bdraw.c,w:bdraw.w,p});
}
function badd(pt){
  bdraw.p.push(pt);bseg(bdraw,bdraw.p.length-1);bbuf.push(pt);
  if(!bft)bft=setTimeout(bflush,40);
}
function lzSend(e){
  const r=bcv.getBoundingClientRect();
  lz=[Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))];
  bredraw();
  if(!lzt)lzt=setTimeout(()=>{lzt=null;bcast({t:'lz',p:lz})},40);
}
function bstart(e){
  const p=bpt(e);
  if(tool==='laser'){bact='laser';lzSend(e);return}
  if(tool==='text'){
    ptrs.clear();
    const t=prompt('Board वर काय लिहायचे?');
    if(t&&t.trim())bpush({k:'t',c:pen,w:0.03,p:[p],tx:t.trim().slice(0,120)});
    return;
  }
  rdo=[];
  if(tool==='pen'||tool==='erase'){
    bact='pen';bbid='s'+Date.now()+'_'+(++bsid);
    bdraw={k:'pen',c:tool==='erase'?'erase':pen,w:tool==='erase'?0.03:bw,p:[]};
    bobjs.push(bdraw);badd(p);
  }else{bact='shape';bpv={k:tool,c:pen,w:bw,p:[p,p]}}
}
function bcancel(){
  if(bact==='pen'&&bdraw){bflush();bdraw=null}
  if(bact==='shape'){bpv=null;bredraw()}
  if(bact==='laser'){lz=null;bredraw();bcast({t:'lz',p:null})}
  bact=null;
}
function gm(){const a=[...ptrs.values()];return {d:Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1,x:(a[0][0]+a[1][0])/2,y:(a[0][1]+a[1][1])/2}}
function doGest(){
  const m=gm(),r=bcv.getBoundingClientRect(),g=gest,z=Math.min(5,Math.max(1,g.v.z*m.d/g.d));
  const wx=(g.x-r.left)/r.width/g.v.z+g.v.x,wy=(g.y-r.top)/r.height*ba/g.v.z+g.v.y;
  bview.z=z;bview.x=wx-(m.x-r.left)/r.width/z;bview.y=wy-(m.y-r.top)/r.height*ba/z;
  bclamp();bredraw();bviewSend();
}
bcv.addEventListener('pointerdown',e=>{
  if(!bLive)return;e.preventDefault();
  try{bcv.setPointerCapture(e.pointerId)}catch(x){}
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===2){bcancel();gest={...gm(),v:{...bview}};return}
  if(ptrs.size>2||gest)return;
  bstart(e);
});
bcv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(gest){e.preventDefault();doGest();return}
  if(bact==='pen'&&bdraw){e.preventDefault();badd(bpt(e))}
  else if(bact==='shape'&&bpv){e.preventDefault();bpv.p[1]=bpt(e);bredraw()}
  else if(bact==='laser'){e.preventDefault();lzSend(e)}
});
function bend(e){
  if(!ptrs.delete(e.pointerId))return;
  if(gest){if(ptrs.size<2)gest=null;return}
  if(bact==='pen'&&bdraw){bflush();bdraw=null}
  else if(bact==='shape'&&bpv){
    const s=bpv;bpv=null;
    if(Math.hypot(s.p[1][0]-s.p[0][0],s.p[1][1]-s.p[0][1])>0.005)bpush(s);else bredraw();
  }
  else if(bact==='laser'){lz=null;bredraw();bcast({t:'lz',p:null})}
  bact=null;
}
['pointerup','pointercancel'].forEach(n=>bcv.addEventListener(n,bend));
window.addEventListener('resize',()=>{if(bLive)bfit()});

/* ---------- SIR side ---------- */
function initSir(){
  peer=new Peer(sirId,{debug:1});
  peer.on('connection',setupConn);
  peer.on('call',call=>{
    const s=conns.get(call.peer);
    if(!s||!s.allowed){call.close();return}
    call.answer();s.call=call;
    call.on('stream',st=>{$('gv').srcObject=st;$('pip').classList.remove('hidden');$('gn').textContent=s.name});
    call.on('close',hideGuest);
  });
  peer.on('error',e=>{if(e.type==='unavailable-id')toast('ही Batch दुसऱ्या device वर आधीच उघडी आहे');else console.error(e)});
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
}
function setupConn(c){
  c.on('data',d=>{
    if(!d||typeof d!=='object')return;
    if(d.t==='hi'){
      if(blocked.has(d.uid)){try{c.send({t:'blocked'})}catch(e){}setTimeout(()=>c.close(),300);return}
      const name=String(d.name||'Student').slice(0,30);
      conns.set(c.peer,{conn:c,name,uid:d.uid,hand:false,allowed:false});
      c.send({t:'live',v:live,hid});if(live){callStudent(c.peer);c.send({t:'cam',v:camOn})}
      /* late joiner: current board + poll */
      if(bLive){c.send({t:'board',v:true,mode:bmode});c.send({t:'basp',a:ba});c.send({t:'bfull',...bfullData()});c.send({t:'bview',z:bview.z,x:bview.x,y:bview.y})}
      if(pol)c.send(polMsg());
      vcount();rStu();toast('👨‍🎓 '+name+' Join झाला');return;
    }
    const s=conns.get(c.peer);if(!s)return;
    if(d.t==='hand'){s.hand=!!d.v;rStu();if(s.hand)toast('✋ '+s.name+' ने Hand Raise केला')}
    if(d.t==='vote'&&pol&&pol.open&&d.id===pol.id&&Number.isInteger(d.i)&&d.i>=0&&d.i<pol.o.length){
      pol.votes.set(s.uid,d.i);bcast(polMsg());if(pollShown)pollUI();
    }
  });
  c.on('close',()=>{const s=conns.get(c.peer);if(s&&s.allowed)hideGuest();conns.delete(c.peer);vcount();rStu()});
}
function callStudent(pid){
  if(!stream||!peer)return;
  const call=peer.call(pid,stream);calls.push(call);
  call.on('close',()=>{calls=calls.filter(x=>x!==call)});
}
function bcast(d){conns.forEach(s=>{try{s.conn.open&&s.conn.send(d)}catch(e){}})}
function vcount(){const e=$('vc');if(!e)return;e.textContent='👥 '+conns.size;e.classList.toggle('hidden',!live)}
function rStu(){
  const e=$('sl');if(!e)return;
  let h=[...conns.entries()].map(([p,s])=>`<div class="row"><span>${esc(s.name)}${s.hand?' ✋':''}${s.allowed?' 🎤':''}</span><button onclick="allow('${p}')">${s.allowed?'⏹ Stop':'🎤 Allow'}</button><button onclick="blk('${p}')">🚫</button></div>`).join('');
  if(!h)h='<div class="empty">कोणी Join झालेले नाही</div>';
  if(blocked.size)h+='<h4 style="margin:12px 0 6px">🚫 Blocked</h4>'+[...blocked].map(([u,n])=>`<div class="row"><span>${esc(n||'Student')}</span><button onclick="unblk('${u}')">Unblock</button></div>`).join('');
  e.innerHTML=h;
}
function hideGuest(){const p=$('pip');if(p)p.classList.add('hidden');const g=$('gv');if(g)g.srcObject=null}
function allow(pid){
  const s=conns.get(pid);if(!s)return;
  if(s.allowed){s.allowed=false;try{s.conn.send({t:'revoke'})}catch(e){}if(s.call)s.call.close();hideGuest();rStu();return}
  conns.forEach((o,p)=>{if(o.allowed){o.allowed=false;try{o.conn.send({t:'revoke'})}catch(e){}if(o.call)o.call.close()}});
  hideGuest();s.allowed=true;s.conn.send({t:'allow'});rStu();toast('🎤 '+s.name+' ला allow केले');
}
async function blk(pid){
  const s=conns.get(pid);if(!s)return;
  if(!confirm(s.name+' ला block करायचे?'))return;
  await sb.from('gs_blocks').insert({batch_id:batch.id,user_id:s.uid,user_name:s.name});
  blocked.set(s.uid,s.name);try{s.conn.send({t:'blocked'})}catch(e){}
  setTimeout(()=>s.conn.close(),300);rStu();
}
async function unblk(u){await sb.from('gs_blocks').delete().eq('batch_id',batch.id).eq('user_id',u);blocked.delete(u);rStu()}

async function toggleLive(){
  if(live){if(confirm('Live Class End करायची? Recording save होईल.')){await endLive();await leaveRoom()}return}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:{echoCancellation:true,noiseSuppression:true}})}
  catch(e){toast('Camera आणि Mic permission द्या');return}
  const v=$('vid');v.srcObject=stream;v.muted=true;v.style.transform=facing==='user'?'scaleX(-1)':'none';
  $('ph').classList.add('hidden');$('lv').classList.remove('hidden');
  live=true;t0=Date.now();camOn=true;micOn=true;pol=null;
  ['bdb','cmb','mcb','plb'].forEach(i=>$(i).classList.remove('hidden'));updCam();
  /* history record */
  const ins=await sb.from('gs_class_history').insert({batch_id:String(batch.id),batch_name:batch.name,subject:batch.subject,owner_id:user.id,owner_name:myName}).select().single();
  if(ins.error){toast('History save error: '+ins.error.message)}
  hid=ins.data?ins.data.id:null;
  $('gb').textContent='⛔ End Class';$('gb').classList.add('red');
  tmr=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('tm').textContent='⏱️ '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);
  await sb.from('gs_batches').update({is_live:true,live_started_at:new Date().toISOString()}).eq('id',batch.id);
  bcast({t:'live',v:true,hid});conns.forEach((s,p)=>callStudent(p));vcount();
  beginRec();
}
async function endLive(){
  stopBoard();
  bcast({t:'end'});
  if(hid){await sb.from('gs_class_history').update({ended_at:new Date().toISOString()}).eq('id',hid)}
  await endRec();hid=null;pol=null;
  calls.forEach(c=>{try{c.close()}catch(e){}});calls=[];
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  clearInterval(tmr);live=false;
  await sb.from('gs_batches').update({is_live:false,live_started_at:null}).eq('id',batch.id);
  const g=$('gb');if(g){g.textContent='▶️ Start Class';g.classList.remove('red');['bdb','cmb','mcb','plb'].forEach(i=>$(i).classList.add('hidden'));$('lv').classList.add('hidden');$('ph').classList.remove('hidden');$('vid').srcObject=null;$('tm').textContent='';vcount()}
}
async function flip(){
  facing=facing==='user'?'environment':'user';
  if(!stream){toast(facing==='user'?'🤳 Front camera':'📷 Back camera');return}
  const old=stream.getVideoTracks()[0];if(old)old.stop();
  try{
    const n=(await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing}}})).getVideoTracks()[0];
    n.enabled=camOn;
    if(old)stream.removeTrack(old);stream.addTrack(n);
    $('vid').srcObject=stream;$('vid').style.transform=facing==='user'?'scaleX(-1)':'none';
    calls.forEach(c=>{try{const s=c.peerConnection.getSenders().find(x=>x.track&&x.track.kind==='video');if(s)s.replaceTrack(n)}catch(e){}});
    if(live&&hid){await stopRec();startRec()}
  }catch(e){toast('Camera बदलता आला नाही')}
}

/* ---------- RECORDING (Sir side) ---------- */
function pickMime(){
  if(!window.MediaRecorder)return '';
  return ['video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t))||'';
}
function startRec(){
  if(!window.MediaRecorder||!stream||!hid)return;
  recMime=recMime||pickMime();
  let r;
  try{r=new MediaRecorder(stream,{mimeType:recMime||undefined,videoBitsPerSecond:500000,audioBitsPerSecond:64000})}
  catch(e){toast('Recording सुरू होत नाही');return}
  const chunks=[],part=++recPart,h=hid;
  r.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  r.onstop=()=>{const b=new Blob(chunks,{type:r.mimeType||recMime||'video/webm'});if(b.size>1000)queueUpload(b,part,h)};
  r.start(1000);
  rec=r;
}
function stopRec(){
  return new Promise(res=>{
    if(!rec||rec.state==='inactive'){rec=null;res();return}
    const r=rec,old=r.onstop;rec=null;
    r.onstop=()=>{if(old)old();res()};
    try{r.stop()}catch(e){res()}
  });
}
function beginRec(){
  recPart=0;
  startRec();
  clearInterval(segTimer);
  segTimer=setInterval(async()=>{if(!live)return;await stopRec();startRec()},SEG_MS);
}
async function endRec(){
  clearInterval(segTimer);segTimer=null;
  saving=true;$('saveOv').classList.remove('hidden');
  await stopRec();
  await upQ;
  saving=false;$('saveOv').classList.add('hidden');
  toast('✅ Recording save झाली');
}
function queueUpload(blob,part,h){
  upQ=upQ.then(async()=>{
    const ext=blob.type.indexOf('mp4')>-1?'mp4':'webm';
    const path=user.id+'/'+h+'/'+String(part).padStart(3,'0')+'.'+ext;
    const up=await sb.storage.from('class-recordings').upload(path,blob,{contentType:blob.type.split(';')[0]});
    if(up.error){toast('Recording upload error: '+up.error.message);return}
    const url=sb.storage.from('class-recordings').getPublicUrl(path).data.publicUrl;
    const ins=await sb.from('gs_class_recordings').insert({history_id:h,owner_id:user.id,part,url});
    if(ins.error)toast('Recording save error: '+ins.error.message);
  }).catch(e=>console.error(e));
}

/* ---------- STUDENT side ---------- */
function initStudent(){
  if(blocked.has(user.id)){toast('🚫 Sir ने तुम्हाला block केले आहे')}
  peer=new Peer({debug:1});
  peer.on('open',()=>{connect();retry=setInterval(connect,6000)});
  peer.on('call',call=>{
    call.answer();
    call.on('stream',st=>{
      const v=$('vid');v.srcObject=st;v.muted=false;
      $('ph').classList.add('hidden');$('lv').classList.remove('hidden');
      v.play().catch(()=>{v.muted=true;v.play();$('snd').classList.remove('hidden')});
    });
    call.on('close',noLive);
  });
  peer.on('error',e=>{if(e.type==='peer-unavailable')sc=null;else console.error(e)});
}
function connect(){
  if(!peer||!peer.open||sc||blocked.has(user.id))return;
  sc=peer.connect(sirId,{reliable:true});
  sc.on('open',()=>sc.send({t:'hi',name:myName,uid:user.id}));
  sc.on('data',d=>{
    if(!d||typeof d!=='object')return;
    if(d.t==='live'){if(d.v)location.href='player.html?b='+batch.id;else noLive()}
    if(d.t==='end'){noLive();toast('Sir ने Live Class संपवली')}
    if(d.t==='blocked'){toast('🚫 Sir ने तुम्हाला block केले आहे');blocked.set(user.id,myName);leaveRoom()}
    if(d.t==='allow')startTalk();
    if(d.t==='revoke')stopTalk();
  });
  sc.on('close',()=>{sc=null;noLive()});
}
async function markAttend(h){
  const r=await sb.from('gs_class_attendance').upsert(
    {history_id:h,user_id:user.id,user_name:myName,owner_id:batch.owner_id},
    {onConflict:'history_id,user_id',ignoreDuplicates:true});
  if(r.error)console.error('attendance',r.error.message);
}
function noLive(){
  const v=$('vid');if(!v)return;v.srcObject=null;
  $('ph').classList.remove('hidden');$('lv').classList.add('hidden');
}
let handUp=false;
function hand(){
  if(!sc||!sc.open){toast('⚠️ Sir शी connection नाही');return}
  handUp=!handUp;sc.send({t:'hand',v:handUp});
  $('hb').textContent=handUp?'✋ Hand खाली करा':'✋ Hand Raise';
}
async function startTalk(){
  try{
    gs=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});
    gcall=peer.call(sirId,gs);$('mb').classList.remove('hidden');toast('🎤 Sir ने तुम्हाला बोलायला allow केले');
  }catch(e){toast('Camera आणि Mic permission द्या')}
}
function stopTalk(){
  if(gs){gs.getTracks().forEach(t=>t.stop());gs=null}
  try{if(gcall)gcall.close()}catch(e){}
  gcall=null;const m=$('mb');if(m)m.classList.add('hidden');
}

/* ---------- leave ---------- */
async function leaveRoom(){
  if(mine&&live){if(!confirm('Class सुरू आहे. End करून बाहेर पडायचे?'))return;await endLive()}
  stopTalk();clearInterval(retry);clearInterval(tmr);
  if(sc){try{sc.close()}catch(e){}sc=null}
  if(peer){try{peer.destroy()}catch(e){}peer=null}
  if(ch){sb.removeChannel(ch);ch=null}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  const r=$('room');if(r)r.remove();
  handUp=false;pol=null;
  mine?showSir():showStudent();
}
window.addEventListener('beforeunload',e=>{if(saving){e.preventDefault();e.returnValue=''}if(mine&&live){sb.from('gs_batches').update({is_live:false}).eq('id',batch.id);if(hid)sb.from('gs_class_history').update({ended_at:new Date().toISOString()}).eq('id',hid)}});

/* ---------- start ---------- */
document.addEventListener('DOMContentLoaded',async()=>{
  const {data}=await sb.auth.getUser();user=data?.user||null;
  if(!user){toast('आधी GyanSetu मध्ये Login करा');return}
  myName=(user.user_metadata?.username||localStorage.getItem('gyansetu_username')||(user.email||'').split('@')[0]||'User').slice(0,30);
});
</script>
