<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07070d">
<title>GyanSetu Digital Board</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--pk:#ff2d87;--bl:#3d6cff;--bg:#07070d;--card:#12121c;--card2:#1b1b2b;--line:#2a2a40;--tx:#fff;--mut:#9aa0bd;--g:linear-gradient(135deg,var(--pk),var(--bl))}
[data-theme=light]{--bg:#eef1fa;--card:#ffffff;--card2:#eef0fa;--line:#d6d9ee;--tx:#14152a;--mut:#5d6282}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);overflow:hidden;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.hidden{display:none!important}
#app{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(circle at 85% -10%,#3d6cff26,transparent 50%),radial-gradient(circle at 0 110%,#ff2d8724,transparent 50%),var(--bg)}
.ib{min-width:36px;height:36px;padding:0 9px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:16px;display:flex;align-items:center;justify-content:center;flex:none;white-space:nowrap}
.ib:active{transform:scale(.94)}
.ib.on{background:var(--g);color:#fff;border-color:transparent}
.ib:disabled{opacity:.35;cursor:default}
.sep{width:1px;height:24px;background:var(--line);flex:none}
.sp{flex:1}
/* header */
#hdr{display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
#hdr::-webkit-scrollbar,#opts::-webkit-scrollbar,#tools::-webkit-scrollbar{display:none}
.brand{display:flex;flex-direction:column;line-height:1.15;margin:0 6px 0 2px;flex:none}
.brand b{font-size:15px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.brand small{font-size:10px;color:var(--mut);white-space:nowrap}
.lbl{font-size:13px;font-weight:700;min-width:46px;text-align:center;font-variant-numeric:tabular-nums;flex:none}
/* options */
#opts{display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;padding:0}
.sw.on{border-color:var(--pk);box-shadow:0 0 0 2px var(--pk)}
#cc{width:30px;height:28px;border:0;padding:0;background:none;flex:none;border-radius:6px}
.rng{display:flex;align-items:center;gap:8px;flex:none;font-size:12px;color:var(--mut)}
.rng input{width:120px;accent-color:var(--pk)}
.rng b{min-width:22px;color:var(--tx)}
/* main */
#main{flex:1;min-height:0;display:flex}
#tools{display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--card);border-right:1px solid var(--line);overflow-y:auto;scrollbar-width:none;flex:none}
#tools .ib{width:42px;height:42px;font-size:18px}
#wrap{flex:1;min-width:0;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#paper{position:relative;box-shadow:0 8px 40px #0008;border-radius:4px;overflow:hidden;flex:none}
#paper canvas{position:absolute;left:0;top:0;touch-action:none}
#tc{cursor:crosshair}
#ta{position:absolute;z-index:5;background:#ffffff14;border:1.5px dashed var(--pk);outline:none;resize:none;overflow:hidden;line-height:1.3;font-weight:600;font-family:system-ui,Arial,sans-serif;padding:0 2px;min-width:90px;border-radius:3px}
#mathbar{position:absolute;left:8px;right:8px;bottom:8px;z-index:20;display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--pk);border-radius:12px;padding:6px;overflow-x:auto;scrollbar-width:none}
#mathbar button.sy{min-width:34px;height:34px;border-radius:8px;background:var(--card2);border:1px solid var(--line);font-size:17px;flex:none}
#mathbar .hint{font-size:11px;color:var(--mut);flex:none;max-width:210px;line-height:1.3}
/* presentation */
#pbar{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:none;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 8px;opacity:.9}
.pres #hdr,.pres #opts,.pres #tools{display:none}
.pres #pbar{display:flex}
.pres #paper{box-shadow:none;border-radius:0}
/* modal / toast */
.ov{position:fixed;inset:0;z-index:100;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{width:100%;max-width:520px;max-height:90dvh;overflow:auto;background:var(--card);border:1px solid var(--bl);border-radius:16px;padding:14px}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:16px}
.row{display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;background:var(--card2);margin-top:8px}
.row .tx{flex:1;min-width:0}.row .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .tx small{color:var(--mut)}
.pri{padding:10px 16px;border-radius:10px;background:var(--g);color:#fff;font-weight:700}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px}
.kg span{color:var(--mut)}
kbd{background:var(--card2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12px;margin-right:6px}
#toast{position:fixed;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:300;background:var(--card);border:1px solid var(--pk);border-radius:12px;padding:9px 16px;font-size:14px;text-align:center;max-width:90%}
#who{font-size:12px;color:var(--mut);white-space:nowrap;flex:none}
@media (max-width:760px){
  #main{flex-direction:column-reverse}
  #tools{flex-direction:row;border-right:0;border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  .brand small,#who{display:none}
  .rng input{width:90px}
}
</style>
</head>
<body>
<div id="app">
  <div id="toast" class="hidden"></div>

  <div id="hdr">
    <button class="ib" title="मागे" onclick="goBack()">←</button>
    <div class="brand"><b>GyanSetu Digital Board</b><small>Teaching Board</small></div>
    <span id="who"></span>
    <span class="sep"></span>
    <button class="ib" id="pgPrev" title="मागील page (←)" onclick="goPage(S.pg-1)">◀</button>
    <span class="lbl" id="pgLbl">1 / 1</span>
    <button class="ib" id="pgNext" title="पुढील page (→)" onclick="goPage(S.pg+1)">▶</button>
    <button class="ib" title="नवीन page जोडा" onclick="newPage(S.pg+1)">＋</button>
    <button class="ib" id="pgDel" title="हे page काढा" onclick="delPage()">🗑</button>
    <span class="sep"></span>
    <button class="ib" id="undoB" title="Undo (Ctrl+Z)" onclick="undo()">↶</button>
    <button class="ib" id="redoB" title="Redo (Ctrl+Y)" onclick="redo()">↷</button>
    <span class="sep"></span>
    <button class="ib" title="Zoom out (-)" onclick="zoomBtn(1/1.25)">−</button>
    <button class="ib lbl" id="zl" title="Reset view (0)" onclick="setView(1,0,0)">100%</button>
    <button class="ib" title="Zoom in (+)" onclick="zoomBtn(1.25)">＋</button>
    <span class="sep"></span>
    <button class="ib" title="Session Save (Ctrl+S)" onclick="saveSession()">💾</button>
    <button class="ib" title="Session उघडा" onclick="openSessions()">📂</button>
    <button class="ib" title="PNG download (Shift+D)" onclick="exportPng()">⬇️</button>
    <button class="ib" title="PDF upload" onclick="$('fpdf').click()">📄</button>
    <button class="ib" title="Image upload" onclick="$('fimg').click()">🖼️</button>
    <span class="sep"></span>
    <button class="ib" title="Grid (G)" id="gridB" onclick="toggleGrid()">▦</button>
    <button class="ib" title="Board रंग Black/White (B)" id="modeB" onclick="toggleMode()">⚫</button>
    <button class="ib" title="App Theme Dark/Light" id="themeB" onclick="toggleTheme()">🌙</button>
    <button class="ib" title="Full screen (F)" id="fsB" onclick="toggleFs()">⛶</button>
    <button class="ib" title="Presentation mode (S)" onclick="setPres(true)">▶️</button>
    <button class="ib" title="Board clear (Shift+Delete)" onclick="clearBoard()">🧹</button>
    <button class="ib" title="Shortcuts (?)" onclick="help()">⌨️</button>
  </div>

  <div id="opts">
    <div id="colG" style="display:flex;gap:8px;align-items:center"></div>
    <div class="rng" id="szG"><span id="szN">Size</span><input type="range" id="sz" min="1" max="30" step="1" value="4"><b id="szV">4</b></div>
  </div>

  <div id="main">
    <div id="tools"></div>
    <div id="wrap">
      <div id="paper">
        <canvas id="bc"></canvas>
        <canvas id="tc"></canvas>
        <textarea id="ta" class="hidden" rows="1" spellcheck="false" placeholder="लिहा..."></textarea>
      </div>
      <div id="mathbar" class="hidden"></div>
    </div>
  </div>

  <div id="pbar">
    <button class="ib" onclick="goPage(S.pg-1)">◀</button>
    <span class="lbl" id="pgLbl2">1 / 1</span>
    <button class="ib" onclick="goPage(S.pg+1)">▶</button>
    <span class="sep"></span>
    <button class="ib" data-t="pen" onclick="setTool('pen')">✏️</button>
    <button class="ib" data-t="erase" onclick="setTool('erase')">🧽</button>
    <button class="ib" data-t="pan" onclick="setTool('pan')">✋</button>
    <button class="ib" data-t="laser" onclick="setTool('laser')">🔴</button>
    <button class="ib" onclick="undo()">↶</button>
    <span class="sep"></span>
    <button class="ib" onclick="setPres(false)">✕</button>
  </div>

  <div id="modal" class="ov hidden" onclick="if(event.target===this)closeModal()"><div class="mbox"><div class="mh"><b id="mt"></b><button class="ib" onclick="closeModal()">✕</button></div><div id="mb"></div></div></div>
  <input type="file" id="fpdf" accept="application/pdf" class="hidden">
  <input type="file" id="fimg" accept="image/*" class="hidden" multiple>
</div>

<script>
/* ================= GyanSetu Digital Board ================= */
const SB_URL="https://eqglttfffhvoyvrclzse.supabase.co",SB_KEY="sb_publishable_rR4xxl0dW5DJrhhjqiFHLw_uJ-HakAb";
const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",PDFW="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Public hook: teacher live page can subscribe -> GSBoard.onEvent = d => conn.send(d)  (same protocol as student player) */
window.GSBoard={onEvent:null,getState:()=>snapshot(),loadState:d=>loadSnapshot(d),emitFull:()=>emitFull()};
function emit(d){try{if(typeof GSBoard.onEvent==='function')GSBoard.onEvent(d);window.dispatchEvent(new CustomEvent('gsboard',{detail:d}))}catch(e){console.error(e)}}

/* ---------- Supabase (same project, auth untouched; read-only identity display) ---------- */
let sb=null,user=null;
try{sb=supabase.createClient(SB_URL,SB_KEY)}catch(e){}
(async()=>{try{const {data}=await sb.auth.getUser();user=data?.user||null}catch(e){}
  const n=user?(user.user_metadata?.username||localStorage.getItem('gyansetu_username')||(user.email||'').split('@')[0]):'';
  $('who').textContent=n?'👨‍🏫 '+n:'Local mode'})();

/* ---------- state ---------- */
const mkPage=()=>({objs:[],undo:[],redo:[],view:{z:1,x:0,y:0}});
const S={pages:[mkPage()],pg:0,tool:'pen',color:'#ffffff',sizes:{pen:4,hl:18,erase:26,text:5,shape:4},mode:'black',grid:false,ba:9/16,sel:null,pres:false,name:'',sid:null};
const SR={pen:[1,30],hl:[6,60],erase:[6,100],text:[2,20],shape:[1,30]};
const TOOLS=[['pen','✏️','Pen (P)'],['hl','🖍️','Highlighter (H)'],['erase','🧽','Eraser (E)'],['text','T','Text / Equation (T)'],['line','╱','Line (N)'],['rect','▭','Rectangle (R)'],['circle','◯','Circle (O)'],['arrow','➚','Arrow (W)'],['tri','△','Triangle (Y)'],['select','⬚','Select / Move / Resize object (V)'],['pan','✋','Board हलवा (M / Space)'],['laser','🔴','Laser pointer (L)']];
const SHAPEK={line:'l',rect:'r',circle:'c',arrow:'ar',tri:'tri'};
const COLORS=['#ffffff','#111111','#ffe14d','#ff9f1c','#ff4d4d','#ff2d87','#a855f7','#3d6cff','#22d3ee','#34d399'];
const pg=()=>S.pages[S.pg],V=()=>pg().view;
const sk=t=>SHAPEK[t]?'shape':t;
let DPR=1,CW=600,CH=340;
const bc=$('bc'),tc=$('tc'),bctx=bc.getContext('2d'),tctx=tc.getContext('2d');
let cur=null,ed=null,mv=null,pan=null,pinch=null,lastPen=0,spaceDown=false,hover=null,lzp=null,lzT=0;
const ptrs=new Map();

let tt;function toast(t){const e=$('toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(tt);tt=setTimeout(()=>e.classList.add('hidden'),2800)}
function goBack(){history.length>1?history.back():location.href='live.html'}

/* ---------- helpers ---------- */
function ser(o){const c={};for(const k in o)if(k[0]!=='_')c[k]=o[k];return c}
const snap=o=>({p:o.p.map(q=>q.slice()),w:o.w});
function getImg(o){if(!o._im){const im=new Image();im.onload=()=>redraw();im.src=o.src;o._im=im}return o._im}
function textW(o){bctx.save();bctx.font='600 '+(o.w*1000)+'px system-ui,Arial';const w=bctx.measureText(o.tx||'').width/1000;bctx.restore();return w}
function bbox(o){
  if(!o.p||!o.p.length)return null;
  if(o.k==='t'){const [x,y]=o.p[0];return [x,y,x+textW(o),y+o.w*1.25]}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;o.p.forEach(q=>{x0=Math.min(x0,q[0]);y0=Math.min(y0,q[1]);x1=Math.max(x1,q[0]);y1=Math.max(y1,q[1])});
  const pad=(!o.k||o.k==='pen')?(o.w||0)/2:0;return [x0-pad,y0-pad,x1+pad,y1+pad];
}
function dSeg(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
function hit(o,p,tol){
  if(o.c==='erase')return false;
  if(!o.k||o.k==='pen'){const r=Math.max((o.w||0)/2,tol);if(o.p.length===1)return Math.hypot(p[0]-o.p[0][0],p[1]-o.p[0][1])<=r;for(let i=1;i<o.p.length;i++)if(dSeg(p,o.p[i-1],o.p[i])<=r)return true;return false}
  const b=bbox(o);return !!b&&p[0]>=b[0]-tol&&p[0]<=b[2]+tol&&p[1]>=b[1]-tol&&p[1]<=b[3]+tol;
}

/* ---------- drawing (shared by canvas, export) ---------- */
function drawObj(c,W,v,o){
  const k=o.k||'pen',pt=i=>{const q=o.p[i];return [(q[0]-v.x)*v.z*W,(q[1]-v.y)*v.z*W]};
  c.save();
  c.globalCompositeOperation=o.c==='erase'?'destination-out':'source-over';
  c.globalAlpha=o.a||1;c.strokeStyle=c.fillStyle=o.c==='erase'?'#000':(o.c||'#fff');c.lineCap=c.lineJoin='round';
  const lw=Math.max(1,(o.w||0.004)*v.z*W);c.lineWidth=lw;
  if(k==='pen'){
    c.beginPath();const a=pt(0);c.moveTo(a[0],a[1]);
    if(o.p.length===1)c.lineTo(a[0]+.01,a[1]);
    for(let i=1;i<o.p.length;i++){const b=pt(i);c.lineTo(b[0],b[1])}
    c.stroke();
  }else if(k==='i'){
    const im=getImg(o);if(im.complete&&im.naturalWidth){const a=pt(0),b=pt(1);c.drawImage(im,Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]))}
  }else if(k==='t'){
    const a=pt(0);c.font='600 '+Math.max(6,o.w*v.z*W)+'px system-ui,Arial';c.textBaseline='top';c.fillText(o.tx||'',a[0],a[1]);
  }else{
    const a=pt(0),b=pt(o.p.length-1);c.beginPath();
    if(k==='l'||k==='ar'){c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);
      if(k==='ar'){const an=Math.atan2(b[1]-a[1],b[0]-a[0]),h=Math.max(12*(W/1000+.5),lw*4);[2.65,-2.65].forEach(d=>{c.moveTo(b[0],b[1]);c.lineTo(b[0]+h*Math.cos(an+d),b[1]+h*Math.sin(an+d))})}}
    else if(k==='r')c.rect(a[0],a[1],b[0]-a[0],b[1]-a[1]);
    else if(k==='c')c.ellipse((a[0]+b[0])/2,(a[1]+b[1])/2,Math.abs(b[0]-a[0])/2,Math.abs(b[1]-a[1])/2,0,0,7);
    else if(k==='tri'){c.moveTo((a[0]+b[0])/2,Math.min(a[1],b[1]));c.lineTo(Math.max(a[0],b[0]),Math.max(a[1],b[1]));c.lineTo(Math.min(a[0],b[0]),Math.max(a[1],b[1]));c.closePath()}
    c.stroke();
  }
  c.restore();
}
function drawSeg(o,i){
  const v=V(),W=bc.width,q=o.p[i],r=o.p[i-1]||q;
  bctx.save();bctx.globalCompositeOperation=o.c==='erase'?'destination-out':'source-over';
  bctx.strokeStyle=o.c==='erase'?'#000':o.c;bctx.lineWidth=Math.max(1,o.w*v.z*W);bctx.lineCap=bctx.lineJoin='round';
  const ax=(r[0]-v.x)*v.z*W,ay=(r[1]-v.y)*v.z*W,bx_=(q[0]-v.x)*v.z*W,by=(q[1]-v.y)*v.z*W;
  bctx.beginPath();bctx.moveTo(ax,ay);bctx.lineTo(bx_+(i?0:.01),by);bctx.stroke();bctx.restore();
}
let rq=0,tq=0;
function redraw(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;fullDraw()})}
function fullDraw(){
  bctx.clearRect(0,0,bc.width,bc.height);const v=V();
  pg().objs.forEach(o=>drawObj(bctx,bc.width,v,o));
  if(cur&&cur.k==='pen'&&!cur.a)drawObj(bctx,bc.width,v,cur);
  drawTop();
}
function top(){if(tq)return;tq=requestAnimationFrame(()=>{tq=0;drawTop()})}
function drawTop(){
  tctx.clearRect(0,0,tc.width,tc.height);const v=V(),W=tc.width;
  if(cur&&(cur.a||cur.k!=='pen'))drawObj(tctx,W,v,cur);
  if(S.sel&&S.tool==='select'){const b=bbox(S.sel);if(b){
    const x0=(b[0]-v.x)*v.z*W,y0=(b[1]-v.y)*v.z*W,x1=(b[2]-v.x)*v.z*W,y1=(b[3]-v.y)*v.z*W;
    tctx.save();tctx.setLineDash([8*DPR,6*DPR]);tctx.strokeStyle='#ff2d87';tctx.lineWidth=2*DPR;tctx.strokeRect(x0,y0,x1-x0,y1-y0);
    tctx.setLineDash([]);tctx.fillStyle='#3d6cff';tctx.fillRect(x1-7*DPR,y1-7*DPR,14*DPR,14*DPR);tctx.restore()}}
  if(S.tool==='erase'&&hover){tctx.save();tctx.strokeStyle='#ff2d87';tctx.lineWidth=1.5*DPR;tctx.beginPath();tctx.arc(hover[0]*DPR,hover[1]*DPR,Math.max(2,S.sizes.erase/1000*v.z*W/2),0,7);tctx.stroke();tctx.restore()}
  if(lzp&&S.tool==='laser'){const x=lzp[0]*tc.width,y=lzp[1]*tc.height,r=9*DPR;tctx.save();tctx.fillStyle='#ff2d2d';tctx.shadowColor='#ff2d2d';tctx.shadowBlur=r*2;tctx.beginPath();tctx.arc(x,y,r,0,7);tctx.fill();tctx.restore()}
}

/* ---------- layout / background / view ---------- */
function fit(){
  const w=$('wrap'),m=S.pres?0:10,aw=Math.max(80,w.clientWidth-m*2),ah=Math.max(60,w.clientHeight-m*2);
  CW=Math.floor(Math.min(aw,ah/S.ba));CH=Math.round(CW*S.ba);DPR=Math.min(window.devicePixelRatio||1,2.5);
  const p=$('paper');p.style.width=CW+'px';p.style.height=CH+'px';
  [bc,tc].forEach(c=>{c.width=Math.round(CW*DPR);c.height=Math.round(CH*DPR);c.style.width=CW+'px';c.style.height=CH+'px'});
  paintBg();fullDraw();
}
function paintBg(){
  const p=$('paper'),v=V(),white=S.mode==='white';p.style.backgroundColor=white?'#ffffff':'#111111';
  if(S.grid){const s=.05*v.z*CW,c=white?'rgba(0,0,0,.13)':'rgba(255,255,255,.13)';

      const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];

        const p=toW(ev),l=cur.p[cur.p.length-1];

function readScaled(file,max){

    const fr=new FileReader();fr.onerror=rej;
    fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{

      c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      res({url:c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',.88),w:c.width,h:c.height})};im.src=fr.result};
    fr.readAsDataURL(file);
  });
}

      await page.render({canvasContext:cx,viewport:vp}).promise;
      const rt=vp.height/vp.width;let w,h,x,y;
      if(rt<=S.ba){w=.96;h=w*rt;x=.02;y=(S.ba-h)/2}else{h=S.ba*.96;w=h/rt;x=(1-w)/2;y=S.ba*.02}
      const o={k:'i',src:c.toDataURL('image/jpeg',.85),p:[[x,y],[x+w,y+h]]};
      if(i===1&&useCur)pg().objs.push(o);else{const np=mkPage();np.objs.push(o);S.pages.splice(base+i-1,0,np)}
      c.width=c.height=0;
    }
    goPage(base);dirty();toast('✅ PDF जोडला: '+n+' pages');
  }catch(e){console.error(e);toast('PDF उघडता आला नाही (Internet तपासा)')}
}
$('fpdf').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(f)await addPdf(f)});
document.addEventListener('paste',e=>{const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));if(it&&!ed){addImageFile(it.getAsFile())}});
$('wrap').addEventListener('dragover',e=>e.preventDefault());
$('wrap').addEventListener('drop',async e=>{e.preventDefault();for(const f of e.dataTransfer.files){if(f.type==='application/pdf')await addPdf(f);else if(f.type.startsWith('image/'))await addImageFile(f)}});

/* ---------- export PNG ---------- */
async function exportPng(){
  commitText();toast('⬇️ तयार होत आहे...');
  await Promise.all(pg().objs.filter(o=>o.k==='i').map(o=>new Promise(r=>{const im=getImg(o);if(im.complete)r();else{im.addEventListener('load',r);im.addEventListener('error',r)}})));
  const W=1920,H=Math.round(W*S.ba),v=V(),white=S.mode==='white',c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');x.fillStyle=white?'#fff':'#111';x.fillRect(0,0,W,H);
  if(S.grid){x.strokeStyle=white?'rgba(0,0,0,.13)':'rgba(255,255,255,.13)';x.lineWidth=1;const s=.05*v.z*W,ox=((-v.x*v.z*W)%s+s)%s,oy=((-v.y*v.z*W)%s+s)%s;
    for(let a=ox;a<W;a+=s){x.beginPath();x.moveTo(a,0);x.lineTo(a,H);x.stroke()}for(let b=oy;b<H;b+=s){x.beginPath();x.moveTo(0,b);x.lineTo(W,b);x.stroke()}}
  const l=document.createElement('canvas');l.width=W;l.height=H;const lx=l.getContext('2d');pg().objs.forEach(o=>drawObj(lx,W,v,o));x.drawImage(l,0,0);
  x.font='600 22px system-ui';x.textAlign='right';x.fillStyle=white?'rgba(0,0,0,.35)':'rgba(255,255,255,.35)';x.fillText('GyanSetu',W-20,H-18);
  c.toBlob(bl=>{if(!bl){toast('Download झाले नाही');return}const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='gyansetu-board-page'+(S.pg+1)+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('⬇️ PNG download झाला')},'image/png');
}

/* ---------- sessions (IndexedDB, local to this device) ---------- */
const idb=new Promise((res,rej)=>{if(!window.indexedDB)return rej();const r=indexedDB.open('gyansetu-board',1);r.onupgradeneeded=()=>r.result.createObjectStore('s',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
idb.catch(()=>{});
async function dbx(mode,f){const d=await idb;return new Promise((res,rej)=>{const t=d.transaction('s',mode),q=f(t.objectStore('s'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})}
const dbPut=r=>dbx('readwrite',s=>s.put(r)),dbAll=()=>dbx('readonly',s=>s.getAll()),dbGet=i=>dbx('readonly',s=>s.get(i)),dbDel=i=>dbx('readwrite',s=>s.delete(i));
function snapshot(){return {v:1,ba:S.ba,mode:S.mode,grid:S.grid,pg:S.pg,pages:S.pages.map(p=>({objs:p.objs.map(ser),view:{...p.view}}))}}
function loadSnapshot(d,meta){
  if(!d||!Array.isArray(d.pages)||!d.pages.length)return;
  commitText();S.pages=d.pages.map(p=>({objs:(p.objs||[]).map(o=>({...o})),undo:[],redo:[],view:p.view||{z:1,x:0,y:0}}));
  S.ba=d.ba||9/16;S.mode=d.mode==='white'?'white':'black';S.grid=!!d.grid;S.pg=Math.min(d.pg||0,S.pages.length-1);S.sel=null;
  S.name=meta&&meta.id!=='autosave'?meta.name:'';S.sid=meta&&meta.id!=='autosave'?meta.id:null;
  emit({t:'bmode',mode:S.mode});emit({t:'basp',a:S.ba});fit();goPage(S.pg);
}
async function saveSession(){
  commitText();let n=prompt('Session चे नाव:',S.name||('Class '+new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short'})));
  if(!n)return;S.name=n.trim().slice(0,60);S.sid=S.sid||'s'+Date.now();
  try{await dbPut({id:S.sid,name:S.name,t:Date.now(),n:S.pages.length,data:snapshot()});toast('💾 Session save झाले')}catch(e){toast('Save झाले नाही (storage भरले / private mode)')}
}
async function openSessions(){
  commitText();let list=[];try{list=(await dbAll()).sort((a,b)=>b.t-a.t)}catch(e){}
  $('mt').textContent='📂 Saved Sessions';
  $('mb').innerHTML=`<button class="pri" style="width:100%" onclick="newSession()">＋ नवीन Session</button>`+(list.map(r=>`<div class="row"><div class="tx"><b>${r.id==='autosave'?'⏱ Auto-saved (शेवटचे)':esc(r.name)}</b><small>${r.n} pages • ${esc(new Date(r.t).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}))}</small></div><button class="ib" data-o="${esc(r.id)}">उघडा</button>${r.id==='autosave'?'':`<button class="ib" data-d="${esc(r.id)}">🗑</button>`}</div>`).join('')||'<p style="color:var(--mut);text-align:center;margin-top:14px">अजून Session save केलेले नाही</p>');
  $('mb').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.o){const r=await dbGet(b.dataset.o);if(r){loadSnapshot(r.data,r);closeModal();toast('📂 Session उघडले')}}
    else if(b.dataset.d){if(confirm('हे session delete करायचे?')){await dbDel(b.dataset.d);openSessions()}}};
  $('modal').classList.remove('hidden');
}
function newSession(){if(!confirm('सध्याचे board बंद करून नवीन सुरू करायचे? (Save केले नसेल तर Auto-save मध्ये राहील)'))return;saveAuto().then(()=>{loadSnapshot({pages:[{objs:[],view:{z:1,x:0,y:0}}],mode:S.mode,grid:S.grid,ba:S.ba});S.name='';S.sid=null;closeModal()})}
let at=0;function dirty(){clearTimeout(at);at=setTimeout(saveAuto,2500)}
async function saveAuto(){try{await dbPut({id:'autosave',name:'Auto-saved',t:Date.now(),n:S.pages.length,data:snapshot()})}catch(e){}}
function closeModal(){$('modal').classList.add('hidden')}
window.addEventListener('pagehide',saveAuto);

/* ---------- help ---------- */
function help(){
  const k=[['P','Pen'],['H','Highlighter'],['E','Eraser'],['T','Text / Equation'],['N','Line'],['R','Rectangle'],['O','Circle'],['W','Arrow'],['Y','Triangle'],['V','Select / Move object'],['M / Space','Board हलवा'],['L','Laser pointer'],['Ctrl+Z / Ctrl+Y','Undo / Redo'],['Ctrl+S','Session Save'],['Shift+D','PNG download'],['G','Grid'],['B','Black / White board'],['+ / − / 0','Zoom / Reset'],['← / →','Page बदला'],['Del','Selected object काढा'],['Shift+Del','Board clear'],['F','Full screen'],['S','Presentation'],['Esc','बाहेर / Deselect'],['Shift (drag)','सरळ रेषा / समान shape'],['Ctrl+V','Image paste'],['Ctrl+Enter','Text जोडा']];
  $('mt').textContent='⌨️ Keyboard Shortcuts';
  $('mb').onclick=null;$('mb').innerHTML='<div class="kg">'+k.map(x=>`<div><kbd>${esc(x[0])}</kbd><span>${esc(x[1])}</span></div>`).join('')+'</div><p style="margin-top:12px;font-size:12px;color:var(--mut)">Touch: दोन बोटांनी zoom / हलवा • Stylus supported • Mouse: Ctrl+Scroll = zoom, Scroll = हलवा</p>';
  $('modal').classList.remove('hidden');
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA')return;
  const k=e.key.toLowerCase(),c=e.ctrlKey||e.metaKey;
  if(c){
    if(k==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if(k==='y'){e.preventDefault();redo()}else if(k==='s'){e.preventDefault();saveSession()}
    return;
  }
  if(!$('modal').classList.contains('hidden')){if(k==='escape')closeModal();return}
  const T={p:'pen',h:'hl',e:'erase',t:'text',n:'line',r:'rect',o:'circle',w:'arrow',y:'tri',v:'select',m:'pan',l:'laser'};
  if(T[k]&&!e.shiftKey){setTool(T[k]);return}
  if(k===' '){e.preventDefault();if(!spaceDown){spaceDown=true;tc.style.cursor='grab'}return}
  if(k==='d'&&e.shiftKey){exportPng();return}
  if(k==='g')toggleGrid();else if(k==='b')toggleMode();else if(k==='f')toggleFs();else if(k==='s')setPres(!S.pres);
  else if(k==='+'||k==='=')zoomBtn(1.25);else if(k==='-')zoomBtn(1/1.25);else if(k==='0')setView(1,0,0);
  else if(k==='arrowleft'||k==='pageup')goPage(S.pg-1);else if(k==='arrowright'||k==='pagedown')goPage(S.pg+1);
  else if(k==='delete'||k==='backspace'){e.preventDefault();e.shiftKey?clearBoard():S.sel?delSel():0}
  else if(k==='escape'){if(S.pres)setPres(false);else if(S.sel){S.sel=null;top()}}
  else if(k==='?')help();
});
document.addEventListener('keyup',e=>{if(e.key===' '){spaceDown=false;setTool(S.tool)}});
['gesturestart','gesturechange','gestureend'].forEach(e=>document.addEventListener(e,x=>x.preventDefault()));

/* ---------- start ---------- */
(async()=>{
  try{const t=localStorage.getItem('gs_board_theme');if(t==='light')document.documentElement.dataset.theme='light'}catch(e){}
  buildUI();setTool('pen');fit();
  try{const r=await dbGet('autosave');if(r&&r.data&&r.data.pages.some(p=>p.objs.length)){loadSnapshot(r.data,r);toast('⏱ मागील Session restore केले')}}catch(e){}
  emit({t:'basp',a:S.ba});uiSync();
})();
</script>
