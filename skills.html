<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SkillHub</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f8;
    color:#111;
    padding-bottom:40px;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:100;
    background:#fff;
    padding:16px;
    border-bottom:1px solid #ddd;
}

.logo{
    font-size:27px;
    font-weight:800;
    margin-bottom:14px;
}

/* SEARCH */

.search{
    display:flex;
    align-items:center;
    background:#f1f3f5;
    border-radius:14px;
    padding:0 14px;
}

.search input{
    width:100%;
    border:0;
    outline:0;
    background:transparent;
    padding:14px 10px;
    font-size:16px;
}

/* CATEGORY */

.categories{
    display:flex;
    gap:9px;
    overflow-x:auto;
    padding:14px;
}

.category{
    white-space:nowrap;
    background:#fff;
    border:1px solid #ddd;
    padding:9px 14px;
    border-radius:25px;
    cursor:pointer;
}

.category.active{
    background:#111;
    color:#fff;
}

/* TITLE */

.title{
    font-size:22px;
    font-weight:800;
    padding:6px 16px 12px;
}

.count{
    padding:0 16px 12px;
    color:#777;
    font-size:14px;
}

/* SKILLS */

.skills{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    padding:0 14px;
}

.skill{
    background:#fff;
    border-radius:18px;
    padding:17px 14px;
    min-height:125px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
    cursor:pointer;
    transition:.15s;
}

.skill:active{
    transform:scale(.96);
}

.icon{
    font-size:32px;
    margin-bottom:8px;
}

.skill h3{
    font-size:16px;
    margin-bottom:6px;
}

.skill small{
    color:#777;
}

/* DETAIL */

.page{
    display:none;
    padding:16px;
}

.back{
    display:inline-block;
    background:#fff;
    padding:10px 15px;
    border-radius:12px;
    margin-bottom:15px;
    cursor:pointer;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:20px;
    margin-bottom:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.card h1{
    font-size:28px;
    margin-bottom:10px;
}

.card h2{
    font-size:20px;
    margin-bottom:12px;
}

.card h3{
    font-size:17px;
    margin-bottom:7px;
}

.card p{
    color:#444;
    line-height:1.65;
}

/* ROADMAP */

.step{
    display:flex;
    gap:12px;
    margin:12px 0;
    padding:13px;
    background:#f5f6f8;
    border-radius:13px;
}

.step-number{
    min-width:32px;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#111;
    color:white;
    border-radius:50%;
    font-weight:bold;
}

.step-text{
    line-height:1.5;
}

/* TAGS */

.tag{
    display:inline-block;
    margin:5px 5px 5px 0;
    padding:9px 12px;
    border-radius:20px;
    background:#f0f2f5;
    font-size:13px;
}

/* COLLEGE */

.collegeBox{
    margin-top:30px;
}

.collegeSearch{
    background:#fff;
    padding:12px;
    border-radius:15px;
    margin:0 15px 14px;
}

.collegeSearch input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
    font-size:15px;
}

.college{
    background:#fff;
    border-radius:17px;
    padding:16px;
    margin:0 15px 10px;
    box-shadow:0 2px 8px rgba(0,0,0,.04);
}

.college h3{
    margin-bottom:8px;
}

.college p{
    color:#666;
    font-size:14px;
    line-height:1.5;
    margin-top:5px;
}

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:35px;
    color:#777;
}

.lang-title{
    font-size:16px;
    font-weight:bold;
    margin-bottom:7px;
}

.divider{
    height:1px;
    background:#ddd;
    margin:18px 0;
}

@media(min-width:700px){

    .skills{
        grid-template-columns:repeat(4,1fr);
        max-width:1100px;
        margin:auto;
    }

    .title,
    .count{
        max-width:1100px;
        margin:auto;
    }
}

</style>
</head>

const categories=[

let currentCategory="All";


function createCategories(){

    const box=document.getElementById("categories");

    categories.forEach(cat=>{

        const button=document.createElement("div");

        button.className="category";

        if(cat==="All"){
            button.classList.add("active");
        }

        button.innerText=cat;

        button.onclick=()=>{

            currentCategory=cat;

            document
            .querySelectorAll(".category")
            .forEach(x=>x.classList.remove("active"));

            button.classList.add("active");

            searchSkills();

        };

        box.appendChild(button);

    });

}


/* =====================================================

===================================================== */

function displaySkills(list){

    const box=document.getElementById("skills");

    box.innerHTML="";

    document.getElementById("count").innerText=
        list.length+" skills available / स्किल्स उपलब्ध";

    if(list.length===0){

        box.innerHTML=
        `<div class="empty">
            🔎 No skill found / कोई स्किल नहीं मिली
        </div>`;

        return;
    }

    list.forEach(skill=>{

        const card=document.createElement("div");

        card.className="skill";

        card.innerHTML=`

            <div class="icon">
                ${skill.icon}
            </div>

            <h3>
                ${skill.name}
            </h3>

            <small>
                ${skill.category}
            </small>

        `;

        card.onclick=()=>openSkill(skill);

        box.appendChild(card);

    });

}


/* =====================================================
SEARCH
===================================================== */

function searchSkills(){

    const q=document
    .getElementById("skillSearch")
    .value
    .toLowerCase()
    .trim();

    const result=skills.filter(skill=>{

        const searchMatch=

            skill.name
            .toLowerCase()
            .includes(q)

            ||

            skill.category
            .toLowerCase()
            .includes(q)

            ||

            skill.english
            .toLowerCase()
            .includes(q)

            ||

            skill.hindi
            .toLowerCase()
            .includes(q);

        const categoryMatch=

            currentCategory==="All" ||
            skill.category===currentCategory;

        return searchMatch && categoryMatch;

    });

    displaySkills(result);

}
