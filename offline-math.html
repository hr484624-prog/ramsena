body{

}

.app{

header{

  padding:15px;

}

.header-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.back{
  width:42px;
  height:42px;
  border:0;
  border-radius:12px;
  background:rgba(255,255,255,.18);
  color:white;
  font-size:22px;
  cursor:pointer;
}

.title{
  font-size:20px;
  font-weight:800;
}

.subtitle{
  font-size:12px;
  opacity:.9;

}

.content{
  padding:16px;

.hero{
  background:linear-gradient(135deg,#0b5ddd,#4d8cff);

}

.hero h2{
  font-size:23px;
  margin-bottom:6px;
}

.hero p{
  font-size:13px;
  line-height:1.5;
}

.progress-box{
  margin-top:15px;
  background:rgba(255,255,255,.18);
  padding:12px;
  border-radius:14px;
}

.progress-text{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  margin-bottom:7px;
}

.progress{
  height:9px;
  background:rgba(255,255,255,.3);
  border-radius:20px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:white;
  transition:.3s;
}

.section-title{
  font-size:18px;
  font-weight:800;
  margin:20px 0 12px;
}

.classes{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.class-card{
  border:0;
  background:#fff;
  padding:18px 10px;
  border-radius:17px;
  box-shadow:0 4px 15px rgba(0,0,0,.09);
  cursor:pointer;
  text-align:center;
  transition:.2s;
}

.class-card:active{
  transform:scale(.96);
}

.class-icon{
  font-size:28px;
}

.class-name{
  margin-top:8px;
  font-weight:800;
  color:#1259ca;
}

.class-info{
  margin-top:4px;
  color:#777;
  font-size:11px;
}

.chapter-list{
  display:none;
}

.chapter-card{
  background:white;
  border-radius:17px;
  padding:15px;
  margin-bottom:11px;
  box-shadow:0 3px 13px rgba(0,0,0,.08);
  cursor:pointer;
  border-left:5px solid #1769e0;
}

.chapter-number{
  font-size:11px;
  color:#1769e0;
  font-weight:bold;
}

.chapter-title{
  margin-top:4px;
  font-size:16px;
  font-weight:800;
}

.chapter-status{
  margin-top:5px;
  font-size:11px;
  color:#777;
}

.lesson{
  display:none;
}

.lesson-card{
  background:#fff;
  border-radius:20px;
  padding:18px;
  box-shadow:0 4px 16px rgba(0,0,0,.08);
}

.lesson-badge{
  display:inline-block;
  background:#e8f0ff;
  color:#1259ca;
  padding:6px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
  margin-bottom:10px;

.lesson h2{
  font-size:22px;
  margin-bottom:12px;
}

.lesson h3{
  margin:20px 0 8px;
  color:#1259ca;
}

.lesson p{

  font-size:14px;
}

.example{
  background:#f1f6ff;
  border-left:4px solid #1769e0;
  padding:13px;
  border-radius:10px;
  margin-top:10px;
  line-height:1.6;
}

.tip{
  background:#fff7df;
  padding:13px;
  border-radius:12px;
  margin-top:14px;
  font-size:13px;
  line-height:1.5;
}

  width:100%;
  border:0;
  padding:14px;
  border-radius:14px;
  background:#1769e0;
  color:white;
  font-size:15px;
  font-weight:bold;
  margin-top:18px;
  cursor:pointer;
}

.practice{
  margin-top:20px;
  background:#f8f9fc;
  padding:15px;
  border-radius:15px;
}

.practice-question{
  font-weight:bold;
  line-height:1.5;
}

  width:100%;
  border:1px solid #d9dfeb;
  background:white;
  padding:12px;
  margin-top:8px;
  border-radius:11px;
  text-align:left;
  cursor:pointer;
}

.option.correct{
  background:#dff7e7;
  border-color:#29a354;
}

.option.wrong{
  background:#ffe3e3;
  border-color:#d83a3a;
}

.result{
  margin-top:10px;
  font-weight:bold;
  line-height:1.5;
}

.quiz-box{
  display:none;
  background:white;
  padding:18px;
  border-radius:20px;
  box-shadow:0 4px 16px rgba(0,0,0,.08);

.quiz-number{
  font-size:12px;
  color:#1769e0;
  font-weight:bold;
}

.quiz-question{
  font-size:18px;
  font-weight:800;
  margin:12px 0;
  line-height:1.5;
}

.xp{
  text-align:center;
  margin-top:15px;
  background:#fff5cf;
  padding:12px;
  border-radius:14px;
  font-weight:bold;
}

.empty{
  text-align:center;
  color:#777;
  padding:25px;
}

.hide{
  display:none!important;
}
</style>

/* =====================================================
   INIT
===================================================== */

function init(){

  const grid = document.getElementById("classGrid");

  grid.innerHTML = "";

  for(let i=1;i<=10;i++){

    const count = data[i].length;

    grid.innerHTML += `
      <button class="class-card" onclick="openClass(${i})">
        <div class="class-icon">📘</div>
        <div class="class-name">इयत्ता ${i}वी</div>
        <div class="class-info">${count} Chapters</div>
      </button>
    `;
  }

  updateXP();
  updateOverall();

}


/* =====================================================
   OPEN CLASS
===================================================== */

function openClass(cls){

  selectedClass = cls;

  document.getElementById("home").style.display="none";
  document.getElementById("lesson").style.display="none";
  document.getElementById("quizBox").style.display="none";
  document.getElementById("chapterList").style.display="block";

  document.getElementById("classTitle").innerHTML =
    `📚 इयत्ता ${cls}वी Mathematics`;

  const box = document.getElementById("chapters");

  box.innerHTML="";

  data[cls].forEach((chapter,index)=>{

    const key = getChapterKey(cls,index);

    const done =
      localStorage.getItem(key)==="done";

    box.innerHTML += `
      <div class="chapter-card"
           onclick="openChapter(${index})">

        <div class="chapter-number">
          CHAPTER ${index+1}
        </div>

        <div class="chapter-title">
          ${chapter[0]}
        </div>

        <div class="chapter-status">
          ${done ? "✅ Completed" : "📖 Start Learning"}
        </div>

      </div>
    `;

  });

}


/* =====================================================
   OPEN CHAPTER
===================================================== */

function openChapter(index){

  selectedChapter = index;

  const chapter = data[selectedClass][index];

  document.getElementById("chapterList").style.display="none";
  document.getElementById("lesson").style.display="block";
  document.getElementById("quizBox").style.display="none";

  document.getElementById("lessonBadge").textContent =
    `इयत्ता ${selectedClass}वी • Chapter ${index+1}`;

  document.getElementById("lessonTitle").textContent =
    chapter[0];

  document.getElementById("lessonContent").innerHTML = `

    <p>
      ${chapter[1]}
    </p>

    <h3>📖 Concept</h3>

    <p>
      या chapter मध्ये आपण गणितातील महत्त्वाची संकल्पना
      step-by-step समजून घेणार आहोत. प्रश्न सोडवताना
      प्रत्येक step काळजीपूर्वक विचार करा.
    </p>

    <h3>✏️ Example</h3>

    <div class="example">
      <b>उदाहरण:</b><br><br>
      जर एखादा प्रश्न दिला असेल तर प्रथम त्यात
      दिलेली माहिती ओळखा. त्यानंतर योग्य mathematical
      operation निवडा आणि शेवटी उत्तर तपासा.
    </div>

    <h3>🧠 Smart Thinking</h3>

    <div class="tip">
      प्रश्न लगेच सोडवण्याऐवजी आधी विचार करा:
      <br><br>
      1️⃣ मला काय दिले आहे?<br>
      2️⃣ मला काय शोधायचे आहे?<br>
      3️⃣ कोणता नियम किंवा formula वापरायचा?<br>
      4️⃣ माझे उत्तर योग्य आहे का?
    </div>

    <div class="practice">
      <b>🎯 Practice Mission</b>
      <p style="margin-top:8px">
        या chapter वर स्वतः 5 उदाहरणे तयार करा
        आणि ती वहीत सोडवा.
      </p>
    </div>

  `;

}


/* =====================================================
   QUIZ
===================================================== */

function startQuiz(){

  const chapter = data[selectedClass][selectedChapter][0];

  currentQuiz = quizzes[chapter];

  if(!currentQuiz){

    currentQuiz = generateQuiz(chapter);

  }

  quizIndex=0;
  quizScore=0;

  document.getElementById("lesson").style.display="none";
  document.getElementById("quizBox").style.display="block";

  showQuiz();

}


/* =====================================================
   GENERATED QUIZ
===================================================== */

function generateQuiz(chapter){

  const arr=[];

  for(let i=0;i<5;i++){

    const a =
      selectedClass * 3 + i + 2;

    const b =
      i + 2;

    const answer =
      a + b;

    arr.push([
      `${a} + ${b} = ?`,
      [
        String(answer-2),
        String(answer-1),
        String(answer),
        String(answer+2)
      ],
      String(answer)
    ]);

  }

  return arr;

}


/* =====================================================
   SHOW QUIZ
===================================================== */

function showQuiz(){

  const q = currentQuiz[quizIndex];

  document.getElementById("quizNumber").textContent =
    `Question ${quizIndex+1} / ${currentQuiz.length}`;

  document.getElementById("quizQuestion").textContent =
    q[0];

  document.getElementById("quizResult").textContent="";

  document.getElementById("nextBtn").classList.add("hide");

  const options =
    document.getElementById("quizOptions");

  options.innerHTML="";

  q[1].forEach(option=>{

    const btn =
      document.createElement("button");

    btn.className="option";
    btn.textContent=option;

    btn.onclick=()=>checkAnswer(btn,option,q[2]);

    options.appendChild(btn);

  });

}


/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer(btn,selected,correct){

  const buttons =
    document.querySelectorAll(".option");

  buttons.forEach(b=>b.disabled=true);

  if(selected===correct){

    btn.classList.add("correct");

    document.getElementById("quizResult").textContent =
      "✅ बरोबर! छान विचार केला.";

    quizScore++;

    addXP(10);

  }else{

    btn.classList.add("wrong");

    document.getElementById("quizResult").textContent =
      `❌ चुकीचे. योग्य उत्तर: ${correct}`;

  }

  document
    .getElementById("nextBtn")
    .classList.remove("hide");

}


/* =====================================================
   NEXT
===================================================== */

function nextQuestion(){

  quizIndex++;

  if(quizIndex >= currentQuiz.length){

    finishQuiz();
    return;

  }

  showQuiz();

}


/* =====================================================
   FINISH
===================================================== */

function finishQuiz(){

  const key =
    getChapterKey(selectedClass,selectedChapter);

  localStorage.setItem(key,"done");

  document.getElementById("quizBox").innerHTML = `

    <div style="text-align:center">

      <div style="font-size:55px">🏆</div>

      <h2>Quiz Complete!</h2>

      <p style="margin-top:10px">
        तुमचा Score:
        <b>${quizScore}/${currentQuiz.length}</b>
      </p>

      <p style="margin-top:10px">
        ⭐ XP मिळाले!
      </p>

      <button
        class="start-btn"
        onclick="openClass(${selectedClass})">

        📚 Chapters कडे जा

      </button>

    </div>

  `;

  updateOverall();

}


/* =====================================================
   PROGRESS
===================================================== */

function getChapterKey(cls,index){

  return `gyansetu_math_${cls}_${index}`;

}


function updateOverall(){

  let total=0;
  let done=0;

  for(let cls=1;cls<=10;cls++){

    total += data[cls].length;

    data[cls].forEach((_,index)=>{

      if(
        localStorage.getItem(
          getChapterKey(cls,index)
        )==="done"
      ){

        done++;

      }

    });

  }

  const percent =
    total===0 ? 0 : Math.round((done/total)*100);

  document.getElementById("overallPercent").textContent =
    percent+"%";

  document.getElementById("overallBar").style.width =
    percent+"%";

}


/* =====================================================
   XP
===================================================== */

function addXP(amount){

  let xp =
    Number(localStorage.getItem(xpKey) || 0);

  xp += amount;

  localStorage.setItem(xpKey,xp);

  updateXP();

}


function updateXP(){

  document.getElementById("xp").textContent =
    Number(localStorage.getItem(xpKey) || 0);

}


/* =====================================================
   BACK
===================================================== */

function goBack(){

  const lesson =
    document.getElementById("lesson").style.display;

  const chapters =
    document.getElementById("chapterList").style.display;

  const quiz =
    document.getElementById("quizBox").style.display;

  if(quiz==="block"){

    openChapter(selectedChapter);
    return;

  }

  if(lesson==="block"){

    openClass(selectedClass);
    return;

  }

  if(chapters==="block"){

    document.getElementById("chapterList").style.display="none";
    document.getElementById("home").style.display="block";
    return;

  }

  window.location.href="offline-study.html";

}


/* =====================================================
   START
===================================================== */

init();

</script>
