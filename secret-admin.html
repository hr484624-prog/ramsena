<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>GyanSetu Secret Admin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at top left,#ff1493 0%,transparent 30%),
    radial-gradient(circle at bottom right,#2979ff 0%,transparent 35%),
    #05070d;
  color:white;
}

.container{
  width:100%;
  max-width:850px;
  margin:auto;
  padding:20px;
}

.card{
  background:rgba(15,20,32,.95);
  border:1px solid rgba(255,255,255,.12);
  border-radius:22px;
  padding:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}

h1{
  margin:0 0 5px;
  font-size:27px;
}

.sub{
  color:#aeb7c8;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #39445a;
  background:#0a0f19;
  color:white;
  font-size:16px;
  outline:none;
  margin-bottom:12px;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,#ff1493,#2979ff);
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
}

#dashboard{
  display:none;
}

.message{
  margin-top:12px;
  padding:12px;
  border-radius:10px;
  display:none;
}

.search{
  margin-top:20px;
}

.user{
  margin-top:12px;
  padding:15px;
  border:1px solid #293348;
  border-radius:14px;
  background:#0b111d;
  cursor:pointer;
}

.user:hover{
  border-color:#2979ff;
}

.username{
  font-weight:bold;
  font-size:17px;
}

.userid{
  color:#7f8ba0;
  font-size:11px;
  margin-top:5px;
}

.editor{
  display:none;
  margin-top:20px;
  padding:18px;
  border-radius:16px;
  background:#080d16;
  border:1px solid #303b52;
}

.back{
  margin-top:10px;
  background:#202938;
}

.logout{
  margin-top:20px;
  background:#35151f;
}

.empty{
  text-align:center;
  padding:25px;
  color:#8994a8;
}
</style>
</head>

<body>

<div class="container">

  <!-- SECRET LOCK -->

  <div class="card" id="lock">

    <h1>🔐 GyanSetu Secret</h1>

    <div class="sub">
      Private Administrator Area
    </div>

    <input
      id="secretCode"
      type="password"
      placeholder="Secret Code"
      autocomplete="off"
    >

    <button onclick="unlockAdmin()">
      🔓 Unlock
    </button>

    <div class="message" id="lockMessage"></div>

  </div>


  <!-- DASHBOARD -->

  <div class="card" id="dashboard">

    <h1>🛡️ GyanSetu Admin</h1>

    <div class="sub">
      Registered Users
    </div>

    <input
      class="search"
      id="search"
      placeholder="🔎 Username search..."
      oninput="filterUsers()"
    >

    <div id="users">
      Loading users...
    </div>

    <!-- EDITOR -->

    <div class="editor" id="editor">

      <h2 id="editTitle">
        Edit Profile
      </h2>

      <input
        id="editUsername"
        placeholder="Username"
        maxlength="128"
      >

      <input
        id="editUserId"
        readonly
      >

      <button onclick="saveProfile()">
        💾 Save Profile
      </button>

      <button
        class="back"
        onclick="closeEditor()"
      >
        ← Back
      </button>

      <div
        class="message"
        id="editMessage"
      ></div>

    </div>

    <button
      class="logout"
      onclick="logoutAdmin()"
    >
      🔒 Lock Admin Panel
    </button>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   SUPABASE
========================= */

const supabaseClient =
  supabase.createClient(

    "https://eqglttfffhvoyvrclzse.supabase.co",

    "sb_publishable_rR4xxl0dW5DJrhhjqiFHLw_uJ-HakAb",

    {
      auth:{
        persistSession:true,
        autoRefreshToken:true
      }
    }

  );


let allUsers = [];
let selectedUserId = null;


/* =========================
   MESSAGE
========================= */

function message(id,text,ok){

  const el =
    document.getElementById(id);

  el.innerText = text;

  el.style.display = "block";

  el.style.background =
    ok ? "#12351f" : "#401923";

  el.style.color =
    ok ? "#72e39a" : "#ff8d9d";

}


/* =========================
   UNLOCK
========================= */

async function unlockAdmin(){

  const code =
    document
      .getElementById("secretCode")
      .value;

  if(!code){

    message(
      "lockMessage",
      "Secret code टाका.",
      false
    );

    return;
  }

  try{

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "verify_gyansetu_admin",
        {
          p_code:code
        }
      );

    if(error) throw error;

    if(data !== true){

      message(
        "lockMessage",
        "❌ Secret code चुकीचा आहे.",
        false
      );

      return;
    }

    document.getElementById("lock")
      .style.display="none";

    document.getElementById("dashboard")
      .style.display="block";

    await loadUsers();

  }
  catch(error){

    console.error(error);

    message(
      "lockMessage",
      "Admin verification failed.",
      false
    );

  }

}


/* =========================
   LOAD USERS
========================= */

async function loadUsers(){

  const box =
    document.getElementById("users");

  box.innerHTML =
    "⏳ Users loading...";

  try{

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "get_gyansetu_users"
      );

    if(error) throw error;

    allUsers =
      data || [];

    renderUsers(allUsers);

  }
  catch(error){

    console.error(error);

    box.innerHTML =
      '<div class="empty">Users load करता आले नाहीत.</div>';

  }

}


/* =========================
   RENDER USERS
========================= */

function renderUsers(users){

  const box =
    document.getElementById("users");

  if(!users.length){

    box.innerHTML =
      '<div class="empty">कोणतेही users सापडले नाहीत.</div>';

    return;
  }

  box.innerHTML =
    users.map(function(user){

      return `
        <div
          class="user"
          onclick="openEditor(
            '${escapeJS(user.id)}',
            '${escapeJS(user.username || "")}'
          )"
        >

          <div class="username">
            👤 ${escapeHTML(user.username || "No username")}
          </div>

          <div class="userid">
            ${escapeHTML(user.id)}
          </div>

        </div>
      `;

    }).join("");

}


/* =========================
   SEARCH
========================= */

function filterUsers(){

  const q =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const filtered =
    allUsers.filter(function(user){

      return (
        (user.username || "")
          .toLowerCase()
          .includes(q)
      );

    });

  renderUsers(filtered);

}


/* =========================
   EDIT
========================= */

function openEditor(id,username){

  selectedUserId = id;

  document.getElementById(
    "editUsername"
  ).value = username;

  document.getElementById(
    "editUserId"
  ).value = id;

  document.getElementById(
    "editor"
  ).style.display="block";

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });

}


function closeEditor(){

  selectedUserId = null;

  document.getElementById(
    "editor"
  ).style.display="none";

}


/* =========================
   SAVE PROFILE
========================= */

async function saveProfile(){

  if(!selectedUserId) return;

  const username =
    document
      .getElementById("editUsername")
      .value
      .trim();

  if(username.length < 2){

    message(
      "editMessage",
      "Username योग्य नाही.",
      false
    );

    return;
  }

  try{

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "update_gyansetu_profile",
        {
          p_user_id:selectedUserId,
          p_username:username
        }
      );

    if(error) throw error;

    if(data !== true){

      throw new Error(
        "Update denied"
      );

    }

    message(
      "editMessage",
      "✅ Profile updated.",
      true
    );

    await loadUsers();

  }
  catch(error){

    console.error(error);

    message(
      "editMessage",
      "❌ Profile update failed.",
      false
    );

  }

}


/* =========================
   LOCK
========================= */

async function logoutAdmin(){

  selectedUserId=null;
  allUsers=[];

  document.getElementById(
    "dashboard"
  ).style.display="none";

  document.getElementById(
    "lock"
  ).style.display="block";

  document.getElementById(
    "secretCode"
  ).value="";

}


/* =========================
   HELPERS
========================= */

function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent =
    text || "";

  return div.innerHTML;

}


function escapeJS(text){

  return String(text || "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/\r/g,"\\r")
    .replace(/\n/g,"\\n");

}

</script>

</body>
</html>
