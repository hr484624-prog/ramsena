<!DOCTYPE html>
<html lang="mr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>GyanSetu Secret Admin</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{

  min-height:100vh;

  font-family:
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at top left,
      #ff1493 0%,
      transparent 30%
    ),
    radial-gradient(
      circle at bottom right,
      #2979ff 0%,
      transparent 35%
    ),
    #05070d;

  color:white;

}

.container{

  width:100%;
  max-width:850px;

  margin:auto;

  padding:
    20px;

}

.card{

  background:
    rgba(15,20,32,.96);

  border:
    1px solid
    rgba(255,255,255,.12);

  border-radius:
    22px;

  padding:
    22px;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.45);

}

h1{

  margin:
    0 0 6px;

  font-size:
    27px;

}

h2{

  margin-bottom:
    15px;

}

.sub{

  color:
    #aeb7c8;

  margin-bottom:
    20px;

  line-height:
    1.5;

}

input{

  width:100%;

  padding:
    14px;

  border-radius:
    12px;

  border:
    1px solid
    #39445a;

  background:
    #0a0f19;

  color:white;

  font-size:
    16px;

  outline:none;

  margin-bottom:
    12px;

}

input:focus{

  border-color:
    #2979ff;

  box-shadow:
    0 0 0 2px
    rgba(41,121,255,.12);

}

button{

  width:100%;

  padding:
    14px;

  border:0;

  border-radius:
    12px;

  background:
    linear-gradient(
      135deg,
      #ff1493,
      #2979ff
    );

  color:white;

  font-size:
    16px;

  font-weight:bold;

  cursor:pointer;

  transition:
    .2s;

}

button:active{

  transform:
    scale(.98);

}

button:disabled{

  opacity:
    .5;

  cursor:
    not-allowed;

}

#dashboard{

  display:none;

}

.message{

  margin-top:
    12px;

  padding:
    12px;

  border-radius:
    10px;

  display:none;

  line-height:
    1.5;

  font-size:
    14px;

}

.search{

  margin-top:
    20px;

}

.user{

  margin-top:
    12px;

  padding:
    15px;

  border:
    1px solid
    #293348;

  border-radius:
    14px;

  background:
    #0b111d;

  cursor:pointer;

  transition:
    .2s;

}

.user:hover{

  border-color:
    #2979ff;

  transform:
    translateY(-1px);

}

.username{

  font-weight:bold;

  font-size:
    17px;

  word-break:
    break-word;

}

.userid{

  color:
    #7f8ba0;

  font-size:
    11px;

  margin-top:
    5px;

  word-break:
    break-all;

}

.editor{

  display:none;

  margin-top:
    20px;

  padding:
    18px;

  border-radius:
    16px;

  background:
    #080d16;

  border:
    1px solid
    #303b52;

}

.back{

  margin-top:
    10px;

  background:
    #202938;

}

.logout{

  margin-top:
    20px;

  background:
    #35151f;

}

.empty{

  text-align:center;

  padding:
    25px;

  color:
    #8994a8;

}

.topbar{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  margin-bottom:
    15px;

}

.status{

  display:inline-flex;

  align-items:center;

  gap:7px;

  padding:
    7px 10px;

  border-radius:
    999px;

  background:
    rgba(44,214,120,.1);

  color:
    #72e39a;

  font-size:
    12px;

}

.dot{

  width:7px;
  height:7px;

  border-radius:50%;

  background:
    #42e88a;

}

.count{

  color:
    #8994a8;

  font-size:
    13px;

  margin:
    8px 0 4px;

}

</style>

</head>


<body>


<div class="container">


  <!-- =========================
       LOCK SCREEN
  ========================== -->

  <div
    class="card"
    id="lock"
  >

    <h1>
      🔐 GyanSetu Secret
    </h1>

    <div class="sub">
      Private Administrator Area
    </div>


    <input
      id="secretCode"
      type="password"
      placeholder="Secret Code"
      autocomplete="off"
    >


    <button
      id="unlockButton"
      onclick="unlockAdmin()"
    >
      🔓 Unlock
    </button>


    <div
      class="message"
      id="lockMessage"
    ></div>

  </div>



  <!-- =========================
       DASHBOARD
  ========================== -->

  <div
    class="card"
    id="dashboard"
  >

    <div class="topbar">

      <div>

        <h1>
          🛡️ GyanSetu Admin
        </h1>

        <div class="sub">
          Registered Users
        </div>

      </div>


      <div class="status">

        <span class="dot"></span>

        Admin

      </div>

    </div>


    <div
      class="count"
      id="userCount"
    >
      Users: 0
    </div>


    <!-- SEARCH -->

    <input
      class="search"
      id="search"
      placeholder="🔎 Username search..."
      oninput="filterUsers()"
    >


    <!-- USERS -->

    <div id="users">

      ⏳ Users loading...

    </div>



    <!-- =========================
         EDITOR
    ========================== -->

    <div
      class="editor"
      id="editor"
    >

      <h2 id="editTitle">
        Edit Profile
      </h2>


      <input
        id="editUsername"
        placeholder="Username"
        maxlength="128"
      >


      <input
        id="editUserId"
        readonly
      >


      <button
        id="saveButton"
        onclick="saveProfile()"
      >
        💾 Save Profile
      </button>


      <button
        class="back"
        onclick="closeEditor()"
      >
        ← Back
      </button>


      <div
        class="message"
        id="editMessage"
      ></div>

    </div>



    <!-- LOCK -->

    <button
      class="logout"
      onclick="logoutAdmin()"
    >
      🔒 Lock Admin Panel
    </button>


  </div>


</div>



<!-- =========================
     SUPABASE
========================== -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>



<script>

/* ==================================================
   SUPABASE CONFIG
================================================== */

const SUPABASE_URL =
  "https://eqglttfffhvoyvrclzse.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_rR4xxl0dW5DJrhhjqiFHLw_uJ-HakAb";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );



/* ==================================================
   VARIABLES
================================================== */

let allUsers = [];

let selectedUserId = null;

let adminVerified = false;



/* ==================================================
   MESSAGE
================================================== */

function message(
  id,
  text,
  ok
){

  const el =
    document.getElementById(id);

  if(!el) return;

  el.innerText =
    text;

  el.style.display =
    "block";

  el.style.background =
    ok
      ? "#12351f"
      : "#401923";

  el.style.color =
    ok
      ? "#72e39a"
      : "#ff8d9d";

}



/* ==================================================
   GET CURRENT SESSION
================================================== */

async function getCurrentSession(){

  const {
    data,
    error
  } =
    await supabaseClient.auth.getSession();


  if(error){

    throw error;

  }


  return data.session;

}



/* ==================================================
   UNLOCK ADMIN
================================================== */

async function unlockAdmin(){

  const button =
    document.getElementById(
      "unlockButton"
    );


  const code =
    document
      .getElementById(
        "secretCode"
      )
      .value
      .trim();


  if(!code){

    message(
      "lockMessage",
      "Secret code टाका.",
      false
    );

    return;

  }


  button.disabled =
    true;

  button.innerText =
    "⏳ Verifying...";


  try{


    /* --------------------------------
       1. Check LOGIN SESSION
    -------------------------------- */

    const session =
      await getCurrentSession();


    if(!session){

      message(
        "lockMessage",
        "⚠️ आधी तुमच्या GyanSetu account मध्ये login करा.",
        false
      );

      button.disabled =
        false;

      button.innerText =
        "🔓 Unlock";

      return;

    }



    /* --------------------------------
       2. Verify ADMIN + SECRET
    -------------------------------- */

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "verify_gyansetu_admin",
        {
          p_code:
            code
        }
      );


    if(error){

      console.error(
        "RPC ERROR:",
        error
      );

      throw error;

    }



    /* --------------------------------
       3. Check result
    -------------------------------- */

    if(data !== true){

      message(
        "lockMessage",
        "❌ Secret code चुकीचा आहे किंवा हा account admin नाही.",
        false
      );

      button.disabled =
        false;

      button.innerText =
        "🔓 Unlock";

      return;

    }



    /* --------------------------------
       4. SUCCESS
    -------------------------------- */

    adminVerified =
      true;


    document
      .getElementById(
        "lock"
      )
      .style.display =
        "none";


    document
      .getElementById(
        "dashboard"
      )
      .style.display =
        "block";


    await loadUsers();


  }
  catch(error){

    console.error(
      "ADMIN VERIFICATION ERROR:",
      error
    );


    message(
      "lockMessage",
      "❌ Admin verification failed. Supabase RPC तपासा.",
      false
    );


  }
  finally{

    button.disabled =
      false;

    button.innerText =
      "🔓 Unlock";

  }

}



/* ==================================================
   LOAD USERS
================================================== */

async function loadUsers(){

  const box =
    document.getElementById(
      "users"
    );


  box.innerHTML =
    "⏳ Users loading...";


  try{


    if(!adminVerified){

      throw new Error(
        "Admin not verified"
      );

    }


    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "get_gyansetu_users"
      );


    if(error){

      throw error;

    }


    allUsers =
      Array.isArray(data)
        ? data
        : [];


    document
      .getElementById(
        "userCount"
      )
      .innerText =
        "Users: " +
        allUsers.length;


    renderUsers(
      allUsers
    );


  }
  catch(error){

    console.error(
      "LOAD USERS ERROR:",
      error
    );


    box.innerHTML =

      '<div class="empty">' +

      '❌ Users load करता आले नाहीत.<br><br>' +

      'Admin permission किंवा RPC तपासा.' +

      '</div>';

  }

}



/* ==================================================
   RENDER USERS
================================================== */

function renderUsers(
  users
){

  const box =
    document.getElementById(
      "users"
    );


  if(!users.length){

    box.innerHTML =
      '<div class="empty">' +
      'कोणतेही users सापडले नाहीत.' +
      '</div>';

    return;

  }


  box.innerHTML =
    users
      .map(
        function(user){

          const id =
            escapeJS(
              user.id
            );

          const username =
            escapeJS(
              user.username || ""
            );


          return `

            <div
              class="user"
              onclick="openEditor(
                '${id}',
                '${username}'
              )"
            >

              <div class="username">

                👤
                ${escapeHTML(
                  user.username ||
                  "No username"
                )}

              </div>


              <div class="userid">

                ${escapeHTML(
                  user.id
                )}

              </div>

            </div>

          `;

        }
      )
      .join("");

}



/* ==================================================
   SEARCH
================================================== */

function filterUsers(){

  const q =
    document
      .getElementById(
        "search"
      )
      .value
      .toLowerCase()
      .trim();


  const filtered =
    allUsers.filter(
      function(user){

        return (
          user.username ||
          ""
        )
        .toLowerCase()
        .includes(q);

      }
    );


  renderUsers(
    filtered
  );

}



/* ==================================================
   OPEN EDITOR
================================================== */

function openEditor(
  id,
  username
){

  selectedUserId =
    id;


  document
    .getElementById(
      "editUsername"
    )
    .value =
      username;


  document
    .getElementById(
      "editUserId"
    )
    .value =
      id;


  document
    .getElementById(
      "editMessage"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "editor"
    )
    .style.display =
      "block";


  window.scrollTo({
    top:
      document.body.scrollHeight,
    behavior:
      "smooth"
  });

}



/* ==================================================
   CLOSE EDITOR
================================================== */

function closeEditor(){

  selectedUserId =
    null;


  document
    .getElementById(
      "editor"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "editUsername"
    )
    .value =
      "";


  document
    .getElementById(
      "editUserId"
    )
    .value =
      "";

}



/* ==================================================
   SAVE PROFILE
================================================== */

async function saveProfile(){

  if(!adminVerified){

    message(
      "editMessage",
      "❌ Admin verification आवश्यक आहे.",
      false
    );

    return;

  }


  if(!selectedUserId){

    return;

  }


  const username =
    document
      .getElementById(
        "editUsername"
      )
      .value
      .trim();


  if(username.length < 2){

    message(
      "editMessage",
      "Username किमान 2 characters असावा.",
      false
    );

    return;

  }


  const button =
    document.getElementById(
      "saveButton"
    );


  button.disabled =
    true;

  button.innerText =
    "⏳ Saving...";


  try{


    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "update_gyansetu_profile",
        {
          p_user_id:
            selectedUserId,

          p_username:
            username
        }
      );


    if(error){

      throw error;

    }


    if(data !== true){

      throw new Error(
        "Update denied"
      );

    }


    message(
      "editMessage",
      "✅ Profile updated successfully.",
      true
    );


    await loadUsers();


  }
  catch(error){

    console.error(
      "UPDATE ERROR:",
      error
    );


    message(
      "editMessage",
      "❌ Profile update failed.",
      false
    );

  }
  finally{

    button.disabled =
      false;

    button.innerText =
      "💾 Save Profile";

  }

}



/* ==================================================
   LOCK ADMIN PANEL
================================================== */

async function logoutAdmin(){

  selectedUserId =
    null;

  allUsers =
    [];

  adminVerified =
    false;


  document
    .getElementById(
      "dashboard"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "lock"
    )
    .style.display =
      "block";


  document
    .getElementById(
      "secretCode"
    )
    .value =
      "";


  document
    .getElementById(
      "search"
    )
    .value =
      "";


  document
    .getElementById(
      "users"
    )
    .innerHTML =
      "Users loading...";


  closeEditor();


  /*
    येथे Supabase account logout करत नाही.
    त्यामुळे GyanSetu account session कायम राहते.
    फक्त Admin Panel lock होतो.
  */

}



/* ==================================================
   ENTER KEY
================================================== */

document
  .getElementById(
    "secretCode"
  )
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key ===
        "Enter"
      ){

        unlockAdmin();

      }

    }
  );



/* ==================================================
   ESC KEY
================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key ===
      "Escape"
    ){

      closeEditor();

    }

  }
);



/* ==================================================
   HTML ESCAPE
================================================== */

function escapeHTML(
  text
){

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text == null
      ? ""
      : String(text);


  return div.innerHTML;

}



/* ==================================================
   JAVASCRIPT STRING ESCAPE
================================================== */

function escapeJS(
  text
){

  return String(
    text == null
      ? ""
      : text
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  )
  .replace(
    /\r/g,
    "\\r"
  )
  .replace(
    /\n/g,
    "\\n"
  );

}

</script>

</body>
</html>
