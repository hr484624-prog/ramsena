<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basic Maths - GyanSetu</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#eef4ff,#f8fbff);
    color:#172033;
    min-height:100vh;
}

header{
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    color:white;
    padding:22px 18px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

header h1{
    font-size:27px;
    margin-bottom:7px;
}

header p{
    font-size:14px;
    opacity:.95;
}

.container{
    width:94%;
    max-width:1000px;
    margin:25px auto;
}

.intro{
    background:white;
    padding:20px;
    border-radius:18px;
    margin-bottom:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
    text-align:center;
}

.intro h2{
    color:#2563eb;
    margin-bottom:8px;
}

.intro p{
    line-height:1.7;
    color:#555;
}

.levels{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:18px;
}

.level-card{
    background:white;
    border-radius:20px;
    padding:22px;
    box-shadow:0 5px 18px rgba(0,0,0,.09);
    cursor:pointer;
    transition:.25s;
    border:2px solid transparent;
}

.level-card:hover{
    transform:translateY(-4px);
    border-color:#4f46e5;
}

.level-number{
    font-size:13px;
    color:#4f46e5;
    font-weight:bold;
    margin-bottom:7px;
}

.level-card h3{
    font-size:20px;
    margin-bottom:8px;
}

.level-card p{
    color:#666;
    font-size:14px;
    line-height:1.5;
}

.topic-count{
    margin-top:13px;
    display:inline-block;
    background:#eef2ff;
    color:#4338ca;
    padding:7px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:1000;
    padding:15px;
    overflow-y:auto;
}

.modal.show{
    display:flex;
    align-items:center;
    justify-content:center;
}

.modal-box{
    width:100%;
    max-width:850px;
    max-height:92vh;
    overflow-y:auto;
    background:white;
    border-radius:22px;
    box-shadow:0 10px 40px rgba(0,0,0,.3);
    animation:popup .2s ease;
}

@keyframes popup{
    from{
        transform:scale(.9);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.modal-header{
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    color:white;
    padding:20px;
    position:sticky;
    top:0;
    z-index:2;
}

.modal-header h2{
    padding-right:35px;
    font-size:22px;
}

.close{
    position:absolute;
    right:15px;
    top:13px;
    width:35px;
    height:35px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.2);
    color:white;
    font-size:23px;
    cursor:pointer;
}

.modal-body{
    padding:20px;
}

.topic-list{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:12px;
}

.topic-btn{
    border:0;
    background:#f5f7ff;
    border-left:5px solid #4f46e5;
    padding:15px;
    border-radius:12px;
    text-align:left;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
    color:#222;
    transition:.2s;
}

.topic-btn:hover{
    background:#e9edff;
    transform:translateX(3px);
}

.topic-btn span{
    color:#4f46e5;
    margin-right:6px;
}

/* EXPLANATION */

.explanation h2{
    color:#2563eb;
    margin-bottom:15px;
    font-size:23px;
}

.explanation-section{
    background:#f7f9ff;
    padding:16px;
    border-radius:14px;
    margin-bottom:15px;
    line-height:1.75;
}

.explanation-section h3{
    color:#4338ca;
    margin-bottom:8px;
}

.example{
    background:#eefbf3;
    border-left:5px solid #16a34a;
    padding:15px;
    border-radius:10px;
    line-height:1.7;
}

.remember{
    background:#fff8e7;
    border-left:5px solid #f59e0b;
    padding:15px;
    border-radius:10px;
    line-height:1.7;
}

.back-btn{
    border:0;
    background:#4f46e5;
    color:white;
    padding:11px 18px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    margin-bottom:15px;
}

footer{
    text-align:center;
    padding:25px;
    color:#777;
    font-size:13px;
}

@media(max-width:600px){
    header h1{
        font-size:23px;
    }

    .modal{
        padding:8px;
    }

    .modal-box{
        max-height:95vh;
        border-radius:17px;
    }

    .modal-body{
        padding:15px;
    }

    .topic-list{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>📚 Basic Maths</h1>
    <p>सोप्या गणितापासून अवघड गणितापर्यंत शिकूया!</p>
</header>

<div class="container">

    <div class="intro">
        <h2>🧮 गणिताचा मजबूत पाया</h2>
        <p>
            गणित अगदी सुरुवातीपासून शिका आणि हळूहळू
            अवघड संकल्पनांकडे जा. कोणताही Topic निवडा
            आणि त्याचे सविस्तर Explanation Popup मध्ये वाचा.
        </p>
    </div>

    <div class="levels" id="levels"></div>

</div>

<footer>
    © GyanSetu • Basic Mathematics
</footer>


<!-- LEVEL POPUP -->

<div class="modal" id="levelModal">
    <div class="modal-box">

        <div class="modal-header">
            <button class="close" onclick="closeModal('levelModal')">×</button>
            <h2 id="levelTitle"></h2>
        </div>

        <div class="modal-body">
            <div class="topic-list" id="topicList"></div>
        </div>

    </div>
</div>


<!-- TOPIC EXPLANATION POPUP -->

<div class="modal" id="topicModal">
    <div class="modal-box">

        <div class="modal-header">
            <button class="close" onclick="closeModal('topicModal')">×</button>
            <h2 id="topicTitle"></h2>
        </div>

        <div class="modal-body">

            <button class="back-btn" onclick="backToTopics()">
                ← मागे जा
            </button>

            <div class="explanation">

                <div class="explanation-section">
                    <h3>📖 सोप्या भाषेत समजून घ्या</h3>
                    <p id="topicExplanation"></p>
                </div>

                <div class="example">
                    <h3>✏️ उदाहरण</h3>
                    <p id="topicExample"></p>
                </div>

                <div class="remember">
                    <h3>💡 लक्षात ठेवा</h3>
                    <p id="topicRemember"></p>
                </div>

            </div>

        </div>
    </div>
</div>


<script>

/* =========================
   BASIC MATHS DATA

const levels = [

{
    id:1,

    description:"गणिताची सुरुवात आणि संख्यांची ओळख.",
    topics:[
        ["संख्या ओळख","संख्या म्हणजे वस्तू किंवा गोष्टी किती आहेत हे सांगणारे चिन्ह. 1, 2, 3, 4 अशा संख्यांपासून गणिताची सुरुवात होते. संख्या ओळखताना तिचा आकार, नाव आणि मूल्य समजून घेणे महत्त्वाचे आहे. उदाहरणार्थ 5 ही संख्या म्हणजे पाच वस्तू. आपण मोजताना प्रत्येक वस्तूला एक संख्या देतो. त्यामुळे संख्या आणि मोजणी यांचा जवळचा संबंध आहे. पुढे बेरीज, वजाबाकी, गुणाकार आणि भागाकार शिकण्यासाठी संख्यांची ओळख मजबूत असणे गरजेचे आहे.","🍎🍎🍎 = 3 सफरचंद. त्यामुळे येथे संख्या 3 आहे.","संख्या फक्त चिन्ह नाही; ती किती वस्तू आहेत हे दाखवते."],
        
        ["1 ते 100 संख्या","1 पासून 100 पर्यंतच्या संख्या क्रमाने शिकणे म्हणजे संख्यांचा पाया मजबूत करणे. प्रत्येक संख्येनंतर पुढची संख्या येते आणि प्रत्येक संख्येच्या आधी एक संख्या असते. 1 ते 9 या एक अंकी संख्या आहेत. 10 पासून दोन अंकी संख्या सुरू होतात. 100 ही तीन अंकी संख्या आहे. या संख्यांचा क्रम समजल्यामुळे पुढे मोठ्या संख्यांवर काम करणे सोपे जाते. संख्या मोठी होत गेली की तिच्या स्थानिक किंमतीत बदल होतो. त्यामुळे 1 ते 100 हा क्रम चांगला सराव करणे महत्त्वाचे आहे.","10 नंतर 11, 12, 13, 14... अशा प्रकारे संख्या पुढे जातात.","संख्या क्रमाने मोजण्याचा रोज थोडा सराव करा."],

        ["संख्या वाचणे व लिहिणे","गणितात संख्या पाहून तिचे नाव सांगणे आणि नाव ऐकून ती संख्या लिहिणे महत्त्वाचे आहे. उदाहरणार्थ 25 ही संख्या 'पंचवीस' अशी वाचली जाते. संख्या लिहिताना अंक योग्य क्रमाने लिहावे लागतात. दोन अंकी संख्येत दहाच्या आणि एककाच्या जागेचा अर्थ वेगळा असतो. त्यामुळे संख्या वाचताना प्रत्येक अंकाची जागा समजून घेणे आवश्यक आहे. संख्या चुकीच्या क्रमाने लिहिल्यास तिचे मूल्य बदलू शकते. म्हणून वाचन आणि लेखन दोन्हीचा सराव करावा.","47 = सत्तेचाळीस.","अंकांचा क्रम बदलला तर संख्येचे मूल्य बदलते."],

        ["मोठी–लहान संख्या","दोन संख्यांपैकी कोणती संख्या मोठी आणि कोणती लहान हे तुलना करून ठरवता येते. आधी अंकांची संख्या पाहता येते. समान अंक असतील तर डावीकडील अंकापासून तुलना करायची. > हे चिन्ह मोठी संख्या दाखवते, < हे चिन्ह लहान संख्या दाखवते आणि = समानता दाखवते. ही तुलना पुढे क्रम, बेरीज, वजाबाकी आणि शब्दप्रश्नांमध्ये उपयोगी पडते.","25 > 18 म्हणजे 25 ही 18 पेक्षा मोठी आहे.","पहिल्या अंकापासून तुलना सुरू करा."],

        ["आधीची व नंतरची संख्या","एखाद्या संख्येच्या अगोदर कोणती आणि नंतर कोणती संख्या येते याला आधीची आणि नंतरची संख्या म्हणतात. एखाद्या संख्येच्या आधी साधारणपणे 1 ने कमी संख्या असते आणि नंतर 1 ने जास्त संख्या असते. ही संकल्पना संख्या रेषा समजण्यासाठी खूप उपयोगी आहे. मोजणी करताना आपण याच क्रमाचा वापर करतो. पुढे वजाबाकी आणि बेरीज समजतानाही याचा उपयोग होतो.","20 च्या आधी 19 आणि नंतर 21.","दिलेल्या संख्येत 1 कमी म्हणजे आधीची, 1 जास्त म्हणजे नंतरची."],

        ["चढता–उतरता क्रम","संख्या लहानपासून मोठ्याकडे लावल्या तर चढता क्रम तयार होतो. मोठ्यापासून लहानाकडे लावल्या तर उतरता क्रम तयार होतो. संख्या तुलना करण्यासाठी हा क्रम उपयोगी आहे. संख्या व्यवस्थित लावल्याने कोणती संख्या कुठे आहे हे लगेच समजते. हा प्रकार पुढे डेटा आणि आकृतिबंधामध्येही उपयोगी पडतो. संख्या लावताना प्रत्येक संख्येची योग्य तुलना करणे गरजेचे आहे.","3, 7, 12, 18 हा चढता क्रम आहे.","चढता = लहान ते मोठे; उतरता = मोठे ते लहान."],

        ["एकक, दशक, शतक","संख्येतील प्रत्येक अंकाची जागा त्याचे मूल्य ठरवते. उजवीकडून पहिली जागा एकक, दुसरी दशक आणि तिसरी शतक असते. उदाहरणार्थ 345 मध्ये 5 एकक, 4 दशक आणि 3 शतक दाखवतो. त्यामुळे अंक तोच असला तरी त्याची जागा बदलल्यास मूल्य बदलते. ही संकल्पना मोठ्या संख्यांसाठी अत्यंत महत्त्वाची आहे.","345 = 3 शतके + 4 दशके + 5 एकके.","अंकाची जागा बदलली की त्याची स्थानिक किंमत बदलते."],

        ["स्थानिक किंमत","संख्येतील एखाद्या अंकाचे त्याच्या जागेनुसार असलेले मूल्य म्हणजे स्थानिक किंमत. उदाहरणार्थ 572 मध्ये 7 हा दशकाच्या जागेवर आहे, म्हणून त्याची स्थानिक किंमत 70 आहे. एकक, दशक, शतक अशा जागा उजवीकडून मोजल्या जातात. मोठ्या संख्यांमध्ये हजार, दहा हजार, लाख अशा जागाही येतात. स्थानिक किंमत समजली तर विस्तारित रूप आणि संख्या तयार करणे सोपे जाते.","572 मध्ये 5 ची किंमत 500, 7 ची 70 आणि 2 ची 2.","अंकाचे मूल्य ठरवताना त्याची जागा नेहमी पाहा."]
    ]
},

{
    id:2,
    title:"Level 2 — मूलभूत क्रिया",
    description:"बेरीज, वजाबाकी, गुणाकार आणि भागाकाराचा पाया.",
    topics:[
        ["सोपी बेरीज","बेरीज म्हणजे दोन किंवा अधिक संख्यांना एकत्र करून एकूण संख्या शोधणे. बेरीज करताना वस्तू एकत्र करण्याची कल्पना वापरता येते. 3 वस्तू आणि 2 वस्तू एकत्र केल्या तर 5 वस्तू होतात. बेरीजचे चिन्ह + आहे. संख्या मोठ्या झाल्यावर एकक, दशक, शतक यांच्या जागा सरळ ठेवणे महत्त्वाचे असते. बेरीज ही पुढील गणितातील सर्वात महत्त्वाची मूलभूत क्रिया आहे.","4 + 3 = 7.","बेरीज म्हणजे एकत्र करणे किंवा वाढवणे."],

        ["हातच्याची बेरीज","एका स्थानावर बेरीज केल्यावर 10 किंवा त्यापेक्षा जास्त उत्तर आले तर पुढील स्थानावर 1 नेणे म्हणजे हातचा. उदाहरणार्थ एककांची बेरीज 8 + 7 = 15 झाली तर 5 एकक लिहून 1 दशक पुढे नेतो. ही प्रक्रिया व्यवस्थित केल्यास मोठ्या संख्यांची बेरीज सहज करता येते. प्रत्येक स्थानाची बेरीज योग्य रितीने करणे गरजेचे आहे.","28 + 17 = 45.","10 एकक झाले की 1 दशक तयार होते."],

        ["सोपी वजाबाकी","वजाबाकी म्हणजे एखाद्या संख्येतून काही संख्या कमी करून उरलेली संख्या शोधणे. वजाबाकीचे चिन्ह − आहे. उदाहरणार्थ 9 वस्तूंमधून 3 वस्तू काढल्या तर 6 उरतात. वजाबाकी करताना 'किती कमी झाले?' किंवा 'किती उरले?' असे प्रश्न विचारता येतात. बेरीज आणि वजाबाकी या एकमेकांशी संबंधित क्रिया आहेत.","9 − 3 = 6.","वजाबाकी म्हणजे कमी करणे किंवा उरलेले शोधणे."],

        ["उसनवारीची वजाबाकी","वजाबाकी करताना वरच्या संख्येतील एकक कमी पडले तर दशकातून एक दशक घेऊन 10 एकक करतो. याला उसनवारी किंवा regrouping म्हणतात. उदाहरणार्थ 42 − 18 मध्ये 2 मधून 8 वजा करता येत नाही, म्हणून 4 दशकांमधून 1 दशक घेतो. त्यामुळे 2 एककांचे 12 एकक होतात. मग 12 − 8 = 4 आणि उरलेल्या दशकामधून वजाबाकी केली जाते.","42 − 18 = 24.","दशकातून घेतलेले 1 दशक म्हणजे 10 एकक."],

        ["बेरीज-वजाबाकीचे शब्दप्रश्न","शब्दप्रश्न म्हणजे गणिताची उदाहरणे वाक्यांच्या स्वरूपात दिलेली असतात. त्यात दिलेली माहिती समजून योग्य क्रिया निवडायची असते. काही वस्तू वाढल्या किंवा एकत्र केल्या असतील तर बेरीज लागू शकते. वस्तू कमी झाल्या किंवा उरलेल्या वस्तू विचारल्या असतील तर वजाबाकी लागू शकते. प्रश्न काळजीपूर्वक वाचणे हा सर्वात महत्त्वाचा भाग आहे. उत्तरानंतर ते योग्य आहे का हेही तपासावे.","रामकडे 5 पेन्सिल आहेत. त्याला आणखी 3 मिळाल्या. एकूण = 5 + 3 = 8.","आधी प्रश्न समजा, मग कोणती क्रिया करायची ते ठरवा."],

        ["गुणाकाराची ओळख","गुणाकार म्हणजे समान संख्यांची वारंवार बेरीज करण्याची सोपी पद्धत. उदाहरणार्थ 3 + 3 + 3 + 3 म्हणजे 3 ची चार वेळा बेरीज. हे 4 × 3 असे लिहिता येते. गुणाकाराचे चिन्ह × आहे. वस्तू समान गटांमध्ये असतील तेव्हा गुणाकार खूप उपयोगी पडतो. पुढे पाढे आणि मोठ्या संख्यांचा गुणाकार शिकण्यासाठी ही कल्पना आधार देते.","4 गट × प्रत्येक गटात 3 = 4 × 3 = 12.","गुणाकार म्हणजे समान गटांची जलद बेरीज."],

        ["पाढे — 2 ते 10","पाढे म्हणजे गुणाकाराच्या मूलभूत तथ्यांची क्रमबद्ध यादी. 2 चा पाढा म्हणजे 2 ची वारंवार बेरीज. पाढे पाठ असल्यास गुणाकार आणि भागाकार जलद करता येतात. 2 ते 10 हे पाढे प्राथमिक गणितासाठी अत्यंत महत्त्वाचे आहेत. फक्त पाठांतर न करता त्यामागची गुणाकाराची कल्पना समजून घेणे अधिक चांगले. रोज थोडा सराव केल्यास पाढे सहज लक्षात राहतात.","7 × 6 = 42 हे 7 च्या पाढ्यातील उदाहरण आहे.","पाढे म्हणजे गुणाकाराची जलद गणना करण्याचे साधन."],

        ["मोठ्या संख्यांचा गुणाकार","मोठ्या संख्यांचा गुणाकार करताना स्थानिक किंमत आणि पाढे यांचा उपयोग होतो. एककाने गुणाकार केल्यानंतर दशक किंवा शतकाच्या अंकाने गुणाकार करावा लागतो. प्रत्येक पायरी योग्य जागेवर लिहिणे महत्त्वाचे आहे. दोन अंकी किंवा तीन अंकी संख्यांचा गुणाकार करताना क्रम व्यवस्थित ठेवावा. शेवटी मिळालेली सर्व उत्पादने बेरीज करून अंतिम उत्तर मिळते.","23 × 4 = 92.","गुणाकार करताना प्रत्येक स्थानाची जागा व्यवस्थित सांभाळा."],

        ["सोपा भागाकार","भागाकार म्हणजे वस्तू किंवा संख्या समान गटांमध्ये वाटणे. उदाहरणार्थ 12 वस्तू 3 समान गटांत वाटल्या तर प्रत्येक गटात 4 वस्तू येतात. भागाकाराचे चिन्ह ÷ किंवा / वापरले जाते. गुणाकार आणि भागाकार एकमेकांशी उलट संबंध असलेल्या क्रिया आहेत. भागाकार समजण्यासाठी समान वाटणीची कल्पना खूप उपयोगी आहे.","12 ÷ 3 = 4.","भागाकार म्हणजे समान वाटणी."],

        ["भागाकार","भागाकारात भाज्य, भाजक, भागाकार आणि बाकी अशा संकल्पना येतात. एखादी संख्या दुसऱ्या संख्येने किती वेळा पूर्ण भागते हे शोधले जाते. काही वेळा पूर्ण भाग न गेल्यास बाकी राहते. भागाकार तपासण्यासाठी भाजक × भागाकार + बाकी = भाज्य हे सूत्र वापरता येते. पाढे चांगले येत असतील तर भागाकार अधिक सोपा होतो.","17 ÷ 5 = 3 बाकी 2.","भागाकार करताना बाकी शून्य आहे की नाही हे तपासा."]
    ]
},

        ["दशांश","दशांश संख्या म्हणजे पूर्ण संख्येपेक्षा कमी किंवा भाग दर्शवणारी संख्या लिहिण्याची एक पद्धत. दशांश बिंदूनंतर दहांश, शतांश अशा जागा येतात. पैशांमध्ये दशांशाचा उपयोग दिसतो. उदाहरणार्थ 5.50 म्हणजे 5 रुपये 50 पैसे असा अर्थ लागू शकतो. दशांशांची तुलना करताना दशांशाच्या जागा योग्य प्रकारे समजून घ्याव्यात.","0.5 म्हणजे पाच दहांश.","दशांश बिंदूची जागा बदलल्यास संख्येचे मूल्य बदलते."],

        ["गुणक व गुणित","एखाद्या संख्येला पूर्ण भाग देणारी संख्या तिचा गुणक असते. उदाहरणार्थ 12 चे गुणक 1, 2, 3, 4, 6 आणि 12 आहेत. एखाद्या संख्येचा पाढ्यात मिळणारा परिणाम गुणित म्हणून समजता येतो. गुणक शोधण्यासाठी भाग जाण्याची कल्पना उपयोगी आहे. ही संकल्पना पुढे म.सा.वि. आणि ल.सा.वि. शिकताना महत्त्वाची ठरते.","12 चे गुणक: 1, 2, 3, 4, 6, 12.","गुणक नेहमी दिलेल्या संख्येला पूर्ण भाग देतो."],

        ["सम व विषम संख्या","2 ने पूर्ण भाग जाणारी संख्या सम संख्या असते. 2 ने पूर्ण भाग न जाणारी संख्या विषम संख्या असते. सम संख्यांचा शेवट 0, 2, 4, 6 किंवा 8 यापैकी एका अंकाने होतो. विषम संख्यांचा शेवट 1, 3, 5, 7 किंवा 9 ने होतो. ही ओळख मोठ्या संख्यांसाठीही लागू होते. बेरीज आणि नमुने समजण्यासाठी सम-विषम संकल्पना उपयोगी आहे.","24 सम आहे, 25 विषम आहे.","शेवटचा अंक पाहून सम-विषम ओळखता येते."],

        ["विभाज्यता","एखादी संख्या दुसऱ्या संख्येने बाकी न उरता भागते का हे तपासण्यासाठी विभाज्यतेचे नियम वापरले जातात. उदाहरणार्थ 2 ने भाग जाण्यासाठी शेवटचा अंक सम असावा. 5 ने भाग जाण्यासाठी शेवट 0 किंवा 5 असावा. 10 ने भाग जाण्यासाठी
                 ["विभाज्यता","एखादी संख्या दुसऱ्या संख्येने बाकी न उरता भागते का हे तपासण्यासाठी विभाज्यतेचे नियम वापरले जातात. उदाहरणार्थ 2 ने भाग जाण्यासाठी शेवटचा अंक सम असावा. 5 ने भाग जाण्यासाठी शेवट 0 किंवा 5 असावा. 10 ने भाग जाण्यासाठी शेवट 0 असावा. मोठ्या संख्यांमध्ये हे नियम वेळ वाचवतात. पुढे गुणक आणि म.सा.वि. शिकताना याचा उपयोग होतो.","250 ही 5 आणि 10 दोन्हींनी विभाज्य आहे.","विभाज्यता नियम पाठ करण्यापेक्षा त्यामागचा भागाकार समजून घ्या."],

        ["ल.सा.वि.","दोन किंवा अधिक संख्यांचा समान गुणितांपैकी सर्वात लहान गुणित म्हणजे लघुत्तम साधारण विभाज्य म्हणजे ल.सा.वि. अपूर्णांकांच्या बेरीज-वजाबाकीत समान छेद मिळवण्यासाठी याचा उपयोग होतो. ल.सा.वि. शोधण्यासाठी गुणितांची यादी किंवा अभाज्य घटक पद्धत वापरता येते. संख्यांचे गुणक आणि गुणित चांगले समजले असतील तर ल.सा.वि. सोपा होतो.","4 आणि 6 चा ल.सा.वि. = 12.","ल.सा.वि. हा दिलेल्या संख्यांचा समान आणि सर्वात लहान गुणित असतो."],

        ["म.सा.वि.","दोन किंवा अधिक संख्यांना पूर्ण भाग देणाऱ्या समान गुणकांपैकी सर्वात मोठा गुणक म्हणजे म.सा.वि. समान गट तयार करताना किंवा संख्या सोप्या करताना याचा उपयोग होतो. म.सा.वि. शोधण्यासाठी गुणकांची यादी किंवा अभाज्य घटक पद्धत वापरता येते. ल.सा.वि. आणि म.सा.वि. यांचा फरक लक्षात ठेवणे महत्त्वाचे आहे.","12 आणि 18 चा म.सा.वि. = 6.","म.सा.वि. म्हणजे समान गुणकांमधील सर्वात मोठा गुणक."],

        ["टक्केवारी","टक्केवारी म्हणजे शंभरापैकी किती भाग हे सांगण्याची पद्धत. टक्केवारीचे चिन्ह % आहे. 50% म्हणजे 100 पैकी 50 किंवा अर्धा. 25% म्हणजे 100 पैकी 25. टक्केवारीचा उपयोग गुण, सवलत, आकडेवारी आणि अनेक दैनंदिन व्यवहारात होतो. टक्केवारी समजण्यासाठी अपूर्णांक आणि दशांश यांचा संबंध उपयोगी ठरतो.","25% = 25/100 = 1/4.","टक्केवारीचा अर्थ नेहमी '100 पैकी' असा घ्या."],

        ["सरासरी","काही संख्यांची सरासरी काढण्यासाठी सर्व संख्या बेरीज करून त्या संख्यांची संख्या किती आहे त्याने भाग देतात. सरासरीमुळे अनेक मूल्यांचा एक प्रतिनिधी आकडा मिळतो. परीक्षा गुण, तापमान किंवा खेळातील गुण यासाठी सरासरी वापरली जाते. सरासरी काढताना सर्व मूल्ये योग्य प्रकारे घेतली पाहिजेत. उत्तर तपासण्यासाठी सरासरी ही सर्वात लहान आणि सर्वात मोठ्या मूल्यांच्या आसपास आहे का हेही पाहता येते.","10, 20, 30 ची सरासरी = 60 ÷ 3 = 20.","सरासरी = सर्व संख्यांची बेरीज ÷ संख्यांची संख्या."],

        ["प्रमाण व समानुपात","दोन राशींची तुलना गुणोत्तर किंवा प्रमाणातून केली जाते. उदाहरणार्थ 2 लाल आणि 3 निळे चेंडू असतील तर लाल : निळे = 2 : 3. दोन प्रमाण समान असतील तर समानुपात तयार होतो. ही संकल्पना पाककृती, नकाशे, मोजमाप आणि अनेक गणिती प्रश्नांमध्ये उपयोगी आहे. प्रमाण लिहिताना क्रम महत्त्वाचा असतो.","2 : 3 आणि 4 : 6 ही प्रमाणे समान आहेत.","प्रमाणात कोणत्या राशीची तुलना कोणाशी आहे हे लक्षात ठेवा."]
    ]
},

{
    id:5,
    title:"Level 5 — थोडे अवघड",
    description:"दैनंदिन जीवनातील महत्त्वाचे आणि विचार करायला लावणारे गणित.",
    topics:[
        ["नफा–तोटा","एखादी वस्तू खरेदी करून जास्त किमतीला विकली तर नफा होतो. खरेदी किंमत आणि विक्री किंमत यांची तुलना करून नफा किंवा तोटा शोधता येतो. विक्री किंमत जास्त असल्यास नफा आणि कमी असल्यास तोटा होतो. टक्केवारीतील नफा किंवा तोटा काढण्यासाठीही टक्केवारीचा उपयोग होतो. व्यापारातील गणित समजण्यासाठी ही संकल्पना महत्त्वाची आहे.","खरेदी किंमत ₹100 आणि विक्री किंमत ₹120 असेल तर नफा ₹20.","नफा/तोटा शोधताना खरेदी किंमत आणि विक्री किंमत योग्य ओळखा."],

        ["साधे व्याज","पैसे काही काळासाठी उधार दिले किंवा ठेवले असता मूळ रकमेवर ठराविक दराने मिळणारी अतिरिक्त रक्कम साधे व्याज म्हणून ओळखली जाते. साध्या व्याजासाठी मूळधन, दर आणि कालावधी या तीन गोष्टी आवश्यक असतात. सूत्र आहे: साधे व्याज = (मूळधन × दर × कालावधी) ÷ 100. या गणनेत दर आणि कालावधीची एकके योग्य असणे महत्त्वाचे आहे.","₹1000 वर 10% दराने 1 वर्षाचे साधे व्याज = ₹100.","सूत्र वापरण्यापूर्वी दिलेली माहिती योग्य प्रकारे ओळखा."],

        ["वेग, वेळ आणि अंतर","एखादी वस्तू किंवा व्यक्ती किती जलद प्रवास करते याला वेग म्हणतात. अंतर, वेळ आणि वेग यांचा संबंध असतो. वेग = अंतर ÷ वेळ. अंतर = वेग × वेळ आणि वेळ = अंतर ÷ वेग. या तीन सूत्रांचा उपयोग प्रवासाच्या अनेक प्रश्नांमध्ये होतो. मात्र सर्व राशींची एकके एकमेकांशी जुळणारी असणे आवश्यक आहे.","60 किमी अंतर 2 तासांत पार केले तर वेग = 30 किमी/तास.","सूत्र लक्षात ठेवण्यापेक्षा तिन्ही राशींचा संबंध समजून घ्या."],

        ["बीजगणिताची ओळख","बीजगणितात अज्ञात संख्या दर्शवण्यासाठी अक्षरे वापरली जातात. उदाहरणार्थ x + 5 = 12 मध्ये x ही अज्ञात संख्या आहे. अक्षराला चल म्हणतात. बीजगणितामुळे एकाच प्रकारचे अनेक प्रश्न सामान्य स्वरूपात लिहिता येतात. संख्या आणि अक्षरांवर गणिती क्रिया करता येतात. पुढे समीकरणे आणि सूत्रे समजण्यासाठी बीजगणिताचा पाया महत्त्वाचा आहे.","x + 3 = 8 असेल तर x = 5.","अक्षर म्हणजे अज्ञात किंवा बदलणारी संख्या दर्शवू शकते."],

        ["चल व स्थिरांक","बीजगणितात ज्या राशीचे मूल्य बदलू शकते त्याला चल म्हणतात. x, y ही चलांची उदाहरणे आहेत. ज्या राशीचे मूल्य निश्चित असते त्याला स्थिरांक म्हणतात. 5, 10 किंवा 100 हे स्थिरांक असू शकतात. एखाद्या बीजगणितीय पदात चल आणि स्थिरांक दोन्ही असू शकतात. ही संकल्पना समीकरणे समजण्यासाठी आवश्यक आहे.","3x मध्ये x चल आहे आणि 3 हा स्थिरांक गुणक आहे.","चल बदलू शकतो; स्थिरांक निश्चित असतो."],

        ["सोपी बीजगणितीय समीकरणे","समीकरण म्हणजे दोन गणिती राशी समान आहेत हे दाखवणारे विधान. = हे समानतेचे चिन्ह आहे. x + 4 = 10 मध्ये x ची किंमत शोधायची असते. समीकरणाच्या दोन्ही बाजूंवर समान क्रिया केल्यास समानता टिकते. योग्य उलट क्रिया वापरून अज्ञात संख्या शोधता येते. उदाहरण सोडवल्यानंतर उत्तर मूळ समीकरणात ठेवून तपासणे चांगले.","x + 4 = 10 म्हणून x = 6.","उत्तर मिळाल्यावर ते समीकरणात बसवून तपासा."],

        ["घातांक","एखादी संख्या स्वतःच्याच गुणाकाराने अनेक वेळा घेतली असेल तर ती घातांकाच्या स्वरूपात लिहिता येते. 2 × 2 × 2 = 2³. येथे 2 हा पाया आणि 3 हा घातांक आहे. घातांकामुळे मोठे गुणाकार लहान स्वरूपात लिहिता येतात. वर्ग म्हणजे घातांक 2 आणि घन म्हणजे घातांक 3. पुढे विज्ञान आणि गणितात घातांकाचा मोठ्या प्रमाणावर उपयोग होतो.","5² = 5 × 5 = 25.","घातांक म्हणजे पाया किती वेळा गुणायचा हे सांगतो."],

        ["वर्ग व वर्गमूळ","एखाद्या संख्येला त्याच संख्येने गुणल्यावर मिळणारी संख्या तिचा वर्ग असतो. 6² = 36. वर्गमूळ म्हणजे कोणती संख्या स्वतःशी गुणल्यावर दिलेली संख्या मिळते हे शोधणे. √36 = 6 कारण 6 × 6 = 36. वर्ग आणि वर्गमूळ या एकमेकांच्या उलट क्रिया आहेत. त्यांचा उपयोग क्षेत्रफळ आणि भूमितीमध्येही होतो.","9² = 81 आणि √81 = 9.","वर्गमूळ तपासण्यासाठी त्या संख्येचा वर्ग करून पाहा."],

// ===============================
// LEVELS DISPLAY
// ===============================

const levelsContainer = document.getElementById("levelsContainer");

levels.forEach(level => {

    const card = document.createElement("div");

    card.className = "level-card";

    card.innerHTML = `
        <div class="level-number">LEVEL ${level.id}</div>

        <h2>${level.title}</h2>

        <p>${level.description}</p>

        <button onclick="openLevel(${level.id})">
            Topics पहा →
                </button>
    `;

    levelsContainer.appendChild(card);
});


// ===============================
// LEVEL OPEN
// ===============================

function openLevel(levelId) {

    const level = levels.find(l => l.id === levelId);

    if (!level) return;

    document.getElementById("levelPopupTitle").textContent =
        level.title;

    const topicContainer =
        document.getElementById("topicsContainer");

    topicContainer.innerHTML = "";

    level.topics.forEach((topic, index) => {

        const button = document.createElement("button");

        button.className = "topic-button";

        button.innerHTML = `
            <span class="topic-number">${index + 1}</span>
            <span>${topic[0]}</span>
        `;

        button.onclick = function () {
            openTopic(levelId, index);
        };

        topicContainer.appendChild(button);
    });

    document.getElementById("levelPopup").style.display = "flex";
}


// ===============================
// TOPIC OPEN
// ===============================

function openTopic(levelId, topicIndex) {

    const level = levels.find(l => l.id === levelId);

    if (!level) return;

    const topic = level.topics[topicIndex];

    if (!topic) return;

    document.getElementById("topicTitle").textContent =
        topic[0];

    document.getElementById("topicExplanation").textContent =
        topic[1];

    document.getElementById("topicExample").textContent =
        topic[2];

    document.getElementById("topicRemember").textContent =
        topic[3];

    document.getElementById("topicPopup").style.display = "flex";
}


// ===============================
// TOPIC CLOSE
// ===============================

function backToTopics() {

    document.getElementById("topicPopup").style.display =
        "none";
}


// ===============================
// MODAL CLOSE
// ===============================

function closeModal(id) {

    document.getElementById(id).style.display =
        "none";
}


// ===============================
// OUTSIDE CLICK CLOSE
// ===============================

window.addEventListener("click", function(event) {

    const levelPopup =
        document.getElementById("levelPopup");

    const topicPopup =
        document.getElementById("topicPopup");

    if (event.target === levelPopup) {
        levelPopup.style.display = "none";
    }

    if (event.target === topicPopup) {
        topicPopup.style.display = "none";
    }

});


// ===============================
// ESC KEY CLOSE
// ===============================

document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {

        document.getElementById("levelPopup").style.display =
            "none";

        document.getElementById("topicPopup").style.display =
            "none";
    }

});


// ===============================
// PAGE BACK
// ===============================

function goBack() {
    window.location.href = "learn.html";
}

</script>

</body>
</html>
