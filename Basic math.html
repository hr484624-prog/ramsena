<style>

*{

body{

button{

.page{

}

/* HEADER */

.header{
  background:white;
  padding:18px 16px;
  display:flex;
  align-items:center;
  gap:14px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
  position:sticky;
  top:0;
  z-index:10;
}

.back-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:14px;
  background:#eaf3ff;
  color:#1769e0;
  font-size:27px;
  cursor:pointer;
}

.header-info{
  flex:1;
}

.header-info h1{
  font-size:21px;
  color:#123b82;
}

.header-info p{
  font-size:12px;
  color:#718096;
  margin-top:4px;
}

/* HERO */

.hero{
  margin:18px 15px;
  padding:20px;
  border-radius:24px;
  background:linear-gradient(
    135deg,
    #1769e0,
    #4d9cff
  );
  color:white;
  box-shadow:0 10px 25px rgba(23,105,224,.22);
}

.hero-icon{
  font-size:42px;
  margin-bottom:8px;
}

.hero h2{
  font-size:22px;
}

.hero p{
  margin-top:7px;
  font-size:13px;
  line-height:1.5;
}

/* SECTION */

.section-title{
  padding:5px 16px 12px;
}

.section-title h2{
  font-size:19px;
}

.section-title p{
  color:#7a869a;
  font-size:12px;
  margin-top:4px;
}

/* LEVELS */

.levels{
  padding:0 15px 30px;
}

.level-card{
  background:white;
  border-radius:20px;
  padding:17px;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  gap:13px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
  cursor:pointer;
  transition:.15s;
}

.level-card:active{
  transform:scale(.98);
}

.level-number{
  min-width:48px;
  height:48px;
  border-radius:15px;
  background:#eaf3ff;
  color:#1769e0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:14px;
}

.level-content{
  flex:1;
}

.level-content h3{
  font-size:16px;
  color:#173b79;
}

.level-content p{
  font-size:11px;
  color:#8a94a6;
  margin-top:5px;
  line-height:1.4;
}

.arrow{
  color:#1769e0;
  font-size:22px;
}

/* MODAL */

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(8,25,55,.62);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:100;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:430px;
  max-height:92vh;
  background:white;
  border-radius:25px;
  overflow:hidden;
  box-shadow:0 20px 50px rgba(0,0,0,.25);
  animation:popup .2s ease;
}

@keyframes popup{

  from{
    opacity:0;
    transform:scale(.94);
  }

  to{
    opacity:1;
    transform:scale(1);
  }

}

.modal-header{
  padding:18px;
  background:#f7faff;
  border-bottom:1px solid #edf1f7;
  display:flex;
  align-items:center;
  gap:10px;
}

.modal-header h2{
  flex:1;
  font-size:18px;
  color:#173b79;
}

.close-btn{
  width:38px;
  height:38px;
  border:none;
  border-radius:12px;
  background:#eaf3ff;
  color:#1769e0;
  font-size:21px;
  cursor:pointer;
}

.modal-body{
  padding:18px;
  max-height:calc(92vh - 75px);
  overflow-y:auto;
}

/* TOPIC CARDS */

.topic-card{
  background:#f8fbff;
  border:1px solid #e7effa;
  border-radius:17px;
  padding:14px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
  transition:.15s;
}

.topic-card:active{
  transform:scale(.98);
}

.topic-number{

  height:42px;
  border-radius:13px;
  background:#eaf3ff;
  color:#1769e0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:bold;
}

.topic-text{
  flex:1;
}

.topic-text strong{
  display:block;
  font-size:14px;
  color:#173b79;
  line-height:1.4;
}

.topic-text span{
  display:block;
  font-size:11px;
  color:#8993a5;
  margin-top:4px;
}

.topic-arrow{
  color:#1769e0;
  font-size:20px;
}

/* EXPLANATION */

  background:#eef6ff;
  border-radius:18px;
  padding:16px;
  margin-bottom:15px;
}

.lesson-icon{
  font-size:38px;
  margin-bottom:8px;

  color:#1769e0;
  font-size:20px;

.lesson-top p{

  font-size:12px;
  line-height:1.6;
  color:#526176;

.lesson-section{
  margin-bottom:17px;

  font-size:15px;
  margin-bottom:8px;
  color:#173b79;
}

.lesson-section p{
  font-size:13px;
  line-height:1.8;
  color:#526176;
}

.example-box{
  background:#f7faff;

  border-radius:12px;
  padding:14px;
  margin-top:8px;
  font-size:14px;
  line-height:1.8;

.remember-box{

/* EMPTY */

.empty{

  text-align:center;
  color:#7d899c;

</style>

</head>

"क्रमाने गणित करण्याचा नियम":{

document.getElementById("detailModalBg");

const detailIcon =
document.getElementById("detailIcon");

const detailTitle =
document.getElementById("detailTitle");

const detailIntro =
document.getElementById("detailIntro");

const detailLines =
document.getElementById("detailLines");

const detailRemember =
document.getElementById("detailRemember");


// ===============================
// RENDER LEVELS
// ===============================

function renderLevels(){

levelContainer.innerHTML="";

levels.forEach((level,index)=>{

const card=document.createElement("div");

card.className="level-card";

card.innerHTML=`

<div class="level-icon">
${level.icon}
</div>

<div class="level-info">

<div class="level-title">
${level.title}
</div>

<div class="level-subtitle">
${level.subtitle}
</div>

</div>

<div class="level-arrow">
›
</div>

`;

card.addEventListener("click",function(){

openLevel(index);

});

levelContainer.appendChild(card);

});

}


// ===============================
// OPEN LEVEL
// ===============================

function openLevel(index){

const level=levels[index];

levelModalTitle.textContent=
`${level.icon} ${level.title} — ${level.subtitle}`;

topicContainer.innerHTML="";

level.topics.forEach(function(topicName){

const topic=mathTopics[topicName];

if(!topic){

return;

}

const button=document.createElement("button");

button.className="topic-button";

button.innerHTML=`

<span class="topic-icon">
${topic.icon}
</span>

<span class="topic-name">
${topicName}
</span>

<span class="topic-arrow">
›
</span>

`;

button.addEventListener("click",function(){

openTopic(topicName);

});

topicContainer.appendChild(button);

});

levelModalBg.classList.add("show");

document.body.classList.add("modal-open");

}


// ===============================
// OPEN TOPIC DETAIL
// ===============================

function openTopic(topicName){

const topic=mathTopics[topicName];

if(!topic){

return;

}

detailIcon.textContent=
topic.icon;

detailTitle.textContent=
topicName;

detailIntro.textContent=
topic.intro;

detailLines.innerHTML="";

topic.lines.forEach(function(line,index){

const row=document.createElement("div");

row.className="detail-line";

row.innerHTML=`

<span class="line-number">
${index+1}
</span>

<span class="line-text">
${line}
</span>

`;

detailLines.appendChild(row);

});

detailRemember.textContent=
topic.remember;

detailModalBg.classList.add("show");

}


// ===============================
// CLOSE LEVEL MODAL
// ===============================

function closeLevelModal(){

levelModalBg.classList.remove("show");

if(!detailModalBg.classList.contains("show")){

document.body.classList.remove("modal-open");

}

}


// ===============================
// CLOSE DETAIL MODAL
// ===============================

function closeDetailModal(){

detailModalBg.classList.remove("show");

}


// ===============================
// BACK BUTTON FROM DETAIL
// ===============================

function backToTopics(){

closeDetailModal();

}


// ===============================
// CLOSE ALL MODALS
// ===============================

function closeAllModals(){

detailModalBg.classList.remove("show");

levelModalBg.classList.remove("show");

document.body.classList.remove("modal-open");

}


// ===============================
// LEVEL MODAL BACKGROUND CLICK
// ===============================

levelModalBg.addEventListener("click",function(e){

if(e.target===levelModalBg){

closeLevelModal();

}

});


// ===============================
// DETAIL MODAL BACKGROUND CLICK
// ===============================

detailModalBg.addEventListener("click",function(e){

if(e.target===detailModalBg){

closeDetailModal();

}

});


// ===============================
// ESC KEY
// ===============================

document.addEventListener("keydown",function(e){

if(e.key==="Escape"){

closeAllModals();

}

});


// ===============================
// START PAGE
// ===============================

renderLevels();
    </script>

</body>

</html>
