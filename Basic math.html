<!DOCTYPE html>
<html lang="mr">

<head>

<meta charset="UTF-8">

<meta name="viewport"

<title>ज्ञानसेतू - Basic Mathematics</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6fb;
  color:#222;
}

.page{
  width:100%;
  max-width:430px;
  min-height:100vh;
  margin:auto;
  background:#f3f6fb;
}

.header{
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:white;
  padding:28px 20px;
  border-radius:0 0 25px 25px;
}

.logo{
  font-size:15px;
  font-weight:bold;
  margin-bottom:10px;
}

.header h1{
  margin:0;
  font-size:28px;
}

.header p{
  margin:8px 0 0;
  font-size:14px;
  line-height:1.5;
}

.content{
  padding:20px 15px 30px;
}

.intro{
  background:white;
  padding:18px;
  border-radius:18px;
  margin-bottom:18px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.intro h2{
  margin:0 0 7px;
  font-size:21px;
}

.intro p{
  margin:0;
  color:#666;
  line-height:1.5;
}

.levels{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.level-card{
  background:white;
  padding:19px;
  border-radius:18px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
  cursor:pointer;
  transition:.2s;
  border:1px solid #eee;
}

.level-card:active{
  transform:scale(.98);
}

.level-number{
  font-size:13px;
  font-weight:bold;
  color:#2563eb;
  margin-bottom:6px;
}

.level-title{
  font-size:19px;
  font-weight:bold;
  margin-bottom:7px;
}

.level-description{
  color:#666;
  font-size:14px;
  line-height:1.5;
}


/* =========================
   POPUP
========================= */

.modal-bg{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:1000;
  padding:20px;
  align-items:center;
  justify-content:center;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:410px;
  max-height:88vh;
  overflow-y:auto;
  background:white;
  border-radius:22px;
  padding:20px;
  position:relative;
  animation:popup .2s ease;
}

@keyframes popup{
  from{
    transform:scale(.9);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}

.close{
  position:absolute;
  right:15px;
  top:12px;
  width:34px;
  height:34px;
  border:none;
  border-radius:50%;
  background:#f1f5f9;
  font-size:21px;
  cursor:pointer;
}

.modal h2{
  margin:5px 40px 8px 0;
  font-size:22px;
}

.modal-subtitle{
  color:#666;
  font-size:14px;
  line-height:1.5;
  margin-bottom:18px;
}

.topic-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.topic-btn{
  width:100%;
  text-align:left;
  border:none;
  background:#f8fafc;
  padding:15px;
  border-radius:14px;
  font-size:15px;
  cursor:pointer;
  border:1px solid #e5e7eb;
}

.topic-btn:active{
  transform:scale(.98);
}

.topic-icon{
  font-size:28px;
  margin-bottom:8px;
}

.detail-intro{
  background:#f1f5ff;
  padding:14px;
  border-radius:14px;
  margin:12px 0 15px;
  line-height:1.6;
  font-size:14px;
}

.explanation{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.explanation-line{
  background:#f8fafc;
  padding:12px;
  border-radius:12px;
  line-height:1.6;
  font-size:14px;
  border-left:4px solid #2563eb;
}

.remember{
  margin-top:16px;
  padding:15px;
  border-radius:14px;
  background:#fff7ed;
  line-height:1.6;
  font-size:14px;
}

.back-btn{
  width:100%;
  margin-top:16px;
  padding:13px;
  border:none;
  border-radius:13px;
  background:#2563eb;
  color:white;
  font-size:15px;
  cursor:pointer;
}

</style>

</head>

// ===============================
// VARIABLES
// ===============================

let currentLevel = 0;


// ===============================
// RENDER LEVELS
// ===============================

function renderLevels(){

  const container =
    document.getElementById("levels");

  container.innerHTML = "";

  levels.forEach((level,index)=>{

    const card =
      document.createElement("div");

    card.className = "level-card";

    card.innerHTML = `

      <div class="level-number">
        ${level.title}
      </div>

      <div class="level-title">
        ${level.description}
      </div>

      <div class="level-description">
        ${level.topics.length} Topics उपलब्ध आहेत
      </div>

    `;

    card.addEventListener(
      "click",
      ()=>openLevel(index)
    );

    container.appendChild(card);

  });

}


// ===============================
// OPEN LEVEL
// ===============================

function openLevel(index){

  currentLevel = index;

  const level = levels[index];

  document.getElementById(
    "levelTitle"
  ).textContent =
    level.title + " • " + level.description;

  document.getElementById(
    "levelDescription"
  ).textContent =
    "खालीलपैकी कोणताही Topic निवडा.";

  const topicList =
    document.getElementById("topicList");

  topicList.innerHTML = "";

  level.topics.forEach(topicName=>{

    const topic =
      mathTopics.find(
        item => item.name === topicName
      );

    if(!topic) return;

    const button =
      document.createElement("button");

    button.className = "topic-btn";

    button.textContent =
      topic.icon + "  " + topic.name;

    button.addEventListener(
      "click",
      ()=>openTopic(topicName)
    );

    topicList.appendChild(button);

  });

  document
    .getElementById("levelModal")
    .classList.add("show");

}


// ===============================
// OPEN TOPIC
// ===============================

function openTopic(topicName){

  const topic =
    mathTopics.find(
      item => item.name === topicName
    );

  if(!topic) return;

  document.getElementById(
    "detailIcon"
  ).textContent = topic.icon;

  document.getElementById(
    "detailTitle"
  ).textContent = topic.name;

  document.getElementById(
    "detailIntro"
  ).textContent = topic.intro;

  const explanation =
    document.getElementById("explanation");

  explanation.innerHTML = "";

  topic.lines.forEach(
    (line,index)=>{

      const div =
        document.createElement("div");

      div.className =
        "explanation-line";

      div.textContent =
        (index + 1) + ". " + line;

      explanation.appendChild(div);

    }
  );

  document.getElementById(
    "remember"
  ).textContent =
    topic.remember;

  document.getElementById(
    "detailModal"
  ).classList.add("show");

}


// ===============================
// CLOSE LEVEL MODAL
// ===============================

function closeLevelModal(){

  document
    .getElementById("levelModal")
    .classList.remove("show");

}


// ===============================
// CLOSE DETAIL MODAL
// ===============================

function closeDetailModal(){

  document
    .getElementById("detailModal")
    .classList.remove("show");

}


// ===============================
// BACK TO TOPICS
// ===============================

function backToTopics(){

  closeDetailModal();

  document
    .getElementById("levelModal")
    .classList.add("show");

}


// ===============================
// CLOSE ALL MODALS
// ===============================

function closeAllModals(){

  closeLevelModal();

  closeDetailModal();

}


// ===============================
// BUTTON EVENTS
// ===============================

document
  .getElementById("levelClose")
  .addEventListener(
    "click",
    closeLevelModal
  );

document
  .getElementById("detailClose")
  .addEventListener(
    "click",
    closeDetailModal
  );

document
  .getElementById("backTopics")
  .addEventListener(
    "click",
    backToTopics
  );


// ===============================
// BACKDROP CLICK
// ===============================

document
  .getElementById("levelModal")
  .addEventListener(
    "click",
    function(e){

      if(e.target === this){
        closeLevelModal();
      }

    }
  );


document
  .getElementById("detailModal")
  .addEventListener(
    "click",
    function(e){

      if(e.target === this){
        closeDetailModal();
      }

    }
  );


// ===============================
// ESCAPE KEY
// ===============================

document.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Escape"){
      closeAllModals();
    }

  }
);


// ===============================
// START PAGE
// ===============================

renderLevels();


</script>
