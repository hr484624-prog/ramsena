<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GyanSetu Admin Messages</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#080812;
    color:white;
    height:100vh;
    overflow:hidden;
}

.app{
    height:100vh;
    display:flex;
}

/* =========================
   USERS PANEL
========================= */

.users-panel{
    width:330px;
    background:#0d0d18;
    border-right:1px solid #24243d;
    display:flex;
    flex-direction:column;
}

.top-header{
    padding:20px;
    background:linear-gradient(
        135deg,
        #006eff,
        #7b2cff,
        #ff1493
    );
}

.top-header h1{
    font-size:23px;
    font-weight:800;
}

.top-header p{
    margin-top:5px;
    font-size:12px;
    opacity:.9;
}

.search{
    padding:13px;
    background:#0b0b14;
    border-bottom:1px solid #24243d;
}

.search input{
    width:100%;
    height:43px;
    padding:0 14px;
    border-radius:12px;
    border:1px solid #30304c;
    background:#151525;
    color:white;
    outline:none;
}

.search input::placeholder{
    color:#8888a5;
}

.search input:focus{
    border-color:#ff1493;
    box-shadow:0 0 12px rgba(255,20,147,.25);
}

.users{
    flex:1;
    overflow-y:auto;
}

/* USER */

.user{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px;
    cursor:pointer;
    border-bottom:1px solid #1c1c2d;
    transition:.2s;
}

.user:hover{
    background:#141427;
}

.user.active{
    background:linear-gradient(
        90deg,
        rgba(0,110,255,.22),
        rgba(255,20,147,.18)
    );
    border-left:3px solid #ff1493;
}

.avatar{
    width:46px;
    height:46px;
    flex-shrink:0;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:18px;
    font-weight:bold;
    color:white;
    background:linear-gradient(
        135deg,
        #006eff,
        #ff1493
    );
    box-shadow:0 0 15px rgba(255,20,147,.25);
}

.user-info{
    min-width:0;
}

.username{
    font-size:15px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-id{
    color:#777795;
    font-size:10px;
    margin-top:4px;
}

/* =========================
   CHAT
========================= */

.chat-panel{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
    background:
        radial-gradient(
            circle at top right,
            rgba(0,110,255,.10),
            transparent 35%
        ),
        radial-gradient(
            circle at bottom left,
            rgba(255,20,147,.08),
            transparent 35%
        ),
        #080812;
}

/* CHAT HEADER */

.chat-header{
    height:72px;
    padding:12px 18px;
    display:flex;
    align-items:center;
    gap:12px;
    background:#0e0e1b;
    border-bottom:1px solid #24243d;
}

.back-btn{
    display:none;
    width:40px;
    height:40px;
    border:none;
    border-radius:10px;
    background:#17172a;
    color:#ff1493;
    font-size:22px;
    cursor:pointer;
}

.chat-avatar{
    width:43px;
    height:43px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(
        135deg,
        #006eff,
        #ff1493
    );
    font-weight:bold;
}

.chat-name{
    font-size:16px;
    font-weight:bold;
}

.chat-status{
    margin-top:3px;
    font-size:11px;
    color:#00aaff;
}

/* MESSAGES */

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:11px;
}

.empty{
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:#777795;
}

.empty h2{
    color:#ffffff;
    margin-bottom:8px;
}

/* MESSAGE */

.message{
    max-width:75%;
    padding:11px 14px;
    border-radius:16px;
    font-size:14px;
    line-height:1.45;
    word-break:break-word;
}

.message.admin{
    align-self:flex-end;
    background:linear-gradient(
        135deg,
        #006eff,
        #5140ff
    );
    color:white;
    border-bottom-right-radius:4px;
    box-shadow:0 4px 15px rgba(0,110,255,.20);
}

.message.user{
    align-self:flex-start;
    background:#171727;
    border:1px solid #2a2a43;
    color:#f1f1f7;
    border-bottom-left-radius:4px;
}

.time{
    margin-top:4px;
    font-size:9px;
    opacity:.65;
}

/* INPUT */

.input-area{
    display:flex;
    gap:9px;
    padding:12px;
    background:#0e0e1b;
    border-top:1px solid #24243d;
}

.input-area textarea{
    flex:1;
    resize:none;
    height:46px;
    max-height:120px;
    padding:13px;
    border-radius:13px;
    border:1px solid #30304c;
    background:#151525;
    color:white;
    outline:none;
}

.input-area textarea:focus{
    border-color:#006eff;
    box-shadow:0 0 12px rgba(0,110,255,.20);
}

.send{
    width:55px;
    border:none;
    border-radius:13px;
    cursor:pointer;
    color:white;
    font-size:19px;
    background:linear-gradient(
        135deg,
        #006eff,
        #ff1493
    );
}

.send:disabled{
    opacity:.45;
    cursor:not-allowed;
}

/* LOADING */

.loading{
    padding:20px;
    text-align:center;
    color:#777795;
}

/* SCROLLBAR */

::-webkit-scrollbar{
    width:6px;
}

::-webkit-scrollbar-track{
    background:#0b0b14;
}

::-webkit-scrollbar-thumb{
    background:linear-gradient(
        #006eff,
        #ff1493
    );
    border-radius:20px;
}

/* MOBILE */

@media(max-width:700px){

    .users-panel{
        width:100%;
    }

    .chat-panel{
        display:none;
        width:100%;
    }

    .app.chat-open .users-panel{
        display:none;
    }

    .app.chat-open .chat-panel{
        display:flex;
    }

    .back-btn{
        display:block;
    }

    .message{
        max-width:86%;
    }
}
</style>
</head>

<body>

<div class="app" id="app">

    <!-- USERS -->
    <div class="users-panel">

        <div class="top-header">
            <h1>GyanSetu Admin</h1>
            <p>Admin Messaging Center</p>
        </div>

        <div class="search">
            <input
                type="text"
                id="search"
                placeholder="Search users..."
                autocomplete="off"
            >
        </div>

        <div class="users" id="users">
            <div class="loading">
                Loading users...
            </div>
        </div>

    </div>


    <!-- CHAT -->
    <div class="chat-panel">

        <div class="chat-header">

            <button
                class="back-btn"
                id="backBtn"
            >
                ←
            </button>

            <div
                class="chat-avatar"
                id="chatAvatar"
            >
                ?
            </div>

            <div>
                <div
                    class="chat-name"
                    id="chatName"
                >
                    Select a user
                </div>

                <div
                    class="chat-status"
                    id="chatStatus"
                >
                    GyanSetu Admin
                </div>
            </div>

        </div>


        <div
            class="messages"
            id="messages"
        >

            <div class="empty">

                <div>
                    <h2>GyanSetu Messages</h2>
                    <p>Select a user to start chatting.</p>
                </div>

            </div>

        </div>


        <div class="input-area">

            <textarea
                id="messageInput"
                placeholder="Type your message..."
                disabled
            ></textarea>

            <button
                class="send"
                id="sendBtn"
                disabled
            >
                ➤
            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://eqglttfffhvoyvrclzse.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rR4xxl0dW5DJrhhjqiFHLw_uJ-HakAb";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   VARIABLES
========================= */

const app =
document.getElementById("app");

const usersBox =
document.getElementById("users");

const search =
document.getElementById("search");

const messagesBox =
document.getElementById("messages");

const chatName =
document.getElementById("chatName");

const chatAvatar =
document.getElementById("chatAvatar");

const chatStatus =
document.getElementById("chatStatus");

const messageInput =
document.getElementById("messageInput");

const sendBtn =
document.getElementById("sendBtn");

const backBtn =
document.getElementById("backBtn");

let currentUser = null;
let selectedUser = null;
let allUsers = [];


/* =========================
   START
========================= */

init();


async function init(){

    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getSession();

    if(
        error ||
        !data.session
    ){
        blockPage();
        return;
    }

    currentUser =
        data.session.user;


    /* ADMIN CHECK */

    const {
        data:admin,
        error:adminError
    } =
    await supabaseClient
        .from("admin_users")
        .select("user_id")
        .eq(
            "user_id",
            currentUser.id
        )
        .maybeSingle();


    if(
        adminError ||
        !admin
    ){
        blockPage();
        return;
    }


    await loadUsers();

    setupRealtime();
}


/* =========================
   BLOCK NON ADMIN
========================= */

function blockPage(){

    document.body.innerHTML = "";

    document.body.style.background =
        "#080812";
}


/* =========================
   LOAD USERS
========================= */

async function loadUsers(){

    usersBox.innerHTML =
        `<div class="loading">
            Loading users...
        </div>`;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("Profiles")
        .select("id,username")
        .neq(
            "id",
            currentUser.id
        )
        .order(
            "username"
        );


    if(error){

        console.error(error);

        usersBox.innerHTML =
            `<div class="loading">
                Unable to load users.
            </div>`;

        return;
    }


    allUsers =
        data || [];

    renderUsers(
        allUsers
    );
}


/* =========================
   RENDER USERS
========================= */

function renderUsers(users){

    usersBox.innerHTML = "";


    if(!users.length){

        usersBox.innerHTML =
            `<div class="loading">
                No users found.
            </div>`;

        return;
    }


    users.forEach(user => {

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "user";

        div.dataset.id =
            user.id;


        const name =
            user.username ||
            "User";


        const initial =
            name
                .charAt(0)
                .toUpperCase();


        div.innerHTML = `

            <div class="avatar">
                ${escapeHTML(initial)}
            </div>

            <div class="user-info">

                <div class="username">
                    ${escapeHTML(name)}
                </div>

                <div class="user-id">
                    ${escapeHTML(user.id)}
                </div>

            </div>

        `;


        div.addEventListener(
            "click",
            () => selectUser(user)
        );


        usersBox.appendChild(div);

    });
}


/* =========================
   SEARCH
========================= */

search.addEventListener(
    "input",
    () => {

        const value =
            search.value
                .toLowerCase()
                .trim();


        const filtered =
            allUsers.filter(
                user =>
                    (
                        user.username ||
                        ""
                    )
                    .toLowerCase()
                    .includes(value)
            );


        renderUsers(
            filtered
        );
    }
);


/* =========================
   SELECT USER
========================= */

async function selectUser(user){

    selectedUser =
        user;


    document
        .querySelectorAll(".user")
        .forEach(item => {

            item.classList.toggle(
                "active",
                item.dataset.id ===
                user.id
            );

        });


    const name =
        user.username ||
        "User";


    chatName.textContent =
        name;


    chatAvatar.textContent =
        name
            .charAt(0)
            .toUpperCase();


    chatStatus.textContent =
        "Messaging";


    messageInput.disabled =
        false;

    sendBtn.disabled =
        false;


    app.classList.add(
        "chat-open"
    );


    await loadMessages();
}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages(){

    if(!selectedUser)
        return;


    messagesBox.innerHTML =
        `<div class="loading">
            Loading messages...
        </div>`;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("Messages")
        .select("*")
        .or(
            `and(sender_id.eq.${currentUser.id},receiver_id.eq.${selectedUser.id}),and(sender_id.eq.${selectedUser.id},receiver_id.eq.${currentUser.id})`
        )
        .order(
            "created_at",
            {
                ascending:true
            }
        );


    if(error){

        console.error(error);

        messagesBox.innerHTML =
            `<div class="loading">
                Unable to load messages.
            </div>`;

        return;
    }


    messagesBox.innerHTML =
        "";


    if(
        !data ||
        data.length === 0
    ){

        messagesBox.innerHTML = `
            <div class="empty">
                <div>
                    <h2>No messages yet</h2>
                    <p>Start the conversation.</p>
                </div>
            </div>
        `;

        return;
    }


    data.forEach(
        message =>
            addMessage(
                message,
                false
            )
    );


    scrollBottom();


    /* MARK AS READ */

    await supabaseClient
        .from("Messages")
        .update({
            is_read:true
        })
        .eq(
            "sender_id",
            selectedUser.id
        )
        .eq(
            "receiver_id",
            currentUser.id
        )
        .eq(
            "is_read",
            false
        );
}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(
    message,
    scroll=true
){

    const div =
        document.createElement(
            "div"
        );


    const adminMessage =
        message.sender_id ===
        currentUser.id;


    div.className =
        "message " +
        (
            adminMessage
            ? "admin"
            : "user"
        );


    const time =
        message.created_at
        ?
        new Date(
            message.created_at
        ).toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        )
        :
        "";


    div.innerHTML = `

        <div>
            ${escapeHTML(
                message.message || ""
            )}
        </div>

        <div class="time">
            ${time}
        </div>

    `;


    messagesBox.appendChild(
        div
    );


    if(scroll)
        scrollBottom();
}


/* =========================
   SEND
========================= */

async function sendMessage(){

    if(!selectedUser)
        return;


    const text =
        messageInput.value
            .trim();


    if(!text)
        return;


    sendBtn.disabled =
        true;


    const {
        error
    } =
    await supabaseClient
        .from("Messages")
        .insert({

            sender_id:
                currentUser.id,

            receiver_id:
                selectedUser.id,

            message:
                text,

            is_read:false

        });


    if(error){

        console.error(error);

        sendBtn.disabled =
            false;

        return;
    }


    messageInput.value =
        "";


    sendBtn.disabled =
        false;


    messageInput.focus();
}


/* =========================
   SEND BUTTON
========================= */

sendBtn.addEventListener(
    "click",
    sendMessage
);


/* =========================
   ENTER
========================= */

messageInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();
        }

    }
);


/* =========================
   BACK MOBILE
========================= */

backBtn.addEventListener(
    "click",
    () => {

        app.classList.remove(
            "chat-open"
        );

        selectedUser =
            null;

        messageInput.disabled =
            true;

        sendBtn.disabled =
            true;

    }
);


/* =========================
   REALTIME
========================= */

function setupRealtime(){

    supabaseClient

        .channel(
            "admin-message-channel"
        )

        .on(
            "postgres_changes",
            {
                event:"INSERT",
                schema:"public",
                table:"Messages"
            },
            payload => {

                const message =
                    payload.new;


                if(!selectedUser)
                    return;


                const sameChat =
                    (
                        message.sender_id ===
                        currentUser.id &&
                        message.receiver_id ===
                        selectedUser.id
                    )
                    ||
                    (
                        message.sender_id ===
                        selectedUser.id &&
                        message.receiver_id ===
                        currentUser.id
                    );


                if(!sameChat)
                    return;


                addMessage(
                    message,
                    true
                );


                if(
                    message.sender_id ===
                    selectedUser.id
                ){

                    supabaseClient
                        .from("Messages")
                        .update({
                            is_read:true
                        })
                        .eq(
                            "id",
                            message.id
                        );

                }

            }
        )

        .subscribe();
}


/* =========================
   SCROLL
========================= */

function scrollBottom(){

    messagesBox.scrollTop =
        messagesBox.scrollHeight;
}


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}

</script>

</body>
</html>
