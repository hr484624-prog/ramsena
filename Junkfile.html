<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>GyanSetu - Users</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f8ff;
  color:#172033;
  min-height:100vh;
}


/* =========================
   HEADER
========================= */

.header{

  position:sticky;
  top:0;
  z-index:100;

  height:66px;

  display:flex;
  align-items:center;

  padding:0 15px;

  background:
    linear-gradient(
      135deg,
      #1565d8,
      #2563eb
    );

  color:white;

  box-shadow:
    0 5px 20px
    rgba(37,99,235,.20);

}

.back{

  width:42px;
  height:42px;

  border:0;
  border-radius:50%;

  background:
    rgba(255,255,255,.16);

  color:white;

  font-size:29px;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

}

.back:active{
  transform:scale(.94);
}

.header-title{

  margin-left:12px;

  font-size:20px;
  font-weight:800;

}

.header-subtitle{

  font-size:11px;

  opacity:.82;

  margin-top:2px;

}

.header-info{
  flex:1;
}

.refresh{

  width:42px;
  height:42px;

  border:0;
  border-radius:50%;

  background:
    rgba(255,255,255,.16);

  color:white;

  font-size:23px;

  cursor:pointer;

}

.refresh:active{
  transform:rotate(90deg);
}


/* =========================
   SEARCH
========================= */

.search-area{

  padding:15px;

  background:white;

  border-bottom:
    1px solid #e4ecf7;

}

.search{

  width:100%;

  padding:14px 17px;

  border:
    1.5px solid #d8e5f5;

  border-radius:14px;

  outline:none;

  font-size:15px;

  background:#f8fbff;

  color:#172033;

  transition:.2s;

}

.search:focus{

  border-color:#2563eb;

  background:white;

  box-shadow:
    0 0 0 4px
    rgba(37,99,235,.08);

}


/* =========================
   USERS LIST
========================= */

#usersList{

  padding:10px 14px 25px;

}

.user-card{

  position:relative;

  display:flex;
  align-items:center;

  gap:13px;

  width:100%;

  padding:13px;

  margin-bottom:10px;

  background:white;

  border:
    1px solid #e5edf8;

  border-radius:17px;

  cursor:pointer;

  box-shadow:
    0 4px 14px
    rgba(30,80,150,.07);

  transition:
    transform .15s,
    box-shadow .15s;

}

.user-card:active{

  transform:scale(.985);

  box-shadow:
    0 2px 7px
    rgba(30,80,150,.10);

}


/* =========================
   AVATAR
========================= */

.avatar-wrap{

  position:relative;

  flex-shrink:0;

}

.avatar{

  width:52px;
  height:52px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      135deg,
      #e0efff,
      #c7dcff
    );

  color:#1559c7;

  font-size:21px;
  font-weight:800;

  border:
    2px solid white;

  box-shadow:
    0 3px 10px
    rgba(37,99,235,.15);

}


/* Online dot */

.online-dot{

  position:absolute;

  right:1px;
  bottom:1px;

  width:13px;
  height:13px;

  border-radius:50%;

  background:#22c55e;

  border:
    2px solid white;

}


/* =========================
   USER INFO
========================= */

.user-info{

  flex:1;

  min-width:0;

}

.username-row{

  display:flex;

  align-items:center;

  gap:7px;

  min-width:0;

}

.username{

  font-size:16px;

  font-weight:800;

  color:#14213d;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;

}

.email{

  margin-top:5px;

  font-size:12px;

  color:#7a8799;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;

}


/* =========================
   RIGHT SIDE
========================= */

.right-side{

  display:flex;

  align-items:center;

  gap:7px;

  flex-shrink:0;

}

.unread-dot{

  width:10px;
  height:10px;

  border-radius:50%;

  background:#2563eb;

  box-shadow:
    0 0 0 3px
    #e5efff;

}

.unread-badge{

  min-width:23px;
  height:23px;

  padding:0 6px;

  border-radius:20px;

  background:#2563eb;

  color:white;

  font-size:11px;

  font-weight:bold;

  display:flex;

  align-items:center;
  justify-content:center;

}

.arrow{

  color:#a0aec0;

  font-size:22px;

}


/* =========================
   LOADING
========================= */

.loading{

  padding:45px 20px;

  text-align:center;

  color:#728096;

}

.loader{

  width:35px;
  height:35px;

  margin:0 auto 12px;

  border:
    3px solid #dce9ff;

  border-top-color:#2563eb;

  border-radius:50%;

  animation:
    spin .8s linear infinite;

}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =========================
   EMPTY
========================= */

.empty{

  margin-top:25px;

  padding:35px 20px;

  background:white;

  border-radius:17px;

  text-align:center;

  color:#7b8798;

  border:
    1px solid #e5edf8;

}

.empty-icon{

  font-size:38px;

  margin-bottom:10px;

}


/* =========================
   ERROR
========================= */

.error{

  margin-top:20px;

  padding:18px;

  background:#fff5f5;

  border:
    1px solid #ffd7d7;

  border-radius:15px;

  color:#c62828;

  text-align:center;

  line-height:1.5;

}


/* =========================
   NO SEARCH RESULT
========================= */

.no-result{

  text-align:center;

  padding:40px 20px;

  color:#7b8798;

}


/* =========================
   SMALL SCREEN
========================= */

@media(max-width:360px){

  .header-title{
    font-size:18px;
  }

  .avatar{
    width:48px;
    height:48px;
  }

  .username{
    font-size:15px;
  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

  <button
    class="back"
    onclick="goBack()">
    ‹
  </button>


  <div class="header-info">

    <div class="header-title">
      GyanSetu Users
    </div>

    <div class="header-subtitle">
      Connect and message
    </div>

  </div>


  <button
    class="refresh"
    onclick="loadUsers()"
    aria-label="Refresh">
    ↻
  </button>

</header>


<!-- =========================
     SEARCH
========================= -->

<div class="search-area">

  <input
    class="search"
    id="searchInput"
    type="text"
    placeholder="🔍 Search user..."
    autocomplete="off">

</div>


<!-- =========================
     USERS
========================= -->

<div id="usersList">

  <div class="loading">

    <div class="loader"></div>

    Users loading...

  </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://eqglttfffhvoyvrclzse.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_rR4xxl0dW5DJrhhjqiFHLw_uJ-HakAb";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;

let allUsers = [];

let unreadMessages = {};

let realtimeChannel = null;


/* =====================================================
   GET CURRENT USER
===================================================== */

async function getCurrentUser(){

  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth.getUser();


    if(error){

      console.error(
        "Current user error:",
        error
      );

      return null;

    }


    currentUser =
      data?.user || null;


    return currentUser;

  }

  catch(error){

    console.error(error);

    return null;

  }

}


/* =====================================================
   LOAD USERS
===================================================== */

async function loadUsers(){

  const usersList =
    document.getElementById(
      "usersList"
    );


  usersList.innerHTML = `

    <div class="loading">

      <div class="loader"></div>

      Users loading...

    </div>

  `;


  try{

    /*
      Current user नसेल तर
      आधी current user मिळवतो.
    */

    if(!currentUser){

      await getCurrentUser();

    }


    if(!currentUser){

      usersList.innerHTML = `

        <div class="error">

          Login required.<br>
          Please login to view users.

        </div>

      `;

      return;

    }


    /* ==========================================
       PROFILES
    ========================================== */

    const {
      data: users,
      error
    } =
      await supabaseClient
        .from("Profiles")
        .select("*")
        .order(
          "username",
          {
            ascending:true
          }
        );


    if(error){

      console.error(
        "Profiles error:",
        error
      );

      usersList.innerHTML = `

        <div class="error">

          Users load झाले नाहीत.<br><br>

          ${escapeHTML(error.message)}

        </div>

      `;

      return;

    }


    /*
      स्वतःचा account list मधून
      remove करतो.
    */

    allUsers =
      (users || []).filter(
        user =>
          user.id !== currentUser.id
      );


    /* ==========================================
       UNREAD
    ========================================== */

    await loadUnreadMessages();


    displayUsers(
      getFilteredUsers()
    );

  }

  catch(error){

    console.error(
      "LOAD USERS ERROR:",
      error
    );


    usersList.innerHTML = `

      <div class="error">

        Users load करता आले नाहीत.

      </div>

    `;

  }

}


/* =====================================================
   UNREAD MESSAGES
===================================================== */

async function loadUnreadMessages(){

  unreadMessages = {};


  if(!currentUser){

    return;

  }


  try{

    const {
      data: messages,
      error
    } =
      await supabaseClient
        .from("Messages")
        .select(
          "id,sender_id,receiver_id,is_read"
        )
        .eq(
          "receiver_id",
          currentUser.id
        )
        .eq(
          "is_read",
          false
        );


    if(error){

      console.error(
        "Unread messages error:",
        error
      );

      return;

    }


    (messages || []).forEach(
      message => {

        const senderId =
          message.sender_id;


        if(
          !unreadMessages[senderId]
        ){

          unreadMessages[senderId] =
            0;

        }


        unreadMessages[senderId]++;

      }
    );

  }

  catch(error){

    console.error(error);

  }

}


/* =====================================================
   DISPLAY USERS
===================================================== */

function displayUsers(users){

  const usersList =
    document.getElementById(
      "usersList"
    );


  if(!users || !users.length){

    const search =
      document
        .getElementById(
          "searchInput"
        )
        .value
        .trim();


    if(search){

      usersList.innerHTML = `

        <div class="no-result">

          🔍<br><br>

          "<b>${escapeHTML(search)}</b>"
          साठी user सापडला नाही.

        </div>

      `;

    }
    else{

      usersList.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            👥
          </div>

          सध्या कोणताही user उपलब्ध नाही.

        </div>

      `;

    }

    return;

  }


  usersList.innerHTML =
    users
      .map(
        user => {

          const username =
            user.username ||
            user.full_name ||
            "GyanSetu User";


          const email =
            user.email ||
            "";


          const firstLetter =
            username
              .charAt(0)
              .toUpperCase();


          const unreadCount =
            unreadMessages[user.id] ||
            0;


          return `

            <div
              class="user-card"
              onclick="openChat('${escapeAttribute(user.id)}')"
            >

              <div class="avatar-wrap">

                <div class="avatar">

                  ${escapeHTML(
                    firstLetter
                  )}

                </div>

              </div>


              <div class="user-info">

                <div class="username-row">

                  <div class="username">

                    ${escapeHTML(
                      username
                    )}

                  </div>

                </div>


                ${
                  email
                  ?
                  `
                    <div class="email">

                      ${escapeHTML(
                        email
                      )}

                    </div>
                  `
                  :
                  `
                    <div class="email">
                      GyanSetu member
                    </div>
                  `
                }

              </div>


              <div class="right-side">

                ${
                  unreadCount > 0
                  ?
                  `
                    <span
                      class="unread-dot">
                    </span>

                    ${
                      unreadCount > 1
                      ?
                      `
                        <span
                          class="unread-badge">

                          ${
                            unreadCount > 99
                            ? "99+"
                            : unreadCount
                          }

                        </span>
                      `
                      :
                      ""
                    }
                  `
                  :
                  ""
                }


                <span class="arrow">
                  ›
                </span>

              </div>

            </div>

          `;

        }
      )
      .join("");

}


/* =====================================================
   SEARCH
===================================================== */

function searchUsers(){

  displayUsers(
    getFilteredUsers()
  );

}


function getFilteredUsers(){

  const input =
    document.getElementById(
      "searchInput"
    );


  const search =
    input.value
      .toLowerCase()
      .trim();


  if(!search){

    return allUsers;

  }


  return allUsers.filter(
    user => {

      const username =
        (
          user.username ||
          user.full_name ||
          ""
        )
        .toLowerCase();


      const email =
        (
          user.email ||
          ""
        )
        .toLowerCase();


      return (
        username.includes(search) ||
        email.includes(search)
      );

    }
  );

}


/* =====================================================
   OPEN CHAT
===================================================== */

async function openChat(userId){

  if(!userId){

    return;

  }


  /*
    User वर tap केल्यावर
    त्याच्याकडून आलेले unread
    messages read करतो.
  */

  if(currentUser){

    try{

      const {
        error
      } =
        await supabaseClient
          .from("Messages")
          .update({
            is_read:true
          })
          .eq(
            "sender_id",
            userId
          )
          .eq(
            "receiver_id",
            currentUser.id
          )
          .eq(
            "is_read",
            false
          );


      if(error){

        console.error(
          "Read update error:",
          error
        );

      }

    }

    catch(error){

      console.error(error);

    }

  }


  /*
    ⭐ DIRECT CHAT ⭐

    Message page चे नाव:
    message.html

    User ID:
    ?id=USER_ID
  */

  window.location.href =
    "message.html?id=" +
    encodeURIComponent(userId);

}


/* =====================================================
   REALTIME
===================================================== */

function startRealtime(){

  if(!currentUser){

    return;

  }


  /*
    जुना channel असेल तर remove
  */

  if(realtimeChannel){

    supabaseClient.removeChannel(
      realtimeChannel
    );

  }


  realtimeChannel =
    supabaseClient
      .channel(
        "gyansetu-users-" +
        currentUser.id
      )

      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"Messages",
          filter:
            "receiver_id=eq." +
            currentUser.id
        },

        function(payload){

          const message =
            payload.new;


          const senderId =
            message.sender_id;


          if(
            !senderId ||
            senderId === currentUser.id
          ){

            return;

          }


          /*
            unread count वाढवा
          */

          if(
            !unreadMessages[senderId]
          ){

            unreadMessages[senderId] =
              0;

          }


          unreadMessages[senderId]++;


          /*
            List update
          */

          displayUsers(
            getFilteredUsers()
          );

        }

      )

      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"Profiles"
        },

        function(){

          /*
            नवीन user register झाला
            तर list refresh.
          */

          loadUsers();

        }

      )

      .subscribe();

}


/* =====================================================
   SEARCH EVENT
===================================================== */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    searchUsers
  );


/* =====================================================
   ENTER KEY
===================================================== */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Escape"
      ){

        event.target.value = "";

        searchUsers();

      }

    }
  );


/* =====================================================
   BACK
===================================================== */

function goBack(){

  if(
    document.referrer
  ){

    window.history.back();

  }
  else{

    window.location.href =
      "home.html";

  }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text){

  return String(
    text ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escapeAttribute(text){

  return String(
    text ?? ""
  )

    .replace(
      /\\/g,
      "\\\\"
    )

    .replace(
      /'/g,
      "\\'"
    );

}


/* =====================================================
   PAGE START
===================================================== */

async function startPage(){

  await getCurrentUser();

  if(!currentUser){

    document.getElementById(
      "usersList"
    ).innerHTML = `

      <div class="error">

        🔐 Login required.<br><br>

        Please login to view GyanSetu users.

      </div>

    `;

    return;

  }


  await loadUsers();

  startRealtime();

}


/* START */

startPage();

</script>

</body>

</html>
