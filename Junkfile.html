<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>GyanSetu Admin Messages</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:
    Arial,
    Helvetica,
    sans-serif;
  background:#f4f8ff;
  color:#172033;
}

body{
  overflow:hidden;
}


/* =====================================================
   APP
===================================================== */

.app{
  width:100%;
  height:100vh;
  display:flex;
  overflow:hidden;
}


/* =====================================================
   USERS PANEL
===================================================== */

.users-panel{
  width:350px;
  min-width:300px;
  height:100%;
  background:white;
  border-right:1px solid #e3ebf7;
  display:flex;
  flex-direction:column;
}


/* HEADER */

.users-header{
  padding:18px 18px 14px;
  background:
    linear-gradient(
      135deg,
      #1261d6,
      #2678ef
    );
  color:white;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-icon{
  width:42px;
  height:42px;
  border-radius:13px;
  background:rgba(255,255,255,.18);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.brand-name{
  font-size:20px;
  font-weight:800;
}

.admin-label{
  font-size:11px;
  opacity:.85;
  margin-top:2px;
}


/* SEARCH */

.search-area{
  padding:13px;
  background:white;
  border-bottom:1px solid #edf1f7;
}

.search{
  width:100%;
  border:1px solid #dce6f3;
  background:#f7faff;
  border-radius:13px;
  padding:12px 14px;
  outline:none;
  font-size:14px;
}

.search:focus{
  border-color:#2879e8;
  box-shadow:
    0 0 0 3px
    rgba(40,121,232,.09);
}


/* USER LIST */

.user-list{
  flex:1;
  overflow-y:auto;
  padding:8px;
}

.user-card{
  width:100%;
  border:0;
  background:white;
  border-radius:14px;
  padding:12px;
  margin-bottom:6px;
  display:flex;
  align-items:center;
  gap:11px;
  cursor:pointer;
  text-align:left;
  transition:.15s;
}

.user-card:hover{
  background:#f3f8ff;
}

.user-card.active{
  background:#eaf3ff;
  box-shadow:
    inset 3px 0 0 #1976d2;
}

.avatar{
  width:46px;
  height:46px;
  flex-shrink:0;
  border-radius:50%;
  background:
    linear-gradient(
      135deg,
      #dcebff,
      #b9d7ff
    );
  color:#1359b7;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:bold;
}

.user-info{
  flex:1;
  min-width:0;
}

.user-name{
  font-size:15px;
  font-weight:bold;
  color:#172033;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.user-email{
  margin-top:4px;
  font-size:12px;
  color:#7a8798;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.user-arrow{
  color:#a5b1c2;
  font-size:19px;
}


/* =====================================================
   CHAT PANEL
===================================================== */

.chat-panel{
  flex:1;
  height:100%;
  min-width:0;
  display:flex;
  flex-direction:column;
  background:#f4f8ff;
}


/* CHAT HEADER */

.chat-header{
  height:68px;
  flex-shrink:0;
  background:white;
  border-bottom:1px solid #e3ebf7;
  display:flex;
  align-items:center;
  padding:0 18px;
  gap:12px;
}

.mobile-back{
  display:none;
  border:0;
  background:#eef5ff;
  color:#1464ce;
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:22px;
}

.chat-avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#e4f0ff;
  color:#1261d6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.chat-user{
  min-width:0;
}

.chat-name{
  font-size:16px;
  font-weight:bold;
}

.chat-email{
  font-size:12px;
  color:#7b8798;
  margin-top:3px;
}


/* =====================================================
   CHAT AREA
===================================================== */

.chat{
  flex:1;
  overflow-y:auto;
  padding:20px;
}

.welcome{
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#718096;
}

.welcome-icon{
  width:80px;
  height:80px;
  border-radius:25px;
  background:#e4f0ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  margin-bottom:15px;
}

.welcome h2{
  margin:0 0 8px;
  color:#26354a;
}

.welcome p{
  margin:0;
  font-size:14px;
}


/* MESSAGE */

.message-row{
  display:flex;
  margin-bottom:10px;
}

.message-row.admin{
  justify-content:flex-end;
}

.message-row.user{
  justify-content:flex-start;
}

.message-bubble{
  max-width:min(75%,560px);
  padding:10px 13px;
  border-radius:16px;
  background:white;
  box-shadow:
    0 2px 8px
    rgba(22,65,115,.07);
  word-break:break-word;
}

.message-row.admin
.message-bubble{
  background:#1769e0;
  color:white;
  border-bottom-right-radius:5px;
}

.message-row.user
.message-bubble{
  border-bottom-left-radius:5px;
}

.message-text{
  font-size:14px;
  line-height:1.45;
}

.message-time{
  margin-top:5px;
  font-size:10px;
  opacity:.62;
  text-align:right;
}


/* =====================================================
   INPUT
===================================================== */

.message-input-area{
  flex-shrink:0;
  padding:10px;
  background:white;
  border-top:1px solid #e0e8f2;
  display:flex;
  gap:9px;
}

.message-input{
  flex:1;
  min-width:0;
  border:1px solid #d7e3f1;
  border-radius:24px;
  padding:12px 15px;
  outline:none;
  font-size:14px;
  background:#f9fbff;
}

.message-input:focus{
  background:white;
  border-color:#2879e8;
  box-shadow:
    0 0 0 3px
    rgba(40,121,232,.08);
}

.send-button{
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  background:
    linear-gradient(
      135deg,
      #1976d2,
      #0d47a1
    );
  color:white;
  font-size:18px;
  cursor:pointer;
}

.send-button:disabled{
  opacity:.5;
  cursor:not-allowed;
}


/* =====================================================
   STATUS
===================================================== */

.status{
  padding:9px 15px;
  font-size:12px;
  text-align:center;
  background:#f7faff;
  color:#6d7b8f;
  border-bottom:1px solid #e7edf5;
}

.loading{
  text-align:center;
  color:#78869a;
  padding:30px 15px;
}

.empty{
  text-align:center;
  color:#8995a5;
  padding:35px 15px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:720px){

  .users-panel{
    width:100%;
    min-width:100%;
  }

  .chat-panel{
    display:none;
    width:100%;
  }

  .app.show-chat .users-panel{
    display:none;
  }

  .app.show-chat .chat-panel{
    display:flex;
  }

  .mobile-back{
    display:block;
  }

  .message-bubble{
    max-width:84%;
  }

}


/* =====================================================
   NO SCROLLBAR
===================================================== */

::-webkit-scrollbar{
  width:5px;
}

::-webkit-scrollbar-thumb{
  background:#cbd8e8;
  border-radius:10px;
}

</style>

</head>


<body>


<div class="app" id="app">


<!-- ===================================================
     USERS
=================================================== -->

<section class="users-panel">

  <div class="users-header">

    <div class="brand">

      <div class="brand-icon">
        📚
      </div>

      <div>

        <div class="brand-name">
          GyanSetu
        </div>

        <div class="admin-label">
          ADMIN MESSAGES
        </div>

      </div>

    </div>

  </div>


  <div class="search-area">

    <input
      id="searchInput"
      class="search"
      type="text"
      placeholder="Search users..."
      autocomplete="off"
    >

  </div>


  <div
    id="userList"
    class="user-list"
  >

    <div class="loading">
      Loading users...
    </div>

  </div>

</section>


<!-- ===================================================
     CHAT
=================================================== -->

<section class="chat-panel">


  <header class="chat-header">

    <button
      id="mobileBack"
      class="mobile-back"
      type="button"
    >
      ‹
    </button>


    <div
      id="chatAvatar"
      class="chat-avatar"
    >
      ?
    </div>


    <div class="chat-user">

      <div
        id="chatName"
        class="chat-name"
      >
        Select a user
      </div>

      <div
        id="chatEmail"
        class="chat-email"
      >
        Choose a user to open conversation
      </div>

    </div>

  </header>


  <div
    id="status"
    class="status"
  >
    Secure admin conversation
  </div>


  <main
    id="chat"
    class="chat"
  >

    <div class="welcome">

      <div class="welcome-icon">
        💬
      </div>

      <h2>
        GyanSetu Messages
      </h2>

      <p>
        डावीकडून user निवडा आणि conversation उघडा.
      </p>

    </div>

  </main>


  <div class="message-input-area">

    <input
      id="messageInput"
      class="message-input"
      type="text"
      placeholder="Type a message..."
      autocomplete="off"
      disabled
    >

    <button
      id="sendButton"
      class="send-button"
      type="button"
      disabled
    >
      ➤
    </button>

  </div>

</section>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://eqglttfffhvoyvrclzse.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_rR4xxl0dW5DJrhhjqiFHLw_uJ-HakAb";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );


/* =====================================================
   STATE
===================================================== */

let currentUser = null;

let selectedUser = null;

let allUsers = [];

let realtimeChannel = null;


/* =====================================================
   ELEMENTS
===================================================== */

const app =
  document.getElementById("app");

const userList =
  document.getElementById("userList");

const chat =
  document.getElementById("chat");

const chatName =
  document.getElementById("chatName");

const chatEmail =
  document.getElementById("chatEmail");

const chatAvatar =
  document.getElementById("chatAvatar");

const statusBar =
  document.getElementById("status");

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const searchInput =
  document.getElementById("searchInput");


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(value){

  const div =
    document.createElement("div");

  div.textContent =
    value ?? "";

  return div.innerHTML;

}


/* =====================================================
   GET CURRENT USER
===================================================== */

async function getCurrentUser(){

  const {
    data,
    error
  } =
    await supabaseClient.auth.getUser();


  if(error){

    console.error(
      "AUTH ERROR:",
      error
    );

    return null;

  }


  return data?.user || null;

}


/* =====================================================
   ADMIN CHECK
===================================================== */

async function checkAdmin(){

  if(!currentUser){

    return false;

  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("admin_users")
    .select("user_id")
    .eq(
      "user_id",
      currentUser.id
    )
    .maybeSingle();


  if(error){

    console.error(
      "ADMIN CHECK ERROR:",
      error
    );

    return false;

  }


  return !!data;

}


/* =====================================================
   LOAD USERS
===================================================== */

async function loadUsers(){

  userList.innerHTML =
    `<div class="loading">
      Loading users...
    </div>`;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("Profiles")
    .select("id,username,email")
    .order(
      "username",
      {
        ascending:true
      }
    );


  if(error){

    console.error(
      "USERS ERROR:",
      error
    );

    userList.innerHTML =
      `<div class="empty">
        Users load करता आले नाहीत.
      </div>`;

    return;

  }


  /*
     स्वतःचा admin account list मधून काढतो.
  */

  allUsers =
    (data || []).filter(
      user =>
        user.id !== currentUser.id
    );


  renderUsers(
    allUsers
  );

}


/* =====================================================
   RENDER USERS
===================================================== */

function renderUsers(users){

  if(!users.length){

    userList.innerHTML =
      `<div class="empty">
        कोणतेही users सापडले नाहीत.
      </div>`;

    return;

  }


  userList.innerHTML =
    "";


  users.forEach(
    user => {

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "user-card";


      if(
        selectedUser &&
        selectedUser.id === user.id
      ){

        button.classList.add(
          "active"
        );

      }


      const name =
        user.username ||
        "Unknown User";


      const email =
        user.email ||
        "Email unavailable";


      const letter =
        name
          .charAt(0)
          .toUpperCase();


      button.innerHTML = `

        <div class="avatar">
          ${escapeHTML(letter)}
        </div>

        <div class="user-info">

          <div class="user-name">
            ${escapeHTML(name)}
          </div>

          <div class="user-email">
            ${escapeHTML(email)}
          </div>

        </div>

        <div class="user-arrow">
          ›
        </div>

      `;


      button.addEventListener(
        "click",
        function(){

          selectUser(user);

        }
      );


      userList.appendChild(
        button
      );

    }
  );

}


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
  "input",
  function(){

    const value =
      searchInput.value
        .toLowerCase()
        .trim();


    if(!value){

      renderUsers(
        allUsers
      );

      return;

    }


    const filtered =
      allUsers.filter(
        user => {

          const name =
            (
              user.username ||
              ""
            ).toLowerCase();


          const email =
            (
              user.email ||
              ""
            ).toLowerCase();


          return (
            name.includes(value) ||
            email.includes(value)
          );

        }
      );


    renderUsers(
      filtered
    );

  }
);


/* =====================================================
   SELECT USER
===================================================== */

async function selectUser(user){

  selectedUser =
    user;


  renderUsers(
    getFilteredUsers()
  );


  chatName.textContent =
    user.username ||
    "Unknown User";


  chatEmail.textContent =
    user.email ||
    "Email unavailable";


  chatAvatar.textContent =
    (
      user.username ||
      "U"
    )
    .charAt(0)
    .toUpperCase();


  messageInput.disabled =
    false;

  sendButton.disabled =
    false;


  statusBar.textContent =
    "Secure admin conversation";


  /*
     Mobile वर chat panel.
  */

  app.classList.add(
    "show-chat"
  );


  await loadConversation();

}


/* =====================================================
   FILTER
===================================================== */

function getFilteredUsers(){

  const value =
    searchInput.value
      .toLowerCase()
      .trim();


  if(!value){

    return allUsers;

  }


  return allUsers.filter(
    user => {

      const name =
        (
          user.username ||
          ""
        ).toLowerCase();


      const email =
        (
          user.email ||
          ""
        ).toLowerCase();


      return (
        name.includes(value) ||
        email.includes(value)
      );

    }
  );

}


/* =====================================================
   LOAD CONVERSATION
===================================================== */

async function loadConversation(){

  if(
    !currentUser ||
    !selectedUser
  ){

    return;

  }


  chat.innerHTML =
    `<div class="loading">
      Loading conversation...
    </div>`;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("Messages")
    .select(
      "id,sender_id,receiver_id,message,created_at,is_read"
    )
    .or(
      `and(sender_id.eq.${currentUser.id},receiver_id.eq.${selectedUser.id}),and(sender_id.eq.${selectedUser.id},receiver_id.eq.${currentUser.id})`
    )
    .order(
      "created_at",
      {
        ascending:true
      }
    );


  if(error){

    console.error(
      "MESSAGE LOAD ERROR:",
      error
    );


    chat.innerHTML =
      `<div class="empty">
        Messages load करता आले नाहीत.
      </div>`;

    return;

  }


  chat.innerHTML =
    "";


  if(
    !data ||
    data.length === 0
  ){

    chat.innerHTML =
      `<div class="empty">
        अजून messages नाहीत.
      </div>`;

    return;

  }


  data.forEach(
    message => {

      chat.appendChild(
        createMessageElement(
          message
        )
      );

    }
  );


  scrollBottom();


  /*
     User कडून आलेले messages
     read म्हणून mark.
  */

  await markMessagesRead();

}


/* =====================================================
   MESSAGE ELEMENT
===================================================== */

function createMessageElement(
  message
){

  const row =
    document.createElement(
      "div"
    );


  const isAdmin =
    message.sender_id ===
    currentUser.id;


  row.className =
    "message-row " +
    (
      isAdmin
      ? "admin"
      : "user"
    );


  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "message-bubble";


  const text =
    document.createElement(
      "div"
    );

  text.className =
    "message-text";

  text.textContent =
    message.message || "";


  const time =
    document.createElement(
      "div"
    );

  time.className =
    "message-time";

  time.textContent =
    new Date(
      message.created_at
    ).toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );


  bubble.appendChild(
    text
  );

  bubble.appendChild(
    time
  );

  row.appendChild(
    bubble
  );


  return row;

}


/* =====================================================
   MARK READ
===================================================== */

async function markMessagesRead(){

  if(
    !currentUser ||
    !selectedUser
  ){

    return;

  }


  const {
    error
  } =
  await supabaseClient
    .from("Messages")
    .update({
      is_read:true
    })
    .eq(
      "sender_id",
      selectedUser.id
    )
    .eq(
      "receiver_id",
      currentUser.id
    )
    .eq(
      "is_read",
      false
    );


  if(error){

    console.error(
      "READ UPDATE ERROR:",
      error
    );

  }

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  if(
    !currentUser ||
    !selectedUser
  ){

    return;

  }


  const text =
    messageInput.value
      .trim();


  if(!text){

    return;

  }


  sendButton.disabled =
    true;


  const {
    error
  } =
  await supabaseClient
    .from("Messages")
    .insert({

      sender_id:
        currentUser.id,

      receiver_id:
        selectedUser.id,

      message:
        text,

      is_read:false

    });


  if(error){

    console.error(
      "SEND ERROR:",
      error
    );

    statusBar.textContent =
      "Message send करता आले नाही.";

    sendButton.disabled =
      false;

    return;

  }


  messageInput.value =
    "";


  sendButton.disabled =
    false;


  await loadConversation();

}


/* =====================================================
   SEND BUTTON
===================================================== */

sendButton.addEventListener(
  "click",
  sendMessage
);


/* =====================================================
   ENTER TO SEND
===================================================== */

messageInput.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =====================================================
   MOBILE BACK
===================================================== */

document
  .getElementById("mobileBack")
  .addEventListener(
    "click",
    function(){

      app.classList.remove(
        "show-chat"
      );

    }
  );


/* =====================================================
   SCROLL
===================================================== */

function scrollBottom(){

  setTimeout(
    function(){

      chat.scrollTop =
        chat.scrollHeight;

    },
    50
  );

}


/* =====================================================
   REALTIME
===================================================== */

function startRealtime(){

  if(
    realtimeChannel
  ){

    supabaseClient.removeChannel(
      realtimeChannel
    );

  }


  realtimeChannel =
    supabaseClient
      .channel(
        "admin-messages-" +
        currentUser.id
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"Messages"
        },
        function(payload){

          const message =
            payload.new;


          /*
             फक्त selected conversation
             असेल तर refresh.
          */

          if(
            selectedUser &&
            (
              (
                message.sender_id ===
                currentUser.id &&
                message.receiver_id ===
                selectedUser.id
              )
              ||
              (
                message.sender_id ===
                selectedUser.id &&
                message.receiver_id ===
                currentUser.id
              )
            )
          ){

            loadConversation();

          }

        }
      )
      .subscribe();

}


/* =====================================================
   START
===================================================== */

async function start(){

  statusBar.textContent =
    "Checking admin access...";


  currentUser =
    await getCurrentUser();


  /*
     Login नसल्यास page content दाखवू नका.
  */

  if(!currentUser){

    document.body.innerHTML =
      "";

    return;

  }


  /*
     Server-side RLS backed admin check.
  */

  const admin =
    await checkAdmin();


  if(!admin){

    /*
       Unauthorized user ला
       कोणताही admin data दाखवला जात नाही.
    */

    document.body.innerHTML =
      "";

    return;

  }


  statusBar.textContent =
    "Admin access verified";


  await loadUsers();


  startRealtime();

}


start();

</script>
