<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>GyanSetu - Messages</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#000;--tx:#f5f5f5;--mu:#a8a8a8;--ln:#262626;--cd:#262626;--bl:#0095f6;--gr:#2ee26b;--ig:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)}
[data-theme=light]{--bg:#fff;--tx:#262626;--mu:#737373;--ln:#dbdbdb;--cd:#efefef}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,Roboto,Arial,sans-serif;padding-bottom:calc(96px + env(safe-area-inset-bottom));overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:var(--tx);outline:0}
svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.hdr{position:sticky;top:0;z-index:50;height:52px;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--bg)}
.hdr h1{flex:1;font-size:20px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr button{padding:7px}
.sbx{padding:4px 14px 8px}.sbx input{width:100%;padding:10px 14px;border-radius:12px;border:0;background:var(--cd);font-size:16px}.sbx input::placeholder{color:var(--mu)}
.act-row{display:flex;gap:14px;padding:6px 14px 12px;overflow-x:auto}.act-row::-webkit-scrollbar{display:none}
.ao{display:flex;flex-direction:column;align-items:center;gap:4px;width:66px;flex-shrink:0;cursor:pointer;font-size:12px}
.ao span{max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mu)}
.tabs{display:flex;gap:6px;padding:0 14px 8px;overflow-x:auto;border-bottom:1px solid var(--ln)}.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:7px 14px;border-radius:9px;background:var(--cd);font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.tab.active{background:var(--tx);color:var(--bg)}
.tab .cnt{background:var(--bl);color:#fff;border-radius:10px;min-width:17px;height:17px;padding:0 5px;font-size:10px;display:flex;align-items:center;justify-content:center}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0}
.av-wrap{position:relative;flex-shrink:0}
.dot-online{position:absolute;right:1px;bottom:1px;width:15px;height:15px;border-radius:50%;background:var(--gr);border:3px solid var(--bg)}
.item{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer}.item:active{background:var(--cd)}
.mid{flex:1;min-width:0}
.name{font-size:15px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.tag{font-size:9px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--cd);color:var(--mu)}
.sub{margin-top:2px;font-size:14px;color:var(--mu);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sub.hot{color:var(--tx);font-weight:700}
.right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bl);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.empty,.error,.loading{text-align:center;color:var(--mu);padding:60px 24px;line-height:1.7}.error{color:#ff5470}
.loader{width:30px;height:30px;margin:0 auto 12px;border-radius:50%;border:3px solid var(--ln);border-top-color:var(--bl);animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.nav .av{border:2px solid transparent}
.overlay{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center}.overlay.show{display:flex}
.sheet{width:100%;max-width:560px;height:85vh;background:var(--bg);border-radius:18px 18px 0 0;border:1px solid var(--ln);display:flex;flex-direction:column}
.sheet-head{padding:16px 16px 6px;display:flex;align-items:center;justify-content:space-between}.sheet-head h3{font-size:16px}
.field{width:calc(100% - 32px);margin:8px 16px;padding:12px;background:var(--cd);border:0;border-radius:10px;font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px}
.chip{background:var(--cd);border-radius:16px;padding:5px 10px;font-size:12px;display:flex;gap:6px}.chip b{color:#ff5470;cursor:pointer}
.pick-list{flex:1;overflow-y:auto;padding:6px 16px}
.pick{display:flex;align-items:center;gap:12px;padding:8px 0;cursor:pointer}.pick .pn{flex:1;font-size:15px}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--ln);display:flex;align-items:center;justify-content:center;color:transparent;font-size:13px}
.pick.sel .check{background:var(--bl);border-color:var(--bl);color:#fff}
.sheet-foot{padding:12px 16px calc(16px + env(safe-area-inset-bottom))}
.btn{width:100%;padding:13px;border-radius:10px;background:var(--bl);color:#fff;font-weight:700}.btn:disabled{opacity:.4}
.gchat{position:fixed;inset:0;z-index:300;background:var(--bg);display:none;flex-direction:column}.gchat.show{display:flex}
.g-head{height:56px;padding:0 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--ln);flex-shrink:0}
.g-title{font-weight:700;font-size:15px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.g-members{font-size:12px;color:var(--mu);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:4px}
.bub{max-width:78%;padding:9px 13px;border-radius:20px;font-size:15px;line-height:1.4;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,#3797f0,#7b3ff2);color:#fff}
.bub.other{align-self:flex-start;background:var(--cd)}
.bub .who{font-size:11px;font-weight:700;margin-bottom:2px}.bub .t{font-size:10px;opacity:.6;text-align:right;margin-top:2px}
.day-sep{align-self:center;font-size:11px;color:var(--mu);margin:8px 0}
.composer{padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--ln);flex-shrink:0}
.composer textarea{flex:1;resize:none;max-height:110px;padding:11px 16px;background:none;border:1px solid var(--ln);border-radius:22px;font-size:16px}
.send{color:var(--bl);font-weight:700;padding:10px 6px}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);z-index:900;background:var(--cd);color:var(--tx);padding:10px 18px;border-radius:12px;font-size:13px;max-width:90%;display:none;text-align:center}.toast.show{display:block}

/* LIQUID GLASS NAV */
.nav{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,420px);height:64px;padding:6px;display:flex;align-items:center;border-radius:34px;z-index:100;isolation:isolate;
 background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.05));
 -webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);
 border:1px solid rgba(255,255,255,.24);
 box-shadow:0 14px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.07),inset 0 0 18px rgba(255,255,255,.05)}
.nav::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 100% at 15% 0%,rgba(255,255,255,.3),transparent 52%);opacity:.55;pointer-events:none;z-index:0}
.nav button{position:relative;z-index:2;flex:1;height:100%;display:flex;align-items:center;justify-content:center;color:var(--tx);opacity:.72;transition:opacity .25s,transform .2s;border-radius:28px}
.nav button:active{transform:scale(.88)}
.nav button.on{opacity:1}.nav button.on svg{stroke-width:2.6}
.nav .ind{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:28px;z-index:1;pointer-events:none;
 background:linear-gradient(180deg,rgba(255,255,255,.36),rgba(255,255,255,.12));
 border:1px solid rgba(255,255,255,.3);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -6px 12px rgba(255,255,255,.06),0 4px 14px rgba(0,0,0,.28);
 transition:transform .5s cubic-bezier(.34,1.45,.5,1),width .5s cubic-bezier(.34,1.45,.5,1)}
[data-theme=light] .nav{background:linear-gradient(135deg,rgba(255,255,255,.8),rgba(255,255,255,.5));border-color:rgba(255,255,255,.9);box-shadow:0 12px 30px rgba(0,0,0,.16),inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.05)}
[data-theme=light] .nav::before{opacity:.35}
[data-theme=light] .nav .ind{background:linear-gradient(180deg,rgba(0,0,0,.09),rgba(0,0,0,.04));border-color:rgba(0,0,0,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 3px 10px rgba(0,0,0,.1)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.nav{background:rgba(28,28,30,.92)}[data-theme=light] .nav{background:rgba(255,255,255,.95)}}
</style>
</head>
<body>
<header class="hdr">
  <button onclick="goBack()" id="bBack"></button>
  <h1 id="hTitle">Messages</h1>
  <button onclick="markAllRead()" id="bRead"></button>
  <button onclick="openNewGroup()" id="bNew"></button>
</header>
<div class="sbx"><input id="searchInput" type="text" placeholder="🔍 Search" autocomplete="off"></div>
<div class="act-row" id="actRow" style="display:none"></div>
<div class="tabs" id="tabs">
  <button class="tab active" data-tab="all">सर्व</button>
  <button class="tab" data-tab="unread">Unread <span class="cnt" id="cntUnread" style="display:none">0</span></button>
  <button class="tab" data-tab="groups">Groups</button>
  <button class="tab" data-tab="online">🟢 Online</button>
</div>
<div id="list"><div class="loading"><div class="loader"></div>Loading...</div></div>
<nav class="nav" id="nav"></nav>

<div class="overlay" id="groupOverlay"><div class="sheet">
  <div class="sheet-head"><h3>नवीन Group</h3><button onclick="closeNewGroup()" id="bX"></button></div>
  <input class="field" id="groupName" type="text" maxlength="40" placeholder="Group चे नाव">
  <div class="chips" id="chips"></div>
  <input class="field" id="pickSearch" type="text" placeholder="🔍 Members शोधा">
  <div class="pick-list" id="pickList"></div>
  <div class="sheet-foot"><button class="btn" id="createBtn" onclick="createGroup()" disabled>Group तयार करा</button></div>
</div></div>

<div class="gchat" id="gchat">
  <div class="g-head"><button onclick="closeGroupChat()" id="gBack"></button><div class="av" id="gAv" style="width:36px;height:36px"></div>
    <div style="min-width:0;flex:1"><div class="g-title" id="gTitle"></div><div class="g-members" id="gMembers"></div></div></div>
  <div class="msgs" id="msgs"></div>
  <div class="composer"><textarea id="gInput" rows="1" placeholder="Message..."></textarea><button class="send" onclick="sendGroupMessage()">Send</button></div>
</div>
<div class="toast" id="toast"></div>

<script>
const sb=supabase.createClient("https://eqglttfffhvoyvrclzse.supabase.co","sb_publishable_rR4xxl0dW5DJrhhjqiFHLw_uJ-HakAb");
try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("gs_theme")||'"dark"')}catch(e){}
const $=id=>document.getElementById(id);

/* ICONS + NAV (videos page सारखेच) */
const P={home:'<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/>',reel:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M3 9h18M9 3l3 6M15 3l3 6"/><path d="M10 13l5 3-5 3z"/>',send:'<path d="M22 3L9.500 13.500M22 3l-7 18-5.500-7.500L2 9z"/>',back:'<path d="M15 5l-7 7 7 7"/>',x:'<path d="M5 5l14 14M19 5L5 19"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>',check:'<path d="M2 13l4 4L14 8M10 15l2 2L21 8"/>'};
const ic=n=>`<svg viewBox="0 0 24 24">${P[n]}</svg>`;
$("bBack").innerHTML=ic("back");$("bRead").innerHTML=ic("check");$("bNew").innerHTML=ic("edit");$("bX").innerHTML=ic("x");$("gBack").innerHTML=ic("back");
function buildNav(name){$("nav").innerHTML=`<button onclick="location.href='timepass.html'">${ic("home")}</button><button onclick="location.href='reels.html'">${ic("reel")}</button><button class="on">${ic("send")}</button><button onclick="location.href='vibesearch.html'">${ic("search")}</button><button onclick="location.href='insta.html'"><div class="av" style="width:26px;height:26px;font-size:11px;background:linear-gradient(135deg,#ff28cf,#416cff)">${esc(String(name||"?")[0].toUpperCase())}</div></button>`}
buildNav("?");

/* STATE */
let me=null,allUsers=[],usersMap={},unreadMessages={},lastMsg={},groups=[],groupsMap={},groupLast={},groupUnread={},onlineSet=new Set();
let activeTab="all",openGroupId=null,renderedMsgIds=new Set(),selectedMembers=new Set(),realtimeChannel=null,presenceChannel=null;

/* HELPERS */
function esc(t){return String(t??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
const PAL=[["#ff2d95","#7b3ff2"],["#2979ff","#00c6ff"],["#7b3ff2","#ff2d95"],["#00c6ff","#7b3ff2"],["#ff5fa8","#2979ff"],["#4c6fff","#ff2d95"]];
function pair(id){let h=0;const s=String(id);for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return PAL[h%PAL.length]}
const avStyle=id=>`background:linear-gradient(135deg,${pair(id)[0]},${pair(id)[1]})`;
const userName=u=>u?.username||u?.full_name||"GyanSetu User";
function msgText(m){const t=m?.content??m?.message??m?.text??m?.body??"";return String(t).startsWith("VIDEO:")?"🎬 Video पाठवला":t}
function fmtTime(iso){if(!iso)return"";const d=new Date(iso),n=new Date();if(d.toDateString()===n.toDateString())return d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:true});const y=new Date();y.setDate(n.getDate()-1);if(d.toDateString()===y.toDateString())return"काल";return d.toLocaleDateString("en-IN",{day:"2-digit",month:"2-digit",year:"2-digit"})}
const fmtClock=iso=>new Date(iso).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:true});
function dayLabel(iso){const d=new Date(iso),n=new Date();if(d.toDateString()===n.toDateString())return"आज";const y=new Date();y.setDate(n.getDate()-1);if(d.toDateString()===y.toDateString())return"काल";return d.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2800)}
const seenKey=g=>"gs_seen_"+(me?.id||"")+"_"+g;
function getSeen(g){try{return localStorage.getItem(seenKey(g))||""}catch(e){return""}}
function setSeen(g,iso){try{localStorage.setItem(seenKey(g),iso)}catch(e){}}

/* AUTH + LOAD */
async function getCurrentUser(){try{const {data,error}=await sb.auth.getUser();if(error){console.error(error);return null}me=data?.user||null;return me}catch(e){console.error(e);return null}}
async function loadUsers(){
  const {data,error}=await sb.from("Profiles").select("*").order("username",{ascending:true});if(error)throw error;
  usersMap={};(data||[]).forEach(u=>usersMap[u.id]=u);allUsers=(data||[]).filter(u=>u.id!==me.id);
  const mn=userName(usersMap[me.id]);$("hTitle").textContent=usersMap[me.id]?mn:"Messages";buildNav(mn);
}
async function loadDirectMessages(){
  unreadMessages={};lastMsg={};
  const {data,error}=await sb.from("Messages").select("*").or(`sender_id.eq.${me.id},receiver_id.eq.${me.id}`).order("created_at",{ascending:false}).limit(600);
  if(error){console.error("Messages error:",error);return}
  (data||[]).forEach(m=>{const mine=m.sender_id===me.id,o=mine?m.receiver_id:m.sender_id;
    if(!lastMsg[o])lastMsg[o]={text:msgText(m),time:m.created_at,mine};
    if(!mine&&m.is_read===false)unreadMessages[o]=(unreadMessages[o]||0)+1});
}
async function loadGroups(){
  groups=[];groupsMap={};groupLast={};groupUnread={};
  const {data:mine,error}=await sb.from("GroupMembers").select("group_id").eq("user_id",me.id);
  if(error){console.warn("Groups tables नाहीत:",error.message);return}
  const ids=(mine||[]).map(r=>r.group_id);if(!ids.length)return;
  const [g,mem,msgs]=await Promise.all([sb.from("Groups").select("*").in("id",ids),sb.from("GroupMembers").select("group_id,user_id").in("group_id",ids),sb.from("GroupMessages").select("*").in("group_id",ids).order("created_at",{ascending:false}).limit(600)]);
  (g.data||[]).forEach(gr=>{gr.members=[];groupsMap[gr.id]=gr;groups.push(gr)});
  (mem.data||[]).forEach(r=>{groupsMap[r.group_id]?.members.push(r.user_id)});
  (msgs.data||[]).forEach(m=>{if(!groupLast[m.group_id])groupLast[m.group_id]={text:m.content,time:m.created_at,sender:m.sender_id};
    const seen=getSeen(m.group_id);if(m.sender_id!==me.id&&(!seen||m.created_at>seen))groupUnread[m.group_id]=(groupUnread[m.group_id]||0)+1});
}
async function refreshAll(){
  $("list").innerHTML=`<div class="loading"><div class="loader"></div>Loading...</div>`;
  try{
    if(!me)await getCurrentUser();
    if(!me){$("list").innerHTML=`<div class="error">🔐 Login required.</div>`;return}
    await loadUsers();await Promise.all([loadDirectMessages(),loadGroups()]);render();
  }catch(e){console.error(e);$("list").innerHTML=`<div class="error">Load झाले नाही.<br>${esc(e.message||e)}</div>`}
}

/* RENDER */
function buildItems(){
  const items=[];
  allUsers.forEach(u=>{const lm=lastMsg[u.id];items.push({type:"user",id:u.id,name:userName(u),email:u.email||"",sub:lm?(lm.mine?"You: ":"")+lm.text:(u.email||"GyanSetu member"),time:lm?.time||"",unread:unreadMessages[u.id]||0,online:onlineSet.has(u.id)})});
  groups.forEach(g=>{const gl=groupLast[g.id];let sub=`${g.members.length} members`;
    if(gl){const who=gl.sender===me.id?"You":userName(usersMap[gl.sender]).split(" ")[0];sub=`${who}: ${gl.text}`}
    items.push({type:"group",id:g.id,name:g.name,email:"",sub,time:gl?.time||g.created_at||"",unread:groupUnread[g.id]||0,online:false})});
  items.sort((a,b)=>a.time&&b.time?(a.time<b.time?1:-1):a.time?-1:b.time?1:a.name.localeCompare(b.name));
  return items;
}
function render(){
  const q=$("searchInput").value.toLowerCase().trim();let items=buildItems();
  const tu=items.filter(i=>i.unread>0).length,c=$("cntUnread");c.textContent=tu;c.style.display=tu?"flex":"none";
  const on=allUsers.filter(u=>onlineSet.has(u.id));
  $("actRow").style.display=on.length?"flex":"none";
  $("actRow").innerHTML=on.map(u=>`<div class="ao" data-type="user" data-id="${esc(u.id)}"><div class="av-wrap"><div class="av" style="width:56px;height:56px;font-size:22px;${avStyle(u.id)}">${esc(userName(u)[0].toUpperCase())}</div><span class="dot-online"></span></div><span>${esc(userName(u))}</span></div>`).join("");
  if(activeTab==="unread")items=items.filter(i=>i.unread>0);
  if(activeTab==="groups")items=items.filter(i=>i.type==="group");
  if(activeTab==="online")items=items.filter(i=>i.type==="user"&&i.online);
  if(q)items=items.filter(i=>i.name.toLowerCase().includes(q)||i.email.toLowerCase().includes(q));
  if(!items.length){
    let m="सध्या काहीही उपलब्ध नाही.";
    if(q)m=`"<b>${esc(q)}</b>" साठी काही सापडले नाही.`;else if(activeTab==="unread")m="✅ सगळे messages वाचले आहेत!";else if(activeTab==="groups")m="अजून कोणताही Group नाही.<br>वरच्या ✏️ ने नवीन Group बनवा.";else if(activeTab==="online")m="सध्या कोणी online नाही.";
    $("list").innerHTML=`<div class="empty">${m}</div>`;return;
  }
  $("list").innerHTML=items.map(i=>{const hot=i.unread>0;return`<div class="item" data-type="${i.type}" data-id="${esc(i.id)}">
    <div class="av-wrap"><div class="av" style="width:56px;height:56px;font-size:${i.type==="group"?24:22}px;${avStyle(i.id)}">${i.type==="group"?"👥":esc(i.name.charAt(0).toUpperCase()||"?")}</div>${i.online?'<span class="dot-online"></span>':""}</div>
    <div class="mid"><div class="name" style="${hot?"font-weight:700":""}">${esc(i.name)}${i.type==="group"?'<span class="tag">GROUP</span>':""}</div>
    <div class="sub ${hot?"hot":""}">${esc(i.sub)}${i.time?" · "+fmtTime(i.time):""}</div></div>
    <div class="right">${hot?`<span class="badge">${i.unread>99?"99+":i.unread}</span>`:""}</div></div>`}).join("");
}

/* EVENTS */
function openItem(e){const el=e.target.closest("[data-id]");if(!el)return;const id=el.dataset.id;if(el.dataset.type==="group")openGroupChat(id);else openChat(id)}
$("list").addEventListener("click",openItem);$("actRow").addEventListener("click",openItem);
$("tabs").addEventListener("click",e=>{const t=e.target.closest(".tab");if(!t)return;activeTab=t.dataset.tab;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===t));render()});
$("searchInput").addEventListener("input",render);
$("searchInput").addEventListener("keydown",e=>{if(e.key==="Escape"){e.target.value="";render()}});

/* DIRECT CHAT */
async function openChat(uid){
  if(!uid)return;
  if(me){try{await sb.from("Messages").update({is_read:true}).eq("sender_id",uid).eq("receiver_id",me.id).eq("is_read",false)}catch(e){console.error(e)}}
  location.href="message.html?id="+encodeURIComponent(uid);
}
async function markAllRead(){
  if(!me)return;
  try{await sb.from("Messages").update({is_read:true}).eq("receiver_id",me.id).eq("is_read",false);unreadMessages={};const now=new Date().toISOString();groups.forEach(g=>setSeen(g.id,now));groupUnread={};render();toast("✓✓ सर्व messages वाचले")}catch(e){toast("काहीतरी चुकले")}
}

/* NEW GROUP */
function openNewGroup(){selectedMembers=new Set();$("groupName").value="";$("pickSearch").value="";$("groupOverlay").classList.add("show");renderPick();updateCreateBtn()}
function closeNewGroup(){$("groupOverlay").classList.remove("show")}
function renderPick(){
  const q=$("pickSearch").value.toLowerCase().trim(),list=allUsers.filter(u=>!q||userName(u).toLowerCase().includes(q));
  $("pickList").innerHTML=list.length?list.map(u=>`<div class="pick ${selectedMembers.has(u.id)?"sel":""}" data-id="${esc(u.id)}"><div class="av" style="width:42px;height:42px;font-size:17px;${avStyle(u.id)}">${esc(userName(u)[0].toUpperCase())}</div><div class="pn">${esc(userName(u))}</div><div class="check">✓</div></div>`).join(""):`<div class="empty">कोणी सापडले नाही</div>`;
  $("chips").innerHTML=[...selectedMembers].map(id=>`<span class="chip">${esc(userName(usersMap[id]))} <b data-rm="${esc(id)}">✕</b></span>`).join("");
}
function updateCreateBtn(){$("createBtn").disabled=!($("groupName").value.trim()&&selectedMembers.size>=1)}
$("pickList").addEventListener("click",e=>{const p=e.target.closest(".pick");if(!p)return;const id=p.dataset.id;selectedMembers.has(id)?selectedMembers.delete(id):selectedMembers.add(id);renderPick();updateCreateBtn()});
$("chips").addEventListener("click",e=>{const id=e.target.dataset.rm;if(!id)return;selectedMembers.delete(id);renderPick();updateCreateBtn()});
$("pickSearch").addEventListener("input",renderPick);$("groupName").addEventListener("input",updateCreateBtn);
$("groupOverlay").addEventListener("click",e=>{if(e.target.id==="groupOverlay")closeNewGroup()});
async function createGroup(){
  const name=$("groupName").value.trim();if(!name||!selectedMembers.size)return;
  const btn=$("createBtn");btn.disabled=true;btn.textContent="तयार होत आहे...";
  try{
    const {data:g,error}=await sb.from("Groups").insert({name,created_by:me.id}).select().single();if(error)throw error;
    const {error:e2}=await sb.from("GroupMembers").insert([me.id,...selectedMembers].map(uid=>({group_id:g.id,user_id:uid})));if(e2)throw e2;
    closeNewGroup();await loadGroups();render();toast("✅ Group तयार झाला!");openGroupChat(g.id);
  }catch(e){console.error(e);toast("Group बनला नाही: "+(e.message||e))}
  finally{btn.textContent="Group तयार करा";updateCreateBtn()}
}

/* GROUP CHAT */
async function openGroupChat(gid){
  const g=groupsMap[gid];if(!g)return;openGroupId=gid;renderedMsgIds=new Set();
  $("gAv").style.cssText=`width:36px;height:36px;${avStyle(gid)}`;$("gAv").textContent="👥";$("gTitle").textContent=g.name;
  $("gMembers").textContent=g.members.map(id=>id===me.id?"You":userName(usersMap[id]).split(" ")[0]).join(", ");
  $("msgs").innerHTML=`<div class="loading"><div class="loader"></div></div>`;$("gchat").classList.add("show");
  const {data,error}=await sb.from("GroupMessages").select("*").eq("group_id",gid).order("created_at",{ascending:true}).limit(300);
  $("msgs").innerHTML="";
  if(error){$("msgs").innerHTML=`<div class="error">${esc(error.message)}</div>`;return}
  if(!data.length)$("msgs").innerHTML=`<div class="empty">💬 पहिला message पाठवा!</div>`;
  let ld="";data.forEach(m=>{ld=appendMsg(m,ld,true)});scrollBottom();
  setSeen(gid,data.length?data[data.length-1].created_at:new Date().toISOString());groupUnread[gid]=0;render();
}
function appendMsg(m,lastDay,silent){
  if(renderedMsgIds.has(m.id))return lastDay;renderedMsgIds.add(m.id);
  const box=$("msgs"),em=box.querySelector(".empty");if(em)em.remove();
  const day=new Date(m.created_at).toDateString();
  if(day!==lastDay){const s=document.createElement("div");s.className="day-sep";s.textContent=dayLabel(m.created_at);box.appendChild(s)}
  const mine=m.sender_id===me.id,d=document.createElement("div");d.className="bub "+(mine?"me":"other");
  const who=mine?"":`<div class="who" style="color:${pair(m.sender_id)[0]}">${esc(userName(usersMap[m.sender_id]))}</div>`;
  d.innerHTML=`${who}<div>${esc(m.content).replace(/\n/g,"<br>")}</div><div class="t">${fmtClock(m.created_at)}</div>`;
  box.appendChild(d);if(!silent)scrollBottom();return day;
}
function scrollBottom(){const b=$("msgs");b.scrollTop=b.scrollHeight}
function closeGroupChat(){$("gchat").classList.remove("show");openGroupId=null;render()}
async function sendGroupMessage(){
  const i=$("gInput"),text=i.value.trim();if(!text||!openGroupId)return;i.value="";i.style.height="auto";
  const {data,error}=await sb.from("GroupMessages").insert({group_id:openGroupId,sender_id:me.id,content:text}).select().single();
  if(error){toast("Send झाले नाही: "+error.message);i.value=text;return}
  appendMsg(data,new Date().toDateString());
  groupLast[openGroupId]={text:data.content,time:data.created_at,sender:me.id};setSeen(openGroupId,data.created_at);
}
$("gInput").addEventListener("input",function(){this.style.height="auto";this.style.height=Math.min(this.scrollHeight,110)+"px"});
$("gInput").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&innerWidth>700){e.preventDefault();sendGroupMessage()}});

/* REALTIME */
function startRealtime(){
  if(!me)return;if(realtimeChannel)sb.removeChannel(realtimeChannel);
  realtimeChannel=sb.channel("gyansetu-main-"+me.id)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"Messages",filter:"receiver_id=eq."+me.id},p=>{const m=p.new;if(!m?.sender_id||m.sender_id===me.id)return;unreadMessages[m.sender_id]=(unreadMessages[m.sender_id]||0)+1;lastMsg[m.sender_id]={text:msgText(m),time:m.created_at,mine:false};render()})
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"Profiles"},async()=>{await loadUsers();render()})
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"GroupMessages"},p=>{const m=p.new;if(!groupsMap[m.group_id])return;groupLast[m.group_id]={text:m.content,time:m.created_at,sender:m.sender_id};
      if(m.sender_id===me.id){render();return}
      if(openGroupId===m.group_id){appendMsg(m,new Date().toDateString());setSeen(m.group_id,m.created_at)}else groupUnread[m.group_id]=(groupUnread[m.group_id]||0)+1;render()})
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"GroupMembers",filter:"user_id=eq."+me.id},async()=>{await loadGroups();render()})
    .subscribe();
  if(presenceChannel)sb.removeChannel(presenceChannel);
  presenceChannel=sb.channel("gyansetu-presence",{config:{presence:{key:me.id}}});
  presenceChannel.on("presence",{event:"sync"},()=>{onlineSet=new Set(Object.keys(presenceChannel.presenceState()));onlineSet.delete(me.id);render()})
    .subscribe(async s=>{if(s==="SUBSCRIBED")await presenceChannel.track({at:Date.now()})});
}
function goBack(){if(openGroupId){closeGroupChat();return}if(document.referrer)history.back();else location.href="timepass.html"}

(async function(){await getCurrentUser();if(!me){$("list").innerHTML=`<div class="error">🔐 Login required.</div>`;return}await refreshAll();startRealtime()})();
</script>

i.style.width=(b.offsetWidth-6)+"px";i.style.transform="translateX("+(b.offsetLeft+3)+"px)"}
new MutationObserver(go).observe(n,{childList:true,subtree:true,attributes:true,attributeFilter:["class"]});
addEventListener("resize",go);addEventListener("load",go);go()})();
