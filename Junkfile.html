<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GyanSetu Admin Messages</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f8ff;
  color:#172033;
  height:100vh;
  overflow:hidden;
}

.app{
  display:flex;
  height:100vh;
}

/* USERS */

.users-panel{
  width:330px;
  background:white;
  border-right:1px solid #dce6f5;
  display:flex;
  flex-direction:column;
}

.header{
  background:#0d6efd;
  color:white;
  padding:18px;
}

.header h2{
  font-size:21px;
}

.header p{
  font-size:13px;
  margin-top:5px;
  opacity:.9;
}

.search-box{
  padding:12px;
  border-bottom:1px solid #e5eaf2;
}

.search-box input{
  width:100%;
  padding:11px 13px;
  border:1px solid #d7e0ee;
  border-radius:10px;
  outline:none;
  font-size:14px;
}

.search-box input:focus{
  border-color:#0d6efd;
}

.users{
  flex:1;
  overflow-y:auto;
}

.user{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  cursor:pointer;
  border-bottom:1px solid #edf1f7;
  transition:.2s;
}

.user:hover{
  background:#f1f6ff;
}

.user.active{
  background:#e8f1ff;
}

.avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#0d6efd;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:18px;
  flex-shrink:0;
}

.user-info{
  min-width:0;
}

.username{
  font-weight:bold;
  font-size:15px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.user-id{
  font-size:11px;
  color:#7b8799;
  margin-top:3px;
}

/* CHAT */

.chat-panel{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.chat-header{
  height:70px;
  background:white;
  border-bottom:1px solid #dce6f5;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 18px;
}

.back-btn{
  display:none;
  border:0;
  background:#edf4ff;
  color:#0d6efd;
  width:40px;
  height:40px;
  border-radius:10px;
  font-size:20px;
  cursor:pointer;
}

.chat-avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#0d6efd;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.chat-user-name{
  font-size:16px;
  font-weight:bold;
}

.chat-status{
  font-size:12px;
  color:#7b8799;
  margin-top:3px;
}

.messages{
  flex:1;
  padding:20px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.empty{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#7b8799;
  padding:30px;
}

.empty-box h3{
  color:#334155;
  margin-bottom:7px;
}

.message{
  max-width:75%;
  padding:10px 13px;
  border-radius:14px;
  line-height:1.4;
  font-size:14px;
  word-wrap:break-word;
}

.message.admin{
  align-self:flex-end;
  background:#0d6efd;
  color:white;
  border-bottom-right-radius:4px;
}

.message.user{
  align-self:flex-start;
  background:white;
  color:#172033;
  border:1px solid #e0e7f1;
  border-bottom-left-radius:4px;
}

.time{
  font-size:10px;
  margin-top:4px;
  opacity:.7;
}

.input-area{
  background:white;
  border-top:1px solid #dce6f5;
  padding:12px;
  display:flex;
  gap:10px;
}

.input-area textarea{
  flex:1;
  resize:none;
  height:45px;
  max-height:120px;
  border:1px solid #d7e0ee;
  border-radius:12px;
  padding:12px;
  outline:none;
  font-size:14px;
}

.input-area textarea:focus{
  border-color:#0d6efd;
}

.send-btn{
  width:55px;
  border:none;
  border-radius:12px;
  background:#0d6efd;
  color:white;
  cursor:pointer;
  font-size:18px;
}

.send-btn:disabled{
  background:#a9c7f5;
  cursor:not-allowed;
}

.loading{
  padding:20px;
  text-align:center;
  color:#7b8799;
}

/* MOBILE */

@media(max-width:700px){

  .users-panel{
    width:100%;
  }

  .chat-panel{
    display:none;
    width:100%;
  }

  .app.chat-open .users-panel{
    display:none;
  }

  .app.chat-open .chat-panel{
    display:flex;
  }

  .back-btn{
    display:block;
  }

  .message{
    max-width:85%;
  }

}
</style>
</head>

<body>

<div class="app" id="app">

  <!-- USERS PANEL -->
  <div class="users-panel">

    <div class="header">
      <h2>GyanSetu Admin</h2>
      <p>Messages</p>
    </div>

    <div class="search-box">
      <input
        type="text"
        id="search"
        placeholder="Search users..."
        autocomplete="off"
      >
    </div>

    <div class="users" id="users">
      <div class="loading">Loading users...</div>
    </div>

  </div>


  <!-- CHAT PANEL -->
  <div class="chat-panel">

    <div class="chat-header">

      <button class="back-btn" id="backBtn">
        ←
      </button>

      <div class="chat-avatar" id="chatAvatar">
        ?
      </div>

      <div>
        <div class="chat-user-name" id="chatName">
          Select a user
        </div>

        <div class="chat-status" id="chatStatus">
          GyanSetu Messages
        </div>
      </div>

    </div>


    <div class="messages" id="messages">

      <div class="empty">
        <div class="empty-box">
          <h3>GyanSetu Messages</h3>
          <p>Select a user to start chatting.</p>
        </div>
      </div>

    </div>


    <div class="input-area">

      <textarea
        id="messageInput"
        placeholder="Type a message..."
        disabled
      ></textarea>

      <button
        class="send-btn"
        id="sendBtn"
        disabled
      >
        ➤
      </button>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://eqglttfffhvoyvrclzse.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rR4xxl0dW5DJrhhjqiFHLw_uJ-HakAb";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// ELEMENTS

const app = document.getElementById("app");
const usersBox = document.getElementById("users");
const searchInput = document.getElementById("search");

const messagesBox =
document.getElementById("messages");

const chatName =
document.getElementById("chatName");

const chatAvatar =
document.getElementById("chatAvatar");

const chatStatus =
document.getElementById("chatStatus");

const messageInput =
document.getElementById("messageInput");

const sendBtn =
document.getElementById("sendBtn");

const backBtn =
document.getElementById("backBtn");


let currentUser = null;
let selectedUser = null;
let allUsers = [];


// INITIALIZE

init();


async function init(){

  const {
    data: sessionData,
    error: sessionError
  } = await supabaseClient.auth.getSession();

  if(sessionError || !sessionData.session){
    blockPage();
    return;
  }

  currentUser =
    sessionData.session.user;

  // ADMIN CHECK

  const {
    data: adminData,
    error: adminError
  } = await supabaseClient
    .from("admin_users")
    .select("user_id")
    .eq("user_id", currentUser.id)
    .maybeSingle();

  if(adminError || !adminData){
    blockPage();
    return;
  }

  await loadUsers();

  setupRealtime();
}


// BLOCK NON ADMIN

function blockPage(){

  document.body.innerHTML = "";

  document.body.style.background = "#ffffff";
}


// LOAD USERS

async function loadUsers(){

  usersBox.innerHTML =
    '<div class="loading">Loading users...</div>';

  const {
    data,
    error
  } = await supabaseClient
    .from("Profiles")
    .select("id,username")
    .neq("id", currentUser.id)
    .order("username");

  if(error){

    usersBox.innerHTML =
      '<div class="loading">Unable to load users.</div>';

    console.error(error);

    return;
  }

  allUsers = data || [];

  renderUsers(allUsers);
}


// RENDER USERS

function renderUsers(users){

  usersBox.innerHTML = "";

  if(!users.length){

    usersBox.innerHTML =
      '<div class="loading">No users found.</div>';

    return;
  }

  users.forEach(user => {

    const div =
      document.createElement("div");

    div.className = "user";

    div.dataset.id = user.id;

    const name =
      user.username || "User";

    const initial =
      name.charAt(0).toUpperCase();

    div.innerHTML = `
      <div class="avatar">
        ${escapeHTML(initial)}
      </div>

      <div class="user-info">

        <div class="username">
          ${escapeHTML(name)}
        </div>

        <div class="user-id">
          ${escapeHTML(user.id)}
        </div>

      </div>
    `;

    div.addEventListener(
      "click",
      () => selectUser(user)
    );

    usersBox.appendChild(div);

  });

}


// SEARCH

searchInput.addEventListener(
  "input",
  () => {

    const value =
      searchInput.value
        .toLowerCase()
        .trim();

    const filtered =
      allUsers.filter(user =>
        (user.username || "")
          .toLowerCase()
          .includes(value)
      );

    renderUsers(filtered);

  }
);


// SELECT USER

async function selectUser(user){

  selectedUser = user;

  document
    .querySelectorAll(".user")
    .forEach(el => {

      el.classList.toggle(
        "active",
        el.dataset.id === user.id
      );

    });

  const name =
    user.username || "User";

  chatName.textContent = name;

  chatAvatar.textContent =
    name.charAt(0).toUpperCase();

  chatStatus.textContent =
    "Online / Messages";

  messageInput.disabled = false;
  sendBtn.disabled = false;

  app.classList.add("chat-open");

  await loadMessages();

}


// LOAD MESSAGES

async function loadMessages(){

  if(!selectedUser) return;

  messagesBox.innerHTML =
    '<div class="loading">Loading messages...</div>';

  const {
    data,
    error
  } = await supabaseClient
    .from("Messages")
    .select("*")
    .or(
      `and(sender_id.eq.${currentUser.id},receiver_id.eq.${selectedUser.id}),and(sender_id.eq.${selectedUser.id},receiver_id.eq.${currentUser.id})`
    )
    .order("created_at", {
      ascending:true
    });

  if(error){

    console.error(error);

    messagesBox.innerHTML =
      '<div class="loading">Unable to load messages.</div>';

    return;
  }

  messagesBox.innerHTML = "";

  if(!data || data.length === 0){

    messagesBox.innerHTML = `
      <div class="empty">
        <div class="empty-box">
          <h3>No messages yet</h3>
          <p>Start the conversation.</p>
        </div>
      </div>
    `;

    return;
  }

  data.forEach(message => {

    addMessageToScreen(
      message,
      false
    );

  });

  scrollToBottom();

  // MARK USER MESSAGES READ

  await supabaseClient
    .from("Messages")
    .update({is_read:true})
    .eq("sender_id", selectedUser.id)
    .eq("receiver_id", currentUser.id)
    .eq("is_read", false);

}


// ADD MESSAGE

function addMessageToScreen(
  message,
  scroll=true
){

  const div =
    document.createElement("div");

  const isAdmin =
    message.sender_id === currentUser.id;

  div.className =
    "message " +
    (isAdmin ? "admin" : "user");

  const time =
    message.created_at
      ? new Date(message.created_at)
          .toLocaleTimeString([],{
            hour:"2-digit",
            minute:"2-digit"
          })
      : "";

  div.innerHTML = `
    <div>
      ${escapeHTML(message.message || "")}
    </div>

    <div class="time">
      ${time}
    </div>
  `;

  messagesBox.appendChild(div);

  if(scroll){
    scrollToBottom();
  }

}


// SEND MESSAGE

async function sendMessage(){

  if(!selectedUser) return;

  const text =
    messageInput.value.trim();

  if(!text) return;

  sendBtn.disabled = true;

  const {
    error
  } = await supabaseClient
    .from("Messages")
    .insert({

      sender_id: currentUser.id,

      receiver_id:
        selectedUser.id,

      message:text,

      is_read:false

    });

  if(error){

    console.error(error);

    sendBtn.disabled = false;

    return;
  }

  messageInput.value = "";

  sendBtn.disabled = false;

  messageInput.focus();

}


// SEND BUTTON

sendBtn.addEventListener(
  "click",
  sendMessage
);


// ENTER TO SEND

messageInput.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


// MOBILE BACK

backBtn.addEventListener(
  "click",
  () => {

    app.classList.remove(
      "chat-open"
    );

    selectedUser = null;

    messageInput.disabled = true;
    sendBtn.disabled = true;

  }
);


// REALTIME

function setupRealtime(){

  supabaseClient
    .channel("admin-messages-channel")

    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"Messages"
      },
      payload => {

        const message =
          payload.new;

        if(!selectedUser) return;

        const belongsToChat =
          (
            message.sender_id ===
              currentUser.id &&
            message.receiver_id ===
              selectedUser.id
          )
          ||
          (
            message.sender_id ===
              selectedUser.id &&
            message.receiver_id ===
              currentUser.id
          );

        if(!belongsToChat) return;

        // Prevent duplicate message
        // if it already exists visually.

        addMessageToScreen(
          message,
          true
        );

        // Mark incoming message read

        if(
          message.sender_id ===
          selectedUser.id
        ){

          supabaseClient
            .from("Messages")
            .update({
              is_read:true
            })
            .eq("id",message.id);

        }

      }
    )

    .subscribe();

}


// SCROLL

function scrollToBottom(){

  messagesBox.scrollTop =
    messagesBox.scrollHeight;

}


// HTML ESCAPE

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
