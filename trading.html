<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>GyanSetu - Trading शिकूया</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
}

body{
  background:#f3f7ff;
  color:#172554;
}

.app{
  width:100%;
  max-width:430px;
  min-height:100vh;
  margin:auto;
  background:#f3f7ff;
  padding-bottom:110px;
}

/* HEADER */

.header{
  background:linear-gradient(135deg,#1769e0,#4d9cff);
  color:white;
  padding:18px 16px 22px;
  border-radius:0 0 25px 25px;
}

.top{
  display:flex;
  align-items:center;
  gap:12px;
}

.back{
  width:40px;
  height:40px;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  color:white;
  font-size:22px;
  cursor:pointer;
}

.header h1{
  font-size:21px;
}

.header p{
  margin-top:12px;
  font-size:14px;
  opacity:.95;
}

/* DAILY TRADING BUTTON */

.dailyBtn{
  width:40px;
  height:40px;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  color:white;
  font-size:20px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.2s;
  flex-shrink:0;
}

.dailyBtn:active{
  transform:scale(.90);
}

/* XP */

.xpBox{
  margin:15px;
  background:white;
  border-radius:18px;
  padding:16px;
  box-shadow:0 5px 18px rgba(23,105,224,.10);
}

.xpTop{
  display:flex;
  justify-content:space-between;
  font-weight:bold;
  margin-bottom:9px;
}

.progress{
  height:9px;
  background:#e6edf8;
  border-radius:20px;
  overflow:hidden;
}

.progressFill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#1769e0,#4d9cff);
  transition:.4s;
}

/* REVISION CARD (home) */

.revBox{
  margin:0 15px 6px;
  background:linear-gradient(135deg,#7c3aed,#a78bfa);
  color:white;
  border-radius:18px;
  padding:16px;
  display:flex;
  align-items:center;
  gap:13px;
  cursor:pointer;
  box-shadow:0 6px 18px rgba(124,58,237,.25);
}

.revBox:active{
  transform:scale(.98);
}

.revIcon{
  font-size:30px;
}

.revBox h3{
  font-size:16px;
  margin-bottom:4px;
}

.revBox p{
  font-size:12px;
  opacity:.92;
}

/* LESSONS */

.sectionTitle{
  padding:14px 15px 10px;
  font-size:18px;
}

.lesson{
  margin:10px 15px;
  background:white;
  border-radius:18px;
  padding:16px;
  display:flex;
  align-items:center;
  gap:13px;
  box-shadow:0 4px 14px rgba(0,0,0,.06);
  cursor:pointer;
  transition:.2s;
}

.lesson:active{
  transform:scale(.98);
}

.lesson.locked{
  opacity:.55;
  cursor:not-allowed;
}

.icon{
  width:48px;
  height:48px;
  border-radius:14px;
  background:#eaf2ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
}

.lessonInfo{
  flex:1;
}

.lessonInfo h3{
  font-size:15px;
  margin-bottom:5px;
}

.lessonInfo p{
  font-size:12px;
  color:#64748b;
}

.status{
  font-size:20px;
}

/* POPUP */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:300;
  padding:20px;
}

.modal{
  max-width:430px;
  margin:30px auto;
  background:white;
  border-radius:23px;
  max-height:88vh;
  overflow:auto;
  padding:20px;
}

.modal h2{
  color:#1769e0;
  margin-bottom:12px;
}

.close{
  float:right;
  border:none;
  background:#eef4ff;
  width:35px;
  height:35px;
  border-radius:50%;
  font-size:20px;
  cursor:pointer;
}

.lessonText{
  line-height:1.7;
  font-size:14px;
  color:#334155;
}

.lessonText p{
  margin-bottom:10px;
}

.example{
  margin:14px 0;
  padding:14px;
  background:#eef5ff;
  border-left:4px solid #1769e0;
  border-radius:10px;
}

/* MEMORY BOXES */

.keyBox{
  margin:14px 0;
  padding:14px;
  background:#fff8e1;
  border:2px dashed #f5b301;
  border-radius:14px;
}

.keyBox h4{
  font-size:15px;
  margin-bottom:8px;
  color:#92400e;
}

.keyBox ul{
  padding-left:20px;
  font-size:14px;
  line-height:1.7;
  color:#5b4300;
}

.trickBox{
  margin:14px 0;
  padding:14px;
  background:#f3e8ff;
  border-left:5px solid #7c3aed;
  border-radius:12px;
  font-size:14px;
  line-height:1.7;
  color:#4c1d95;
}

.trickBox b{
  display:block;
  margin-bottom:4px;
}

.nextBtn,
.quizBtn{
  width:100%;
  border:none;
  padding:14px;
  border-radius:13px;
  background:#1769e0;
  color:white;
  font-size:16px;
  font-weight:bold;
  margin-top:16px;
  cursor:pointer;
}

.quizBtn.alt{
  background:#eef4ff;
  color:#1769e0;
}

/* QUIZ */

.quiz{
  margin-top:15px;
}

.qCount{
  font-size:12px;
  font-weight:bold;
  color:#64748b;
  margin-bottom:8px;
}

.qBar{
  height:6px;
  background:#e6edf8;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:14px;
}

.qBarFill{
  height:100%;
  background:#1769e0;
  transition:.3s;
}

.question{
  font-size:16px;
  font-weight:bold;
  line-height:1.5;
  margin-bottom:15px;
}

.option{
  width:100%;
  text-align:left;
  padding:13px;
  border:2px solid #e3eaf5;
  background:white;
  border-radius:12px;
  margin:7px 0;
  font-size:14px;
  cursor:pointer;
  color:#172554;
}

.option.correct{
  border-color:#159447;
  background:#e9fff1;
}

.option.wrong{
  border-color:#d9363e;
  background:#fff0f1;
}

.result{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  font-weight:bold;
  font-size:14px;
  line-height:1.6;
}

.correctResult{
  background:#e9fff1;
  color:#08752f;
}

.wrongResult{
  background:#fff0f1;
  color:#b4232c;
}

.scoreBox{
  text-align:center;
  padding:10px 0;
}

.scoreBox .big{
  font-size:46px;
}

.scoreBox h3{
  margin:8px 0;
  font-size:20px;
}

.scoreBox p{
  color:#475569;
  line-height:1.6;
  font-size:14px;
}

/* FLASHCARDS */

.flash{
  min-height:170px;
  border-radius:18px;
  padding:22px 18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  cursor:pointer;
  background:linear-gradient(135deg,#eef4ff,#e0ecff);
  border:2px solid #cfe0ff;
  margin:12px 0;
}

.flash.back{
  background:linear-gradient(135deg,#fff8e1,#ffefc2);
  border-color:#f5d36b;
  width:auto;
  height:auto;
  border-radius:18px;
  font-size:inherit;
  color:inherit;
}

.flash .tag{
  font-size:11px;
  font-weight:bold;
  color:#64748b;
  margin-bottom:10px;
}

.flash .txt{
  font-size:20px;
  font-weight:bold;
  line-height:1.5;
}

.flash .hint{
  margin-top:12px;
  font-size:11px;
  color:#94a3b8;
}

.flashNav{
  display:flex;
  gap:8px;
  align-items:center;
}

.flashNav button{
  flex:1;
  border:none;
  padding:12px;
  border-radius:12px;
  background:#eef4ff;
  color:#1769e0;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

.flashNav span{
  font-size:13px;
  font-weight:bold;
  color:#64748b;
  min-width:56px;
  text-align:center;
}

/* CHART */

.chart{
  height:190px;
  background:#101827;
  border-radius:15px;
  margin:15px 0;
  padding:12px;
  display:flex;
  align-items:flex-end;
  gap:7px;
}

.candle{
  flex:1;
  position:relative;
  height:100%;
}

.stick{
  position:absolute;
  width:2px;
  height:80%;
  left:50%;
  top:10%;
  background:#ddd;
}

.body{
  position:absolute;
  width:12px;
  left:50%;
  transform:translateX(-50%);
  border-radius:2px;
}

.green{
  background:#19b66a;
}

.red{
  background:#e04b55;
}

/* FOOTER */

.note{
  margin:18px 15px 30px;
  padding:14px;
  background:#fff7df;
  border-radius:14px;
  color:#7a5a00;
  font-size:12px;
  line-height:1.5;
}

/* =====================================================
   BOTTOM NAV - LIQUID GLASS
===================================================== */

.nav{
  position:fixed;
  left:14px;
  right:14px;
  max-width:420px;
  margin:0 auto;
  bottom:calc(12px + env(safe-area-inset-bottom));
  height:66px;
  padding:6px;
  display:flex;
  border-radius:33px;
  z-index:200;
  background:rgba(255,255,255,.5);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  backdrop-filter:blur(22px) saturate(180%);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 12px 32px rgba(61,108,255,.22),0 2px 8px rgba(255,45,135,.12),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.4);
}

.nav .ind{
  position:absolute;
  top:6px;
  bottom:6px;
  left:6px;
  width:calc((100% - 12px)/var(--n,5));
  border-radius:27px;
  background:linear-gradient(135deg,rgba(255,45,135,.20),rgba(61,108,255,.20));
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.8),inset 0 6px 10px rgba(255,255,255,.55),0 4px 14px rgba(61,108,255,.2);
  transform:translateX(calc(var(--i,0)*100%));
  transition:transform .42s cubic-bezier(.34,1.45,.64,1);
}

.nav.press .ind{
  transform:translateX(calc(var(--i,0)*100%)) scale(1.08,1.12);
}

.nav button{
  position:relative;
  z-index:1;
  flex:1;
  border:0;
  background:none;
  font:inherit;
  cursor:pointer;
  color:#6f7893;
  font-size:11px;
  font-weight:600;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  transition:color .25s;
}

.nav button span{
  font-size:22px;
  transition:transform .3s;
}

.nav button.active{color:#ff1493}

.nav button.active span{
  transform:translateY(-1px) scale(1.12);
}

</style>
</head>

<script>


/* =========================
   NAVIGATION (liquid nav)
========================= */

function navTo(i,url){
  const n=document.getElementById('nav');
  if(n.style.getPropertyValue('--i')==String(i))return;
  n.classList.add('press');
  n.style.setProperty('--i',i);
  [...n.querySelectorAll('button')].forEach((b,k)=>b.classList.toggle('active',k===i));
  try{sessionStorage.setItem('navIdx',i)}catch(e){}
  setTimeout(()=>n.classList.remove('press'),220);
  setTimeout(()=>{location.href=url},250);
}

(function(){
  const n=document.getElementById('nav');
  const cur=n.style.getPropertyValue('--i').trim();
  let prev=null;
  try{prev=sessionStorage.getItem('navIdx')}catch(e){}
  if(prev!==null && prev!==cur){
    n.style.setProperty('--i',prev);
    requestAnimationFrame(()=>requestAnimationFrame(()=>n.style.setProperty('--i',cur)));
  }
  try{sessionStorage.setItem('navIdx',cur)}catch(e){}
})();


/* =========================
   DAILY TRADING
========================= */

}

const TOTAL = Object.keys(lessons).length;


/* =========================
   HELPERS
========================= */

function $(id){
  return document.getElementById(id);
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function saveProgress(){
  try{
    localStorage.setItem("tradingLessons", JSON.stringify(completed));
  }catch(e){}
}


/* =========================
   LESSON LIST (JS ने तयार)
========================= */

function buildLessonList(){

  let html = "";

  for(let i = 1; i <= TOTAL; i++){

    const l = lessons[i];

    html += `
    <div class="lesson locked" id="lesson${i}" onclick="openLesson(${i})">
      <div class="icon">${l.icon}</div>
      <div class="lessonInfo">
        <h3>${i}. ${l.title}</h3>
        <p>${l.short}</p>
      </div>
      <div class="status" id="status${i}">🔒</div>
    </div>`;

  }

  $("lessonList").innerHTML = html;

}


/* =========================
   OPEN LESSON
========================= */

function openLesson(id){

  if(
    id !== 1 &&
    !completed.includes(id-1)
  ){

    alert(
      "🔒 आधी मागचा lesson पूर्ण करा."
    );

    return;

  }


  currentLesson = id;

  const data = lessons[id];

  $("modalTitle").innerText = data.icon + " " + data.title;
  $("lessonContent").innerHTML = data.content;

  $("keyBox").innerHTML =
    "<h4>📌 हे लक्षात ठेवा</h4><ul>" +
    data.keys.map(k => "<li>" + k + "</li>").join("") +
    "</ul>";

  $("trickBox").innerHTML =
    "<b>🧠 लक्षात ठेवण्याची युक्ती</b>" + data.trick;

  $("quizBox").innerHTML = "";
  $("lessonView").style.display = "block";
  $("overlay").style.display = "block";
  $("overlay").querySelector(".modal").scrollTop = 0;

}


/* =========================
   CLOSE
========================= */

function closeLesson(){

  $("overlay").style.display = "none";

}


/* =========================
   QUIZ ENGINE
   (lesson quiz आणि revision quiz दोन्हीसाठी)
========================= */

let quizList = [];
let quizIndex = 0;
let quizScore = 0;
let quizMode = "lesson";

function prepareQuestions(raw){

  return raw.map(q => {

    const opts = shuffle(
      q.o.map((text, idx) => ({ t: text, c: idx === 0 }))
    );

    return { q: q.q, opts: opts, why: q.why };

  });

}

function startLessonQuiz(){

  quizMode = "lesson";
  quizList = prepareQuestions(lessons[currentLesson].quiz);
  quizIndex = 0;
  quizScore = 0;

  $("lessonView").style.display = "none";
  renderQuestion();

}

function renderQuestion(){

  const item = quizList[quizIndex];

  let html = `
  <div class="qCount">प्रश्न ${quizIndex + 1} / ${quizList.length}</div>
  <div class="qBar"><div class="qBarFill" style="width:${(quizIndex / quizList.length) * 100}%"></div></div>
  <div class="question">❓ ${item.q}</div>`;

  item.opts.forEach((opt, i) => {

    html += `
    <button class="option" id="opt${i}" onclick="answerQuiz(${i})">
      ${String.fromCharCode(65 + i)}. ${opt.t}
    </button>`;

  });

  html += `<div id="quizResult"></div><div id="quizNext"></div>`;

  $("quizBox").innerHTML = html;

}

function answerQuiz(selected){

  const item = quizList[quizIndex];
  const buttons = document.querySelectorAll(".option");

  buttons.forEach(b => { b.disabled = true; });

  const correctIdx = item.opts.findIndex(o => o.c);
  const ok = item.opts[selected].c;

  if(ok){
    quizScore++;
    buttons[selected].classList.add("correct");
  }else{
    buttons[selected].classList.add("wrong");
    buttons[correctIdx].classList.add("correct");
  }

  $("quizResult").innerHTML =
    `<div class="result ${ok ? "correctResult" : "wrongResult"}">
      ${ok ? "🎉 बरोबर!" : "❌ चुकीचे."} <br>💡 ${item.why}
    </div>`;

  const last = quizIndex === quizList.length - 1;

  $("quizNext").innerHTML =
    `<button class="quizBtn" onclick="nextQuestion()">
      ${last ? "✅ निकाल पाहा" : "पुढचा प्रश्न ➡️"}
    </button>`;

}

function nextQuestion(){

  quizIndex++;

  if(quizIndex >= quizList.length){
    showQuizResult();
  }else{
    renderQuestion();
  }

}

function showQuizResult(){

  const total = quizList.length;
  const passMark = quizMode === "lesson" ? 2 : 0;
  const passed = quizScore >= passMark;

  let html = `<div class="scoreBox">`;

  if(quizMode === "lesson"){

    if(passed){

      html += `
      <div class="big">🏆</div>
      <h3>Lesson Complete! +10 XP</h3>
      <p>तुमचा score: <b>${quizScore} / ${total}</b></p>`;

      if(!completed.includes(currentLesson)){
        completed.push(currentLesson);
        saveProgress();
      }

      updateProgress();

      html += `
      <div class="keyBox" style="text-align:left">
        <h4>📌 पुन्हा एकदा लक्षात ठेवा</h4>
        <ul>${lessons[currentLesson].keys.map(k => "<li>" + k + "</li>").join("")}</ul>
      </div>
      <div class="trickBox" style="text-align:left">
        <b>🧠 युक्ती</b>${lessons[currentLesson].trick}
      </div>`;

    }else{

      html += `
      <div class="big">📖</div>
      <h3>अजून थोडा सराव करा</h3>
      <p>तुमचा score: <b>${quizScore} / ${total}</b><br>
      पास होण्यासाठी किमान 2 बरोबर उत्तरं हवीत. Lesson पुन्हा वाचा आणि पुन्हा प्रयत्न करा.</p>`;

    }

    html += `</div>`;

    if(passed){

      if(currentLesson < TOTAL){
        html += `<button class="quizBtn" onclick="openLesson(${currentLesson + 1})">पुढचा Lesson ➡️</button>`;
      }

      html += `<button class="quizBtn alt" onclick="closeLesson()">बंद करा</button>`;

    }else{

      html += `
      <button class="quizBtn" onclick="startLessonQuiz()">🔄 पुन्हा Quiz द्या</button>
      <button class="quizBtn alt" onclick="openLesson(${currentLesson})">📖 Lesson पुन्हा वाचा</button>`;

    }

  }else{

    html += `
    <div class="big">${quizScore >= total - 1 ? "🌟" : "💪"}</div>
    <h3>Revision झाली!</h3>
    <p>तुमचा score: <b>${quizScore} / ${total}</b><br>
    ${quizScore >= total - 1 ? "छान! तुम्हाला सगळं लक्षात आहे." : "ठीक आहे, flashcards पुन्हा पाहा आणि परत प्रयत्न करा."}</p>
    </div>
    <button class="quizBtn" onclick="startRevisionQuiz()">🔄 आणखी एक Quiz</button>
    <button class="quizBtn alt" onclick="openRevision()">🃏 Flashcards पाहा</button>`;

  }

  $("quizBox").innerHTML = html;
  $("overlay").querySelector(".modal").scrollTop = 0;

}


/* =========================
   REVISION (उजळणी)
========================= */

let deck = [];
let deckIndex = 0;
let showingBack = false;

function openRevision(){

  if(completed.length === 0){

    alert("🔁 आधी किमान एक lesson पूर्ण करा, मग उजळणी उघडेल.");
    return;

  }

  deck = [];

  completed.forEach(id => {
    lessons[id].cards.forEach(c => deck.push(c));
  });

  deck = shuffle(deck);
  deckIndex = 0;
  showingBack = false;

  $("modalTitle").innerText = "🔁 उजळणी (Revision)";
  $("lessonView").style.display = "none";
  $("overlay").style.display = "block";
  $("overlay").querySelector(".modal").scrollTop = 0;

  renderCard();

}

function renderCard(){

  const c = deck[deckIndex];

  $("quizBox").innerHTML = `
  <div class="qCount">🃏 Flashcards • पूर्ण केलेल्या lessons मधून</div>

  <div class="flash ${showingBack ? "back" : ""}" onclick="flipCard()">
    <div class="tag">${showingBack ? "उत्तर / अर्थ" : "हे काय आहे?"}</div>
    <div class="txt">${showingBack ? c[1] : c[0]}</div>
    <div class="hint">${showingBack ? "पुन्हा टॅप = प्रश्नाकडे" : "टॅप करा = उत्तर पाहा"}</div>
  </div>

  <div class="flashNav">
    <button onclick="prevCard()">◀</button>
    <span>${deckIndex + 1} / ${deck.length}</span>
    <button onclick="nextCard()">▶</button>
  </div>

  <button class="quizBtn" onclick="startRevisionQuiz()">📝 Quick Revision Quiz (5 प्रश्न)</button>
  `;

}

function flipCard(){
  showingBack = !showingBack;
  renderCard();
}

function nextCard(){
  deckIndex = (deckIndex + 1) % deck.length;
  showingBack = false;
  renderCard();
}

function prevCard(){
  deckIndex = (deckIndex - 1 + deck.length) % deck.length;
  showingBack = false;
  renderCard();
}

function startRevisionQuiz(){

  let pool = [];

  completed.forEach(id => {
    lessons[id].quiz.forEach(q => pool.push(q));
  });

  pool = shuffle(pool).slice(0, 5);

  quizMode = "revision";
  quizList = prepareQuestions(pool);
  quizIndex = 0;
  quizScore = 0;

  $("modalTitle").innerText = "📝 Quick Revision Quiz";
  $("lessonView").style.display = "none";
  $("overlay").style.display = "block";

  renderQuestion();

}


/* =========================
   PROGRESS
========================= */

function updateProgress(){

  const done = completed.length;
  const percent = (done / TOTAL) * 100;

  $("progressFill").style.width = percent + "%";
  $("xpText").innerText = (done * 10) + " XP";

  $("revInfo").innerText =
    done === 0
      ? "आधी एक lesson पूर्ण करा, मग उजळणी उघडेल"
      : done + " lessons ची Flashcards आणि Quick Quiz तयार आहेत";

  for(let i = 1; i <= TOTAL; i++){

    const lesson = $("lesson" + i);
    const status = $("status" + i);

    if(completed.includes(i)){

      lesson.classList.remove("locked");
      status.innerText = "✅";

    }else if(i === 1 || completed.includes(i-1)){

      lesson.classList.remove("locked");
      status.innerText = "▶️";

    }else{

      lesson.classList.add("locked");
      status.innerText = "🔒";

    }

  }

}


/* =========================
   BACK
========================= */

function goBack(){

  if(document.referrer){

    history.back();

  }else{

    window.location.href = "home.html";

  }

}


/* =========================
   START
========================= */

buildLessonList();
updateProgress();

</script>
