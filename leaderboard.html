<!DOCTYPE html>
<html lang="mr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>GyanSetu - Leaderboard</title>


<style>

/* =========================
   RESET
========================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}


body{

  font-family:Arial,sans-serif;

  background:
    radial-gradient(
      circle at top left,
      #dceeff,
      transparent 38%
    ),
    radial-gradient(
      circle at top right,
      #e8f5ff,
      transparent 38%
    ),
    linear-gradient(
      180deg,
      #f3f9ff,
      #ffffff
    );

  color:#102a56;

  min-height:100vh;
}


/* =========================
   APP
========================= */

.app{

  width:100%;

  max-width:430px;

  min-height:100vh;

  margin:auto;

  padding-bottom:105px;
}


/* =========================
   HEADER
========================= */

.header{

  position:sticky;

  top:0;

  z-index:50;

  padding:16px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  background:
    rgba(255,255,255,.94);

  backdrop-filter:blur(18px);

  -webkit-backdrop-filter:blur(18px);

  border-bottom:
    1px solid #dcecff;

  box-shadow:
    0 7px 25px
    rgba(23,105,224,.08);

}


.back{

  width:43px;

  height:43px;

  border-radius:14px;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#eef6ff;

  color:#1769e0;

  box-shadow:
    0 4px 12px
    rgba(23,105,224,.08);

  font-size:30px;

  cursor:pointer;
}


.title{

  font-size:21px;

  font-weight:900;

  color:#102f60;
}


.trophy{

  width:43px;

  height:43px;

  border-radius:14px;

  display:flex;

  align-items:center;

  justify-content:center;

  background:
    linear-gradient(
      135deg,
      #e8f4ff,
      #d7ebff
    );

  font-size:23px;
}


/* =========================
   HERO
========================= */

.hero{

  margin:18px 16px;

  padding:23px 16px;

  border-radius:25px;

  text-align:center;

  background:white;

  border:
    1px solid #dcecff;

  box-shadow:
    0 10px 30px
    rgba(23,105,224,.09);
}


.hero-icon{

  width:72px;

  height:72px;

  margin:auto;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:23px;

  background:
    linear-gradient(
      135deg,
      #e7f3ff,
      #cfe7ff
    );

  font-size:39px;

  box-shadow:
    0 8px 20px
    rgba(23,105,224,.12);
}


.hero h2{

  margin-top:12px;

  font-size:22px;

  color:#12396f;
}


.hero p{

  margin-top:7px;

  color:#6d809d;

  font-size:13px;
}


/* =========================
   PODIUM
========================= */

.podium{

  margin:20px 16px 25px;

  display:flex;

  align-items:flex-end;

  justify-content:center;

  gap:8px;
}


.person{

  width:32%;

  text-align:center;

  padding:12px 5px;

  border-radius:20px;

  background:white;

  border:
    1px solid #dcecff;

  box-shadow:
    0 6px 18px
    rgba(23,105,224,.06);
}


.person.first{

  padding-top:5px;

  padding-bottom:17px;

  background:
    linear-gradient(
      145deg,
      #eaf5ff,
      #ffffff
    );

  box-shadow:
    0 10px 25px
    rgba(23,105,224,.12);
}


.person-avatar{

  width:57px;

  height:57px;

  margin:auto;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  background:
    linear-gradient(
      135deg,
      #1769e0,
      #56aaff
    );

  color:white;

  font-size:21px;

  font-weight:bold;
}


.person.first .person-avatar{

  width:76px;

  height:76px;

  background:
    linear-gradient(
      135deg,
      #1254b4,
      #4ca6ff
    );

  font-size:28px;

  border:
    4px solid white;

  box-shadow:
    0 8px 20px
    rgba(23,105,224,.22);
}


.person strong{

  display:block;

  margin-top:8px;

  font-size:13px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


.rank-number{

  margin-top:5px;

  font-size:21px;
}


.xp{

  margin-top:3px;

  color:#1769e0;

  font-size:12px;

  font-weight:bold;
}


/* =========================
   SECTION
========================= */

.section-title{

  margin:25px 16px 12px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  font-size:18px;

  font-weight:800;

  color:#12396f;
}


.total-users{

  font-size:11px;

  color:#7185a3;

  font-weight:normal;
}


/* =========================
   LIST
========================= */

.list{

  margin:0 16px;
}


.row{

  display:flex;

  align-items:center;

  gap:11px;

  padding:13px;

  margin-bottom:10px;

  border-radius:18px;

  background:white;

  border:
    1px solid #deebfa;

  box-shadow:
    0 6px 18px
    rgba(23,105,224,.06);
}


.number{

  width:28px;

  text-align:center;

  font-weight:bold;

  color:#6b7f9d;
}


.small-avatar{

  width:43px;

  height:43px;

  min-width:43px;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  background:
    linear-gradient(
      135deg,
      #e1efff,
      #cfe5ff
    );

  color:#1769e0;

  font-weight:bold;
}


.user{

  flex:1;

  min-width:0;
}


.user strong{

  display:block;

  font-size:14px;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;
}


.user small{

  display:block;

  margin-top:3px;

  color:#91a2b9;

  font-size:11px;
}


.row-xp{

  color:#1769e0;

  font-size:13px;

  font-weight:bold;

  white-space:nowrap;
}


/* =========================
   MY RANK
========================= */

.my-rank{

  margin:20px 16px;

  padding:15px;

  display:flex;

  align-items:center;

  gap:11px;

  border-radius:19px;

  background:
    linear-gradient(
      135deg,
      #edf6ff,
      #ffffff
    );

  border:
    1.5px solid #bcdcff;

  box-shadow:
    0 9px 25px
    rgba(37,99,235,.08);
}


.my-rank-number{

  width:43px;

  height:43px;

  border-radius:13px;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#dfeeff;

  color:#1769e0;

  font-size:18px;

  font-weight:bold;
}


.my-rank-info{

  flex:1;

  min-width:0;
}


.my-rank-info strong{

  display:block;

  font-size:14px;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;
}


.my-rank-info small{

  display:block;

  margin-top:3px;

  color:#647b9b;

  font-size:11px;
}


.my-xp{

  color:#1769e0;

  font-weight:bold;

  font-size:14px;
}


/* =========================
   DAILY QUIZ
========================= */

.quiz-card{

  margin:
    22px
    16px;

  padding:20px;

  border-radius:24px;

  background:
    linear-gradient(
      145deg,
      #0f4ea8,
      #1769e0,
      #4ba6ff
    );

  color:white;

  box-shadow:
    0 12px 30px
    rgba(23,105,224,.23);

  position:relative;

  overflow:hidden;
}


.quiz-card::after{

  content:"";

  position:absolute;

  width:130px;

  height:130px;

  border-radius:50%;

  right:-45px;

  top:-50px;

  background:
    rgba(255,255,255,.09);
}


.quiz-title{

  font-size:19px;

  font-weight:900;

  position:relative;

  z-index:2;
}


.quiz-sub{

  margin-top:6px;

  font-size:12px;

  opacity:.9;

  line-height:1.5;

  position:relative;

  z-index:2;
}


.quiz-status{

  margin-top:12px;

  padding:9px 11px;

  border-radius:11px;

  background:
    rgba(255,255,255,.15);

  font-size:11px;

  position:relative;

  z-index:2;
}


.quiz-start{

  margin-top:15px;

  width:100%;

  border:none;

  padding:13px;

  border-radius:13px;

  background:white;

  color:#1769e0;

  font-size:14px;

  font-weight:900;

  cursor:pointer;

  position:relative;

  z-index:2;
}


.quiz-start:disabled{

  opacity:.65;

  cursor:not-allowed;
}


/* =========================
   QUIZ MODAL
========================= */

.quiz-modal{

  display:none;

  position:fixed;

  inset:0;

  background:
    rgba(7,25,55,.55);

  z-index:200;

  align-items:flex-end;

  justify-content:center;
}


.quiz-modal.show{

  display:flex;
}


.quiz-box{

  width:100%;

  max-width:430px;

  max-height:90vh;

  overflow-y:auto;

  background:white;

  border-radius:
    26px
    26px
    0
    0;

  padding:21px;

  box-shadow:
    0 -10px 40px
    rgba(0,0,0,.18);
}


.quiz-header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;
}


.quiz-header h2{

  font-size:20px;

  color:#12396f;
}


.close-quiz{

  width:38px;

  height:38px;

  border:none;

  border-radius:12px;

  background:#edf5ff;

  color:#1769e0;

  font-size:22px;

  cursor:pointer;
}


.question-count{

  margin-top:10px;

  font-size:12px;

  color:#7890ae;
}


.question{

  margin-top:17px;

  font-size:17px;

  font-weight:800;

  line-height:1.5;

  color:#173a6e;
}


.options{

  margin-top:15px;

  display:grid;

  gap:10px;
}


.option{

  width:100%;

  padding:13px;

  border:
    1px solid #d7e7f9;

  border-radius:14px;

  background:#f7fbff;

  color:#24466f;

  text-align:left;

  font-size:13px;

  cursor:pointer;
}


.option.selected{

  background:#e4f1ff;

  border-color:#4b9cff;

  color:#1769e0;

  font-weight:bold;
}


.next-btn{

  width:100%;

  margin-top:18px;

  border:none;

  padding:13px;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      #1769e0,
      #42a1ff
    );

  color:white;

  font-size:14px;

  font-weight:bold;

  cursor:pointer;
}


.next-btn:disabled{

  opacity:.5;

  cursor:not-allowed;
}


.quiz-result{

  text-align:center;

  padding:20px 5px;
}


.result-icon{

  font-size:50px;
}


.result-score{

  margin-top:10px;

  font-size:27px;

  font-weight:900;

  color:#1769e0;
}


.result-text{

  margin-top:8px;

  color:#7185a3;

  font-size:13px;

  line-height:1.5;
}


.done-btn{

  width:100%;

  margin-top:18px;

  border:none;

  padding:13px;

  border-radius:14px;

  background:#1769e0;

  color:white;

  font-size:14px;

  font-weight:bold;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{

  position:fixed;

  left:50%;

  bottom:0;

  transform:
    translateX(-50%);

  width:100%;

  max-width:430px;

  height:70px;

  display:flex;

  align-items:center;

  justify-content:space-around;

  background:
    rgba(255,255,255,.96);

  backdrop-filter:blur(20px);

  -webkit-backdrop-filter:blur(20px);

  border-top:
    1px solid #dcecff;

  box-shadow:
    0 -8px 25px
    rgba(23,105,224,.08);

  z-index:100;
}


.nav-item{

  min-width:55px;

  text-align:center;

  color:#71839e;

  font-size:10px;

  cursor:pointer;
}


.nav-item .icon{

  display:block;

  font-size:21px;

  margin-bottom:3px;
}


.nav-item.active{

  color:#1769e0;

  font-weight:bold;
}


/* =========================
   EMPTY
========================= */

.empty{

  margin:
    0
    16px;

  padding:25px;

  text-align:center;

  border-radius:20px;

  background:white;

  border:
    1px solid #deebfa;

  color:#7185a3;
}


</style>

</head>


<body>

  </div>


  <div
    class="quiz-status"
    id="quizStatus">

    आजची Quiz उपलब्ध आहे.

  </div>

    class="quiz-start"
    id="startQuizBtn"
    onclick="startQuiz()">

    🎯 Quiz सुरू करा

  </button>

  class="quiz-modal"
  id="quizModal">


  <div class="quiz-box">


    <div class="quiz-header">

      <h2>

      </h2>

        class="close-quiz"
        onclick="closeQuiz()">

<script>


/* =========================
   USER
========================= */

const currentUsername =
  localStorage.getItem(
    "gyansetu_username"
  ) || "Student";


/* =========================
   XP
========================= */

let currentXP =
  Number(
    localStorage.getItem(
      "gyansetu_xp"
    )
  ) || 0;


/* =========================
   LEADERBOARD DATA
========================= */

let users = [];

try{

  users =
    JSON.parse(
      localStorage.getItem(
        "gyansetu_leaderboard"
      )
    ) || [];

}catch(error){

  users = [];

}


/* =========================
   UPDATE CURRENT USER
========================= */

const existingUser =
  users.find(
    function(user){

      return user.username ===
        currentUsername;

    }
  );


if(existingUser){

  existingUser.xp =
    currentXP;

}

else{

  users.push({

    username:
      currentUsername,

    xp:
      currentXP

  });

}


/* =========================
   SAVE
========================= */

saveLeaderboard();


/* =========================
   SAVE LEADERBOARD
========================= */

function saveLeaderboard(){

  localStorage.setItem(

    "gyansetu_leaderboard",

    JSON.stringify(users)

  );

}


/* =========================
   SORT
========================= */

function sortUsers(){

  users.sort(

    function(a,b){

      return Number(b.xp) -
             Number(a.xp);

    }

  );

}


/* =========================
   PODIUM
========================= */

function displayPodium(){

  sortUsers();

  const podium =
    document.getElementById(
      "podium"
    );


  podium.innerHTML = "";


  const topUsers =
    users.slice(0,3);


  if(topUsers.length === 0){

    return;

  }


  /* SECOND */

  if(topUsers[1]){

    podium.innerHTML += `

      <div class="person">

        <div class="person-avatar">

          ${getInitial(
            topUsers[1].username
          )}

        </div>

        <strong>

          ${escapeHTML(
            topUsers[1].username
          )}

        </strong>

        <div class="rank-number">
          🥈
        </div>

        <div class="xp">
          ${Number(topUsers[1].xp)} XP
        </div>

      </div>

    `;

  }


  /* FIRST */

  if(topUsers[0]){

    podium.innerHTML += `

      <div class="person first">

        <div class="person-avatar">

          ${getInitial(
            topUsers[0].username
          )}

        </div>

        <strong>

          ${escapeHTML(
            topUsers[0].username
          )}

        </strong>

        <div class="rank-number">
          🥇
        </div>

        <div class="xp">
          ${Number(topUsers[0].xp)} XP
        </div>

      </div>

    `;

  }


  /* THIRD */

  if(topUsers[2]){

    podium.innerHTML += `

      <div class="person">

        <div class="person-avatar">

          ${getInitial(
            topUsers[2].username
          )}

        </div>

        <strong>

          ${escapeHTML(
            topUsers[2].username
          )}

        </strong>

        <div class="rank-number">
          🥉
        </div>

        <div class="xp">
          ${Number(topUsers[2].xp)} XP
        </div>

      </div>

    `;

  }

}


/* =========================
   ALL PLAYERS LIST
========================= */

function displayList(){

  sortUsers();

  const list =
    document.getElementById(
      "leaderboardList"
    );


  list.innerHTML = "";


  if(users.length === 0){

    list.innerHTML = `

      <div class="empty">

        👥 अजून कोणताही learner नाही.

      </div>

    `;

    return;

  }


  /*
    आता Top 3 सुद्धा list मध्ये
    दिसतील.
  */

  users.forEach(

    function(user,index){

      const rank =
        index + 1;


      let medal = "";


      if(rank === 1)
        medal = "🥇";

      else if(rank === 2)
        medal = "🥈";

      else if(rank === 3)
        medal = "🥉";


      list.innerHTML += `

        <div class="row">

          <div class="number">

            ${medal || rank}

          </div>


          <div class="small-avatar">

            ${getInitial(
              user.username
            )}

          </div>


          <div class="user">

            <strong>

              ${escapeHTML(
                user.username
              )}

            </strong>

            <small>

              Keep learning 🚀

            </small>

          </div>


          <div class="row-xp">

            ${Number(
              user.xp
            )} XP

          </div>

        </div>

      `;

    }

  );

}


/* =========================
   MY RANK
========================= */

function displayMyRank(){

  sortUsers();

  const box =
    document.getElementById(
      "myRank"
    );


  const index =
    users.findIndex(

      function(user){

        return user.username ===
          currentUsername;

      }

    );


  const rank =
    index >= 0
    ? index + 1
    : "-";


  box.innerHTML = `

    <div class="my-rank-number">

      ${rank}

    </div>


    <div class="my-rank-info">

      <strong>

        @${escapeHTML(
          currentUsername
        )}

      </strong>


      <small>

        तुमचा सध्याचा Rank

      </small>

    </div>


    <div class="my-xp">

      ${currentXP} XP

    </div>

  `;

}


/* =========================
   COUNT
========================= */

function displayCount(){

  document
    .getElementById(
      "totalUsers"
    )
    .innerText =

      users.length +

      (
        users.length === 1
        ? " Learner"
        : " Learners"
      );

}


/* =========================
   INITIAL
========================= */

displayPodium();

displayList();

displayMyRank();

displayCount();


/* =========================
   QUIZ QUESTIONS
========================= */

const quizQuestions = [

  {
    q:
      "भारताची राजधानी कोणती आहे?",

    options:[
      "मुंबई",

/* =========================
   QUIZ VARIABLES
========================= */

let currentQuestion = 0;

let score = 0;

let answered = false;


/* =========================
   START QUIZ
========================= */

function startQuiz(){

  currentQuestion = 0;

  score = 0;

  answered = false;

  showQuestion();

}


/* =========================
   SHOW QUESTION
========================= */

function showQuestion(){

  const question =
    questions[currentQuestion];

  const questionBox =
    document.getElementById(
      "question"
    );

  const optionsBox =
    document.getElementById(
      "options"
    );

  const progress =
    document.getElementById(
      "progress"
    );


  if(!question){

    showResult();

    return;

  }


  questionBox.innerText =
    question.q;


  optionsBox.innerHTML = "";

  answered = false;


  progress.innerText =
    "प्रश्न " +
    (currentQuestion + 1) +
    " / " +
    questions.length;


  question.options.forEach(
    function(option,index){

      const button =
        document.createElement("button");


      button.className =
        "option";


      button.innerText =
        option;


      button.onclick =
        function(){

          selectAnswer(
            index,
            button
          );

        };


      optionsBox.appendChild(
        button
      );

    }
  );

}


/* =========================
   SELECT ANSWER
========================= */

function selectAnswer(
  selected,
  button
){

  if(answered)
    return;


  answered = true;


  const correct =
    questions[
      currentQuestion
    ].answer;


  const allOptions =
    document.querySelectorAll(
      ".option"
    );


  allOptions.forEach(
    function(btn){

      btn.disabled = true;

    }
  );


  if(selected === correct){

    button.classList.add(
      "correct"
    );

    score++;

  }

  else{

    button.classList.add(
      "wrong"
    );


    allOptions[
      correct
    ].classList.add(
      "correct"
    );

  }


  setTimeout(
    function(){

      currentQuestion++;

      showQuestion();

    },
    800
  );

}


/* =========================
   RESULT
========================= */

function showResult(){

  const quizBox =
    document.getElementById(
      "quizBox"
    );


  const oldXP =
    Number(
      localStorage.getItem(
        "gyansetu_xp"
      )
    ) || 0;


  const earnedXP =
    score * 5;


  const newXP =
    oldXP + earnedXP;


  localStorage.setItem(
    "gyansetu_xp",
    newXP
  );


  quizBox.innerHTML = `

    <div class="result">

      <div class="result-icon">
        🏆
      </div>

      <h2>
        Quiz Complete!
      </h2>

      <p>
        तुमचा Score
      </p>

      <div class="score">
        ${score} / ${questions.length}
      </div>

      <div class="earned">
        +${earnedXP} XP 🎉
      </div>

      <p>
        एकूण Gyan Points:
        <strong>${newXP} XP</strong>
      </p>

      <button
        class="main-btn"
        onclick="location.href='leaderboard.html'"
      >
        🏆 Leaderboard पहा
      </button>

      <button
        class="back-btn"
        onclick="location.href='home.html'"
      >
        🏠 Home वर जा
      </button>

    </div>

  `;

}

startQuiz();
