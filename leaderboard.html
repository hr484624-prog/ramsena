<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GyanSetu - Search</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
:root{--b:#2563eb;--ink:#0f172a;--mut:#64748b;--bg:#f1f5f9;--line:#e2e8f0}
body{background:var(--bg);color:var(--ink);min-height:100vh}
.app{max-width:430px;margin:auto;min-height:100vh;padding-bottom:30px}
.top{position:sticky;top:0;z-index:50;background:var(--bg);padding:12px 16px 8px}
.bar{display:flex;gap:8px;align-items:center}
.ib{border:1px solid var(--line);background:#fff;width:42px;height:42px;border-radius:12px;font-size:18px;color:var(--ink);flex:none}
.box{flex:1;display:flex;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:0 12px;height:46px}
.box:focus-within{border-color:var(--b);box-shadow:0 0 0 3px #2563eb22}
.box input{flex:1;border:0;outline:0;font-size:15px;background:none;color:var(--ink);min-width:0}
.box button{border:0;background:none;font-size:18px;padding:4px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-size:12.5px;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.sec{padding:6px 16px}
.lbl{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:12px 0 8px;display:flex;justify-content:space-between}
.lbl a{color:var(--b);text-transform:none;letter-spacing:0;font-weight:600;cursor:pointer}
.tags{display:flex;flex-wrap:wrap;gap:7px}
.tag{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 13px;font-size:13px;color:var(--ink)}
.res{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:9px;text-decoration:none;color:var(--ink);animation:up .25s}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.res:active{background:#f8fafc}
.ic{width:44px;height:44px;border-radius:12px;background:#eff6ff;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.res div.t{flex:1;min-width:0}
.res b{display:block;font-size:14px}
.res small{display:block;color:var(--mut);font-size:12px;margin-top:2px;line-height:1.4}
.cat{font-size:10px;background:#f1f5f9;color:var(--mut);padding:3px 8px;border-radius:8px;font-weight:700;white-space:nowrap}
.soon{background:#fef3c7;color:#b45309}
mark{background:#fde68a;color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--mut);padding:40px 20px;font-size:14px;line-height:1.6}
.empty b{display:block;font-size:34px;margin-bottom:8px}
.cnt{font-size:12px;color:var(--mut);margin:4px 0 10px}
</style>
</head>
<body>
<div class="app">
<div class="top">
  <div class="bar">
    <button class="ib" onclick="history.length>1?history.back():location.href='home.html'">‹</button>
    <div class="box">
      <span>🔍</span>
      <input id="q" placeholder="App madhe kahihi shodha..." autocomplete="off" oninput="run()">
      <button id="clr" onclick="clr()" style="display:none">✕</button>
      <button onclick="voice()">🎤</button>
    </div>
  </div>
  <div class="chips" id="cats"></div>
</div>

<div id="home">
  <div class="sec">
    <div class="lbl">Recent searches <a onclick="clearRecent()">Clear</a></div>
    <div class="tags" id="recent"></div>
    <div class="lbl">Popular</div>
    <div class="tags" id="pop"></div>
  </div>
</div>
<div class="sec" id="out"></div>
</div>

<script>
/* =====================================================
   APP INDEX: navin feature add karaychi tar ithe ek line add kara
   t=naav, c=category, d=vivaran, k=keywords (Marathi/English/Roman),
   u=page link (tumchya file nusar badla), i=icon,
   soon:true = "Coming soon", hidden:true = search madhe disnar nahi
===================================================== */
const APP=[
 // ---- Home ----
 {t:"Interviews",c:"Career",i:"🎤",d:"Interview preparation aani mulakhat",k:"interview mulakhat mulakat job question answer",u:"interviews.html"},
 {t:"Channels",c:"Videos",i:"📺",d:"Shaikshanik channels",k:"channel channels chaneel youtube",u:"channels.html"},
 {t:"Videos",c:"Videos",i:"🎬",d:"Shikshanache video",k:"video videos vdo lecture",u:"videos.html"},
 {t:"Live Classes",c:"Classes",i:"🔴",d:"Sir cha live class, hand raise, class chat, notes, timer",k:"live class classes vargat sir teacher camera hand raise chat timer",u:"liveclasses.html"},
 {t:"AI Study",c:"AI",i:"✨",d:"Smart Study: AI Teacher, Smart Notes, Practice Quiz, Study Modes",k:"ai study smart teacher notes quiz practice abhyas",u:"smartstudy.html"},
 {t:"Extra Search",c:"Tools",i:"🔎",d:"Adhik shodh aani mahiti",k:"extra search shodh mahiti information",u:"extrasearch.html"},
 {t:"Skill Hub",c:"Career",i:"🛠️",d:"200+ skills shika",k:"skill skills hub kaushalya shikna course 200",u:"skillhub.html"},
 {t:"Colleges",c:"Career",i:"🏫",d:"College mahiti aani admission",k:"college colleges mahavidyalay admission praveshan",u:"colleges.html"},
 {t:"Trading Study",c:"Career",i:"📈",d:"Share market aani trading shika",k:"trading share market stock investment gunvanuk",u:"trading.html"},
 {t:"App Info",c:"App",i:"ℹ️",d:"App chi mahiti",k:"app info about mahiti",u:"appinfo.html"},
 {t:"AI Saathi",c:"AI",i:"🤖",d:"Tumcha AI sobati",k:"ai saathi sathi friend mitra chatbot",u:"aisaathi.html"},
 // ---- Doubt ----
 {t:"Doubt Desk",c:"AI",i:"🤔",d:"Koni pan doubt vichara: shala te padvi. Voice, code, short notes",k:"doubt shanka prashna question vichara solve samajla problem",u:"doubt.html"},
 // ---- Education ----
 {t:"Board Classes",c:"Education",i:"📚",d:"Board che vargh aani abhyas",k:"board class vargh ssc hsc 10 12 abhyas",u:"board.html"},
 {t:"Basic Maths Test",c:"Education",i:"🧮",d:"Ganit chi basic test",k:"basic maths math ganit test pariksha",u:"mathtest.html"},
 {t:"Class 11 & 12 Maths",c:"Education",i:"📐",d:"11vi 12vi cha purn Maths syllabus",k:"11 12 maths ganit syllabus bara akravi",u:"maths1112.html"},
 {t:"Science Explore Game",c:"Education",i:"🔬",d:"Khel khelat vidnyan shika",k:"science vidnyan explore game khel",u:"scigame.html"},
 {t:"Language Study",c:"Education",i:"🗣️",d:"Marathi, Hindi, English bhasha shika",k:"language bhasha marathi hindi english grammar vyakaran",u:"language.html"},
 {t:"Basic Maths Study",c:"Education",i:"➕",d:"Ganit cha pahila abhyas",k:"basic maths ganit study berij vajabaki",u:"mathstudy.html"},
 // ---- Social ----
 {t:"My Profile",c:"Social",i:"👤",d:"Tumcha profile",k:"profile maza majha account user naav",u:"profile.html"},
 {t:"Messages",c:"Social",i:"💬",d:"Mitrana message pathva",k:"message messages chat sandesh msg",u:"messages.html"},
 {t:"Users",c:"Social",i:"👥",d:"Dusrya vaparkartyanche profile",k:"users students vidyarthi profiles friends mitra",u:"users.html"},
 // ---- Special ----
 {t:"Navratri Special",c:"Special",i:"🪔",d:"Navratri vishesh",k:"navratri special utsav festival",u:"navratri.html",soon:true},
 {t:"Leaderboard",c:"Social",i:"🏆",d:"Top vidyarthi",k:"leaderboard rank top",u:"leaderboard.html",hidden:true}
];
const POP=["Live Classes","Doubt","Maths","Skill Hub","Interview","Videos"];

const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
const norm=s=>String(s).toLowerCase().normalize("NFC").trim();
const user=()=>localStorage.getItem("username")||"guest";
let cat="All";

/* user che jun doubts pan search madhe yetat */
function myDoubts(){
  try{return JSON.parse(localStorage.getItem("gs_doubts_"+user())||"[]").map(x=>({t:x.question.slice(0,70),c:"My Doubts",i:"🕘",d:(x.subject||"")+" • tumcha doubt",k:x.question+" "+(x.subject||""),u:"doubt.html"}))}catch(e){return[]}
}
const all=()=>APP.filter(x=>!x.hidden).concat(myDoubts());

function score(x,toks){
  const T=norm(x.t),K=norm(x.k),D=norm(x.d);let s=0;
  for(const w of toks){
    let h=0;
    if(T.startsWith(w))h=10;else if(T.includes(w))h=7;
    else if(K.split(/\s+/).some(k=>k.startsWith(w)))h=5;
    else if(K.includes(w))h=3;else if(D.includes(w))h=2;
    else if(w.length>3&&fuzzy(w,K.split(/\s+/)))h=1;
    if(!h)return 0;s+=h;
  }
  return s;
}
function fuzzy(w,words){ // 1 akshar chukla tari sapadel
  return words.some(k=>Math.abs(k.length-w.length)<=1&&lev(w,k)<=1);
}
function lev(a,b){const m=[];for(let i=0;i<=b.length;i++)m[i]=[i];for(let j=0;j<=a.length;j++)m[0][j]=j;
  for(let i=1;i<=b.length;i++)for(let j=1;j<=a.length;j++)m[i][j]=b[i-1]==a[j-1]?m[i-1][j-1]:Math.min(m[i-1][j-1],m[i][j-1],m[i-1][j])+1;
  return m[b.length][a.length]}
function hl(text,toks){
  let s=esc(text);
  toks.forEach(w=>{if(!w)return;const r=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");s=s.replace(r,"<mark>$1</mark>")});
  return s;
}

function run(save){
  const v=$("q").value,q=norm(v);
  $("clr").style.display=v?"block":"none";
  if(!q){$("out").innerHTML="";$("home").style.display="block";drawHome();return}
  $("home").style.display="none";
  const toks=q.split(/\s+/);
  let r=all().map(x=>({x,s:score(x,toks)})).filter(o=>o.s>0&&(cat=="All"||o.x.c==cat)).sort((a,b)=>b.s-a.s);
  if(!r.length){
    $("out").innerHTML=`<div class="empty"><b>🔍</b>"${esc(v)}" sathi kahi sapadla nahi.<br>Vegla shabd vaprun pahaa, udaharan: <i>maths, video, class, doubt</i></div>`;
    return;
  }
  $("out").innerHTML=`<div class="cnt">${r.length} nikal</div>`+r.map(o=>{const x=o.x;
    return `<a class="res" href="${esc(x.u)}" onclick="addRecent('${esc(v).replace(/'/g,"")}')">
      <div class="ic">${x.i}</div>
      <div class="t"><b>${hl(x.t,toks)}</b><small>${hl(x.d,toks)}</small></div>
      <span class="cat ${x.soon?'soon':''}">${x.soon?'Soon':esc(x.c)}</span></a>`}).join("");
}

/* categories */
function drawCats(){
  const cs=["All",...new Set(APP.filter(x=>!x.hidden).map(x=>x.c))];
  $("cats").innerHTML=cs.map(c=>`<button class="chip ${c==cat?'on':''}" onclick="setCat('${c}')">${c}</button>`).join("");
}
function setCat(c){cat=c;drawCats();
  if(!$("q").value.trim()&&c!="All"){ // search nasel tar tya category che sagle dakhva
    $("home").style.display="none";
    $("out").innerHTML=all().filter(x=>x.c==c).map(x=>`<a class="res" href="${esc(x.u)}"><div class="ic">${x.i}</div><div class="t"><b>${esc(x.t)}</b><small>${esc(x.d)}</small></div></a>`).join("");
  }else if(!$("q").value.trim()){$("out").innerHTML="";$("home").style.display="block"}
  else run();
}

/* recent + popular */
const RK="gs_recent_search";
const getR=()=>{try{return JSON.parse(localStorage.getItem(RK)||"[]")}catch(e){return[]}};
function addRecent(v){if(!v)return;const a=getR().filter(x=>x!=v);a.unshift(v);localStorage.setItem(RK,JSON.stringify(a.slice(0,8)))}
function clearRecent(){localStorage.removeItem(RK);drawHome()}
function drawHome(){
  const r=getR();
  $("recent").innerHTML=r.length?r.map(x=>`<button class="tag" onclick="use('${esc(x)}')">🕘 ${esc(x)}</button>`).join(""):'<span style="color:var(--mut);font-size:13px">Ajun kahi nahi</span>';
  $("pop").innerHTML=POP.map(x=>`<button class="tag" onclick="use('${x}')">🔥 ${x}</button>`).join("");
}
function use(v){$("q").value=v;run();$("q").focus()}
function clr(){$("q").value="";run();$("q").focus()}

/* voice */
function voice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert("Voice ya browser madhe nahi");return}
  const m={"हिंदी":"hi-IN","English":"en-IN"};
  const r=new SR();r.lang=m[localStorage.getItem("studyLanguage")]||"mr-IN";
  r.onresult=e=>{$("q").value=e.results[0][0].transcript;run()};
  r.start();
}

drawCats();drawHome();
if(location.hash.length>1){use(decodeURIComponent(location.hash.slice(1)))} // search.html#maths
</script>
</body>
</html>
