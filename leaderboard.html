<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
:root{--b:#2563eb;--ink:#0f172a;--mut:#64748b;--bg:#f1f5f9;--line:#e2e8f0}
body{background:var(--bg);color:var(--ink);min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:480px;margin:auto;min-height:100vh;padding-bottom:35px}
.top{position:sticky;top:0;z-index:50;background:var(--bg);padding:12px 15px 8px}
.bar{display:flex;gap:8px;align-items:center}
.ib{border:1px solid var(--line);background:#fff;width:42px;height:42px;border-radius:12px;font-size:23px;color:var(--ink);flex:none}
.box{flex:1;display:flex;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:15px;padding:0 10px;height:47px;gap:7px;min-width:0}
.box:focus-within{border-color:var(--b);box-shadow:0 0 0 3px #2563eb20}
.box input{flex:1;border:0;outline:0;font-size:14px;background:none;color:var(--ink);min-width:0}
.box button{border:0;background:none;font-size:19px;padding:3px}
.hero{margin:12px 15px 0;padding:19px;border-radius:20px;color:#fff;background:linear-gradient(135deg,#0f172a,#1e40af 65%,#3b82f6);box-shadow:0 10px 24px #1e3a8a24}
.hero .ai{font-size:11px;background:#ffffff20;border:1px solid #ffffff30;padding:5px 9px;border-radius:20px;display:inline-block}
.hero h1{font-size:23px;margin-top:11px}
.hero p{font-size:13px;line-height:1.6;opacity:.88;margin-top:5px}
.airow{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12px;color:#dbeafe}
.dot{height:8px;width:8px;border-radius:50%;background:#4ade80}
.sec{padding:6px 15px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 12px;font-size:12px;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.lbl{font-size:12px;font-weight:750;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:17px 0 9px;display:flex;justify-content:space-between;align-items:center}
.lbl button{color:var(--b);border:0;background:none;font-size:12px;font-weight:650}
.tags{display:flex;flex-wrap:wrap;gap:7px}
.tag{border:1px solid var(--line);background:#fff;border-radius:22px;padding:8px 12px;font-size:12px;color:var(--ink)}
.card{margin:12px 15px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px}
.res{display:flex;gap:11px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:9px;text-decoration:none;color:var(--ink);animation:up .2s}
@keyframes up{from{opacity:0;transform:translateY(6px)}}
.res:active{background:#f8fafc}
.ic{width:45px;height:45px;border-radius:13px;background:#eff6ff;display:flex;align-items:center;justify-content:center;font-size:23px;flex:none}
.res .t{flex:1;min-width:0}
.res b{display:block;font-size:14px}
.res small{display:block;color:var(--mut);font-size:12px;margin-top:3px;line-height:1.5}
.cat{font-size:10px;background:#f1f5f9;color:var(--mut);padding:4px 7px;border-radius:8px;font-weight:700;white-space:nowrap}
.empty{text-align:center;color:var(--mut);padding:30px 14px;font-size:13px;line-height:1.7}
.empty b{display:block;font-size:32px;margin-bottom:6px}
.cnt{font-size:12px;color:var(--mut);margin:9px 1px}
.airesult{border:1px solid #bfdbfe;background:#eff6ff;border-radius:15px;padding:13px;margin:12px 0}
.airesult h3{font-size:14px;color:#1d4ed8;margin-bottom:7px}
.airesult p{font-size:13px;line-height:1.7;white-space:pre-wrap}
.airesult button{margin-top:9px;background:#2563eb;color:#fff;border:0;border-radius:9px;padding:9px 12px;font-size:12px;font-weight:700}
.think{display:flex;gap:6px;justify-content:center;padding:22px}
.think i{width:9px;height:9px;border-radius:50%;background:var(--b);animation:bn 1s infinite}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes bn{50%{transform:translateY(-7px);opacity:.4}}
.footer{text-align:center;color:var(--mut);font-size:11px;padding:20px 10px}
.hide{display:none!important}
mark{background:#fef08a;color:inherit;border-radius:3px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 16px;border-radius:12px;font-size:12px;z-index:100;display:none;max-width:90%;text-align:center}
</style>
</head>

const getRecent=()=>{
 try{return JSON.parse(localStorage.getItem(RK)||"[]")}
 catch(e){return[]}
};

function addRecent(q){
 if(!q)return;
 const a=getRecent().filter(x=>x!==q);
 a.unshift(q);
 localStorage.setItem(RK,JSON.stringify(a.slice(0,8)));
}

function clearRecent(){
 localStorage.removeItem(RK);
 drawHome();
 toast("Recent searches clear झाले");
}

function drawCats(){
 const cats=["All",...new Set(PAGES.map(p=>p.c))];
 $("cats").innerHTML=cats.map(c=>
 `<button class="chip ${c===category?"on":""}" data-cat="${esc(c)}">${esc(c)}</button>`
 ).join("");

 $("cats").querySelectorAll("button").forEach(b=>{
  b.addEventListener("click",()=>{
   category=b.dataset.cat;
   drawCats();
   const q=$("q").value.trim();
   if(q)runSearch();
   else drawFeatured();
  });
 });
}

 $("recent").innerHTML=r.length?r.map(x=>
  `<button class="tag" data-query="${esc(x)}">🕘 ${esc(x)}</button>`
 ).join(""):'<span style="font-size:12px;color:var(--mut)">अजून शोधलेले काही नाही.</span>';

 $("popular").innerHTML=POPULAR.map(x=>
  `<button class="tag" data-query="${esc(x)}">🔥 ${esc(x)}</button>`
 ).join("");

 document.querySelectorAll("[data-query]").forEach(b=>{
  b.addEventListener("click",()=>useQuery(b.dataset.query));
 });

 drawFeatured();
}

function drawFeatured(){
 const items=PAGES.filter(p=>category==="All"||p.c===category).slice(0,8);
 $("featured").innerHTML=items.map(card).join("");
}

function card(p){
 return `<a class="res" href="${esc(p.u)}">
  <div class="ic">${p.i}</div>
  <div class="t"><b>${esc(p.t)}</b><small>${esc(p.d)}</small></div>
  <span class="cat">${esc(p.c)}</span>
 </a>`;
}

function clearQuery(){
 $("q").value="";
 $("clr").classList.add("hide");
 $("out").innerHTML="";
 $("aiout").innerHTML="";
 $("status").classList.add("hide");
 $("home").classList.remove("hide");
 category="All";
 drawCats();
 drawHome();
 $("q").focus();
}

/* Simple local matching as a fallback */
function tokens(q){
 return norm(q).split(/\s+/).filter(Boolean);
}

function localScore(p,query){
 const q=norm(query);
 const words=tokens(query);
 const title=norm(p.t);
 const desc=norm(p.d);
 const keys=norm(p.k);
 let score=0;

 if(title===q)score+=40;
 if(title.includes(q))score+=22;
 if(q.includes(title)&&title.length>2)score+=12;

 for(const w of words){
  if(w.length<2)continue;
  if(title.split(/\s+/).some(t=>t===w))score+=12;
  else if(title.includes(w))score+=7;
  if(keys.includes(w))score+=4;
  if(desc.includes(w))score+=3;
 }

 const special=[
  {words:["ganit","math","maths","mathematics","गणित"],cats:["Maths","11th-12th"]},
  {words:["coding","code","programming","कोडिंग"],cats:["Coding"]},
  {words:["college","colleges","कॉलेज","महाविद्यालय"],cats:["Career"]},
  {words:["doubt","shanka","शंका","प्रश्न","question"],cats:["AI"]},
  {words:["board","दहावी","10th","ssc"],cats:["Education"]},
  {words:["live class","live classes","batch","lecture"],cats:["Classes"]},
  {words:["video","videos","व्हिडिओ"],cats:["Videos"]},
  {words:["star","space","अंतराळ","तारे"],cats:["Science"]},
  {words:["message","messages","chat","मेसेज"],cats:["Social"]}
 ];

 for(const s of special){
  if(s.words.some(w=>q.includes(norm(w)))&&s.cats.includes(p.c))score+=10;
 }

 if(category!=="All"&&p.c!==category)return 0;
 return score;
}

function renderResults(query){
 const results=PAGES
  .map(p=>({p,s:localScore(p,query)}))
  .filter(x=>x.s>0)
  .sort((a,b)=>b.s-a.s)
  .slice(0,15);

 if(!results.length){
  $("out").innerHTML=`<div class="empty"><b>🔍</b>या शब्दासाठी थेट Page सापडला नाही.<br>दुसरे शब्द वापरून पाहा किंवा AI Search वापरून पाहा.</div>`;
  return;
 }

 $("out").innerHTML=`<div class="cnt">📚 संबंधित Pages · ${results.length} परिणाम</div>`+
 results.map(x=>card(x.p)).join("");
}

/*
 AI SEARCH
 Uses the existing endpoint from the supplied Doubt Desk code.
 The backend must support mode:"search" and return JSON.
 Expected response:
 {
   "answer":"...optional explanation...",
   "pages":["ai-study.html","basic math.html"]
 }
 It may also return:
 {"results":[{"url":"...","reason":"..."}]}
*/
async function aiSearch(query,id){
 const response=await fetch("/api/ai-study",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   mode:"search",
   question:
    "You are GyanSetu's page-finding assistant. The user wants to find pages in the app. "+
    "Understand their intent, including Marathi, Hindi, English and Roman Marathi. "+
    "Use ONLY the supplied page directory. Do not invent pages or features. "+
    "Return JSON only: {\"answer\":\"brief answer in the user's language\",\"pages\":[\"exact filename.html\"]}. "+
    "Select up to 6 most relevant filenames. "+
    "If uncertain, choose the closest pages. User query: "+query,
   language:localStorage.getItem("studyLanguage")||"मराठी",
   audience:"GyanSetu student",
   style:"Return concise JSON only",
   pages:PAGES.map(p=>({
    title:p.t,
    url:p.u,
    category:p.c,
    description:p.d,
    keywords:p.k
   }))
  })
 });

 if(!response.ok){
  let msg="AI Search उपलब्ध नाही.";
  try{const e=await response.json();if(e.error)msg=e.error}catch(_){}
  throw new Error(msg);
 }

 const data=await response.json();
 if(id!==requestNo)return;

 let raw=data.answer||data.result||data.output||"";
 let parsed=null;

 if(typeof raw==="object"&&raw!==null){
  parsed=raw;
 }else if(typeof raw==="string"){
  try{
   parsed=JSON.parse(raw.replace(/^```json\s*/i,"").replace(/\s*```$/,""));
  }catch(_){}
 }

 if(!parsed&&Array.isArray(data.pages)){
  parsed=data;
 }
 if(!parsed&&Array.isArray(data.results)){
  parsed={answer:data.answer||"",pages:data.results.map(x=>x.url||x.filename||x.page).filter(Boolean)};
 }

 if(!parsed){
  throw new Error("AI response format supported नाही.");
 }

 const allowed=new Map(PAGES.map(p=>[p.u,p]));
 const selected=[];

 for(const item of (parsed.pages||parsed.results||[])){
  const url=typeof item==="string"?item:(item.url||item.filename||item.page||"");
  const page=allowed.get(url);
  if(page&&!selected.some(x=>x.u===page.u))selected.push(page);
 }

 if(category!=="All"){
  const filtered=selected.filter(p=>p.c===category);
  selected.length=0;
  selected.push(...filtered);
 }

 $("aiout").innerHTML=`
 <div class="airesult">
  <h3>✨ AI ने काय समजलं?</h3>
  <p>${esc(parsed.answer||"तुमच्या प्रश्नानुसार संबंधित Pages शोधले आहेत.")}</p>
 </div>`;

 if(selected.length){
  $("out").innerHTML=`<div class="cnt">🤖 AI ने निवडलेले Pages</div>`+
   selected.map(card).join("");
 }else{
  renderResults(query);
 }
}

async function runSearch(){
 const query=$("q").value.trim();
 const id=++requestNo;

 $("clr").classList.toggle("hide",!query);
 $("aiout").innerHTML="";
 $("out").innerHTML="";

 if(!query){
  $("home").classList.remove("hide");
  $("status").classList.add("hide");
  drawHome();
  return;
 }

 $("home").classList.add("hide");
 $("status").classList.remove("hide");
 $("status").textContent="🔎 Pages शोधत आहे...";
 renderResults(query);

 clearTimeout(searchTimer);

 searchTimer=setTimeout(async()=>{
  if(id!==requestNo)return;
  $("status").textContent="🤖 AI तुमचा प्रश्न समजून घेत आहे...";
  try{
   await aiSearch(query,id);
   if(id===requestNo){
    $("status").textContent="AI Search पूर्ण";
    addRecent(query);
   }
  }catch(error){
   if(id!==requestNo)return;
   $("status").textContent="Local Smart Search";
   /* Local search remains available if the AI endpoint does not support search mode. */
   renderResults(query);
  }
 },450);
}

function useQuery(query){
 $("q").value=query;
 runSearch();
 $("q").focus();
}

function voice(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){
  toast("Voice Search या browser मध्ये उपलब्ध नाही.");
  return;
 }
 if(isListening&&recognition){
  recognition.stop();
  return;
 }

 recognition=new SR();
 recognition.lang=({
  "हिंदी":"hi-IN",
  "Hindi":"hi-IN",
  "English":"en-IN",
  "मराठी":"mr-IN",
  "Marathi":"mr-IN"
 })[localStorage.getItem("studyLanguage")]||"mr-IN";
 recognition.interimResults=false;
 recognition.maxAlternatives=1;
 isListening=true;
 $("mic").textContent="⏹️";

 recognition.onresult=e=>{
  $("q").value=e.results[0][0].transcript;
  runSearch();
 };
 recognition.onerror=()=>{
  toast("आवाज ओळखता आला नाही. पुन्हा प्रयत्न करा.");
 };
 recognition.onend=()=>{
  isListening=false;
  $("mic").textContent="🎤";
 };
 try{recognition.start()}catch(e){
  isListening=false;
  $("mic").textContent="🎤";
 }
}

$("q").addEventListener("input",runSearch);
$("q").addEventListener("keydown",e=>{
 if(e.key==="Enter"){
  e.preventDefault();
  const q=$("q").value.trim();
  if(q)addRecent(q);
  runSearch();
 }
});

drawCats();
drawHome();

/* Open a search directly: search.html#maths */
if(location.hash.length>1){
 try{useQuery(decodeURIComponent(location.hash.slice(1)))}catch(e){}
}
</script>
