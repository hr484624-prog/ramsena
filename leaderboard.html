<!DOCTYPE html>
<html lang="mr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>GyanSetu - Leaderboard</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at top left,#dceeff,transparent 38%),
    radial-gradient(circle at top right,#e8f5ff,transparent 38%),
    linear-gradient(180deg,#f3f9ff,#ffffff);
  color:#102a56;
  min-height:100vh;
}

.app{
  width:100%;
  max-width:430px;
  min-height:100vh;
  margin:auto;
  padding-bottom:100px;
}


/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:50;
  padding:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(18px);
  border-bottom:1px solid #dcecff;
  box-shadow:0 7px 25px rgba(23,105,224,.08);
}

.back{
  width:43px;
  height:43px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#edf6ff;
  color:#1769e0;
  font-size:30px;
  cursor:pointer;
}

.title{
  font-size:21px;
  font-weight:900;
  color:#102f60;
}

.trophy{
  width:43px;
  height:43px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#e5f2ff;
  font-size:23px;
}


/* HERO */

.hero{
  margin:18px 16px;
  padding:23px 16px;
  border-radius:25px;
  text-align:center;
  background:white;
  border:1px solid #dcecff;
  box-shadow:0 10px 30px rgba(23,105,224,.09);
}

.hero-icon{
  width:72px;
  height:72px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:23px;
  background:linear-gradient(135deg,#e7f3ff,#cfe7ff);
  font-size:39px;
}

.hero h2{
  margin-top:12px;
  font-size:22px;
  color:#12396f;
}

.hero p{
  margin-top:7px;
  color:#6d809d;
  font-size:13px;
}


/* PODIUM */

.podium{
  margin:20px 16px 25px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:8px;
}

.person{
  width:32%;
  text-align:center;
  padding:12px 5px;
  border-radius:20px;
  background:white;
  border:1px solid #dcecff;
  box-shadow:0 6px 18px rgba(23,105,224,.06);
}

.person.first{
  padding-top:5px;
  padding-bottom:17px;
  background:linear-gradient(145deg,#eaf5ff,#ffffff);
}

.person-avatar{
  width:57px;
  height:57px;
  margin:auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#1769e0,#56aaff);
  color:white;
  font-size:21px;
  font-weight:bold;
}

.person.first .person-avatar{
  width:76px;
  height:76px;
  font-size:28px;
  border:4px solid white;
}

.person strong{
  display:block;
  margin-top:8px;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.rank-number{
  margin-top:5px;
  font-size:21px;
}

.xp{
  margin-top:3px;
  color:#1769e0;
  font-size:12px;
  font-weight:bold;
}


/* SECTION */

.section-title{
  margin:25px 16px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:18px;
  font-weight:800;
  color:#12396f;
}

.total-users{
  font-size:11px;
  color:#7185a3;
  font-weight:normal;
}


/* PLAYER LIST */

.list{
  margin:0 16px;
}

.row{
  display:flex;
  align-items:center;
  gap:11px;
  padding:13px;
  margin-bottom:10px;
  border-radius:18px;
  background:white;
  border:1px solid #deebfa;
  box-shadow:0 6px 18px rgba(23,105,224,.06);
}

.number{
  width:30px;
  text-align:center;
  font-weight:bold;
  color:#607898;
}

.small-avatar{
  width:43px;
  height:43px;
  min-width:43px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#e1efff,#cfe5ff);
  color:#1769e0;
  font-weight:bold;
}

.user{
  flex:1;
  min-width:0;
}

.user strong{
  display:block;
  font-size:14px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.user small{
  display:block;
  margin-top:3px;
  color:#91a2b9;
  font-size:11px;
}

.row-xp{
  color:#1769e0;
  font-size:13px;
  font-weight:bold;
  white-space:nowrap;
}


/* MY RANK */

.my-rank{
  margin:20px 16px;
  padding:15px;
  display:flex;
  align-items:center;
  gap:11px;
  border-radius:19px;
  background:linear-gradient(135deg,#edf6ff,#ffffff);
  border:1.5px solid #bcdcff;
  box-shadow:0 9px 25px rgba(37,99,235,.08);
}

.my-rank-number{
  width:43px;
  height:43px;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#dfeeff;
  color:#1769e0;
  font-size:18px;
  font-weight:bold;
}

.my-rank-info{
  flex:1;
  min-width:0;
}

.my-rank-info strong{
  display:block;
  font-size:14px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.my-rank-info small{
  display:block;
  margin-top:3px;
  color:#647b9b;
  font-size:11px;
}

.my-xp{
  color:#1769e0;
  font-weight:bold;
  font-size:14px;
}


/* DAILY QUIZ */

.quiz-card{
  margin:22px 16px;
  padding:20px;
  border-radius:24px;
  background:linear-gradient(145deg,#0f4ea8,#1769e0,#4ba6ff);
  color:white;
  box-shadow:0 12px 30px rgba(23,105,224,.23);
}

.quiz-title{
  font-size:19px;
  font-weight:900;
}

.quiz-sub{
  margin-top:7px;
  font-size:12px;
  line-height:1.5;
  opacity:.9;
}

.quiz-status{
  margin-top:13px;
  padding:9px 11px;
  border-radius:11px;
  background:rgba(255,255,255,.15);
  font-size:11px;
}

.quiz-start{
  margin-top:15px;
  width:100%;
  border:none;
  padding:13px;
  border-radius:13px;
  background:white;
  color:#1769e0;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
}

.quiz-start:disabled{
  opacity:.65;
  cursor:not-allowed;
}


/* QUIZ MODAL */

.quiz-modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(7,25,55,.58);
  z-index:200;
  align-items:flex-end;
  justify-content:center;
}

.quiz-modal.show{
  display:flex;
}

.quiz-box{
  width:100%;
  max-width:430px;
  max-height:90vh;
  overflow-y:auto;
  background:white;
  border-radius:26px 26px 0 0;
  padding:21px;
}

.quiz-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.quiz-header h2{
  font-size:20px;
  color:#12396f;
}

.close-quiz{
  width:38px;
  height:38px;
  border:none;
  border-radius:12px;
  background:#edf5ff;
  color:#1769e0;
  font-size:22px;
}

.question-count{
  margin-top:10px;
  font-size:12px;
  color:#7890ae;
}

.question{
  margin-top:17px;
  font-size:17px;
  font-weight:800;
  line-height:1.5;
  color:#173a6e;
}

.options{
  margin-top:15px;
  display:grid;
  gap:10px;
}

.option{
  width:100%;
  padding:13px;
  border:1px solid #d7e7f9;
  border-radius:14px;
  background:#f7fbff;
  color:#24466f;
  text-align:left;
  font-size:13px;
  cursor:pointer;
}

.option.selected{
  background:#e4f1ff;
  border-color:#4b9cff;
  color:#1769e0;
  font-weight:bold;
}

.option.correct{
  background:#e5f8ee;
  border-color:#43b878;
  color:#16804b;
  font-weight:bold;
}

.option.wrong{
  background:#fff0f0;
  border-color:#e56b6b;
  color:#c53b3b;
  font-weight:bold;
}

.next-btn{
  width:100%;
  margin-top:18px;
  border:none;
  padding:13px;
  border-radius:14px;
  background:linear-gradient(135deg,#1769e0,#42a1ff);
  color:white;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.next-btn:disabled{
  opacity:.5;
}

.quiz-result{
  text-align:center;
  padding:20px 5px;
}

.result-icon{
  font-size:50px;
}

.result-score{
  margin-top:10px;
  font-size:29px;
  font-weight:900;
  color:#1769e0;
}

.result-text{
  margin-top:8px;
  color:#7185a3;
  font-size:13px;
  line-height:1.5;
}

.done-btn{
  width:100%;
  margin-top:18px;
  border:none;
  padding:13px;
  border-radius:14px;
  background:#1769e0;
  color:white;
  font-size:14px;
  font-weight:bold;
}


/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:100%;
  max-width:430px;
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-around;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(20px);
  border-top:1px solid #dcecff;
  box-shadow:0 -8px 25px rgba(23,105,224,.08);
  z-index:100;
}

.nav-item{
  min-width:55px;
  text-align:center;
  color:#71839e;
  font-size:10px;
  cursor:pointer;
}

.nav-item .icon{
  display:block;
  font-size:21px;
  margin-bottom:3px;
}

.nav-item.active{
  color:#1769e0;
  font-weight:bold;
}

.empty{
  margin:0 16px;
  padding:25px;
  text-align:center;
  border-radius:20px;
  background:white;
  border:1px solid #deebfa;
  color:#7185a3;
}

</style>

</head>


<body>

<div class="app">


<!-- HEADER -->

<div class="header">

  <div
    class="back"
    onclick="goHome()">

    ‹

  </div>

  <div class="title">
    Leaderboard
  </div>

  <div class="trophy">
    🏆
  </div>

</div>


<!-- HERO -->

<div class="hero">

  <div class="hero-icon">
    🏆
  </div>

  <h2>
    GyanSetu Champions
  </h2>

  <p>
    शिका • XP मिळवा • Rank वाढवा 🚀
  </p>

</div>


<!-- PODIUM -->

<div
  class="podium"
  id="podium">
</div>


<!-- ALL PLAYERS -->

<div class="section-title">

  <span>
    📊 All Learners
  </span>

  <span
    class="total-users"
    id="totalUsers">
    0 Learners
  </span>

</div>


<div
  class="list"
  id="leaderboardList">
</div>


<!-- MY RANK -->

<div
  class="my-rank"
  id="myRank">
</div>


<!-- DAILY QUIZ -->

<div class="quiz-card">

  <div class="quiz-title">
    🎮 Daily Quiz Challenge
  </div>

  <div class="quiz-sub">
    रोज एकदा Quiz खेळा आणि
    तुमचे Gyan Points वाढवा! ⭐
  </div>

  <div
    class="quiz-status"
    id="quizStatus">
    आजची Quiz उपलब्ध आहे.
  </div>

  <button
    class="quiz-start"
    id="startQuizBtn"
    onclick="startQuiz()">

    🎯 Quiz सुरू करा

  </button>

</div>


<!-- QUIZ MODAL -->

<div
  class="quiz-modal"
  id="quizModal">

  <div class="quiz-box">

    <div class="quiz-header">

      <h2>
        🎯 Daily Quiz
      </h2>

      <button
        class="close-quiz"
        onclick="closeQuiz()">

        ×

      </button>

    </div>

    <div
      class="question-count"
      id="questionCount">
      प्रश्न 1 / 5
    </div>

    <div
      id="quizContent">
    </div>

  </div>

</div>


<!-- BOTTOM NAV -->

<div class="bottom-nav">

  <div
    class="nav-item"
    onclick="goHome()">

    <span class="icon">🏠</span>
    Home

  </div>

  <div
    class="nav-item"
    onclick="window.location.href='learn.html'">

    <span class="icon">📚</span>
    Learn

  </div>

  <div
    class="nav-item"
    onclick="window.location.href='create.html'">

    <span class="icon">➕</span>
    Create

  </div>

  <div class="nav-item active">

    <span class="icon">🏆</span>
    Rank

  </div>

  <div
    class="nav-item"
    onclick="goProfile()">

    <span class="icon">👤</span>
    Profile

  </div>

</div>


</div>


<script>

/* =========================
   CURRENT USER
========================= */

const currentUsername =
  localStorage.getItem(
    "gyansetu_username"
  ) || "Student";


/* =========================
   LEADERBOARD
========================= */

let users = [];

try{

  users =
    JSON.parse(
      localStorage.getItem(
        "gyansetu_leaderboard"
      )
    ) || [];

}catch(error){

  users = [];

}


/* =========================
   CURRENT XP
========================= */

let currentXP =
  Number(
    localStorage.getItem(
      "gyansetu_xp"
    )
  ) || 0;


/* =========================
   UPDATE CURRENT USER
========================= */

let me =
  users.find(
    function(user){

      return user.username ===
        currentUsername;

    }
  );


if(me){

  me.xp =
    currentXP;

}else{

  users.push({

    username:
      currentUsername,

    xp:
      currentXP

  });

}


/* =========================
   SAVE
========================= */

function saveData(){

  localStorage.setItem(
    "gyansetu_leaderboard",
    JSON.stringify(users)
  );

}


/* =========================
   SORT
========================= */

function sortUsers(){

  users.sort(
    function(a,b){

      return Number(b.xp) -
             Number(a.xp);

    }
  );

}


/* =========================
   PODIUM
========================= */

function displayPodium(){

  sortUsers();

  const box =
    document.getElementById(
      "podium"
    );

  box.innerHTML = "";

  const top =
    users.slice(0,3);


  if(top[1]){

    box.innerHTML += `

      <div class="person">

        <div class="person-avatar">
          ${getInitial(top[1].username)}
        </div>

        <strong>
          ${escapeHTML(top[1].username)}
        </strong>

        <div class="rank-number">
          🥈
        </div>

        <div class="xp">
          ${Number(top[1].xp)} XP
        </div>

      </div>

    `;

  }


  if(top[0]){

    box.innerHTML += `

      <div class="person first">

        <div class="person-avatar">
          ${getInitial(top[0].username)}
        </div>

        <strong>
          ${escapeHTML(top[0].username)}
        </strong>

        <div class="rank-number">
          🥇
        </div>

        <div class="xp">
          ${Number(top[0].xp)} XP
        </div>

      </div>

    `;

  }


  if(top[2]){

    box.innerHTML += `

      <div class="person">

        <div class="person-avatar">
          ${getInitial(top[2].username)}
        </div>

        <strong>
          ${escapeHTML(top[2].username)}
        </strong>

        <div class="rank-number">
          🥉
        </div>

        <div class="xp">
          ${Number(top[2].xp)} XP
        </div>

      </div>

    `;

  }

}


/* =========================
   ALL PLAYERS
========================= */

function displayList(){

  sortUsers();

  const list =
    document.getElementById(
      "leaderboardList"
    );

  list.innerHTML = "";


  if(users.length === 0){

    list.innerHTML = `
      <div class="empty">
        👥 अजून कोणताही learner नाही.
      </div>
    `;

    return;

  }


  users.forEach(
    function(user,index){

      let medal = "";

      if(index === 0)
        medal = "🥇";

      else if(index === 1)
        medal = "🥈";

      else if(index === 2)
        medal = "🥉";


      list.innerHTML += `

        <div class="row">

          <div class="number">
            ${medal || index + 1}
          </div>

          <div class="small-avatar">
            ${getInitial(user.username)}
          </div>

          <div class="user">

            <strong>
              ${escapeHTML(user.username)}
            </strong>

            <small>
              Keep learning 🚀
            </small>

          </div>

          <div class="row-xp">
            ${Number(user.xp)} XP
          </div>

        </div>

      `;

    }
  );

}


/* =========================
   MY RANK
========================= */

function displayMyRank(){

  sortUsers();

  const box =
    document.getElementById(
      "myRank"
    );


  const index =
    users.findIndex(
      function(user){

        return user.username ===
          currentUsername;

      }
    );


  box.innerHTML = `

    <div class="my-rank-number">
      ${index + 1}
    </div>

    <div class="my-rank-info">

      <strong>
        @${escapeHTML(currentUsername)}
      </strong>

      <small>
        तुमचा सध्याचा Rank
      </small>

    </div>

    <div class="my-xp">
      ${currentXP} XP
    </div>

  `;

}


/* =========================
   COUNT
========================= */

function displayCount(){

  document.getElementById(
    "totalUsers"
  ).textContent =

    users.length +
    (
      users.length === 1
      ? " Learner"
      : " Learners"
    );

}


/* =========================
   DAILY QUIZ QUESTIONS
========================= */

const quizQuestions = [

  {
    q:"भारताची राजधानी कोणती आहे?",

    options:[
      "मुंबई",
      "नवी दिल्ली",
      "पुणे",
      "नाशिक"
    ],

    answer:1
  },


  {
    q:"5 + 7 = किती?",

    options:[
      "10",
      "11",
      "12",
      "13"
    ],

    answer:2
  },


  {
    q:"पाण्याचे रासायनिक सूत्र कोणते?",

    options:[
      "CO₂",
      "O₂",
      "H₂O",
      "NaCl"
    ],

    answer:2
  },


  {
    q:"सूर्य कोणत्या दिशेला उगवतो?",

    options:[
      "पश्चिम",
      "पूर्व",
      "उत्तर",
      "दक्षिण"
    ],

    answer:1
  },


  {
    q:"एका आठवड्यात किती दिवस असतात?",

    options:[
      "5",
      "6",
      "7",
      "8"
    ],

    answer:2
  }

];


/* =========================
   QUIZ VARIABLES
========================= */

let quizIndex = 0;

let quizScore = 0;

let selectedAnswer = null;


/* =========================
   TODAY KEY
========================= */

function getTodayKey(){

  const d = new Date();

  return (
    d.getFullYear() +
    "-" +
    String(d.getMonth()+1).padStart(2,"0") +
    "-" +
    String(d.getDate()).padStart(2,"0")
  );

}


/* =========================
   QUIZ STATUS
========================= */

function checkQuizStatus(){

  const last =
    localStorage.getItem(
      "gyansetu_daily_quiz_date"
    );

  const button =
    document.getElementById(
      "startQuizBtn"
    );

  const status =
    document.getElementById(
      "quizStatus"
    );


  if(last === getTodayKey()){

    status.textContent =
      "✅ आजची Quiz तुम्ही पूर्ण केली आहे. उद्या पुन्हा खेळा.";

    button.disabled = true;

    button.textContent =
      "✅ आजची Quiz पूर्ण";

  }else{

    status.textContent =
      "🎯 आजची Quiz उपलब्ध आहे • 5 प्रश्न • 50 XP";

    button.disabled = false;

    button.textContent =
      "🎯 Quiz सुरू करा";

  }

}


/* =========================
   START QUIZ
========================= */

function startQuiz(){

  if(
    localStorage.getItem(
      "gyansetu_daily_quiz_date"
    ) === getTodayKey()
  ){

    return;

  }


  quizIndex = 0;

  quizScore = 0;

  selectedAnswer = null;


  document
    .getElementById(
      "quizModal"
    )
    .classList.add(
      "show"
    );


  showQuestion();

}


/* =========================
   SHOW QUESTION
========================= */

function showQuestion(){

  const q =
    quizQuestions[
      quizIndex
    ];


  selectedAnswer = null;


  document.getElementById(
    "questionCount"
  ).textContent =

    "प्रश्न " +
    (quizIndex + 1) +
    " / " +
    quizQuestions.length;


  const content =
    document.getElementById(
      "quizContent"
    );


  let html = "";


  q.options.forEach(
    function(option,index){

      html += `

        <button
          class="option"
          onclick="selectAnswer(${index})">

          ${String.fromCharCode(65+index)}.
          ${escapeHTML(option)}

        </button>

      `;

    }
  );


  content.innerHTML = `

    <div class="question">
      ${escapeHTML(q.q)}
    </div>

    <div class="options">
      ${html}
    </div>

    <button
      class="next-btn"
      id="nextBtn"
      onclick="nextQuestion()"
      disabled>

      ${
        quizIndex ===
        quizQuestions.length - 1
        ? "🏆 Quiz पूर्ण करा"
        : "पुढचा प्रश्न →"
      }

    </button>

  `;

}


/* =========================
   SELECT ANSWER
========================= */

function selectAnswer(index){

  selectedAnswer = index;


  const options =
    document.querySelectorAll(
      ".option"
    );


  options.forEach(
    function(option,i){

      option.classList.remove(
        "selected"
      );

      if(i === index){

        option.classList.add(
          "selected"
        );

      }

    }
  );


  document.getElementById(
    "nextBtn"
  ).disabled = false;

}


/* =========================
   NEXT QUESTION
========================= */

function nextQuestion(){

  if(selectedAnswer === null)
    return;


  const correct =
    quizQuestions[
      quizIndex
    ].answer;


  if(
    selectedAnswer ===
    correct
  ){

    quizScore++;

  }


  quizIndex++;


  if(
    quizIndex <
    quizQuestions.length
  ){

    showQuestion();

  }else{

    finishQuiz();

  }

}


/* =========================
   FINISH QUIZ
========================= */

function finishQuiz(){

  const today =
    new Date().toISOString().split("T")[0];

  localStorage.setItem(
    "gyansetu_daily_quiz_date",
    today
  );

  const earnedXP =
    score * 10;

  currentXP += earnedXP;

  localStorage.setItem(
    "gyansetu_xp",
    currentXP
  );

  /* UPDATE LEADERBOARD */

  const existingIndex =
    users.findIndex(
      u => u.username === currentUsername
    );

  if(existingIndex >= 0){

    users[existingIndex].xp =
      currentXP;

  }else{

    users.push({
      username:currentUsername,
      xp:currentXP
    });

  }

  users.sort(
    (a,b) => b.xp - a.xp
  );

  localStorage.setItem(
    "gyansetu_leaderboard",
    JSON.stringify(users)
  );


  /* SHOW RESULT */

  document.getElementById(
    "quizArea"
  ).innerHTML = `

    <div class="quiz-result">

      <div class="result-icon">
        🏆
      </div>

      <h2>Quiz पूर्ण झाली!</h2>

      <p>
        तुझे गुण
      </p>

      <div class="final-score">
        ${score} / ${quizQuestions.length}
      </div>

      <div class="earned-xp">
        +${earnedXP} XP मिळाले 🎉
      </div>

      <p class="result-message">
        ${
          score === quizQuestions.length
          ? "अप्रतिम! सर्व प्रश्न बरोबर! 🔥"
          : score >= 3
          ? "खूप छान! अशीच मेहनत करत राहा 💪"
          : "छान प्रयत्न! पुन्हा अभ्यास करून पुढच्या Quiz साठी तयार रहा 📚"
        }
      </p>

      <button
        class="primary-btn"
        onclick="closeQuiz()">
        Close
      </button>

    </div>

  `;

}


/* =========================
   CLOSE QUIZ
========================= */

function closeQuiz(){

  document
    .getElementById("quizModal")
    .classList.remove("show");

  location.reload();

}


/* =========================
   DAILY QUIZ CHECK
========================= */

function checkDailyQuiz(){

  const today =
    new Date().toISOString().split("T")[0];

  const lastQuizDate =
    localStorage.getItem(
      "gyansetu_daily_quiz_date"
    );

  if(lastQuizDate === today){

    document.getElementById(
      "quizArea"
    ).innerHTML = `

      <div class="already-played">

        <div class="result-icon">
          ⏰
        </div>

        <h2>आजची Quiz झाली आहे</h2>

        <p>
          एका दिवसात फक्त एकदाच Daily Quiz खेळता येईल.
        </p>

        <p>
          उद्या पुन्हा Quiz खेळून XP मिळवा 🚀
        </p>

      </div>

    `;

    return false;

  }

  return true;

}


/* =========================
   START QUIZ
========================= */

function startQuiz(){

  if(!checkDailyQuiz())
    return;

  currentQuestion = 0;
  score = 0;

  document.getElementById(
    "quizArea"
  ).innerHTML = `

    <div class="question-box">

      <div class="question-number">
        प्रश्न 1 / ${quizQuestions.length}
      </div>

      <h2 id="questionText"></h2>

      <div
        id="optionsBox"
        class="options">
      </div>

      <button
        id="nextBtn"
        class="primary-btn"
        onclick="nextQuestion()"
        disabled>

        पुढचा प्रश्न →

      </button>

    </div>

  `;

  showQuestion();

}


/* =========================
   SHOW QUESTION
========================= */

function showQuestion(){

  const q =
    quizQuestions[currentQuestion];

  document.getElementById(
    "questionText"
  ).textContent = q.q;

  document.querySelector(
    ".question-number"
  ).textContent =
    `प्रश्न ${currentQuestion + 1} / ${quizQuestions.length}`;

  const optionsBox =
    document.getElementById(
      "optionsBox"
    );

  optionsBox.innerHTML = "";

  q.options.forEach(
    (option,index) => {

      const button =
        document.createElement("button");

      button.className =
        "option-btn";

      button.textContent =
        option;

      button.onclick =
        () => selectAnswer(index);

      optionsBox.appendChild(
        button
      );

    }
  );

  document.getElementById(
    "nextBtn"
  ).disabled = true;

}


/* =========================
   SELECT ANSWER
========================= */

function selectAnswer(index){

  const q =
    quizQuestions[currentQuestion];

  const buttons =
    document.querySelectorAll(
      ".option-btn"
    );

  buttons.forEach(
    btn => {
      btn.disabled = true;
    }
  );

  if(index === q.answer){

    buttons[index].classList.add(
      "correct"
    );

    score++;

  }else{

    buttons[index].classList.add(
      "wrong"
    );

    buttons[q.answer].classList.add(
      "correct"
    );

  }

  document.getElementById(
    "nextBtn"
  ).disabled = false;

}


/* =========================
   NEXT QUESTION
========================= */

function nextQuestion(){

  currentQuestion++;

  if(
    currentQuestion <
    quizQuestions.length
  ){

    showQuestion();

  }else{

    finishQuiz();

  }

}
