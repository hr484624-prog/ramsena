/* HEADER */

/* CHAT */

.message-row{

.message-row.received{

  font-size:15px;

}

.back-users-btn{

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://eqglttfffhvoyvrclzse.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rR4xxl0dW5DJrhhjqiFHLw_uJ-HakAb";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   VARIABLES
========================= */

const params =
new URLSearchParams(
  window.location.search
);

const receiverId =
params.get("id");

let currentUser = null;

let receiverProfile = null;

let realtimeChannel = null;


/* =========================
   BACK
========================= */

function goBack(){

  if(receiverId){

    window.location.href =
      "user-profile.html?id=" +
      encodeURIComponent(receiverId);

  }else{

    window.location.href =
      "users.html";

  }

}


/* =========================
   DARK MODE
========================= */

function loadDarkMode(){

  if(
    localStorage.getItem("darkMode") === "true"
  ){

    document.body.classList.add("dark");

  }

}


/* =========================
   TOAST
========================= */

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent =
    message;

  toast.style.display =
    "block";

  setTimeout(
    function(){

      toast.style.display =
        "none";

    },
    2500
  );

}


/* =========================
   ERROR
========================= */

function showError(message){

  document.getElementById(
    "chatArea"
  ).style.display =
    "none";

  document.getElementById(
    "inputArea"
  ).style.display =
    "none";

  document.getElementById(
    "errorScreen"
  ).style.display =
    "flex";

  document.getElementById(
    "errorText"
  ).textContent =
    message;

}


/* =========================
   TIME
========================= */

function formatTime(dateString){

  return new Date(
    dateString
  ).toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =========================
   ESCAPE
========================= */

function escapeHtml(text){

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


/* =========================
   CURRENT USER
========================= */

async function getCurrentUser(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getUser();

  if(error){

    console.error(
      "Auth error:",
      error
    );

    return null;

  }

  return data?.user || null;

}


/* =========================
   RECEIVER
========================= */

async function loadReceiver(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("Profiles")
    .select(
      "id, username, full_name, email"
    )
    .eq(
      "id",
      receiverId
    )
    .maybeSingle();

  if(error){

    console.error(
      "Receiver error:",
      error
    );

    return null;

  }

  return data;

}


function getReceiverName(){

  if(!receiverProfile){

    return "User";

  }

  return (
    receiverProfile.full_name ||
    receiverProfile.username ||
    "User"
  );

}


/* =========================
   MARK READ
========================= */

async function markMessagesAsRead(){

  if(
    !currentUser ||
    !receiverId
  ){

    return;

  }

  const {
    error
  } =
  await supabaseClient
    .from("Messages")
    .update({
      is_read:true
    })
    .eq(
      "sender_id",
      receiverId
    )
    .eq(
      "receiver_id",
      currentUser.id
    )
    .eq(
      "is_read",
      false
    );

  if(error){

    console.error(
      "Mark read error:",
      error
    );

  }

}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages(){

  if(
    !currentUser ||
    !receiverId
  ){

    return;

  }

  const {
    data: sentMessages,
    error: sentError
  } =
  await supabaseClient
    .from("Messages")
    .select(
      "id,sender_id,receiver_id,message,created_at,is_read"
    )
    .eq(
      "sender_id",
      currentUser.id
    )
    .eq(
      "receiver_id",
      receiverId
    );

  if(sentError){

    console.error(
      "Sent messages error:",
      sentError
    );

  }


  const {
    data: receivedMessages,
    error: receivedError
  } =
  await supabaseClient
    .from("Messages")
    .select(
      "id,sender_id,receiver_id,message,created_at,is_read"
    )
    .eq(
      "sender_id",
      receiverId
    )
    .eq(
      "receiver_id",
      currentUser.id
    );

  if(receivedError){

    console.error(
      "Received messages error:",
      receivedError
    );

  }


  const allMessages = [

    ...(sentMessages || []),

    ...(receivedMessages || [])

  ];


  allMessages.sort(
    function(a,b){

      return new Date(a.created_at) -
             new Date(b.created_at);

    }
  );


  displayMessages(
    allMessages
  );

}


/* =========================
   PHOTO CHECK
========================= */

function isPhotoMessage(message){

  return (
    typeof message === "string" &&
    message.startsWith("PHOTO:")
  );

}


function getPhotoUrl(message){

  return message.substring(6);

}


/* =========================
   DISPLAY
========================= */

function displayMessages(messageList){

  const container =
    document.getElementById("messages");

  container.innerHTML = "";


  if(
    !messageList ||
    messageList.length === 0
  ){

    container.innerHTML = `

      <div class="empty-chat">

        <div class="empty-icon">
          💬
        </div>

        <div>
          No messages yet
        </div>

        <div style="margin-top:5px;">
          Start the conversation!
        </div>

      </div>

    `;

    return;

  }


  messageList.forEach(
    function(msg){

      createMessageElement(
        msg,
        container
      );

    }
  );


  scrollToBottom();

}


/* =========================
   CREATE MESSAGE
========================= */

function createMessageElement(
  msg,
  container
){

  const isSent =
    msg.sender_id ===
    currentUser.id;


  const row =
    document.createElement("div");

  row.className =
    "message-row " +
    (
      isSent
      ? "sent"
      : "received"
    );

  row.setAttribute(
    "data-message-id",
    msg.id
  );


  const bubble =
    document.createElement("div");

  bubble.className =
    "message-bubble";


  /* PHOTO */

  if(
    isPhotoMessage(
      msg.message
    )
  ){

    bubble.classList.add(
      "photo-bubble"
    );


    const url =
      getPhotoUrl(
        msg.message
      );


    const img =
      document.createElement("img");

    img.className =
      "chat-photo";

    img.src =
      url;

    img.alt =
      "Photo";

    img.loading =
      "lazy";

    img.onclick =
      function(){

        openImageViewer(url);

      };


    const time =
      document.createElement("span");

    time.className =
      "photo-time";

    time.textContent =
      formatTime(
        msg.created_at
      );


    bubble.appendChild(img);

    bubble.appendChild(time);

  }

  /* TEXT */

  else{

    bubble.innerHTML = `

      <span>
        ${escapeHtml(msg.message)}
      </span>

      <span class="message-time">
        ${formatTime(msg.created_at)}
      </span>

    `;

  }


  row.appendChild(
    bubble
  );

  container.appendChild(
    row
  );

}


/* =========================
   SCROLL
========================= */

function scrollToBottom(){

  const chatArea =
    document.getElementById(
      "chatArea"
    );

  setTimeout(
    function(){

      chatArea.scrollTop =
        chatArea.scrollHeight;

    },
    50
  );

}


/* =========================
   SEND TEXT
========================= */

async function sendMessage(){

  if(
    !currentUser ||
    !receiverId
  ){

    showToast(
      "Chat is not available."
    );

    return;

  }


  const input =
    document.getElementById(
      "messageInput"
    );

  const sendBtn =
    document.getElementById(
      "sendBtn"
    );


  const text =
    input.value.trim();


  if(!text){

    return;

  }


  if(
    currentUser.id ===
    receiverId
  ){

    showToast(
      "You cannot message yourself."
    );

    return;

  }


  sendBtn.disabled =
    true;

  input.disabled =
    true;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("Messages")
    .insert({

      sender_id:
        currentUser.id,

      receiver_id:
        receiverId,

      message:
        text,

      is_read:
        false

    })
    .select()
    .single();


  sendBtn.disabled =
    false;

  input.disabled =
    false;


  if(error){

    console.error(
      "Send message error:",
      error
    );

    showToast(
      "Message send झाला नाही."
    );

    return;

  }


  input.value =
    "";


  addMessageToChat(
    data
  );


  input.focus();

}


/* =========================
   OPEN PHOTO
========================= */

function openPhotoPicker(){

  if(
    !currentUser ||
    !receiverId
  ){

    showToast(
      "Chat is not available."
    );

    return;

  }


  document
    .getElementById(
      "photoInput"
    )
    .click();

}


/* =========================
   PHOTO INPUT
========================= */

document
  .getElementById(
    "photoInput"
  )
  .addEventListener(
    "change",
    async function(event){

      const file =
        event.target.files &&
        event.target.files[0];


      if(!file){

        return;

      }


      await sendPhoto(
        file
      );


      event.target.value =
        "";

    }
  );


/* =========================
   SEND PHOTO
========================= */

async function sendPhoto(file){

  if(
    !currentUser ||
    !receiverId
  ){

    return;

  }


  if(
    !file.type.startsWith("image/")
  ){

    showToast(
      "फक्त photo select करा."
    );

    return;

  }


  if(
    file.size >
    10 * 1024 * 1024
  ){

    showToast(
      "Photo 10 MB पेक्षा कमी असावा."
    );

    return;

  }


  const photoBtn =
    document.getElementById(
      "photoBtn"
    );

  const sendBtn =
    document.getElementById(
      "sendBtn"
    );

  const input =
    document.getElementById(
      "messageInput"
    );

  const overlay =
    document.getElementById(
      "uploadOverlay"
    );


  photoBtn.disabled =
    true;

  sendBtn.disabled =
    true;

  input.disabled =
    true;

  overlay.style.display =
    "flex";


  try{

    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase();


    const fileName =
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2,10) +
      "." +
      extension;


    const filePath =
      currentUser.id +
      "/" +
      fileName;


    /* UPLOAD */

    const {
      error: uploadError
    } =
    await supabaseClient
      .storage
      .from("chat-images")
      .upload(
        filePath,
        file,
        {
          cacheControl:"3600",
          upsert:false,
          contentType:file.type
        }
      );


    if(uploadError){

      console.error(
        "Upload error:",
        uploadError
      );

      showToast(
        "Photo upload झाला नाही."
      );

      return;

    }


    /* PUBLIC URL */

    const {
      data: publicData
    } =
    supabaseClient
      .storage
      .from("chat-images")
      .getPublicUrl(
        filePath
      );


    const photoUrl =
      publicData.publicUrl;


    /* SAVE MESSAGE */

    const {
      data,
      error
    } =
    await supabaseClient
      .from("Messages")
      .insert({

        sender_id:
          currentUser.id,

        receiver_id:
          receiverId,

        message:
          "PHOTO:" +
          photoUrl,

        is_read:
          false

      })
      .select()
      .single();


    if(error){

      console.error(
        "Photo message error:",
        error
      );

      showToast(
        "Photo message send झाला नाही."
      );

      return;

    }


    addMessageToChat(
      data
    );


    showToast(
      "Photo sent ✓"
    );

  }

  catch(error){

    console.error(
      "Photo send error:",
      error
    );

    showToast(
      "Photo send करताना error आला."
    );

  }

  finally{

    overlay.style.display =
      "none";

    photoBtn.disabled =
      false;

    sendBtn.disabled =
      false;

    input.disabled =
      false;

    input.focus();

  }

}


/* =========================
   ADD MESSAGE
========================= */

function addMessageToChat(msg){

  if(!msg){

    return;

  }


  const container =
    document.getElementById(
      "messages"
    );


  const empty =
    container.querySelector(
      ".empty-chat"
    );


  if(empty){

    empty.remove();

  }


  const existing =
    document.querySelector(
      '[data-message-id="' +
      msg.id +
      '"]'
    );


  if(existing){

    return;

  }


  createMessageElement(
    msg,
    container
  );


  if(
    msg.sender_id === receiverId &&
    msg.receiver_id === currentUser.id
  ){

    markMessagesAsRead();

  }


  scrollToBottom();

}


/* =========================
   IMAGE VIEWER
========================= */

  ).src =

  document.getElementById(

function closeImageViewer(){

  ).style.display =
    "none";

  document.getElementById(

  ).src =
    "";

}


/* =========================
   REALTIME
========================= */

function setupRealtime(){

  if(
    !currentUser ||
    !receiverId
  ){

    return;

  }


  realtimeChannel =
    supabaseClient
      .channel(
        "chat-" +
        currentUser.id +
        "-" +
        receiverId
      )

      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"Messages"
        },

        function(payload){

          const msg =
            payload.new;


          const isThisChat =

            (
              msg.sender_id ===
              currentUser.id &&

              msg.receiver_id ===
              receiverId
            )

            ||

            (
              msg.sender_id ===
              receiverId &&

              msg.receiver_id ===
              currentUser.id
            );


          if(isThisChat){

            addMessageToChat(
              msg
            );

          }

        }

      )

      .subscribe(
        function(status){

          console.log(
            "Realtime status:",
            status
          );

        }
      );

}


/* =========================
   CLEAN REALTIME
========================= */

window.addEventListener(
  "beforeunload",
  function(){

    if(realtimeChannel){

      supabaseClient.removeChannel(
        realtimeChannel
      );

    }

  }
);


/* =========================
   ENTER SEND
========================= */

document
  .getElementById(
    "messageInput"
  )
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter" &&
        !event.shiftKey
      ){

        event.preventDefault();

        sendMessage();

      }

    }
  );


/* =========================
   START CHAT
========================= */

async function startChat(){

  loadDarkMode();


  if(!receiverId){

    showError(
      "Receiver user ID is missing."
    );

    return;

  }


  currentUser =
    await getCurrentUser();


  if(!currentUser){

    showError(
      "Please login to use messages."
    );

    return;

  }


  if(
    currentUser.id ===
    receiverId
  ){

    showError(
      "You cannot message yourself."
    );

    return;

  }


  receiverProfile =
    await loadReceiver();


  if(!receiverProfile){

    showError(
      "This user does not exist."
    );

    return;

  }


  document.getElementById(
    "receiverName"
  ).textContent =
    getReceiverName();


  document.getElementById(
    "receiverStatus"
  ).textContent =
    "GyanSetu User";


  await markMessagesAsRead();

  await loadMessages();

  setupRealtime();


  document.getElementById(
    "messageInput"
  ).focus();

}


/* RUN */

startChat();
