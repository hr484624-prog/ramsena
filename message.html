<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Messages - GyanSetu</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#222;
}

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

.header{
  height:60px;
  flex-shrink:0;
  background:linear-gradient(
    135deg,
    #1769e0,
    #6c35d9
  );
  color:white;
  display:flex;
  align-items:center;
  padding:0 13px;
  gap:12px;
}

.back{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.16);
  color:white;
  font-size:25px;
}

.name{
  font-weight:bold;
  font-size:17px;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:14px;
}

.empty{
  text-align:center;
  color:#777;
  margin-top:45px;
}

.row{
  display:flex;
  margin-bottom:10px;
}

.row.sent{
  justify-content:flex-end;
}

.row.received{
  justify-content:flex-start;
}

.bubble{
  max-width:82%;
  background:white;
  padding:10px;
  border-radius:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.sent .bubble{
  background:#2563eb;
  color:white;
  border-bottom-right-radius:4px;
}

.received .bubble{
  border-bottom-left-radius:4px;
}

.time{
  font-size:10px;
  opacity:.6;
  margin-top:5px;
  text-align:right;
}


/* VIDEO MESSAGE */

.video-message{
  width:250px;
  max-width:100%;
  overflow:hidden;
  border-radius:14px;
  background:#09090f;
  color:white;
  cursor:pointer;
}

.video-message-top{
  height:135px;
  background:linear-gradient(
    135deg,
    #111,
    #262040
  );
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
}

.video-message-info{
  padding:11px;
}

.video-message-title{
  font-weight:bold;
  line-height:1.35;
}

.video-message-open{
  color:#ff42d6;
  font-size:12px;
  margin-top:7px;
}

.input{
  display:flex;
  gap:8px;
  padding:8px;
  background:white;
  border-top:1px solid #ddd;
}

.input input{
  flex:1;
  border:1px solid #ccc;
  border-radius:22px;
  padding:11px 14px;
  outline:none;
  font-size:15px;
}

.send{
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:#2563eb;
  color:white;
  font-size:18px;
}

.toast{
  position:fixed;
  bottom:75px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  color:white;
  padding:10px 17px;
  border-radius:20px;
  display:none;
}

.toast.show{
  display:block;
}

</style>
</head>

<body>

<div class="app">

<header class="header">

<button
  class="back"
  onclick="goBack()">
  ‹
</button>

<div
  class="name"
  id="receiverName">
  Messages
</div>

</header>


<main
  class="chat"
  id="chat">

<div class="empty">
  Loading messages...
</div>

</main>


<div class="input">

<input
  id="messageInput"
  placeholder="Type a message..."
  autocomplete="off">

<button
  class="send"
  onclick="sendMessage()">
  ➤
</button>

</div>

</div>


<div
  class="toast"
  id="toast">
</div>


<script>

const SUPABASE_URL =
"https://eqglttfffhvoyvrclzse.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rR4xxl0dW5DJrhhjqiFHLw_uJ-HakAb";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser=null;
let receiverId=null;


/* URL */

const params =
new URLSearchParams(
  location.search
);

receiverId =
params.get("id");


/* BACK */

function goBack(){

  if(receiverId){

    location.href =
      "user-profile.html?id=" +
      encodeURIComponent(receiverId);

  }else{

    location.href="home.html";

  }

}


/* TOAST */

function showToast(text){

  const toast =
    document.getElementById("toast");

  toast.textContent=text;
  toast.classList.add("show");

  setTimeout(()=>{
    toast.classList.remove("show");
  },2300);

}


/* USER */

async function getUser(){

  const {
    data
  } =
  await supabaseClient.auth.getUser();

  currentUser =
    data?.user || null;

}


/* RECEIVER */

async function loadReceiver(){

  if(!receiverId){
    return;
  }

  const {
    data
  } =
  await supabaseClient
  .from("Profiles")
  .select("*")
  .eq("id",receiverId)
  .maybeSingle();


  if(data){

    document.getElementById(
      "receiverName"
    ).textContent =
      data.full_name ||
      data.username ||
      "Messages";

  }

}


/* VIDEO CHECK */

function isVideoMessage(text){

  return (
    typeof text==="string" &&
    text.startsWith("VIDEO:")
  );

}


/* VIDEO DATA */

function getVideoId(text){

  const value =
    text.substring(6);

  return value.split("|")[0];

}

function getVideoTitle(text){

  const value =
    text.substring(6);

  return value
    .split("|")
    .slice(1)
    .join("|");

}


/* CREATE MESSAGE */

function createMessage(message){

  const row =
    document.createElement("div");

  row.className =
    "row " +
    (
      message.sender_id === currentUser.id
      ? "sent"
      : "received"
    );


  const bubble =
    document.createElement("div");

  bubble.className="bubble";


  if(isVideoMessage(message.message)){

    const id =
      getVideoId(message.message);

    const title =
      getVideoTitle(message.message);


    const videoCard =
      document.createElement("div");

    videoCard.className=
      "video-message";


    videoCard.innerHTML=`

      <div class="video-message-top">
        🎬
      </div>

      <div class="video-message-info">

        <div class="video-message-title">
          ${escapeHtml(title || "GyanSetu Video")}
        </div>

        <div class="video-message-open">
          ▶ Tap to watch video
        </div>

      </div>

    `;


    videoCard.onclick=function(){

      location.href =
        "video.html?id=" +
        encodeURIComponent(id);

    };


    bubble.appendChild(
      videoCard
    );

  }else{

    const text =
      document.createElement("div");

    text.textContent =
      message.message;

    bubble.appendChild(text);

  }


  const time =
    document.createElement("div");

  time.className="time";

  time.textContent =
    new Date(
      message.created_at
    ).toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );


  bubble.appendChild(time);

  row.appendChild(bubble);

  return row;

}


/* LOAD */

async function loadMessages(){

  if(!currentUser || !receiverId){
    return;
  }


  const {
    data,
    error
  } =
  await supabaseClient
  .from("Messages")
  .select(
    "id,sender_id,receiver_id,message,created_at"
  )
  .or(
    `and(sender_id.eq.${currentUser.id},receiver_id.eq.${receiverId}),and(sender_id.eq.${receiverId},receiver_id.eq.${currentUser.id})`
  )
  .order(
    "created_at",
    {
      ascending:true
    }
  );


  if(error){

    console.error(error);

    return;

  }


  const chat =
    document.getElementById("chat");

  chat.innerHTML="";


  if(!data || !data.length){

    chat.innerHTML=
      `<div class="empty">
        No messages yet.
      </div>`;

    return;

  }


  data.forEach(message=>{

    chat.appendChild(
      createMessage(message)
    );

  });


  scrollBottom();

}


/* SEND */

async function sendMessage(){

  const input =
    document.getElementById(
      "messageInput"
    );

  const text =
    input.value.trim();


  if(!text){
    return;
  }

  if(!currentUser || !receiverId){
    return;
  }


  const {
    error
  } =
  await supabaseClient
  .from("Messages")
  .insert({

    sender_id:
      currentUser.id,

    receiver_id:
      receiverId,

    message:
      text,

    is_read:false

  });


  if(error){

    console.error(error);

    showToast(
      "Message send failed."
    );

    return;

  }


  input.value="";

  await loadMessages();

}


/* REALTIME */

supabaseClient
.channel(
  "messages-" +
  Math.random()
)
.on(
  "postgres_changes",
  {
    event:"INSERT",
    schema:"public",
    table:"Messages"
  },
  payload=>{

    const m =
      payload.new;

    if(
      (
        m.sender_id===currentUser?.id &&
        m.receiver_id===receiverId
      )
      ||
      (
        m.sender_id===receiverId &&
        m.receiver_id===currentUser?.id
      )
    ){

      loadMessages();

    }

  }
)
.subscribe();


/* ENTER */

document
.getElementById("messageInput")
.addEventListener(
  "keydown",
  function(e){

    if(
      e.key==="Enter"
    ){

      e.preventDefault();
      sendMessage();

    }

  }
);


/* SCROLL */

function scrollBottom(){

  const chat =
    document.getElementById("chat");

  setTimeout(()=>{
    chat.scrollTop =
      chat.scrollHeight;
  },50);

}


/* ESCAPE */

function escapeHtml(text){

  const div =
    document.createElement("div");

  div.textContent =
    text ?? "";

  return div.innerHTML;

}


/* START */

async function start(){

  await getUser();

  if(!currentUser){
    return;
  }

  await loadReceiver();

  await loadMessages();

}

start();

</script>

</body>
</html>
