<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>CRICKET X</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#06120c;
  font-family:Arial,sans-serif;
}

body{
  color:white;
}

/* =====================================================
   GAME
===================================================== */

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    linear-gradient(
      #5faee2 0%,
      #9dd8f1 37%,
      #6f9d4a 38%,
      #284d27 100%
    );
}

/* =====================================================
   STADIUM
===================================================== */

#stadium{
  position:absolute;
  width:100%;
  height:100%;
  overflow:hidden;
}

/* SKY */

.sun{
  position:absolute;
  width:110px;
  height:110px;
  border-radius:50%;
  right:12%;
  top:8%;

  background:#fff1a1;

  box-shadow:
    0 0 70px #fff4b2;
}

/* =====================================================
   CROWD
===================================================== */

#crowd{
  position:absolute;
  left:0;
  right:0;
  top:26%;
  height:19%;

  background:
    repeating-linear-gradient(
      90deg,
      #202a34 0px,
      #202a34 8px,
      #33414c 9px,
      #33414c 18px
    );

  border-top:
    8px solid #151d25;

  border-bottom:
    10px solid #151d25;

  box-shadow:
    0 15px 30px rgba(0,0,0,.35);
}

/* CROWD DOTS */

#crowd:after{
  content:"";
  position:absolute;
  inset:10px;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.7) 0 2px,
      transparent 3px
    );

  background-size:
    15px 13px;

  opacity:.5;

  animation:
    crowdMove 1s infinite alternate;
}

@keyframes crowdMove{
  from{
    transform:translateY(0);
  }
  to{
    transform:translateY(3px);
  }
}

/* =====================================================
   STADIUM LIGHTS
===================================================== */

.lightPole{
  position:absolute;
  width:12px;
  height:260px;

  bottom:48%;
  background:#333b41;

  z-index:5;
}

.lightPole:before{
  content:"";

  position:absolute;
  width:130px;
  height:45px;

  left:-59px;
  top:-25px;

  border-radius:15px;

  background:#d9e5ea;

  box-shadow:
    0 0 30px
    rgba(255,255,255,.8);
}

.lp1{
  left:8%;
}

.lp2{
  right:8%;
}

/* =====================================================
   FIELD
===================================================== */

#field{
  position:absolute;

  width:1150px;
  height:650px;

  left:50%;
  top:60%;

  transform:
    translate(-50%,-50%)
    perspective(700px)
    rotateX(55deg);

  border-radius:50%;

  background:
    radial-gradient(
      ellipse,
      #75aa48 0%,
      #548536 48%,
      #3b682d 75%,
      #284d27 100%
    );

  box-shadow:
    0 0 80px rgba(0,0,0,.4);

  transition:
    transform .35s ease;
}

/* =====================================================
   INNER CIRCLE
===================================================== */

.innerCircle{
  position:absolute;

  width:720px;
  height:400px;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  border:
    5px solid
    rgba(255,255,255,.55);

  border-radius:50%;
}

/* =====================================================
   PITCH
===================================================== */

#pitch{
  position:absolute;

  width:170px;
  height:700px;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  background:
    linear-gradient(
      90deg,
      #b8945c,
      #d0ad72,
      #a98450
    );

  box-shadow:
    inset 0 0 30px rgba(0,0,0,.25);
}

/* PITCH LINES */

.crease{
  position:absolute;

  width:170px;
  height:5px;

  background:#fff;
}

.c1{
  top:100px;
}

.c2{
  bottom:100px;
}

/* =====================================================
   BOWLER
===================================================== */

#bowler{
  position:absolute;

  left:50%;
  top:20%;

  width:60px;
  height:150px;

  transform:
    translateX(-50%)
    scale(.85);

  z-index:30;
}

.bowlerHead{
  position:absolute;

  width:38px;
  height:38px;

  left:11px;

  border-radius:50%;

  background:#9f6749;

  border:
    3px solid #242424;
}

.bowlerBody{
  position:absolute;

  width:50px;
  height:75px;

  left:5px;
  top:34px;

  border-radius:15px;

  background:
    linear-gradient(
      #174a8a,
      #0b274d
    );
}

.bowlerLeg1,
.bowlerLeg2{
  position:absolute;

  width:15px;
  height:55px;

  top:100px;

  background:#20242a;
}

.bowlerLeg1{
  left:8px;
}

.bowlerLeg2{
  right:8px;
}

/* =====================================================
   BATSMAN
===================================================== */

#batsman{
  position:absolute;

  left:50%;
  top:67%;

  width:90px;
  height:180px;

  transform:
    translate(-50%,-50%);

  z-index:100;
}

.batHead{
  position:absolute;

  width:44px;
  height:44px;

  left:23px;

  border-radius:50%;

  background:#a96e50;

  border:
    3px solid #242424;
}

.helmet{
  position:absolute;

  width:50px;
  height:20px;

  left:20px;
  top:0;

  border-radius:
    20px 20px 5px 5px;

  background:#172b43;
}

.batBody{
  position:absolute;

  width:62px;
  height:78px;

  left:14px;
  top:39px;

  border-radius:
    15px 15px 10px 10px;

  background:
    linear-gradient(
      #e5e9ef,
      #9ba8b5
    );

  border:
    3px solid #39424b;
}

.batLeg{
  position:absolute;

  width:19px;
  height:62px;

  top:112px;

  background:#18222b;

  border-radius:5px;
}

.bl1{
  left:18px;
}

.bl2{
  right:18px;
}

/* BAT */

#bat{
  position:absolute;

  width:17px;
  height:105px;

  right:-17px;
  top:73px;

  background:
    linear-gradient(
      90deg,
      #9b6a3e,
      #e0bb76,
      #916036
    );

  border-radius:
    5px 5px 10px 10px;

  transform:
    rotate(25deg);

  transform-origin:
    50% 10%;
}

/* =====================================================
   BALL
===================================================== */

#ball{
  position:absolute;

  width:18px;
  height:18px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 30% 25%,
      #ff6a6a,
      #b80000 70%
    );

  box-shadow:
    0 3px 8px rgba(0,0,0,.5);

  z-index:90;

  left:50%;
  top:25%;

  transform:
    translate(-50%,-50%);

  display:none;
}

/* =====================================================
   BALL TRAIL
===================================================== */

#trail{
  position:absolute;

  width:70px;
  height:5px;

  border-radius:50%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.7)
    );

  transform-origin:right center;

  display:none;

  z-index:80;
}

/* =====================================================
   SHADOW
===================================================== */

#ballShadow{
  position:absolute;

  width:25px;
  height:10px;

  border-radius:50%;

  background:
    rgba(0,0,0,.3);

  filter:blur(4px);

  display:none;

  z-index:20;
}

/* =====================================================
   SCORE HUD
===================================================== */

#scoreBoard{
  position:fixed;

  top:10px;
  left:50%;

  transform:translateX(-50%);

  width:min(450px,92%);

  padding:10px 15px;

  border-radius:16px;

  background:
    rgba(4,15,25,.82);

  border:
    1px solid
    rgba(255,255,255,.25);

  box-shadow:
    0 8px 25px rgba(0,0,0,.3);

  z-index:500;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.team{
  font-size:12px;
  color:#a9c9df;
}

.score{
  font-size:23px;
  font-weight:bold;
}

.over{
  font-size:12px;
  color:#c8d9e5;
}

/* =====================================================
   COMMENTARY
===================================================== */

#commentary{
  position:fixed;

  left:50%;
  top:21%;

  transform:
    translateX(-50%)
    scale(.9);

  padding:12px 20px;

  border-radius:30px;

  background:
    rgba(0,0,0,.65);

  color:#fff;

  font-size:14px;
  font-weight:bold;

  opacity:0;

  transition:
    .25s;

  z-index:600;
}

#commentary.show{
  opacity:1;
  transform:
    translateX(-50%)
    scale(1);
}

/* =====================================================
   SHOT BUTTONS
===================================================== */

#controls{
  position:fixed;

  left:50%;
  bottom:18px;

  transform:translateX(-50%);

  width:min(500px,95%);

  display:flex;

  justify-content:
    space-between;

  align-items:center;

  z-index:600;
}

.shot{
  width:68px;
  height:68px;

  border-radius:50%;

  border:
    2px solid
    rgba(255,255,255,.4);

  background:
    rgba(0,0,0,.58);

  color:white;

  font-size:11px;
  font-weight:bold;

  box-shadow:
    0 5px 20px rgba(0,0,0,.3);
}

.shot:active{
  transform:scale(.9);
}

.shot.big{
  width:84px;
  height:84px;

  background:
    linear-gradient(
      145deg,
      #e53935,
      #8b1111
    );

  font-size:13px;
}

/* =====================================================
   CAMERA
===================================================== */

#cameraTouch{
  position:fixed;

  right:0;
  top:80px;

  width:52%;
  height:55%;

  z-index:450;
}

#cameraHint{
  position:fixed;

  right:12px;
  top:90px;

  font-size:10px;

  color:
    rgba(255,255,255,.6);

  z-index:460;
}

/* =====================================================
   MENU BUTTON
===================================================== */

#menuBtn{
  position:fixed;

  right:12px;
  top:12px;

  width:42px;
  height:42px;

  border:0;
  border-radius:12px;

  background:
    rgba(0,0,0,.6);

  color:white;

  font-size:20px;

  z-index:700;
}

/* =====================================================
   POPUP
===================================================== */

#popup{
  position:fixed;

  inset:0;

  background:
    rgba(0,0,0,.78);

  backdrop-filter:
    blur(10px);

  z-index:1000;

  display:flex;

  justify-content:center;
  align-items:center;
}

.popupBox{
  width:min(400px,92%);

  padding:25px;

  border-radius:25px;

  background:
    linear-gradient(
      145deg,
      #122b41,
      #07131d
    );

  border:
    1px solid
    #43a9ff;

  box-shadow:
    0 0 60px
    rgba(30,150,255,.35);

  text-align:center;

  animation:
    popupIn .4s ease;
}

@keyframes popupIn{

  from{
    opacity:0;
    transform:
      scale(.7)
      translateY(30px);
  }

  to{
    opacity:1;
    transform:
      scale(1)
      translateY(0);
  }
}

.logo{
  font-size:34px;
  font-weight:900;

  letter-spacing:2px;

  margin-bottom:5px;

  background:
    linear-gradient(
      90deg,
      #fff,
      #58b9ff
    );

  -webkit-background-clip:text;
  color:transparent;
}

.subtitle{
  color:#9eb8cb;
  font-size:12px;
  margin-bottom:22px;
}

.menuItem{
  width:100%;

  padding:15px;

  margin:8px 0;

  border:0;

  border-radius:14px;

  color:white;

  font-size:15px;

  font-weight:bold;

  background:
    linear-gradient(
      90deg,
      #1671d9,
      #39a9ff
    );
}

.menuItem.orange{
  background:
    linear-gradient(
      90deg,
      #e36b18,
      #ff9d35
    );
}

.menuItem.green{
  background:
    linear-gradient(
      90deg,
      #17824d,
      #39bf78
    );
}

/* =====================================================
   RESULT POPUP
===================================================== */

#resultPopup{
  position:fixed;

  inset:0;

  background:
    rgba(0,0,0,.72);

  backdrop-filter:
    blur(8px);

  z-index:1200;

  display:none;

  align-items:center;
  justify-content:center;
}

.resultBox{
  width:min(380px,90%);

  padding:30px;

  border-radius:25px;

  text-align:center;

  background:
    linear-gradient(
      145deg,
      #152d3d,
      #07121a
    );

  border:
    1px solid
    #54b5ff;
}

.resultBox h2{
  font-size:28px;
  margin-bottom:15px;
}

.finalScore{
  font-size:42px;
  font-weight:900;

  margin:15px;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  #field{
    width:950px;
    height:570px;
  }

  #pitch{
    width:145px;
    height:600px;
  }

  #batsman{
    top:68%;
  }

  #bowler{
    top:18%;
  }

  .shot{
    width:58px;
    height:58px;
  }

  .shot.big{
    width:74px;
    height:74px;
  }

}
</style>
</head>

<body>

<div id="game">

  <!-- ============================================
       STADIUM
  ============================================= -->

  <div id="stadium">

    <div class="sun"></div>

    <div id="crowd"></div>

    <div class="lightPole lp1"></div>
    <div class="lightPole lp2"></div>

    <div id="field">

      <div class="innerCircle"></div>

      <div id="pitch">

        <div class="crease c1"></div>
        <div class="crease c2"></div>

      </div>

    </div>

    <!-- BOWLER -->

    <div id="bowler">

      <div class="bowlerHead"></div>

      <div class="bowlerBody"></div>

      <div class="bowlerLeg1"></div>
      <div class="bowlerLeg2"></div>

    </div>


    <!-- BATSMAN -->

    <div id="batsman">

      <div class="helmet"></div>

      <div class="batHead"></div>

      <div class="batBody"></div>

      <div class="batLeg bl1"></div>
      <div class="batLeg bl2"></div>

      <div id="bat"></div>

    </div>


    <!-- BALL -->

    <div id="ball"></div>

    <div id="trail"></div>

    <div id="ballShadow"></div>

  </div>


  <!-- ============================================
       SCORE
  ============================================= -->

  <div id="scoreBoard">

    <div>

      <div class="team">
        INDIA XI
      </div>

      <div class="score">
        <span id="runs">0</span>/<span id="wickets">0</span>
      </div>

    </div>

    <div class="over">
      OVER
      <b id="over">0.0</b>
    </div>

    <div class="team">
      TARGET
      <b id="target">51</b>
    </div>

  </div>


  <!-- COMMENTARY -->

  <div id="commentary">
    Welcome to CRICKET X
  </div>


  <!-- MENU -->

  <button id="menuBtn"
          onclick="openMenu()">
    ☰
  </button>


  <!-- CAMERA -->

  <div id="cameraTouch"></div>

  <div id="cameraHint">
    DRAG TO MOVE CAMERA
  </div>


  <!-- ============================================
       CONTROLS
  ============================================= -->

  <div id="controls">

    <button class="shot"
            onclick="playShot('DEFENCE')">
      🛡️<br>
      DEFENCE
    </button>

    <button class="shot"
            onclick="playShot('DRIVE')">
      ↗️<br>
      DRIVE
    </button>

    <button class="shot big"
            onclick="playShot('POWER')">
      🏏<br>
      POWER
    </button>

    <button class="shot"
            onclick="playShot('CUT')">
      ↘️<br>
      CUT
    </button>

    <button class="shot"
            onclick="playShot('LOFT')">
      🚀<br>
      LOFT
    </button>

  </div>


  <!-- ============================================
       START POPUP
  ============================================= -->

  <div id="popup">

    <div class="popupBox">

      <div class="logo">
        CRICKET X
      </div>

      <div class="subtitle">
        ULTIMATE CRICKET ARENA
      </div>

      <button class="menuItem"
              onclick="startMatch()">
        🏏 QUICK MATCH
      </button>

      <button class="menuItem orange"
              onclick="showMessage('🏆 Tournament mode coming next')">
        🏆 TOURNAMENT
      </button>

      <button class="menuItem green"
              onclick="showMessage('🎯 Practice Arena selected')">
        🎯 PRACTICE
      </button>

      <div id="menuMessage"
           style="
           margin-top:15px;
           color:#91b5cc;
           font-size:12px;">
        Select a mode to begin
      </div>

    </div>

  </div>


  <!-- ============================================
       RESULT
  ============================================= -->

  <div id="resultPopup">

    <div class="resultBox">

      <h2 id="resultTitle">
        INNINGS COMPLETE
      </h2>

      <div class="finalScore">

        <span id="finalRuns">0</span> /
        <span id="finalWickets">0</span>

      </div>

      <p id="resultText">
        Great innings!
      </p>

      <button class="menuItem"
              onclick="restartGame()">
        🔄 PLAY AGAIN
      </button>

      <button class="menuItem green"
              onclick="closeResult()">
        🏠 LOBBY
      </button>

    </div>

  </div>

</div>


<script>

/* =====================================================
   GAME DATA
===================================================== */

let runs = 0;
let wickets = 0;

let balls = 0;

let target = 51;

let matchStarted = false;

let ballMoving = false;

let cameraRotation = 0;


/* =====================================================
   ELEMENTS
===================================================== */

const ball =
  document.getElementById("ball");

const bat =
  document.getElementById("bat");

const bowler =
  document.getElementById("bowler");

const commentary =
  document.getElementById("commentary");

const runsEl =
  document.getElementById("runs");

const wicketsEl =
  document.getElementById("wickets");

const overEl =
  document.getElementById("over");

const targetEl =
  document.getElementById("target");


/* =====================================================
   MENU
===================================================== */

function openMenu(){

  document.getElementById(
    "popup"
  ).style.display="flex";

}


function showMessage(text){

  document.getElementById(
    "menuMessage"
  ).innerText=text;

}


/* =====================================================
   START
===================================================== */

function startMatch(){

  document.getElementById(
    "popup"
  ).style.display="none";

  matchStarted=true;

  showCommentary(
    "🏏 Match starting..."
  );

  setTimeout(
    bowlBall,
    1200
  );

}


/* =====================================================
   COMMENTARY
===================================================== */

function showCommentary(text){

  commentary.innerText=text;

  commentary.classList.add(
    "show"
  );

  setTimeout(function(){

    commentary.classList.remove(
      "show"
    );

  },1600);

}


/* =====================================================
   BOWLING
===================================================== */

function bowlBall(){

  if(!matchStarted) return;

  if(
    wickets>=5 ||
    runs>=target
  ){

    finishMatch();

    return;

  }

  ballMoving=true;

  ball.style.display="block";

  ball.style.left="50%";
  ball.style.top="25%";

  bowler.animate(
    [
      {
        transform:
        "translateX(-50%) rotate(0deg)"
      },
      {
        transform:
        "translateX(-50%) rotate(-8deg)"
      },
      {
        transform:
        "translateX(-50%) rotate(8deg)"
      },
      {
        transform:
        "translateX(-50%) rotate(0deg)"
      }
    ],
    {
      duration:700
    }
  );


  const startTime =
    performance.now();

  const duration=1500;


  function animateBall(time){

    if(!ballMoving)
      return;

    let p=
      (time-startTime)/duration;

    if(p>1)
      p=1;


    /* curved flight */

    let x=50;

    let y=
      25+
      p*42;

    let scale=
      .65+
      p*.8;

    ball.style.left=
      x+"%";

    ball.style.top=
      y+"%";

    ball.style.transform=
      "translate(-50%,-50%) scale("+
      scale+
      ")";


    if(p<1){

      requestAnimationFrame(
        animateBall
      );

    }else{

      ballMoving=false;

      missBall();

    }

  }

  requestAnimationFrame(
    animateBall
  );

}


/* =====================================================
   MISS / DOT BALL
===================================================== */

function missBall(){

  balls++;

  updateOver();
  showCommentary(
    "• DOT BALL"
  );

  ball.style.display="none";

  setTimeout(
    bowlBall,
    1100
  );

}


/* =====================================================
   SHOTS
===================================================== */

function playShot(type){

  if(
    !matchStarted ||
    !ballMoving
  ){
    return;
  }

  ballMoving=false;

  let result=0;


  if(type==="DEFENCE"){

    result =
      Math.random()<0.75
      ? 0
      : 1;

  }


  if(type==="DRIVE"){

    let r=Math.random();

    if(r<0.55){
      result=4;
    }
    else if(r<0.75){
      result=2;
    }
    else{
      result=1;
    }

  }


  if(type==="CUT"){

    let r=Math.random();

    if(r<0.60){
      result=4;
    }
    else{
      result=2;
    }

  }


  if(type==="LOFT"){

    let r=Math.random();

    if(r<0.45){
      result=6;
    }
    else if(r<0.75){
      result=4;
    }
    else{
      result=1;
    }

  }


  if(type==="POWER"){

    let r=Math.random();

    if(r<0.55){
      result=6;
    }
    else if(r<0.80){
      result=4;
    }
    else{
      result=2;
    }

  }


  /* =========================
     WICKET CHANCE
  ========================= */

  if(
    Math.random()<0.08 &&
    type!=="DEFENCE"
  ){

    wicket();

    return;

  }


  scoreRuns(
    result,
    type
  );

}


/* =====================================================
   SCORE RUNS
===================================================== */

function scoreRuns(
  amount,
  shot
){

  runs += amount;

  balls++;

  updateScore();

  animateBat();


  /* =========================
     BALL DISAPPEAR
  ========================= */

  ball.style.display="block";


  setTimeout(
    function(){

      ball.style.display="none";

    },
    450
  );


  /* =========================
     COMMENTARY
  ========================= */

  if(amount===6){

    showCommentary(
      "🔥 SIX! WHAT A HIT!"
    );

  }

  else if(amount===4){

    showCommentary(
      "🏏 FOUR! BEAUTIFUL SHOT!"
    );

  }

  else if(amount===0){

    showCommentary(
      "🛡️ SOLID DEFENCE"
    );

  }

  else if(amount===1){

    showCommentary(
      "🏃 QUICK SINGLE"
    );

  }

  else if(amount===2){

    showCommentary(
      "🏃🏃 TWO RUNS!"
    );

  }

  else{

    showCommentary(
      "RUNS: "+amount
    );

  }


  /* =========================
     UPDATE OVER
  ========================= */

  updateOver();


  /* =========================
     TARGET CHECK
  ========================= */

  if(
    runs>=target
  ){

    setTimeout(
      finishMatch,
      900
    );

    return;

  }


  /* =========================
     NEXT BALL
  ========================= */

  setTimeout(
    bowlBall,
    1100
  );

}


/* =====================================================
   WICKET
===================================================== */

function wicket(){

  wickets++;

  balls++;

  updateScore();

  updateOver();

  animateWicket();


  showCommentary(
    "❌ WICKET!"
  );


  ball.style.display="none";


  /* =========================
     ALL WICKETS
  ========================= */

  if(
    wickets>=5
  ){

    setTimeout(
      finishMatch,
      1000
    );

    return;

  }


  /* =========================
     NEXT BALL
  ========================= */

  setTimeout(
    bowlBall,
    1300
  );

}


/* =====================================================
   BAT ANIMATION
===================================================== */

function animateBat(){

  bat.animate(
    [
      {
        transform:
        "rotate(25deg)"
      },

      {
        transform:
        "rotate(-65deg)"
      },

      {
        transform:
        "rotate(20deg)"
      }
    ],
    {
      duration:420,
      easing:"ease-out"
    }
  );

}


/* =====================================================
   WICKET ANIMATION
===================================================== */

function animateWicket(){

  const player =
    document.getElementById(
      "batsman"
    );


  player.animate(
    [
      {
        transform:
        "translate(-50%,-50%) rotate(0deg)"
      },

      {
        transform:
        "translate(-50%,-50%) rotate(-12deg)"
      },

      {
        transform:
        "translate(-50%,-50%) rotate(0deg)"
      }
    ],
    {
      duration:500,
      easing:"ease-out"
    }
  );

}


/* =====================================================
   SCORE UPDATE
===================================================== */

function updateScore(){

  runsEl.innerText =
    runs;

  wicketsEl.innerText =
    wickets;

  targetEl.innerText =
    Math.max(
      0,
      target-runs
    );

}


/* =====================================================
   OVER UPDATE
===================================================== */

function updateOver(){

  let completeOvers =
    Math.floor(
      balls/6
    );

  let currentBalls =
    balls%6;


  overEl.innerText =
    completeOvers+
    "."+
    currentBalls;

}


/* =====================================================
   CAMERA ROTATION
===================================================== */

const cameraTouch =
  document.getElementById(
    "cameraTouch"
  );


let cameraDown=false;

let lastX=0;

let lastY=0;


/* =========================
   CAMERA START
========================= */

cameraTouch.addEventListener(
  "pointerdown",
  function(e){

    cameraDown=true;

    lastX=e.clientX;
    lastY=e.clientY;

    cameraTouch.setPointerCapture(
      e.pointerId
    );

  }
);


/* =========================
   CAMERA MOVE
========================= */

cameraTouch.addEventListener(
  "pointermove",
  function(e){

    if(!cameraDown)
      return;


    let dx =
      e.clientX-lastX;

    let dy =
      e.clientY-lastY;


    lastX=e.clientX;
    lastY=e.clientY;


    cameraRotation +=
      dx*0.25;


    /* =========================
       CAMERA VERTICAL EFFECT
    ========================= */

    let vertical =
      dy*0.12;


    let field =
      document.getElementById(
        "field"
      );


    field.style.transform =
      "translate(-50%,-50%) "+
      "perspective(700px) "+
      "rotateX("+
      (55-vertical)+
      "deg) "+
      "rotateZ("+
      cameraRotation+
      "deg)";

  }
);


/* =========================
   CAMERA END
========================= */

cameraTouch.addEventListener(
  "pointerup",
  function(){

    cameraDown=false;

  }
);


cameraTouch.addEventListener(
  "pointercancel",
  function(){

    cameraDown=false;

  }
);


/* =====================================================
   RESULT SCREEN
===================================================== */

function finishMatch(){

  matchStarted=false;


  document.getElementById(
    "finalRuns"
  ).innerText =
    runs;


  document.getElementById(
    "finalWickets"
  ).innerText =
    wickets;


  if(
    runs>=target
  ){

    document.getElementById(
      "resultTitle"
    ).innerText =
      "🏆 YOU WIN!";


    document.getElementById(
      "resultText"
    ).innerText =
      "Target chased successfully!";

  }

  else{

    document.getElementById(
      "resultTitle"
    ).innerText =
      "INNINGS COMPLETE";


    document.getElementById(
      "resultText"
    ).innerText =
      "Great innings!";

  }


  document.getElementById(
    "resultPopup"
  ).style.display =
    "flex";

}


/* =====================================================
   RESTART GAME
===================================================== */

function restartGame(){

  runs=0;

  wickets=0;

  balls=0;

  matchStarted=false;


  updateScore();

  updateOver();


  document.getElementById(
    "resultPopup"
  ).style.display =
    "none";


  setTimeout(
    function(){

      matchStarted=true;

      showCommentary(
        "🏏 NEW INNINGS!"
      );

      setTimeout(
        bowlBall,
        800
      );

    },
    300
  );

}

function closeResult(){
