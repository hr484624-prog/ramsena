<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>CRICKET X</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#06111d;
}

body{
  color:white;
}

button{
  border:0;
  outline:0;
  font-family:Arial,sans-serif;
  cursor:pointer;
}

/* =====================================================
   GAME
===================================================== */

#game{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
  background:
    linear-gradient(
      to bottom,
      #1976d2 0%,
      #64b5f6 35%,
      #8bc34a 36%,
      #388e3c 100%
    );
}

/* =====================================================
   SKY
===================================================== */

#sky{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      to bottom,
      #0b5ca8 0%,
      #42a5f5 32%,
      #90caf9 47%,
      #6cae3d 48%,
      #24752d 100%
    );
}

.sun{
  position:absolute;
  width:85px;
  height:85px;
  border-radius:50%;
  background:#fff5a8;
  right:12%;
  top:8%;
  box-shadow:0 0 45px #fff3a0;
}

/* =====================================================
   STADIUM
===================================================== */

#stadium{
  position:absolute;
  left:0;
  right:0;
  top:28%;
  height:18%;
  background:
    repeating-linear-gradient(
      90deg,
      #20252b 0px,
      #30363d 8px,
      #191d22 16px
    );
  border-top:4px solid #111;
  border-bottom:6px solid #111;
  transform:perspective(500px) rotateX(-8deg);
}

.crowd{
  position:absolute;
  left:0;
  right:0;
  bottom:15%;
  height:50%;
  background:
    radial-gradient(circle,#f5f5f5 0 2px,transparent 3px) 0 0/13px 11px,
    radial-gradient(circle,#e53935 0 2px,transparent 3px) 5px 5px/15px 12px,
    radial-gradient(circle,#1e88e5 0 2px,transparent 3px) 8px 1px/17px 13px;
  opacity:.75;
}

/* =====================================================
   LIGHTS
===================================================== */

.lightPole{
  position:absolute;
  top:8%;
  width:10px;
  height:38%;
  background:#263238;
  border-radius:5px;
}

.lightPole.left{
  left:5%;
}

.lightPole.right{
  right:5%;
}

.lightBox{
  position:absolute;
  top:7%;
  left:50%;
  transform:translateX(-50%);
  width:65px;
  height:28px;
  background:#eceff1;
  border-radius:6px;
  box-shadow:0 0 25px white;
}

/* =====================================================
   FIELD
===================================================== */

#field{
  position:absolute;
  width:125%;
  height:85%;
  left:-12.5%;
  top:38%;
  border-radius:50% 50% 0 0;
  background:
    repeating-radial-gradient(
      ellipse at center,
      #2e8b36 0,
      #2e8b36 32px,
      #318f3b 33px,
      #318f3b 65px
    );
  border-top:7px solid #78c850;
  transform:perspective(700px) rotateX(12deg);
}

/* =====================================================
   INNER CIRCLE
===================================================== */

.innerCircle{
  position:absolute;
  width:67%;
  height:62%;
  left:16.5%;
  top:18%;
  border:2px solid rgba(255,255,255,.45);
  border-radius:50%;
}

/* =====================================================
   PITCH
===================================================== */

#pitch{
  position:absolute;
  width:150px;
  height:48%;
  left:50%;
  top:19%;
  transform:translateX(-50%);
  background:
    repeating-linear-gradient(
      90deg,
      #c9a56a 0,
      #c9a56a 5px,
      #d4b278 6px,
      #d4b278 10px
    );
  border-left:3px solid #a7834d;
  border-right:3px solid #a7834d;
  box-shadow:0 0 20px rgba(0,0,0,.25);
}

.crease{
  position:absolute;
  left:8%;
  right:8%;
  height:4px;
  background:white;
}

.crease.top{
  top:9%;
}

.crease.bottom{
  bottom:9%;
}

/* =====================================================
   WICKETS
===================================================== */

.wicket{
  position:absolute;
  width:34px;
  height:40px;
  z-index:20;
}

.wicket.stumps{
  display:flex;
  justify-content:space-between;
}

.wicket.stumps span{
  width:4px;
  height:36px;
  background:#f5f5f5;
  border-radius:2px;
}

.wicket.stumps b{
  position:absolute;
  width:10px;
  height:4px;
  background:#f5f5f5;
  top:2px;
  left:7px;
  box-shadow:10px 0 white;
}

#wicketBottom{
  left:50%;
  bottom:4%;
  transform:translateX(-50%);
}

#wicketTop{
  left:50%;
  top:4%;
  transform:translateX(-50%);
}

/* =====================================================
   PLAYER BASE
===================================================== */

.player{
  position:absolute;
  width:54px;
  height:82px;
  transform:translate(-50%,-50%);
  z-index:15;
  transition:.25s;
}

.playerBody{
  position:absolute;
  width:22px;
  height:35px;
  left:16px;
  top:27px;
  border-radius:9px 9px 5px 5px;
}

.playerHead{
  position:absolute;
  width:19px;
  height:19px;
  border-radius:50%;
  left:18px;
  top:7px;
  background:#c88962;
  border:2px solid #8d5b3f;
}

.playerLeg{
  position:absolute;
  width:7px;
  height:24px;
  background:#18212a;
  top:58px;
  border-radius:5px;
}

.playerLeg.left{
  left:17px;
  transform:rotate(8deg);
}

.playerLeg.right{
  left:29px;
  transform:rotate(-8deg);
}

.playerName{
  position:absolute;
  left:50%;
  top:84px;
  transform:translateX(-50%);
  white-space:nowrap;
  padding:4px 7px;
  border-radius:8px;
  background:rgba(0,0,0,.8);
  font-size:9px;
  font-weight:bold;
  z-index:50;
}

/* India */

.india .playerBody{
  background:#1565c0;
  box-shadow:inset 0 -5px rgba(255,255,255,.15);
}

/* Australia */

.australia .playerBody{
  background:#f5c400;
  box-shadow:inset 0 -5px #176b35;
}

.australia .playerName{
  border:1px solid #f5c400;
}

/* =====================================================
   FIELDERS
===================================================== */

#fielders{
  position:absolute;
  inset:0;
  z-index:14;
}

.f1{left:35%;top:49%}
.f2{left:65%;top:49%}
.f3{left:23%;top:58%}
.f4{left:77%;top:58%}
.f5{left:12%;top:70%}
.f6{left:88%;top:70%}
.f7{left:28%;top:77%}
.f8{left:72%;top:77%}
.f9{left:42%;top:84%}
.f10{left:58%;top:84%}
.f11{left:50%;top:65%}

/* =====================================================
   BATSMAN
===================================================== */

#batsman{
  position:absolute;
  left:50%;
  top:63%;
  width:62px;
  height:100px;
  transform:translate(-50%,-50%);
  z-index:30;
}

.batHead{
  position:absolute;
  width:23px;
  height:23px;
  left:20px;
  top:3px;
  border-radius:50%;
  background:#c98c66;
}

.helmet{
  position:absolute;
  width:29px;
  height:13px;
  left:17px;
  top:1px;
  border-radius:15px 15px 3px 3px;
  background:#1565c0;
  border:2px solid white;
}

.batBody{
  position:absolute;
  width:27px;
  height:38px;
  left:18px;
  top:28px;
  border-radius:9px;
  background:#1565c0;
}

.batLeg{
  position:absolute;
  width:9px;
  height:35px;
  top:62px;
  background:white;
  border-radius:5px;
}

.batLeg.left{
  left:20px;
  transform:rotate(6deg);
}

.batLeg.right{
  left:34px;
  transform:rotate(-7deg);
}

/* =====================================================
   BAT
===================================================== */

#bat{
  position:absolute;
  width:10px;
  height:67px;
  left:48px;
  top:36px;
  background:#e8c27b;
  border:2px solid #8d6232;
  border-radius:3px;
  transform-origin:bottom center;
  transform:rotate(-22deg);
  z-index:31;
  transition:.18s;
}

#bat.grip{
  background:#333;
}

/* =====================================================
   BOWLER
===================================================== */

#bowler{
  position:absolute;
  left:50%;
  top:45%;
  width:60px;
  height:90px;
  transform:translate(-50%,-50%);
  z-index:25;
}

.bowlerHead{
  position:absolute;
  width:21px;
  height:21px;
  left:19px;
  top:3px;
  border-radius:50%;
  background:#c98c66;
}

.bowlerBody{
  position:absolute;
  width:25px;
  height:38px;
  left:18px;
  top:28px;
  border-radius:8px;
  background:#f5c400;
}

.bowlerLeg1,
.bowlerLeg2{
  position:absolute;
  width:8px;
  height:31px;
  top:63px;
  background:#176b35;
  border-radius:5px;
}

.bowlerLeg1{
  left:19px;
}

.bowlerLeg2{
  left:34px;
}

/* =====================================================
   BALL
===================================================== */

#ball{
  position:absolute;
  width:15px;
  height:15px;
  border-radius:50%;
  background:#d50000;
  border:2px solid white;
  left:50%;
  top:45%;
  transform:translate(-50%,-50%);
  z-index:40;
  display:none;
  box-shadow:0 0 8px rgba(0,0,0,.6);
}

#ballShadow{
  position:absolute;
  width:22px;
  height:8px;
  border-radius:50%;
  background:rgba(0,0,0,.3);
  left:50%;
  top:66%;
  transform:translateX(-50%);
  display:none;
  z-index:10;
}

/* =====================================================
   SCOREBOARD
===================================================== */

#scoreBoard{
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  width:min(95%,430px);
  padding:10px 12px;
  border-radius:15px;
  background:rgba(4,12,22,.9);
  border:1px solid rgba(255,255,255,.2);
  box-shadow:0 8px 25px rgba(0,0,0,.35);
  z-index:100;
}

.scoreTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.teamTitle{
  font-size:12px;
  font-weight:bold;
}

.scoreMain{
  font-size:28px;
  font-weight:900;
}

.scoreInfo{
  display:flex;
  justify-content:space-between;
  margin-top:3px;
  color:#d7e7f5;
  font-size:11px;
}

#commentary{
  position:absolute;
  left:50%;
  top:118px;
  transform:translateX(-50%);
  width:min(90%,400px);
  padding:8px 14px;
  text-align:center;
  border-radius:20px;
  background:rgba(0,0,0,.65);
  font-size:12px;
  z-index:90;
}

/* =====================================================
   MENU
===================================================== */

#menuBtn{
  position:absolute;
  top:14px;
  right:14px;
  width:42px;
  height:42px;
  border-radius:50%;
  background:rgba(0,0,0,.7);
  color:white;
  font-size:22px;
  z-index:110;
}

#controls{
  position:absolute;
  left:50%;
  bottom:15px;
  transform:translateX(-50%);
  width:min(96%,430px);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  z-index:100;
}

.shot{
  min-height:52px;
  border-radius:12px;
  background:rgba(4,12,22,.92);
  color:white;
  font-size:9px;
  font-weight:900;
  border:1px solid rgba(255,255,255,.18);
}

.shot:active{
  transform:scale(.94);
}

.shot.big{
  background:#e65100;
}

/* =====================================================
   CAMERA TOUCH
===================================================== */

#cameraTouch{
  position:absolute;
  left:0;
  right:0;
  top:145px;
  bottom:95px;
  z-index:5;
}

#cameraHint{
  position:absolute;
  bottom:78px;
  left:50%;
  transform:translateX(-50%);
  font-size:9px;
  color:rgba(255,255,255,.55);
  z-index:50;
}

/* =====================================================
   POPUPS
===================================================== */

.popup{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(7px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:500;
}

.popup.show{
  display:flex;
}

.popupBox{
  width:min(92%,390px);
  max-height:88vh;
  overflow:auto;
  border-radius:22px;
  padding:22px;
  background:#081522;
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.logo{
  text-align:center;
  font-size:31px;
  font-weight:1000;
  letter-spacing:2px;
}

.subtitle{
  text-align:center;
  color:#90caf9;
  margin:5px 0 18px;
  font-size:12px;
}

.menuItem{
  width:100%;
  margin-top:10px;
  padding:14px;
  border-radius:13px;
  background:#13283b;
  color:white;
  font-weight:bold;
  text-align:left;
}

.menuItem.orange{
  background:#e65100;
}

.menuItem.green{
  background:#176b35;
}

.closeBtn{
  width:100%;
  margin-top:14px;
  padding:13px;
  border-radius:13px;
  background:#263746;
  color:white;
  font-weight:bold;
}

/* =====================================================
   TEAM LIST
===================================================== */

.teamHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.teamHeader h2{
  font-size:18px;
}

.playerRow{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px;
  margin:5px 0;
  background:#102536;
  border-radius:10px;
}

.playerNo{
  width:26px;
  height:26px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#1d5d91;
  font-size:11px;
}

.playerRow strong{
  font-size:12px;
}

.playerRow small{
  display:block;
  color:#9db4c8;
  font-size:9px;
  margin-top:2px;
}

/* =====================================================
   RESULT
===================================================== */

.resultBox{
  text-align:center;
}

.finalScore{
  margin:15px 0;
  font-size:40px;
  font-weight:1000;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:360px){

  .scoreMain{
    font-size:23px;
  }

  #pitch{
    width:125px;
  }

  .player{
    transform:translate(-50%,-50%) scale(.85);
  }

  .playerName{
    font-size:8px;
  }

}

</style>
</head>

<body>

<div id="game">

  <div id="sky"></div>

  <div class="sun"></div>

  <div id="stadium">
    <div class="crowd"></div>
  </div>

  <div class="lightPole left">
    <div class="lightBox"></div>
  </div>

  <div class="lightPole right">
    <div class="lightBox"></div>
  </div>

  <div id="field">

    <div class="innerCircle"></div>

    <div id="pitch">

      <div class="crease top"></div>
      <div class="crease bottom"></div>

      <div id="wicketTop"
           class="wicket stumps">
        <span></span>
        <span></span>
        <span></span>
        <b></b>
      </div>

      <div id="wicketBottom"
           class="wicket stumps">
        <span></span>
        <span></span>
        <span></span>
        <b></b>
      </div>

    </div>

    <!-- =================================================
         FIELDERS
    ================================================== -->

    <div id="fielders"></div>

  </div>

  <!-- ===================================================
       BOWLER
  ==================================================== -->

  <div id="bowler">

    <div class="bowlerHead"></div>

    <div class="bowlerBody"></div>

    <div class="bowlerLeg1"></div>
    <div class="bowlerLeg2"></div>

  </div>

  <!-- ===================================================
       BATSMAN
  ==================================================== -->

  <div id="batsman">

    <div class="batHead"></div>

    <div class="helmet"></div>

    <div class="batBody"></div>

    <div class="batLeg left"></div>
    <div class="batLeg right"></div>

    <div id="bat"></div>

  </div>

  <div id="ball"></div>
  <div id="ballShadow"></div>

  <!-- ===================================================
       SCORE
  ==================================================== -->

  <div id="scoreBoard">

    <div class="scoreTop">

      <div class="teamTitle">
        🇮🇳 INDIA
      </div>

      <div class="scoreMain">
        <span id="runs">0</span>/<span id="wickets">0</span>
      </div>

      <div class="teamTitle">
        AUS 🇦🇺
      </div>

    </div>

    <div class="scoreInfo">

      <span>
        Over <b id="over">0.0</b>
      </span>

      <span>
        Target <b id="target">51</b>
      </span>

    </div>

  </div>

  <div id="commentary">
    🏟️ WELCOME TO CRICKET X
  </div>

  <!-- MENU -->

  <button id="menuBtn"
          onclick="openMenu()">
    ☰
  </button>

  <!-- CAMERA -->

  <div id="cameraTouch"></div>

  <div id="cameraHint">
    ↔ Drag to rotate camera
  </div>

  <!-- CONTROLS -->

  <div id="controls">

    <button class="shot"
            onclick="playShot('DEFENCE')">
      🛡️<br>DEFENCE
    </button>

    <button class="shot"
            onclick="playShot('DRIVE')">
      ➡️<br>DRIVE
    </button>

    <button class="shot big"
            onclick="playShot('POWER')">
      💥<br>POWER
    </button>

    <button class="shot"
            onclick="playShot('CUT')">
      ⚡<br>CUT
    </button>

    <button class="shot"
            onclick="playShot('LOFT')">
      🚀<br>LOFT
    </button>

  </div>

  <!-- ===================================================
       START POPUP
  ==================================================== -->

  <div class="popup show"
       id="startPopup">

    <div class="popupBox">

      <div class="logo">
        CRICKET X
      </div>

      <div class="subtitle">
        NEXT GENERATION CRICKET
      </div>

      <button class="menuItem orange"
              onclick="startMatch()">
        🏏 QUICK MATCH
      </button>

      <button class="menuItem"
              onclick="openTeams()">
        👥 PLAYING XI
      </button>

      <button class="menuItem green"
              onclick="startPractice()">
        🎯 PRACTICE
      </button>

    </div>

  </div>

  <!-- ===================================================
       MENU POPUP
  ==================================================== -->

  <div class="popup"
       id="menuPopup">

    <div class="popupBox">

      <div class="logo">
        CRICKET X
      </div>

      <div class="subtitle">
        GAME MENU
      </div>

      <button class="menuItem orange"
              onclick="restartGame()">
        🔄 RESTART MATCH
      </button>

      <button class="menuItem"
              onclick="openTeams()">
        🇮🇳 INDIA XI
      </button>

      <button class="menuItem"
              onclick="openAustralia()">
        🇦🇺 AUSTRALIA XI
      </button>

      <button class="closeBtn"
              onclick="closeMenu()">
        CLOSE
      </button>

    </div>

  </div>

  <!-- ===================================================
       INDIA TEAM POPUP
  ==================================================== -->

  <div class="popup"
       id="indiaPopup">

    <div class="popupBox">

      <div class="teamHeader">
        <h2>🇮🇳 INDIA XI</h2>
        <span>11 PLAYERS</span>
      </div>

      <div id="indiaList"></div>

      <button class="closeBtn"
              onclick="closeTeams()">
        CLOSE
      </button>

    </div>

  </div>

  <!-- ===================================================
       AUSTRALIA TEAM POPUP
  ==================================================== -->

  <div class="popup"
       id="ausPopup">

    <div class="popupBox">

      <div class="teamHeader">
        <h2>🇦🇺 AUSTRALIA XI</h2>
        <span>11 PLAYERS</span>
      </div>

      <div id="ausList"></div>

      <button class="closeBtn"
              onclick="closeAustralia()">
        CLOSE
      </button>

    </div>

  </div>

  <!-- ===================================================
       RESULT
  ==================================================== -->

  <div class="popup"
       id="resultPopup">

    <div class="popupBox resultBox">

      <div class="logo">
        MATCH OVER
      </div>

      <div class="finalScore"
           id="finalScore">
        0/0
      </div>

      <div id="resultText">
        INDIA
      </div>

      <button class="menuItem orange"
              onclick="restartGame()">
        🔄 PLAY AGAIN
      </button>

      <button class="closeBtn"
              onclick="closeResult()">
        CLOSE
      </button>

    </div>

  </div>

</div>

<script>

/* =====================================================
   TEAM DATA
===================================================== */

const indiaTeam = [

  {

  {

  },

  {

  },

  {

/* =====================================================
   BOWL BALL
===================================================== */

function bowlBall(){

  if(!matchStarted)
    return;


  if(
    !practiceMode &&
    (
      wickets >= 5 ||
      runs >= target
    )
  ){

    finishMatch();

    return;

  }


  if(ballMoving)
    return;


  ballMoving = true;


  ball.style.display =
    "block";


  ball.style.left =
    "50%";


  ball.style.top =
    "25%";


  ball.style.transform =
    "translate(-50%,-50%) scale(.65)";


  showCommentary(
    "🏃 BOWLER RUNS IN..."
  );


  let start =
    performance.now();


  const duration = 850;


  function animate(now){

    let progress =
      (now - start) /
      duration;


    if(progress > 1)
      progress = 1;


    const y =
      25 + progress * 42;


    const scale =
      .65 + progress * .8;


    ball.style.top =
      y + "%";


    ball.style.transform =
      "translate(-50%,-50%) scale(" +
      scale +
      ")";


    if(progress < 1){

      requestAnimationFrame(
        animate
      );

    }

    else{

      ballMoving = false;


      showCommentary(
        "⚡ BALL AT THE BAT!"
      );


      setTimeout(
        () => {

          if(matchStarted){

            missBall();

          }

        },
        450
      );

    }

  }


  requestAnimationFrame(
    animate
  );

}


/* =====================================================
   MISS / DOT BALL
===================================================== */

function missBall(){

  if(!matchStarted)
    return;


  balls++;


  updateOver();


  showCommentary(
    "• DOT BALL"
  );


  ball.style.display =
    "none";


  setTimeout(
    bowlBall,
    650
  );

}


/* =====================================================
   SHOT SYSTEM
===================================================== */

function playShot(type){

  if(!matchStarted)
    return;


  if(ballMoving)
    return;


  if(
    !practiceMode &&
    (
      wickets >= 5 ||
      runs >= target
    )
  ){

    finishMatch();

    return;

  }


  animateBat();


  let amount = 0;


  /* DEFENCE */

  if(type === "DEFENCE"){

    amount =
      Math.random() < .7
      ? 0
      : 1;


    showCommentary(
      amount === 0
      ? "🛡️ SOLID DEFENCE"
      : "🏃 QUICK SINGLE"
    );

  }


  /* DRIVE */

  else if(type === "DRIVE"){

    const values =
      [1,2,4];


    amount =
      values[
        Math.floor(
          Math.random() *
          values.length
        )
      ];


    showCommentary(
      "🏏 BEAUTIFUL DRIVE • " +
      amount +
      " RUN"
    );

  }


  /* POWER */

  else if(type === "POWER"){

    const chance =
      Math.random();


    if(chance < .16){

      wicket();

      return;

    }


    amount =
      chance < .48
      ? 4
      : 6;


    showCommentary(
      amount === 6
      ? "🚀 SIX! MASSIVE HIT!"
      : "💥 FOUR! CRACKING SHOT!"
    );

  }


  /* CUT */

  else if(type === "CUT"){

    const chance =
      Math.random();


    if(chance < .12){

      wicket();

      return;

    }


    amount =
      chance < .55
      ? 4
      : 2;


    showCommentary(
      "⚡ LATE CUT • " +
      amount +
      " RUN"
    );

  }


  /* LOFT */

  else if(type === "LOFT"){

    const chance =
      Math.random();


    if(chance < .20){

      wicket();

      return;

    }


    amount =
      chance < .50
      ? 6
      : 4;


    showCommentary(
      amount === 6
      ? "🔥 LOFTED SIX!"
      : "🔥 LOFTED FOUR!"
    );

  }


  scoreRuns(
    amount,
    type
  );

}


/* =====================================================
   SCORE RUNS
===================================================== */

function scoreRuns(
  amount,
  shot
){

  runs += amount;

  balls++;


  updateScore();


  ball.style.display =
    "block";


  ball.style.left =

  ball.style.top =

  const angle =

  ball.style.transform =

    "scale(1.5)";


  setTimeout(

    },
    400
  );


  if(
    !practiceMode &&
    runs >= target
  ){

    setTimeout(
      finishMatch,
      650
    );

    return;

  }


  if(
    !practiceMode &&
    wickets >= 5

    setTimeout(
      finishMatch,
      650
    );

    return;

  }


  setTimeout(
    bowlBall,
    850
  );

}

/* =====================================================
   UPDATE SCORE
===================================================== */

function updateScore(){

  runsEl.textContent =
    runs;


  wicketsEl.textContent =
    wickets;


  targetEl.textContent =
    practiceMode
    ? "—"
    : target;


  updateOver();

}


/* =====================================================
   UPDATE OVER
===================================================== */

function updateOver(){

  const completed =
    Math.floor(
      balls / 6
    );


  const current =
    balls % 6;


  overEl.textContent =
    completed +
    "." +
    current;

}


/* =====================================================
   CAMERA TOUCH
===================================================== */

let cameraStartX = null;


const cameraTouch =
  document.getElementById(
    "cameraTouch"
  );


cameraTouch.addEventListener(
  "touchstart",
  function(e){

    cameraStartX =
      e.touches[0].clientX;

  },
  {
    passive:true
  }
);


cameraTouch.addEventListener(
  "touchmove",
  function(e){

    if(cameraStartX === null)
      return;


    const currentX =
      e.touches[0].clientX;


    const diff =
      currentX -
      cameraStartX;


    cameraRotation =
      Math.max(
        -10,
        Math.min(
          10,
          diff / 20
        )
      );


    document.getElementById(
      "field"
    ).style.transform =
      "perspective(700px) " +
      "rotateX(12deg) " +
      "rotateZ(" +
      cameraRotation +
      "deg)";

  },
  {
    passive:true
  }
);


cameraTouch.addEventListener(
  "touchend",
  function(){

    cameraStartX = null;

  }
);


/* =====================================================
   FINISH MATCH
===================================================== */

function finishMatch(){

  if(!matchStarted)
    return;


  matchStarted = false;

  ballMoving = false;


  ball.style.display =
    "none";


  document
    .getElementById(
      "finalScore"
    )
    .textContent =
    runs + "/" + wickets;


  let text = "";


  if(practiceMode){

    text =
      "🎯 PRACTICE COMPLETE";

  }

  else if(runs >= target){

    text =
      "🇮🇳 INDIA WON THE MATCH!";

  }

  else{

    text =
      "🇦🇺 AUSTRALIA WON THE MATCH!";

  }


  document
    .getElementById(
      "resultText"
    )
    .textContent =
    text;


  document
    .getElementById(
      "resultPopup"
    )
    .classList.add("show");

}
