<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Battle Arena</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101820;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#78bde8;
}

/* =========================
   WORLD
========================= */

#world{
  position:absolute;
  width:6000px;
  height:6000px;
  left:50%;
  top:50%;

  background:
    repeating-linear-gradient(
      0deg,
      #557f3d 0px,
      #557f3d 100px,
      #4d7537 101px,
      #4d7537 200px
    );

  transform-origin:center center;
  transition:transform .03s linear;
}

/* =========================
   ROADS
========================= */

.road{
  position:absolute;
  background:#3c4145;
}

.roadA{
  width:6000px;
  height:180px;
  left:0;
  top:2910px;
}

.roadB{
  width:180px;
  height:6000px;
  left:2910px;
  top:0;
}

.roadC{
  width:4000px;
  height:140px;
  left:600px;
  top:1500px;
  transform:rotate(30deg);
}

.roadD{
  width:3800px;
  height:130px;
  left:800px;
  top:4400px;
  transform:rotate(-28deg);
}

.roadLine{
  position:absolute;
  background:#e5d76d;
}

.r1{
  width:6000px;
  height:5px;
  top:2997px;
}

.r2{
  width:5px;
  height:6000px;
  left:2997px;
}

/* =========================
   WATER
========================= */

.water{
  position:absolute;
  width:1250px;
  height:850px;
  left:2350px;
  top:350px;
  border-radius:50%;

  background:
    repeating-linear-gradient(
      15deg,
      #248db7 0px,
      #248db7 18px,
      #45aecd 19px,
      #45aecd 35px
    );

  box-shadow:
    inset 0 0 80px rgba(0,0,0,.25);
}

/* =========================
   BUILDINGS
========================= */

.building{
  position:absolute;
  width:260px;
  height:190px;

  background:
    linear-gradient(
      135deg,
      #d3d7db,
      #777e85
    );

  border:8px solid #50565b;

  box-shadow:
    25px 25px 0 #30363a,
    0 20px 35px rgba(0,0,0,.35);
}

.building:after{
  content:"";
  position:absolute;
  inset:20px;

  background:
    repeating-linear-gradient(
      90deg,
      #244052 0px,
      #244052 35px,
      #9fc9d9 36px,
      #9fc9d9 58px
    );

  border:5px solid #41474b;
}

.b1{left:600px;top:650px}
.b2{left:1000px;top:760px}
.b3{left:1450px;top:600px}

.b4{left:3850px;top:700px}
.b5{left:4250px;top:850px}
.b6{left:4550px;top:620px}

.b7{
  left:600px;
  top:3500px;
  width:350px;
  height:230px;
}

.b8{
  left:3900px;
  top:3600px;
  width:380px;
  height:250px;
}

.b9{
  left:1850px;
  top:4400px;
}

.b10{
  left:4500px;
  top:4550px;
}

/* =========================
   TREES
========================= */

.tree{
  position:absolute;
  width:80px;
  height:140px;
}

.tree:before{
  content:"";
  position:absolute;
  width:25px;
  height:70px;
  left:28px;
  bottom:0;
  background:#5a3d27;
}

.tree:after{
  content:"";
  position:absolute;
  width:90px;
  height:90px;
  left:-5px;
  top:0;
  border-radius:50%;

  background:
    radial-gradient(
      circle at 30% 25%,
      #79a951,
      #315b30 70%
    );

  box-shadow:
    0 18px 0 #244824;
}

.t1{left:300px;top:400px}
.t2{left:480px;top:1250px}
.t3{left:1550px;top:1100px}
.t4{left:1950px;top:500px}
.t5{left:3200px;top:500px}
.t6{left:4800px;top:400px}
.t7{left:5000px;top:1500px}
.t8{left:4300px;top:2200px}
.t9{left:350px;top:4000px}
.t10{left:1250px;top:4500px}
.t11{left:3000px;top:4700px}
.t12{left:5100px;top:4100px}
.t13{left:3500px;top:3000px}
.t14{left:800px;top:2700px}
.t15{left:1700px;top:3400px}
.t16{left:4700px;top:3000px}
.t17{left:2500px;top:5200px}
.t18{left:900px;top:5200px}

/* =========================
   HILLS
========================= */

.hill{
  position:absolute;
  width:700px;
  height:350px;
  border-radius:50%;

  background:
    linear-gradient(
      #5c8547,
      #304d2c
    );

  box-shadow:
    0 30px 50px rgba(0,0,0,.3);
}

.h1{
  left:50px;
  top:1700px;
}

.h2{
  left:4200px;
  top:1700px;
}

.h3{
  left:2200px;
  top:5000px;
}

/* =========================
   PLAYER
========================= */

#player{
  position:fixed;
  width:70px;
  height:110px;

  left:50%;
  top:54%;

  transform:
    translate(-50%,-50%);

  z-index:100;
  pointer-events:none;
}

.head{
  position:absolute;
  width:34px;
  height:34px;

  left:18px;
  top:0;

  border-radius:50%;
  background:#d79a70;
  border:3px solid #333;
}

.body{
  position:absolute;
  width:52px;
  height:58px;

  left:9px;
  top:31px;

  border-radius:13px;

  background:
    linear-gradient(
      #1976d2,
      #0b438c
    );
}

.leg{
  position:absolute;
  width:16px;
  height:35px;

  top:78px;
  background:#20252a;
}

.leg1{
  left:14px;
}

.leg2{
  right:14px;
}

.gun{
  position:absolute;
  width:65px;
  height:9px;

  right:-48px;
  top:47px;

  background:#171717;
  border-radius:8px;

  transform:rotate(-10deg);
}

/* =========================
   HUD
========================= */

#hud{
  position:fixed;
  top:12px;
  left:10px;
  right:10px;

  display:flex;
  justify-content:space-between;

  z-index:300;
}

.hudBox{
  padding:9px 12px;

  background:rgba(0,0,0,.58);
  color:white;

  border-radius:12px;
  font-size:13px;

  border:1px solid rgba(255,255,255,.2);
}

.hp{
  color:#68ff7c;
}

.ammo{
  color:#ffe05a;
}

/* =========================
   MAP INFO
========================= */

#mapName{
  position:fixed;
  left:50%;
  top:70px;

  transform:translateX(-50%);

  padding:7px 15px;

  color:white;
  background:rgba(0,0,0,.4);

  border-radius:20px;
  font-size:12px;

  z-index:300;
}

/* =========================
   LEFT JOYSTICK
========================= */

#joystick{
  position:fixed;

  width:145px;
  height:145px;

  left:25px;
  bottom:28px;

  border-radius:50%;

  background:rgba(255,255,255,.12);

  border:
    2px solid
    rgba(255,255,255,.35);

  z-index:400;
}

#stick{
  position:absolute;

  width:62px;
  height:62px;

  left:39px;
  top:39px;

  border-radius:50%;

  background:
    rgba(255,255,255,.45);

  box-shadow:
    0 0 20px rgba(255,255,255,.15);
}

/* =========================
   RIGHT CAMERA AREA
========================= */

#cameraArea{
  position:fixed;

  right:0;
  top:100px;

  width:55%;
  height:calc(100% - 220px);

  z-index:350;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.015)
    );
}

/* =========================
   ACTION BUTTONS
========================= */

.actions{
  position:fixed;

  right:20px;
  bottom:28px;

  display:flex;
  gap:12px;

  z-index:450;
}

.action{
  width:65px;
  height:65px;

  border-radius:50%;

  border:
    2px solid
    rgba(255,255,255,.35);

  background:
    rgba(0,0,0,.55);

  color:white;

  font-size:11px;
  font-weight:bold;
}

.fire{
  width:82px;
  height:82px;

  background:
    rgba(215,45,45,.7);

  font-size:13px;
}

/* =========================
   CROSSHAIR
========================= */

#crosshair{
  position:fixed;

  left:50%;
  top:50%;

  width:28px;
  height:28px;

  transform:translate(-50%,-50%);

  z-index:250;

  pointer-events:none;
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;

  background:white;
  opacity:.85;
}

#crosshair:before{
  width:28px;
  height:2px;
  top:13px;
}

#crosshair:after{
  width:2px;
  height:28px;
  left:13px;
}

/* =========================
   START POPUP
========================= */

#popup{
  position:fixed;
  inset:0;

  background:
    rgba(0,0,0,.75);

  backdrop-filter:blur(9px);

  z-index:1000;

  display:flex;
  align-items:center;
  justify-content:center;
}

.menu{
  width:min(390px,90%);

  padding:25px;

  border-radius:24px;

  background:
    linear-gradient(
      145deg,
      #10263d,
      #07131f
    );

  border:
    1px solid
    #4da6ff;

  box-shadow:
    0 0 60px
    rgba(40,150,255,.3);

  color:white;
  text-align:center;

  animation:popup .4s ease;
}

@keyframes popup{

  from{
    opacity:0;
    transform:
      scale(.75)
      rotateX(25deg);
  }

  to{
    opacity:1;
    transform:
      scale(1)
      rotateX(0);
  }
}

.menu h1{
  font-size:28px;
  margin-bottom:8px;
}

.menu p{
  color:#a9c4dc;
  margin-bottom:20px;
}

.mode{
  width:100%;

  padding:15px;

  margin:7px 0;

  border:0;
  border-radius:14px;

  color:white;

  font-size:16px;
  font-weight:bold;

  background:
    linear-gradient(
      90deg,
      #1769e0,
      #36a3ff
    );
}

.custom{
  background:
    linear-gradient(
      90deg,
      #7040d9,
      #a85cff
    );
}

.practice{
  background:
    linear-gradient(
      90deg,
      #268b57,
      #42c779
    );
}

#message{
  margin-top:13px;

  color:#8eacc4;

  font-size:12px;
}

/* =========================
   CAMERA ROTATION INDICATOR
========================= */

#cameraText{
  position:fixed;

  right:15px;
  top:105px;

  color:rgba(255,255,255,.55);

  font-size:11px;

  z-index:400;
}
</style>
</head>

<body>

<div id="game">

  <div id="world">

    <div class="water"></div>

    <div class="road roadA"></div>
    <div class="road roadB"></div>
    <div class="road roadC"></div>
    <div class="road roadD"></div>

    <div class="roadLine r1"></div>
    <div class="roadLine r2"></div>

    <div class="hill h1"></div>
    <div class="hill h2"></div>
    <div class="hill h3"></div>

    <div class="building b1"></div>
    <div class="building b2"></div>
    <div class="building b3"></div>
    <div class="building b4"></div>
    <div class="building b5"></div>
    <div class="building b6"></div>
    <div class="building b7"></div>
    <div class="building b8"></div>
    <div class="building b9"></div>
    <div class="building b10"></div>

    <div class="tree t1"></div>
    <div class="tree t2"></div>
    <div class="tree t3"></div>
    <div class="tree t4"></div>
    <div class="tree t5"></div>
    <div class="tree t6"></div>
    <div class="tree t7"></div>
    <div class="tree t8"></div>
    <div class="tree t9"></div>
    <div class="tree t10"></div>
    <div class="tree t11"></div>
    <div class="tree t12"></div>
    <div class="tree t13"></div>
    <div class="tree t14"></div>
    <div class="tree t15"></div>
    <div class="tree t16"></div>
    <div class="tree t17"></div>
    <div class="tree t18"></div>

  </div>

  <div id="player">

    <div class="head"></div>
    <div class="body"></div>

    <div class="leg leg1"></div>
    <div class="leg leg2"></div>

    <div class="gun"></div>

  </div>

</div>


<!-- HUD -->

<div id="hud">

  <div class="hudBox">
    ❤️ <span class="hp">100</span>
    &nbsp; 🛡️ 50
  </div>

  <div class="hudBox">
    👥 <span id="players">50</span>
  </div>

  <div class="hudBox">
    🔫 <span class="ammo">30/120</span>
  </div>

</div>


<div id="mapName">
  BATTLE ISLAND
</div>


<div id="crosshair"></div>


<div id="cameraText">
  DRAG TO ROTATE CAMERA
</div>


<!-- JOYSTICK -->

<div id="joystick">
  <div id="stick"></div>
</div>


<!-- CAMERA TOUCH AREA -->

<div id="cameraArea"></div>


<!-- ACTIONS -->

<div class="actions">

  <button class="action"
          onclick="jump()">
    JUMP
  </button>

  <button class="action"
          onclick="reload()">
    RELOAD
  </button>

  <button class="action fire"
          onclick="fire()">
    FIRE
  </button>

</div>


<!-- POPUP -->

<div id="popup">

  <div class="menu">

    <h1>⚡ BATTLE ARENA</h1>

    <p>Select Battle Mode</p>

    <button class="mode"
            onclick="startMode('MULTIPLAYER')">
      👥 MULTIPLAYER
    </button>

    <button class="mode custom"
            onclick="startMode('CUSTOM MATCH')">
      🏠 CUSTOM MATCH
    </button>

    <button class="mode practice"
            onclick="startMode('SOLO / PRACTICE')">
      🎯 SOLO / PRACTICE
    </button>

    <div id="message">
      Large Battle Island
    </div>

  </div>

</div>


<script>

/* =========================
   WORLD CAMERA
========================= */

const world =
  document.getElementById("world");

let cameraX = 0;
let cameraY = 0;

let cameraAngle = 0;

function updateCamera(){

  world.style.transform =
    "translate("+
    cameraX+
    "px,"+
    cameraY+
    "px) rotate("+
    cameraAngle+
    "deg)";

}


/* =========================
   RIGHT SIDE CAMERA DRAG
========================= */

const cameraArea =
  document.getElementById("cameraArea");

let cameraDragging = false;

let lastCameraX = 0;

cameraArea.addEventListener(
  "pointerdown",
  function(e){

    cameraDragging = true;

    lastCameraX = e.clientX;

    cameraArea.setPointerCapture(
      e.pointerId
    );

  }
);


cameraArea.addEventListener(
  "pointermove",
  function(e){

    if(!cameraDragging) return;

    let dx =
      e.clientX-lastCameraX;

    lastCameraX =
      e.clientX;

    cameraAngle += dx * 0.35;

    updateCamera();

  }
);


cameraArea.addEventListener(
  "pointerup",
  function(){

    cameraDragging=false;

  }
);


cameraArea.addEventListener(
  "pointercancel",
  function(){

    cameraDragging=false;

  }
);


/* =========================
   JOYSTICK
========================= */

const joystick =
  document.getElementById("joystick");

const stick =
  document.getElementById("stick");

let joystickActive=false;

let joystickStartX=0;
let joystickStartY=0;

joystick.addEventListener(
  "pointerdown",
  function(e){

    joystickActive=true;

    joystickStartX=e.clientX;
    joystickStartY=e.clientY;

    joystick.setPointerCapture(
      e.pointerId
    );

  }
);


joystick.addEventListener(
  "pointermove",
  function(e){

    if(!joystickActive) return;

    let dx =
      e.clientX-joystickStartX;

    let dy =
      e.clientY-joystickStartY;

    let max=40;

    let distance =
      Math.sqrt(
        dx*dx+
        dy*dy
      );

    if(distance>max){

      dx =
        dx/distance*max;

      dy =
        dy/distance*max;

    }

    stick.style.transform =
      "translate("+
      dx+
      "px,"+
      dy+
      "px)";

    /* Movement */

    cameraX -= dx*0.25;
    cameraY -= dy*0.25;

    updateCamera();

  }
);


joystick.addEventListener(
  "pointerup",
  function(){

    joystickActive=false;

    stick.style.transform=
      "translate(0,0)";

  }
);


/* =========================
   GAME MODE
========================= */

function startMode(mode){

  const message =
    document.getElementById("message");

  message.innerText =
    mode+" loading...";

  setTimeout(function(){

    document.getElementById(
      "popup"
    ).style.display="none";

  },700);

}


/* =========================
   FIRE
========================= */

function fire(){

  const ammo =
    document.querySelector(".ammo");

  let parts =
    ammo.innerText.split("/");

  let current =
    parseInt(parts[0]);

  if(current>0){

    current--;

    ammo.innerText =
      current+"/"+parts[1];

  }

}


/* =========================
   RELOAD
========================= */

function reload(){

  document.querySelector(
    ".ammo"
  ).innerText="30/120";

}


/* =========================
   JUMP
========================= */

function jump(){

  const player =
    document.getElementById("player");

  player.animate(
    [
      {
        transform:
        "translate(-50%,-50%)"
      },

      {
        transform:
        "translate(-50%,-80%)"
      },

      {
        transform:
        "translate(-50%,-50%)"
      }
    ],
    {
      duration:500,
      easing:"ease-out"
    }
  );

}


/* =========================
   PLAYER COUNT
========================= */

setInterval(function(){

  const p =
    document.getElementById("players");

  let n =
    parseInt(p.innerText);

  if(n>1){

    p.innerText=n-1;

  }

},5000);


/* =========================
   INITIAL CAMERA
========================= */

updateCamera();

</script>

</body>
</html>
