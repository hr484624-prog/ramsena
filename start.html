<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Battle Arena - Start</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  touch-action:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#07101c;
  font-family:Arial,sans-serif;
}

/* =========================
   GAME
========================= */

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    linear-gradient(#72b9ed 0%,#b9e4ff 48%,#638c48 49%,#304d28 100%);
}

/* =========================
   HUGE MAP
========================= */

#map{
  position:absolute;
  width:5000px;
  height:5000px;
  left:50%;
  top:50%;
  transform:
    translate(-50%,-50%)
    rotateX(52deg)
    rotateZ(0deg);

  transform-style:preserve-3d;

  background:
    repeating-linear-gradient(
      0deg,
      #527d3b 0px,
      #527d3b 95px,
      #4b7336 96px,
      #4b7336 190px
    );

  transition:transform .08s linear;
}

/* =========================
   ROADS
========================= */

.road{
  position:absolute;
  background:#383d3e;
  box-shadow:
    inset 0 0 0 5px #292d2e,
    0 0 20px #263526;
}

.road1{
  width:5000px;
  height:150px;
  left:0;
  top:2400px;
}

.road2{
  width:150px;
  height:5000px;
  left:2450px;
  top:0;
}

.road3{
  width:3000px;
  height:110px;
  left:1000px;
  top:1200px;
  transform:rotate(32deg);
}

.road4{
  width:2800px;
  height:100px;
  left:100px;
  top:3400px;
  transform:rotate(-25deg);
}

/* road lines */

.line{
  position:absolute;
  background:#e9d76c;
}

.line1{
  width:5000px;
  height:5px;
  top:2473px;
  left:0;
}

.line2{
  width:5px;
  height:5000px;
  left:2523px;
  top:0;
}

/* =========================
   BUILDINGS
========================= */

.building{
  position:absolute;
  width:230px;
  height:170px;
  background:
    linear-gradient(135deg,#c7cbd0,#777d84);
  border:8px solid #555b61;
  box-shadow:
    20px 25px 0 #30363a,
    0 20px 35px #172515;
  transform:translateZ(80px);
}

.building:before{
  content:"";
  position:absolute;
  inset:18px;
  background:
    repeating-linear-gradient(
      90deg,
      #273f51 0 35px,
      #93c4db 36px 55px
    );
  border:5px solid #41484d;
}

.b1{left:600px;top:650px}
.b2{left:950px;top:720px}
.b3{left:1350px;top:550px}
.b4{left:3250px;top:700px}
.b5{left:3650px;top:850px}
.b6{left:3950px;top:620px}

.b7{
  left:700px;
  top:3000px;
  width:300px;
  height:210px;
}

.b8{
  left:3300px;
  top:3200px;
  width:320px;
  height:220px;
}

/* =========================
   TREES
========================= */

.tree{
  position:absolute;
  width:70px;
  height:130px;
  transform:translateZ(70px);
}

.tree:before{
  content:"";
  position:absolute;
  width:22px;
  height:70px;
  left:25px;
  bottom:0;
  background:#59402c;
}

.tree:after{
  content:"";
  position:absolute;
  width:75px;
  height:75px;
  left:-3px;
  top:5px;
  border-radius:50%;
  background:
    radial-gradient(circle at 30% 30%,#74a94e,#28552c 70%);
  box-shadow:
    0 15px 0 #234824,
    0 0 20px #1d361d;
}

.t1{left:350px;top:500px}
.t2{left:450px;top:1100px}
.t3{left:1500px;top:1000px}
.t4{left:1900px;top:450px}
.t5{left:3000px;top:500px}
.t6{left:4400px;top:500px}
.t7{left:4300px;top:1500px}
.t8{left:3800px;top:2000px}
.t9{left:500px;top:3900px}
.t10{left:1400px;top:4200px}
.t11{left:2900px;top:4100px}
.t12{left:4200px;top:3900px}
.t13{left:3600px;top:2700px}
.t14{left:900px;top:2500px}
.t15{left:1750px;top:3200px}

/* =========================
   HILLS
========================= */

.hill{
  position:absolute;
  width:600px;
  height:300px;
  border-radius:50%;
  background:
    linear-gradient(#557d42,#304e2b);
  transform:translateZ(20px);
  box-shadow:0 30px 50px #20371c;
}

.h1{
  left:100px;
  top:1500px;
}

.h2{
  left:3600px;
  top:1200px;
}

.h3{
  left:2200px;
  top:3900px;
}

/* =========================
   WATER
========================= */

.water{
  position:absolute;
  width:1000px;
  height:650px;
  left:1900px;
  top:100px;
  border-radius:50%;
  background:
    repeating-linear-gradient(
      20deg,
      #2f9bc2 0 15px,
      #55bddb 16px 30px
    );
  box-shadow:inset 0 0 50px #12607c;
}

/* =========================
   PLAYER
========================= */

#player{
  position:absolute;
  left:50%;
  top:50%;
  width:55px;
  height:95px;
  transform:
    translate(-50%,-50%)
    translateZ(170px);
  z-index:50;
}

.head{
  position:absolute;
  width:30px;
  height:30px;
  border-radius:50%;
  background:#d99b70;
  left:12px;
  top:0;
  border:3px solid #333;
}

.body{
  position:absolute;
  width:45px;
  height:50px;
  left:5px;
  top:28px;
  border-radius:12px 12px 8px 8px;
  background:linear-gradient(#1976d2,#0c3c83);
}

.leg{
  position:absolute;
  width:14px;
  height:35px;
  background:#222;
  top:70px;
}

.l1{left:9px}
.l2{right:9px}

.gun{
  position:absolute;
  width:55px;
  height:8px;
  background:#191919;
  right:-40px;
  top:42px;
  transform:rotate(-12deg);
  border-radius:5px;
}

/* =========================
   SAFE ZONE
========================= */

#zone{
  position:absolute;
  width:2600px;
  height:2600px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border:8px solid rgba(75,180,255,.55);
  border-radius:50%;
  box-shadow:
    0 0 60px rgba(50,170,255,.25),
    inset 0 0 60px rgba(50,170,255,.12);
  pointer-events:none;
  z-index:10;
}

/* =========================
   TOP HUD
========================= */

#hud{
  position:fixed;
  left:12px;
  right:12px;
  top:12px;
  display:flex;
  justify-content:space-between;
  z-index:100;
}

.box{
  padding:9px 14px;
  border-radius:12px;
  background:rgba(0,0,0,.58);
  color:white;
  border:1px solid rgba(255,255,255,.2);
  font-size:13px;
}

.hp{
  color:#70ff83;
}

.ammo{
  color:#ffd95a;
}

/* =========================
   JOYSTICK
========================= */

#joystick{
  position:fixed;
  width:135px;
  height:135px;
  left:25px;
  bottom:30px;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  border:2px solid rgba(255,255,255,.35);
  z-index:200;
}

#stick{
  position:absolute;
  width:58px;
  height:58px;
  border-radius:50%;
  left:38px;
  top:38px;
  background:rgba(255,255,255,.45);
}

/* =========================
   ACTION BUTTONS
========================= */

.actions{
  position:fixed;
  right:25px;
  bottom:30px;
  z-index:200;
  display:flex;
  gap:14px;
  align-items:flex-end;
}

.action{
  width:65px;
  height:65px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.45);
  background:rgba(0,0,0,.55);
  color:white;
  font-size:12px;
  font-weight:bold;
}

.fire{
  width:82px;
  height:82px;
  background:rgba(220,45,45,.65);
}

/* =========================
   CAMERA
========================= */

.cameraButtons{
  position:fixed;
  right:20px;
  top:90px;
  z-index:200;
}

.cameraButtons button{
  padding:10px;
  margin:4px;
  border:0;
  border-radius:10px;
  background:rgba(0,0,0,.55);
  color:white;
}

/* =========================
   START POPUP
========================= */

#popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(8px);
  z-index:500;
  display:flex;
  align-items:center;
  justify-content:center;
}

.menu{
  width:min(390px,90%);
  padding:25px;
  border-radius:24px;
  background:
    linear-gradient(145deg,#10263d,#07121f);
  border:1px solid #4da6ff;
  box-shadow:0 0 50px rgba(30,140,255,.35);
  color:white;
  text-align:center;
  animation:popup .4s ease;
}

@keyframes popup{
  from{
    opacity:0;
    transform:scale(.7) rotateX(30deg);
  }
  to{
    opacity:1;
    transform:scale(1) rotateX(0);
  }
}

.menu h1{
  font-size:29px;
  margin-bottom:7px;
}

.menu p{
  color:#a9c4dc;
  margin-bottom:22px;
}

.mode{
  width:100%;
  padding:15px;
  margin:8px 0;
  border:0;
  border-radius:14px;
  color:white;
  font-size:16px;
  font-weight:bold;
  background:linear-gradient(90deg,#1769e0,#36a3ff);
}

.mode.custom{
  background:linear-gradient(90deg,#7040d9,#a85cff);
}

.mode.practice{
  background:linear-gradient(90deg,#268b57,#42c779);
}

#message{
  margin-top:15px;
  font-size:12px;
  color:#91b7d5;
}

/* =========================
   ROTATING SKY
========================= */

.skyLight{
  position:fixed;
  width:700px;
  height:700px;
  border-radius:50%;
  background:radial-gradient(
    circle,
    rgba(255,255,255,.45),
    transparent 65%
  );
  left:-250px;
  top:-250px;
  animation:skyMove 10s linear infinite;
  pointer-events:none;
}

@keyframes skyMove{
  0%{transform:rotate(0deg) translateX(300px)}
  100%{transform:rotate(360deg) translateX(300px)}
}
</style>
</head>

<body>

<div id="game">

  <div class="skyLight"></div>

  <div id="zone"></div>

  <div id="map">

    <div class="water"></div>

    <div class="road road1"></div>
    <div class="road road2"></div>
    <div class="road road3"></div>
    <div class="road road4"></div>

    <div class="line line1"></div>
    <div class="line line2"></div>

    <div class="hill h1"></div>
    <div class="hill h2"></div>
    <div class="hill h3"></div>

    <div class="building b1"></div>
    <div class="building b2"></div>
    <div class="building b3"></div>
    <div class="building b4"></div>
    <div class="building b5"></div>
    <div class="building b6"></div>
    <div class="building b7"></div>
    <div class="building b8"></div>

    <div class="tree t1"></div>
    <div class="tree t2"></div>
    <div class="tree t3"></div>
    <div class="tree t4"></div>
    <div class="tree t5"></div>
    <div class="tree t6"></div>
    <div class="tree t7"></div>
    <div class="tree t8"></div>
    <div class="tree t9"></div>
    <div class="tree t10"></div>
    <div class="tree t11"></div>
    <div class="tree t12"></div>
    <div class="tree t13"></div>
    <div class="tree t14"></div>
    <div class="tree t15"></div>

  </div>

  <!-- PLAYER -->

  <div id="player">
    <div class="head"></div>
    <div class="body"></div>
    <div class="leg l1"></div>
    <div class="leg l2"></div>
    <div class="gun"></div>
  </div>

</div>


<!-- HUD -->

<div id="hud">

  <div class="box">
    ❤️ <span class="hp">100</span>
    &nbsp; 🛡️ 50
  </div>

  <div class="box">
    👥 Players: <span id="players">50</span>
  </div>

  <div class="box">
    🔫 <span class="ammo">30/120</span>
  </div>

</div>


<!-- CAMERA BUTTONS -->

<div class="cameraButtons">
  <button onclick="rotateCamera(-1)">⟲</button>
  <button onclick="rotateCamera(1)">⟳</button>
</div>


<!-- JOYSTICK -->

<div id="joystick">
  <div id="stick"></div>
</div>


<!-- ACTIONS -->

<div class="actions">

  <button class="action"
          onclick="jump()">
    JUMP
  </button>

  <button class="action"
          onclick="reload()">
    RELOAD
  </button>

  <button class="action fire"
          onclick="fire()">
    FIRE
  </button>

</div>


<!-- FIRST POPUP -->

<div id="popup">

  <div class="menu">

    <h1>⚡ BATTLE ARENA</h1>

    <p>Choose your battle mode</p>

    <button class="mode"
            onclick="multiplayer()">
      👥 MULTIPLAYER
    </button>

    <button class="mode custom"
            onclick="customMatch()">
      🏠 CUSTOM MATCH
    </button>

    <button class="mode practice"
            onclick="practice()">
      🎯 SOLO / PRACTICE
    </button>

    <div id="message">
      Large open-world map • 3D-style battle arena
    </div>

  </div>

</div>


<script>

/* =========================
   MAP CAMERA
========================= */

let mapX = 0;
let mapY = 0;
let cameraRotation = 0;

const map =
  document.getElementById("map");

function updateMap(){

  map.style.transform =
    "translate(calc(-50% + "+mapX+"px),calc(-50% + "+mapY+"px)) " +
    "rotateX(52deg) rotateZ("+cameraRotation+"deg)";
}


/* =========================
   CAMERA ROTATE
========================= */

function rotateCamera(direction){

  cameraRotation += direction * 8;

  updateMap();

}


/* =========================
   JOYSTICK
========================= */

const joystick =
  document.getElementById("joystick");

const stick =
  document.getElementById("stick");

let active=false;
let startX=0;
let startY=0;

joystick.addEventListener(
  "pointerdown",
  function(e){

    active=true;

    startX=e.clientX;
    startY=e.clientY;

    joystick.setPointerCapture(e.pointerId);

  }
);

joystick.addEventListener(
  "pointermove",
  function(e){

    if(!active) return;

    let dx=e.clientX-startX;
    let dy=e.clientY-startY;

    let max=38;

    let distance=
      Math.sqrt(dx*dx+dy*dy);

    if(distance>max){

      dx=dx/distance*max;
      dy=dy/distance*max;

    }

    stick.style.transform=
      "translate("+dx+"px,"+dy+"px)";

    mapX -= dx*.35;
    mapY -= dy*.35;

    updateMap();

  }
);

joystick.addEventListener(
  "pointerup",
  function(){

    active=false;

    stick.style.transform=
      "translate(0,0)";

  }
);


/* =========================
   MODES
========================= */

function multiplayer(){

  document.getElementById("message").innerText =
    "Searching for players...";

  setTimeout(function(){

    document.getElementById("popup").style.display=
      "none";

  },800);

}


function customMatch(){

  document.getElementById("message").innerHTML =
    "🏠 Custom Match selected<br><br>" +
    "Private room / friends mode ready.";

  setTimeout(function(){

    document.getElementById("popup").style.display=
      "none";

  },1200);

}


function practice(){

  document.getElementById("message").innerText =
    "🎯 Practice Arena loading...";

  setTimeout(function(){

    document.getElementById("popup").style.display=
      "none";

  },700);

}


/* =========================
   FIRE
========================= */

function fire(){

  const ammo =
    document.querySelector(".ammo");

  let text=ammo.innerText.split("/");

  let current=parseInt(text[0]);

  if(current>0){

    current--;

    ammo.innerText=
      current+"/"+text[1];

  }

}


/* =========================
   RELOAD
========================= */

function reload(){

  const ammo =
    document.querySelector(".ammo");

  ammo.innerText="30/120";

}


/* =========================
   JUMP
========================= */

function jump(){

  const player=
    document.getElementById("player");

  player.animate(
    [
      {
        transform:
        "translate(-50%,-50%) translateZ(170px)"
      },
      {
        transform:
        "translate(-50%,-80%) translateZ(270px)"
      },
      {
        transform:
        "translate(-50%,-50%) translateZ(170px)"
      }
    ],
    {
      duration:500,
      easing:"ease-out"
    }
  );

}


/* =========================
   PLAYER COUNT
========================= */

setInterval(function(){

  const el=
    document.getElementById("players");

  let n=parseInt(el.innerText);

  if(n>1){

    n--;

    el.innerText=n;

  }

},5000);


/* =========================
   AUTO CAMERA MOTION
========================= */

let autoRotation=0;

setInterval(function(){

  autoRotation += .08;

  map.style.transform =
    "translate(calc(-50% + "+mapX+"px),calc(-50% + "+mapY+"px)) " +
    "rotateX(52deg) rotateZ("+
    (cameraRotation+Math.sin(autoRotation)*1.5)+
    "deg)";

},30);

</script>

</body>
</html>
