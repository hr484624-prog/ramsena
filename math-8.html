<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GyanSetu AI Study</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#172033;
}

.header{
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
    padding:18px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:25px;
}

.header p{
    margin:6px 0 0;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.section-title{
    margin-top:10px;
}

.topics{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.topic{
    background:white;
    padding:18px;
    border-radius:15px;
    box-shadow:0 5px 18px rgba(0,0,0,.08);
    cursor:pointer;
    transition:.2s;
}

.topic:hover{
    transform:translateY(-3px);
}

.topic h3{
    margin:0 0 8px;
}

.topic p{
    margin:0;
    color:#64748b;
}

/* AI TEACHER */

.teacher-box{
    display:none;
    margin-top:25px;
    background:#111827;
    border-radius:20px;
    overflow:hidden;
    color:white;
}

.teacher-screen{
    min-height:420px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    background:
      radial-gradient(circle at center,#334155,#0f172a);
}

/* AI SIR */

.teacher{
    text-align:center;
}

.head{
    width:170px;
    height:170px;
    background:#f5c9a5;
    border-radius:50%;
    margin:auto;
    position:relative;
    border:5px solid #fff;
}

.hair{
    position:absolute;
    width:125px;
    height:65px;
    background:#1e293b;
    border-radius:70px 70px 20px 20px;
    top:-15px;
    left:18px;
}

.eye{
    width:14px;
    height:14px;
    background:#111;
    border-radius:50%;
    position:absolute;
    top:70px;
}

.eye.left{
    left:45px;
}

.eye.right{
    right:45px;
}

.mouth{
    width:55px;
    height:12px;
    background:#8b3a3a;
    border-radius:20px;
    position:absolute;
    left:53px;
    top:115px;
    transition:.08s;
}

.body{
    width:210px;
    height:170px;
    background:#2563eb;
    border-radius:80px 80px 20px 20px;
    margin:-5px auto 0;
}

.name{
    margin-top:10px;
    font-size:20px;
    font-weight:bold;
}

.speaking .mouth{
    height:28px;
    animation:talk .18s infinite alternate;
}

@keyframes talk{
    from{
        height:8px;
    }
    to{
        height:30px;
    }
}

.status{
    position:absolute;
    bottom:15px;
    left:15px;
    right:15px;
    background:rgba(0,0,0,.5);
    padding:10px;
    border-radius:10px;
    text-align:center;
}

.controls{
    padding:15px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

button{
    border:0;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.start{
    background:#22c55e;
    color:white;
}

.stop{
    background:#ef4444;
    color:white;
}

.lesson{
    background:white;
    color:#172033;
    padding:20px;
    line-height:1.7;
    border-radius:15px;
    margin-top:15px;
}

.ask{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.ask input{
    flex:1;
    padding:13px;
    border:1px solid #cbd5e1;
    border-radius:10px;
}

.ask button{
    background:#7c3aed;
    color:white;
}

.loading{
    text-align:center;
    padding:20px;
    color:#64748b;
}

@media(max-width:600px){

    .teacher-screen{
        min-height:350px;
    }

    .head{
        width:135px;
        height:135px;
    }

    .hair{
        width:100px;
        height:50px;
        left:13px;
    }

    .eye{
        top:58px;
    }

    .eye.left{
        left:35px;
    }

    .eye.right{
        right:35px;
    }

    .mouth{
        left:40px;
        top:95px;
    }

    .body{
        width:170px;
        height:130px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>🤖 GyanSetu AI Study</h1>
    <p>Class 10 Mathematics — AI Sir</p>
</div>

<div class="container">

    <h2 class="section-title">📚 Select Topic</h2>

    <div id="topics" class="topics">
        <div class="loading">Loading topics...</div>
    </div>

    <div id="teacherBox" class="teacher-box">

        <div class="teacher-screen">

            <div id="teacher" class="teacher">

                <div class="head">

                    <div class="hair"></div>

                    <div class="eye left"></div>
                    <div class="eye right"></div>

                    <div id="mouth" class="mouth"></div>

                </div>

                <div class="body"></div>

                <div class="name">
                    👨‍🏫 GyanSetu AI Sir
                </div>

            </div>

            <div id="status" class="status">
                Ready to teach
            </div>

        </div>

        <div class="controls">

            <button class="start" onclick="startLesson()">
                ▶️ Start AI Sir
            </button>

            <button class="stop" onclick="stopLesson()">
                ⏹ Stop
            </button>

        </div>

        <div id="lesson" class="lesson">
            Topic select करा.
        </div>

        <div class="ask">

            <input
                id="question"
                placeholder="AI Sir ला प्रश्न विचारा..."
            >

            <button onclick="askAI()">
                Ask
            </button>

        </div>

    </div>

</div>

<script>

const API =
"https://gyan-setu-ai-study-backend.vercel.app";

let selectedTopic = null;
let currentText = "";
let speech = null;


/* LOAD TOPICS */

async function loadTopics(){

    const box = document.getElementById("topics");

    try{

        const response =
            await fetch(API + "/api/maths/topics");

        const data =
            await response.json();

        box.innerHTML = "";

        data.topics.forEach(topic => {

            const div =
                document.createElement("div");

            div.className = "topic";

            div.innerHTML = `
                <h3>${topic.id}. ${topic.title}</h3>
                <p>${topic.description}</p>
            `;

            div.onclick = () => selectTopic(topic);

            box.appendChild(div);

        });

    }catch(error){

        box.innerHTML =
            "<p>Topics load झाले नाहीत.</p>";

        console.error(error);

    }

}


/* SELECT TOPIC */

function selectTopic(topic){

    selectedTopic = topic;

    document.getElementById("teacherBox").style.display =
        "block";

    document.getElementById("lesson").innerHTML =
        "⏳ AI Sir lesson तयार करत आहे...";

    document.getElementById("status").innerText =
        "AI Sir is preparing the lesson...";

    window.scrollTo({
        top:document.getElementById("teacherBox").offsetTop,
        behavior:"smooth"
    });

    generateLesson();

}


/* GENERATE LESSON */

async function generateLesson(){

    try{

        const response =
            await fetch(API + "/api/ai/lesson",{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    topic:selectedTopic.title,
                    language:"Marathi"

                })

            });

        const data =
            await response.json();

        if(!data.success){

            throw new Error("Lesson failed");

        }

        currentText =
            data.lesson || data.content || "";

        document.getElementById("lesson").innerHTML =
            formatText(currentText);

        document.getElementById("status").innerText =
            "Lesson ready — Start AI Sir";

    }catch(error){

        document.getElementById("lesson").innerHTML =
            "❌ Lesson तयार करताना error आला.";

        console.error(error);

    }

}


/* FORMAT */

function formatText(text){

    return text
        .replace(/\n/g,"<br>")
        .replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>");

}


/* START AI SIR */

function startLesson(){

    if(!currentText){

        alert("पहिले topic select करा.");

        return;

    }

    stopLesson();

    const teacher =
        document.getElementById("teacher");

    const status =
        document.getElementById("status");

    teacher.classList.add("speaking");

    status.innerText =
        "🎙️ AI Sir शिकवत आहेत...";

    speech =
        new SpeechSynthesisUtterance(
            cleanText(currentText)
        );

    speech.lang = "mr-IN";

    speech.rate = 0.9;

    speech.pitch = 1;

    speech.onend = () => {

        teacher.classList.remove("speaking");

        status.innerText =
            "✅ Lesson completed";

    };

    speech.onerror = () => {

        teacher.classList.remove("speaking");

        status.innerText =
            "Speech unavailable";

    };

    window.speechSynthesis.speak(speech);

}


/* STOP */

function stopLesson(){

    window.speechSynthesis.cancel();

    document
        .getElementById("teacher")
        .classList.remove("speaking");

    document.getElementById("status").innerText =
        "⏹ AI Sir stopped";

}


/* REMOVE HTML */

function cleanText(text){

    const div =
        document.createElement("div");

    div.innerHTML = text;

    return div.innerText;

}


/* ASK AI */

async function askAI(){

    const input =
        document.getElementById("question");

    const question =
        input.value.trim();

    if(!question){

        alert("प्रश्न लिहा.");

        return;

    }

    const lesson =
        document.getElementById("lesson");

    lesson.innerHTML =
        "⏳ AI Sir उत्तर तयार करत आहेत...";

    try{

        const response =
            await fetch(API + "/api/ai/ask",{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    question:question,

                    topic:selectedTopic
                        ? selectedTopic.title
                        : "Class 10 Mathematics",

                    language:"Marathi"

                })

            });

        const data =
            await response.json();

        const answer =
            data.answer ||
            data.response ||
            data.message ||
            data.content ||
            "उत्तर मिळाले नाही.";

        currentText = answer;

        lesson.innerHTML =
            formatText(answer);

        input.value = "";

    }catch(error){

        lesson.innerHTML =
            "❌ AI Sir उत्तर देऊ शकले नाहीत.";

        console.error(error);

    }

}


loadTopics();

</script>

</body>
</html>
