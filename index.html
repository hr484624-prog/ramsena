<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIBRA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
  background: #fff;
  color: #111;
  padding-bottom: 90px;
    }

    header {
      height: 60px;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      position: sticky;
      top: 0;
      background: white;
      z-index: 10;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    .icons {
      display: flex;
      gap: 18px;
      font-size: 25px;
    }

    .stories {
      display: flex;
      gap: 15px;
      padding: 15px;
      overflow-x: auto;
      border-bottom: 1px solid #eee;
    }

    .story {
      min-width: 65px;
      text-align: center;
      font-size: 12px;
    }

    .story-circle {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(45deg, #ff8a00, #e52e71, #9b00ff);
      padding: 3px;
      margin: auto auto 5px;
    }

    .story-circle div {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #eee;
      border: 2px solid white;
    }

    .post {
  max-width: 600px;
  margin: 20px auto 100px;
  border-bottom: 1px solid #ddd;
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      font-weight: bold;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #ddd;
    }

    .post-image {
      width: 100%;
      height: 400px;
      background: linear-gradient(135deg, #ddd, #aaa);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
    }
.post-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
    }
    .actions {
      padding: 12px;
      display: flex;
      gap: 18px;
      font-size: 25px;
    }

    .caption {
      padding: 0 12px 15px;
    }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      align-items: center;
      font-size: 25px;
    }
 .popup {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  align-items: center;
  justify-content: center;
  z-index: 999;
}

.popup-box {
  width: 85%;
  max-width: 350px;
  background: white;
  border-radius: 15px;
  padding: 22px;
  text-align: center;
}

.popup-box h3 {
  font-size: 20px;
  margin-bottom: 10px;
}

.popup-box p {
  color: #666;
  margin-bottom: 20px;
}

.popup-buttons {
  display: flex;
  gap: 10px;
}

.popup-buttons button {
  flex: 1;
  padding: 11px;
  border: 1px solid #ddd;
  border-radius: 8px;
  background: white;
  font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">VIBRA</div>
    <div class="icons">
     <button id="likeBtn" onclick="toggleLike()" style="
  border:none;
  background:none;
  font-size:25px;
  cursor:pointer;
">♡</button>
      <span id="likeCount">0</span>
      <a href="messages.html" style="color:#111;text-decoration:none;">✉</a>
    </div>
  </header>

  <div class="stories">

  <div class="story" onclick="location.href='profile.html'">
    <div class="story-circle"><div></div></div>
    You
  </div>

  <div class="story">
    <div class="story-circle"><div></div></div>
    Hitesh
  </div>

  <div class="story">
    <div class="story-circle"><div></div></div>
    Krishna
  </div>

  <div class="story">
    <div class="story-circle"><div></div></div>
    Chetan
  </div>

    </div>
  <div class="post" id="homePost">
  <div class="post-image">
  <img id="homePostImage" src="" alt="Post">
  </div>

    <div class="actions">
      <a href="likes.html" style="color:#111;text-decoration:none;">♡</a>
      <span>💬</span>
      <span>↗</span>
    </div>
  <div class="caption">
  <b>hitesh</b>
  <span id="homePostText">Welcome to VIBRA 🚀</span>
  </div>
<button id="deletePostBtn" onclick="openDeletePopup()" style="
  margin: 0 12px 15px;
  padding: 8px 15px;
  border: 1px solid #ddd;
  border-radius: 8px;
  background: white;
">
  Delete Post
</button>
</div>

  <div class="bottom">
    <span>⌂</span>
    <a href="search.html" style="color:#111;text-decoration:none;">⌕</a>
    <a href="create.html" style="color:#111;text-decoration:none;">＋</a>
    <a href="likes.html" style="color:#111;text-decoration:none;">♡</a>
    <a href="profile.html" style="color:#111;text-decoration:none;">◯</a>
  </div>

<div id="deletePopup" class="popup">

  <div class="popup-box">

    <h3>Delete Post?</h3>

    <p>Are you sure you want to delete this post?</p>

    <div class="popup-buttons">

      <button onclick="closeDeletePopup()">
        Cancel
      </button>

      <button onclick="confirmDeletePost()">
        Delete
      </button>

    </div>

  </div>

</div>
<script>

const savedPostImage =
  localStorage.getItem("v_post_image");

const savedPostText =
  localStorage.getItem("v_post_text");

if (savedPostImage) {
  document.getElementById("homePostImage").src =
    savedPostImage;
}

if (savedPostText) {
  document.getElementById("homePostText").textContent =
    " " + savedPostText;
}

const postElement =
  document.getElementById("homePost");

if (savedPostImage) {
  postElement.style.display = "block";
} else {
  postElement.style.display = "none";
  }

</script>
    <script>

function openDeletePopup() {
  document.getElementById("deletePopup").style.display = "flex";
}

function closeDeletePopup() {
  document.getElementById("deletePopup").style.display = "none";
}

function confirmDeletePost() {

  localStorage.removeItem("v_post_image");
  localStorage.removeItem("v_post_text");

  location.reload();

}

</script>
<script>

let liked = localStorage.getItem("v_liked") === "true";

let likeCount =
  Number(localStorage.getItem("v_like_count")) || 0;

function updateLikeUI() {

  const likeBtn =
    document.getElementById("likeBtn");

  const count =
    document.getElementById("likeCount");

  if (likeBtn && count) {
    likeBtn.textContent = liked ? "♥" : "♡";
    count.textContent = likeCount;
  }

}

function toggleLike() {

  if (liked) {
    liked = false;
    likeCount--;
  } else {
    liked = true;
    likeCount++;
  }

  localStorage.setItem("v_liked", liked);
  localStorage.setItem("v_like_count", likeCount);

  updateLikeUI();

}

updateLikeUI();

</script>
    </body>
  </html>
