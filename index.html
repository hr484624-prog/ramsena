<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIBRA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #fff;
      color: #111;
    }

    header {
      height: 60px;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      position: sticky;
      top: 0;
      background: white;
      z-index: 10;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    .icons {
      display: flex;
      gap: 18px;
      font-size: 25px;
    }

    .stories {
      display: flex;
      gap: 15px;
      padding: 15px;
      overflow-x: auto;
      border-bottom: 1px solid #eee;
    }

    .story {
      min-width: 65px;
      text-align: center;
      font-size: 12px;
    }

    .story-circle {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(45deg, #ff8a00, #e52e71, #9b00ff);
      padding: 3px;
      margin: auto auto 5px;
    }

    .story-circle div {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #eee;
      border: 2px solid white;
    }

    .post {
      max-width: 600px;
      margin: 20px auto;
      border-bottom: 1px solid #ddd;
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      font-weight: bold;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #ddd;
    }

    .post-image {
      width: 100%;
      height: 400px;
      background: linear-gradient(135deg, #ddd, #aaa);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
    }

    .actions {
      padding: 12px;
      display: flex;
      gap: 18px;
      font-size: 25px;
    }

    .caption {
      padding: 0 12px 15px;
    }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      align-items: center;
      font-size: 25px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">VIBRA</div>
    <div class="icons">
      <span>♡</span>
      <span>✉</span>
    </div>
  </header>

  <div class="stories">
    <div class="story">
      <div class="story-circle"><div></div></div>
      You
    </div>

    <div class="story">
      <div class="story-circle"><div></div></div>
      Hitesh
    </div>

    <div class="story">
      <div class="story-circle"><div></div></div>
      Krishna
    </div>

    <div class="story">
      <div class="story-circle"><div></div></div>
      Chetan
    </div>
  </div>

  <div class="post">
    <div class="post-header">
      <div class="avatar"></div>
      hitesh
    </div>

    <div class="post-image">📸</div>

    <div class="actions">
      <span>♡</span>
      <span>💬</span>
      <span>↗</span>
    </div>

    <div class="caption">
      <b>hitesh</b> Welcome to VIBRA 🚀
    </div>
  </div>

  <div class="bottom">
    <span>⌂</span>
    <a href="search.html" style="color:#111;text-decoration:none;">⌕</a>
    <a href="create.html" style="color:#111;text-decoration:none;">＋</a>
    <span>♡</span>
    <a href="profile.html" style="color:#111;text-decoration:none;">◯</a>
  </div>

</body>
  </html>
