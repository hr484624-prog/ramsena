   OVERLAY
================================ */

.overlay{

  position:fixed;

  justify-content:center;

  padding:15px;

  z-index:100;
}

}

   MEDIUM POPUP
================================ */

.medium-popup{

  background:white;

.popup-title{

        ["१ + १ = ?",["१","२","३","४"],1],
        ["२ + १ = ?",["२","३","४","५"],1],
        ["२ + २ = ?",["३","४","५","६"],1],
        ["३ + १ = ?",["३","४","५","६"],1],
        ["३ + २ = ?",["४","५","६","७"],1],
        ["४ + १ = ?",["४","५","६","७"],1],
        ["४ + २ = ?",["५","६","७","८"],1],
        ["५ + १ = ?",["५","६","७","८"],1],
        ["५ + २ = ?",["६","७","८","९"],1],
        ["६ + १ = ?",["६","७","८","९"],1],
        ["१ + ३ = ?",["३","४","५","६"],1],
        ["२ + ३ = ?",["४","५","६","७"],1],
        ["३ + ३ = ?",["५","६","७","८"],1],
        ["४ + ३ = ?",["६","७","८","९"],1],
        ["५ + ३ = ?",["७","८","९","१०"],1],
        ["६ + २ = ?",["७","८","९","१०"],1],
        ["७ + १ = ?",["७","८","९","१०"],1],
        ["७ + २ = ?",["८","९","१०","११"],1],
        ["८ + १ = ?",["८","९","१०","११"],1],

      ]
    }

  ]

};
  
<script>

/* =================================
   CURRENT MEDIUM
================================= */

let currentMedium = "";

let currentChapter = null;


/* =================================
   OPEN MEDIUM
================================= */

function openMediumPopup(){

  document
    .getElementById("mediumOverlay")
    .classList.add("show");

}


/* =================================
   CLOSE MEDIUM
================================= */

function closeMediumPopup(){

  document
    .getElementById("mediumOverlay")
    .classList.remove("show");

}


/* =================================
   SELECT MEDIUM
================================= */

function selectMedium(medium){

  currentMedium = medium;

  closeMediumPopup();

  showChapters();

}


/* =================================
   SHOW CHAPTERS
================================= */

function showChapters(){

  const overlay =
    document.getElementById("chapterOverlay");

  const title =
    document.getElementById("mediumTitle");

  const list =
    document.getElementById("chapterList");


  title.innerText =
    currentMedium + " Medium";


  list.innerHTML = "";


  const data =
    chapters[currentMedium];


  data.forEach(function(chapter,index){

    const card =
      document.createElement("div");


    card.className =
      "chapter-card";


    card.onclick =
      function(){

        openChapter(index);

      };


    card.innerHTML = `

      <div class="chapter-number">

        ${index + 1}

      </div>

      <div>

        <h3>
          ${chapter.title}
        </h3>

        <p>
          ${chapter.subtitle}
        </p>

      </div>

    `;


    list.appendChild(card);

  });


  overlay.classList.add("show");

}


/* =================================
   OPEN CHAPTER
================================= */

function openChapter(index){

  currentChapter =
    chapters[currentMedium][index];


  document
    .getElementById("chapterOverlay")
    .classList.remove("show");


  document
    .getElementById("fullChapterTitle")
    .innerText =
      currentChapter.title;


  document
    .getElementById("fullChapterSubtitle")
    .innerText =
      currentChapter.subtitle;


  document
    .getElementById("chapterContent")
    .innerHTML =
      currentChapter.content;


  createQuiz();


  document
    .getElementById("chapterFullOverlay")
    .classList.add("show");

}


/* =================================
   CREATE QUIZ
================================= */

function createQuiz(){

  const box =
    document.getElementById("quizBox");


  const result =
    document.getElementById("quizResult");


  box.innerHTML = "";

  result.innerHTML = "";


  currentChapter.quiz.forEach(
    function(item,index){

      const question =
        item[0];

      const options =
        item[1];


      const correct =
        item[2];


      const card =
        document.createElement("div");


      card.className =
        "quiz-card";


      let html = `

        <div class="quiz-question">

          ${index + 1}.
          ${question}

        </div>

      `;


      options.forEach(
        function(option,optIndex){

          html += `

            <button
              class="option-btn"
              data-question="${index}"
              data-option="${optIndex}"
              onclick="checkAnswer(
                this,
                ${index},
                ${optIndex},
                ${correct}
              )">

              ${option}

            </button>

          `;

        }
      );


      card.innerHTML = html;

      box.appendChild(card);

    }
  );

  }
  
<script>

/* =================================
   QUIZ SCORE
================================= */

let quizScore = 0;

let answeredQuestions = 0;


/* =================================
   CHECK ANSWER
================================= */

function checkAnswer(
  button,
  questionIndex,
  selectedIndex,
  correctIndex
){

  const card =
    button.parentElement;


  const buttons =
    card.querySelectorAll(
      ".option-btn"
    );


  /* Already answered */

  if(
    card.dataset.answered === "yes"
  ){

    return;

  }


  card.dataset.answered = "yes";


  answeredQuestions++;


  /* Disable all */

  buttons.forEach(
    function(btn){

      btn.disabled = true;

    }
  );


  /* Correct */

  if(
    selectedIndex === correctIndex
  ){

    button.classList.add("correct");

    quizScore++;

  }

  else{

    button.classList.add("wrong");


    buttons[
      correctIndex
    ].classList.add("correct");

  }


  /* Result */

  if(
    answeredQuestions ===
    currentChapter.quiz.length
  ){

    showQuizResult();

  }

}


/* =================================
   SHOW RESULT
================================= */

function showQuizResult(){

  const result =
    document.getElementById(
      "quizResult"
    );


  const total =
    currentChapter.quiz.length;


  let message = "";


  if(quizScore === total){

    message =
      "🏆 Perfect! खूप छान!";

  }

  else if(quizScore >= 15){

    message =
      "🌟 Excellent! खूपच छान!";

  }

  else if(quizScore >= 10){

    message =
      "👍 Good Job! अजून थोडा सराव करा.";

  }

  else{

    message =
      "💪 पुन्हा प्रयत्न करा. तुम्ही नक्की शिकाल!";

  }


  result.innerHTML = `

    🎯 तुमचा Score

    <br><br>

    <strong>
      ${quizScore} / ${total}
    </strong>

    <br><br>

    ${message}

  `;

}


/* =================================
   BACK TO MEDIUM
================================= */

function backToMedium(){

  document
    .getElementById("chapterOverlay")
    .classList.remove("show");


  openMediumPopup();

}


/* =================================
   BACK TO CHAPTERS
================================= */

function backToChapters(){

  document
    .getElementById("chapterFullOverlay")
    .classList.remove("show");


  showChapters();

}


/* =================================
   CLOSE CHAPTER POPUP
================================= */

function closeChapterPopup(){

  document
    .getElementById("chapterOverlay")
    .classList.remove("show");

}


/* =================================
   CLOSE FULL CHAPTER
================================= */

function closeFullChapter(){

  document
    .getElementById("chapterFullOverlay")
    .classList.remove("show");

}


/* =================================
   OUTSIDE CLICK
================================= */

document
  .getElementById("mediumOverlay")
  .addEventListener(
    "click",
    function(e){

      if(
        e.target === this
      ){

        closeMediumPopup();

      }

    }
  );


document
  .getElementById("chapterOverlay")
  .addEventListener(
    "click",
    function(e){

      if(
        e.target === this
      ){

        closeChapterPopup();

      }

    }
  );


document
  .getElementById("chapterFullOverlay")
  .addEventListener(
    "click",
    function(e){

      if(
        e.target === this
      ){

        closeFullChapter();

      }

    }
  );


/* =================================
   GO BACK
================================= */

function goBack(){

  window.location.href =
    "learn.html";

}
