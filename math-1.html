  justify-content:center;
  padding:15px;
  z-index:100;
  backdrop-filter:blur(4px);
}

.popup-overlay.show{

}

.medium-popup{

  max-width:400px;
  background:white;
  border-radius:25px;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.25);

}

@keyframes popupIn{
  from{

    transform:translateY(30px) scale(.95);

  to{

.popup-top p{

  <script>

/* =====================================================
   MEDIUM
===================================================== */

function openMediumPopup(){

  document
    .getElementById("mediumOverlay")
    .classList
    .add("show");

}


function closeMediumPopup(){

  document
    .getElementById("mediumOverlay")
    .classList
    .remove("show");

}


/* =====================================================
   SELECT MEDIUM
===================================================== */

function selectMedium(medium){

  closeMediumPopup();

  document
    .getElementById("mediumTitle")
    .innerText = medium + " Medium";

  document
    .getElementById("mediumSubtitle")
    .innerText =
      "Select a chapter to start learning";


  createChapterList(medium);

  document
    .getElementById("chapterListOverlay")
    .classList
    .add("show");

}


/* =====================================================
   CREATE CHAPTER LIST
===================================================== */

function createChapterList(medium){

  const list =
    document.getElementById("chapterList");

  list.innerHTML = "";


  const data = chapters[medium];


  if(!data){
    return;
  }


  data.forEach(function(chapter,index){

    const button =
      document.createElement("button");

    button.className =
      "chapter-card";


    button.innerHTML = `

      <div class="chapter-number">
        ${index + 1}
      </div>

      <div class="chapter-name">

        <h3>
          ${chapter.title}
        </h3>

        <p>
          ${chapter.subtitle}
        </p>

      </div>

      <div class="chapter-arrow">
        ›
      </div>

    `;


    button.onclick = function(){

      openChapter(
        chapter,
        medium,
        index
      );

    };


    list.appendChild(button);

  });

}


/* =====================================================
   CLOSE CHAPTER LIST
===================================================== */

function closeChapterList(){

  document
    .getElementById("chapterListOverlay")
    .classList
    .remove("show");

}


/* =====================================================
   OPEN CHAPTER
===================================================== */

function openChapter(
  chapter,
  medium,
  index
){

  closeChapterList();


  document
    .getElementById("chapterTitle")
    .innerText =
      chapter.title;


  document
    .getElementById("chapterSubtitle")
    .innerText =
      medium +
      " Medium • Chapter " +
      (index + 1);


  let html =
    chapter.content;


  html += `

    <div class="quiz-title">

      <span>📝</span>

      <h3>
        Quiz - 20 Questions
      </h3>

    </div>

  `;


  chapter.quiz.forEach(
    function(question,index){

      html += createQuestion(
        question,
        index
      );

    }
  );


  html += `

    <div
      id="quizResult"
      class="quiz-result hidden">

      <div>
        🎉 Quiz Completed!
      </div>

      <div
        id="finalScore"
        class="score">
        0 / 20
      </div>

      <p>
        Keep learning and keep improving!
      </p>

    </div>

  `;


  document
    .getElementById("chapterContent")
    .innerHTML = html;


  document
    .getElementById("chapterOverlay")
    .classList
    .add("show");


  window.currentScore = 0;

  window.totalAnswered = 0;

}


/* =====================================================
   CREATE QUESTION
===================================================== */

function createQuestion(
  question,
  questionIndex
){

  const questionText =
    question[0];

  const options =
    question[1];

  const correctAnswer =
    question[2];


  let html = `

    <div
      class="quiz-card"
      id="question-${questionIndex}">

      <div class="question-number">

        Question ${questionIndex + 1}
        / 20

      </div>

      <div class="question-text">

        ${questionText}

      </div>

  `;


  options.forEach(
    function(option,index){

      html += `

        <button
          class="option"
          onclick="checkAnswer(
            this,
            ${questionIndex},
            ${index},
            ${correctAnswer}
          )">

          ${option}

        </button>

      `;

    }
  );


  html += `

    </div>

  `;


  return html;

  }
  <script>

/* =====================================================
   QUIZ ANSWER
===================================================== */

function checkAnswer(
  button,
  questionIndex,
  selectedIndex,
  correctIndex
){

  const card =
    document.getElementById(
      "question-" + questionIndex
    );


  if(card.dataset.answered === "true"){
    return;
  }


  card.dataset.answered = "true";


  const buttons =
    card.querySelectorAll(".option");


  buttons.forEach(function(btn){

    btn.disabled = true;

  });


  if(
    selectedIndex === correctIndex
  ){

    button.classList.add("correct");

    window.currentScore++;

  }else{

    button.classList.add("wrong");

    buttons[
      correctIndex
    ].classList.add("correct");

  }


  window.totalAnswered++;


  if(
    window.totalAnswered === 20
  ){

    showQuizResult();

  }

}


/* =====================================================
   RESULT
===================================================== */

function showQuizResult(){

  const result =
    document.getElementById(
      "quizResult"
    );


  const score =
    document.getElementById(
      "finalScore"
    );


  score.innerText =
    window.currentScore +
    " / 20";


  result.classList.remove(
    "hidden"
  );


  setTimeout(function(){

    result.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

  },100);

}


/* =====================================================
   CLOSE CHAPTER
===================================================== */

function closeChapterPopup(){

  document
    .getElementById("chapterOverlay")
    .classList
    .remove("show");

}

   BACK
===================================================== */

function goBack(){

  history.back();

        event.target === this

        closeMediumPopup();

      }

    }

    "click",

      if(
        event.target === this

        closeChapterList();

      }

    }
  );

    "click",
    function(event){

      if(
        event.target === this
      ){

        closeChapterPopup();

      }

    }
  );


</script>
