<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GyanSetu - Class 1 Maths</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#eef6ff;
  color:#18264d;
}

.page{
  width:100%;
  max-width:430px;
  min-height:100vh;
  margin:auto;
  background:#f7faff;
  padding-bottom:30px;
}

/* HEADER */

.header{
  background:linear-gradient(135deg,#087df5,#0058c9);
  color:white;
  padding:18px 16px;
  box-shadow:0 4px 15px rgba(0,80,180,.18);
}

.header-row{
  display:flex;
  align-items:center;
  gap:15px;
}

.back{
  width:40px;
  height:40px;
  border-radius:50%;
  background:rgba(255,255,255,.18);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  cursor:pointer;
}

.class-title{
  font-size:21px;
  font-weight:800;
}

/* HERO */

.hero{
  margin:18px 16px;
  padding:25px 18px;
  background:white;
  border-radius:23px;
  text-align:center;
  box-shadow:0 6px 20px rgba(0,80,180,.08);
}

.math-icon{
  width:75px;
  height:75px;
  margin:auto;
  border-radius:22px;
  background:#e4f1ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
}

.hero h2{
  margin-top:14px;
  color:#075fc9;
}

.hero p{
  margin-top:7px;
  color:#718096;
  font-size:13px;
  line-height:1.5;
}

/* CHAPTERS */

.chapter-title{
  margin:22px 16px 12px;
  font-size:19px;
  font-weight:800;
  color:#075fc9;
}

.chapters{
  padding:0 16px;
}

.chapter{
  width:100%;
  border:none;
  background:white;
  margin-bottom:12px;
  padding:17px;
  border-radius:18px;
  display:flex;
  align-items:center;
  gap:14px;
  text-align:left;
  box-shadow:0 5px 16px rgba(0,80,180,.07);
  cursor:pointer;
}

.chapter:active{
  transform:scale(.98);
}

.chapter-number{
  min-width:48px;
  height:48px;
  border-radius:15px;
  background:#e6f2ff;
  color:#087df5;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.chapter-info strong{
  display:block;
  color:#18264d;
  font-size:15px;
}

.chapter-info span{
  display:block;
  color:#8491a5;
  font-size:12px;
  margin-top:4px;
}

/* POPUP */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,35,80,.62);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:1000;
}

.overlay.show{
  display:flex;
}

.popup{
  width:100%;
  max-width:390px;
  max-height:85vh;
  overflow:auto;
  background:white;
  border-radius:27px;
  padding:24px 18px 28px;
  box-shadow:0 15px 45px rgba(0,0,0,.25);
  animation:popupIn .25s ease;
}

@keyframes popupIn{
  from{
    opacity:0;
    transform:scale(.92) translateY(20px);
  }
  to{
    opacity:1;
    transform:scale(1) translateY(0);
  }
}

.popup-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.popup-top h3{
  color:#075fc9;
  font-size:19px;
}

.close{
  width:38px;
  height:38px;
  border:none;
  border-radius:50%;
  background:#eaf4ff;
  color:#075fc9;
  font-size:23px;
  cursor:pointer;
}

.future-box{
  min-height:300px;
  border-radius:22px;
  background:linear-gradient(145deg,#eef7ff,#ffffff);
  border:1px solid #d6eaff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px 20px;
}

.future-icon{
  width:85px;
  height:85px;
  border-radius:25px;
  background:#087df5;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  box-shadow:0 10px 25px rgba(8,125,245,.25);
}

.future-box h2{
  margin-top:20px;
  color:#075fc9;
  font-size:21px;
}

.future-box p{
  margin-top:10px;
  color:#687789;
  font-size:14px;
  line-height:1.6;
}

.ok-btn{
  width:100%;
  margin-top:20px;
  height:48px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#087df5,#0058c9);
  color:white;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="page">

  <div class="header">

    <div class="header-row">

      <div class="back" onclick="goBack()">‹</div>

      <div class="class-title">
        📐 Class 1st • Mathematics
      </div>

    </div>

  </div>


  <div class="hero">

    <div class="math-icon">
      🔢
    </div>

    <h2>Class 1st Mathematics</h2>

    <p>
      तुमच्या आवडत्या भाषेत गणित शिका,
      समजा आणि सराव करा. 📚✨
    </p>

  </div>


  <div class="chapter-title">
    📚 Chapters
  </div>

  <div class="chapters">

    <button class="chapter" onclick="openChapter('Chapter 1')">
      <div class="chapter-number">01</div>
      <div class="chapter-info">
        <strong>Chapter 1</strong>
        <span>धडा लवकरच उपलब्ध होईल</span>
      </div>
    </button>

    <button class="chapter" onclick="openChapter('Chapter 2')">
      <div class="chapter-number">02</div>
      <div class="chapter-info">
        <strong>Chapter 2</strong>
        <span>धडा लवकरच उपलब्ध होईल</span>
      </div>
    </button>

    <button class="chapter" onclick="openChapter('Chapter 3')">
      <div class="chapter-number">03</div>
      <div class="chapter-info">
        <strong>Chapter 3</strong>
        <span>धडा लवकरच उपलब्ध होईल</span>
      </div>
    </button>

    <button class="chapter" onclick="openChapter('Chapter 4')">
      <div class="chapter-number">04</div>
      <div class="chapter-info">
        <strong>Chapter 4</strong>
        <span>धडा लवकरच उपलब्ध होईल</span>
      </div>
    </button>

    <button class="chapter" onclick="openChapter('Chapter 5')">
      <div class="chapter-number">05</div>
      <div class="chapter-info">
        <strong>Chapter 5</strong>
        <span>धडा लवकरच उपलब्ध होईल</span>
      </div>
    </button>

    <button class="chapter" onclick="openChapter('Chapter 6')">
      <div class="chapter-number">06</div>
      <div class="chapter-info">
        <strong>Chapter 6</strong>
        <span>धडा लवकरच उपलब्ध होईल</span>
      </div>
    </button>

    <button class="chapter" onclick="openChapter('Chapter 7')">
      <div class="chapter-number">07</div>
      <div class="chapter-info">
        <strong>Chapter 7</strong>
        <span>धडा लवकरच उपलब्ध होईल</span>
      </div>
    </button>

    <button class="chapter" onclick="openChapter('Chapter 8')">
      <div class="chapter-number">08</div>
      <div class="chapter-info">
        <strong>Chapter 8</strong>
        <span>धडा लवकरच उपलब्ध होईल</span>
      </div>
    </button>

  </div>

</div>


<!-- CHAPTER POPUP -->

<div id="chapterPopup" class="overlay">

  <div class="popup">

    <div class="popup-top">

      <h3 id="popupTitle">
        Chapter
      </h3>

      <button class="close" onclick="closePopup()">
        ×
      </button>

    </div>


    <div class="future-box">

      <div class="future-icon">
        📚
      </div>

      <h2>
        हा धडा लवकरच येत आहे!
      </h2>

      <p>
        या Chapter मध्ये सोप्या भाषेत
        संपूर्ण धडा, उदाहरणे, चित्रे,
        प्रश्न आणि सराव दिला जाईल.
        <br><br>
        <b>GyanSetu वर हा धडा नंतर जोडला जाईल.</b>
      </p>

    </div>


    <button class="ok-btn" onclick="closePopup()">
      समजले 👍
    </button>

  </div>

</div>


<script>

function goBack(){

  window.location.href = "learn.html";

}


function openChapter(chapter){

  document.getElementById("popupTitle").innerText =
    "📖 " + chapter;

  document
    .getElementById("chapterPopup")
    .classList.add("show");

}


function closePopup(){

  document
    .getElementById("chapterPopup")
    .classList.remove("show");

}


document
  .getElementById("chapterPopup")
  .addEventListener("click",function(event){

    if(event.target === this){
      closePopup();
    }

  });

</script>

</body>
          </html>
