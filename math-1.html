<!DOCTYPE html>
<html lang="mr">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>GyanSetu - Class 1 Mathematics</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#eef6ff;
  color:#17324d;
}

.page{
  width:100%;
  max-width:430px;
  min-height:100vh;
  margin:auto;
  background:#eef6ff;
}

/* HEADER */

.header{
  height:65px;
  background:linear-gradient(
    135deg,
    #087df5,
    #0058c9
  );

  color:white;

  display:flex;
  align-items:center;

  padding:0 16px;

  gap:14px;

  box-shadow:
    0 4px 15px rgba(0,70,160,.20);
}

.back{
  width:42px;
  height:42px;

  border:none;
  border-radius:50%;

  background:
    rgba(255,255,255,.18);

  color:white;

  font-size:27px;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;
}

.header-title{
  font-size:20px;
  font-weight:bold;
}

/* MAIN */

.main{
  padding:20px 16px 40px;
}

/* HERO */

.hero{
  background:white;

  border-radius:24px;

  padding:25px 18px;

  text-align:center;

  box-shadow:
    0 7px 22px rgba(0,80,180,.10);

  margin-bottom:18px;
}

.hero-icon{
  width:78px;
  height:78px;

  margin:auto;

  border-radius:23px;

  background:#e4f1ff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:40px;
}

.hero h2{
  margin-top:13px;

  color:#075fc9;

  font-size:22px;
}

.hero p{
  margin-top:7px;

  color:#718096;

  font-size:13px;

  line-height:1.5;
}

/* START BUTTON */

.start-btn{
  width:100%;

  border:none;

  padding:17px;

  border-radius:17px;

  background:
    linear-gradient(
      135deg,
      #087df5,
      #0055c7
    );

  color:white;

  font-size:17px;

  font-weight:bold;

  box-shadow:
    0 7px 18px rgba(0,90,210,.25);

  cursor:pointer;
}

.start-btn:active{
  transform:scale(.98);
}

/* POPUP BACKGROUND */

.overlay{
  position:fixed;

  inset:0;

  background:
    rgba(0,30,70,.60);

  display:none;

  align-items:flex-end;
  justify-content:center;

  z-index:1000;
}

.overlay.show{
  display:flex;
}

/* POPUP */

.popup{
  width:100%;

  max-width:600px;

  max-height:92vh;

  overflow-y:auto;

  background:white;

  border-radius:
    28px 28px 0 0;

  padding:
    22px 17px 30px;

  animation:
    popupUp .25s ease;
}

@keyframes popupUp{

  from{
    transform:translateY(100%);
  }

  to{
    transform:translateY(0);
  }

}

/* POPUP HEADER */

.popup-head{
  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:20px;
}

.popup-head h3{
  color:#075fc9;

  font-size:20px;
}

.close-btn{
  width:40px;
  height:40px;

  border:none;

  border-radius:50%;

  background:#eaf4ff;

  color:#075fc9;

  font-size:24px;

  cursor:pointer;
}

/* MEDIUM OPTION */

.medium{
  width:100%;

  border:1px solid #d8eaff;

  background:#f8fbff;

  border-radius:19px;

  padding:17px;

  margin-bottom:12px;

  display:flex;

  align-items:center;

  gap:15px;

  cursor:pointer;

  text-align:left;
}

.medium:active{
  transform:scale(.98);
}

.medium-icon{
  width:55px;
  height:55px;

  border-radius:16px;

  background:#e3f1ff;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:27px;
}

.medium-text strong{
  display:block;

  color:#075fc9;

  font-size:17px;

  margin-bottom:4px;
}

.medium-text span{
  color:#718096;

  font-size:12px;
}

/* LESSON LIST */

.lesson-list{
  display:flex;

  flex-direction:column;

  gap:11px;
}

.lesson{
  width:100%;

  border:1px solid #d9eaff;

  background:#f8fbff;

  border-radius:17px;

  padding:16px;

  display:flex;

  align-items:center;

  gap:13px;

  text-align:left;

  cursor:pointer;
}

.lesson-icon{
  min-width:48px;
  height:48px;

  border-radius:14px;

  background:#e4f2ff;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:24px;
}

.lesson-info strong{
  display:block;

  color:#075fc9;

  font-size:15px;

  margin-bottom:4px;
}

.lesson-info span{
  color:#718096;

  font-size:12px;
}

/* BIG CHAPTER POPUP */

.chapter-popup{
  width:100%;

  max-width:650px;

  height:94vh;

  background:white;

  border-radius:
    28px 28px 0 0;

  overflow-y:auto;

  padding:
    20px 17px 35px;

  animation:
    popupUp .25s ease;
}

/* CHAPTER CONTENT */

.chapter-title{
  color:#075fc9;

  font-size:23px;

  margin-bottom:12px;
}

.chapter-box{
  background:#f1f8ff;

  border:1px solid #d6eaff;

  border-radius:18px;

  padding:16px;

  margin-bottom:14px;
}

.chapter-box h4{
  color:#075fc9;

  margin-bottom:8px;

  font-size:16px;
}

.chapter-box p{
  color:#46586b;

  font-size:14px;

  line-height:1.7;
}

.example{
  background:white;

  border-left:
    4px solid #087df5;

  padding:13px;

  border-radius:10px;

  margin-top:10px;

  color:#34495e;

  font-size:14px;

  line-height:1.6;
}

/* QUIZ */

.quiz-section{
  margin-top:20px;
}

.quiz-title{
  color:#075fc9;

  font-size:20px;

  margin-bottom:12px;
}

.quiz-question{
  background:#f7fbff;

  border:1px solid #dcecff;

  border-radius:17px;

  padding:15px;

  margin-bottom:13px;
}

.quiz-question h4{
  font-size:14px;

  line-height:1.5;

  margin-bottom:11px;
}

.quiz-option{
  width:100%;

  padding:11px;

  margin-top:7px;

  border:1px solid #d8e7f7;

  border-radius:11px;

  background:white;

  text-align:left;

  cursor:pointer;

  color:#28445e;
}

.quiz-option.correct{
  background:#e8f8ee;

  border-color:#38a169;

  color:#17643a;
}

.quiz-option.wrong{
  background:#fff0f0;

  border-color:#e05252;

  color:#9b2222;
}

</style>

</head>

<body>

<div class="page">

  <div class="header">

    <button
      class="back"
      onclick="goBack()">

      ‹

    </button>

    <div class="header-title">

      📐 Class 1 Mathematics

    </div>

  </div>

  <div class="main">

    <div class="hero">

      <div class="hero-icon">
        🔢
      </div>

      <h2>
        Mathematics
      </h2>

      <p>
        Class 1st चे गणित सोप्या उदाहरणांसह
        आणि मजेदार पद्धतीने शिका.
      </p>

    </div>

    <button
      class="start-btn"
      onclick="openMediumPopup()">

      📚 Start Learning

    </button>

  </div>

</div>

<!-- MEDIUM POPUP -->

<div
  id="mediumOverlay"
  class="overlay">

  <div class="popup">

    <div class="popup-head">

      <h3>
        📚 Select Medium
      </h3>

      <button
        class="close-btn"
        onclick="closePopup('mediumOverlay')">

        ×

      </button>

    </div>

    <button
      class="medium"
      onclick="selectMedium('English')">

      <div class="medium-icon">
        🇬🇧
      </div>

      <div class="medium-text">

        <strong>
          English Medium
        </strong>

        <span>
          Learn Mathematics in English
        </span>

      </div>

    </button>

    <button
      class="medium"
      onclick="selectMedium('Hindi')">

      <div class="medium-icon">
        🇮🇳
      </div>

      <div class="medium-text">

        <strong>
          Hindi Medium
        </strong>

        <span>
          गणित हिंदी में सीखें
        </span>

      </div>

    </button>

    <button
      class="medium"
      onclick="selectMedium('Marathi')">

      <div class="medium-icon">
        📖
      </div>

      <div class="medium-text">

        <strong>
          Marathi Medium
        </strong>

        <span>
          गणित मराठीमध्ये शिका
        </span>

      </div>

    </button>

  </div>

</div>

<!-- LESSON POPUP -->

<div
  id="lessonOverlay"
  class="overlay">

  <div class="popup">

    <div class="popup-head">

      <h3 id="mediumTitle">
        📚 Lessons
      </h3>

      <button
        class="close-btn"
        onclick="closePopup('lessonOverlay')">

        ×

      </button>

    </div>

    <div
      id="lessonList"
      class="lesson-list">
    </div>

  </div>

</div>

<!-- CHAPTER POPUP -->

<div
  id="chapterOverlay"
  class="overlay">

  <div class="chapter-popup">

    <div class="popup-head">

      <h3>
        📖 Chapter
      </h3>

      <button
        class="close-btn"
        onclick="closePopup('chapterOverlay')">

        ×

      </button>

    </div>

    <div id="chapterContent">
    </div>

  </div>

   </div>
   <script>

let selectedMedium = "";

const lessons = {

  English: [
    {
      title:"Chapter 1 - Numbers",
      subtitle:"Numbers around us",
      content:`
        <h2 class="chapter-title">🔢 Chapter 1 - Numbers</h2>

        <div class="chapter-box">
          <h4>📖 Let's Learn</h4>
          <p>
            Numbers help us count things around us.
            We use numbers every day while counting
            toys, books, fruits and many other things.
          </p>

          <div class="example">
            🍎🍎🍎 = 3 apples<br>
            So, the number is <b>3</b>.
          </div>
        </div>

        <div class="chapter-box">
          <h4>1️⃣ Counting</h4>
          <p>
            We can count objects one by one.
            The numbers start as 1, 2, 3, 4, 5
            and continue further.
          </p>

          <div class="example">
            ⭐ ⭐ ⭐ ⭐ ⭐<br>
            There are <b>5 stars</b>.
          </div>
        </div>

        <div class="chapter-box">
          <h4>🔎 Number Recognition</h4>
          <p>
            We should be able to recognise numbers
            and understand how many objects they represent.
          </p>

          <div class="example">
            🐟 🐟 🐟 🐟<br>
            Four fish means the number <b>4</b>.
          </div>
        </div>

        <div class="chapter-box">
          <h4>💡 Remember</h4>
          <p>
            Count carefully and say each number
            only once while counting.
          </p>
        </div>

        <div class="quiz-section">

          <h3 class="quiz-title">
            📝 Practice Quiz
          </h3>

          ${makeQuiz("English")}

        </div>
      `
    },

    {
      title:"Chapter 2 - Addition",
      subtitle:"Learn to add numbers",
      content:`
        <h2 class="chapter-title">➕ Chapter 2 - Addition</h2>

        <div class="chapter-box">
          <h4>📖 What is Addition?</h4>
          <p>
            Addition means putting two or more groups
            together to find the total.
          </p>

          <div class="example">
            🍎🍎 + 🍎 = 🍎🍎🍎<br>
            2 + 1 = <b>3</b>
          </div>
        </div>

        <div class="chapter-box">
          <h4>🧠 Easy Example</h4>
          <p>
            If you have 3 pencils and get 2 more pencils,
            you have 5 pencils altogether.
          </p>

          <div class="example">
            3 + 2 = <b>5</b>
          </div>
        </div>

        <div class="chapter-box">
          <h4>💡 Remember</h4>
          <p>
            In addition, the total becomes bigger
            when we add a positive number.
          </p>
        </div>

        <div class="quiz-section">
          <h3 class="quiz-title">📝 Practice Quiz</h3>
          ${makeQuiz("English")}
        </div>
      `
    },

    {
      title:"Chapter 3 - Subtraction",
      subtitle:"Learn to take away",
      content:`
        <h2 class="chapter-title">➖ Chapter 3 - Subtraction</h2>

        <div class="chapter-box">
          <h4>📖 What is Subtraction?</h4>
          <p>
            Subtraction means taking something away
            from a group.
          </p>

          <div class="example">
            🍎🍎🍎 - 🍎 = 🍎🍎<br>
            3 - 1 = <b>2</b>
          </div>
        </div>

        <div class="chapter-box">
          <h4>🧠 Easy Example</h4>
          <p>
            You have 5 chocolates and give 2 away.
            How many chocolates are left?
          </p>

          <div class="example">
            5 - 2 = <b>3</b>
          </div>
        </div>

        <div class="quiz-section">
          <h3 class="quiz-title">📝 Practice Quiz</h3>
          ${makeQuiz("English")}
        </div>
      `
    }
  ],


  Hindi: [

    {
      title:"अध्याय 1 - संख्याएँ",
      subtitle:"संख्याओं को पहचानें और गिनें",
      content:`
        <h2 class="chapter-title">
          🔢 अध्याय 1 - संख्याएँ

        <div class="chapter-box">
          <h4>📖 आइए सीखें</h4>

          <p>
            हम अपने आसपास की चीज़ों को गिनने के लिए

          <div class="example">

            यहाँ <b>3 सेब</b> हैं।
          </div>
        </div>

        <div class="chapter-box">
          <h4>1️⃣ गिनती</h4>

          <p>
            वस्तुओं को एक-एक करके गिनें।
            1, 2, 3, 4, 5...
            इस प्रकार संख्याएँ आगे बढ़ती हैं।
          </p>

          <div class="example">
            ⭐ ⭐ ⭐ ⭐<br>
            कुल <b>4 सितारे</b> हैं।
          </div>
        </div>

        <div class="chapter-box">
          <h4>💡 याद रखें</h4>

          <p>
            गिनते समय हर वस्तु को केवल एक बार गिनें।
          </p>
        </div>

        <div class="quiz-section">
          <h3 class="quiz-title">
            📝 अभ्यास प्रश्न
          </h3>

          ${makeQuiz("Hindi")}
        </div>
      `
    },

    {
      title:"अध्याय 2 - जोड़",
      subtitle:"संख्याओं को जोड़ना सीखें",
      content:`
        <h2 class="chapter-title">
          ➕ अध्याय 2 - जोड़
        </h2>

        <div class="chapter-box">
          <h4>📖 जोड़ क्या है?</h4>

          <p>
            दो या दो से अधिक समूहों को एक साथ

          <div class="example">

          <p>

            2 और पेंसिल मिलती हैं।
          </p>

          <div class="example">
            3 + 2 = <b>5</b>
          </div>
        </div>

        <div class="quiz-section">
          <h3 class="quiz-title">
            📝 अभ्यास प्रश्न
          </h3>

          ${makeQuiz("Hindi")}
        </div>
      `
    },

    {
      title:"अध्याय 3 - घटाव",
      subtitle:"वस्तुओं को कम करना सीखें",
      content:`
        <h2 class="chapter-title">
          ➖ अध्याय 3 - घटाव
        </h2>

        <div class="chapter-box">

          <h4>📖 घटाव क्या है?</h4>

          <p>
            किसी समूह में से वस्तुओं को हटाने

          <div class="example">
            🍎🍎🍎 - 🍎 = 🍎🍎<br>
            3 - 1 = <b>2</b>
          </div>

        </div>

        <div class="chapter-box">

          <h4>🧠 आसान उदाहरण</h4>

          <p>
            आपके पास 5 टॉफियाँ हैं।
            आपने 2 टॉफियाँ दे दीं।
          </p>

          <div class="example">
            5 - 2 = <b>3</b>
          </div>

        </div>

        <div class="quiz-section">
          <h3 class="quiz-title">
            📝 अभ्यास प्रश्न
          </h3>

          ${makeQuiz("Hindi")}
        </div>
      `
    }

  ],


  Marathi: [

    {
      title:"धडा १ - संख्या",
      subtitle:"संख्या ओळखा आणि मोजा",
      content:`
        <h2 class="chapter-title">
          🔢 धडा १ - संख्या
        </h2>

        <div class="chapter-box">

          <h4>📖 चला शिकूया</h4>

          <p>
            आपल्या आजूबाजूच्या वस्तू मोजण्यासाठी

          <div class="example">
            🍎 🍎 🍎<br>
            येथे <b>३ सफरचंदे</b> आहेत.

        </div>

        <div class="chapter-box">

          <h4>1️⃣ मोजणी</h4>

          </p>

          <div class="example">
            ⭐ ⭐ ⭐ ⭐ ⭐<br>
            येथे <b>५ तारे</b> आहेत.
          </div>

        </div>

        <div class="chapter-box">

          <h4>🔎 संख्या ओळखणे</h4>

          <p>
            प्रत्येक संख्येचा अर्थ किती वस्तू आहेत

          </p>

          <div class="example">
            🐟 🐟 🐟 🐟<br>
            येथे <b>४ मासे</b> आहेत.
          </div>

        </div>

        <div class="chapter-box">

          <h4>💡 लक्षात ठेवा</h4>

          <p>
            मोजताना प्रत्येक वस्तू फक्त एकदाच मोजा.
            घाई न करता काळजीपूर्वक मोजणी करा.
          </p>

        </div>

        <div class="quiz-section">

          <h3 class="quiz-title">
            📝 सराव प्रश्न
          </h3>

          ${makeQuiz("Marathi")}

        </div>
      `
    },


    {
      title:"धडा २ - बेरीज",
      subtitle:"संख्या जोडायला शिका",
      content:`
        <h2 class="chapter-title">
          ➕ धडा २ - बेरीज
        </h2>

        <div class="chapter-box">

          <h4>📖 बेरीज म्हणजे काय?</h4>

          <p>
            दोन किंवा अधिक वस्तूंचे समूह
            एकत्र केल्यावर एकूण किती वस्तू होतात
            हे शोधणे म्हणजे बेरीज.
          </p>

          <div class="example">
            🍎🍎 + 🍎 = 🍎🍎🍎<br>
            २ + १ = <b>३</b>
          </div>

        </div>

        <div class="chapter-box">

          <h4>🧠 सोपे उदाहरण</h4>

          <p>

      function openMediumPopup(){

  document
    .getElementById("mediumOverlay")
    .classList.add("show");

}


function selectMedium(medium){

  selectedMedium = medium;

  closePopup("mediumOverlay");

  const list =
    document.getElementById("lessonList");

  const title =
    document.getElementById("mediumTitle");

  title.innerText =
    "📚 " + medium + " Medium";

  list.innerHTML = "";

  const data =
    lessons[medium] || [];

  data.forEach(
    function(lesson,index){

      const button =
        document.createElement("button");

      button.className =
        "lesson";

      button.innerHTML = `

        <div class="lesson-icon">
          ${index + 1}
        </div>

        <div class="lesson-info">

          <strong>
            ${lesson.title}
          </strong>

          <span>
            ${lesson.subtitle}
          </span>

        </div>

      `;

      button.onclick =
        function(){

          openChapter(
            medium,
            index
          );

        };

      list.appendChild(button);

    }
  );

  document
    .getElementById("lessonOverlay")
    .classList.add("show");

}


function openChapter(
  medium,
  index
){

  const chapter =
    lessons[medium][index];

  const content =
    document.getElementById(
      "chapterContent"
    );

  content.innerHTML =
    chapter.content;

  closePopup(
    "lessonOverlay"
  );

  document
    .getElementById("chapterOverlay")
    .classList.add("show");

}


function closePopup(id){

  const popup =
    document.getElementById(id);

  if(popup){

    popup.classList.remove("show");

  }

}

      function makeQuiz(language){

  const quiz = {

    English:[
      ["How many apples are there? 🍎🍎🍎","3"],
      ["What is 1 + 1?","2"],
      ["What is 2 + 1?","3"],
      ["What is 5 - 2?","3"],
      ["Which number comes after 4?","5"],
      ["Which number comes before 3?","2"],
      ["How many stars? ⭐⭐⭐⭐","4"],
      ["What is 2 + 2?","4"],
      ["What is 3 + 1?","4"],
      ["What is 5 - 1?","4"],
      ["Which is a number?","7"],
      ["What is 1 + 2?","3"],
      ["What is 4 - 2?","2"],
      ["Which comes after 8?","9"],
      ["How many fingers are on one hand?","5"],
      ["What is 3 + 2?","5"],
      ["What is 6 - 1?","5"],
      ["Which number is smaller: 2 or 5?","2"],
      ["What is 4 + 1?","5"],
      ["What is 5 - 3?","2"]
    ],

    Hindi:[
      ["🍎🍎🍎 कितने सेब हैं?","3"],
      ["1 + 1 कितना है?","2"],
      ["2 + 1 कितना है?","3"],
      ["5 - 2 कितना है?","3"],
      ["4 के बाद कौन-सी संख्या आती है?","5"],
      ["3 से पहले कौन-सी संख्या आती है?","2"],
      ["⭐⭐⭐⭐ कितने सितारे हैं?","4"],
      ["2 + 2 कितना है?","4"],
      ["3 + 1 कितना है?","4"],
      ["5 - 1 कितना है?","4"],
      ["कौन-सी एक संख्या है?","7"],
      ["1 + 2 कितना है?","3"],
      ["4 - 2 कितना है?","2"],
      ["8 के बाद कौन-सी संख्या आती है?","9"],
      ["एक हाथ में कितनी उंगलियाँ होती हैं?","5"],
      ["3 + 2 कितना है?","5"],
      ["6 - 1 कितना है?","5"],
      ["2 और 5 में छोटी संख्या कौन-सी है?","2"],
      ["4 + 1 कितना है?","5"],
      ["5 - 3 कितना है?","2"]
    ],

    Marathi:[
      ["🍎🍎🍎 किती सफरचंदे आहेत?","3"],
      ["१ + १ किती?","2"],
      ["२ + १ किती?","3"],
      ["५ - २ किती?","3"],
      ["४ नंतर कोणती संख्या येते?","5"],
      ["३ आधी कोणती संख्या येते?","2"],
      ["⭐⭐⭐⭐ किती तारे आहेत?","4"],
      ["२ + २ किती?","4"],
      ["३ + १ किती?","4"],
      ["५ - १ किती?","4"],
      ["यापैकी संख्या कोणती?","7"],
      ["१ + २ किती?","3"],
      ["४ - २ किती?","2"],
      ["८ नंतर कोणती संख्या येते?","9"],
      ["एका हाताला किती बोटे असतात?","5"],
      ["३ + २ किती?","5"],
      ["६ - १ किती?","5"],
      ["२ आणि ५ पैकी लहान संख्या कोणती?","2"],
      ["४ + १ किती?","5"],
      ["५ - ३ किती?","2"]
    ]

  };


  const questions =
    quiz[language];

  let html = "";


  questions.forEach(
    function(item,index){

      const question =
        item[0];

      const answer =
        item[1];


      let numbers = [
        answer,
        String(
          Math.max(
            0,
            Number(answer)-1
          )
        ),
        String(
          Number(answer)+1
        ),
        String(
          Number(answer)+2
        )
      ];


      numbers =
        [...new Set(numbers)];


      numbers =
        numbers.sort(
          function(){
            return Math.random() - .5;
          }
        );


      html += `

        <div
          class="quiz-question"
          data-answer="${answer}"
        >

          <h4>
            ${index + 1}. ${question}
          </h4>

          ${numbers.map(
            function(option){

              return `

                <button
                  class="quiz-option"
                  onclick="checkAnswer(
                    this,
                    '${answer}'
                  )">

                  ${option}

                </button>

              `;

            }
          ).join("")}

        </div>

      `;

    }
  );


  return html;

      }
      function checkAnswer(
  button,
  correctAnswer
){

  const question =
    button.closest(
      ".quiz-question"
    );


  if(
    question.dataset.answered ===
    "yes"
  ){

    return;

  }


  question.dataset.answered =
    "yes";


  const options =
    question.querySelectorAll(
      ".quiz-option"
    );


  options.forEach(
    function(option){

      option.disabled = true;

    }
  );


  if(
    button.innerText.trim() ===
    String(correctAnswer)
  ){

    button.classList.add(
      "correct"
    );

    showQuizMessage(
      question,
      "🎉 बरोबर उत्तर! छान केले!"
    );

  }
  else{

    button.classList.add(
      "wrong"
    );


    options.forEach(
      function(option){

        if(
          option.innerText.trim() ===
          String(correctAnswer)
        ){

          option.classList.add(
            "correct"
          );

        }

      }
    );


    showQuizMessage(
      question,
      "💡 योग्य उत्तर: " +
      correctAnswer
    );

  }

}


function showQuizMessage(
  question,
  message
){

  const old =
    question.querySelector(
      ".quiz-message"
    );


  if(old){

    old.remove();

  }


  const messageBox =
    document.createElement(
      "div"
    );


  messageBox.className =
    "quiz-message";


  messageBox.style.marginTop =
    "10px";


  messageBox.style.padding =
    "10px";


  messageBox.style.borderRadius =
    "10px";


  messageBox.style.background =
    "#eef7ff";


  messageBox.style.color =
    "#075fc9";


  messageBox.style.fontSize =
    "13px";


  messageBox.style.fontWeight =
    "bold";


  messageBox.innerText =
    message;


  question.appendChild(
    messageBox
  );

      }
