      }

        onclick="showInfo(56,'घटाव का अभ्यास')">
        <span class="number">56</span>
        <span class="chapter-name">घटाव का अभ्यास</span>
      </button>


      <button class="chapter-item"
        onclick="showInfo(57,'आकार और माप अभ्यास')">
        <span class="number">57</span>
        <span class="chapter-name">आकार और माप अभ्यास</span>
      </button>


      <button class="chapter-item"
        onclick="showInfo(58,'पुनरावृत्ति और सराव')">
        <span class="number">58</span>
        <span class="chapter-name">पुनरावृत्ति और सराव</span>
      </button>


    </div>

  </div>

</div>



<!-- INFO POPUP -->

<div
  class="info-bg"
  id="infoPopup"
  onclick="closeInfoOutside(event)"
>

  <div class="info-popup">

    <div class="info-icon">
      📖
    </div>

    <h2 id="infoTitle">
      पाठ
    </h2>

    <p id="infoText">
      इस पाठ में आसान उदाहरणों और अभ्यास के माध्यम से गणित सीखा जाएगा।
    </p>

    <button
      class="ok-btn"
      onclick="closeInfo()"
    >
      ठीक है
    </button>

  </div>

</div>



<script>


/* BACK */

function goBack(){

  window.location.href="learn.html";

}


/* OPEN CHAPTERS */

function openChapters(){

  document
    .getElementById("chapterPopup")
    .classList.add("show");

}


/* CLOSE CHAPTERS */

function closeChapters(){

  document
    .getElementById("chapterPopup")
    .classList.remove("show");

}


/* CLOSE OUTSIDE */

function closeOutside(event){

  if(event.target.id==="chapterPopup"){

    closeChapters();

  }

}


/* CHAPTER INFO */

function showInfo(number,title){

  document
    .getElementById("infoTitle")
    .innerText =
      "पाठ " + number + " — " + title;

      document
      .getElementById("infoPopup")
      .classList.add("show");

}


/* CLOSE INFO */

function closeInfo(){

  document
    .getElementById("infoPopup")
    .classList.remove("show");

}


/* CLOSE INFO OUTSIDE */

function closeInfoOutside(event){

  if(event.target.id === "infoPopup"){

    closeInfo();

  }

}


/* ESC KEY */

document.addEventListener("keydown", function(event){

  if(event.key === "Escape"){

    closeInfo();

    closeChapters();

  }

});


</script>


</body>
</html>
