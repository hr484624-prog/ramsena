<!DOCTYPE html>
<html lang="mr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>GyanSetu - इयत्ता 1ली गणित</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#eef5ff;
  color:#172554;
}

button{
  font-family:inherit;
}

.page{
  width:100%;
  max-width:430px;
  min-height:100vh;
  margin:auto;
  background:#f7faff;
}

.header{
  background:white;
  padding:18px 16px;
  display:flex;
  align-items:center;
  gap:14px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
  position:sticky;
  top:0;
  z-index:10;
}

.back-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:14px;
  background:#eaf3ff;
  color:#1769e0;
  font-size:27px;
  cursor:pointer;
}

.header-info{
  flex:1;
}

.header-info h1{
  font-size:21px;
  color:#123b82;
}

.header-info p{
  font-size:12px;
  color:#718096;
  margin-top:4px;
}

.hero{
  margin:18px 15px;
  padding:20px;
  border-radius:24px;
  background:linear-gradient(
    135deg,
    #1769e0,
    #4d9cff
  );
  color:white;
  box-shadow:0 10px 25px rgba(23,105,224,.22);
}

.hero-icon{
  font-size:42px;
  margin-bottom:8px;
}

.hero h2{
  font-size:22px;
}

.hero p{
  margin-top:7px;
  font-size:13px;
  line-height:1.5;
}

.medium-box{
  margin:0 15px 15px;
  background:white;
  border-radius:18px;
  padding:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.medium-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.medium-icon{
  width:42px;
  height:42px;
  border-radius:13px;
  background:#eaf3ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.medium-left strong{
  display:block;
  font-size:14px;
}

.medium-left span{
  font-size:12px;
  color:#7a869a;
}

.change-btn{
  border:none;
  background:#1769e0;
  color:white;
  padding:9px 13px;
  border-radius:11px;
  font-size:12px;
  cursor:pointer;
}

.chapter-title{
  padding:5px 16px 12px;
}

.chapter-title h2{
  font-size:19px;
}

.chapter-title p{
  color:#7a869a;
  font-size:12px;
  margin-top:4px;
}

.chapters{
  padding:0 15px 30px;
}

.chapter-card{
  background:white;
  border-radius:20px;
  padding:16px;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  gap:13px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
  cursor:pointer;
  transition:.15s;
}

.chapter-card:active{
  transform:scale(.98);
}

.chapter-number{
  min-width:45px;
  height:45px;
  border-radius:14px;
  background:#eaf3ff;
  color:#1769e0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:15px;
}

.chapter-content{
  flex:1;
}

.chapter-content h3{
  font-size:15px;
  color:#173b79;
}

.chapter-content p{
  font-size:11px;
  color:#8a94a6;
  margin-top:5px;
}

.chapter-arrow{
  color:#1769e0;
  font-size:22px;
}

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(8,25,55,.62);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:100;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:430px;
  max-height:92vh;
  background:white;
  border-radius:25px;
  overflow:hidden;
  box-shadow:0 20px 50px rgba(0,0,0,.25);
  animation:popup .2s ease;
}

@keyframes popup{
  from{
    opacity:0;
    transform:scale(.94);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

.modal-header{
  padding:18px;
  background:#f7faff;
  border-bottom:1px solid #edf1f7;
  display:flex;
  align-items:center;
  gap:10px;
}

.modal-header h2{
  flex:1;
  font-size:18px;
  color:#173b79;
}

.close-btn{
  width:38px;
  height:38px;
  border:none;
  border-radius:12px;
  background:#eaf3ff;
  color:#1769e0;
  font-size:21px;
  cursor:pointer;
}

.modal-body{
  padding:18px;
  max-height:calc(92vh - 75px);
  overflow-y:auto;
}

.medium-intro{
  text-align:center;
  padding:5px 5px 18px;
}

.medium-intro .big-icon{
  font-size:48px;
}

.medium-intro h2{
  margin-top:8px;
  font-size:21px;
}

.medium-intro p{
  color:#7b8798;
  font-size:13px;
  margin-top:6px;
}

.medium-option{
  width:100%;
  border:none;
  background:#f7faff;
  border:2px solid #edf3ff;
  border-radius:18px;
  padding:15px;
  margin-bottom:11px;
  display:flex;
  align-items:center;
  gap:13px;
  cursor:pointer;
  text-align:left;
}

.medium-option:active{
  transform:scale(.98);
}

.medium-option-icon{
  width:48px;
  height:48px;
  border-radius:15px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  box-shadow:0 3px 10px rgba(0,0,0,.05);
}

.medium-option-text{
  flex:1;
}

.medium-option-text strong{
  display:block;
  font-size:16px;
  color:#173b79;
}

.medium-option-text span{
  display:block;
  font-size:11px;
  color:#8993a5;
  margin-top:4px;
}

.medium-option-arrow{
  color:#1769e0;
  font-size:21px;
}

.lesson-top{
  background:#eef6ff;
  border-radius:18px;
  padding:16px;
  margin-bottom:15px;
}

.lesson-top h3{
  color:#1769e0;
  font-size:19px;
}

.lesson-top p{
  margin-top:7px;
  font-size:13px;
  line-height:1.6;
  color:#526176;
}

.lesson-section{
  margin-bottom:17px;
}

.lesson-section h3{
  font-size:15px;
  margin-bottom:8px;
  color:#173b79;
}

.lesson-section p{
  font-size:13px;
  line-height:1.7;
  color:#526176;
}

.example-box{
  background:#f7faff;
  border-left:4px solid #1769e0;
  border-radius:12px;
  padding:13px;
  margin-top:8px;
  font-size:13px;
  line-height:1.7;
}

.quiz-heading{
  margin-top:25px;
  background:#1769e0;
  color:white;
  border-radius:18px;
  padding:16px;
}

.quiz-heading h3{
  font-size:18px;
}

.quiz-heading p{
  margin-top:5px;
  font-size:12px;
  opacity:.9;
}

.question-card{
  margin-top:14px;
  padding:15px;
  background:#f8faff;
  border:1px solid #e8effa;
  border-radius:17px;
}

.question-number{
  font-size:11px;
  color:#1769e0;
  font-weight:bold;
}

.question{
  margin-top:6px;
  font-size:14px;
  font-weight:bold;
  line-height:1.5;
  color:#263b61;
}

.option{
  width:100%;
  border:1px solid #dfe8f5;
  background:white;
  padding:11px;
  margin-top:8px;
  border-radius:12px;
  text-align:left;
  cursor:pointer;
  font-size:13px;
}

.option.selected{
  border-color:#1769e0;
  background:#eaf3ff;
  color:#1769e0;
  font-weight:bold;
}

.option.correct{
  background:#e9f9ef;
  border-color:#32a852;
  color:#18733a;
}

.option.wrong{
  background:#fff0f0;
  border-color:#e04b4b;
  color:#b52e2e;
}

.submit-btn{
  width:100%;
  border:none;
  background:#1769e0;
  color:white;
  padding:14px;
  border-radius:15px;
  font-size:15px;
  font-weight:bold;
  margin-top:18px;
  cursor:pointer;
}

.score-box{
  display:none;
  margin-top:15px;
  padding:18px;
  text-align:center;
  border-radius:18px;
  background:#eef8ff;
}

.score-box.show{
  display:block;
}

.score-big{
  font-size:35px;
  font-weight:bold;
  color:#1769e0;
}

.score-box p{
  margin-top:6px;
  font-size:13px;
  color:#59677b;
}

.empty{
  padding:30px;
  text-align:center;
  color:#7d899c;
}

      </style>
      </head>

<div class="page">

  <div class="header">

    <button
      class="back-btn"
      onclick="goBack()">
      ‹
    </button>

    <div class="header-info">

      <h1>इयत्ता 1ली गणित</h1>

      <p>GyanSetu • Smart Learning</p>

    </div>

  </div>

    </div>

  </div>

    <div class="medium-left">

      <div class="medium-icon">

      </div>

  </div>

</div>


<div

  id="modalBg">

  <div class="modal">

    <div class="modal-header">

      <h2 id="modalTitle">
        GyanSetu
      </h2>

      <button
        class="close-btn"

</div>

};

      mr:"संख्या ओळखणे आणि वाचणे",

    explanation:{
      mr:"संख्या म्हणजे वस्तू किती आहेत हे सांगण्यासाठी वापरले जाणारे चिन्ह. आपण 1, 2, 3, 4, 5 अशा संख्या ओळखतो.",
      hi:"संख्या यह बताने के लिए उपयोग की जाती हैं कि कितनी वस्तुएँ हैं। हम 1, 2, 3, 4, 5 जैसी संख्याओं को पहचानते हैं।",
      en:"Numbers are used to tell us how many objects there are. We learn to recognise numbers such as 1, 2, 3, 4 and 5."
    },

    example:{
      mr:"🍎 🍎 🍎 = 3 सफरचंद",

  {

    explanation:{
      mr:"वस्तू एक-एक करून मोजल्यावर आपल्याला त्या वस्तूंची संख्या कळते.",
      hi:"वस्तुओं को एक-एक करके गिनने से हमें उनकी संख्या पता चलती है।",
      en:"By counting objects one by one, we can find their total number."

    description:{

      en:"Understanding number order"

    explanation:{

  {

      function openMediumPopup(){

    .innerText="🌐 Medium निवडा";

  document.getElementById("modalBody")

function selectMedium(medium){

  currentMedium=medium;

  document.getElementById("currentMedium")
    .innerText=mediumNames[medium];

  renderChapters();

  closeModal();

}


function renderChapters(){

  const box=document.getElementById("chapters");

  if(!currentMedium){

    box.innerHTML=`

      <div class="empty">

        🌐<br><br>

        प्रथम Medium निवडा.

      </div>

    `;

    return;
  }

  box.innerHTML="";


  chaptersData.forEach(
    function(chapter,index){

      const card=document.createElement("div");

      card.className="chapter-card";

      card.onclick=function(){

        openChapter(chapter);

      };


      card.innerHTML=`

        <div class="chapter-number">

          ${String(index+1).padStart(2,"0")}

        </div>


        <div class="chapter-content">

          <h3>
            ${chapter.icon}
            ${chapter.title[currentMedium]}
          </h3>

          <p>
            ${chapter.description[currentMedium]}
          </p>

        </div>


        <div class="chapter-arrow">
          ›
        </div>

      `;

      box.appendChild(card);

    }
  );

}


function openChapter(chapter){

  selectedAnswers={};

  document.getElementById("modalTitle")
    .innerText=
    chapter.icon+" "+
    chapter.title[currentMedium];


  let html=`

    <div class="lesson-top">

      <h3>
        ${chapter.title[currentMedium]}
      </h3>

      <p>
        ${chapter.explanation[currentMedium]}
      </p>

    </div>


    <div class="lesson-section">

      <h3>📖 सोप्या भाषेत</h3>

      <p>
        ${chapter.explanation[currentMedium]}
      </p>

    </div>


    <div class="lesson-section">

      <h3>💡 उदाहरण</h3>

      <div class="example-box">

        ${chapter.example[currentMedium]}

      </div>

    </div>


    <div class="lesson-section">

      <h3>⭐ लक्षात ठेवा</h3>

      <p>
        गणित शिकताना वस्तू मोजा,
        चित्रे वापरा आणि उदाहरणे
        स्वतः सोडवण्याचा प्रयत्न करा.
      </p>

    </div>


    <div class="quiz-heading">

      <h3>📝 20 प्रश्नांची Quiz</h3>

      <p>
        प्रत्येक प्रश्नाचे योग्य उत्तर निवडा.
      </p>

    </div>

  `;


  const questions=quizQuestions[currentMedium];


  questions.forEach(
    function(item,index){

      html+=`

        <div
          class="question-card"
          data-question="${index}">

          <div class="question-number">

            प्रश्न ${index+1} / 20

          </div>


          <div class="question">

            ${item[0]}

          </div>


          <div>

            ${item[1].map(
              function(option,optIndex){

                return `

                  <button
                    class="option"
                    data-option="${optIndex}"
                    onclick="
                      chooseOption(
                        ${index},
                        ${optIndex}
                      )
                    ">

                    ${option}

                  </button>

                `;

              }
            ).join("")}

          </div>

        </div>

      `;

    }
  );


  html+=`

    <button
      class="submit-btn"
      onclick="checkQuiz()">

      ✅ Quiz Submit करा

    </button>


    <div
      class="score-box"
      id="scoreBox">

      <div
        class="score-big"
        id="scoreText">
      </div>

      <p
        id="scoreMessage">
      </p>

    </div>

  `;


  document.getElementById("modalBody")
    .innerHTML=html;


  document.getElementById("modalBg")
    .classList.add("show");

}


function chooseOption(
  questionIndex,
  optionIndex
){

  selectedAnswers[questionIndex]=
    optionIndex;


  const card=document.querySelector(
    '[data-question="'+
    questionIndex+
    '"]'
  );


  const options=
    card.querySelectorAll(".option");


  options.forEach(
    function(btn){

      btn.classList.remove("selected");

    }
  );


  options[optionIndex]
    .classList.add("selected");

}


function checkQuiz(){

  const questions=
    quizQuestions[currentMedium];

  let score=0;


  questions.forEach(
    function(item,index){

      const card=document.querySelector(
        '[data-question="'+
        index+
        '"]'
      );


      const options=
        card.querySelectorAll(".option");


      const correct=item[2];


      options[correct]
        .classList.add("correct");


      if(
        selectedAnswers[index] ===
        correct
      ){

        score++;

      }
      else if(
        selectedAnswers[index] !==
        undefined
      ){

        options[
          selectedAnswers[index]
        ].classList.add("wrong");

      }

    }
  );


  const scoreBox=
    document.getElementById("scoreBox");

  const scoreText=
    document.getElementById("scoreText");

  const scoreMessage=
    document.getElementById("scoreMessage");


  scoreText.innerText=
    score+" / 20";


  if(score>=18){

    scoreMessage.innerText=
      "🏆 उत्कृष्ट! खूप छान!";

  }
  else if(score>=14){

    scoreMessage.innerText=
      "🌟 खूप छान! अजून थोडा सराव कर.";

  }
  else if(score>=10){

    scoreMessage.innerText=
      "👍 चांगला प्रयत्न!";

  }
  else{

    scoreMessage.innerText=
      "💪 पुन्हा सराव कर आणि Quiz दे.";

  }


  scoreBox.classList.add("show");


  scoreBox.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

}


function closeModal(){

  document.getElementById("modalBg")
    .classList.remove("show");

}


function goBack(){

  window.location.href="learn.html";

}


document.getElementById("modalBg")

    "click",
    function(event){

      if(event.target===this){

        closeModal();

      }

    }
  );
