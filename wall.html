<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAMSENA WALL</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#080808;
  color:white;
  padding-bottom:80px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  background:#111;
  border-bottom:3px solid #ff7300;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:28px;
  font-weight:bold;
  color:#ff7800;
}

.brand span{
  font-size:42px;
}

.top-icons{
  display:flex;
  gap:20px;
  font-size:28px;
}

.title{
  padding:28px 25px 18px;
  color:#ff7800;
  font-size:30px;
}

.stories{
  display:flex;
  gap:22px;
  overflow-x:auto;
  padding:15px 28px 25px;
  border-bottom:1px solid #222;
}

.story{
  min-width:105px;
  text-align:center;
}

.story-circle{
  width:100px;
  height:100px;
  border:4px solid #ff7800;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#222;
  font-size:42px;
  margin:auto;
}

.story-name{
  margin-top:10px;
  font-size:17px;
}

.create-box{
  margin:30px;
  padding:20px;
  background:#151515;
  border:2px solid #292929;
  border-radius:25px;
}

.create-input{
  width:100%;
  min-height:65px;
  border-radius:22px;
  border:2px solid #333;
  background:#222;
  color:white;
  padding:18px;
  font-size:17px;
  outline:none;
}

.create-btn{
  margin-top:15px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:15px;
  background:#ff7300;
  color:white;
  font-size:18px;
  font-weight:bold;
}

.post{
  margin:25px 30px;
  background:#111;
  border:2px solid #292929;
  border-radius:25px;
  overflow:hidden;
}

.post-head{
  display:flex;
  align-items:center;
  gap:12px;
  padding:18px;
}

.avatar{
  width:52px;
  height:52px;
  border-radius:50%;
  background:#ff7300;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
}

.post-name{
  font-size:19px;
  font-weight:bold;
}

.post-time{
  color:#888;
  font-size:13px;
  margin-top:4px;
}

.post-text{
  padding:0 20px 20px;
  font-size:20px;
  line-height:1.5;
}

.post-actions{
  display:flex;
  justify-content:space-around;
  border-top:1px solid #292929;
  padding:15px;
}

.action{
  border:none;
  background:none;
  color:white;
  font-size:18px;
}

.action.liked{
  color:#ff7300;
}

.empty{
  text-align:center;
  color:#777;
  padding:30px;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:#111;
  border-top:2px solid #292929;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:100;
}

.bottom-item{
  text-align:center;
  font-size:14px;
}

.bottom-icon{
  display:block;
  font-size:27px;
  margin-bottom:3px;
}

@media(max-width:500px){
  .brand{
    font-size:25px;
  }

  .top-icons{
    font-size:23px;
    gap:12px;
  }

  .title{
    font-size:27px;
  }

  .create-box,
  .post{
    margin-left:18px;
    margin-right:18px;
  }
}
</style>
</head>

<body>

<div class="topbar">
  <div class="brand">
    <span>🐯</span>
    RAMSENA
  </div>

  <div class="top-icons">
    <span>🔍</span>
    <span>♡</span>
    <span>✈️</span>
  </div>
</div>

<div class="title">
  RAMSENA WALL
</div>

<div class="stories">

  <div class="story">
    <div class="story-circle">＋</div>
    <div class="story-name">Your story</div>
  </div>

  <div class="story">
    <div class="story-circle">🐯</div>
    <div class="story-name">Hitesh</div>
  </div>

  <div class="story">
    <div class="story-circle">🏏</div>
    <div class="story-name">Krishna</div>
  </div>

  <div class="story">
    <div class="story-circle">⚡</div>
    <div class="story-name">Chetan</div>
  </div>

  <div class="story">
    <div class="story-circle">🔥</div>
    <div class="story-name">Ganesh</div>
  </div>

</div>

<div class="create-box">

  <input
    id="postInput"
    class="create-input"
    type="text"
    placeholder="What's on your mind, RAMSENA member?"
  >

  <button class="create-btn" onclick="createPost()">
    🐯 POST TO RAMSENA WALL
  </button>

</div>

<div id="posts">

  <div class="post">

    <div class="post-head">
      <div class="avatar">🐯</div>

      <div>
        <div class="post-name">RAMSENA XI</div>
        <div class="post-time">Official Team • Just now</div>
      </div>
    </div>

    <div class="post-text">
      🐯 ONE TEAM • ONE PRIDE • ONE FAMILY
      <br><br>
      Welcome to the official RAMSENA WALL 🔥
    </div>

    <div class="post-actions">
      <button class="action" onclick="likePost(this)">
        ❤️ Like
      </button>

      <button class="action" onclick="commentPost()">
        💬 Comment
      </button>

      <button class="action" onclick="sharePost()">
        📤 Share
      </button>
    </div>

  </div>

</div>

<div class="bottom">

  <div class="bottom-item">
    <span class="bottom-icon">🏠</span>
    Home
  </div>

  <div class="bottom-item" onclick="location.href='messages.html'">
    <span class="bottom-icon">💬</span>
    Messages
  </div>

  <div class="bottom-item">
    <span class="bottom-icon">🎬</span>
    Reels
  </div>

  <div class="bottom-item" onclick="location.href='profile.html'">
    <span class="bottom-icon">👤</span>
    Profile
  </div>

</div>

<script>

function createPost(){

  const input = document.getElementById("postInput");
  const text = input.value.trim();

  if(text === ""){
    alert("काहीतरी लिहा 🐯");
    return;
  }

  const post = document.createElement("div");
  post.className = "post";

  post.innerHTML = `
    <div class="post-head">
      <div class="avatar">🐯</div>

      <div>
        <div class="post-name">RAMSENA MEMBER</div>
        <div class="post-time">Just now</div>
      </div>
    </div>

    <div class="post-text">
      ${escapeHtml(text)}
    </div>

    <div class="post-actions">

      <button class="action" onclick="likePost(this)">
        ❤️ Like
      </button>

      <button class="action" onclick="commentPost()">
        💬 Comment
      </button>

      <button class="action" onclick="sharePost()">
        📤 Share
      </button>

    </div>
  `;

  document.getElementById("posts").prepend(post);

  input.value = "";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

function likePost(button){

  button.classList.toggle("liked");

  if(button.classList.contains("liked")){
    button.innerHTML = "🧡 Liked";
  }else{
    button.innerHTML = "❤️ Like";
  }
}

function commentPost(){

  const comment = prompt("तुमची comment लिहा 💬");

  if(comment && comment.trim() !== ""){
    alert("Comment added! 🐯");
  }
}

function sharePost(){

  if(navigator.share){

    navigator.share({
      title:"RAMSENA WALL",
      text:"🐯 RAMSENA XI — ONE TEAM • ONE PRIDE • ONE FAMILY"
    });

  }else{

    alert("RAMSENA WALL 🔥 Share करा!");

  }
}

function focusPost(){

  document.getElementById("postInput").focus();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

function escapeHtml(text){

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}
function toggleFollow(button, playerName){
  let following = JSON.parse(localStorage.getItem("ramsenaFollowing") || "{}");

  if(following[playerName]){
    delete following[playerName];
    button.innerText = "➕ FOLLOW";
    button.style.background = "#ff7300";
  }else{
    following[playerName] = true;
    button.innerText = "✓ FOLLOWING";
    button.style.background = "#555";
  }

  localStorage.setItem("ramsenaFollowing", JSON.stringify(following));
}

function loadFollowStatus(button, playerName){
  let following = JSON.parse(localStorage.getItem("ramsenaFollowing") || "{}");

  if(following[playerName]){
    button.innerText = "✓ FOLLOWING";
    button.style.background = "#555";
  }
  }
</script>

</body>
  </html>
