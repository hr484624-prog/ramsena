<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAMSENA WALL</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#080808;
  color:white;
  padding-bottom:70px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:10;
  height:65px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:#111;
  border-bottom:2px solid #ff7300;
}

.logo{
  font-size:25px;
  font-weight:bold;
  color:#ff7800;
}

.icons{
  display:flex;
  gap:18px;
  font-size:23px;
}

.stories{
  display:flex;
  gap:15px;
  overflow-x:auto;
  padding:16px;
  background:#101010;
}

.story{
  min-width:68px;
  text-align:center;
  font-size:12px;
}

.story-img{
  width:60px;
  height:60px;
  border-radius:50%;
  border:3px solid #ff7300;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  margin:auto auto 5px;
  background:#222;
}

.add-story{
  border:3px dashed #ff7300;
}

.create{
  margin:15px;
  padding:15px;
  border:1px solid #333;
  border-radius:15px;
  background:#121212;
}

.create-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#ff7300;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

.create button{
  flex:1;
  background:#222;
  border:1px solid #444;
  border-radius:25px;
  padding:12px;
  color:#aaa;
  text-align:left;
  font-size:15px;
}

.post{
  margin:15px;
  background:#111;
  border:1px solid #292929;
  border-radius:15px;
  overflow:hidden;
}

.post-head{
  display:flex;
  align-items:center;
  padding:12px;
  gap:10px;
}

.user{
  font-weight:bold;
}

.time{
  color:#777;
  font-size:12px;
}

.post-text{
  padding:0 14px 12px;
  line-height:1.5;
}

.post-photo{
  width:100%;
  min-height:230px;
  background:linear-gradient(135deg,#1b1b1b,#302010);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:60px;
}

.actions{
  display:flex;
  justify-content:space-around;
  padding:13px 5px;
  border-top:1px solid #292929;
  font-size:22px;
}

.actions button{
  background:none;
  border:0;
  color:white;
  font-size:22px;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:62px;
  background:#111;
  border-top:1px solid #333;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.bottom button{
  background:none;
  border:0;
  color:white;
  font-size:22px;
}

.bottom span{
  display:block;
  font-size:10px;
  margin-top:3px;
}

.title{
  padding:15px 15px 5px;
  font-size:20px;
  color:#ff7800;
}
</style>
</head>

<body>

<header class="topbar">
  <div class="logo">🐯 RAMSENA</div>

  <div class="icons">
    <span>🔍</span>
    <span>♡</span>
    <span>✈️</span>
  </div>
</header>

<div class="title">RAMSENA WALL</div>

<section class="stories">

  <div class="story">
    <div class="story-img add-story">＋</div>
    Your story
  </div>

  <div class="story">
    <div class="story-img">🐯</div>
    Hitesh
  </div>

  <div class="story">
    <div class="story-img">🏏</div>
    Krishna
  </div>

  <div class="story">
    <div class="story-img">⚡</div>
    Chetan
  </div>

  <div class="story">
    <div class="story-img">🔥</div>
    Ganesh
  </div>

  <div class="story">
    <div class="story-img">🏆</div>
    Rupesh
  </div>

</section>

<section class="create">

  <div class="create-row">

    <div class="avatar">🐯</div>

    <button onclick="createPost()">
      What's on your mind, RAMSENA member?
    </button>

  </div>

</section>

<article class="post">

  <div class="post-head">

    <div class="avatar">🐯</div>

    <div>
      <div class="user">RAMSENA XI</div>
      <div class="time">Official Team • Just now</div>
    </div>

  </div>

  <div class="post-text">
    🐯 ONE TEAM • ONE PRIDE • ONE FAMILY
    <br><br>
    Welcome to the official RAMSENA WALL 🔥
  </div>

  <div class="post-photo">
    🐯
  </div>

  <div class="actions">
    <button onclick="likePost(this)">♡</button>
    <button onclick="commentPost()">💬</button>
    <button onclick="sharePost()">↗️</button>
    <button>🔖</button>
  </div>

</article>

<article class="post">

  <div class="post-head">

    <div class="avatar">🏆</div>

    <div>
      <div class="user">RUPESH</div>
      <div class="time">RAMSENA XI • Today</div>
    </div>

  </div>

  <div class="post-text">
    🔥 RAMSENA XI — आजचा स्टार खेळाडू 🏆
  </div>

  <div class="actions">
    <button onclick="likePost(this)">♡</button>
    <button onclick="commentPost()">💬</button>
    <button onclick="sharePost()">↗️</button>
    <button>🔖</button>
  </div>

</article>

<nav class="bottom">

  <button onclick="goHome()">
    🏠
    <span>Home</span>
  </button>

  <button onclick="createPost()">
    ➕
    <span>Create</span>
  </button>

  <button onclick="alert('RAMSENA Reels coming soon 🔥')">
    🎬
    <span>Reels</span>
  </button>

  <button onclick="profile()">
    👤
    <span>Profile</span>
  </button>

</nav>

<script>

function createPost(){
  alert("Create Post — पुढच्या step मध्ये आपण हे खरं बनवू 🔥");
}

function likePost(button){
  if(button.innerText === "♡"){
    button.innerText = "❤️";
  }else{
    button.innerText = "♡";
  }
}

function commentPost(){
  alert("Comments — पुढच्या step मध्ये जोडू 💬");
}

function sharePost(){
  alert("Share — पुढच्या step मध्ये जोडू ↗️");
}

function profile(){
  alert("RAMSENA Profile — पुढच्या step मध्ये तयार करू 👤");
}

function goHome(){
  window.location.href="index.html";
}

</script>

</body>
  </html>
