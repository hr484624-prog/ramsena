<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GyanSetu - 12th</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f8fc;
      color: #18264d;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: auto;
      padding-bottom: 30px;
    }

    /* Header */

    .header {
      background: white;
      padding: 18px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }

    .top {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .back {
      font-size: 30px;
      cursor: pointer;
    }

    .title {
      font-size: 23px;
      font-weight: 800;
    }

    /* Intro */

    .intro {
      margin: 18px 16px;
      padding: 20px;
      background: linear-gradient(135deg, #fff0dc, #fffaf4);
      border: 1px solid #ffe0bd;
      border-radius: 22px;
      text-align: center;
    }

    .intro-icon {
      font-size: 42px;
    }

    .intro h2 {
      margin-top: 8px;
      font-size: 21px;
    }

    .intro p {
      margin-top: 6px;
      color: #777;
      font-size: 13px;
    }

    /* Subjects */

    .section-title {
      margin: 24px 16px 14px;
      font-size: 20px;
      font-weight: 800;
    }

    .subjects {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 0 16px;
    }

    .subject {
      width: 100%;
      height: 135px;
      background: white;
      border-radius: 18px;
      padding: 17px;
      box-shadow: 0 5px 18px rgba(0,0,0,.06);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .subject:active {
      transform: scale(.97);
    }

    .icon {
      font-size: 31px;
      margin-bottom: 10px;
    }

    .subject h3 {
      font-size: 15px;
      font-weight: 800;
    }

    .subject p {
      margin-top: 5px;
      color: #777;
      font-size: 11px;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- Header -->

  <div class="header">

    <div class="top">

      <div class="back" onclick="goBack()">‹</div>

      <div class="title">
        12th Standard
      </div>

    </div>

  </div>


  <!-- Intro -->

  <div class="intro">

    <div class="intro-icon">🎓</div>

    <h2>12th Standard</h2>

    <p>
      तुमचा विषय निवडा आणि अभ्यास सुरू करा 📚
    </p>

  </div>


  <!-- Subjects -->

  <div class="section-title">
    📖 Subjects
  </div>


  <div class="subjects">

<div class="subject" onclick="openMath()">
  <div class="icon">🔢</div>
  <h3>Mathematics</h3>
  <p>12th Mathematics</p>
</div>


    <div class="subject" onclick="openPhysics()">
  <div class="icon">⚛️</div>
  <h3>Physics</h3>
  <p>12th Physics</p>
    </div>


    <div class="subject">
      <div class="icon">🧪</div>
      <h3>Chemistry</h3>
      <p>12th Chemistry</p>
    </div>


    <div class="subject">
      <div class="icon">🧬</div>
      <h3>Biology</h3>
      <p>12th Biology</p>
    </div>


  </div>

</div>


<script>

function goBack() {
  window.location.href = "learn.html";
}
function openMath() {
  window.location.href = "college-12-math.html";
  }
function openPhysics() {
  window.location.href = "college-12-physics.html";
      }
</script>

</body>
  </html>
