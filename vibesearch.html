<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Search - GyanSetu</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#000;--tx:#f5f5f5;--mu:#a8a8a8;--ln:#262626;--cd:#1f1f1f;--bl:#0095f6;--ig:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)}
[data-theme=light]{--bg:#fff;--tx:#262626;--mu:#737373;--ln:#dbdbdb;--cd:#efefef}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,Roboto,Arial,sans-serif;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:var(--tx);outline:0}
svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.wrap{max-width:600px;margin:auto}
.top{position:sticky;top:0;z-index:50;background:var(--bg);padding:10px 12px 0}
.sb{display:flex;gap:10px;align-items:center}
.sb .in{flex:1;display:flex;align-items:center;gap:8px;background:var(--cd);border-radius:12px;padding:0 12px}
.sb input{flex:1;padding:11px 0;border:0;background:none;font-size:16px;min-width:0}.sb input::placeholder{color:var(--mu)}
.sb .in svg{width:19px;height:19px;color:var(--mu)}.sb .x{display:none;color:var(--mu);font-size:16px}
.sb .cn{display:none;font-weight:600;font-size:14px}
.seg{display:flex;margin-top:8px;border-bottom:1px solid var(--ln)}
.seg button{flex:1;padding:10px 0;font-weight:600;font-size:14px;color:var(--mu);border-bottom:1.5px solid transparent;margin-bottom:-1px}.seg button.on{color:var(--tx);border-color:var(--tx)}
.chips{display:flex;gap:8px;padding:10px 12px;overflow-x:auto}.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 14px;border-radius:9px;background:var(--cd);font-size:13px;font-weight:600}.chip.on{background:var(--tx);color:var(--bg)}
.chip.tg{color:#4aa8ff}
.g3{--w:min(100vw,600px);display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:calc(var(--w)/3*1.3);grid-auto-flow:dense;gap:2px}
.gi{position:relative;background:#111;overflow:hidden;cursor:pointer}.gi.big{grid-column:span 2;grid-row:span 2}
.gi video{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block}
.gi .pi{position:absolute;top:6px;right:6px;filter:drop-shadow(0 1px 3px #000);color:#fff}.gi .pi svg{width:18px;height:18px;fill:#fff}
.gi span{position:absolute;left:6px;bottom:5px;color:#fff;font-size:12px;font-weight:600;text-shadow:0 1px 3px #000}
.recent{padding:4px 14px}.recent h4{display:flex;justify-content:space-between;font-size:15px;margin:10px 0}.recent h4 button{color:var(--bl);font-size:13px;font-weight:600}
.rc{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer}.rc .ci{width:40px;height:40px;border-radius:50%;border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;color:var(--mu)}.rc .ci svg{width:19px;height:19px}.rc span{flex:1}.rc i{color:var(--mu);font-style:normal;padding:4px}
.pr{display:flex;align-items:center;gap:12px;padding:9px 14px}
.av{border-radius:50%;background:linear-gradient(135deg,#ff28cf,#416cff);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0}
.pr .m{flex:1;min-width:0}.pr .m b{display:block;font-size:14.5px}.pr .m small{color:var(--mu);font-size:12.5px}
.fb{padding:7px 16px;border-radius:8px;background:var(--bl);color:#fff;font-weight:600;font-size:13px}.fb.on{background:var(--cd);color:var(--tx)}
.hd{padding:12px 14px 4px;font-weight:700;font-size:15px}
.empty{text-align:center;color:var(--mu);padding:70px 24px;line-height:1.7}
.ov{position:fixed;inset:0;z-index:300;background:var(--bg);display:none;overflow-y:auto}.ov.show{display:block}
.ptop{position:sticky;top:0;z-index:5;height:50px;display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--bg);border-bottom:1px solid var(--ln);font-weight:700}
#mv{width:100%;max-height:68vh;background:#000;display:block}
.ph{display:flex;align-items:center;gap:10px;padding:10px 12px}.ph b{flex:1;font-size:14px}
.act{display:flex;gap:18px;padding:6px 12px}.act button{display:flex;align-items:center;gap:6px}.act .on svg{fill:#ff3040;stroke:#ff3040}.act em{font-style:normal;font-size:14px}
.cap{padding:2px 12px 14px;font-size:14px;line-height:1.45}.cap span{color:var(--mu);display:block}
.go{display:block;margin:6px 12px;padding:11px;border-radius:10px;background:var(--bl);color:#fff;font-weight:700;text-align:center;width:calc(100% - 24px)}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--cd);color:var(--tx);padding:10px 18px;border-radius:12px;display:none;z-index:900;font-size:13px;max-width:90%;text-align:center}.toast.show{display:block}

/* LIQUID GLASS NAV */
.nav{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,420px);height:64px;padding:6px;display:flex;align-items:center;border-radius:34px;z-index:100;isolation:isolate;
 background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.05));
 -webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);
 border:1px solid rgba(255,255,255,.24);
 box-shadow:0 14px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.07),inset 0 0 18px rgba(255,255,255,.05)}
.nav::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 100% at 15% 0%,rgba(255,255,255,.3),transparent 52%);opacity:.55;pointer-events:none;z-index:0}
.nav button{position:relative;z-index:2;flex:1;height:100%;display:flex;align-items:center;justify-content:center;color:var(--tx);opacity:.72;transition:opacity .25s,transform .2s;border-radius:28px}
.nav button:active{transform:scale(.88)}
.nav button.on{opacity:1}.nav button.on svg{stroke-width:2.6}
.nav .ind{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:28px;z-index:1;pointer-events:none;
 background:linear-gradient(180deg,rgba(255,255,255,.36),rgba(255,255,255,.12));
 border:1px solid rgba(255,255,255,.3);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -6px 12px rgba(255,255,255,.06),0 4px 14px rgba(0,0,0,.28);
 transition:transform .5s cubic-bezier(.34,1.45,.5,1),width .5s cubic-bezier(.34,1.45,.5,1)}
[data-theme=light] .nav{background:linear-gradient(135deg,rgba(255,255,255,.8),rgba(255,255,255,.5));border-color:rgba(255,255,255,.9);box-shadow:0 12px 30px rgba(0,0,0,.16),inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.05)}
[data-theme=light] .nav::before{opacity:.35}
[data-theme=light] .nav .ind{background:linear-gradient(180deg,rgba(0,0,0,.09),rgba(0,0,0,.04));border-color:rgba(0,0,0,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 3px 10px rgba(0,0,0,.1)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.nav{background:rgba(28,28,30,.92)}[data-theme=light] .nav{background:rgba(255,255,255,.95)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="sb"><div class="in"><span id="sI"></span><input id="q" placeholder="Search videos, #tags, people" autocomplete="off" oninput="onQ()" onfocus="focusQ(1)" onkeydown="if(event.key==='Enter')commit()"><button class="x" id="qx" onclick="clearQ()">✕</button></div><button class="cn" id="cn" onclick="focusQ(0)">Cancel</button></div>
    <div class="seg" id="seg"></div>
  </div>
  <div class="chips" id="chips"></div>
  <div id="res"></div>
</div>
<nav class="nav" id="nav"></nav>

<div class="ov" id="pl">
  <div class="ptop"><button onclick="closePlayer()" id="pBack"></button>Video</div>
  <video id="mv" controls playsinline></video>
  <div id="pInfo"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const sb=supabase.createClient("https://eqglttfffhvoyvrclzse.supabase.co","sb_publishable_rR4xxl0dW5DJrhhjqiFHLw_uJ-HakAb");
const $=id=>document.getElementById(id);
const esc=t=>{const d=document.createElement("div");d.textContent=t??"";return d.innerHTML};
const escA=t=>String(t??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/'/g,"&#39;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function lsGet(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2400)}
document.documentElement.dataset.theme=lsGet("gs_theme","dark");
const P={home:'<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/>',reel:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M3 9h18M9 3l3 6M15 3l3 6"/><path d="M10 13l5 3-5 3z"/>',heart:'<path d="M12 21s-8-5.5-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.5-8 11-8 11z"/>',send:'<path d="M22 3L9.500 13.500M22 3l-7 18-5.500-7.500L2 9z"/>',back:'<path d="M15 5l-7 7 7 7"/>'};
const ic=n=>`<svg viewBox="0 0 24 24">${P[n]}</svg>`;
const ava=(n,s)=>`<div class="av" style="width:${s}px;height:${s}px;font-size:${s*.42}px">${esc(String(n||"?")[0].toUpperCase())}</div>`;
$("sI").innerHTML=ic("search");$("pBack").innerHTML=ic("back");

let me=null,myName="?",vids=[],people=[],FL=[],likeCount={},myLikes=new Set(),saved=new Set(lsGet("gs_saved_videos",[]).map(String));
let Q="",MODE="explore",KIND="videos",REC=lsGet("gs_recent",[]),focused=false,cur=null,likesReady=true,followReady=true;
function buildNav(){$("nav").innerHTML=`<button onclick="location.href='timepass.html'">${ic("home")}</button><button onclick="location.href='reels.html'">${ic("reel")}</button><button onclick="location.href='Junkfile.html'">${ic("send")}</button><button class="on">${ic("search")}</button><button onclick="location.href='insta.html'">${ava(myName,26)}</button>`}
buildNav();

/* LOAD */
async function load(){
  const {data:u}=await sb.auth.getUser();me=u?.user||null;
  const [v,l,f,p]=await Promise.all([sb.from("Videos").select("*").order("created_at",{ascending:false}),sb.from("VideoLikes").select("video_id,user_id"),sb.from("Follows").select("follower_id,following_id"),sb.from("Profiles").select("id,username,full_name,school,city").limit(300)]);
  if(v.error){$("res").innerHTML=`<div class="empty">Load झाले नाही.<br><small>${esc(v.error.message)}</small></div>`;return}
  vids=v.data||[];likesReady=!l.error;followReady=!f.error;FL=f.data||[];people=p.data||[];
  (l.data||[]).forEach(r=>{const k=String(r.video_id);likeCount[k]=(likeCount[k]||0)+1;if(me&&r.user_id===me.id)myLikes.add(k)});
  if(me){const mp=people.find(x=>x.id===me.id);myName=mp?.username||me.user_metadata?.username||(me.email||"?").split("@")[0];buildNav()}
  render();
}
const isF=id=>!!me&&FL.some(f=>f.follower_id===me.id&&f.following_id===id);
const lc=v=>likeCount[String(v.id)]||0;
const T=v=>new Date(v.created_at||0).getTime();

/* TAGS */
function tags(){const c={};vids.forEach(v=>(`${v.title||""} ${v.description||""}`.match(/#[^\s#]+/g)||[]).forEach(t=>{t=t.toLowerCase();c[t]=(c[t]||0)+1}));return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>x[0])}

/* RENDER */
function drawTop(){
  $("seg").innerHTML=[["videos","Videos"],["people","People"]].map(k=>`<button class="${KIND===k[0]?"on":""}" onclick="KIND='${k[0]}';render()">${k[1]}</button>`).join("");
  $("chips").style.display=KIND==="videos"&&!focused?"flex":"none";
  $("chips").innerHTML=[["explore","✨ Explore"],["liked","🔥 Most liked"],["latest","🆕 Latest"],["oldest","🕰 Oldest"],["mine","🙋 My videos"],["saved","🔖 Saved"]].map(c=>`<button class="chip ${MODE===c[0]?"on":""}" onclick="MODE='${c[0]}';render()">${c[1]}</button>`).join("")+tags().map(t=>`<button class="chip tg" onclick="setQ('${escA(t)}')">${esc(t)}</button>`).join("");
  $("qx").style.display=Q?"block":"none";$("cn").style.display=focused?"block":"none";
}
function render(){
  drawTop();const q=Q.trim().toLowerCase();
  if(focused&&!q){recentView();return}
  if(KIND==="people"){peopleView(q);return}
  let L=vids.slice();
  if(q)L=L.filter(v=>[v.title,v.description,v.username].some(x=>String(x||"").toLowerCase().includes(q)));
  if(MODE==="saved")L=L.filter(v=>saved.has(String(v.id)));
  if(MODE==="mine")L=L.filter(v=>me&&v.user_id===me.id);
  if(MODE==="oldest")L.sort((a,b)=>T(a)-T(b));
  else if(MODE==="liked")L.sort((a,b)=>lc(b)-lc(a)||T(b)-T(a));
  else if(MODE==="explore"&&!q)L.sort((a,b)=>(lc(b)*3+T(b)/1e11)-(lc(a)*3+T(a)/1e11));
  else L.sort((a,b)=>T(b)-T(a));
  const big=MODE==="explore"&&!q;
  $("res").innerHTML=L.length?`<div class="g3">`+L.map((v,i)=>`<div class="gi ${big&&i%9===1?"big":""}" onclick="openPlayer('${escA(v.id)}')"><video src="${escA(v.video_url)}#t=0.5" preload="metadata" muted playsinline></video><span class="pi">${ic("reel")}</span><span>♥ ${lc(v)}</span></div>`).join("")+`</div>`:'<div class="empty">🔍 काहीही सापडले नाही</div>';
}
function peopleView(q){
  let L=people.filter(p=>!me||p.id!==me.id);
  if(q)L=L.filter(p=>[p.username,p.full_name,p.school,p.city].some(x=>String(x||"").toLowerCase().includes(q)));
  else L=L.filter(p=>!isF(p.id));
  const cnt=id=>FL.filter(f=>f.following_id===id).length;
  $("res").innerHTML=(q?"":'<div class="hd">तुम्हाला माहीत असतील असे लोक</div>')+(L.length?L.map(p=>`<div class="pr">${ava(p.username||p.full_name,48)}<div class="m"><b>${esc(p.username||p.full_name||"User")}</b><small>${esc([p.full_name&&p.username?p.full_name:"",p.school||p.city||""].filter(Boolean).join(" • ")||cnt(p.id)+" followers")}</small></div><button class="fb ${isF(p.id)?"on":""}" data-f="${escA(p.id)}" onclick="toggleFollow('${escA(p.id)}')">${isF(p.id)?"Following":"Follow"}</button></div>`).join(""):'<div class="empty">कोणी सापडले नाही</div>');
}
function recentView(){
  $("res").innerHTML=`<div class="recent">${REC.length?`<h4>Recent<button onclick="REC=[];lsSet('gs_recent',[]);render()">Clear all</button></h4>`+REC.map((r,i)=>`<div class="rc"><div class="ci">${ic("search")}</div><span onclick="setQ('${escA(r)}')">${esc(r)}</span><i onclick="delRec(${i})">✕</i></div>`).join(""):'<div class="empty" style="padding:40px 0">काहीतरी शोधा...<br>video, #tag किंवा माणूस</div>'}</div>`;
}

/* SEARCH BEHAVIOUR */
function onQ(){Q=$("q").value;render()}
function setQ(t){$("q").value=t;Q=t;focused=false;commit();render()}
function clearQ(){$("q").value="";Q="";$("q").focus();render()}
function focusQ(on){focused=!!on;if(!on){$("q").blur();$("q").value="";Q=""}render()}
function commit(){const t=Q.trim();if(!t)return;REC=[t,...REC.filter(x=>x.toLowerCase()!==t.toLowerCase())].slice(0,10);lsSet("gs_recent",REC);focused=false;$("q").blur();render()}
function delRec(i){REC.splice(i,1);lsSet("gs_recent",REC);render()}

/* FOLLOW */
function syncF(){document.querySelectorAll("[data-f]").forEach(b=>{const f=isF(b.dataset.f);b.classList.toggle("on",f);b.textContent=f?"Following":"Follow"})}
async function toggleFollow(uid){
  if(!me)return toast("Follow करण्यासाठी Login करा");if(!followReady)return toast("Follows table तयार नाही (setup.sql)");
  const was=isF(uid);FL=was?FL.filter(f=>!(f.follower_id===me.id&&f.following_id===uid)):[...FL,{follower_id:me.id,following_id:uid}];syncF();
  const q=sb.from("Follows");const {error}=was?await q.delete().eq("follower_id",me.id).eq("following_id",uid):await q.insert({follower_id:me.id,following_id:uid});
  if(error){FL=was?[...FL,{follower_id:me.id,following_id:uid}]:FL.filter(f=>!(f.follower_id===me.id&&f.following_id===uid));syncF();toast("Follow बदलता आले नाही")}
}

/* PLAYER */
async function toggleLike(id){
  id=String(id);if(!me)return toast("Like करण्यासाठी Login करा");if(!likesReady)return toast("Likes table तयार नाही");
  const liked=myLikes.has(id);if(liked){myLikes.delete(id);likeCount[id]=Math.max(0,(likeCount[id]||1)-1)}else{myLikes.add(id);likeCount[id]=(likeCount[id]||0)+1}
  paintLike(id);const q=sb.from("VideoLikes");const {error}=liked?await q.delete().eq("video_id",id).eq("user_id",me.id):await q.insert({video_id:id,user_id:me.id});
  if(error){if(liked){myLikes.add(id);likeCount[id]=(likeCount[id]||0)+1}else{myLikes.delete(id);likeCount[id]=Math.max(0,(likeCount[id]||1)-1)}paintLike(id);toast("Like बदलता आला नाही")}
}
function paintLike(id){const b=$("lk");if(b&&cur&&String(cur.id)===id){b.classList.toggle("on",myLikes.has(id));$("lkn").textContent=likeCount[id]||0}}
function toggleSave(id){id=String(id);if(saved.has(id)){saved.delete(id);toast("Saved मधून काढला")}else{saved.add(id);toast("🔖 Save झाला")}lsSet("gs_saved_videos",[...saved]);$("sv").style.opacity=saved.has(id)?1:.6}
function openPlayer(id){
  const v=vids.find(x=>String(x.id)===String(id));if(!v)return;cur=v;const s=String(v.id),a=escA(v.id);
  $("pInfo").innerHTML=`<div class="ph"><div>${ava(v.username,34)}</div><b>${esc(v.username||"GyanSetu User")}</b>${v.user_id&&(!me||v.user_id!==me.id)?`<button class="fb ${isF(v.user_id)?"on":""}" data-f="${escA(v.user_id)}" onclick="toggleFollow('${escA(v.user_id)}')">${isF(v.user_id)?"Following":"Follow"}</button>`:""}</div>
  <div class="act"><button id="lk" class="${myLikes.has(s)?"on":""}" onclick="toggleLike('${a}')">${ic("heart")}<em id="lkn">${likeCount[s]||0}</em></button><button id="sv" style="opacity:${saved.has(s)?1:.6}" onclick="toggleSave('${a}')">🔖</button></div>
  <div class="cap"><b>${esc(v.title)}</b><span>${esc(v.description||"")}</span></div>
  <button class="go" onclick="location.href='reels.html?v=${encodeURIComponent(v.id)}'">Reels मध्ये उघडा / Comments</button>`;
  const mv=$("mv");mv.src=v.video_url;mv.play().catch(()=>{});$("pl").classList.add("show");document.body.style.overflow="hidden";
}
function closePlayer(){const mv=$("mv");mv.pause();mv.removeAttribute("src");mv.load();$("pl").classList.remove("show");document.body.style.overflow="";cur=null}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("pl").classList.contains("show"))closePlayer();else if(focused)focusQ(0)}});
load();
</script>
<script>
(function(){const n=document.getElementById("nav");if(!n)return;
function go(){let i=n.querySelector(".ind");if(!i){i=document.createElement("i");i.className="ind";n.prepend(i)}
const b=n.querySelector("button.on");if(!b){i.style.width="0";return}
i.style.width=(b.offsetWidth-6)+"px";i.style.transform="translateX("+(b.offsetLeft+3)+"px)"}
new MutationObserver(go).observe(n,{childList:true,subtree:true,attributes:true,attributeFilter:["class"]});
addEventListener("resize",go);addEventListener("load",go);go()})();
</script>
</body>
</html>
