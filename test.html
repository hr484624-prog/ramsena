<title>ज्ञानसेतू - Basic Mathematics Test</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f6fb;
    color:#222;
}

.page{
    width:100%;
    max-width:430px;
    min-height:100vh;
    margin:auto;
    background:#fff;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
    color:white;
    padding:20px 16px;
    text-align:center;
}

.header h1{
    font-size:24px;
    margin-bottom:5px;
}

.header p{
    font-size:13px;
}

/* TEST AREA */

.test-area{
    padding:18px 15px 30px;
}

.progress-box{
    background:#f5f3ff;
    padding:13px;
    border-radius:13px;
    margin-bottom:15px;
}

.progress-top{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:#555;
    margin-bottom:8px;
}

.progress-bar{
    width:100%;
    height:8px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    width:1%;
    background:#4f46e5;
    transition:.3s;
}

/* QUESTION */

.question-card{
    background:white;
    border-radius:18px;
    box-shadow:0 5px 18px rgba(0,0,0,.09);
    border:1px solid #eee;
    padding:20px 16px;
}

.question-number{
    font-size:13px;
    color:#6366f1;
    font-weight:bold;
    margin-bottom:10px;
}

.difficulty{
    display:inline-block;
    background:#f1f5f9;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    color:#64748b;
    margin-bottom:13px;
}

.question{
    font-size:20px;
    line-height:1.5;
    font-weight:bold;
    margin-bottom:20px;
}

/* OPTIONS */

.option{
    width:100%;
    padding:14px;
    margin-bottom:10px;
    border:2px solid #e5e7eb;
    background:#fff;
    border-radius:12px;
    text-align:left;
    font-size:15px;
    cursor:pointer;
    transition:.2s;
}

.option:active{
    transform:scale(.98);
}

.option.selected{
    border-color:#6366f1;
    background:#f5f3ff;
}

.option.correct{
    border-color:#16a34a;
    background:#dcfce7;
}

.option.wrong{
    border-color:#dc2626;
    background:#fee2e2;
}

/* NEXT */

.next-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:13px;
    background:#4f46e5;
    color:white;
    font-size:16px;
    margin-top:8px;
    cursor:pointer;
}

.next-btn:disabled{
    opacity:.5;
}

/* RESULT */

.result{
    display:none;
    text-align:center;
    padding:30px 18px;
}

.result-icon{
    font-size:60px;
    margin-bottom:12px;
}

.result h2{
    font-size:25px;
    margin-bottom:10px;
}

.score{
    font-size:42px;
    font-weight:bold;
    color:#4f46e5;
    margin:15px 0;
}

.result p{
    color:#666;
    line-height:1.6;
    font-size:14px;
}

.restart-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:13px;
    background:#4f46e5;
    color:white;
    font-size:16px;
    margin-top:20px;
    cursor:pointer;
}

.home-btn{
    width:100%;
    padding:13px;
    border:2px solid #4f46e5;
    border-radius:13px;
    background:white;
    color:#4f46e5;
    font-size:15px;
    margin-top:10px;
    cursor:pointer;
}

</style>
</head>

    document.getElementById("questionNumber")
        .innerText =
        "प्रश्न " +
        (currentQuestion + 1);

    document.getElementById("difficulty")
        .innerText = data.d;

    document.getElementById("question")
        .innerText = data.q;

    document.getElementById("scoreText")
        .innerText =
        "गुण: " + score;

    const progress =
        ((currentQuestion + 1) /
        questions.length) * 100;

    document.getElementById("progressFill")
        .style.width =
        progress + "%";

    const options =
        document.getElementById("options");

    options.innerHTML = "";

    data.o.forEach((option,index)=>{

        const button =
            document.createElement("button");

        button.className = "option";

        button.innerText =
            String.fromCharCode(65 + index) +
            ") " +
            option;

        button.onclick = function(){

            chooseAnswer(index,button);

        };

        options.appendChild(button);

    });

    document.getElementById("nextBtn")
        .disabled = true;

    document.getElementById("nextBtn")
        .innerText =
        currentQuestion === questions.length - 1
        ? "Test पूर्ण करा ✓"
        : "पुढील प्रश्न →";
}


/* =====================================================
   CHOOSE ANSWER
===================================================== */

function chooseAnswer(index,button){

    if(answered){
        return;
    }

    selectedAnswer = index;

    const data =
        questions[currentQuestion];

    const allOptions =
        document.querySelectorAll(".option");

    allOptions.forEach((btn,i)=>{

        btn.disabled = true;

        if(i === data.a){
            btn.classList.add("correct");
        }

    });

    if(index === data.a){

        score++;

        document.getElementById("scoreText")
            .innerText =
            "गुण: " + score;

    }else{

        button.classList.add("wrong");

    }

    answered = true;

    document.getElementById("nextBtn")
        .disabled = false;
}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion(){

    if(!answered){
        return;
    }

    if(currentQuestion <
       questions.length - 1){

        currentQuestion++;

        loadQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }else{

        showResult();

    }
}


/* =====================================================
   SHOW RESULT
===================================================== */

function showResult(){

    document.getElementById("testArea")
        .style.display = "none";

    document.getElementById("result")
        .style.display = "block";

    document.getElementById("finalScore")
        .innerText =
        score + " / " + questions.length;

    let message = "";

    const percentage =
        (score / questions.length) * 100;

    if(percentage >= 90){

        message =
        "🌟 अप्रतिम! Basic Mathematics वर तुमची खूप चांगली पकड आहे.";

    }else if(percentage >= 75){

        message =
        "👏 खूप छान! तुमचा गणिताचा पाया मजबूत आहे.";

    }else if(percentage >= 50){

        message =
        "👍 चांगला प्रयत्न! अजून थोडा सराव केल्यास तुम्ही आणखी चांगले करू शकता.";

    }else{

        message =
        "💪 छान प्रयत्न! Basic Mathematics चे Topics पुन्हा अभ्यासा आणि Test पुन्हा सोडवा.";

    }

    document.getElementById("resultMessage")
        .innerText = message;
}


/* =====================================================
   RESTART
===================================================== */

function restartTest(){

    currentQuestion = 0;
    score = 0;
    selectedAnswer = null;
    answered = false;

    document.getElementById("result")
        .style.display = "none";

    document.getElementById("testArea")
        .style.display = "block";

    loadQuestion();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =====================================================
   HOME
===================================================== */

function goHome(){

    window.history.back();

}


/* =====================================================
   START TEST
===================================================== */

loadQuestion();

</script>
