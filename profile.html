<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIBRA Profile</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #fff;
      color: #111;
      padding-bottom: 70px;
    }

    .top {
      height: 60px;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 20px;
      position: sticky;
      top: 0;
      background: white;
    }

    .back {
      font-size: 28px;
      text-decoration: none;
      color: #111;
    }

    .username {
      font-size: 22px;
      font-weight: bold;
    }

    .profile {
      padding: 25px 18px;
    }

    .profile-info {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .profile-pic {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(45deg, #ff8a00, #e52e71, #9b00ff);
      padding: 4px;
    }

    .profile-pic img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid white;
    }

    .stats {
      display: flex;
      gap: 22px;
      text-align: center;
    }

    .stats b {
      display: block;
      font-size: 20px;
    }

    .stats span {
      font-size: 13px;
    }

    .name {
      margin-top: 18px;
      font-size: 21px;
      font-weight: bold;
    }

    .bio {
      margin-top: 6px;
      color: #555;
    }

    .edit {
      width: 100%;
      margin-top: 18px;
      padding: 10px;
      border: 1px solid #bbb;
      border-radius: 8px;
      background: white;
      font-weight: bold;
    }

    .tabs {
      display: flex;
      justify-content: space-around;
      border-top: 1px solid #ddd;
      border-bottom: 1px solid #ddd;
      margin-top: 10px;
      padding: 14px;
      font-size: 22px;
    }

    .empty {
      text-align: center;
      padding: 80px 20px;
      color: #777;
    }

    .empty div {
      font-size: 55px;
      margin-bottom: 12px;
    }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      align-items: center;
      font-size: 25px;
    }

    .bottom a {
      color: #111;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="top">
    <a class="back" href="index.html">‹</a>
    <div class="username">hitesh</div>
  </div>

  <section class="profile">

    <div class="profile-info">

    <div class="profile-pic">
  <img id="profileImage" src="" alt="Profile Photo">
    </div>

      <div class="stats">
        <div>
          <b>0</b>
          <span>Posts</span>
        </div>

        <div>
          <b>0</b>
          <span>Followers</span>
        </div>

        <div>
          <b>0</b>
          <span>Following</span>
        </div>
      </div>

    </div>

    <div class="name">Hitesh</div>

    <div class="bio">
      Welcome to my VIBRA profile 🚀
    </div>

    <a href="edit-profile.html" class="edit">Edit Profile</a>

  </section>

  <div class="tabs">
    <span>▦</span>
    <span>🎬</span>
    <span>♡</span>
  </div>

  <div class="empty">
    <div>📷</div>
    <h2>No Posts Yet</h2>
    <p>Share your first photo or video.</p>
  </div>

  <div class="bottom">
    <a href="index.html">⌂</a>
    <span>⌕</span>
    <span>＋</span>
    <span>♡</span>
    <span>◯</span>
  </div>
<script>

const savedImage =
  localStorage.getItem("v_profile_image");

if (savedImage) {
  document.getElementById("profileImage").src = savedImage;
}

</script>
</body>
    </html>
