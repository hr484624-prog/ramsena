<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>My Profile - GyanSetu</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:linear-gradient(135deg,#f5f8ff,#eef4ff);
  color:#182033;
  min-height:100vh;
  padding-bottom:80px;
}

.header{
  height:62px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);
  display:flex;
  align-items:center;
  padding:0 12px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 3px 18px rgba(30,80,150,.12);
}

.header button{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#eef4ff;
  color:#1769d1;
  font-size:24px;
}

.title{
  flex:1;
  text-align:center;
  font-size:19px;
  font-weight:bold;
}

.container{
  max-width:600px;
  margin:auto;
  padding:18px 14px;
}

.profile-card{
  background:white;
  border-radius:25px;
  padding:24px 18px;
  box-shadow:0 8px 30px rgba(20,70,130,.12);
}

.profile-top{
  text-align:center;
}

.avatar{
  width:105px;
  height:105px;
  margin:auto;
  border-radius:50%;
  background:linear-gradient(135deg,#1976d2,#7c4dff);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  font-weight:bold;
  overflow:hidden;
  border:5px solid #edf4ff;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.name{
  font-size:23px;
  font-weight:bold;
  margin-top:12px;
}

.email{
  color:#777;
  font-size:14px;
  margin-top:4px;
}

.video-post-btn{
  width:100%;
  margin-top:20px;
  padding:15px;
  border:0;
  border-radius:15px;
  background:linear-gradient(135deg,#ff2bd6,#436cff);
  color:white;
  font-size:16px;
  font-weight:bold;
  box-shadow:0 8px 20px rgba(120,60,220,.25);
}

.edit-btn{
  width:100%;
  margin-top:10px;
  padding:13px;
  border:1px solid #dbe7f7;
  border-radius:14px;
  background:#f7faff;
  color:#1769d1;
  font-weight:bold;
}

.info{
  margin-top:22px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:14px 0;
  border-bottom:1px solid #edf0f5;
}

.label{
  color:#7a8494;
  font-size:13px;
}

.value{
  text-align:right;
  font-weight:600;
  max-width:60%;
  word-break:break-word;
}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:68px;
  background:white;
  box-shadow:0 -5px 20px rgba(0,0,0,.1);
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:200;
}

.nav button{
  border:0;
  background:none;
  color:#777;
  font-size:11px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}

.nav span{
  font-size:22px;
}

.nav .active{
  color:#1976d2;
}

.modal{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.6);
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:600px;
  max-height:92vh;
  overflow:auto;
  background:white;
  border-radius:25px 25px 0 0;
  padding:20px;
}

.modal-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:18px;
}

label{
  display:block;
  font-size:14px;
  font-weight:bold;
  margin-bottom:7px;
}

input,textarea{
  width:100%;
  padding:13px;
  border:1px solid #d4deeb;
  border-radius:12px;
  outline:none;
  font-size:15px;
  margin-bottom:14px;
}

textarea{
  min-height:110px;
  resize:vertical;
}

.primary{
  width:100%;
  padding:14px;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,#ff2bd6,#436cff);
  color:white;
  font-size:16px;
  font-weight:bold;
}

.cancel{
  width:100%;
  padding:13px;
  border:0;
  border-radius:13px;
  background:#edf0f5;
  margin-top:9px;
}

.progress{
  display:none;
  margin-top:12px;
  text-align:center;
  color:#666;
  font-size:13px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:85px;
  transform:translateX(-50%);
  background:#222;
  color:white;
  padding:11px 18px;
  border-radius:20px;
  display:none;
  z-index:3000;
}

.toast.show{
  display:block;
}

</style>
</head>

<body>

<header class="header">

<button onclick="goHome()">‹</button>

<div class="title">
  👤 My Profile
</div>

<button onclick="goVideos()">
  🛄
</button>

</header>


<main class="container">

<div class="profile-card">

  <div class="profile-top">

    <div
      class="avatar"
      id="avatar"
      onclick="document.getElementById('photoInput').click()">

      G

    </div>

    <div
      class="name"
      id="name">
      User
    </div>

    <div
      class="email"
      id="email">
      -
    </div>

  </div>


  <!-- VIDEO BUTTON -->

  <button
    class="video-post-btn"
    onclick="openVideoModal()">

    🎬 Post a Video

  </button>


  <button
    class="edit-btn"
    onclick="openEdit()">

    ✏️ Edit Information

  </button>


  <div class="info">

    <div class="row">
      <span class="label">Full Name</span>
      <span class="value" id="fullName">-</span>
    </div>

    <div class="row">
      <span class="label">Date of Birth</span>
      <span class="value" id="dob">-</span>
    </div>

    <div class="row">
      <span class="label">School / College</span>
      <span class="value" id="school">-</span>
    </div>

    <div class="row">
      <span class="label">Class</span>
      <span class="value" id="className">-</span>
    </div>

    <div class="row">
      <span class="label">Medium</span>
      <span class="value" id="medium">-</span>
    </div>

    <div class="row">
      <span class="label">City / Village</span>
      <span class="value" id="city">-</span>
    </div>

    <div class="row">
      <span class="label">Career Goal</span>
      <span class="value" id="career">-</span>
    </div>

    <div class="row">
      <span class="label">Mobile</span>
      <span class="value" id="mobile">-</span>
    </div>

    <div class="row">
      <span class="label">GyanSetu ID</span>
      <span class="value" id="gyanId">-</span>
    </div>

  </div>

</div>

</main>


<nav class="nav">

<button onclick="goHome()">
<span>🏠</span>
Home
</button>

<button onclick="goLearn()">
<span>📚</span>
Learn
</button>

<button onclick="goVideos()">
<span>🎬</span>
Videos
</button>

<button class="active">
<span>👤</span>
Profile
</button>

</nav>


<!-- VIDEO MODAL -->

<div
  class="modal"
  id="videoModal">

<div class="modal-box">

<div class="modal-title">
  🎬 Post Video
</div>

<label>
  Select Video
</label>

<input
  type="file"
  id="videoInput"
  accept="video/*">

<label>
  Video Title
</label>

<input
  type="text"
  id="videoTitle"
  maxlength="150"
  placeholder="Video चे नाव">

<label>
  Description
</label>

<textarea
  id="videoDescription"
  maxlength="2000"
  placeholder="या video बद्दल थोडी माहिती लिहा..."></textarea>

<button
  class="primary"
  id="uploadButton"
  onclick="uploadVideo()">

  🚀 Post Video

</button>

<div
  class="progress"
  id="uploadProgress">

  Video upload होत आहे...

</div>

<button
  class="cancel"
  onclick="closeVideoModal()">

  Cancel

</button>

</div>

</div>


<!-- EDIT MODAL -->

<div
  class="modal"
  id="editModal">

<div class="modal-box">

<div class="modal-title">
  ✏️ Edit Information
</div>

<label>Full Name</label>
<input id="editFullName">

<label>Date of Birth</label>
<input type="date" id="editDob">

<label>School / College</label>
<input id="editSchool">

<label>Class</label>
<input id="editClass">

<label>Medium</label>
<input id="editMedium">

<label>City / Village</label>
<input id="editCity">

<label>Career Goal</label>
<input id="editCareer">

<label>Mobile</label>
<input id="editMobile">

<button
  class="primary"
  onclick="saveInformation()">

  Save Information

</button>

<button
  class="cancel"
  onclick="closeEdit()">

  Cancel

</button>

</div>

</div>


<input
  type="file"
  id="photoInput"
  accept="image/*"
  style="display:none"
  onchange="changePhoto(event)">


<div class="toast" id="toast"></div>


<script>

const SUPABASE_URL =
"https://eqglttfffhvoyvrclzse.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rR4xxl0dW5DJrhhjqiFHLw_uJ-HakAb";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser=null;


/* NAVIGATION */

function goHome(){
  location.href="home.html";
}

function goLearn(){
  location.href="learn.html";
}

function goVideos(){
  location.href="video.html";
}


/* TOAST */

function showToast(text){

  const toast =
    document.getElementById("toast");

  toast.textContent=text;
  toast.classList.add("show");

  setTimeout(()=>{
    toast.classList.remove("show");
  },2500);

}


/* USER */

async function loadProfile(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getUser();

  if(error || !data.user){

    location.href="username.html";
    return;
  }

  currentUser=data.user;


  const {
    data:profile
  } =
  await supabaseClient
  .from("Profiles")
  .select("*")
  .eq("id",currentUser.id)
  .maybeSingle();


  const metadata =
    currentUser.user_metadata || {};


  const username =
    profile?.username ||
    metadata.username ||
    "User";

  const email =
    currentUser.email || "-";


  document.getElementById(
    "name"
  ).textContent=username;

  document.getElementById(
    "email"
  ).textContent=email;


  setText(
    "fullName",
    profile?.full_name
  );

  setText(
    "dob",
    profile?.dob
  );

  setText(
    "school",
    profile?.school
  );

  setText(
    "className",
    profile?.class_name
  );

  setText(
    "medium",
    profile?.medium
  );

  setText(
    "city",
    profile?.city
  );

  setText(
    "career",
    profile?.career_goal
  );

  setText(
    "mobile",
    profile?.mobile
  );

  setText(
    "gyanId",
    currentUser.id
  );


  const photo =
    localStorage.getItem(
      "profilePhoto"
    );

  if(photo){

    document.getElementById(
      "avatar"
    ).innerHTML =
      `<img src="${escapeAttr(photo)}">`;

  }else{

    document.getElementById(
      "avatar"
    ).textContent =
      username.charAt(0).toUpperCase();

  }

}


function setText(id,value){

  document.getElementById(id).textContent =
    value || "-";

}


/* VIDEO MODAL */

function openVideoModal(){

  document.getElementById(
    "videoModal"
  ).classList.add("show");

}


function closeVideoModal(){

  document.getElementById(
    "videoModal"
  ).classList.remove("show");

}


/* UPLOAD VIDEO */

async function uploadVideo(){

  if(!currentUser){
    return;
  }


  const file =
    document.getElementById(
      "videoInput"
    ).files[0];

  const title =
    document.getElementById(
      "videoTitle"
    ).value.trim();

  const description =
    document.getElementById(
      "videoDescription"
    ).value.trim();


  if(!file){

    showToast(
      "Video select करा."
    );

    return;
  }


  if(!file.type.startsWith("video/")){

    showToast(
      "फक्त video file निवडा."
    );

    return;
  }


  if(!title){

    showToast(
      "Video title टाका."
    );

    return;
  }


  /*
    100 MB limit.
    जर तुला मोठे videos हवेत तर
    Supabase Storage limit वाढव.
  */

  if(file.size > 100 * 1024 * 1024){

    showToast(
      "Video 100 MB पेक्षा कमी असावा."
    );

    return;
  }


  const button =
    document.getElementById(
      "uploadButton"
    );

  const progress =
    document.getElementById(
      "uploadProgress"
    );


  button.disabled=true;
  button.textContent="Uploading...";
  progress.style.display="block";


  try{

    const extension =
      file.name
      .split(".")
      .pop()
      .toLowerCase() || "mp4";


    const path =
      currentUser.id +
      "/" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2,8) +
      "." +
      extension;


    const {
      error:uploadError
    } =
    await supabaseClient
    .storage
    .from("videos")
    .upload(
      path,
      file,
      {
        cacheControl:"3600",
        upsert:false,
        contentType:file.type
      }
    );


    if(uploadError){
      throw uploadError;
    }


    const {
      data:urlData
    } =
    supabaseClient
    .storage
    .from("videos")
    .getPublicUrl(path);


    const videoUrl =
      urlData.publicUrl;


    const username =
      document.getElementById(
        "name"
      ).textContent;


    const {
      error:dbError
    } =
    await supabaseClient
    .from("Videos")
    .insert({

      user_id:
        currentUser.id,

      username:
        username,

      title:
        title,

      description:
        description,

      video_url:
        videoUrl

    });


    if(dbError){
      throw dbError;
    }


    showToast(
      "✅ Video successfully posted!"
    );


    document.getElementById(
      "videoInput"
    ).value="";

    document.getElementById(
      "videoTitle"
    ).value="";

    document.getElementById(
      "videoDescription"
    ).value="";


    setTimeout(()=>{
      closeVideoModal();
      location.href="junkfile.html";
    },700);


  }
  catch(error){

    console.error(
      "VIDEO UPLOAD ERROR:",
      error
    );

    showToast(
      "Video upload failed."
    );

  }
  finally{

    button.disabled=false;
    button.textContent="🚀 Post Video";
    progress.style.display="none";

  }

}


/* EDIT */

function openEdit(){

  document.getElementById(
    "editFullName"
  ).value =
    document.getElementById(
      "fullName"
    ).textContent === "-"
      ? ""
      : document.getElementById(
          "fullName"
        ).textContent;

  document.getElementById(
    "editDob"
  ).value =
    document.getElementById(
      "dob"
    ).textContent === "-"
      ? ""
      : document.getElementById(
          "dob"
        ).textContent;

  document.getElementById(
    "editSchool"
  ).value =
    cleanValue("school");

  document.getElementById(
    "editClass"
  ).value =
    cleanValue("className");

  document.getElementById(
    "editMedium"
  ).value =
    cleanValue("medium");

  document.getElementById(
    "editCity"
  ).value =
    cleanValue("city");

  document.getElementById(
    "editCareer"
  ).value =
    cleanValue("career");

  document.getElementById(
    "editMobile"
  ).value =
    cleanValue("mobile");


  document.getElementById(
    "editModal"
  ).classList.add("show");

}


function cleanValue(id){

  const v =
    document.getElementById(id).textContent;

  return v==="-" ? "" : v;

}


function closeEdit(){

  document.getElementById(
    "editModal"
  ).classList.remove("show");

}


/* SAVE */

async function saveInformation(){

  if(!currentUser){
    return;
  }


  const data={

    full_name:
      document.getElementById(
        "editFullName"
      ).value.trim(),

    dob:
      document.getElementById(
        "editDob"
      ).value || null,

    school:
      document.getElementById(
        "editSchool"
      ).value.trim(),

    class_name:
      document.getElementById(
        "editClass"
      ).value.trim(),

    medium:
      document.getElementById(
        "editMedium"
      ).value.trim(),

    city:
      document.getElementById(
        "editCity"
      ).value.trim(),

    career_goal:
      document.getElementById(
        "editCareer"
      ).value.trim(),

    mobile:
      document.getElementById(
        "editMobile"
      ).value.trim(),

    email:
      currentUser.email

  };


  const {
    error
  } =
  await supabaseClient
  .from("Profiles")
  .update(data)
  .eq(
    "id",
    currentUser.id
  );


  if(error){

    console.error(error);

    showToast(
      "Information save झाली नाही."
    );

    return;
  }


  closeEdit();

  await loadProfile();

  showToast(
    "Information saved."
  );

}


/* PHOTO */

function changePhoto(event){

  const file =
    event.target.files[0];

  if(!file){
    return;
  }

  const reader =
    new FileReader();

  reader.onload=function(e){

    localStorage.setItem(
      "profilePhoto",
      e.target.result
    );

    document.getElementById(
      "avatar"
    ).innerHTML =
      `<img src="${escapeAttr(e.target.result)}">`;

    showToast(
      "Profile photo updated."
    );

  };

  reader.readAsDataURL(file);

}


/* HELPERS */

function escapeAttr(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


/* MODAL BACKDROP */

document.addEventListener(
  "click",
  function(event){

    if(
      event.target.classList.contains("modal")
    ){

      event.target.classList.remove("show");

    }

  }
);


loadProfile();

</script>

</body>
</html>
