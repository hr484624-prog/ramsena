<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAMSENA Profile</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080808;
  color:white;
  font-family:Arial,sans-serif;
  padding-bottom:90px;
}

.header{
  background:#111;
  border-bottom:2px solid #ff7300;
  padding:18px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-icon{
  font-size:42px;
}

.logo-text{
  color:#ff7300;
  font-size:27px;
  font-weight:bold;
}

.header-btn{
  background:none;
  border:0;
  color:white;
  font-size:27px;
  cursor:pointer;
}

.container{
  max-width:650px;
  margin:auto;
  padding:20px 15px;
}

.profile-card{
  background:#151515;
  border:2px solid #ff7300;
  border-radius:25px;
  padding:25px 18px;
  text-align:center;
  box-shadow:0 0 25px rgba(255,115,0,.25);
}

.avatar{
  width:110px;
  height:110px;
  border-radius:50%;
  background:#252525;
  border:4px solid #ff7300;
  margin:0 auto 15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:60px;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.name{
  font-size:26px;
  font-weight:bold;
  margin-bottom:7px;
}

.username{
  color:#aaa;
  margin-bottom:10px;
}

.bio{
  color:#ddd;
  margin:10px auto 20px;
  max-width:450px;
}

.stats{
  display:flex;
  justify-content:center;
  gap:35px;
  margin:20px 0;
}

.stat{
  text-align:center;
}

.stat b{
  display:block;
  font-size:21px;
}

.stat span{
  color:#aaa;
  font-size:13px;
}

.main-btn{
  background:#ff7300;
  color:white;
  border:0;
  border-radius:12px;
  padding:13px 25px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin:5px;
}

.secondary-btn{
  background:#292929;
  color:white;
  border:1px solid #555;
  border-radius:12px;
  padding:12px 20px;
  font-size:15px;
  cursor:pointer;
  margin:5px;
}

.section-title{
  color:#ff7300;
  font-size:23px;
  margin:30px 5px 15px;
}

.form{
  background:#151515;
  border:1px solid #333;
  border-radius:20px;
  padding:18px;
  margin-bottom:20px;
}

input,textarea{
  width:100%;
  background:#222;
  color:white;
  border:1px solid #444;
  border-radius:12px;
  padding:13px;
  margin-bottom:12px;
  font-size:15px;
  outline:none;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.user-card{
  background:#151515;
  border:1px solid #333;
  border-radius:18px;
  padding:15px;
  margin:10px 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.user-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.small-avatar{
  width:52px;
  height:52px;
  border-radius:50%;
  border:2px solid #ff7300;
  background:#252525;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:28px;
}

.small-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.post{
  background:#151515;
  border:1px solid #333;
  border-radius:20px;
  padding:18px;
  margin:12px 0;
}

.post-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.post-avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#252525;
  border:2px solid #ff7300;
  display:flex;
  align-items:center;
  justify-content:center;
}

.post-time{
  color:#888;
  font-size:12px;
}

.post-text{
  color:#eee;
  line-height:1.5;
}

.empty{
  text-align:center;
  color:#777;
  padding:25px;
}

.hidden{
  display:none;
}

.tabs{
  display:flex;
  gap:8px;
  margin:25px 0 15px;
}

.tab{
  flex:1;
  padding:12px;
  background:#191919;
  color:#aaa;
  border:1px solid #333;
  border-radius:10px;
  cursor:pointer;
}

.tab.active{
  color:white;
  background:#ff7300;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:78px;
  background:#111;
  border-top:2px solid #333;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.bottom-item{
  color:white;
  text-align:center;
  font-size:13px;
  cursor:pointer;
}

.bottom-icon{
  display:block;
  font-size:27px;
  margin-bottom:3px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
  padding:20px;
}

.modal-box{
  width:100%;
  max-width:500px;
  background:#151515;
  border:2px solid #ff7300;
  border-radius:22px;
  padding:22px;
  max-height:90vh;
  overflow:auto;
}

.modal-title{
  color:#ff7300;
  font-size:23px;
  margin-bottom:18px;
}

.close{
  float:right;
  background:none;
  border:0;
  color:white;
  font-size:28px;
}

.story{
  background:#151515;
  border:2px solid #ff7300;
  border-radius:18px;
  padding:15px;
  margin:10px 0;
}

.reel{
  background:#151515;
  border:1px solid #333;
  border-radius:20px;
  padding:20px;
  margin:10px 0;
}

.message{
  background:#222;
  border-radius:15px;
  padding:12px;
  margin:8px 0;
}

.message.me{
  border:1px solid #ff7300;
  text-align:right;
}

@media(max-width:500px){
  .logo-text{
    font-size:23px;
  }

  .stats{
    gap:22px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">
    <div class="logo-icon">🐯</div>
    <div class="logo-text">RAMSENA</div>
  </div>

  <button class="header-btn" onclick="openEdit()">⚙️</button>
</header>

<div class="container">

  <!-- PROFILE -->
  <div class="profile-card">

    <div class="avatar" id="profileAvatar">🐯</div>

    <div class="name" id="profileName">
      Create Your Profile
    </div>

    <div class="username" id="profileUsername">
      @newuser
    </div>

    <div class="bio" id="profileBio">
      Welcome to RAMSENA 🔥
    </div>

    <div class="stats">
      <div class="stat">
        <b id="postCount">0</b>
        <span>Posts</span>
      </div>

      <div class="stat">
        <b id="followersCount">0</b>
        <span>Followers</span>
      </div>

      <div class="stat">
        <b id="followingCount">0</b>
        <span>Following</span>
      </div>
    </div>

    <button class="main-btn" onclick="openEdit()">
      ✏️ EDIT PROFILE
    </button>

  </div>


  <!-- TABS -->
  <div class="tabs">

    <button class="tab active" onclick="showTab('posts',this)">
      📝 Posts
    </button>

    <button class="tab" onclick="showTab('stories',this)">
      ⭕ Stories
    </button>

    <button class="tab" onclick="showTab('reels',this)">
      🎬 Reels
    </button>

  </div>


  <!-- POSTS -->
  <div id="postsTab">

    <div class="section-title">
      📝 My Posts
    </div>

    <div class="form">

      <textarea
        id="postText"
        placeholder="What's on your mind, RAMSENA?"
      ></textarea>

      <button class="main-btn" onclick="createPost()">
        🐯 POST
      </button>

    </div>

    <div id="postsList"></div>

  </div>


  <!-- STORIES -->
  <div id="storiesTab" class="hidden">

    <div class="section-title">
      ⭕ My Stories
    </div>

    <div class="form">

      <input
        id="storyText"
        placeholder="Write your story..."
      >

      <button class="main-btn" onclick="createStory()">
        ➕ ADD STORY
      </button>

    </div>

    <div id="storiesList"></div>

  </div>


  <!-- REELS -->
  <div id="reelsTab" class="hidden">

    <div class="section-title">
      🎬 My Reels
    </div>

    <div class="form">

      <textarea
        id="reelText"
        placeholder="Describe your reel..."
      ></textarea>

      <button class="main-btn" onclick="createReel()">
        🎬 ADD REEL
      </button>

    </div>

    <div id="reelsList"></div>

  </div>


  <!-- USERS -->
  <div class="section-title">
    👥 RAMSENA USERS
  </div>

  <div class="form">

    <input
      id="searchUser"
      oninput="searchUsers()"
      placeholder="🔎 Search users..."
    >

  </div>

  <div id="usersList"></div>


</div>


<!-- EDIT PROFILE MODAL -->
<div class="modal" id="editModal">

  <div class="modal-box">

    <button class="close" onclick="closeEdit()">×</button>

    <div class="modal-title">
      👤 Create / Edit Profile
    </div>

    <input
      id="editName"
      placeholder="Your name"
    >

    <input
      id="editUsername"
      placeholder="Username e.g. hitesh85"
    >

    <textarea
      id="editBio"
      placeholder="Write your bio..."
    ></textarea>

    <input
      id="editPhoto"
      placeholder="Profile photo URL (optional)"
    >

    <button class="main-btn" onclick="saveProfile()">
      💾 SAVE PROFILE
    </button>

  </div>

</div>


<!-- OTHER PROFILE MODAL -->
<div class="modal" id="userModal">

  <div class="modal-box">

    <button class="close" onclick="closeUser()">×</button>

    <div id="otherProfile"></div>

  </div>

</div>


<!-- MESSAGE MODAL -->
<div class="modal" id="messageModal">

  <div class="modal-box">

    <button class="close" onclick="closeMessages()">×</button>

    <div class="modal-title">
      💬 Messages
    </div>

    <div id="messagesList"></div>

    <input
      id="messageInput"
      placeholder="Write message..."
    >

    <button class="main-btn" onclick="sendMessage()">
      ➤ SEND
    </button>

  </div>

</div>


<!-- BOTTOM NAV -->
<div class="bottom">

  <div class="bottom
