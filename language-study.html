<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>GyanSetu • Language Study</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  font-family:Arial,sans-serif;
  background:#eef5ff;
  color:#172554;
}

.app{
  width:100%;
  max-width:430px;
  min-height:100vh;
  margin:auto;
  background:#fff;
}

header{
  height:64px;
  padding:0 18px;
  display:flex;
  align-items:center;
  color:white;
  background:linear-gradient(135deg,#1257c9,#2688ff);
  box-shadow:0 4px 15px rgba(20,90,190,.2);
}

.logo{
  font-size:21px;
  font-weight:800;
}

.sub{
  font-size:11px;
  opacity:.85;
  margin-top:3px;
}

main{
  padding:18px 15px 35px;
}

.hero{
  background:linear-gradient(135deg,#e8f2ff,#f8fbff);
  border:1px solid #d7e7ff;
  border-radius:20px;
  padding:21px 17px;
  margin-bottom:20px;
}

.hero h1{
  font-size:25px;
  margin-bottom:8px;
}

.hero p{
  font-size:14px;
  line-height:1.55;
  color:#64748b;
}

.section-title{
  font-size:18px;
  font-weight:800;
  margin:20px 3px 12px;
}

.subject-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}

.subject-card{
  border:1px solid #d8e6f8;
  background:#fff;
  border-radius:18px;
  padding:19px;
  display:flex;
  align-items:center;
  gap:15px;
  cursor:pointer;
  box-shadow:0 5px 16px rgba(20,80,150,.07);
}

.subject-card:active{
  background:#f1f7ff;
}

.subject-icon{
  width:54px;
  height:54px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#e7f1ff;
  font-size:29px;
  flex-shrink:0;
}

.subject-card h2{
  font-size:18px;
  margin-bottom:5px;
}

.subject-card p{
  font-size:12px;
  color:#64748b;
}

/* POPUP */

.popup{
  position:fixed;
  inset:0;
  background:rgba(4,18,42,.62);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:100;
}

.popup.show{
  display:flex;
}

.sheet{
  width:100%;
  max-width:430px;
  max-height:88vh;
  overflow-y:auto;
  background:#fff;
  border-radius:26px 26px 0 0;
  padding:19px 16px 30px;
}

.handle{
  width:45px;
  height:5px;
  border-radius:10px;
  background:#cbd5e1;
  margin:0 auto 17px;
}

.sheet-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}

.sheet-head h2{
  font-size:21px;
}

.close{
  width:37px;
  height:37px;
  border:0;
  border-radius:50%;
  background:#edf4ff;
  color:#155dcc;
  font-size:21px;
  cursor:pointer;
}

.option{
  width:100%;
  border:1px solid #dce8f8;
  background:#f9fbff;
  border-radius:15px;
  padding:15px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:13px;
  text-align:left;
  cursor:pointer;
}

.option:active{
  background:#edf5ff;
}

.option-icon{
  width:43px;
  height:43px;
  border-radius:12px;
  background:#e7f1ff;
  color:#155dcc;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:800;
  font-size:18px;
  flex-shrink:0;
}

.option strong{
  display:block;
  font-size:15px;
}

.option span{
  display:block;
  color:#64748b;
  font-size:11px;
  margin-top:4px;
}

/* CHAPTER PAGE */

.page{
  display:none;
}

.page.show{
  display:block;
}

.back-btn{
  border:0;
  background:#edf4ff;
  color:#155dcc;
  border-radius:12px;
  padding:10px 14px;
  font-weight:700;
  margin-bottom:15px;
  cursor:pointer;
}

.selected-box{
  background:linear-gradient(135deg,#1257c9,#318cff);
  color:white;
  border-radius:20px;
  padding:20px 16px;
  margin-bottom:19px;
}

.selected-box .small{
  font-size:12px;
  opacity:.85;
}

.selected-box h1{
  font-size:25px;
  margin:7px 0;
}

.selected-box p{
  font-size:13px;
  opacity:.92;
}

.chapter-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.chapter{
  border:1px solid #dce8f7;
  background:#fff;
  border-radius:17px;
  padding:16px;
  display:flex;
  align-items:center;
  gap:13px;
  cursor:pointer;
  box-shadow:0 4px 12px rgba(20,80,150,.06);
}

.chapter:active{
  background:#f2f7ff;
}

.chapter-number{
  width:43px;
  height:43px;
  border-radius:13px;
  background:#e7f1ff;
  color:#125dcc;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  flex-shrink:0;
}

.chapter h3{
  font-size:15px;
  margin-bottom:4px;
}

.chapter p{
  font-size:11px;
  color:#64748b;
}

/* LESSON */

.lesson-title{
  font-size:27px;
  line-height:1.25;
  margin-bottom:7px;
}

.lesson-meta{
  font-size:13px;
  color:#64748b;
  margin-bottom:18px;
}

.lesson-card{
  border:1px solid #dce8f7;
  border-radius:19px;
  padding:20px 17px;
  margin-bottom:13px;
  background:#fff;
  box-shadow:0 5px 15px rgba(20,80,150,.06);
}

.lesson-card h2{
  color:#125dcc;
  font-size:20px;
  margin-bottom:12px;
}

.lesson-card p,
.lesson-card li{
  font-size:17px;
  line-height:1.8;
  color:#26364d;
}

.lesson-card ul{
  padding-left:22px;
}

.example{
  background:#f0f7ff;
  border-left:4px solid #1769e0;
  border-radius:10px;
  padding:14px;
  margin-top:13px;
}

.example p{
  font-size:16px;
}

.highlight{
  background:#fff8df;
  border:1px solid #f1df9b;
  border-radius:12px;
  padding:14px;
  margin-top:13px;
}

.practice{
  background:linear-gradient(135deg,#f0f7ff,#fff);
}

.practice button{
  border:0;
  background:#1769e0;
  color:white;
  padding:13px 18px;
  border-radius:12px;
  font-weight:800;
  margin-top:13px;
  cursor:pointer;
}

</style>
</head>

        <h2>English</h2>
        <p>English Language</p>
      </div>
    </div>

  </div>

</div>


<!-- CHAPTER PAGE -->

<div id="chapterPage" class="page">

  <button class="back-btn" onclick="backToSubjects()">
    ← Subjects

</div>


<!-- LESSON PAGE -->

<div id="lessonPage" class="page">

  <button class="back-btn" onclick="backToChapters()">
    ← सर्व धडे

  <div class="lesson-meta" id="lessonMeta"></div>

  <div id="lessonContent"></div>

</div>

</main>
</div>


<!-- STANDARD POPUP -->

<div class="popup" id="standardPopup">

  <div class="sheet">

    <div class="handle"></div>

      <h2>🎓 Standard निवडा</h2>
      <button class="close" onclick="closePopup('standardPopup')">×</button>
    </div>

    <div id="standardList"></div>

  </div>

</div>


<script>

let selectedSubject = null;
let selectedStandard = null;


/* SUBJECT SELECT */

function selectSubject(name,marathi,icon){

  selectedSubject = {
    name:name,
    marathi:marathi,
    icon:icon
  };

  createStandards();

  document
    .getElementById("standardPopup")
    .classList.add("show");
}


/* STANDARD LIST */

function createStandards(){

  const list =
    document.getElementById("standardList");

  list.innerHTML = "";

  for(let i=1;i<=12;i++){

    const div =
      document.createElement("div");

    div.className = "option";

    div.innerHTML = `
      <div class="option-icon">
        ${i}
      </div>

      <div>
        <strong>इयत्ता ${i}वी</strong>
        <span>${i}th Standard</span>
      </div>
    `;

    div.onclick = function(){

      selectedStandard = i;

      closePopup("standardPopup");

      showChapters();

    };

    list.appendChild(div);

  }

}

/* GET CHAPTERS */

function getChapters(){

  if(selectedSubject.name === "Marathi"){
    return marathiChapters[selectedStandard];
  }

  if(selectedSubject.name === "Hindi"){
    return hindiChapters[selectedStandard];
  }

  return englishChapters[selectedStandard];

}


/* SHOW CHAPTERS */

function showChapters(){

  document.getElementById("subjectPage")
    .style.display = "none";

  document.getElementById("chapterPage")
    .classList.add("show");

  document.getElementById("lessonPage")
    .classList.remove("show");

  document.getElementById("subjectName")
    .textContent =
      selectedSubject.icon + " " +
      selectedSubject.marathi;

  document.getElementById("standardName")
    .textContent =
      "🎓 इयत्ता " + selectedStandard + "वी";

  const list =
    document.getElementById("chapterList");

  list.innerHTML = "";

  const chapters = getChapters();

  chapters.forEach((chapter,index)=>{

    const div =
      document.createElement("div");

    div.className = "chapter";

    div.innerHTML = `
      <div class="chapter-number">
        ${index+1}
      </div>

      <div>
        <h3>${chapter}</h3>
        <p>📖 धडा उघडण्यासाठी येथे टॅप करा</p>
      </div>
    `;

    div.onclick = function(){
      openLesson(chapter,index+1);
    };

    list.appendChild(div);

  });

  window.scrollTo(0,0);

}


/* OPEN LESSON */

function openLesson(chapter,number){

  document.getElementById("chapterPage")
    .classList.remove("show");

  document.getElementById("lessonPage")
    .classList.add("show");

  document.getElementById("lessonTitle")
    .textContent =
      number + ". " + chapter;

  document.getElementById("lessonMeta")
    .textContent =
      selectedSubject.marathi +
      " • इयत्ता " +
      selectedStandard +
      "वी";

  document.getElementById("lessonContent")
    .innerHTML =
      createLesson(chapter,number);

  window.scrollTo(0,0);

}

/* NEXT CHAPTER */

function nextChapter(){

  const chapters = getChapters();

  const currentTitle =
    document.getElementById("lessonTitle")
      .textContent;

  const currentNumber =
    parseInt(currentTitle.split(".")[0]);

  if(
    currentNumber >= 1 &&
    currentNumber < chapters.length
  ){

    openLesson(
      chapters[currentNumber],
      currentNumber + 1
    );

  }else{

    backToChapters();

  }

}


/* BACK TO SUBJECTS */

function backToSubjects(){

  document.getElementById("chapterPage")
    .classList.remove("show");

  document.getElementById("lessonPage")
    .classList.remove("show");

  document.getElementById("subjectPage")
    .style.display = "block";

  window.scrollTo(0,0);

}


/* BACK TO CHAPTERS */

function backToChapters(){

  document.getElementById("lessonPage")
    .classList.remove("show");

  document.getElementById("chapterPage")
    .classList.add("show");

  window.scrollTo(0,0);

}


/* CLOSE POPUP */

function closePopup(id){

  document.getElementById(id)
    .classList.remove("show");

}


/* CLOSE POPUP ON BACKDROP */

document.getElementById("standardPopup")
  .addEventListener("click",function(e){

    if(e.target === this){
      closePopup("standardPopup");
    }

  });
