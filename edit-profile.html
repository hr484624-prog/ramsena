<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile - VIBRA</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#fff;
  color:#111;
}

.top{
  height:60px;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  gap:20px;
  padding:0 18px;
}

.back{
  font-size:30px;
  text-decoration:none;
  color:#111;
}

.title{
  font-size:21px;
  font-weight:bold;
}

.form{
  padding:25px 20px;
  max-width:600px;
  margin:auto;
}

.photo{
  text-align:center;
  margin-bottom:25px;
}

.profile-pic{
  width:100px;
  height:100px;
  border-radius:50%;
  background:linear-gradient(45deg,#ff8a00,#e52e71,#9b00ff);
  padding:4px;
  margin:auto;
}

.profile-pic img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  border:3px solid white;
}

.change{
  margin-top:10px;
  color:#0095f6;
  font-weight:bold;
}

label{
  display:block;
  margin-top:18px;
  margin-bottom:7px;
  font-weight:bold;
}

input,textarea{
  width:100%;
  padding:13px;
  border:1px solid #bbb;
  border-radius:8px;
  font-size:16px;
}

textarea{
  height:100px;
  resize:none;
}

.save{
  width:100%;
  margin-top:25px;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#0095f6;
  color:white;
  font-size:17px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="top">
  <a href="profile.html" class="back">‹</a>
  <div class="title">Edit Profile</div>
</div>

<div class="form">

<div class="photo">

  <div class="profile-pic">
    <img id="profileImage" src="" alt="Profile Photo">
  </div>

  <div
    class="change"
    onclick="document.getElementById('imageInput').click()"
    style="cursor:pointer;"
  >
    Change profile photo
  </div>

  <input
    type="file"
    id="imageInput"
    accept="image/*"
    style="display:none;"
  >

</div>

  <label>Username</label>
  <input id="username" type="text" value="hitesh">

  <label>Name</label>
  <input id="name" type="text" value="Hitesh">

  <label>Bio</label>
  <textarea id="bio">Welcome to my VIBRA profile 🚀</textarea>

  <button class="save" onclick="saveProfile()">Save Profile</button>

</div>

<script>

const imageInput = document.getElementById("imageInput");
const profileImage = document.getElementById("profileImage");

imageInput.addEventListener("change", function(){

  const file = this.files[0];

  if(file){

    const reader = new FileReader();

    reader.onload = function(e){

      profileImage.src = e.target.result;

      localStorage.setItem(
        "v_profile_image",
        e.target.result
      );

    };

    reader.readAsDataURL(file);
  }

});


const savedImage =
  localStorage.getItem("v_profile_image");

if(savedImage){
  profileImage.src = savedImage;
}


function saveProfile(){

  const username =
    document.getElementById("username").value.trim();

  const name =
    document.getElementById("name").value.trim();

  const bio =
    document.getElementById("bio").value.trim();

  if(username === "" || name === ""){
    alert("Username आणि Name रिकामे ठेवू नका.");
    return;
  }

  localStorage.setItem("v_username", username);
  localStorage.setItem("v_name", name);
  localStorage.setItem("v_bio", bio);

  alert("Profile saved successfully! ✅");

  window.location.href = "profile.html";
}

</script>

</body>
  </html>
