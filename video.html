<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Videos - GyanSetu</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#050509;
  color:white;
  min-height:100vh;
  padding-bottom:75px;
}

.header{
  position:sticky;
  top:0;
  z-index:100;
  height:62px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 12px;
  background:rgba(5,5,9,.96);
  border-bottom:1px solid #252533;
}

.back{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#171722;
  color:white;
  font-size:25px;
}

.logo{
  font-size:21px;
  font-weight:800;
  background:linear-gradient(90deg,#ff2bd6,#4d7cff);
  -webkit-background-clip:text;
  color:transparent;
}

.search-box{
  padding:12px;
  background:#09090f;
  position:sticky;
  top:62px;
  z-index:90;
}

.search{
  width:100%;
  height:45px;
  border:1px solid #29293a;
  border-radius:14px;
  outline:none;
  background:#15151e;
  color:white;
  padding:0 15px;
  font-size:15px;
}

.search:focus{
  border-color:#ff2bd6;
}

.feed{
  max-width:650px;
  margin:auto;
  padding:10px;
}

.video-card{
  background:#0e0e16;
  border:1px solid #222231;
  border-radius:16px;
  overflow:hidden;
  margin-bottom:16px;
  box-shadow:0 5px 25px rgba(0,0,0,.35);
}

.thumb{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#111;
  cursor:pointer;
  overflow:hidden;
}

.thumb video{
  width:100%;
  height:100%;
  object-fit:cover;
  pointer-events:none;
}

.play{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:58px;
  height:58px;
  border-radius:50%;
  background:rgba(255,43,214,.9);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  box-shadow:0 0 25px rgba(255,43,214,.4);
}

.card-content{
  padding:12px;
}

.card-title{
  font-size:17px;
  font-weight:bold;
  margin-bottom:7px;
}

.card-description{
  color:#aaa;
  font-size:13px;
  line-height:1.5;
}

.card-meta{
  color:#777;
  font-size:11px;
  margin-top:9px;
}

.empty{
  text-align:center;
  padding:60px 20px;
  color:#777;
}

.loader{
  text-align:center;
  padding:40px;
  color:#aaa;
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:65px;
  background:#09090f;
  border-top:1px solid #252533;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:200;
}

.nav{
  border:0;
  background:none;
  color:#777;
  font-size:11px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}

.nav span{
  font-size:22px;
}

.nav.active{
  color:#ff3bd4;
}


/* PLAYER */

.player-modal{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  background:#000;
  overflow-y:auto;
}

.player-modal.show{
  display:block;
}

.player-top{
  height:58px;
  display:flex;
  align-items:center;
  padding:0 12px;
  gap:10px;
  background:#07070b;
  border-bottom:1px solid #252533;
  position:sticky;
  top:0;
  z-index:5;
}

.close-player{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#191923;
  color:white;
  font-size:25px;
}

.player-title-small{
  font-weight:bold;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.player-wrap{
  max-width:900px;
  margin:auto;
}

.main-video{
  width:100%;
  max-height:70vh;
  background:#000;
  display:block;
}

.player-info{
  padding:15px;
}

.player-title{
  font-size:20px;
  font-weight:bold;
  line-height:1.35;
}

.player-user{
  color:#ff54db;
  margin-top:7px;
  font-size:13px;
}

.player-description{
  color:#bbb;
  line-height:1.6;
  margin-top:12px;
  white-space:pre-wrap;
}

.player-actions{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.action-btn{
  border:1px solid #343445;
  background:#15151e;
  color:white;
  border-radius:12px;
  padding:11px 17px;
  font-weight:bold;
}

.action-btn.share{
  background:linear-gradient(135deg,#ff28cf,#416cff);
  border:0;
}

.other-title{
  font-size:18px;
  font-weight:bold;
  padding:15px;
  border-top:1px solid #252533;
}

.related{
  padding:0 10px 30px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:85px;
  transform:translateX(-50%);
  background:#20202a;
  color:white;
  padding:11px 18px;
  border-radius:20px;
  display:none;
  z-index:3000;
  font-size:13px;
}

.toast.show{
  display:block;
}

</style>
</head>

<body>

<header class="header">

  <button class="back" onclick="goHome()">‹</button>

  <div class="logo">
    🎬 GyanSetu
  </div>

</header>


<div class="search-box">

  <input
    id="searchInput"
    class="search"
    placeholder="🔍 Search videos..."
    oninput="searchVideos()">

</div>


<main class="feed" id="feed">

  <div class="loader">
    Loading videos...
  </div>

</main>


<nav class="bottom">

  <button class="nav" onclick="goHome()">
    <span>🏠</span>
    Home
  </button>

  <button class="nav active">
    <span>🎬</span>
    Videos
  </button>

  <button class="nav" onclick="goCreate()">
    <span>👥</span>
    users
  </button>

  <button class="nav" onclick="goProfile()">
    <span>👤</span>
    Profile
  </button>

</nav>


<!-- PLAYER -->

<div class="player-modal" id="playerModal">

  <div class="player-top">

    <button
      class="close-player"
      onclick="closePlayer()">
      ×
    </button>

    <div
      class="player-title-small"
      id="playerSmallTitle">
    </div>

  </div>


  <div class="player-wrap">

    <video
      id="mainVideo"
      class="main-video"
      controls
      playsinline>
    </video>


    <div class="player-info">

      <div
        class="player-title"
        id="playerTitle">
      </div>

      <div
        class="player-user"
        id="playerUser">
      </div>

      <div
        class="player-description"
        id="playerDescription">
      </div>


      <div class="player-actions">

        <button
          class="action-btn share"
          onclick="shareCurrentVideo()">
          🔗 Share
        </button>

        <button
          class="action-btn"
          onclick="closePlayer()">
          ↓ Back to videos
        </button>

      </div>

    </div>


    <div class="other-title">
      More Videos
    </div>

    <div
      class="related"
      id="related">
    </div>

  </div>

</div>


<div class="toast" id="toast"></div>


<script>

const SUPABASE_URL =
"https://eqglttfffhvoyvrclzse.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rR4xxl0dW5DJrhhjqiFHLw_uJ-HakAb";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let videos = [];
let currentVideo = null;


/* NAVIGATION */

function goHome(){
  location.href="home.html";
}

function goProfile(){
  location.href="profile.html";
}

function goCreate(){
  location.href="users.html";
}


/* TOAST */

function showToast(text){

  const t =
    document.getElementById("toast");

  t.textContent=text;
  t.classList.add("show");

  setTimeout(()=>{
    t.classList.remove("show");
  },2200);
}


/* USER */

async function getUser(){

  const {
    data
  } =
  await supabaseClient.auth.getUser();

  currentUser =
    data?.user || null;

}


/* LOAD VIDEOS */

async function loadVideos(){

  const {
    data,
    error
  } =
  await supabaseClient
  .from("Videos")
  .select("*")
  .order(
    "created_at",
    {
      ascending:false
    }
  );

  if(error){

    console.error(error);

    document.getElementById("feed").innerHTML =
      `<div class="empty">
        Videos load झाले नाहीत.
      </div>`;

    return;
  }

  videos =
    data || [];

  renderVideos(videos);

}


/* RENDER */

function renderVideos(list){

  const feed =
    document.getElementById("feed");

  feed.innerHTML="";

  if(!list.length){

    feed.innerHTML =
      `<div class="empty">
        🎬 अजून videos post झालेले नाहीत.
      </div>`;

    return;
  }


  list.forEach(video=>{

    const card =
      document.createElement("div");

    card.className="video-card";

    card.innerHTML=`

      <div class="thumb"
           onclick="openPlayer('${video.id}')">

        <video
          src="${escapeAttr(video.video_url)}"
          preload="metadata"
          muted
          playsinline>
        </video>

        <div class="play">
          ▶
        </div>

      </div>

      <div class="card-content">

        <div class="card-title">
          ${escapeHtml(video.title)}
        </div>

        <div class="card-description">
          ${escapeHtml(video.description || "")}
        </div>

        <div class="card-meta">
          👤 ${escapeHtml(video.username || "GyanSetu User")}
          • ${formatDate(video.created_at)}
        </div>

      </div>

    `;

    feed.appendChild(card);

  });

}


/* SEARCH */

function searchVideos(){

  const q =
    document.getElementById(
      "searchInput"
    ).value
    .trim()
    .toLowerCase();

  if(!q){

    renderVideos(videos);
    return;

  }


  const filtered =
    videos.filter(video=>{

      return (
        String(video.title)
          .toLowerCase()
          .includes(q)
        ||
        String(video.description || "")
          .toLowerCase()
          .includes(q)
        ||
        String(video.username || "")
          .toLowerCase()
          .includes(q)
      );

    });

  renderVideos(filtered);

}


/* PLAYER */

function openPlayer(id){

  const video =
    videos.find(
      v=>v.id===id
    );

  if(!video){
    return;
  }

  currentVideo =
    video;

  document.getElementById(
    "playerTitle"
  ).textContent =
    video.title;

  document.getElementById(
    "playerSmallTitle"
  ).textContent =
    video.title;

  document.getElementById(
    "playerUser"
  ).textContent =
    "👤 " +
    (video.username || "GyanSetu User");

  document.getElementById(
    "playerDescription"
  ).textContent =
    video.description || "";

  const main =
    document.getElementById(
      "mainVideo"
    );

  main.src =
    video.video_url;

  document.getElementById(
    "playerModal"
  ).classList.add("show");

  document.body.style.overflow="hidden";

  renderRelated(video.id);

}


function closePlayer(){

  const main =
    document.getElementById(
      "mainVideo"
    );

  main.pause();
  main.removeAttribute("src");
  main.load();

  document.getElementById(
    "playerModal"
  ).classList.remove("show");

  document.body.style.overflow="";

  currentVideo=null;

}


/* RELATED */

function renderRelated(currentId){

  const box =
    document.getElementById(
      "related"
    );

  box.innerHTML="";

  videos
  .filter(v=>v.id!==currentId)
  .slice(0,8)
  .forEach(video=>{

    const div =
      document.createElement("div");

    div.className="video-card";

    div.innerHTML=`

      <div class="thumb"
           onclick="openPlayer('${video.id}')">

        <video
          src="${escapeAttr(video.video_url)}"
          preload="metadata"
          muted
          playsinline>
        </video>

        <div class="play">
          ▶
        </div>

      </div>

      <div class="card-content">

        <div class="card-title">
          ${escapeHtml(video.title)}
        </div>

        <div class="card-meta">
          👤 ${escapeHtml(video.username || "User")}
        </div>

      </div>
    `;

    box.appendChild(div);

  });

}


/* SHARE */

async function shareCurrentVideo(){

  if(!currentVideo){
    return;
  }

  if(!currentUser){

    showToast("Login required");
    return;

  }


  const {
    data:profiles,
    error
  } =
  await supabaseClient
  .from("Profiles")
  .select("id")
  .neq(
    "id",
    currentUser.id
  );


  if(error){

    console.error(error);

    showToast(
      "Users load झाले नाहीत."
    );

    return;
  }


  if(!profiles || !profiles.length){

    showToast(
      "Share करण्यासाठी दुसरे registered users नाहीत."
    );

    return;
  }


  const message =
    "VIDEO:" +
    currentVideo.id +
    "|" +
    currentVideo.title;


  const rows =
    profiles.map(profile=>({

      sender_id:
        currentUser.id,

      receiver_id:
        profile.id,

      message:
        message,

      is_read:false

    }));


  const {
    error:sendError
  } =
  await supabaseClient
  .from("Messages")
  .insert(rows);


  if(sendError){

    console.error(sendError);

    showToast(
      "Video share करता आला नाही."
    );

    return;
  }


  showToast(
    "✅ Video सर्व registered usersना share केला."
  );

}


/* HELPERS */

function escapeHtml(text){

  const div =
    document.createElement("div");

  div.textContent =
    text ?? "";

  return div.innerHTML;

}

function escapeAttr(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}

function formatDate(value){

  if(!value){
    return "";
  }

  return new Date(value)
    .toLocaleDateString(
      [],
      {
        day:"numeric",
        month:"short",
        year:"numeric"
      }
    );

}


/* START */

async function start(){

  await getUser();

  await loadVideos();

}

start();

</script>

</body>
</html>
