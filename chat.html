<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAMSENA Chat</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
}

/* HEADER */

.header {
    height: 70px;
    background: #111;
    border-bottom: 3px solid #ff7a00;
    display: flex;
    align-items: center;
    padding: 0 15px;
}

.back {
    font-size: 30px;
    margin-right: 15px;
    cursor: pointer;
}

.avatar {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    border: 2px solid #ff7a00;
    background: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    margin-right: 12px;
}

.user-info {
    flex: 1;
}

.user-name {
    font-size: 19px;
    font-weight: bold;
}

.status {
    color: #777;
    font-size: 13px;
    margin-top: 3px;
}

/* CHAT AREA */

.chat-area {
    height: calc(100vh - 135px);
    overflow-y: auto;
    padding: 20px 15px;
    padding-bottom: 25px;
}

.welcome {
    text-align: center;
    color: #777;
    margin-top: 35px;
    font-size: 14px;
}

.message {
    max-width: 75%;
    padding: 11px 15px;
    margin: 10px 0;
    border-radius: 18px;
    font-size: 16px;
    word-wrap: break-word;
}

.received {
    background: #222;
    border: 1px solid #333;
    margin-right: auto;
    border-bottom-left-radius: 5px;
}

.sent {
    background: #ff7a00;
    color: #fff;
    margin-left: auto;
    border-bottom-right-radius: 5px;
}

/* INPUT */

.message-box {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 65px;
    background: #111;
    border-top: 2px solid #222;
    display: flex;
    align-items: center;
    padding: 8px 10px;
}

.message-input {
    flex: 1;
    height: 46px;
    border-radius: 25px;
    border: 2px solid #333;
    background: #222;
    color: white;
    outline: none;
    padding: 0 17px;
    font-size: 16px;
}

.message-input::placeholder {
    color: #888;
}

.send-button {
    width: 48px;
    height: 48px;
    margin-left: 8px;
    border: none;
    border-radius: 50%;
    background: #ff7a00;
    color: white;
    font-size: 21px;
    cursor: pointer;
}

.send-button:active {
    transform: scale(0.94);
}
</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

    <div class="back" onclick="goBack()">‹</div>

    <div class="avatar" id="avatar">
        🐯
    </div>

    <div class="user-info">
        <div class="user-name" id="userName">
            User
        </div>

        <div class="status">
            Active
        </div>
    </div>

</div>


<!-- CHAT -->

<div class="chat-area" id="chatArea">

    <div class="welcome" id="welcome">
        Start a conversation with this user 💬
    </div>

</div>


<!-- MESSAGE INPUT -->

<div class="message-box">

    <input
        id="messageInput"
        class="message-input"
        type="text"
        placeholder="Write a message..."
        autocomplete="off"
    >

    <button class="send-button" onclick="sendMessage()">
        ➤
    </button>

</div>


<script>

/* GET USER NAME FROM URL */

const params = new URLSearchParams(window.location.search);

const userName = params.get("user") || "User";

document.getElementById("userName").innerText = userName;


/* SEND MESSAGE */

function sendMessage() {

    const input = document.getElementById("messageInput");
    const text = input.value.trim();

    if (text === "") {
        return;
    }

    const chatArea = document.getElementById("chatArea");

    const welcome = document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    const message = document.createElement("div");

    message.className = "message sent";

    message.innerText = text;

    chatArea.appendChild(message);

    input.value = "";

    chatArea.scrollTop = chatArea.scrollHeight;
}


/* ENTER KEY */

document.getElementById("messageInput").addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});


/* BACK */

function goBack() {

    window.location.href = "messages.html";

}

</script>

</body>
  </html>
