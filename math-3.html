<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>इयत्ता 3री गणित | GyanSetu</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f7fb;
    color:#222;
}

/* HEADER */
header{
    background:linear-gradient(135deg,#4facfe,#00c6ff);
    color:white;
    padding:18px;
    text-align:center;
    position:relative;
}

header h1{
    font-size:26px;
}

header p{
    margin-top:5px;
    font-size:14px;
}

.back-btn{
    position:absolute;
    left:15px;
    top:18px;
    background:white;
    color:#1689d7;
    border:none;
    padding:8px 12px;
    border-radius:20px;
    font-weight:bold;
    cursor:pointer;
}

/* HERO */
.hero{
    margin:20px;
    padding:25px 20px;
    border-radius:20px;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,.15);
}

.hero h2{
    font-size:25px;
    margin-bottom:8px;
}

.hero p{
    font-size:15px;
}

/* MEDIUM BUTTON */
.medium-btn{
    display:block;
    margin:20px auto;
    padding:13px 25px;
    border:none;
    border-radius:25px;
    background:#ff9800;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

/* CHAPTER GRID */
.container{
    padding:10px 18px 30px;
}

.container h2{
    text-align:center;
    margin-bottom:18px;
    color:#333;
}

.chapter-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.chapter-card{
    background:white;
    padding:18px 12px;
    border-radius:18px;
    box-shadow:0 5px 15px rgba(0,0,0,.09);
    text-align:center;
    cursor:pointer;
    transition:.2s;
    border:2px solid transparent;
}

.chapter-card:hover{
    transform:translateY(-4px);
    border-color:#4facfe;
}

.chapter-icon{
    font-size:35px;
    margin-bottom:8px;
}

.chapter-number{
    color:#1689d7;
    font-size:13px;
    font-weight:bold;
}

.chapter-title{
    font-size:16px;
    font-weight:bold;
    margin-top:5px;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:1000;
    padding:20px;
    overflow-y:auto;
}

.modal-box{
    background:white;
    max-width:650px;
    margin:30px auto;
    border-radius:22px;
    padding:22px;
    position:relative;
    animation:popup .25s ease;
}

@keyframes popup{
    from{
        transform:scale(.9);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.close-btn{
    position:absolute;
    right:15px;
    top:12px;
    width:35px;
    height:35px;
    border:none;
    border-radius:50%;
    background:#eee;
    font-size:20px;
    cursor:pointer;
}

.modal-title{
    padding-right:40px;
    color:#1689d7;
    margin-bottom:15px;
}

.lesson-box{
    background:#f5f9ff;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
}

.lesson-box h3{
    margin-bottom:8px;
    color:#333;
}

.example{
    background:#fff3cd;
    padding:14px;
    border-radius:12px;
    margin-top:12px;
}

.remember{
    background:#e8f5e9;
    padding:14px;
    border-radius:12px;
    margin-top:12px;
    border-left:5px solid #4caf50;
}

/* QUIZ */
.quiz-section{
    margin-top:20px;
}

.question{
    background:#f8f8f8;
    padding:15px;
    border-radius:14px;
    margin-bottom:12px;
}

.question p{
    font-weight:bold;
    margin-bottom:10px;
}

.option{
    display:block;
    background:white;
    padding:10px;
    margin:6px 0;
    border:1px solid #ddd;
    border-radius:10px;
    cursor:pointer;
}

.option:hover{
    background:#eef7ff;
}

.submit-btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:25px;
    background:#1689d7;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.score-box{
    display:none;
    text-align:center;
    margin-top:15px;
    padding:18px;
    border-radius:15px;
    background:#e8f5e9;
    font-size:20px;
    font-weight:bold;
}

/* MOBILE */
@media(max-width:500px){
    .chapter-grid{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .chapter-card{
        padding:15px 8px;
    }

    .chapter-icon{
        font-size:30px;
    }

    .chapter-title{
        font-size:14px;
    }

    .hero h2{
        font-size:22px;
    }
}
</style>
</head>

/* =========================
   SHOW CHAPTERS
========================= */

function loadChapters(){

    const grid = document.getElementById("chapterGrid");

    grid.innerHTML = "";

    chaptersData.forEach((chapter,index)=>{

        const card = document.createElement("div");

        card.className = "chapter-card";

        card.onclick = function(){
            openChapter(index);
        };

        card.innerHTML = `
            <div class="chapter-icon">
                ${chapter.icon}
            </div>

            <div class="chapter-number">
                धडा ${chapter.id}
            </div>

            <div class="chapter-title">
                ${chapter.title[currentMedium]}
            </div>
        `;

        grid.appendChild(card);
    });
}


/* =========================
   MEDIUM
========================= */

function openMedium(){
    document.getElementById("mediumModal").style.display="block";
}

function closeMedium(){
    document.getElementById("mediumModal").style.display="none";
}

function setMedium(language){

    currentMedium = language;

    closeMedium();

    loadChapters();
}


/* =========================
   CHAPTER OPEN
========================= */

function openChapter(index){

    currentChapter = index;

    selectedAnswers = {};

    quizSubmitted = false;

    const chapter = chaptersData[index];

    document.getElementById("lessonTitle").innerText =
        chapter.title[currentMedium];

    document.getElementById("lessonExplanation").innerText =
        chapter.explanation[currentMedium];

    document.getElementById("lessonExample").innerText =
        chapter.example[currentMedium];

    document.getElementById("rememberText").innerText =
        currentMedium === "mr"
        ? "धडा नीट समजून घ्या आणि उदाहरणांचा सराव करा."
        : currentMedium === "hi"
        ? "पाठ को अच्छी तरह समझें और उदाहरणों का अभ्यास करें।"
        : "Understand the lesson and practise the examples.";

    document.getElementById("chapterModal").style.display="block";

    loadQuiz();
}


/* =========================
   CHAPTER CLOSE
========================= */

function closeChapter(){
    document.getElementById("chapterModal").style.display="none";
}

                        name="question${index}"
                        value="${optionIndex}"
                        onchange="selectAnswer(${index},${optionIndex})"
                    >
                    ${option}
                </label>
            `;

        });

        questionBox.innerHTML = `
            <p>
                ${index + 1}. ${question[0]}
            </p>

            ${optionsHTML}
        `;

        quizContainer.appendChild(questionBox);

    });

    document.getElementById("scoreBox").style.display = "none";
}


/* =========================
   SELECT ANSWER
========================= */

function selectAnswer(questionIndex,answerIndex){

    if(quizSubmitted) return;

    selectedAnswers[questionIndex] = answerIndex;
}


/* =========================
   SUBMIT QUIZ
========================= */

function submitQuiz(){

    if(quizSubmitted){
        return;
    }

    const questions = quizQuestions[currentMedium];

    let score = 0;

    questions.forEach((question,index)=>{

        if(
            selectedAnswers[index] !== undefined &&
            selectedAnswers[index] === question[2]
        ){
            score++;
        }

    });


    quizSubmitted = true;


    const scoreBox =
        document.getElementById("scoreBox");

    let message = "";

    if(currentMedium === "mr"){

        message =
            `🎉 तुमचा गुण: ${score} / ${questions.length}`;

    }
    else if(currentMedium === "hi"){

        message =
            `🎉 आपका स्कोर: ${score} / ${questions.length}`;

    }
    else{

        message =
            `🎉 Your Score: ${score} / ${questions.length}`;

    }


    scoreBox.innerText = message;

    scoreBox.style.display = "block";


    /* Disable all options */

    const inputs =
        document.querySelectorAll(
            '#quizContainer input'
        );

    inputs.forEach(input=>{
        input.disabled = true;
    });

}


/* =========================
   CLOSE MODAL ON OUTSIDE CLICK
========================= */

window.onclick = function(event){

    const mediumModal =
        document.getElementById("mediumModal");

    const chapterModal =
        document.getElementById("chapterModal");

    if(event.target === mediumModal){
        closeMedium();
    }

    if(event.target === chapterModal){
        closeChapter();
    }

};
loadChapters();

</script>
