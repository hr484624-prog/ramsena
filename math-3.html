/* =========================
   LOAD CHAPTERS
========================= */

function loadChapters(){

    const grid=document.getElementById("chapterGrid");

    grid.innerHTML="";

    chaptersData.forEach((chapter,index)=>{

        const card=document.createElement("div");

        card.className="chapter-card";

        card.onclick=function(){
            openChapter(index);
        };

        card.innerHTML=`

            <div class="chapter-icon">
                ${chapter.icon}
            </div>

            <div class="chapter-number">
                धडा ${chapter.id}
            </div>

            <div class="chapter-title">
                ${chapter.title[currentMedium]}
            </div>

        `;

        grid.appendChild(card);

    });
}


/* =========================
   LANGUAGE
========================= */

function openMedium(){

    document.getElementById("mediumModal").style.display="block";

}

function closeMedium(){

    document.getElementById("mediumModal").style.display="none";

}

function setMedium(language){

    currentMedium=language;

    closeMedium();

    loadChapters();

}


/* =========================
   OPEN CHAPTER
========================= */

function openChapter(index){

    currentChapter=index;

    selectedAnswers={};

    quizSubmitted=false;

    const chapter=chaptersData[index];

    document.getElementById("lessonTitle").innerText=
        chapter.title[currentMedium];

    document.getElementById("lessonExplanation").innerText=
        chapter.explanation[currentMedium];

    document.getElementById("lessonExample").innerText=
        chapter.example[currentMedium];

    if(currentMedium==="mr"){

        document.getElementById("rememberText").innerText=
        "धडा नीट समजून घ्या आणि उदाहरणांचा सराव करा.";

    }

    else if(currentMedium==="hi"){

        document.getElementById("rememberText").innerText=
        "पाठ को अच्छी तरह समझें और उदाहरणों का अभ्यास करें।";

    }

    else{

        document.getElementById("rememberText").innerText=
        "Understand the lesson and practise the examples.";

    }

    document.getElementById("chapterModal").style.display="block";

    loadQuiz();

}


/* =========================
   CLOSE CHAPTER
========================= */

function closeChapter(){

    document.getElementById("chapterModal").style.display="none";

}


/* =========================
   LOAD QUIZ
========================= */

function loadQuiz(){

    const container=document.getElementById("quizContainer");

    container.innerHTML="";

    const questions=quizQuestions[currentMedium];

    questions.forEach((q,index)=>{

        const box=document.createElement("div");

        box.className="question";

        let options="";

        q[1].forEach((option,optIndex)=>{

            options+=`

                <label class="option">

                    <input
                        type="radio"
                        name="question${index}"
                        value="${optIndex}"
                        onchange="selectAnswer(${index},${optIndex})"
                    >

                    ${option}

                </label>

            `;

        });

        box.innerHTML=`

            <p>
                ${index+1}. ${q[0]}
            </p>

            ${options}

        `;

        container.appendChild(box);

    });

    document.getElementById("scoreBox").style.display="none";

}


/* =========================
   SELECT ANSWER
========================= */

function selectAnswer(questionIndex,answerIndex){

    if(quizSubmitted) return;

    selectedAnswers[questionIndex]=answerIndex;

}


/* =========================
   SUBMIT QUIZ
========================= */

function submitQuiz(){

    if(quizSubmitted) return;

    const questions=quizQuestions[currentMedium];

    let score=0;

    questions.forEach((q,index)=>{

        if(
            selectedAnswers[index] !== undefined &&
            selectedAnswers[index] === q[2]
        ){

            score++;

        }

    });

    quizSubmitted=true;

    const scoreBox=document.getElementById("scoreBox");

    if(currentMedium==="mr"){

        scoreBox.innerText=
        `🎉 तुमचा गुण: ${score} / ${questions.length}`;

    }

    else if(currentMedium==="hi"){

        scoreBox.innerText=
        `🎉 आपका स्कोर: ${score} / ${questions.length}`;

    }

    else{

        scoreBox.innerText=
        `🎉 Your Score: ${score} / ${questions.length}`;

    }

    scoreBox.style.display="block";

    document
    .querySelectorAll("#quizContainer input")
    .forEach(input=>{

        input.disabled=true;

    });

}


/* =========================
   BACK TO LEARN
========================= */

function goBack(){

    window.location.href="learn.html";

}


/* =========================
   OUTSIDE CLICK
========================= */

window.onclick=function(event){

    const mediumModal=
        document.getElementById("mediumModal");

    const chapterModal=
        document.getElementById("chapterModal");

    if(event.target===mediumModal){

        closeMedium();

    }

    if(event.target===chapterModal){

        closeChapter();

    }

};
