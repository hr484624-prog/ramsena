<!DOCTYPE html>
<html lang="mr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>GyanSetu - Notes</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
}

.app{
  width:100%;
  max-width:430px;
  min-height:100vh;
  margin:auto;
  background:#ffffff;
}

/* HEADER */

.header{
  background:linear-gradient(135deg,#2563eb,#38bdf8);
  color:white;
  padding:18px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  position:sticky;
  top:0;
  z-index:10;
}

.back-btn{
  border:none;
  background:rgba(255,255,255,.2);
  color:white;
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:22px;
  cursor:pointer;
}

.header h2{
  margin:0;
  font-size:21px;
}

/* CONTENT */

.content{
  padding:16px;
}

/* NEW NOTE */

.note-editor{
  background:#f8fafc;
  border-radius:18px;
  padding:15px;
  border:1px solid #e2e8f0;
  margin-bottom:18px;
}

.note-title{
  width:100%;
  padding:13px;
  border:1px solid #cbd5e1;
  border-radius:12px;
  font-size:16px;
  outline:none;
  margin-bottom:10px;
}

.note-text{
  width:100%;
  min-height:150px;
  padding:13px;
  border:1px solid #cbd5e1;
  border-radius:12px;
  font-size:15px;
  resize:vertical;
  outline:none;
  font-family:Arial,sans-serif;
}

.note-title:focus,
.note-text:focus{
  border-color:#2563eb;
}

/* SAVE BUTTON */

.save-btn{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#2563eb,#0ea5e9);
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

/* SEARCH */

.search{
  width:100%;
  padding:13px;
  border:1px solid #cbd5e1;
  border-radius:12px;
  font-size:15px;
  outline:none;
  margin-bottom:16px;
}

/* NOTES TITLE */

.saved-heading{
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
}

/* NOTE CARD */

.note-card{
  background:white;
  border:1px solid #e2e8f0;
  border-radius:16px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 3px 10px rgba(0,0,0,.05);
}

.note-card h3{
  margin:0 0 8px;
  font-size:17px;
  color:#0f172a;
}

.note-card p{
  margin:0;
  color:#475569;
  font-size:14px;
  line-height:1.6;
  white-space:pre-wrap;
}

.note-date{
  margin-top:10px;
  font-size:12px;
  color:#94a3b8;
}

.note-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.edit-btn,
.delete-btn{
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
  font-size:14px;
  cursor:pointer;
}

.edit-btn{
  background:#dbeafe;
  color:#1d4ed8;
}

.delete-btn{
  background:#fee2e2;
  color:#dc2626;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:35px 10px;
  color:#94a3b8;
}

.empty-icon{
  font-size:45px;
  margin-bottom:8px;
}

</style>

</head>


<body>

<div class="app">

  <!-- HEADER -->

  <div class="header">

    <button
      class="back-btn"
      onclick="history.back()">
      ←
    </button>

    <h2>📝 Notes</h2>

  </div>


  <!-- CONTENT -->

  <div class="content">

    <!-- NOTE EDITOR -->

    <div class="note-editor">

      <input
        type="text"
        id="noteTitle"
        class="note-title"
        placeholder="Note चे नाव लिहा...">

      <textarea
        id="noteText"
        class="note-text"
        placeholder="इथे तुमची Note लिहा..."></textarea>

      <button
        class="save-btn"
        onclick="saveNote()">
        💾 Save Note
      </button>

    </div>


    <!-- SEARCH -->

    <input
      type="text"
      id="searchNotes"
      class="search"
      placeholder="🔍 Notes search करा..."
      oninput="displayNotes()">


    <!-- SAVED NOTES -->

    <div class="saved-heading">
      📚 Saved Notes
    </div>

    <div id="notesList"></div>

  </div>

</div>


<script>

/* =========================
   NOTES DATA
========================= */

let notes = JSON.parse(
  localStorage.getItem("gyansetu_notes")
) || [];

let editingId = null;


/* =========================
   SAVE NOTE
========================= */

function saveNote(){

  const title =
    document
      .getElementById("noteTitle")
      .value
      .trim();

  const text =
    document
      .getElementById("noteText")
      .value
      .trim();


  if(!title && !text){

    alert("⚠️ आधी Note लिहा.");

    return;

  }


  /* EDIT EXISTING NOTE */

  if(editingId !== null){

    const index =
      notes.findIndex(
        note => note.id === editingId
      );

    if(index !== -1){

      notes[index].title =
        title || "Untitled Note";

      notes[index].text =
        text;

      notes[index].date =
        new Date().toLocaleString("mr-IN");

    }

    editingId = null;

  }

  /* NEW NOTE */

  else{

    notes.unshift({

      id:Date.now(),

      title:
        title || "Untitled Note",

      text:text,

      date:
        new Date().toLocaleString("mr-IN")

    });

  }


  localStorage.setItem(
    "gyansetu_notes",
    JSON.stringify(notes)
  );


  document
    .getElementById("noteTitle")
    .value = "";

  document
    .getElementById("noteText")
    .value = "";


  document.querySelector(".save-btn")
    .innerText = "💾 Save Note";


  displayNotes();

}


/* =========================
   DISPLAY NOTES
========================= */

function displayNotes(){

  const list =
    document.getElementById("notesList");

  const search =
    document
      .getElementById("searchNotes")
      .value
      .toLowerCase()
      .trim();


  const filteredNotes =
    notes.filter(function(note){

      return (
        note.title
          .toLowerCase()
          .includes(search)

        ||

        note.text
          .toLowerCase()
          .includes(search)
      );

    });


  list.innerHTML = "";


  if(filteredNotes.length === 0){

    list.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          📝
        </div>

        <div>
          अजून कोणतीही Note नाही.
        </div>

      </div>

    `;

    return;

  }


  filteredNotes.forEach(function(note){

    const card =
      document.createElement("div");

    card.className = "note-card";


    card.innerHTML = `

      <h3>
        ${escapeHTML(note.title)}
      </h3>

      <p>
        ${escapeHTML(note.text)}
      </p>

      <div class="note-date">
        🕒 ${escapeHTML(note.date)}
      </div>

      <div class="note-actions">

        <button
          class="edit-btn"
          onclick="editNote(${note.id})">
          ✏️ Edit
        </button>

        <button
          class="delete-btn"
          onclick="deleteNote(${note.id})">
          🗑️ Delete
        </button>

      </div>

    `;


    list.appendChild(card);

  });

}


/* =========================
   EDIT NOTE
========================= */

function editNote(id){

  const note =
    notes.find(
      note => note.id === id
    );


  if(!note) return;


  document
    .getElementById("noteTitle")
    .value = note.title;


  document
    .getElementById("noteText")
    .value = note.text;


  editingId = id;


  document.querySelector(".save-btn")
    .innerText = "✏️ Update Note";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   DELETE NOTE
========================= */

function deleteNote(id){

  const confirmDelete =
    confirm(
      "ही Note Delete करायची आहे का?"
    );


  if(!confirmDelete) return;


  notes =
    notes.filter(
      note => note.id !== id
    );


  localStorage.setItem(
    "gyansetu_notes",
    JSON.stringify(notes)
  );


  displayNotes();

}


/* =========================
   SAFE TEXT
========================= */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   LOAD NOTES
========================= */

displayNotes();

</script>

</body>

</html>
