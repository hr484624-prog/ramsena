<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create - VIBRA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
      padding-bottom: 80px;
    }

    .top {
      background: white;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 1px solid #ddd;
    }

    .create-box {
      background: white;
      margin: 20px;
      padding: 20px;
      border-radius: 15px;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 16px;
      resize: none;
      outline: none;
    }

    .post-btn {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: none;
      border-radius: 25px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .message {
      text-align: center;
      margin-top: 20px;
      color: #555;
      display: none;
    }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 65px;
      background: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #ddd;
      font-size: 28px;
    }

    .bottom a {
      color: #111;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="top">
    Create ✨
  </div>

  <div class="create-box">

    <textarea id="postText" placeholder="What's on your mind?"></textarea>

    <button class="post-btn" onclick="createPost()">
      Create Post
    </button>

    <div class="message" id="message">
      Post created successfully! ✅
    </div>

  </div>

  <div class="bottom">
    <a href="index.html">⌂</a>
    <a href="search.html">⌕</a>
    <span>＋</span>
    <span>♡</span>
    <a href="profile.html">◯</a>
  </div>

  <script>

    function createPost() {

      let text = document.getElementById("postText").value.trim();

      if (text === "") {
        alert("Please write something first.");
        return;
      }

      document.getElementById("message").style.display = "block";

      document.getElementById("postText").value = "";

    }

  </script>

</body>
  </html>
