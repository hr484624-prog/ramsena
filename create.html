<!DOCTYPE html>
<html lang="mr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>GyanSetu - Notes</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef4ff;
  color:#0f172a;
}

.app{
  width:100%;
  max-width:430px;
  min-height:100vh;
  margin:auto;
  background:#f8fbff;
}

/* =========================
   HEADER
========================= */

.header{
  background:linear-gradient(135deg,#155eef,#38bdf8);
  color:white;
  padding:18px 16px 22px;
  border-radius:0 0 24px 24px;
  box-shadow:0 8px 25px rgba(37,99,235,.20);
}

.header-top{
  display:flex;
  align-items:center;
  gap:12px;
}

.back-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.20);
  color:white;
  font-size:23px;
  cursor:pointer;
}

.header-title{
  flex:1;
}

.header-title h2{
  margin:0;
  font-size:22px;
}

.header-title p{
  margin:4px 0 0;
  font-size:13px;
  opacity:.9;
}

.header-icon{
  font-size:31px;
}


/* =========================
   CONTENT
========================= */

.content{
  padding:17px;
}


/* =========================
   CREATE NOTE CARD
========================= */

.editor-card{
  background:white;
  border-radius:22px;
  padding:17px;
  box-shadow:0 8px 25px rgba(15,23,42,.07);
  border:1px solid #e5edf8;
  margin-bottom:18px;
}

.editor-heading{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}

.editor-heading .icon{
  width:42px;
  height:42px;
  border-radius:13px;
  background:#e8f1ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.editor-heading h3{
  margin:0;
  font-size:17px;
}

.editor-heading p{
  margin:3px 0 0;
  font-size:12px;
  color:#64748b;
}


/* =========================
   INPUT
========================= */

.note-title{
  width:100%;
  border:2px solid #e5eaf2;
  border-radius:14px;
  padding:13px;
  font-size:16px;
  outline:none;
  margin-bottom:10px;
  background:#fbfdff;
}

.note-text{
  width:100%;
  min-height:145px;
  border:2px solid #e5eaf2;
  border-radius:14px;
  padding:13px;
  font-size:15px;
  outline:none;
  resize:none;
  font-family:Arial,sans-serif;
  line-height:1.6;
  background:#fbfdff;
}

.note-title:focus,
.note-text:focus{
  border-color:#3b82f6;
  background:white;
}


/* =========================
   SAVE BUTTON
========================= */

.save-btn{
  width:100%;
  border:0;
  margin-top:12px;
  padding:14px;
  border-radius:14px;
  background:linear-gradient(135deg,#155eef,#0ea5e9);
  color:white;
  font-size:16px;
  font-weight:bold;
  box-shadow:0 7px 16px rgba(37,99,235,.22);
  cursor:pointer;
}

.save-btn:active{
  transform:scale(.98);
}


/* =========================
   SEARCH
========================= */

.search-box{
  position:relative;
  margin-bottom:17px;
}

.search-icon{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  font-size:18px;
}

.search{
  width:100%;
  padding:13px 13px 13px 43px;
  border:1px solid #dce5f1;
  border-radius:14px;
  outline:none;
  font-size:14px;
  background:white;
  box-shadow:0 5px 16px rgba(15,23,42,.04);
}


/* =========================
   SAVED HEADING
========================= */

.saved-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.saved-heading{
  font-size:18px;
  font-weight:bold;
}

.note-count{
  background:#e8f1ff;
  color:#155eef;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}


/* =========================
   NOTE CARD
========================= */

.note-card{
  background:white;
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
  border:1px solid #e3eaf4;
  box-shadow:0 6px 20px rgba(15,23,42,.06);
}

.note-card-top{
  display:flex;
  align-items:flex-start;
  gap:10px;
}

.note-small-icon{
  width:38px;
  height:38px;
  min-width:38px;
  border-radius:11px;
  background:#eff6ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
}

.note-info{
  flex:1;
  min-width:0;
}

.note-card h3{
  margin:0;
  font-size:16px;
  word-break:break-word;
}

.note-date{
  margin-top:4px;
  color:#94a3b8;
  font-size:11px;
}

.note-card p{
  margin:13px 0 0;
  color:#475569;
  font-size:14px;
  line-height:1.65;
  white-space:pre-wrap;
  word-break:break-word;
}

.note-actions{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.edit-btn,
.delete-btn{
  flex:1;
  border:0;
  padding:10px;
  border-radius:11px;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
}

.edit-btn{
  background:#e8f1ff;
  color:#155eef;
}

.delete-btn{
  background:#fff0f0;
  color:#e53935;
}


/* =========================
   EMPTY
========================= */

.empty{
  background:white;
  border-radius:20px;
  padding:35px 15px;
  text-align:center;
  border:1px solid #e3eaf4;
}

.empty-icon{
  width:65px;
  height:65px;
  margin:auto;
  border-radius:20px;
  background:#e8f1ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
}

.empty h3{
  margin:13px 0 5px;
  font-size:17px;
}

.empty p{
  margin:0;
  color:#94a3b8;
  font-size:13px;
}


/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%) translateY(90px);
  width:calc(100% - 35px);
  max-width:395px;
  background:#0f172a;
  color:white;
  padding:13px 16px;
  border-radius:14px;
  text-align:center;
  font-size:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.20);
  opacity:0;
  transition:.3s;
  z-index:9999;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

</style>

</head>


<body>

<div class="app">


<!-- =========================
     HEADER
========================= -->

<div class="header">

  <div class="header-top">

    <button
      class="back-btn"
      onclick="history.back()">
      ←
    </button>

    <div class="header-title">

      <h2>📝 My Notes</h2>

      <p>तुमच्या Notes तयार करा आणि जतन करा</p>

    </div>

    <div class="header-icon">
      📚
    </div>

  </div>

</div>



<div class="content">


<!-- =========================
     NOTE EDITOR
========================= -->

<div class="editor-card">

  <div class="editor-heading">

    <div class="icon">
      ✍️
    </div>

    <div>

      <h3 id="editorHeading">
        नवीन Note
      </h3>

      <p>
        तुमचे महत्त्वाचे विचार इथे लिहा
      </p>

    </div>

  </div>


  <input
    type="text"
    id="noteTitle"
    class="note-title"
    placeholder="Note चे नाव...">


  <textarea
    id="noteText"
    class="note-text"
    placeholder="तुमची Note इथे लिहा..."></textarea>


  <button
    class="save-btn"
    id="saveBtn"
    onclick="saveNote()">

    💾 Save Note

  </button>

</div>



<!-- =========================
     SEARCH
========================= -->

<div class="search-box">

  <span class="search-icon">
    🔍
  </span>

  <input
    type="text"
    id="searchNotes"
    class="search"
    placeholder="तुमच्या Notes शोधा..."
    oninput="displayNotes()">

</div>



<!-- =========================
     SAVED NOTES
========================= -->

<div class="saved-top">

  <div class="saved-heading">
    📚 Saved Notes
  </div>

  <div
    class="note-count"
    id="noteCount">
    0 Notes
  </div>

</div>


<div id="notesList"></div>


</div>


</div>


<!-- TOAST -->

<div
  class="toast"
  id="toast">
</div>



<script>


/* =========================
   DATA
========================= */

let notes = JSON.parse(
  localStorage.getItem("gyansetu_notes")
) || [];

let editingId = null;


/* =========================
   TOAST
========================= */

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.innerText = message;

  toast.classList.add("show");

  setTimeout(function(){

    toast.classList.remove("show");

  },2200);

}


/* =========================
   SAVE
========================= */

function saveNote(){

  const title =
    document
      .getElementById("noteTitle")
      .value
      .trim();

  const text =
    document
      .getElementById("noteText")
      .value
      .trim();


  if(!title && !text){

    showToast("✍️ आधी काहीतरी लिहा.");

    return;

  }


  if(editingId !== null){

    const index =
      notes.findIndex(
        note => note.id === editingId
      );


    if(index !== -1){

      notes[index].title =
        title || "Untitled Note";

      notes[index].text =
        text;

      notes[index].date =
        new Date().toLocaleString("mr-IN");

    }


    editingId = null;

    showToast("✅ Note Update झाली.");

  }

  else{

    notes.unshift({

      id:Date.now(),

      title:
        title || "Untitled Note",

      text:text,

      date:
        new Date().toLocaleString("mr-IN")

    });


    showToast("💾 Note Save झाली.");

  }


  localStorage.setItem(
    "gyansetu_notes",
    JSON.stringify(notes)
  );


  clearEditor();

  displayNotes();

}


/* =========================
   DISPLAY
========================= */

function displayNotes(){

  const list =
    document.getElementById("notesList");

  const search =
    document
      .getElementById("searchNotes")
      .value
      .toLowerCase()
      .trim();


  const filtered =
    notes.filter(function(note){

      return (

        note.title
          .toLowerCase()
          .includes(search)

        ||

        note.text
          .toLowerCase()
          .includes(search)

      );

    });


  document
    .getElementById("noteCount")
    .innerText =
      filtered.length +
      (filtered.length === 1
        ? " Note"
        : " Notes");


  list.innerHTML = "";


  if(filtered.length === 0){

    list.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          📝
        </div>

        <h3>
          अजून कोणतीही Note नाही
        </h3>

        <p>
          वरून तुमची पहिली Note लिहायला सुरुवात करा.
        </p>

      </div>

    `;

    return;

  }


  filtered.forEach(function(note){

    const card =
      document.createElement("div");

    card.className = "note-card";


    card.innerHTML = `

      <div class="note-card-top">

        <div class="note-small-icon">
          📝
        </div>

        <div class="note-info">

          <h3>
            ${escapeHTML(note.title)}
          </h3>

          <div class="note-date">
            🕒 ${escapeHTML(note.date)}
          </div>

        </div>

      </div>


      <p>
        ${escapeHTML(note.text)}
      </p>


      <div class="note-actions">

        <button
          class="edit-btn"
          onclick="editNote(${note.id})">

          ✏️ Edit

        </button>


        <button
          class="delete-btn"
          onclick="deleteNote(${note.id})">

          🗑️ Delete

        </button>

      </div>

    `;


    list.appendChild(card);

  });

}


/* =========================
   EDIT
========================= */

function editNote(id){

  const note =
    notes.find(
      note => note.id === id
    );


  if(!note) return;


  document
    .getElementById("noteTitle")
    .value = note.title;


  document
    .getElementById("noteText")
    .value = note.text;


  editingId = id;


  document
    .getElementById("editorHeading")
    .innerText =
      "Note Edit करा";


  document
    .getElementById("saveBtn")
    .innerText =
      "✏️ Update Note";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });


  showToast("✏️ Note Edit Mode सुरू.");

}


/* =========================
   DELETE
========================= */

function deleteNote(id){

  notes =
    notes.filter(
      note => note.id !== id
    );


  localStorage.setItem(
    "gyansetu_notes",
    JSON.stringify(notes)
  );


  displayNotes();

  showToast("🗑️ Note Delete झाली.");

}


/* =========================
   CLEAR EDITOR
========================= */

function clearEditor(){

  document
    .getElementById("noteTitle")
    .value = "";

  document
    .getElementById("noteText")
    .value = "";

  document
    .getElementById("editorHeading")
    .innerText =
      "नवीन Note";

  document
    .getElementById("saveBtn")
    .innerText =
      "💾 Save Note";

  editingId = null;

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text){

  return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


/* =========================
   LOAD
========================= */

displayNotes();


</script>

</body>

    </html>
