<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GyanSetu - Create</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f8fc;
      color: #18264d;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: auto;
      padding-bottom: 90px;
    }

    .header {
      background: white;
      padding: 18px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .back {
      font-size: 28px;
      cursor: pointer;
    }

    .title {
      font-size: 22px;
      font-weight: 800;
    }

    .plus {
      font-size: 26px;
    }

    .intro {
      margin: 18px 16px;
      padding: 22px;
      border-radius: 22px;
      background: linear-gradient(135deg, #fff0dc, #fffaf4);
      border: 1px solid #ffe0bd;
      text-align: center;
    }

    .intro-icon {
      font-size: 45px;
    }

    .intro h2 {
      margin-top: 10px;
      font-size: 21px;
    }

    .intro p {
      margin-top: 7px;
      color: #777;
      font-size: 13px;
      line-height: 1.5;
    }

    .section-title {
      margin: 22px 16px 13px;
      font-size: 19px;
      font-weight: 800;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 0 16px;
    }

    .option {
      background: white;
      border-radius: 19px;
      padding: 18px;
      min-height: 135px;
      box-shadow: 0 5px 18px rgba(0,0,0,.06);
      cursor: pointer;
    }

    .option-icon {
      font-size: 31px;
      margin-bottom: 10px;
    }

    .option h3 {
      font-size: 15px;
    }

    .option p {
      margin-top: 5px;
      color: #777;
      font-size: 11px;
      line-height: 1.4;
    }

    .tip {
      margin: 20px 16px;
      padding: 16px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.05);
    }

    .tip strong {
      font-size: 14px;
    }

    .tip p {
      margin-top: 7px;
      color: #777;
      font-size: 12px;
      line-height: 1.5;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      height: 68px;
      background: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #eee;
      z-index: 20;
    }

    .nav-item {
      text-align: center;
      font-size: 11px;
      color: #777;
      cursor: pointer;
    }

    .nav-item .icon {
      display: block;
      font-size: 22px;
      margin-bottom: 3px;
    }

    .nav-item.active {
      color: #ff7900;
      font-weight: bold;
    }
  </style>
</head>
