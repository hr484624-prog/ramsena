<!DOCTYPE html>
<html lang="mr">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>GyanSetu - Create Account</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #2196f3, #1565c0);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 20px;
      padding: 30px 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #1565c0;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2196f3;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #1565c0;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #errorMessage {
      display: none;
      margin-top: 15px;
      padding: 12px;
      background: #ffebee;
      color: #c62828;
      border-radius: 10px;
      font-size: 14px;
      word-break: break-word;
    }

    #successMessage {
      display: none;
      margin-top: 15px;
      padding: 12px;
      background: #e8f5e9;
      color: #2e7d32;
      border-radius: 10px;
      font-size: 14px;
    }

    #testMessage {
      margin-top: 12px;
      text-align: center;
      font-size: 13px;
      color: #666;
      word-break: break-word;
    }

  </style>

</head>


<body>

  <div class="box">

    <div class="logo">
      📚 GyanSetu
    </div>

    <div class="subtitle">
      तुमचे Account तयार करा
    </div>


    <label for="usernameInput">
      Username
    </label>

    <input
      type="text"
      id="usernameInput"
      placeholder="तुमचे नाव टाका"
      autocomplete="username"
    >


    <label for="emailInput">
      Email
    </label>

    <input
      type="email"
      id="emailInput"
      placeholder="example@gmail.com"
      autocomplete="email"
    >


    <label for="passwordInput">
      Password
    </label>

    <input
      type="password"
      id="passwordInput"
      placeholder="किमान 8 characters"
      autocomplete="new-password"
    >


    <button
      id="createButton"
      onclick="createAccount()">
      Create Account
    </button>


    <div id="errorMessage"></div>


    <div id="successMessage">
      ✅ Account तयार झाले!
    </div>


    <div id="testMessage">
      Appwrite connection तपासत आहे...
    </div>

  </div>


  <!-- =====================================
       APPWRITE SDK
  ====================================== -->

  <script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0"></script>


  <script>

    /* =====================================
       APPWRITE SETUP
    ====================================== */

    const client = new Appwrite.Client();

    client
      .setEndpoint(
        "https://fra.cloud.appwrite.io/v1"
      )
      .setProject(
        "6aa0017e0033d661d951"
      );


    const account =
      new Appwrite.Account(client);


    /* =====================================
       APPWRITE CONNECTION TEST
    ====================================== */
async function testConnection() {

  const test = document.getElementById("testMessage");

  try {

    const response = await fetch(
      "https://fra.cloud.appwrite.io/v1/locale",
      {
        method: "GET",
        mode: "cors",
        headers: {
          "X-Appwrite-Project": "6aa0017e0033d661d951"
        }
      }
    );

    const data = await response.json();

    console.log("Appwrite:", data);

    test.innerText = "Appwrite Connected ✅";
    test.style.color = "#2e7d32";

  } catch (err) {

    console.error("Appwrite Error:", err);

    test.innerText =
      "Appwrite Connection Failed ❌\n" +
      err.message;

    test.style.color = "#c62828";
  }
    }

      catch (err) {

        console.error(
          "APPWRITE CONNECTION ERROR:",
          err
        );


        test.innerText =
          "Appwrite Connection Failed ❌\n" +
          (
            err.message ||
            "Unknown error"
          );

        test.style.color =
          "#c62828";

      }

    }


    /* Run connection test */

    testConnection();


    /* =====================================
       CREATE ACCOUNT
    ====================================== */

    async function createAccount() {

      const username =
        document
          .getElementById("usernameInput")
          .value
          .trim();


      const email =
        document
          .getElementById("emailInput")
          .value
          .trim();


      const password =
        document
          .getElementById("passwordInput")
          .value;


      hideMessages();


      /* Username */

      if (username.length < 2) {

        showError(
          "कृपया Username टाका."
        );

        return;

      }


      /* Email */

      if (!email) {

        showError(
          "कृपया Email टाका."
        );

        return;

      }


      /* Password */

      if (password.length < 8) {

        showError(
          "Password किमान 8 characters असावा."
        );

        return;

      }


      const button =
        document.getElementById(
          "createButton"
        );


      button.disabled = true;

      button.innerText =
        "Account तयार होत आहे...";


      try {

        /* =================================
           CREATE APPWRITE ACCOUNT
        ================================== */

        const user =
          await account.create({

            userId:
              Appwrite.ID.unique(),

            email:
              email,

            password:
              password,

            name:
              username

          });


        /* =================================
           CREATE LOGIN SESSION
        ================================== */

        await account.createEmailPasswordSession({

          email:
            email,

          password:
            password

        });


        /* =================================
           SAVE LOCAL DATA
        ================================== */

        localStorage.setItem(
          "gyansetu_username",
          username
        );


        localStorage.setItem(
          "gyansetu_email",
          email
        );


        localStorage.setItem(
          "gyansetu_user_id",
          user.$id
        );


        /* =================================
           SUCCESS
        ================================== */

        document
          .getElementById(
            "successMessage"
          )
          .style.display = "block";


        button.innerText =
          "Account तयार झाले ✓";


        /* =================================
           GO HOME
        ================================== */

        setTimeout(function() {

          window.location.href =
            "home.html";

        }, 800);

      }


      catch (err) {

        console.error(
          "APPWRITE ERROR:",
          err
        );


        let message =
          "Account तयार करता आले नाही.";


        if (
          err &&
          err.message
        ) {

          const errorText =
            err.message.toLowerCase();


          /* Already exists */

          if (
            errorText.includes(
              "already exists"
            ) ||
            errorText.includes(
              "already registered"
            )
          ) {

            message =
              "हा email आधीच वापरलेला आहे.";

          }


          /* Invalid email */

          else if (
            errorText.includes(
              "invalid email"
            )
          ) {

            message =
              "कृपया योग्य email address टाका.";

          }


          /* Password */

          else if (
            errorText.includes(
              "password"
            )
          ) {

            message =
              "Password किमान 8 characters असावा.";

          }


          /* Other Appwrite error */

          else {

            message =
              err.message;

          }

        }


        showError(message);


        button.disabled = false;

        button.innerText =
          "Create Account";

      }

    }


    /* =====================================
       SHOW ERROR
    ====================================== */

    function showError(message) {

      const error =
        document.getElementById(
          "errorMessage"
        );


      error.innerText =
        "❌ " + message;


      error.style.display =
        "block";

    }


    /* =====================================
       HIDE MESSAGES
    ====================================== */

    function hideMessages() {

      document
        .getElementById(
          "errorMessage"
        )
        .style.display = "none";


      document
        .getElementById(
          "successMessage"
        )
        .style.display = "none";

    }


    /* =====================================
       ENTER KEY
    ====================================== */

    document
      .getElementById(
        "passwordInput"
      )
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            createAccount();

          }

        }
      );

  </script>


</body>

  </html>
