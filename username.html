<!DOCTYPE html>
<html lang="mr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GyanSetu - Username</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {

      font-family: Arial, sans-serif;

      background:
        linear-gradient(
          135deg,
          #eaf3ff,
          #ffffff
        );

      color: #123a70;

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

    }


    .container {

      width: 100%;

      max-width: 430px;

      padding: 25px;

      text-align: center;

    }


    /* ===============================
       LOGO
    ================================ */

    .logo {

      width: 95px;

      height: 95px;

      margin: 0 auto 20px;

      border-radius: 28px;

      background:
        linear-gradient(
          135deg,
          #0866d6,
          #3b8df5
        );

      color: white;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 48px;

      box-shadow:
        0 10px 30px
        rgba(8, 102, 214, 0.25);

    }


    /* ===============================
       TITLE
    ================================ */

    h1 {

      font-size: 30px;

      font-weight: 800;

      margin-bottom: 8px;

      color: #0b4fa3;

    }


    .tagline {

      color: #64748b;

      font-size: 14px;

      line-height: 1.5;

      margin-bottom: 35px;

    }


    /* ===============================
       CARD
    ================================ */

    .card {

      background: white;

      padding: 25px 20px;

      border-radius: 22px;

      box-shadow:
        0 8px 30px
        rgba(0, 80, 160, 0.10);

      border:
        1px solid #e2ecf8;

    }


    .welcome {

      font-size: 21px;

      font-weight: 800;

      margin-bottom: 8px;

      color: #123a70;

    }


    .info {

      font-size: 13px;

      color: #64748b;

      line-height: 1.5;

      margin-bottom: 20px;

    }


    /* ===============================
       INPUT
    ================================ */

    input {

      width: 100%;

      height: 52px;

      border:
        2px solid #dbe7f5;

      border-radius: 13px;

      padding: 0 15px;

      font-size: 16px;

      outline: none;

      color: #123a70;

      background: #fafdff;

      transition: 0.2s;

    }


    input:focus {

      border-color: #0866d6;

      background: white;

      box-shadow:
        0 0 0 3px
        rgba(8, 102, 214, 0.10);

    }


    input::placeholder {

      color: #9aa9bb;

    }


    /* ===============================
       BUTTON
    ================================ */

    button {

      width: 100%;

      height: 52px;

      margin-top: 15px;

      border: none;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          #0866d6,
          #247be5
        );

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 7px 18px
        rgba(8, 102, 214, 0.22);

      transition: 0.2s;

    }


    button:active {

      transform: scale(0.98);

    }


    /* ===============================
       ERROR
    ================================ */

    .error {

      display: none;

      margin-top: 10px;

      color: #d93025;

      font-size: 13px;

      text-align: left;

    }


    /* ===============================
       SAVED MESSAGE
    ================================ */

    .saved {

      display: none;

      margin-top: 12px;

      color: #087f5b;

      font-size: 13px;

    }


    /* ===============================
       FOOTER
    ================================ */

    .footer {

      margin-top: 25px;

      color: #7b8da3;

      font-size: 12px;

    }

  </style>

</head>


<body>


  <div class="container">


    <div class="logo">
      📚
    </div>


    <h1>
      GyanSetu
    </h1>


    <div class="tagline">
      Learn • Practice • Grow • Achieve 🚀
    </div>


    <div class="card">


      <div class="welcome">
        👋 Welcome Student!
      </div>


      <div class="info">

        GyanSetu वर तुमचं
        learning journey सुरू करण्यासाठी
        तुमचं username टाका.

      </div>


      <input
        type="text"
        id="usernameInput"
        placeholder="Enter your username"
        maxlength="20"
        autocomplete="off"
      >


      <div
        class="error"
        id="errorMessage"
      >
        कृपया username टाका.
      </div>


      <div
        class="saved"
        id="savedMessage"
      >
        ✅ Username saved!
      </div>


      <button
        onclick="continueToHome()"
      >
        Continue 🚀
      </button>


    </div>


    <div class="footer">
      🇮🇳 ज्ञानातून भविष्याकडे
    </div>


  </div>


  <script>


    /* ===============================
       CHECK SAVED USERNAME
    ================================ */

    window.addEventListener(
      "DOMContentLoaded",
      function(){

        const savedUsername =
          localStorage.getItem(
            "gyansetu_username"
          );

        /*
          Username आधीच save असेल
          तर पुन्हा विचारणार नाही.
        */

        if(
          savedUsername &&
          savedUsername.trim() !== ""
        ){

          window.location.href =
            "home.html";

        }

      }
    );


    /* ===============================
       SAVE USERNAME
    ================================ */

    function continueToHome(){

      const input =
        document.getElementById(
          "usernameInput"
        );

      const error =
        document.getElementById(
          "errorMessage"
        );

      const savedMessage =
        document.getElementById(
          "savedMessage"
        );


      const username =
        input.value.trim();


      /* Username empty */

      if(!username){

        error.style.display =
          "block";

        savedMessage.style.display =
          "none";

        input.focus();

        return;

      }


      /* Hide error */

      error.style.display =
        "none";


      /*
        Username permanently save
        until user/browser storage
        is cleared.
      */

      localStorage.setItem(
        "gyansetu_username",
        username
      );


      savedMessage.style.display =
        "block";


      /*
        थोडा delay म्हणजे
        saved message दिसेल.
      */

      setTimeout(
        function(){

          window.location.href =
            "home.html";

        },
        300
      );

    }


    /* ===============================
       ENTER KEY
    ================================ */

    document
      .getElementById("usernameInput")
      .addEventListener(
        "keydown",
        function(event){

          if(
            event.key === "Enter"
          ){

            continueToHome();

          }

        }
      );


  </script>


</body>

  </html>
