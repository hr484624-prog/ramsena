<!DOCTYPE html>
<html lang="mr">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>GyanSetu - Create Account</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        sans-serif;

      background:
        linear-gradient(
          145deg,
          #ffffff 0%,
          #eef6ff 50%,
          #d9ecff 100%
        );

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;

      background: white;

      border-radius: 26px;

      padding: 28px 24px 30px;

      box-shadow:
        0 15px 40px
        rgba(21, 101, 192, 0.18);

      border:
        1px solid #e3efff;
    }

    .flag {
      text-align: center;
      font-size: 30px;
      margin-bottom: 5px;
    }

    .logo {
      text-align: center;

      font-size: 32px;

      font-weight: 800;

      color: #1565c0;

      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;

      color: #666;

      font-size: 16px;

      margin-bottom: 25px;
    }

    .line {
      height: 4px;

      width: 70px;

      margin:
        0 auto 22px;

      border-radius: 10px;

      background:
        linear-gradient(
          to right,
          #ff9933 33%,
          white 33%,
          white 66%,
          #138808 66%
        );

      border:
        1px solid #eee;
    }

    label {
      display: block;

      margin-top: 15px;
      margin-bottom: 7px;

      font-size: 15px;

      font-weight: bold;

      color: #17324d;
    }

    input {
      width: 100%;

      padding: 14px 15px;

      border:
        2px solid #d9e7f5;

      border-radius: 12px;

      font-size: 16px;

      color: #222;

      background: #fbfdff;

      outline: none;

      transition: 0.2s;
    }

    input:focus {
      border-color: #1976d2;

      background: white;

      box-shadow:
        0 0 0 3px
        rgba(25, 118, 210, 0.10);
    }

    .create-btn {
      width: 100%;

      margin-top: 24px;

      padding: 15px;

      border: none;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          #1976d2,
          #0d47a1
        );

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 8px 18px
        rgba(21, 101, 192, 0.25);
    }

    .create-btn:active {
      transform: scale(0.98);
    }

    .create-btn:disabled {
      background: #9e9e9e;

      box-shadow: none;

      cursor: not-allowed;
    }

    #message {
      display: none;

      margin-top: 16px;

      padding: 13px;

      border-radius: 12px;

      font-size: 14px;

      line-height: 1.5;

      text-align: center;

      word-break: break-word;
    }

    .footer {
      text-align: center;

      margin-top: 22px;

      color: #777;

      font-size: 13px;
    }

    .india {
      color: #1565c0;
      font-weight: bold;
    }

  </style>

</head>


<body>

  <div class="box">

    <div class="flag">
      🇮🇳
    </div>

    <div class="logo">
      📚 GyanSetu
    </div>

    <div class="subtitle">
      तुमचे Account तयार करा
    </div>

    <div class="line"></div>


    <label for="usernameInput">
      Username
    </label>

    <input
      type="text"
      id="usernameInput"
      placeholder="तुमचे नाव टाका"
      autocomplete="username"
      maxlength="128"
    >


    <label for="emailInput">
      Email
    </label>

    <input
      type="email"
      id="emailInput"
      placeholder="example@gmail.com"
      autocomplete="email"
    >


    <label for="passwordInput">
      Password
    </label>

    <input
      type="password"
      id="passwordInput"
      placeholder="किमान 8 characters"
      autocomplete="new-password"
    >


    <button
      class="create-btn"
      id="createButton"
      onclick="createAccount()"
    >
      Create Account
    </button>


    <div id="message"></div>


    <div class="footer">
      🇮🇳 <span class="india">GyanSetu</span>
      • शिक्षणासाठी तुमचा डिजिटल साथी
    </div>

  </div>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /* ================================
       SUPABASE CONFIG
    ================================= */

    const SUPABASE_URL =
      "https://eqglttfffhvoyvrclzse.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "PASTE_YOUR_PUBLISHABLE_KEY_HERE";


    const { createClient } = supabase;


    const supabaseClient =
      createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* ================================
       CREATE ACCOUNT
    ================================= */

    async function createAccount() {

      const username =
        document
          .getElementById("usernameInput")
          .value
          .trim();


      const email =
        document
          .getElementById("emailInput")
          .value
          .trim();


      const password =
        document
          .getElementById("passwordInput")
          .value;


      const button =
        document
          .getElementById("createButton");


      messageBox(
        "",
        false,
        false
      );


      /* USERNAME */

      if (username.length < 2) {

        messageBox(
          "कृपया Username टाका.",
          false,
          true
        );

        return;
      }


      /* EMAIL */

      if (!email) {

        messageBox(
          "कृपया Email टाका.",
          false,
          true
        );

        return;
      }


      /* PASSWORD */

      if (password.length < 8) {

        messageBox(
          "Password किमान 8 characters असावा.",
          false,
          true
        );

        return;
      }


      /* BUTTON LOADING */

      button.disabled = true;

      button.innerText =
        "Account तयार होत आहे...";


      try {

        /* SUPABASE SIGN UP */

        const { data, error } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

              data: {

                username: username

              }

            }

          });


        /* ERROR */

        if (error) {

          throw error;

        }


        /* USER ID SAVE */

        if (data.user) {

          localStorage.setItem(
            "gyansetu_user_id",
            data.user.id
          );

        }


        /* USER DATA SAVE */

        localStorage.setItem(
          "gyansetu_username",
          username
        );


        localStorage.setItem(
          "gyansetu_email",
          email
        );


        /* ================================
           SESSION AVAILABLE
        ================================= */

        if (data.session) {

          messageBox(
            "✅ Account तयार झाले! GyanSetu मध्ये स्वागत आहे.",
            true,
            true
          );


          setTimeout(
            function() {

              window.location.href =
                "home.html";

            },
            1000
          );

        }

        /* ================================
           EMAIL VERIFICATION REQUIRED
        ================================= */

        else {

          messageBox(
            "✅ Account तयार झाले! तुमच्या Email वर verification link आला असेल. Email verify केल्यानंतर Login करा.",
            true,
            true
          );


          button.disabled = false;

          button.innerText =
            "Create Account";

        }


      }

      catch (error) {

        console.error(
          "SUPABASE ERROR:",
          error
        );


        let errorText =
          error.message ||
          "Account तयार करता आले नाही.";


        const lower =
          errorText.toLowerCase();


        if (
          lower.includes("already registered") ||
          lower.includes("already exists") ||
          lower.includes("user already")
        ) {

          errorText =
            "हा Email आधीच वापरला आहे.";

        }


        else if (
          lower.includes("invalid email")
        ) {

          errorText =
            "कृपया योग्य Email टाका.";

        }


        else if (
          lower.includes("password")
        ) {

          errorText =
            "Password किमान 8 characters असावा.";

        }


        messageBox(
          "❌ " + errorText,
          false,
          true
        );


        button.disabled =
          false;


        button.innerText =
          "Create Account";

      }

    }


    /* ================================
       MESSAGE BOX
    ================================= */

    function messageBox(
      text,
      success,
      show
    ) {

      const message =
        document
          .getElementById("message");


      message.innerText =
        text;


      if (!show) {

        message.style.display =
          "none";

        return;

      }


      message.style.display =
        "block";


      if (success) {

        message.style.background =
          "#e8f5e9";

        message.style.color =
          "#2e7d32";

        message.style.border =
          "1px solid #a5d6a7";

      }

      else {

        message.style.background =
          "#ffebee";

        message.style.color =
          "#c62828";

        message.style.border =
          "1px solid #ef9a9a";

      }

    }


    /* ================================
       ENTER KEY
    ================================= */

    document
      .getElementById("passwordInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            createAccount();

          }

        }
      );

  </script>

</body>

</html>
