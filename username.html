<!DOCTYPE html>
<html lang="mr">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>GyanSetu - Account</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;

      font-family: Arial, sans-serif;

      background: linear-gradient(
        145deg,
        #ffffff,
        #eef6ff,
        #d9ecff
      );

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      width: 100%;
      max-width: 420px;

      background: white;

      padding: 28px 24px 30px;

      border-radius: 26px;

      border: 1px solid #e3efff;

      box-shadow:
        0 15px 40px
        rgba(21, 101, 192, 0.18);
    }

    .flag {
      text-align: center;
      font-size: 30px;
      margin-bottom: 5px;
    }

    .logo {
      text-align: center;

      font-size: 32px;
      font-weight: 800;

      color: #1565c0;

      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;

      color: #666;

      font-size: 16px;

      margin-bottom: 22px;
    }

    .line {
      width: 70px;

      height: 4px;

      margin: 0 auto 22px;

      border-radius: 10px;

      background: linear-gradient(
        to right,
        #ff9933 33%,
        white 33%,
        white 66%,
        #138808 66%
      );

      border: 1px solid #eee;
    }

    label {
      display: block;

      margin-top: 15px;
      margin-bottom: 7px;

      font-size: 15px;

      font-weight: bold;

      color: #17324d;
    }

    input {
      width: 100%;

      padding: 14px 15px;

      border: 2px solid #d9e7f5;

      border-radius: 12px;

      font-size: 16px;

      outline: none;

      background: #fbfdff;
    }

    input:focus {
      border-color: #1976d2;

      background: white;

      box-shadow:
        0 0 0 3px
        rgba(25, 118, 210, 0.10);
    }

    .main-button {
      width: 100%;

      margin-top: 24px;

      padding: 15px;

      border: none;

      border-radius: 13px;

      background: linear-gradient(
        135deg,
        #1976d2,
        #0d47a1
      );

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 8px 18px
        rgba(21, 101, 192, 0.25);
    }

    .main-button:disabled {
      background: #9e9e9e;

      cursor: not-allowed;

      box-shadow: none;
    }

    .secondary-button {
      width: 100%;

      margin-top: 12px;

      padding: 13px;

      border: 2px solid #1976d2;

      border-radius: 13px;

      background: white;

      color: #1565c0;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;
    }

    .secondary-button:active,
    .main-button:active,
    .offline-button:active,
    .back-mode:active {
      transform: scale(0.98);
    }

    .offline-button {

      width: 100%;

      margin-top: 12px;

      padding: 14px;

      border: none;

      border-radius: 13px;

      background: linear-gradient(
        135deg,
        #00a86b,
        #087f5b
      );

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 8px 18px
        rgba(0, 128, 96, 0.20);
    }

    .offline-small {

      display: block;

      margin-top: 5px;

      font-size: 11px;

      font-weight: normal;

      opacity: .9;
    }

    #message {
      display: none;

      margin-top: 16px;

      padding: 13px;

      border-radius: 12px;

      text-align: center;

      font-size: 14px;

      line-height: 1.5;
    }

    .footer {
      text-align: center;

      margin-top: 22px;

      color: #777;

      font-size: 13px;
    }

    .india {
      color: #1565c0;

      font-weight: bold;
    }

    .account-section {
      display: none;

      margin-top: 20px;

      padding-top: 20px;

      border-top: 1px solid #e4edf7;
    }

    .account-section h3 {
      margin: 0 0 6px;

      color: #17324d;

      font-size: 18px;
    }

    .account-section p {
      margin: 0 0 14px;

      color: #777;

      font-size: 13px;

      line-height: 1.5;
    }

    .saved-account {
      width: 100%;

      display: flex;

      align-items: center;

      gap: 12px;

      padding: 12px;

      margin-bottom: 10px;

      border: 1px solid #dce9f7;

      border-radius: 14px;

      background: #f8fbff;

      cursor: pointer;

      text-align: left;
    }

    .saved-account:active {
      transform: scale(0.98);
    }

    .account-icon {
      width: 44px;

      height: 44px;

      border-radius: 50%;

      background: #e3f2fd;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 22px;

      flex-shrink: 0;
    }

    .account-info {
      flex: 1;

      min-width: 0;
    }

    .account-name {
      font-size: 15px;

      font-weight: bold;

      color: #17324d;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .account-email {
      margin-top: 3px;

      font-size: 12px;

      color: #777;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .switch-arrow {
      font-size: 20px;

      color: #1976d2;
    }

    .mode-title {
      text-align: center;

      font-size: 18px;

      font-weight: bold;

      color: #17324d;

      margin-bottom: 5px;
    }

    .mode-description {
      text-align: center;

      color: #777;

      font-size: 13px;

      line-height: 1.5;

      margin-bottom: 18px;
    }

    .back-mode {
      width: 100%;

      margin-top: 12px;

      padding: 11px;

      border: none;

      background: #f1f5f9;

      color: #455a64;

      border-radius: 11px;

      font-size: 14px;

      font-weight: bold;

      cursor: pointer;
    }

  </style>

</head>


<body>


<div class="box">

  <div class="flag">
    🇮🇳
  </div>

  <div class="logo">
    📚 GyanSetu
  </div>

  <div
    class="subtitle"
    id="subtitle"
  >
    तुमचे Account तयार करा
  </div>

  <div class="line"></div>


  <!-- CREATE ACCOUNT -->

  <div id="createSection">

    <label for="username">
      Username
    </label>

    <input
      type="text"
      id="username"
      placeholder="तुमचे नाव टाका"
      maxlength="128"
      autocomplete="username"
    >


    <label for="email">
      Email
    </label>

    <input
      type="email"
      id="email"
      placeholder="example@gmail.com"
      autocomplete="email"
    >


    <label for="password">
      Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="किमान 8 characters"
      autocomplete="new-password"
    >


    <button
      type="button"
      class="main-button"
      id="createButton"
      onclick="createAccount()"
    >
      Create Account
    </button>


    <button
      type="button"
      class="secondary-button"
      onclick="showLoginMode()"
    >
      🔐 Existing Account Login
    </button>


    <div id="message"></div>

  </div>


  <!-- LOGIN -->

  <div
    id="loginSection"
    style="display:none;"
  >

    <div class="mode-title">
      🔐 Account मध्ये Login करा
    </div>

    <div class="mode-description">
      तुमचे आधीचे Email आणि Password टाकून
      तुमचे जुने Account पुन्हा सुरू करा.
    </div>


    <label for="loginEmail">
      Email
    </label>

    <input
      type="email"
      id="loginEmail"
      placeholder="example@gmail.com"
      autocomplete="email"
    >


    <label for="loginPassword">
      Password
    </label>

    <input
      type="password"
      id="loginPassword"
      placeholder="तुमचा Password"
      autocomplete="current-password"
    >


    <button
      type="button"
      class="main-button"
      id="loginButton"
      onclick="loginAccount()"
    >
      Login
    </button>


    <button
      type="button"
      class="back-mode"
      onclick="showCreateMode()"
    >
      ← नवीन Account तयार करा
    </button>

  </div>


  <!-- SAVED ACCOUNTS -->

  <div
    class="account-section"
    id="accountSection"
  >

    <h3>
      👥 Accounts
    </h3>

    <p>
      या device वर वापरलेली accounts निवडा
      किंवा नवीन account add करा.
    </p>

    <div id="savedAccounts"></div>


    <button
      type="button"
      class="secondary-button"
      onclick="showCreateMode()"
    >
      ➕ Add another account
    </button>


    <button
      type="button"
      class="offline-button"
      onclick="openOfflineStudy()"
    >

      📥 Offline Study

      <span class="offline-small">
        Internet शिवाय Study करा
      </span>

    </button>

  </div>


  <div class="footer">

    🇮🇳

    <span class="india">
      GyanSetu
    </span>

    • शिक्षणासाठी तुमचा डिजिटल साथी

  </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================
   SUPABASE
========================= */

const supabaseClient =
  supabase.createClient(

    "https://eqglttfffhvoyvrclzse.supabase.co",

    "sb_publishable_rR4xxl0dW5DJrhhjqiFHLw_uJ-HakAb",

    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }

  );


/* =========================
   ELEMENTS
========================= */

const createSection =
  document.getElementById(
    "createSection"
  );

const loginSection =
  document.getElementById(
    "loginSection"
  );

const accountSection =
  document.getElementById(
    "accountSection"
  );

const subtitle =
  document.getElementById(
    "subtitle"
  );


/* =========================
   OFFLINE STUDY
========================= */

function openOfflineStudy() {

  window.location.href =
    "offline-study.html";

}


/* =========================
   SAVED ACCOUNTS
========================= */

function getSavedAccounts() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "gyansetu_saved_accounts"
      )
    ) || [];

  }

  catch(error) {

    return [];

  }

}


function saveAccountLocally(
  username,
  email
) {

  try {

    let accounts =
      getSavedAccounts();

    email =
      email.trim().toLowerCase();

    const exists =
      accounts.some(
        function(account) {

          return (
            account.email === email
          );

        }
      );

    if (!exists) {

      accounts.push({

        username:
          username,

        email:
          email

      });

    }

    localStorage.setItem(

      "gyansetu_saved_accounts",

      JSON.stringify(accounts)

    );

  }

  catch(error) {

    console.error(
      "LOCAL ACCOUNT ERROR:",
      error
    );

  }

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text || "";

  return div.innerHTML;

}


/* =========================
   CHECK SESSION
   IMPORTANT
========================= */

async function checkAlreadyLoggedIn() {

  try {

    const {
      data: {
        session
      }
    } =
      await supabaseClient.auth.getSession();


    /*
       जर User आधीच Login असेल
       तर Username page दाखवायचा नाही.
       थेट Home page वर पाठवायचे.
    */

    if (session && session.user) {

      const user =
        session.user;


      const username =
        user.user_metadata?.username
        ||
        localStorage.getItem(
          "gyansetu_username"
        )
        ||
        "Learner";


      const email =
        user.email || "";


      localStorage.setItem(
        "gyansetu_username",
        username
      );


      localStorage.setItem(
        "gyansetu_email",
        email
      );


      localStorage.setItem(
        "gyansetu_user_id",
        user.id
      );


      if (email) {

        saveAccountLocally(
          username,
          email
        );

      }


      /*
         ⭐ MAIN FIX ⭐
         Already logged in =
         username.html बंद करून
         थेट home.html
      */

      window.location.replace(
        "home.html"
      );

      return;

    }


    /*
       Session नाही तरच
       Create Account page दाखवा.
    */

    showCreateMode();

  }

  catch(error) {

    console.error(
      "SESSION CHECK ERROR:",
      error
    );

    showCreateMode();

  }

}


/*
   Page load झाल्यावर लगेच session check
*/

checkAlreadyLoggedIn();


/* =========================
   CREATE MODE
========================= */

function showCreateMode() {

  createSection.style.display =
    "block";

  loginSection.style.display =
    "none";

  subtitle.innerText =
    "तुमचे Account तयार करा";

  clearMessage();

}


/* =========================
   LOGIN MODE
========================= */

function showLoginMode(
  emailValue = ""
) {

  createSection.style.display =
    "none";

  loginSection.style.display =
    "block";

  subtitle.innerText =
    "तुमच्या Account मध्ये प्रवेश करा";

  document.getElementById(
    "loginEmail"
  ).value =
    emailValue;

  document.getElementById(
    "loginPassword"
  ).value = "";

  clearMessage();

  document.getElementById(
    "loginEmail"
  ).focus();

}


/* =========================
   CREATE ACCOUNT
========================= */

async function createAccount() {

  const username =
    document
      .getElementById("username")
      .value
      .trim();

  const email =
    document
      .getElementById("email")
      .value
      .trim()
      .toLowerCase();

  const password =
    document
      .getElementById("password")
      .value;

  const button =
    document.getElementById(
      "createButton"
    );


  if (username.length < 2) {

    showMessage(
      "कृपया Username टाका.",
      false
    );

    return;

  }


  if (
    !email ||
    !email.includes("@")
  ) {

    showMessage(
      "कृपया योग्य Email टाका.",
      false
    );

    return;

  }


  if (password.length < 8) {

    showMessage(
      "Password किमान 8 characters असावा.",
      false
    );

    return;

  }


  button.disabled =
    true;

  button.innerText =
    "Account तयार होत आहे...";


  try {

    /*
       नवीन account तयार करण्यापूर्वी
       current session logout.
    */

    await supabaseClient.auth.signOut();


    const {
      data,
      error
    } =
      await supabaseClient.auth.signUp({

        email:
          email,

        password:
          password,

        options: {

          data: {

            username:
              username

          }

        }

      });


    if (error) {

      throw error;

    }


    if (!data.user) {

      throw new Error(
        "Account तयार झाले नाही."
      );

    }


    /*
       Email confirmation ON असल्यास
       session मिळणार नाही.
    */

    if (!data.session) {

      saveAccountLocally(
        username,
        email
      );

      showMessage(
        "Account तयार झाले आहे. Email confirm करून Login करा.",
        true
      );

      button.disabled =
        false;

      button.innerText =
        "Create Account";

      return;

    }


    /* =========================
       SAVE PROFILE
    ========================= */

    const {
      error: profileError
    } =
      await supabaseClient
        .from("Profiles")
        .insert({

          id:
            data.user.id,

          username:
            username

        });


    if (profileError) {

      console.error(
        "PROFILE ERROR:",
        profileError
      );

    }


    /* =========================
       SAVE LOCAL INFO
    ========================= */

    localStorage.setItem(
      "gyansetu_username",
      username
    );

    localStorage.setItem(
      "gyansetu_email",
      email
    );

    localStorage.setItem(
      "gyansetu_user_id",
      data.user.id
    );


    saveAccountLocally(
      username,
      email
    );


    showMessage(
      "✅ Account तयार झाले! GyanSetu मध्ये स्वागत आहे.",
      true
    );


    /*
       Account तयार झाल्यावर
       थेट Home page.
    */

    setTimeout(
      function() {

        window.location.replace(
          "home.html"
        );

      },
      500
    );


  }

  catch(error) {

    console.error(
      "SUPABASE ERROR:",
      error
    );


    let text =
      error.message
      ||
      "Account तयार करता आले नाही.";


    const lower =
      text.toLowerCase();


    if (

      lower.includes(
        "already registered"
      )

      ||

      lower.includes(
        "already exists"
      )

      ||

      lower.includes(
        "user already registered"
      )

      ||

      lower.includes(
        "email already"
      )

    ) {

      showMessage(
        "⚠️ हा Email आधीच वापरला आहे. Login करा.",
        false
      );


      setTimeout(
        function() {

          showLoginMode(
            email
          );

        },
        800
      );

    }

    else if (

      lower.includes(
        "invalid email"
      )

    ) {

      showMessage(
        "कृपया योग्य Email टाका.",
        false
      );

    }

    else if (

      lower.includes(
        "rate limit"
      )

      ||

      lower.includes(
        "too many requests"
      )

    ) {

      showMessage(
        "खूप वेळा प्रयत्न झाले आहेत. थोड्या वेळाने पुन्हा प्रयत्न करा.",
        false
      );

    }

    else {

      showMessage(
        "❌ " + text,
        false
      );

    }


    button.disabled =
      false;

    button.innerText =
      "Create Account";

  }

}


/* =========================
   LOGIN
========================= */

async function loginAccount() {

  const email =
    document
      .getElementById(
        "loginEmail"
      )
      .value
      .trim()
      .toLowerCase();


  const password =
    document
      .getElementById(
        "loginPassword"
      )
      .value;


  const button =
    document.getElementById(
      "loginButton"
    );


  if (
    !email ||
    !email.includes("@")
  ) {

    showMessage(
      "कृपया योग्य Email टाका.",
      false
    );

    return;

  }


  if (!password) {

    showMessage(
      "कृपया Password टाका.",
      false
    );

    return;

  }


  button.disabled =
    true;

  button.innerText =
    "Login होत आहे...";


  try {

    await supabaseClient.auth.signOut();


    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({

        email:
          email,

        password:
          password

      });


    if (error) {

      throw error;

    }


    if (!data.user) {

      throw new Error(
        "Login करता आले नाही."
      );

    }


    /* =========================
       GET USERNAME
    ========================= */

    let username =
      data.user.user_metadata?.username
      ||
      "Learner";


    try {

      const {
        data: profile
      } =
        await supabaseClient
          .from("Profiles")
          .select("username")
          .eq(
            "id",
            data.user.id
          )
          .maybeSingle();


      if (
        profile &&
        profile.username
      ) {

        username =
          profile.username;

      }

    }

    catch(profileError) {

      console.error(
        "PROFILE FETCH ERROR:",
        profileError
      );

    }


    /* =========================
       SAVE ACCOUNT
    ========================= */

    localStorage.setItem(
      "gyansetu_username",
      username
    );

    localStorage.setItem(
      "gyansetu_email",
      email
    );

    localStorage.setItem(
      "gyansetu_user_id",
      data.user.id
    );


    saveAccountLocally(
      username,
      email
    );


    showMessage(
      "✅ Login successful! Welcome back.",
      true
    );


    /*
       Login झाल्यावर थेट Home.
    */

    setTimeout(
      function() {

        window.location.replace(
          "home.html"
        );

      },
      400
    );


  }

  catch(error) {

    console.error(
      "LOGIN ERROR:",
      error
    );


    let text =
      error.message
      ||
      "Login करता आले नाही.";


    const lower =
      text.toLowerCase();


    if (

      lower.includes(
        "invalid login credentials"
      )

      ||

      lower.includes(
        "invalid credentials"
      )

    ) {

      text =
        "Email किंवा Password चुकीचा आहे.";

    }

    else if (

      lower.includes(
        "email not confirmed"
      )

    ) {

      text =
        "तुमचा Email अजून confirm केलेला नाही.";

    }


    showMessage(
      "❌ " + text,
      false
    );


    button.disabled =
      false;

    button.innerText =
      "Login";

  }

}


/* =========================
   MESSAGE
========================= */

function showMessage(
  text,
  success
) {

  const message =
    document.getElementById(
      "message"
    );


  message.innerText =
    text;


  message.style.display =
    "block";


  if (success) {

    message.style.background =
      "#e8f5e9";

    message.style.color =
      "#2e7d32";

    message.style.border =
      "1px solid #a5d6a7";

  }

  else {

    message.style.background =
      "#ffebee";

    message.style.color =
      "#c62828";

    message.style.border =
      "1px solid #ef9a9a";

  }

}


/* =========================
   CLEAR MESSAGE
========================= */

function clearMessage() {

  const message =
    document.getElementById(
      "message"
    );


  message.innerText =
    "";

  message.style.display =
    "none";

}


/* =========================
   ENTER KEY
========================= */

document
  .getElementById("password")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        createAccount();

      }

    }
  );


document
  .getElementById("loginPassword")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        loginAccount();

      }

    }
  );

</script>
