<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GyanSetu - Welcome</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff4e8, #ffffff);
      color: #18264d;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 430px;
      padding: 25px;
      text-align: center;
    }

    .logo {
      width: 95px;
      height: 95px;
      margin: 0 auto 20px;
      border-radius: 28px;
      background: linear-gradient(135deg, #ff7900, #ffad42);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      box-shadow: 0 10px 30px rgba(255, 121, 0, 0.25);
    }

    h1 {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .tagline {
      color: #777;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 35px;
    }

    .card {
      background: white;
      padding: 25px 20px;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .welcome {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .info {
      font-size: 13px;
      color: #777;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      height: 52px;
      border: 2px solid #e5e5e5;
      border-radius: 13px;
      padding: 0 15px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #ff7900;
    }

    button {
      width: 100%;
      height: 52px;
      margin-top: 15px;
      border: none;
      border-radius: 13px;
      background: #ff7900;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .error {
      display: none;
      margin-top: 10px;
      color: #d93025;
      font-size: 13px;
    }

    .footer {
      margin-top: 25px;
      color: #999;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      📚
    </div>

    <h1>GyanSetu</h1>

    <div class="tagline">
      Learn • Practice • Grow • Achieve 🚀
    </div>

    <div class="card">

      <div class="welcome">
        👋 Welcome Student!
      </div>

      <div class="info">
        GyanSetu वर तुमचं learning journey सुरू करण्यासाठी
        तुमचं username टाका.
      </div>

      <input
        type="text"
        id="usernameInput"
        placeholder="Enter your username"
        maxlength="20"
        autocomplete="off"
      >

      <div class="error" id="errorMessage">
        कृपया username टाका.
      </div>

      <button onclick="continueToHome()">
        Continue 🚀
      </button>

    </div>

    <div class="footer">
      🇮🇳 ज्ञानातून भविष्याकडे
    </div>

  </div>


  <script>

    function continueToHome() {

      const input =
        document.getElementById("usernameInput");

      const error =
        document.getElementById("errorMessage");

      const username =
        input.value.trim();

      if (!username) {

        error.style.display = "block";
        input.focus();

        return;
      }

      // Username save करा
      localStorage.setItem(
        "gyansetu_username",
        username
      );

      // Home page वर जा
      window.location.href = "home.html";
    }


    // Enter key नेसुद्धा Continue होईल
    document
      .getElementById("usernameInput")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          continueToHome();
        }

      });

  </script>

</body>
</html>
