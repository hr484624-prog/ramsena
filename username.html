<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GyanSetu - Username</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(180deg, #fffaf2, #fff1d8);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      position: relative;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Indian style decoration */
    .top-design {
      position: absolute;
      top: -50px;
      right: -50px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: linear-gradient(
        135deg,
        #ff8a00 0%,
        #ff8a00 33%,
        white 33%,
        white 66%,
        #138808 66%
      );
      opacity: 0.9;
    }

    .logo-area {
      text-align: center;
      margin-bottom: 35px;
      position: relative;
      z-index: 2;
    }

    .logo {
      width: 82px;
      height: 82px;
      margin: auto;
      border-radius: 50%;
      background: white;
      border: 5px solid #ff8a00;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }

    .brand {
      margin-top: 15px;
      font-size: 38px;
      font-weight: 800;
      color: #18264d;
    }

    .brand span {
      color: #ff7900;
    }

    .tagline {
      margin-top: 7px;
      font-size: 17px;
      color: #555;
      font-weight: 600;
    }

    .card {
      background: rgba(255,255,255,0.96);
      border-radius: 24px;
      padding: 28px 20px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.12);
      position: relative;
      z-index: 2;
    }

    .title {
      text-align: center;
      font-size: 23px;
      color: #18264d;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .input-box {
      display: flex;
      align-items: center;
      border: 2px solid #e2e2e2;
      border-radius: 14px;
      padding: 0 14px;
      height: 55px;
      background: #fff;
      transition: 0.2s;
    }

    .input-box:focus-within {
      border-color: #ff8500;
      box-shadow: 0 0 0 3px rgba(255,133,0,0.12);
    }

    .at {
      font-size: 21px;
      color: #ff7900;
      font-weight: bold;
      margin-right: 7px;
    }

    input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 16px;
      color: #222;
      background: transparent;
    }

    input::placeholder {
      color: #999;
    }

    .note {
      text-align: center;
      margin-top: 12px;
      font-size: 12px;
      color: #777;
    }

    .continue-btn {
      width: 100%;
      height: 55px;
      border: none;
      border-radius: 14px;
      margin-top: 22px;
      background: linear-gradient(90deg, #ff7900, #ff9d00);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(255,121,0,0.25);
    }

    .continue-btn:active {
      transform: scale(0.98);
    }

    .terms {
      text-align: center;
      font-size: 11px;
      color: #888;
      margin-top: 20px;
      line-height: 1.6;
    }

    .terms span {
      color: #ff7900;
      font-weight: bold;
    }

    .bottom-design {
      position: absolute;
      bottom: -80px;
      left: -30px;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: linear-gradient(
        135deg,
        #138808 0%,
        #138808 33%,
        white 33%,
        white 66%,
        #ff8a00 66%
      );
      opacity: 0.12;
    }

    @media (max-height: 650px) {
      .app {
        padding-top: 15px;
        padding-bottom: 15px;
      }

      .logo-area {
        margin-bottom: 20px;
      }

      .logo {
        width: 65px;
        height: 65px;
        font-size: 32px;
      }

      .brand {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="top-design"></div>

    <div class="logo-area">

      <div class="logo">🧠</div>

      <div class="brand">
        Gyan<span>Setu</span>
      </div>

      <div class="tagline">
        ज्ञान प्रत्येकासाठी 🇮🇳
      </div>

    </div>


    <div class="card">

      <div class="title">
        तुमचं Username टाका
      </div>

      <div class="subtitle">
        GyanSetu वर तुमची ओळख तयार करा
      </div>

      <div class="input-box">

        <div class="at">@</div>

        <input
          type="text"
          id="username"
          placeholder="Enter username"
          maxlength="20"
          autocomplete="off"
        >

      </div>

      <div class="note">
        Username नंतर बदलता येणार नाही.
      </div>

      <button class="continue-btn" onclick="continueApp()">
        Continue&nbsp;&nbsp; →
      </button>

      <div class="terms">
        Continue करून तुम्ही आमच्या<br>
        <span>Terms</span> आणि <span>Privacy Policy</span> शी सहमत आहात.
      </div>

    </div>

    <div class="bottom-design"></div>

  </div>


  <script>

    function continueApp() {

      let username = document.getElementById("username").value.trim();

      if (username === "") {
        alert("कृपया Username टाका.");
        return;
      }

      username = username.replace(/\s+/g, "");

      if (username.length < 3) {
        alert("Username कमीत कमी 3 अक्षरांचा असावा.");
        return;
      }

      // Username फोनमध्ये save होईल
      localStorage.setItem("gyansetu_username", username);

      // पुढे Home Page जोडू
      window.location.href = "home.html";
    }

  </script>

</body>
  </html>
