<!DOCTYPE html>
<html lang="mr">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>GyanSetu - Create Account</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;

      font-family: Arial, sans-serif;

      background: linear-gradient(
        145deg,
        #ffffff,
        #eef6ff,
        #d9ecff
      );

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      width: 100%;
      max-width: 420px;

      background: white;

      padding: 28px 24px 30px;

      border-radius: 26px;

      border: 1px solid #e3efff;

      box-shadow:
        0 15px 40px
        rgba(21, 101, 192, 0.18);
    }

    .flag {
      text-align: center;
      font-size: 30px;
      margin-bottom: 5px;
    }

    .logo {
      text-align: center;

      font-size: 32px;
      font-weight: 800;

      color: #1565c0;

      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;

      color: #666;

      font-size: 16px;

      margin-bottom: 22px;
    }

    .line {
      width: 70px;
      height: 4px;

      margin: 0 auto 22px;

      border-radius: 10px;

      background: linear-gradient(
        to right,
        #ff9933 33%,
        white 33%,
        white 66%,
        #138808 66%
      );

      border: 1px solid #eee;
    }

    label {
      display: block;

      margin-top: 15px;
      margin-bottom: 7px;

      font-size: 15px;
      font-weight: bold;

      color: #17324d;
    }

    input {
      width: 100%;

      padding: 14px 15px;

      border: 2px solid #d9e7f5;

      border-radius: 12px;

      font-size: 16px;

      outline: none;

      background: #fbfdff;
    }

    input:focus {
      border-color: #1976d2;

      background: white;

      box-shadow:
        0 0 0 3px
        rgba(25, 118, 210, 0.10);
    }

    button {
      width: 100%;

      margin-top: 24px;

      padding: 15px;

      border: none;

      border-radius: 13px;

      background: linear-gradient(
        135deg,
        #1976d2,
        #0d47a1
      );

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 8px 18px
        rgba(21, 101, 192, 0.25);
    }

    button:disabled {
      background: #9e9e9e;
      cursor: not-allowed;
      box-shadow: none;
    }

    #message {
      display: none;

      margin-top: 16px;

      padding: 13px;

      border-radius: 12px;

      text-align: center;

      font-size: 14px;

      line-height: 1.5;
    }

    .footer {
      text-align: center;

      margin-top: 22px;

      color: #777;

      font-size: 13px;
    }

    .india {
      color: #1565c0;
      font-weight: bold;
    }

  </style>

</head>


<body>

  <div class="box">

    <div class="flag">
      🇮🇳
    </div>

    <div class="logo">
      📚 GyanSetu
    </div>

    <div class="subtitle">
      तुमचे Account तयार करा
    </div>

    <div class="line"></div>


    <label for="username">
      Username
    </label>

    <input
      type="text"
      id="username"
      placeholder="तुमचे नाव टाका"
      maxlength="128"
      autocomplete="username"
    >


    <label for="email">
      Email
    </label>

    <input
      type="email"
      id="email"
      placeholder="example@gmail.com"
      autocomplete="email"
    >


    <label for="password">
      Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="किमान 8 characters"
      autocomplete="new-password"
    >


    <button
      id="createButton"
      onclick="createAccount()"
    >
      Create Account
    </button>


    <div id="message"></div>


    <div class="footer">
      🇮🇳
      <span class="india">GyanSetu</span>
      • शिक्षणासाठी तुमचा डिजिटल साथी
    </div>

  </div>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /* =========================
       SUPABASE
    ========================= */

    const supabaseClient = supabase.createClient(

      "https://eqglttfffhvoyvrclzse.supabase.co",

      "sb_publishable_rR4xxl0dW5DJrhhjqiFHLw_uJ-HakAb"

    );


    /* =========================
       CREATE ACCOUNT
    ========================= */

    async function createAccount() {

      const username =
        document
          .getElementById("username")
          .value
          .trim();


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      const button =
        document.getElementById(
          "createButton"
        );


      /* CHECK USERNAME */

      if (username.length < 2) {

        showMessage(
          "कृपया Username टाका.",
          false
        );

        return;
      }


      /* CHECK EMAIL */

      if (
        !email ||
        !email.includes("@")
      ) {

        showMessage(
          "कृपया योग्य Email टाका.",
          false
        );

        return;
      }


      /* CHECK PASSWORD */

      if (password.length < 8) {

        showMessage(
          "Password किमान 8 characters असावा.",
          false
        );

        return;
      }


      /* LOADING */

      button.disabled = true;

      button.innerText =
        "Account तयार होत आहे...";


      try {

        /* =========================
           CREATE SUPABASE ACCOUNT
        ========================= */

        const {
          data,
          error
        } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

              data: {

                username: username

              }

            }

          });


        /* ERROR */

        if (error) {

          throw error;

        }


        /* USER NOT CREATED */

        if (!data.user) {

          throw new Error(
            "Account तयार झाले नाही."
          );

        }


        /* =========================
           CHECK SESSION
        ========================= */

        if (!data.session) {

          throw new Error(
            "Account तयार झाला, पण Login Session मिळाली नाही. Supabase मध्ये Confirm Email OFF आहे का ते तपासा."
          );

        }


        /* =========================
           SAVE PROFILE
        ========================= */

        const {
          error: profileError
        } =
          await supabaseClient
            .from("Profiles")
            .insert({

              id: data.user.id,

              username: username

            });


        /* PROFILE ERROR */

        if (profileError) {

          console.error(
            "PROFILE ERROR:",
            profileError
          );

          throw new Error(
            "Account तयार झाला पण Username database मध्ये save करता आला नाही."
          );

        }


        /* =========================
           SAVE LOCAL INFORMATION
        ========================= */

        localStorage.setItem(
          "gyansetu_username",
          username
        );


        localStorage.setItem(
          "gyansetu_email",
          email
        );


        localStorage.setItem(
          "gyansetu_user_id",
          data.user.id
        );


        /* =========================
           SUCCESS
        ========================= */

        showMessage(
          "✅ Account तयार झाले! GyanSetu मध्ये स्वागत आहे.",
          true
        );


        setTimeout(function() {

          window.location.href =
            "home.html";

        }, 700);


      }

      catch (error) {

        console.error(
          "SUPABASE ERROR:",
          error
        );


        let text =
          error.message ||
          "Account तयार करता आले नाही.";


        const lower =
          text.toLowerCase();


        /* ALREADY REGISTERED */

        if (
          lower.includes(
            "already registered"
          ) ||
          lower.includes(
            "already exists"
          ) ||
          lower.includes(
            "user already registered"
          )
        ) {

          text =
            "हा Email आधीच वापरला आहे.";

        }


        /* INVALID EMAIL */

        else if (
          lower.includes(
            "invalid email"
          )
        ) {

          text =
            "कृपया योग्य Email टाका.";

        }


        /* RATE LIMIT */

        else if (
          lower.includes(
            "rate limit"
          ) ||
          lower.includes(
            "too many requests"
          )
        ) {

          text =
            "खूप वेळा प्रयत्न झाले आहेत. थोड्या वेळाने पुन्हा प्रयत्न करा.";

        }


        /* DUPLICATE PROFILE */

        else if (
          lower.includes(
            "duplicate"
          )
        ) {

          text =
            "हा Profile आधीच तयार आहे.";

        }


        showMessage(
          "❌ " + text,
          false
        );


        button.disabled = false;

        button.innerText =
          "Create Account";

      }

    }


    /* =========================
       MESSAGE
    ========================= */

    function showMessage(
      text,
      success
    ) {

      const message =
        document.getElementById(
          "message"
        );


      message.innerText =
        text;


      message.style.display =
        "block";


      if (success) {

        message.style.background =
          "#e8f5e9";

        message.style.color =
          "#2e7d32";

        message.style.border =
          "1px solid #a5d6a7";

      }

      else {

        message.style.background =
          "#ffebee";

        message.style.color =
          "#c62828";

        message.style.border =
          "1px solid #ef9a9a";

      }

    }


    /* =========================
       ENTER KEY
    ========================= */

    document
      .getElementById("password")
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            createAccount();

          }

        }
      );

  </script>

</body>

      </html>
