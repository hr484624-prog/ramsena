<!DOCTYPE html>
<html lang="mr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GyanSetu - Create Account</title>

  <!-- Appwrite SDK -->
  <script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {

      font-family: Arial, sans-serif;

      background:
        linear-gradient(
          135deg,
          #eaf3ff,
          #ffffff
        );

      color: #123a70;

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

    }

    .container {

      width: 100%;

      max-width: 430px;

      padding: 25px;

      text-align: center;

    }

    .logo {

      width: 95px;

      height: 95px;

      margin: 0 auto 20px;

      border-radius: 28px;

      background:
        linear-gradient(
          135deg,
          #0866d6,
          #3b8df5
        );

      color: white;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 48px;

      box-shadow:
        0 10px 30px
        rgba(8, 102, 214, 0.25);

    }

    h1 {

      font-size: 30px;

      font-weight: 800;

      margin-bottom: 8px;

      color: #0b4fa3;

    }

    .tagline {

      color: #64748b;

      font-size: 14px;

      line-height: 1.5;

      margin-bottom: 30px;

    }

    .card {

      background: white;

      padding: 25px 20px;

      border-radius: 22px;

      box-shadow:
        0 8px 30px
        rgba(0, 80, 160, 0.10);

      border:
        1px solid #e2ecf8;

    }

    .welcome {

      font-size: 21px;

      font-weight: 800;

      margin-bottom: 8px;

      color: #123a70;

    }

    .info {

      font-size: 13px;

      color: #64748b;

      line-height: 1.5;

      margin-bottom: 20px;

    }

    input {

      width: 100%;

      height: 52px;

      border:
        2px solid #dbe7f5;

      border-radius: 13px;

      padding: 0 15px;

      font-size: 16px;

      outline: none;

      color: #123a70;

      background: #fafdff;

      margin-bottom: 12px;

    }

    input:focus {

      border-color: #0866d6;

      background: white;

      box-shadow:
        0 0 0 3px
        rgba(8, 102, 214, 0.10);

    }

    button {

      width: 100%;

      height: 52px;

      margin-top: 5px;

      border: none;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          #0866d6,
          #247be5
        );

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 7px 18px
        rgba(8, 102, 214, 0.22);

    }

    button:disabled {

      opacity: 0.6;

      cursor: not-allowed;

    }

    .error {

      display: none;

      margin-top: 12px;

      color: #d93025;

      font-size: 13px;

      text-align: left;

      line-height: 1.5;

    }

    .success {

      display: none;

      margin-top: 12px;

      color: #087f5b;

      font-size: 13px;

    }

    .footer {

      margin-top: 25px;

      color: #7b8da3;

      font-size: 12px;

    }

  </style>

</head>


<body>


  <div class="container">


    <div class="logo">
      📚
    </div>


    <h1>
      GyanSetu
    </h1>


    <div class="tagline">
      Learn • Practice • Grow • Achieve 🚀
    </div>


    <div class="card">


      <div class="welcome">
        👋 Welcome Student!
      </div>


      <div class="info">

        GyanSetu वर तुमचं account तयार करा
        आणि तुमचं learning journey सुरू करा.

      </div>


      <!-- USERNAME -->

      <input
        type="text"
        id="usernameInput"
        placeholder="Enter your username"
        maxlength="20"
        autocomplete="username"
      >


      <!-- EMAIL -->

      <input
        type="email"
        id="emailInput"
        placeholder="Enter your email"
        autocomplete="email"
      >


      <!-- PASSWORD -->

      <input
        type="password"
        id="passwordInput"
        placeholder="Create password"
        minlength="8"
        autocomplete="new-password"
      >


      <div
        class="error"
        id="errorMessage"
      ></div>


      <div
        class="success"
        id="successMessage"
      >
        ✅ Account तयार होत आहे...
      </div>


      <button
        id="createButton"
        onclick="createAccount()"
      >
        Create Account 🚀
      </button>


    </div>


    <div class="footer">
      🇮🇳 ज्ञानातून भविष्याकडे
    </div>


  </div>


  <script>

    /* =====================================
       APPWRITE SETUP
    ====================================== */

    const client = new Appwrite.Client();

    client
      .setEndpoint(
        "https://fra.cloud.appwrite.io/v1"
      )
      .setProject(
        "6aa0017e0033d661d951"
      );


    const account =
      new Appwrite.Account(client);


    /* =====================================
       CREATE ACCOUNT
    ====================================== */

    async function createAccount() {

      const username =
        document
          .getElementById("usernameInput")
          .value
          .trim();

      const email =
        document
          .getElementById("emailInput")
          .value
          .trim();

      const password =
        document
          .getElementById("passwordInput")
          .value;

      const error =
        document
          .getElementById("errorMessage");

      const success =
        document
          .getElementById("successMessage");

      const button =
        document
          .getElementById("createButton");


      /* Hide old messages */

      error.style.display = "none";

      success.style.display = "none";


      /* =====================================
         USERNAME CHECK
      ====================================== */

      if (!username) {

        showError(
          "कृपया username टाका."
        );

        return;

      }


      if (username.length < 3) {

        showError(
          "Username कमीत कमी 3 characters असावा."
        );

        return;

      }


      /* =====================================
         EMAIL CHECK
      ====================================== */

      if (!email) {

        showError(
          "कृपया email टाका."
        );

        return;

      }


      /* =====================================
         PASSWORD CHECK
      ====================================== */

      if (!password) {

        showError(
          "कृपया password टाका."
        );

        return;

      }


      if (password.length < 8) {

        showError(
          "Password कमीत कमी 8 characters असावा."
        );

        return;

      }


      /* =====================================
         DISABLE BUTTON
      ====================================== */

      button.disabled = true;

      button.innerText =
        "Creating Account...";


      try {


        /* =====================================
           APPWRITE ACCOUNT CREATE
        ====================================== */

        const user =
          await account.create(
            Appwrite.ID.unique(),
            email,
            password,
            username
          );


        console.log(
          "Account created:",
          user
        );


        /* =====================================
           CREATE LOGIN SESSION
        ====================================== */

        await account.createEmailPasswordSession(
          email,
          password
        );


        /* =====================================
           SAVE USERNAME LOCALLY
        ====================================== */

        localStorage.setItem(
          "gyansetu_username",
          username
        );


        localStorage.setItem(
          "gyansetu_email",
          email
        );


        localStorage.setItem(
          "gyansetu_user_id",
          user.$id
        );


        /* =====================================
           SUCCESS
        ====================================== */

        success.style.display =
          "block";

        success.innerText =
          "✅ Account तयार झाले! Home उघडत आहे...";


        button.innerText =
          "Success ✓";


        /* =====================================
           GO HOME
        ====================================== */

        setTimeout(
          function() {

            window.location.href =
              "home.html";

          },
          700
        );


      } catch (err) {


        console.error(
          "Appwrite Error:",
          err
        );


        button.disabled = false;

        button.innerText =
          "Create Account 🚀";


        let message =
          "Account तयार करता आले नाही.";


        /* Email already exists */

        if (
          err.message &&
          (
            err.message
              .toLowerCase()
              .includes("user already exists")
            ||
            err.message
              .toLowerCase()
              .includes("already exists")
          )
        ) {

          message =
            "हा email आधीच वापरलेला आहे.";

        }


        /* Invalid email */

        else if (
          err.message &&
          err.message
            .toLowerCase()
            .includes("email")
        ) {

          message =
            "कृपया योग्य email address टाका.";

        }


        /* Password */

        else if (
          err.message &&
          err.message
            .toLowerCase()
            .includes("password")
        ) {

          message =
            "Password किमान 8 characters असावा.";

        }


        showError(message);

      }

    }


    /* =====================================
       SHOW ERROR
    ====================================== */

    function showError(message) {

      const error =
        document
          .getElementById("errorMessage");

      error.innerText =
        "❌ " + message;

      error.style.display =
        "block";

    }


    /* =====================================
       ENTER KEY
    ====================================== */

    document
      .getElementById("passwordInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {

            createAccount();

          }

        }
      );


  </script>


</body>

    </html>
