<!DOCTYPE html>
<html lang="mr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GyanSetu - Create Account</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #2196f3, #1565c0);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 20px;
      padding: 30px 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #1565c0;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2196f3;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #1565c0;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    button:disabled {
      background: #999;
    }

    #message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">📚 GyanSetu</div>

    <div class="subtitle">
      तुमचे Account तयार करा
    </div>

    <label>Username</label>

    <input
      type="text"
      id="usernameInput"
      placeholder="तुमचे नाव टाका"
      autocomplete="username"
    >

    <label>Email</label>

    <input
      type="email"
      id="emailInput"
      placeholder="example@gmail.com"
      autocomplete="email"
    >

    <label>Password</label>

    <input
      type="password"
      id="passwordInput"
      placeholder="किमान 8 characters"
      autocomplete="new-password"
    >

          <button
        id="createButton"
        onclick="createAccount()">
        Create Account
      </button>

      <div id="message"></div>

    </div>


    <!-- APPWRITE -->

    <script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0"></script>

    <script>

      const client = new Appwrite.Client();

      client
        .setEndpoint("https://fra.cloud.appwrite.io/v1")
        .setProject("6aa0017e0033d661d951");

      const account =
        new Appwrite.Account(client);


      async function createAccount() {

        const username =
          document.getElementById("usernameInput")
          .value.trim();

        const email =
          document.getElementById("emailInput")
          .value.trim();

        const password =
          document.getElementById("passwordInput")
          .value;

        const button =
          document.getElementById("createButton");

        const message =
          document.getElementById("message");


        message.style.display = "none";


        if (username.length < 2) {

          showMessage(
            "कृपया Username टाका.",
            false
          );

          return;
        }


        if (!email) {

          showMessage(
            "कृपया Email टाका.",
            false
          );

          return;
        }


        if (password.length < 8) {

          showMessage(
            "Password किमान 8 characters असावा.",
            false
          );

          return;
        }


        button.disabled = true;

        button.innerText =
          "Account तयार होत आहे...";


        try {

          const user =
            await account.create({
              userId: Appwrite.ID.unique(),
              email: email,
              password: password,
              name: username
            });


          await account.createEmailPasswordSession({
            email: email,
            password: password
          });


          localStorage.setItem(
            "gyansetu_username",
            username
          );

          localStorage.setItem(
            "gyansetu_email",
            email
          );

          localStorage.setItem(
            "gyansetu_user_id",
            user.$id
          );


          showMessage(
            "✅ Account तयार झाले!",
            true
          );


          setTimeout(function() {

            window.location.href =
              "home.html";

          }, 1000);


        } catch (error) {

          console.error(
            "APPWRITE ERROR:",
            error
          );


          showMessage(
            "❌ " +
            (error.message ||
            "Account तयार करता आले नाही."),
            false
          );


          button.disabled = false;

          button.innerText =
            "Create Account";
        }
      }


      function showMessage(text, success) {

        const message =
          document.getElementById("message");

        message.innerText = text;

        message.style.display = "block";

        if (success) {

          message.style.background =
            "#e8f5e9";

          message.style.color =
            "#2e7d32";

        } else {

          message.style.background =
            "#ffebee";

          message.style.color =
            "#c62828";
        }
      }


      document
        .getElementById("passwordInput")
        .addEventListener(
          "keydown",
          function(event) {

            if (event.key === "Enter") {
              createAccount();
            }

          }
        );

    </script>

</body>

</html>
