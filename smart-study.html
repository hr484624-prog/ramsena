<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GyanSetu - Doubt Desk</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
:root{--b:#2563eb;--ink:#0f172a;--mut:#64748b;--bg:#f1f5f9;--line:#e2e8f0}
body{background:var(--bg);color:var(--ink);min-height:100vh}
.app{max-width:430px;margin:auto;min-height:100vh;padding-bottom:30px}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;position:sticky;top:0;z-index:50;background:var(--bg)}
.ib{border:1px solid var(--line);background:#fff;width:40px;height:40px;border-radius:12px;font-size:18px;color:var(--ink)}
.top b{font-size:17px}

.hero{margin:4px 16px 0;padding:20px 18px;border-radius:20px;color:#fff;background:linear-gradient(135deg,#0f172a,#1e3a8a 60%,#2563eb);box-shadow:0 10px 24px #1e3a8a40}
.hero h1{font-size:22px;letter-spacing:.2px}
.hero p{font-size:13px;opacity:.85;margin-top:6px;line-height:1.5}
.stats{display:flex;gap:8px;margin-top:16px}
.stat{flex:1;background:#ffffff1a;border:1px solid #ffffff22;border-radius:12px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:18px}.stat span{font-size:11px;opacity:.8}

.card{margin:14px 16px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.ttl{font-weight:700;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:0 0 9px}
.ttl.m{margin-top:14px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:#f8fafc;border-radius:10px;padding:9px 13px;font-size:13px;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
select,textarea{width:100%;border:1px solid var(--line);background:#f8fafc;border-radius:12px;padding:12px;font-size:14px;color:var(--ink);outline:none}
select:focus,textarea:focus{border-color:var(--b)}
select{margin-top:10px}
textarea{resize:none;margin-top:12px;line-height:1.5}
.row{display:flex;gap:8px;margin-top:10px}
.tool{flex:1;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:11px 4px;font-size:13px;font-weight:600}
.tool.rec{background:#fee2e2;border-color:#ef4444;color:#b91c1c}
.go{width:100%;margin-top:12px;border:0;color:#fff;padding:15px;border-radius:13px;font-size:15px;font-weight:700;background:var(--b)}
.go:active{transform:scale(.98)}.go:disabled{opacity:.6}

.ans{background:#fff;border:1px solid var(--line);border-left:4px solid var(--b);border-radius:14px;padding:14px;margin-top:14px;font-size:14px;line-height:1.7;animation:up .35s}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.ans .q{font-size:12px;color:var(--mut);margin-bottom:8px;font-weight:600}
.ans pre{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:12px;margin:10px 0;overflow-x:auto;font-size:12.5px;line-height:1.55;font-family:ui-monospace,Menlo,Consolas,monospace}
.ans code{background:#eef2ff;color:#3730a3;padding:1px 5px;border-radius:5px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.ans pre code{background:none;color:inherit;padding:0}
.ans h4{margin:10px 0 4px;font-size:14px}
.acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.acts button{border:1px solid var(--line);background:#f8fafc;color:var(--ink);padding:8px 11px;border-radius:9px;font-size:12px;font-weight:600}
.think{display:flex;gap:6px;justify-content:center;padding:18px}
.think i{width:9px;height:9px;border-radius:50%;background:var(--b);animation:bn 1s infinite}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes bn{50%{transform:translateY(-7px);opacity:.4}}

.sr{width:100%;margin-bottom:10px;margin-top:0}
.h{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;background:#f8fafc;margin-bottom:8px;border:1px solid var(--line)}
.h div{flex:1;min-width:0}
.h b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h small{color:var(--mut);font-size:11px}
.tag{font-size:10px;padding:3px 8px;border-radius:8px;background:#dcfce7;color:#15803d;font-weight:700}
.tag.p{background:#fef3c7;color:#b45309}
.empty{text-align:center;color:var(--mut);font-size:13px;padding:14px}

.bg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bd{text-align:center;font-size:10px;padding:10px 2px;border-radius:12px;background:#f1f5f9;filter:grayscale(1);opacity:.5}
.bd.on{background:#fff7d6;filter:none;opacity:1}
.bd b{display:block;font-size:22px;margin-bottom:3px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;z-index:300;display:none}
</style>
</head>
<body>
<div class="app">

<div class="top">
  <button class="ib" onclick="location.href='home.html'">‹</button>
  <b>Doubt Desk</b>
  <button class="ib" onclick="clearHistory()">🗑️</button>
</div>

<section class="hero">
  <h1>तुमचा Doubt, तज्ज्ञ पद्धतीने सोडवा</h1>
  <p>शाळा, 11-12वी, पदवी (Graduation) आणि स्पर्धा परीक्षा, कोणत्याही level चा doubt विचारा.</p>
  <div class="stats">
    <div class="stat"><b id="sStreak">0</b><span>Day streak</span></div>
    <div class="stat"><b id="sTotal">0</b><span>Doubts</span></div>
    <div class="stat"><b id="sXp">0</b><span>Points</span></div>
  </div>
</section>

<section class="card">
  <div class="ttl">शिक्षणाचा स्तर</div>
  <div class="chips" id="lvChips"></div>
  <select id="cls"></select>

  <div class="ttl m">विषय</div>
  <div class="chips" id="subChips"></div>

  <div class="ttl m">उत्तराची पद्धत</div>
  <div class="chips" id="stChips"></div>

  <textarea id="q" rows="5" placeholder="तुमचा doubt इथे लिहा. Code, formula किंवा theory काहीही चालेल..."></textarea>
  <div class="row">
    <button class="tool" id="micBtn" onclick="voice()">🎤 बोला</button>
    <button class="tool" onclick="$('q').value=''">Clear</button>
  </div>
  <button class="go" id="goBtn" onclick="ask()">Doubt सोडवा</button>
  <div id="out"></div>
</section>

<section class="card">
  <div class="ttl">Achievements</div>
  <div class="bg" id="badges"></div>
</section>

<section class="card">
  <div class="ttl">माझे जुने Doubts</div>
  <input class="sr" id="search" placeholder="🔍 जुने doubts शोधा..." oninput="renderHist()" style="width:100%;border:1px solid var(--line);background:#f8fafc;border-radius:12px;padding:12px;font-size:14px;outline:none">
  <div id="hist"></div>
</section>

</div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
const lang=()=>localStorage.getItem("studyLanguage")||"मराठी";
const user=()=>localStorage.getItem("username")||"guest";
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2200)}

/* markdown-lite: code blocks, inline code, bold, headings, bullets */
function fmt(t){
  let s=esc(t),blocks=[];
  s=s.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g,(m,c)=>{blocks.push("<pre><code>"+c.trim()+"</code></pre>");return "@@B"+(blocks.length-1)+"@@"});
  s=s.replace(/`([^`\n]+)`/g,"<code>$1</code>")
     .replace(/\*\*(.*?)\*\*/g,"<b>$1</b>")
     .replace(/^#{1,4}\s*(.+)$/gm,"<h4>$1</h4>")
     .replace(/^\s*[-•]\s+(.+)$/gm,"• $1")
     .replace(/\n/g,"<br>");
  return s.replace(/@@B(\d+)@@/g,(m,i)=>blocks[i]);
}

/* ---- levels, classes, subjects ---- */
const LEVELS={
 "शाळा (1-10वी)":{cls:["1ली","2री","3री","4थी","5वी","6वी","7वी","8वी","9वी","10वी"],
   subs:["गणित","विज्ञान","इतिहास","भूगोल","इंग्रजी","मराठी","हिंदी","इतर"],depth:"school student"},
 "11-12वी":{cls:["11वी Science","12वी Science","11वी Commerce","12वी Commerce","11वी Arts","12वी Arts"],
   subs:["Maths","Physics","Chemistry","Biology","Accounts","Economics","Political Science","इंग्रजी","इतर"],depth:"higher secondary student"},
 "पदवी (Graduation)":{cls:["FY","SY","TY","Final Year"],
   subs:["Engineering","Computer / IT","BSc","BCom","BBA / BMS","BA","Medical / Pharma","Law","Maths / Statistics","इतर"],depth:"undergraduate college student"},
 "पदव्युत्तर / Research":{cls:["Master's 1st Year","Master's 2nd Year","PhD / Research"],
   subs:["Computer Science","Engineering","Science","Commerce / MBA","Humanities","Research Methods","इतर"],depth:"postgraduate or research student"},
 "स्पर्धा परीक्षा":{cls:["MPSC / UPSC","NEET / JEE / CET","Banking / SSC","GATE / NET","Other"],
   subs:["Quant / Reasoning","General Studies","Science","Current Affairs","Polity / Economy","इतर"],depth:"competitive exam aspirant"}
};
const STYLES=[
 ["सोपं","explain in very simple words with an everyday example"],
 ["Step-by-step","explain step by step clearly"],
 ["सखोल (Deep)","explain in depth with theory, formulas, derivation and examples"],
 ["Exam Answer","write a well structured exam-ready answer with key points and headings"],
 ["Code सहित","include working code examples with comments where relevant"]
];
let lvl=Object.keys(LEVELS)[2],sub="",st=1;

function drawLevels(){
  $("lvChips").innerHTML=Object.keys(LEVELS).map(k=>`<button class="chip ${k==lvl?'on':''}" data-k="${esc(k)}">${esc(k)}</button>`).join("");
  document.querySelectorAll("#lvChips .chip").forEach(b=>b.onclick=()=>{lvl=b.dataset.k;localStorage.setItem("doubtLevel",lvl);drawLevels()});
  const L=LEVELS[lvl];
  $("cls").innerHTML='<option value="">वर्ग / वर्ष निवडा</option>'+L.cls.map(c=>`<option>${esc(c)}</option>`).join("");
  sub=L.subs[0];
  $("subChips").innerHTML=L.subs.map((s,i)=>`<button class="chip ${i==0?'on':''}" data-s="${esc(s)}">${esc(s)}</button>`).join("");
  document.querySelectorAll("#subChips .chip").forEach(b=>b.onclick=()=>{sub=b.dataset.s;document.querySelectorAll("#subChips .chip").forEach(c=>c.classList.remove("on"));b.classList.add("on")});
}
$("stChips").innerHTML=STYLES.map((s,i)=>`<button class="chip ${i==st?'on':''}" onclick="pickSt(this,${i})">${s[0]}</button>`).join("");
function pickSt(b,i){st=i;document.querySelectorAll("#stChips .chip").forEach(c=>c.classList.remove("on"));b.classList.add("on")}
const saved=localStorage.getItem("doubtLevel");if(saved&&LEVELS[saved])lvl=saved;
drawLevels();

/* ---- local store ---- */
const KEY="gs_doubts_"+user();
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}};
const save=a=>localStorage.setItem(KEY,JSON.stringify(a.slice(0,100)));

function stats(){
  const d=load(),total=d.length,xp=total*10+d.filter(x=>x.understood).length*5;
  const days=[...new Set(d.map(x=>new Date(x.time).toDateString()))];
  let streak=0,day=new Date();
  while(days.includes(day.toDateString())){streak++;day.setDate(day.getDate()-1)}
  $("sStreak").textContent=streak;$("sTotal").textContent=total;$("sXp").textContent=xp;
  const B=[["🌱","पहिला Doubt",total>=1],["🔟","10 Doubts",total>=10],["🔥","3 दिवस",streak>=3],["🏆","7 दिवस",streak>=7],
   ["✅","समजलं",d.some(x=>x.understood)],["🧠","5 विषय",new Set(d.map(x=>x.subject)).size>=5],["⚡","100 pts",xp>=100],["🚀","500 pts",xp>=500]];
  $("badges").innerHTML=B.map(b=>`<div class="bd ${b[2]?'on':''}"><b>${b[0]}</b>${b[1]}</div>`).join("");
}

function renderHist(){
  const f=$("search").value.trim().toLowerCase();
  const d=load().map((x,i)=>({x,i})).filter(o=>!f||o.x.question.toLowerCase().includes(f)||(o.x.subject||"").toLowerCase().includes(f));
  $("hist").innerHTML=d.length?d.map(o=>`<div class="h" onclick="showOld(${o.i})"><div><b>${esc(o.x.question)}</b>
   <small>${esc(o.x.subject||"")} • ${esc(o.x.className||o.x.level||"")} • ${new Date(o.x.time).toLocaleDateString("mr-IN")}</small></div>
   <span class="tag ${o.x.understood?'':'p'}">${o.x.understood?'समजलं':'Open'}</span></div>`).join(""):'<div class="empty">काही सापडले नाही.</div>';
}
function showOld(i){const x=load()[i];$("q").value=x.question;render(x.question,x.answer,i);window.scrollTo({top:0,behavior:"smooth"})}
function clearHistory(){if(confirm("सगळे जुने doubts delete करायचे?")){save([]);renderHist();stats();$("out").innerHTML=""}}

/* ---- AI ---- */
async function callAI(question,extra){
  const r=await fetch("/api/ai-study",{method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({mode:"doubt",question:question+(extra?"\n\n"+extra:""),subject:sub,className:$("cls").value,level:lvl,
     audience:LEVELS[lvl].depth,style:STYLES[st][1],language:lang()})});
  const data=await r.json();
  if(!r.ok)throw new Error(data.error||"API Error");
  return data.answer||"उत्तर मिळाले नाही.";
}
async function ask(){
  const q=$("q").value.trim();
  if(!q){toast("कृपया doubt लिहा");return}
  $("goBtn").disabled=true;
  $("out").innerHTML='<div class="think"><i></i><i></i><i></i></div>';
  try{
    const a=await callAI(q);
    const d=load();d.unshift({question:q,answer:a,subject:sub,level:lvl,className:$("cls").value,time:Date.now(),understood:false});save(d);
    sync(d[0]);render(q,a,0);renderHist();stats();toast("+10 points");
  }catch(e){$("out").innerHTML='<div class="ans">AI शी connection होऊ शकले नाही. Internet तपासा आणि पुन्हा प्रयत्न करा.</div>'}
  $("goBtn").disabled=false;
}
function render(q,a,i){
  $("out").innerHTML=`<div class="ans"><div class="q">${esc(q)}</div>${fmt(a)}
  <div class="acts">
   <button onclick="mark(${i})">✅ समजलं</button>
   <button onclick="again(${i},'The student did not understand. Re-explain differently with a new example or analogy.')">समजलं नाही</button>
   <button onclick="again(${i},'Give 3 practice questions with answers at the end.')">Practice</button>
   <button onclick="again(${i},'Summarise this as short revision notes in 5-6 bullet points.')">Short Notes</button>
   <button onclick="copyAns(${i})">Copy</button>
   <button onclick="askSir(${i})">शिक्षकांना विचारा</button>
  </div></div>`;
}
async function again(i,extra){
  const x=load()[i];if(!x)return;
  $("out").innerHTML='<div class="think"><i></i><i></i><i></i></div>';
  try{const a=await callAI(x.question,"(Previous answer:\n"+x.answer.slice(0,700)+")\n"+extra);
   const d=load();d[i].answer=a;save(d);render(x.question,a,i)}catch(e){toast("पुन्हा प्रयत्न करा")}
}
function mark(i){const d=load();if(!d[i])return;d[i].understood=true;save(d);renderHist();stats();toast("छान! +5 points");sync(d[i])}
function copyAns(i){const x=load()[i];navigator.clipboard&&navigator.clipboard.writeText(x.question+"\n\n"+x.answer);toast("Copy झाले")}

/* ---- backend (SQL) ---- */
async function askSir(i){
  const x=load()[i];
  try{const r=await fetch("/api/doubts/ask-sir",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({username:user(),level:x.level,subject:x.subject,className:x.className,question:x.question,ai_answer:x.answer})});
    if(!r.ok)throw 0;toast("शिक्षकांना पाठवले");}catch(e){toast("Server सुरू नाही, नंतर प्रयत्न करा")}
}
function sync(x){
  fetch("/api/doubts",{method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({username:user(),level:x.level,subject:x.subject,className:x.className,question:x.question,answer:x.answer,understood:x.understood})}).catch(()=>{});
}

/* ---- voice ---- */
function voice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast("Voice या browser मध्ये नाही");return}
  const m={"हिंदी":"hi-IN","English":"en-IN","ગુજરાતી":"gu-IN","বাংলা":"bn-IN","தமிழ்":"ta-IN","తెలుగు":"te-IN","ಕನ್ನಡ":"kn-IN"};
  const r=new SR();r.lang=m[lang()]||"mr-IN";r.interimResults=false;
  const b=$("micBtn");b.classList.add("rec");b.textContent="ऐकत आहे...";
  r.onresult=e=>{$("q").value=($("q").value+" "+e.results[0][0].transcript).trim()};
  r.onend=r.onerror=()=>{b.classList.remove("rec");b.textContent="🎤 बोला"};
  r.start();
}
stats();renderHist();
</script>
</body>
</html>
