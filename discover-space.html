<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GyanSetu Class 9 AI Study</title>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
.header{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;padding:20px;text-align:center}
.header h1{margin:0;font-size:26px}.header p{margin:7px 0 0}
.container{max-width:1100px;margin:auto;padding:20px}
.title{margin-bottom:18px}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.topic{background:#fff;border-radius:16px;padding:20px;box-shadow:0 5px 18px rgba(0,0,0,.08);cursor:pointer;transition:.2s;border:1px solid #e5e7eb}
.topic:hover{transform:translateY(-4px)}
.topic-number{color:#2563eb;font-weight:bold;font-size:14px}
.topic h3{margin:8px 0}.topic p{margin:0;color:#64748b;line-height:1.5}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#fff;width:100%;max-width:430px;border-radius:20px;padding:25px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal-box h2{margin-top:0}
.selected-topic{background:#eff6ff;padding:12px;border-radius:10px;margin:15px 0;color:#1d4ed8;font-weight:bold}
.name-input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;outline:none}
.name-input:focus{border-color:#2563eb}
.modal-buttons{display:flex;gap:10px;margin-top:20px}
.modal-buttons button{flex:1;padding:13px;border:0;border-radius:10px;font-weight:bold;cursor:pointer}
.cancel-btn{background:#e5e7eb}.start-btn{background:#2563eb;color:#fff}

.class-screen{display:none;position:fixed;inset:0;background:#0f172a;z-index:2000;color:#fff;overflow:auto}
.class-header{position:sticky;top:0;z-index:10;height:65px;background:rgba(15,23,42,.96);display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid #334155}
.class-title{font-size:18px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.close-btn{width:44px;height:44px;border-radius:50%;border:0;background:#ef4444;color:#fff;font-size:25px;cursor:pointer;flex-shrink:0}
.class-content{max-width:1000px;margin:auto;padding:20px}

/* 3D CLASSROOM */
.teacher-screen{position:relative;width:100%;aspect-ratio:16/10;max-height:62vh;border-radius:20px;overflow:hidden;background:#1b2330}
#stage{position:absolute;inset:0}
#stage canvas{width:100%;height:100%;display:block}
.name-tag{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.55);padding:6px 12px;border-radius:20px;font-size:14px;font-weight:bold}
.status{position:absolute;bottom:12px;left:12px;right:12px;background:rgba(0,0,0,.6);padding:10px;border-radius:10px;text-align:center;font-size:14px}

.lesson-box{background:#fff;color:#172033;margin-top:18px;padding:20px;border-radius:16px;line-height:1.7}
.controls{display:flex;gap:10px;margin-top:15px}
.controls button{flex:1;padding:13px;border:0;border-radius:10px;font-weight:bold;cursor:pointer}
.speak-btn{background:#22c55e;color:#fff}.stop-btn{background:#ef4444;color:#fff}
.ask-box{display:flex;gap:10px;margin-top:15px}
.ask-box input{flex:1;padding:13px;border-radius:10px;border:0;outline:none;font-size:16px}
.ask-box button{padding:13px 20px;border:0;border-radius:10px;background:#7c3aed;color:#fff;font-weight:bold}
@media(max-width:600px){.container{padding:14px}.topics{grid-template-columns:1fr}.class-title{max-width:75%}.ask-box{flex-direction:column}.class-content{padding:12px}}
</style>
</head>
<body>

<div class="header"><h1>🤖 GyanSetu AI Study</h1><p>Class 9 Mathematics • Learn with AI Sir</p></div>
<div class="container"><h2 class="title">📚 Class 9 Mathematics Lessons</h2><div id="topics" class="topics"></div></div>

<div id="nameModal" class="modal"><div class="modal-box">
  <h2>👨‍🏫 Start Class</h2>
  <p>AI Sir तुमच्यासोबत Class 9 चा class घेणार आहेत.</p>
  <div id="selectedTopic" class="selected-topic"></div>
  <input id="studentName" class="name-input" type="text" placeholder="तुमचं नाव (Optional)" maxlength="40">
  <div class="modal-buttons">
    <button class="cancel-btn" onclick="closeModal()">Cancel</button>
    <button class="start-btn" onclick="startClass()">▶ Start Class</button>
  </div>
</div></div>

<div id="classScreen" class="class-screen">
  <div class="class-header">
    <div id="classTitle" class="class-title">Class 9 AI Class</div>
    <button class="close-btn" onclick="closeClass()">×</button>
  </div>
  <div class="class-content">
    <div class="teacher-screen">
      <div id="stage"></div>
      <div class="name-tag">👨‍🏫 GyanSetu AI Sir</div>
      <div id="status" class="status">Preparing your class...</div>
    </div>
    <div id="lesson" class="lesson-box">Lesson तयार होत आहे...</div>
    <div class="controls">
      <button class="speak-btn" onclick="startSpeaking()">🔊 Start / Replay</button>
      <button class="stop-btn" onclick="stopSpeaking()">⏹ Stop</button>
    </div>
    <div class="ask-box">
      <input id="question" placeholder="AI Sir ला प्रश्न विचारा..." onkeydown="if(event.key==='Enter')askAI()">
      <button onclick="askAI()">Ask</button>
    </div>
  </div>
</div>

<!-- =============== 3D SCENE (module) =============== -->
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

/* ⚙️ येथे बदल करून Sir/Classroom ची जागा adjust करा */
const CFG={
  classroom:'Classroom_by_Yanting_Cao_-_5-Zbza_HL3X.glb',
  teacher:'Teacher_by_jeremy_-_5v5j_lqOHTO.glb',
  floorY:-0.15,          // floor ची उंची
  teacherH:0.95,         // Sir ची उंची
  teacherPos:[0.55,-1.7],// Sir चा x,z
  teacherRotY:0,         // Sir ची पाठ दिसत असेल तर 3.14159 करा
  cam:[-0.35,0.5,1.7],   // camera ची जागा
  look:[-0.35,0.42,-2],  // camera कुठे बघतो
  board:{x:-0.575,y:0.66,z:-1.875,w:1.3,h:0.9}
};

let renderer,scene,cam,box,tg,active=false,speaking=false,beatV=0,raf=0,inited=false;
let boardCtx,boardTex;

function wrap(ctx,text,x,y,maxW,lh,maxLines){
  let line='',n=0;
  for(const w of text.split(/\s+/)){
    const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line,x,y);y+=lh;line=w;if(++n>=maxLines)return y}
    else line=t;
  }
  if(line&&n<maxLines){ctx.fillText(line,x,y);y+=lh}
  return y;
}
function setBoard(title,text){
  if(!boardCtx)return;
  const c=boardCtx,W=1024,H=708;
  c.fillStyle='#14352b';c.fillRect(0,0,W,H);
  c.fillStyle='#ffe66d';c.font='bold 54px "Noto Sans Devanagari",Arial,sans-serif';c.textBaseline='top';
  let y=wrap(c,String(title||''),40,34,W-80,66,2)+14;
  c.fillStyle='#fff';c.font='38px "Noto Sans Devanagari",Arial,sans-serif';
  const lines=String(text||'').replace(/<[^>]*>/g,' ').replace(/[*#_`]/g,'').split(/\n+/).map(s=>s.trim()).filter(Boolean);
  for(const l of lines){if(y>H-80)break;y=wrap(c,'• '+l,40,y,W-80,50,2)+8}
  boardTex.needsUpdate=true;
}

function init(container){
  if(inited)return;inited=true;box=container;
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  container.appendChild(renderer.domElement);
  scene=new THREE.Scene();scene.background=new THREE.Color(0x222a36);
  cam=new THREE.PerspectiveCamera(55,1,0.05,50);
  cam.position.set(...CFG.cam);cam.lookAt(...CFG.look);
  scene.add(new THREE.HemisphereLight(0xffffff,0x8a8f99,1.5));
  const d=new THREE.DirectionalLight(0xffffff,1.3);d.position.set(1,2,2);scene.add(d);

  const cv=document.createElement('canvas');cv.width=1024;cv.height=708;
  boardCtx=cv.getContext('2d');boardTex=new THREE.CanvasTexture(cv);boardTex.colorSpace=THREE.SRGBColorSpace;
  const b=CFG.board;
  const bm=new THREE.Mesh(new THREE.PlaneGeometry(b.w,b.h),new THREE.MeshBasicMaterial({map:boardTex}));
  bm.position.set(b.x,b.y,b.z);scene.add(bm);
  setBoard('GyanSetu AI Sir','');

  const loader=new GLTFLoader();
  loader.load(CFG.classroom,g=>scene.add(g.scene),undefined,e=>fail(e));
  loader.load(CFG.teacher,g=>{
    const m=g.scene,bb=new THREE.Box3().setFromObject(m),s=CFG.teacherH/(bb.max.y-bb.min.y);
    m.scale.setScalar(s);
    const b2=new THREE.Box3().setFromObject(m),c=b2.getCenter(new THREE.Vector3());
    m.position.set(-c.x,-b2.min.y,-c.z);
    tg=new THREE.Group();tg.add(m);
    tg.position.set(CFG.teacherPos[0],CFG.floorY,CFG.teacherPos[1]);
    tg.rotation.y=CFG.teacherRotY;scene.add(tg);
  },undefined,e=>fail(e));

  new ResizeObserver(resize).observe(container);resize();
}
function fail(e){console.error(e);const s=document.getElementById('status');if(s)s.innerText='⚠️ 3D model load झाला नाही (GLB files html सोबत त्याच folder मध्ये ठेवा)'}
function resize(){
  const w=box.clientWidth,h=box.clientHeight;if(!w||!h)return;
  renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
}
function tick(t){
  if(!active)return;raf=requestAnimationFrame(tick);
  const s=t/1000;beatV*=0.9;
  if(tg){
    const base=CFG.floorY;
    tg.position.y=base+Math.sin(s*2)*0.003+(speaking?Math.abs(Math.sin(s*6))*0.008+beatV*0.02:0);
    tg.rotation.y=CFG.teacherRotY+(speaking?Math.sin(s*1.4)*0.15:Math.sin(s*0.5)*0.04);
    tg.rotation.z=speaking?Math.sin(s*3)*0.03+beatV*0.03:0;
    tg.scale.y=1+(speaking?beatV*0.02:Math.sin(s*1.6)*0.004);
  }
  renderer.render(scene,cam);
}
window.T3D={
  init,setBoard,
  beat(){beatV=1},
  setSpeaking(v){speaking=v},
  setActive(v){
    if(v&&!active){active=true;resize();raf=requestAnimationFrame(tick)}
    if(!v){active=false;cancelAnimationFrame(raf)}
  }
};
</script>

<!-- =============== APP LOGIC =============== -->
<script>
const API="https://gyan-setu-ai-study-backend.vercel.app";
let selectedTopic=null,studentName="",currentText="",voice=null,gen=0,queue=[];

const class9Topics=[
 {id:1,title:"Number Systems",description:"Real numbers, irrational numbers and laws of exponents"},
 {id:2,title:"Polynomials",description:"Polynomials, coefficients, zeros and identities"},
 {id:3,title:"Coordinate Geometry",description:"Cartesian plane, coordinates and plotting points"},
 {id:4,title:"Linear Equations in Two Variables",description:"Solutions and graphical representation"},
 {id:5,title:"Introduction to Euclid's Geometry",description:"Euclid's definitions, axioms and postulates"},
 {id:6,title:"Lines and Angles",description:"Lines, angles and their properties"},
 {id:7,title:"Triangles",description:"Congruence of triangles and related properties"},
 {id:8,title:"Quadrilaterals",description:"Properties of parallelograms and quadrilaterals"},
 {id:9,title:"Circles",description:"Circle properties, chords and angles"},
 {id:10,title:"Heron's Formula",description:"Area of triangle using Heron's formula"},
 {id:11,title:"Surface Areas and Volumes",description:"Surface area and volume of 3D shapes"},
 {id:12,title:"Statistics",description:"Collection, presentation and interpretation of data"},
 {id:13,title:"Probability",description:"Basic concepts of probability"}
];
const $=id=>document.getElementById(id);

function loadTopics(){
  const box=$("topics");box.innerHTML="";
  class9Topics.forEach(t=>{
    const c=document.createElement("div");c.className="topic";
    c.innerHTML=`<div class="topic-number">LESSON ${t.id}</div><h3>${t.title}</h3><p>${t.description}</p>`;
    c.onclick=()=>openNamePopup(t);box.appendChild(c);
  });
}
function openNamePopup(t){selectedTopic=t;$("selectedTopic").innerText="📘 "+t.title;$("studentName").value="";$("nameModal").style.display="flex"}
function closeModal(){$("nameModal").style.display="none"}

/* ---------- VOICE ---------- */
function pickVoice(){
  const v=speechSynthesis.getVoices();
  const rank=l=>v.filter(x=>x.lang.toLowerCase().replace('_','-').startsWith(l));
  const best=a=>a.find(x=>/google|neural|natural|online/i.test(x.name))||a[0];
  voice=best(rank('mr'))||best(rank('hi'))||best(rank('en-in'))||null;
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}

function speakText(text){
  stopQuiet();
  const g=++gen;
  queue=String(text).replace(/\s+/g,' ').replace(/([.!?।:])\s+/g,'$1|').split('|').map(s=>s.trim()).filter(Boolean);
  setSpeaking(true);next(g);
}
function next(g){
  if(g!==gen)return;
  const s=queue.shift();
  if(!s){setSpeaking(false);$("status").innerText="✅ Class explanation completed";return}
  const u=new SpeechSynthesisUtterance(s);
  u.lang=voice?voice.lang:"mr-IN";if(voice)u.voice=voice;
  u.rate=0.92;u.pitch=0.95;
  u.onboundary=()=>window.T3D&&T3D.beat();
  u.onend=()=>next(g);
  u.onerror=()=>{if(g===gen){setSpeaking(false);$("status").innerText="Speech unavailable"}};
  speechSynthesis.speak(u);
}
function setSpeaking(v){
  window.T3D&&T3D.setSpeaking(v);
  if(v)$("status").innerText="🎙️ AI Sir शिकवत आहेत...";
}
function stopQuiet(){gen++;queue=[];speechSynthesis.cancel();window.T3D&&T3D.setSpeaking(false)}
function stopSpeaking(){stopQuiet();$("status").innerText="⏹ AI Sir stopped"}

/* ---------- CLASS ---------- */
async function startClass(){
  if(!selectedTopic)return;
  studentName=$("studentName").value.trim()||"विद्यार्थी";
  closeModal();
  $("classScreen").style.display="block";document.body.style.overflow="hidden";
  $("classTitle").innerText="📘 Class 9 • "+selectedTopic.title;
  $("status").innerText="⏳ AI Sir तुमच्यासाठी class तयार करत आहेत...";
  $("lesson").innerHTML="⏳ Lesson तयार होत आहे...";
  if(window.T3D){T3D.init($("stage"));T3D.setActive(true);T3D.setBoard(selectedTopic.title,"Class 9 Mathematics")}
  else $("status").innerText="⚠️ 3D support नाही";

  try{
    const r=await fetch(API+"/api/ai/lesson",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({topic:"Class 9 Mathematics - "+selectedTopic.title,language:"Marathi"})});
    const data=await r.json();
    if(!data.success)throw new Error("Lesson generation failed");
    currentText=data.lesson||data.content||data.response||"";
    $("lesson").innerHTML=formatText(currentText);
    window.T3D&&T3D.setBoard(selectedTopic.title,currentText);
    $("status").innerText="🎓 Class तयार आहे";
    setTimeout(()=>speakText(`नमस्कार ${studentName}! आज आपण Class 9 Mathematics मधील ${selectedTopic.title} हा धडा शिकणार आहोत. चला class सुरू करूया.`),500);
  }catch(e){
    $("lesson").innerHTML="❌ Lesson तयार करताना error आला.";
    $("status").innerText="Lesson unavailable";console.error(e);
  }
}
function startSpeaking(){
  if(!currentText)return;
  speakText(`चला ${studentName}, आजचा Class 9 Mathematics class सुरू करूया. `+cleanText(currentText));
}
function closeClass(){
  stopSpeaking();window.T3D&&T3D.setActive(false);
  $("classScreen").style.display="none";document.body.style.overflow="auto";
}
async function askAI(){
  const input=$("question"),q=input.value.trim();if(!q)return;
  const lesson=$("lesson");lesson.innerHTML="⏳ AI Sir उत्तर तयार करत आहेत...";
  try{
    const r=await fetch(API+"/api/ai/ask",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:q,topic:"Class 9 Mathematics - "+selectedTopic.title,language:"Marathi"})});
    const d=await r.json();
    const a=d.answer||d.response||d.content||d.message||"उत्तर मिळाले नाही.";
    currentText=a;lesson.innerHTML=formatText(a);input.value="";
    window.T3D&&T3D.setBoard("❓ "+q,a);
    speakText(studentName==="विद्यार्थी"?a:`${studentName}, ${cleanText(a)}`);
  }catch(e){lesson.innerHTML="❌ AI Sir उत्तर देऊ शकले नाहीत.";console.error(e)}
}
function formatText(t){return t.replace(/\n/g,"<br>").replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>")}
function cleanText(t){const d=document.createElement("div");d.innerHTML=t;return(d.innerText||"").replace(/[*#_`]/g,"")}

loadTopics();
</script>
</body> 
</html>
