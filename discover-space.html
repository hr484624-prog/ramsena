<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>GyanSetu - Class History</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{min-height:100%;background:#0b0f17;color:#fff}
input,select,button{font:inherit;font-size:16px}
button{border:0;color:#fff;cursor:pointer}
.hidden{display:none!important}
header{height:56px;display:flex;align-items:center;gap:10px;padding:0 12px;background:linear-gradient(135deg,#0b0f17,#1b2a55);position:sticky;top:0;z-index:20}
header h2{font-size:18px}
.ib{width:40px;height:40px;border-radius:50%;background:#1b2436;font-size:20px;flex:none}
main{max-width:720px;margin:auto;padding:12px 12px calc(40px + env(safe-area-inset-bottom))}

/* search */
.sbox{position:relative}
.sbox input{width:100%;padding:13px 40px 13px 14px;border-radius:12px;border:1px solid #2c3850;background:#0b1018;color:#fff;outline:none}
.sbox input:focus{border-color:#3d6cff}
.sbox button{position:absolute;right:6px;top:6px;width:32px;height:32px;border-radius:50%;background:#1b2436;font-size:14px}

/* calendar */
.cal{margin-top:12px;background:#131a26;border:1px solid #232d42;border-radius:16px;padding:12px}
.ch{display:flex;align-items:center;gap:6px}
.ch .nav{width:38px;height:38px;border-radius:10px;background:#1b2436;font-size:18px;flex:none}
.ch select{flex:1;min-width:0;padding:9px 6px;border-radius:10px;border:1px solid #2c3850;background:#0b1018;color:#fff;outline:none}
.ch .yr{flex:.7}
.today{margin-top:8px;width:100%;padding:8px;border-radius:10px;background:#1b2436;font-size:14px;font-weight:700}
.wd,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{margin-top:12px;text-align:center;color:#8f9bb3;font-size:12px;font-weight:700}
.grid{margin-top:6px}
.day{position:relative;aspect-ratio:1;border-radius:10px;background:transparent;color:#cfd6e6;font-size:15px;display:flex;align-items:center;justify-content:center;flex-direction:column}
.day.blank{pointer-events:none}
.day.now{box-shadow:inset 0 0 0 1px #3d6cff}
.day.has{background:#1b2436;font-weight:700;color:#fff}
.day.sel{background:linear-gradient(135deg,#3d6cff,#6a4dff);color:#fff}
.day i{position:absolute;bottom:4px;font-style:normal;font-size:9px;color:#8bb0ff;line-height:1}
.day.sel i{color:#fff}

/* list */
.lh{margin:18px 2px 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lh b{font-size:16px}
.lh span{color:#8f9bb3;font-size:13px;flex:none}
.dg{margin:16px 2px 2px;color:#8bb0ff;font-size:13px;font-weight:700}
.item{background:#131a26;border:1px solid #232d42;border-left:4px solid #3d6cff;border-radius:14px;padding:12px 14px;margin-top:8px}
.item.st{border-left-color:#34c38f}
.item .t{font-weight:700;font-size:16px}
.item .s{color:#8f9bb3;font-size:13px;margin-top:5px;line-height:1.5}
.tag{display:inline-block;margin-top:8px;margin-right:6px;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;background:#1b2436}
.tag.live{background:#ff3b5c}
.item{cursor:pointer}
.tag.rec{background:#34c38f;color:#04140d}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;display:flex;align-items:center;justify-content:center;padding:12px}
.pp{width:100%;max-width:720px}
.pph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.pph b{font-size:15px}
.pp video{width:100%;max-height:70vh;background:#000;border-radius:12px}
.pts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pts button{padding:8px 12px;border-radius:10px;background:#1b2436;font-size:13px;font-weight:700}
.pts .on{background:#3d6cff}
.empty{text-align:center;color:#6c778f;padding:28px 10px;line-height:1.7}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#1f2937;border:1px solid #3d6cff;border-radius:12px;padding:10px 16px;z-index:500;font-size:14px;text-align:center;max-width:90%}
</style>
</head>
<body>
<div id="toast" class="toast hidden"></div>
<header><button class="ib" onclick="goBack()">←</button><h2>📅 Class History</h2></header>

<main>
  <div class="sbox">
    <input id="q" type="search" placeholder="🔍 Batch / Subject / Sir / तारीख शोधा" oninput="onSearch(this.value)">
    <button id="qx" class="hidden" onclick="clearSearch()">✕</button>
  </div>

  <section id="cal" class="cal">
    <div class="ch">
      <button class="nav" onclick="shift(-1)">‹</button>
      <select id="mo" onchange="setMY()"></select>
      <select id="yr" class="yr" onchange="setMY()"></select>
      <button class="nav" onclick="shift(1)">›</button>
    </div>
    <button class="today" onclick="goToday()">📍 आज</button>
    <div class="wd"><span>र</span><span>सो</span><span>मं</span><span>बु</span><span>गु</span><span>शु</span><span>श</span></div>
    <div class="grid" id="grid"></div>
  </section>

  <div class="lh"><b id="lt"></b><span id="lc"></span></div>
  <div id="list"></div>
</main>

<div id="pov" class="ov hidden" onclick="if(event.target===this)closeRec()">
  <div class="pp">
    <div class="pph"><b id="mt"></b><button class="ib" onclick="closeRec()">✕</button></div>
    <video id="pv" controls playsinline></video>
    <div id="pts" class="pts"></div>
  </div>
</div>

<script>
const sb=supabase.createClient("https://eqglttfffhvoyvrclzse.supabase.co","sb_publishable_rR4xxl0dW5DJrhhjqiFHLw_uJ-HakAb");
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS=['जानेवारी','फेब्रुवारी','मार्च','एप्रिल','मे','जून','जुलै','ऑगस्ट','सप्टेंबर','ऑक्टोबर','नोव्हेंबर','डिसेंबर'];

let user=null,all=[],byDay=new Map(),q='',recs=new Map(),curParts=[];
const now=new Date();
let vy=now.getFullYear(),vm=now.getMonth(),sel=key(now);

/* ---------- no zoom ---------- */
['gesturestart','gesturechange','gestureend'].forEach(e=>document.addEventListener(e,x=>x.preventDefault()));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});

/* ---------- helpers ---------- */
let tt;
function toast(t){const e=$('toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(tt);tt=setTimeout(()=>e.classList.add('hidden'),3000)}
function goBack(){location.href='home.html'}
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(d){return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear()}
function fmtTime(s){return new Date(s).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:true})}
function fmtDur(a,b){
  const m=Math.max(0,Math.round((new Date(b)-new Date(a))/60000));
  if(m<1)return '1 मिनिटापेक्षा कमी';
  const h=Math.floor(m/60),r=m%60;
  return (h?h+' तास ':'')+(r?r+' मि':'')||'0 मि';
}

/* ---------- load ---------- */
async function load(){
  const [a,b]=await Promise.all([
    sb.from('gs_class_history').select('*,att:gs_class_attendance(count)').eq('owner_id',user.id).order('started_at',{ascending:false}).limit(2000),
    sb.from('gs_class_attendance').select('history:gs_class_history(*)').eq('user_id',user.id).limit(2000)
  ]);
  if(a.error||b.error){toast('History load झाली नाही: '+(a.error||b.error).message)}
  const map=new Map();
  (a.data||[]).forEach(r=>map.set(r.id,{...r,role:'sir',count:(r.att&&r.att[0]&&r.att[0].count)||0}));
  (b.data||[]).forEach(r=>{const h=r.history;if(h&&!map.has(h.id))map.set(h.id,{...h,role:'student'})});
  all=[...map.values()].sort((x,y)=>new Date(y.started_at)-new Date(x.started_at));
  byDay=new Map();
  all.forEach(c=>{
    c._d=new Date(c.started_at);
    c._k=key(c._d);
    c._hay=[c.batch_name,c.subject,c.owner_name,fmtDate(c._d),c._k].join(' ').toLowerCase();
    if(!byDay.has(c._k))byDay.set(c._k,[]);
    byDay.get(c._k).push(c);
  });
  const rr=await sb.from('gs_class_recordings').select('history_id,part,url').order('part',{ascending:true}).limit(5000);
  recs=new Map();
  (rr.data||[]).forEach(r=>{if(!recs.has(r.history_id))recs.set(r.history_id,[]);recs.get(r.history_id).push(r)});
}

/* ---------- month / year pickers ---------- */
function buildPickers(){
  $('mo').innerHTML=MONTHS.map((m,i)=>`<option value="${i}">${m}</option>`).join('');
  const ys=all.map(c=>c._d.getFullYear());
  const lo=Math.min(now.getFullYear()-2,...ys),hi=now.getFullYear()+1;
  let o='';for(let y=hi;y>=lo;y--)o+=`<option value="${y}">${y}</option>`;
  $('yr').innerHTML=o;
}
function setMY(){vm=+$('mo').value;vy=+$('yr').value;drawCal()}
function shift(n){
  vm+=n;
  if(vm<0){vm=11;vy--}else if(vm>11){vm=0;vy++}
  const yr=$('yr');
  if(![...yr.options].some(o=>+o.value===vy)){vm=n<0?0:11;vy=n<0?+yr.options[yr.options.length-1].value:+yr.options[0].value}
  drawCal();
}
function goToday(){vy=now.getFullYear();vm=now.getMonth();sel=key(now);drawCal();drawList()}

/* ---------- calendar ---------- */
function drawCal(){
  $('mo').value=vm;$('yr').value=vy;
  const first=new Date(vy,vm,1).getDay(),days=new Date(vy,vm+1,0).getDate(),tk=key(now);
  let h='';
  for(let i=0;i<first;i++)h+='<div class="day blank"></div>';
  for(let d=1;d<=days;d++){
    const k=vy+'-'+String(vm+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const n=(byDay.get(k)||[]).length;
    h+=`<button class="day${n?' has':''}${k===tk?' now':''}${k===sel?' sel':''}" onclick="pickDay('${k}')">${d}${n?`<i>${n} class</i>`:''}</button>`;
  }
  $('grid').innerHTML=h;
}
function pickDay(k){sel=k;drawCal();drawList()}

/* ---------- list ---------- */
function item(c,showDate){
  const has=(recs.get(c.id)||[]).length;
  const live=!c.ended_at&&(Date.now()-c._d.getTime()<12*3600*1000);
  const when=c.ended_at?`${fmtTime(c.started_at)} – ${fmtTime(c.ended_at)}`:`${fmtTime(c.started_at)} पासून`;
  return `<div class="item ${c.role==='student'?'st':''}" onclick="openRec('${c.id}')">
    <div class="t">${esc(c.batch_name||'Batch')}</div>
    <div class="s">📘 ${esc(c.subject||'-')}<br>👨‍🏫 ${esc(c.owner_name||'Sir')}<br>⏰ ${showDate?fmtDate(c._d)+', ':''}${when}</div>
    ${live?'<span class="tag live">🔴 सुरू आहे</span>':''}
    ${has?'<span class="tag rec">▶️ Recording बघा</span>':(c.ended_at?'<span class="tag">Recording नाही</span>':'')}
    ${c.ended_at?`<span class="tag">⏱️ ${fmtDur(c.started_at,c.ended_at)}</span>`:''}
    ${c.role==='sir'?`<span class="tag">👨‍🏫 तुम्ही घेतली</span><span class="tag">👥 ${c.count}</span>`:'<span class="tag">👨‍🎓 तुम्ही attend केली</span>'}
  </div>`;
}
function drawList(){
  const L=$('list');
  if(q){
    const k=q.toLowerCase();
    const r=all.filter(c=>c._hay.includes(k));
    $('lt').textContent='🔍 Search results';$('lc').textContent=r.length+' class';
    if(!r.length){L.innerHTML='<div class="empty">काही सापडले नाही.<br>दुसरे नाव किंवा तारीख शोधा.</div>';return}
    let h='',last='';
    r.forEach(c=>{if(c._k!==last){last=c._k;h+=`<div class="dg">${fmtDate(c._d)}</div>`}h+=item(c,false)});
    L.innerHTML=h;return;
  }
  const d=new Date(sel+'T00:00:00'),r=(byDay.get(sel)||[]).slice().sort((x,y)=>x._d-y._d);
  $('lt').textContent=fmtDate(d);$('lc').textContent=r.length?r.length+' class':'';
  L.innerHTML=r.map(c=>item(c,false)).join('')||'<div class="empty">या दिवशी कोणतीही class नव्हती.<br>हिरवे/निळे ठिपके असलेल्या तारखा निवडा.</div>';
}

/* ---------- search ---------- */
function onSearch(v){
  q=v.trim();
  $('qx').classList.toggle('hidden',!q);
  $('cal').classList.toggle('hidden',!!q);
  drawList();
}
function clearSearch(){$('q').value='';onSearch('')}

/* ---------- recording player ---------- */
function openRec(id){
  const c=all.find(x=>x.id===id);
  const p=recs.get(id)||[];
  if(!c)return;
  if(!p.length){toast(c.ended_at?'या class ची recording उपलब्ध नाही':'Class सुरू आहे, recording नंतर मिळेल');return}
  curParts=p;
  $('mt').textContent=(c.batch_name||'Batch')+' • '+fmtDate(c._d);
  $('pov').classList.remove('hidden');
  playPart(0);
}
function playPart(i){
  const v=$('pv');
  v.dataset.i=i;
  v.src=curParts[i].url;
  v.play().catch(()=>{});
  $('pts').innerHTML=curParts.length>1?curParts.map((_,k)=>`<button class="${k===i?'on':''}" onclick="playPart(${k})">भाग ${k+1}</button>`).join(''):'';
}
function closeRec(){
  const v=$('pv');v.pause();v.removeAttribute('src');v.load();
  $('pov').classList.add('hidden');
}
document.addEventListener('DOMContentLoaded',()=>{
  $('pv').addEventListener('ended',()=>{const i=+$('pv').dataset.i+1;if(i<curParts.length)playPart(i)});
  $('pv').addEventListener('error',()=>{if($('pv').getAttribute('src'))toast('Video चालत नाही. दुसरा browser (Chrome) वापरून बघा')});
});

/* ---------- start ---------- */
document.addEventListener('DOMContentLoaded',async()=>{
  const {data}=await sb.auth.getUser();user=data?.user||null;
  if(!user){$('list').innerHTML='<div class="empty">आधी GyanSetu मध्ये Login करा</div>';$('cal').classList.add('hidden');return}
  $('list').innerHTML='<div class="empty">⏳ Loading...</div>';
  await load();
  buildPickers();drawCal();drawList();
});
</script>
</body>
</html>
