<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>QR Location Share</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#07111f,#101b35);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:500px;
}

.card{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  border-radius:25px;
  padding:25px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
  backdrop-filter:blur(15px);
}

h1{
  font-size:28px;
  margin-bottom:10px;
}

.sub{
  color:#b8c4d9;
  line-height:1.5;
  margin-bottom:22px;
}

#qr{
  background:white;
  padding:15px;
  width:max-content;
  margin:20px auto;
  border-radius:15px;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  background:#2979ff;
  color:white;
  margin-top:10px;
}

button:active{
  transform:scale(.98);
}

.info{
  margin-top:20px;
  text-align:left;
  display:none;
}

.row{
  background:rgba(255,255,255,.07);
  padding:14px;
  border-radius:12px;
  margin-bottom:9px;
  word-break:break-word;
}

.label{
  color:#9db0cc;
  font-size:12px;
  margin-bottom:5px;
}

.value{
  font-size:15px;
}

.map{
  display:block;
  text-decoration:none;
  text-align:center;
  background:#18a558;
  color:white;
  padding:14px;
  border-radius:13px;
  margin-top:12px;
  font-weight:bold;
}

#status{
  margin-top:15px;
  color:#ffd166;
  line-height:1.5;
}

.hidden{
  display:none;
}

.scanner{
  padding:15px;
  border-radius:15px;
  background:rgba(255,255,255,.06);
  margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>📍 Location Share</h1>

    <p class="sub">
      Scan this QR code with another phone.
      The other phone will be asked for location permission.
    </p>

    <div id="qr"></div>

    <div class="scanner">
      <b>Step 1</b><br>
      Scan the QR code above.
      <br><br>
      <b>Step 2</b><br>
      On the other phone, press
      <b>Allow Location</b>.
    </div>

    <div id="status">
      Waiting for location permission...
    </div>

    <div id="info" class="info">

      <div class="row">
        <div class="label">Latitude</div>
        <div id="lat" class="value">—</div>
      </div>

      <div class="row">
        <div class="label">Longitude</div>
        <div id="lng" class="value">—</div>
      </div>

      <div class="row">
        <div class="label">Accuracy</div>
        <div id="accuracy" class="value">—</div>
      </div>

      <a id="map" class="map" target="_blank">
        🗺️ Open Location in Google Maps
      </a>

    </div>

  </div>

</div>

<script>

/*
  IMPORTANT:
  Replace this URL with the HTTPS URL where
  this HTML file is hosted.
*/

const SHARE_URL =
  window.location.origin +
  window.location.pathname +
  "?shareLocation=true";


/* Generate QR */

new QRCode(document.getElementById("qr"), {
  text: SHARE_URL,
  width:220,
  height:220,
  colorDark:"#000000",
  colorLight:"#ffffff",
  correctLevel:QRCode.CorrectLevel.H
});


/* Elements */

const statusBox =
  document.getElementById("status");

const info =
  document.getElementById("info");

const lat =
  document.getElementById("lat");

const lng =
  document.getElementById("lng");

const accuracy =
  document.getElementById("accuracy");

const map =
  document.getElementById("map");


/*
  When the QR-scanned phone opens this URL,
  request location permission.
*/

const params =
  new URLSearchParams(window.location.search);

if(params.get("shareLocation") === "true"){

  statusBox.innerHTML =
    "📍 Please allow location permission to share your location.";

  requestLocation();

}


/* Request location */

function requestLocation(){

  if(!navigator.geolocation){

    statusBox.innerHTML =
      "❌ This browser does not support location.";

    return;
  }

  navigator.geolocation.getCurrentPosition(

    function(position){

      const latitude =
        position.coords.latitude;

      const longitude =
        position.coords.longitude;

      const acc =
        position.coords.accuracy;

      lat.textContent =
        latitude.toFixed(6);

      lng.textContent =
        longitude.toFixed(6);

      accuracy.textContent =
        Math.round(acc) + " meters";

      map.href =
        "https://www.google.com/maps?q=" +
        latitude + "," + longitude;

      info.style.display =
        "block";

      statusBox.innerHTML =
        "✅ Location permission granted.";

    },

    function(error){

      if(error.code === 1){

        statusBox.innerHTML =
          "❌ Location permission was denied.";

      }else if(error.code === 2){

        statusBox.innerHTML =
          "⚠️ Location is currently unavailable.";

      }else if(error.code === 3){

        statusBox.innerHTML =
          "⚠️ Location request timed out.";

      }else{

        statusBox.innerHTML =
          "⚠️ Unable to get location.";

      }

    },

    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }

  );

}

</script>

</body>
</html>
