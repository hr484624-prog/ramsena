<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>GyanSetu Star Walk</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
    color:white;
}

#space{
    position:fixed;
    inset:0;
    background:
      radial-gradient(circle at 50% 48%,#101f50 0,#050b20 38%,#01030c 75%,#000 100%);
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

/* MILKY WAY */

.milky{
    position:absolute;
    width:160%;
    height:48%;
    left:-30%;
    top:28%;
    transform:rotate(-22deg);
    background:
      radial-gradient(
        ellipse,
        rgba(180,210,255,.16),
        rgba(100,140,220,.08) 35%,
        transparent 72%
      );
    filter:blur(25px);
    pointer-events:none;
}

/* TOP */

.top{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:70px;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 14px;
    background:linear-gradient(
        180deg,
        rgba(0,0,0,.78),
        transparent
    );
}

.logo{
    font-size:21px;
    font-weight:900;
    text-shadow:0 2px 8px #000;
}

.logo span{
    color:#4db7ff;
}

.topRight{
    display:flex;
    gap:7px;
}

.round{
    width:43px;
    height:43px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.22);
    background:rgba(5,15,38,.72);
    color:white;
    font-size:19px;
    backdrop-filter:blur(10px);
}

/* SEARCH */

.search{
    position:fixed;
    z-index:20;
    top:76px;
    left:50%;
    transform:translateX(-50%);
    width:calc(100% - 28px);
    max-width:520px;
    height:48px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 15px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:16px;
    background:rgba(4,12,32,.72);
    backdrop-filter:blur(14px);
}

.search input{
    width:100%;
    border:0;
    outline:0;
    color:white;
    background:transparent;
    font-size:15px;
}

.search input::placeholder{
    color:#9baed0;
}

/* DIRECTION */

.direction{
    position:fixed;
    z-index:15;
    top:140px;
    left:50%;
    transform:translateX(-50%);
    color:#bcd8ff;
    font-size:12px;
    padding:7px 12px;
    border-radius:20px;
    background:rgba(0,0,0,.35);
    backdrop-filter:blur(8px);
}

/* CROSSHAIR */

.crosshair{
    position:fixed;
    z-index:10;
    left:50%;
    top:50%;
    width:70px;
    height:70px;
    transform:translate(-50%,-50%);
    pointer-events:none;
}

.crosshair:before,
.crosshair:after{
    content:"";
    position:absolute;
    background:rgba(255,255,255,.45);
}

.crosshair:before{
    width:1px;
    height:70px;
    left:34px;
}

.crosshair:after{
    width:70px;
    height:1px;
    top:34px;
}

.crossDot{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    background:#fff;
    left:32px;
    top:32px;
}

/* BOTTOM */

.bottom{
    position:fixed;
    z-index:25;
    bottom:0;
    left:0;
    right:0;
    height:82px;
    display:flex;
    align-items:center;
    justify-content:space-around;
    background:rgba(1,5,18,.9);
    border-top:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(15px);
}

.bottom button{
    border:0;
    background:transparent;
    color:#9eb1cf;
    font-size:11px;
    min-width:60px;
}

.bottom button div{
    font-size:23px;
    margin-bottom:4px;
}

/* OBJECT LABEL */

.label{
    position:absolute;
    z-index:8;
    transform:translate(-50%,-50%);
    pointer-events:none;
    text-align:center;
    white-space:nowrap;
    text-shadow:
        0 1px 4px #000,
        0 0 8px #000;
}

.label .dot{
    width:var(--size);
    height:var(--size);
    margin:auto;
    border-radius:50%;
    background:var(--glow);
    box-shadow:
        0 0 8px var(--glow),
        0 0 20px var(--glow);
}

.label .name{
    margin-top:6px;
    font-size:11px;
    color:#dbeafe;
}

/* CONSTELLATION */

.constellation{
    position:absolute;
    height:1px;
    background:rgba(100,180,255,.35);
    transform-origin:0 50%;
    pointer-events:none;
    z-index:3;
}

/* POPUP */

.popupBg{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:flex-end;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(5px);
}

.popup{
    width:100%;
    max-width:520px;
    margin:auto;
    background:
      linear-gradient(145deg,#0b1838,#020617);
    border:1px solid rgba(100,190,255,.25);
    border-radius:25px 25px 0 0;
    padding:22px;
    box-shadow:0 -10px 50px rgba(0,0,0,.6);
}

.popupTop{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.popup h2{
    color:#7dd3fc;
}

.close{
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.1);
    color:white;
    font-size:18px;
}

.popup p{
    color:#cbd5e1;
    line-height:1.65;
    font-size:14px;
    margin-top:12px;
}

.popup button.action{
    width:100%;
    margin-top:18px;
    padding:13px;
    border:0;
    border-radius:13px;
    color:white;
    background:#1769e0;
    font-weight:bold;
}

/* TIME */

.timeBox{
    position:fixed;
    z-index:15;
    left:15px;
    bottom:98px;
    padding:10px 13px;
    border-radius:13px;
    background:rgba(3,10,28,.72);
    border:1px solid rgba(255,255,255,.13);
    font-size:11px;
    color:#b9c9e4;
}

.compass{
    position:fixed;
    z-index:15;
    right:15px;
    bottom:98px;
    width:55px;
    height:55px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(3,10,28,.72);
    font-size:24px;
}

/* MODE */

.mode{
    position:fixed;
    z-index:30;
    right:14px;
    top:76px;
}

.mode button{
    border:1px solid rgba(255,255,255,.2);
    border-radius:12px;
    background:rgba(5,15,40,.72);
    color:white;
    padding:10px;
}

/* RESPONSIVE */

@media(min-width:700px){
    .bottom{
        left:50%;
        right:auto;
        width:520px;
        transform:translateX(-50%);
        border-radius:22px 22px 0 0;
    }
}
</style>
</head>

<body>

<div id="space">

    <div class="milky"></div>

    <canvas id="skyCanvas"></canvas>

</div>

<!-- TOP -->

<div class="top">

    <div class="logo">
        Gyan<span>Setu</span> 🌌
    </div>

    <div class="topRight">

        <button class="round"
                onclick="goHome()">
            🏠
        </button>

        <button class="round"
                onclick="enableSensors()">
            🧭
        </button>

    </div>

</div>

<!-- SEARCH -->

<div class="search">

    <span>🔎</span>

    <input
        id="search"
        placeholder="Search stars, planets, constellations..."
        autocomplete="off">

</div>

<div class="direction" id="direction">
    ↑ SKY VIEW
</div>

<div class="crosshair">
    <div class="crossDot"></div>
</div>

<div class="mode">

    <button onclick="toggleLabels()">
        ✨ Labels
    </button>

</div>

<div class="timeBox" id="time">
    Loading sky...
</div>

<div class="compass" id="compass">
    🧭
</div>

<!-- BOTTOM -->

<div class="bottom">

    <button onclick="setSkyMode('stars')">
        <div>⭐</div>
        Stars
    </button>

    <button onclick="setSkyMode('planets')">
        <div>🪐</div>
        Planets
    </button>

    <button onclick="showSkyInfo()">
        <div>🌌</div>
        Sky
    </button>

    <button onclick="enableSensors()">
        <div>🧭</div>
        AR View
    </button>

</div>

<!-- POPUP -->

<div class="popupBg" id="popupBg">

    <div class="popup">

        <div class="popupTop">

            <h2 id="popupTitle">
                Object
            </h2>

            <button
                class="close"
                onclick="closePopup()">
                ✕
            </button>

        </div>

        <div id="popupContent"></div>

        <button
            class="action"
            onclick="closePopup()">
            Continue Exploring 🌌
        </button>

    </div>

</div>

<script>

/* =====================================
   CANVAS
===================================== */

const canvas =
    document.getElementById("skyCanvas");

const ctx =
    canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){

    W=canvas.width=innerWidth*devicePixelRatio;
    H=canvas.height=innerHeight*devicePixelRatio;

    canvas.style.width=innerWidth+"px";
    canvas.style.height=innerHeight+"px";

    ctx.setTransform(
        devicePixelRatio,
        0,0,
        devicePixelRatio,
        0,0
    );
}

resize();

addEventListener("resize",resize);


/* =====================================
   REALISTIC STAR FIELD
===================================== */

let stars=[];

function createStars(){

    stars=[];

    for(let i=0;i<1000;i++){

        stars.push({

            x:Math.random()*W/devicePixelRatio,

            y:Math.random()*H/devicePixelRatio,

            r:
                Math.random()<.92
                ? Math.random()*1.3+.2
                : Math.random()*2.2+.8,

            alpha:
                Math.random()*.75+.25,

            twinkle:
                Math.random()*Math.PI*2,

            speed:
                Math.random()*.02+.005

        });

    }

}

createStars();


/* =====================================
   NAMED STARS
===================================== */

const namedStars=[

    {

    {

    }

];


/* =====================================
   PLANETS
===================================== */

const planets=[

    {
        name:"Mercury",
        color:"#d8d8d8",
        size:5,
        description:
        "Mercury is the smallest planet and the closest planet to the Sun."
    },

    {
        name:"Venus",
        color:"#ffd77d",
        size:6,
        description:
        "Venus is the second planet from the Sun and has a thick atmosphere."
    },

    {
        name:"Mars",
        color:"#ff7357",
        size:6,
        description:
        "Mars is the fourth planet from the Sun and is known as the Red Planet."
    },

    {
        name:"Jupiter",
        color:"#e8bd91",
        size:9,
        description:
        "Jupiter is the largest planet in our Solar System."
    },

    {
        name:"Saturn",
        color:"#efd08c",
        size:8,
        description:
        "Saturn is famous for its spectacular ring system."
    }

];


/* =====================================
   CAMERA VIEW
===================================== */

let yaw=0;
let pitch=0;

let dragging=false;
let lastX=0;
let lastY=0;

canvas.addEventListener(
    "touchstart",
    e=>{

        dragging=true;

        lastX=e.touches[0].clientX;
        lastY=e.touches[0].clientY;

    },
    {passive:true}
);

canvas.addEventListener(
    "touchmove",
    e=>{

        if(!dragging)return;

        const x=e.touches[0].clientX;
        const y=e.touches[0].clientY;

        yaw+=(x-lastX)*.25;
        pitch+=(y-lastY)*.18;

        pitch=Math.max(
            -75,
            Math.min(75,pitch)
        );

        lastX=x;
        lastY=y;

    },
    {passive:true}
);

canvas.addEventListener(
    "touchend",
    ()=>{
        dragging=false;
    }
);


/* MOUSE */

canvas.addEventListener(
    "mousedown",
    e=>{

        dragging=true;

        lastX=e.clientX;
        lastY=e.clientY;

    }
);

canvas.addEventListener(
    "mousemove",
    e=>{

        if(!dragging)return;

        yaw+=(e.clientX-lastX)*.25;
        pitch+=(e.clientY-lastY)*.18;

        pitch=Math.max(
            -75,
            Math.min(75,pitch)
        );

        lastX=e.clientX;
        lastY=e.clientY;

    }
);

addEventListener(
    "mouseup",
    ()=>{
        dragging=false;
    }
);


/* =====================================
   DRAW SKY
===================================== */

function draw(){

    ctx.clearRect(
        0,0,
        innerWidth,
        innerHeight
    );

    const cx=innerWidth/2;
    const cy=innerHeight/2;

    for(const s of stars){

        s.twinkle+=s.speed;

        const a =
            s.alpha+
            Math.sin(s.twinkle)*.18;

        let x=s.x+yaw*.35;
        let y=s.y+pitch*.25;

        x=((x%innerWidth)+innerWidth)%innerWidth;

        y=((y%innerHeight)+innerHeight)%innerHeight;

        ctx.beginPath();

        ctx.globalAlpha=Math.max(.05,a);

        ctx.fillStyle="#ffffff";

        ctx.arc(
            x,
            y,
            s.r,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.globalAlpha=1;

    drawNamedStars();

    requestAnimationFrame(draw);

}

draw();


/* =====================================
   NAMED STAR POSITION
===================================== */

function starPosition(star){

    /*
      Educational sky projection.
      RA is converted into horizontal position.
      Dec is converted into vertical position.
    */

    const x =
        (
            star.ra/24*innerWidth
            - yaw*2
        );

    const y =
        innerHeight/2
        -
        (
            star.dec/90*
            innerHeight*.42
        )
        +
        pitch*2;

    return {

        x:((x%innerWidth)+innerWidth)%innerWidth,

        y:Math.max(
            90,
            Math.min(
                innerHeight-100,
                y
            )
        )

    };

}


function drawNamedStars(){

    for(const star of namedStars){

        const p=
            starPosition(star);

        ctx.beginPath();

        ctx.fillStyle=
            star.color;

        ctx.shadowBlur=14;

        ctx.shadowColor=
            star.color;

        ctx.arc(
            p.x,
            p.y,
            star.size,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.shadowBlur=0;

    }

}


/* =====================================
   CONSTELLATION LINES
===================================== */

const constellationLines=[

    ["Betelgeuse","Bell"],
    ["Bell","Rigel"]

];


function drawConstellations(){

    /* visual constellation connections */

}


/* =====================================
   OBJECT OVERLAY
===================================== */

const overlayObjects=[];

function createPlanetLabels(){

    planets.forEach(
        (planet,index)=>{

            const el=
                document.createElement("div");

            el.className="label";

            el.style.setProperty(
                "--size",
                planet.size+"px"
            );

            el.style.setProperty(
                "--glow",
                planet.color
            );

            el.innerHTML=`

                <div class="dot"></div>

                <div class="name">
                    ${planet.name}
                </div>

            `;

            el.onclick=()=>{

                showObject(
                    planet.name,
                    planet.description
                );

            };

            document
                .getElementById("space")
                .appendChild(el);

            overlayObjects.push({
                el,
                index
            });

        }
    );

}

createPlanetLabels();


function updatePlanetLabels(){

    overlayObjects.forEach(
        item=>{

            const planet=
                planets[item.index];

            /*
              Spread planets around sky.
              This gives a natural moving sky-map
              layout while keeping them visible.
            */

            const angle=
                (
                    item.index*67+
                    Date.now()/70000
                )%360;

            const radius=
                28+
                item.index*5;

            const x=
                50+
                Math.cos(
                    angle*Math.PI/180
                )*radius;

            const y=
                46+
                Math.sin(
                    angle*Math.PI/180
                )*22;

            item.el.style.left=
                x+"%";

            item.el.style.top=
                y+"%";

        }
    );

    requestAnimationFrame(
        updatePlanetLabels
    );

}

updatePlanetLabels();


/* =====================================
   POPUP
===================================== */

function showObject(name,description){

    document
        .getElementById("popupTitle")
        .textContent=name;

    document
        .getElementById("popupContent")
        .innerHTML=`

        <p>
        ${description}
        </p>

        <p>
        🌌 Object shown in the GyanSetu
        interactive sky.
        </p>

        `;

    document
        .getElementById("popupBg")
        .style.display="flex";

}


function closePopup(){

    document
        .getElementById("popupBg")
        .style.display="none";

}


/* =====================================
   SEARCH
===================================== */

document
.getElementById("search")
.addEventListener(
    "input",
    function(){

        const q=
            this.value
            .trim()
            .toLowerCase();

        overlayObjects.forEach(
            item=>{

                const name=
                    planets[item.index]
                    .name
                    .toLowerCase();

                item.el.style.opacity=
                    !q ||
                    name.includes(q)
                    ? "1"
                    : ".08";

            }
        );

        namedStars.forEach(
            star=>{

                /* named star visibility
                   is handled through canvas */

            }
        );

    }
);


/* =====================================
   LABEL TOGGLE
===================================== */

let labels=true;

function toggleLabels(){

    labels=!labels;

    overlayObjects.forEach(
        item=>{

            item.el.style.display=
                labels
                ? "block"
                : "none";

        }
    );

}


/* =====================================
   SKY MODE
===================================== */

function setSkyMode(mode){

    if(mode==="planets"){

        overlayObjects.forEach(
            item=>{
                item.el.style.display="block";
            }
        );

    }

    else{

        overlayObjects.forEach(
            item=>{
                item.el.style.display=
                    labels
                    ? "block"
                    : "none";
            }
        );

    }

}


/* =====================================
   DEVICE ORIENTATION
===================================== */

function enableSensors(){

    if(
        typeof DeviceOrientationEvent!=="undefined" &&
        typeof DeviceOrientationEvent.requestPermission==="function"
    ){

        DeviceOrientationEvent
        .requestPermission()
        .then(
            permission=>{

                if(permission==="granted"){

                    window.addEventListener(
                        "deviceorientation",
                        handleOrientation,
                        true
                    );

                }

            }
        )
        .catch(
            console.log
        );

    }

    else{

        window.addEventListener(
            "deviceorientation",
            handleOrientation,
            true
        );

    }

}


function handleOrientation(event){

    let heading=
        event.webkitCompassHeading;

    if(
        heading===undefined ||
        heading===null
    ){

        heading=
            event.alpha||0;

    }

    yaw=
        heading*.6;

    pitch=
        (event.beta||0)-45;

    document
        .getElementById("compass")
        .style.transform=
        `rotate(${-heading}deg)`;

    document
        .getElementById("direction")
        .textContent=
        "🧭 "+Math.round(heading)+"°";

}


/* =====================================
   SKY INFO
===================================== */

function showSkyInfo(){

    showObject(
        "GyanSetu Star Walk",
        "Explore stars, planets and constellations in an interactive educational sky map. Drag the sky with your finger or enable your phone's orientation sensors."
    );

}


/* =====================================
   HOME
===================================== */

function goHome(){

    window.location.href=
        "home.html";

}


/* =====================================
   CLOCK
===================================== */

function updateClock(){

    const now=
        new Date();

    document
        .getElementById("time")
        .textContent=
        "🌍 Local Sky • "+
        now.toLocaleTimeString();

}

updateClock();

setInterval(
    updateClock,
    1000
);

</script>
