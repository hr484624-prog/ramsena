<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>GyanSetu • Sky Map</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,Helvetica,sans-serif;
  color:white;
}

#sky{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  background:
    radial-gradient(circle at 50% 45%,#08142d,#01030a 70%,#000);
}

/* TOP BAR */

.top{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:10;
  padding:15px 14px;
  display:flex;
  gap:10px;
  align-items:center;
  background:linear-gradient(
    180deg,
    rgba(0,0,0,.78),
    rgba(0,0,0,0)
  );
}

.back,
.tool{
  width:42px;
  height:42px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:14px;
  background:rgba(8,15,30,.72);
  backdrop-filter:blur(12px);
  color:white;
  font-size:19px;
  cursor:pointer;
}

.search{
  flex:1;
  height:42px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:14px;
  background:rgba(8,15,30,.72);
  backdrop-filter:blur(12px);
  color:white;
  outline:none;
  padding:0 14px;
  font-size:14px;
}

.search::placeholder{
  color:#94a3b8;
}

/* TITLE */

.title{
  position:fixed;
  top:78px;
  left:16px;
  z-index:8;
  pointer-events:none;
}

.title h1{
  font-size:20px;
  text-shadow:0 2px 12px #000;
}

.title p{
  margin-top:3px;
  font-size:11px;
  color:#a5b4fc;
}

/* COMPASS */

.compass{
  position:fixed;
  top:78px;
  right:15px;
  width:54px;
  height:54px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(5,10,22,.62);
  backdrop-filter:blur(10px);
  z-index:8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  box-shadow:0 0 25px #000;
}

#heading{
  position:absolute;
  bottom:-15px;
  font-size:9px;
  color:#cbd5e1;
}

/* LABELS */

.object-label{
  position:fixed;
  z-index:9;
  transform:translate(-50%,-50%);
  pointer-events:none;
  white-space:nowrap;
  text-align:center;
  text-shadow:0 2px 5px #000;
}

.object-label .name{
  font-size:11px;
  font-weight:bold;
}

.object-label .type{
  font-size:8px;
  color:#94a3b8;
  margin-top:2px;
}

/* CONTROLS */

.controls{
  position:fixed;
  right:15px;
  bottom:105px;
  z-index:15;
  display:flex;
  flex-direction:column;
  gap:9px;
}

.control{
  width:43px;
  height:43px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(7,12,25,.75);
  backdrop-filter:blur(12px);
  color:white;
  font-size:18px;
}

/* BOTTOM BAR */

.bottom{
  position:fixed;
  left:10px;
  right:10px;
  bottom:10px;
  z-index:20;
  height:67px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:22px;
  background:rgba(6,11,23,.82);
  backdrop-filter:blur(18px);
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav{
  border:0;
  background:none;
  color:#94a3b8;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  font-size:10px;
}

.nav span{
  font-size:20px;
}

.nav.active{
  color:white;
}

/* INFO PANEL */

.overlay{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(5px);
}

.panel{
  width:100%;
  max-width:500px;
  margin:auto;
  padding:22px 20px 28px;
  border-radius:28px 28px 0 0;
  background:#0a1224;
  border-top:1px solid #334155;
  box-shadow:0 -20px 70px #000;
  animation:up .25s ease;
}

@keyframes up{
  from{transform:translateY(100%)}
  to{transform:translateY(0)}
}

.panel-icon{
  font-size:48px;
}

.panel h2{
  margin-top:8px;
  font-size:24px;
}

.panel .category{
  color:#818cf8;
  font-size:11px;
  margin-top:4px;
}

.panel p{
  color:#cbd5e1;
  font-size:14px;
  line-height:1.6;
  margin:15px 0 20px;
}

.panel button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:15px;
  background:#2563eb;
  color:white;
  font-weight:bold;
}

/* SEARCH RESULTS */

.results{
  position:fixed;
  top:65px;
  left:66px;
  right:66px;
  max-height:260px;
  overflow:auto;
  z-index:30;
  display:none;
  border:1px solid #334155;
  border-radius:15px;
  background:rgba(5,10,22,.96);
  backdrop-filter:blur(15px);
}

.result{
  padding:13px;
  border-bottom:1px solid #1e293b;
  font-size:13px;
}

.result:last-child{
  border-bottom:0;
}

.result small{
  display:block;
  color:#64748b;
  margin-top:3px;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  z-index:100;
  padding:10px 15px;
  border-radius:14px;
  background:#111827;
  border:1px solid #334155;
  color:#e2e8f0;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
}
</style>
</head>

<body>

<canvas id="sky"></canvas>

<!-- TOP -->
<div class="top">

  <button class="back" onclick="goBack()">‹</button>

  <input
    id="search"
    class="search"
    placeholder="Search stars, planets..."
    autocomplete="off"
    oninput="searchObjects()"
  >

  <button class="tool" onclick="toggleLabels()">✦</button>

</div>

<div class="results" id="results"></div>

<div class="title">
  <h1>Sky Map 🌌</h1>
  <p id="dateText">GyanSetu Space</p>
</div>

<div class="compass">
  🧭
  <span id="heading">N</span>
</div>


<!-- SIDE CONTROLS -->

<div class="controls">

  <button class="control" onclick="zoomIn()">＋</button>

  <button class="control" onclick="resetView()">⌾</button>

  <button class="control" onclick="zoomOut()">−</button>

  <button class="control" onclick="requestMotion()">📱</button>

  <button class="control" onclick="toggleFullscreen()">⛶</button>

</div>


<!-- BOTTOM -->

<div class="bottom">

  <button class="nav active" onclick="setMode('stars')">
    <span>⭐</span>
    Stars
  </button>

  <button class="nav" onclick="setMode('planets')">
    <span>🪐</span>
    Planets
  </button>

  <button class="nav" onclick="setMode('moon')">
    <span>🌙</span>
    Moon
  </button>

  <button class="nav" onclick="setMode('all')">
    <span>🌌</span>
    All
  </button>

</div>


<!-- INFO -->

<div class="overlay" id="overlay">

  <div class="panel">

    <div class="panel-icon" id="infoIcon">⭐</div>

    <h2 id="infoName">Sirius</h2>

    <div class="category" id="infoType">
      Star
    </div>

    <p id="infoText"></p>

    <button onclick="closeInfo()">
      Close
    </button>

  </div>

</div>


<div class="toast" id="toast"></div>


<script>

/* =========================
   CANVAS
========================= */

const canvas=document.getElementById("sky");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){

  W=canvas.width=innerWidth*devicePixelRatio;
  H=canvas.height=innerHeight*devicePixelRatio;

  canvas.style.width=innerWidth+"px";
  canvas.style.height=innerHeight+"px";

  ctx.setTransform(
    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0
  );

}

resize();

addEventListener("resize",resize);


/* =========================
   STARS
========================= */

const stars=[];

function randomStars(){

  stars.length=0;

  for(let i=0;i<320;i++){

    stars.push({

      x:Math.random(),
      y:Math.random(),

      r:
        Math.random()<.85
        ? Math.random()*1.4+.25
        : Math.random()*2.1+.8,

      a:Math.random()*.65+.25,

      tw:Math.random()*Math.PI*2

    });

  }

}

randomStars();


/* =========================
   NAMED OBJECTS
========================= */

const objects=[

  {
    name:"Sirius",
    type:"Star",
    icon:"⭐",
    x:.22,
    y:.62,
    size:5,
    text:"Sirius is the brightest star in Earth's night sky as seen with the unaided eye."
  },

  {
    name:"Vega",
    type:"Star",
    icon:"✨",
    x:.74,
    y:.27,
    size:4,
    text:"Vega is one of the brightest stars visible in the northern sky."
  },

  {
    name:"Polaris",
    type:"Star",
    icon:"🌟",
    x:.84,
    y:.18,
    size:4,
    text:"Polaris is commonly called the North Star because it lies close to the north celestial pole."
  },

  {
    name:"Betelgeuse",
    type:"Star",
    icon:"🔴",
    x:.39,
    y:.31,
    size:5,
    text:"Betelgeuse is a red supergiant star in the constellation Orion."
  },

  {
    name:"Rigel",
    type:"Star",
    icon:"🔵",
    x:.48,
    y:.39,
    size:4,
    text:"Rigel is a bright blue supergiant star in the constellation Orion."
  },

  {
    name:"Aldebaran",
    type:"Star",
    icon:"🟠",
    x:.56,
    y:.48,
    size:4,
    text:"Aldebaran is a giant star in the constellation Taurus."
  },

  {
    name:"Mars",
    type:"Planet",
    icon:"🔴",
    x:.68,
    y:.62,
    size:7,
    text:"Mars is the fourth planet from the Sun and is known as the Red Planet."
  },

  {
    name:"Jupiter",
    type:"Planet",
    icon:"🟠",
    x:.33,
    y:.72,
    size:9,
    text:"Jupiter is the largest planet in our Solar System."
  },

  {
    name:"Saturn",
    type:"Planet",
    icon:"🪐",
    x:.78,
    y:.76,
    size:8,
    text:"Saturn is a gas giant famous for its spectacular ring system."
  },

  {
    name:"Venus",
    type:"Planet",
    icon:"♀️",
    x:.17,
    y:.35,
    size:6,
    text:"Venus is the second planet from the Sun and the hottest planet in our Solar System."
  },

  {
    name:"Moon",
    type:"Moon",
    icon:"🌙",
    x:.56,
    y:.76,
    size:8,
    text:"The Moon is Earth's natural satellite."
  }

];


/* =========================
   STATE
========================= */

let mode="all";
let labels=true;

let offsetX=0;
let offsetY=0;
let zoom=1;

let dragging=false;
let lastX=0;
let lastY=0;


/* =========================
   DRAW
========================= */

function draw(){

  ctx.clearRect(0,0,innerWidth,innerHeight);

  drawBackground();

  drawStars();

  drawObjects();

  requestAnimationFrame(draw);

}


function drawBackground(){

  const g=ctx.createRadialGradient(
    innerWidth*.5,
    innerHeight*.45,
    10,
    innerWidth*.5,
    innerHeight*.45,
    Math.max(innerWidth,innerHeight)
  );

  g.addColorStop(0,"#08152f");
  g.addColorStop(.55,"#020713");
  g.addColorStop(1,"#000");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,innerWidth,innerHeight);

}


function drawStars(){

  for(const s of stars){

    let x=
      s.x*innerWidth*zoom+
      offsetX;

    let y=
      s.y*innerHeight*zoom+
      offsetY;

    x=((x%innerWidth)+innerWidth)%innerWidth;
    y=((y%innerHeight)+innerHeight)%innerHeight;

    const alpha=
      s.a+
      Math.sin(Date.now()/700+s.tw)*.15;

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      s.r,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
      `rgba(255,255,255,${alpha})`;

    ctx.fill();

  }

}


function allowed(obj){

  if(mode==="all") return true;

  if(mode==="stars")
    return obj.type==="Star";

  if(mode==="planets")
    return obj.type==="Planet";

  if(mode==="moon")
    return obj.type==="Moon";

  return true;

}


function drawObjects(){

  document
    .querySelectorAll(".object-label")
    .forEach(e=>e.remove());

  objects.forEach((obj,index)=>{

    if(!allowed(obj)) return;

    let x=
      obj.x*innerWidth*zoom+
      offsetX;

    let y=
      obj.y*innerHeight*zoom+
      offsetY;

    x=((x%innerWidth)+innerWidth)%innerWidth;
    y=((y%innerHeight)+innerHeight)%innerHeight;

    /* glow */

    const glow=ctx.createRadialGradient(
      x,y,0,
      x,y,obj.size*5
    );

    glow.addColorStop(0,"rgba(255,255,255,.8)");
    glow.addColorStop(1,"rgba(255,255,255,0)");

    ctx.fillStyle=glow;

    ctx.beginPath();
    ctx.arc(x,y,obj.size*5,0,Math.PI*2);
    ctx.fill();

    /* object */

    ctx.beginPath();
    ctx.arc(x,y,obj.size,0,Math.PI*2);

    ctx.fillStyle=
      obj.type==="Planet"
      ? "#f8fafc"
      : "#ffffff";

    ctx.fill();

    /* clickable area */

    if(labels){

      const el=document.createElement("div");

      el.className="object-label";

      el.style.left=x+"px";
      el.style.top=(y+obj.size+15)+"px";

      el.innerHTML=`
        <div class="name">${obj.icon} ${obj.name}</div>
        <div class="type">${obj.type}</div>
      `;

      el.onclick=()=>showInfo(obj);

      document.body.appendChild(el);

    }

  });

}


/* =========================
   TOUCH / DRAG
========================= */

function startDrag(x,y){

  dragging=true;
  lastX=x;
  lastY=y;

}

function moveDrag(x,y){

  if(!dragging)return;

  offsetX+=x-lastX;
  offsetY+=y-lastY;

  lastX=x;
  lastY=y;

}

function endDrag(){

  dragging=false;

}


canvas.addEventListener("touchstart",e=>{

  const t=e.touches[0];

  startDrag(t.clientX,t.clientY);

},{passive:true});


canvas.addEventListener("touchmove",e=>{

  const t=e.touches[0];

  moveDrag(t.clientX,t.clientY);

},{passive:true});


canvas.addEventListener("touchend",endDrag);


canvas.addEventListener("mousedown",e=>{
  startDrag(e.clientX,e.clientY);
});

canvas.addEventListener("mousemove",e=>{
  moveDrag(e.clientX,e.clientY);
});

canvas.addEventListener("mouseup",endDrag);

canvas.addEventListener("mouseleave",endDrag);


/* =========================
   ZOOM
========================= */

function zoomIn(){

  zoom=Math.min(2.4,zoom+.15);

  toast("Zoom in 🔭");

}

function zoomOut(){

  zoom=Math.max(.65,zoom-.15);

  toast("Zoom out");

}

function resetView(){

  zoom=1;
  offsetX=0;
  offsetY=0;

  toast("Sky view reset");

}


/* =========================
   MODE
========================= */

function setMode(newMode){

  mode=newMode;

  document
    .querySelectorAll(".nav")
    .forEach(n=>n.classList.remove("active"));

  event.currentTarget.classList.add("active");

  toast(
    newMode==="all"
    ? "Showing all objects"
    : "Showing "+newMode
  );

}


/* =========================
   LABELS
========================= */

function toggleLabels(){

  labels=!labels;

  toast(
    labels
    ? "Labels ON"
    : "Labels OFF"
  );

}


/* =========================
   INFO
========================= */

function showInfo(obj){

  document.getElementById("infoIcon")
    .textContent=obj.icon;

  document.getElementById("infoName")
    .textContent=obj.name;

  document.getElementById("infoType")
    .textContent=obj.type;

  document.getElementById("infoText")
    .textContent=obj.text;

  document.getElementById("overlay")
    .style.display="flex";

}


function closeInfo(){

  document.getElementById("overlay")
    .style.display="none";

}


document.getElementById("overlay")
.addEventListener("click",e=>{

  if(e.target.id==="overlay")
    closeInfo();

});


/* =========================
   SEARCH
========================= */

function searchObjects(){

  const q=
    document
    .getElementById("search")
    .value
    .toLowerCase()
    .trim();

  const results=
    document.getElementById("results");

  results.innerHTML="";

  if(!q){

    results.style.display="none";
    return;

  }

  const found=
    objects.filter(o=>
      o.name.toLowerCase().includes(q) ||
      o.type.toLowerCase().includes(q)
    );

  if(found.length===0){

    results.innerHTML=
      `<div class="result">No object found</div>`;

  }else{

    found.forEach(obj=>{

      const div=document.createElement("div");

      div.className="result";

      div.innerHTML=`
        ${obj.icon} ${obj.name}
        <small>${obj.type}</small>
      `;

      div.onclick=()=>{

        results.style.display="none";

        document.getElementById("search").value=
          obj.name;

        showInfo(obj);

      };

      results.appendChild(div);

    });

  }

  results.style.display="block";

}


/* =========================
   DEVICE ORIENTATION
========================= */

function requestMotion(){

  if(
    typeof DeviceOrientationEvent!=="undefined" &&
    typeof DeviceOrientationEvent.requestPermission==="function"
  ){

    DeviceOrientationEvent
      .requestPermission()
      .then(response=>{

        if(response==="granted"){

          window.addEventListener(
            "deviceorientation",
            handleOrientation
          );

          toast("Sky orientation enabled 🧭");

        }

      })
      .catch(()=>{
        toast("Motion permission was not granted");
      });

  }else{

    window.addEventListener(
      "deviceorientation",
      handleOrientation
    );

    toast("Sky orientation enabled 🧭");

  }

}


function handleOrientation(event){

  if(event.alpha==null)return;

  const heading=
    Math.round(event.alpha);

  document.getElementById("heading")
    .textContent=heading+"°";

}


/* =========================
   FULLSCREEN
========================= */

function toggleFullscreen(){

  if(!document.fullscreenElement){

    document.documentElement
      .requestFullscreen?.();

  }else{

    document.exitFullscreen?.();

  }

}


/* =========================
   BACK
========================= */

function goBack(){

  window.location.href="discover-space.html";

}


/* =========================
   TOAST
========================= */

let toastTimer;

function toast(message){

  const el=
    document.getElementById("toast");

  el.textContent=message;

  el.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{

    el.classList.remove("show");

  },1500);

}


/* =========================
   DATE
========================= */

function updateDate(){

  const d=new Date();

  document.getElementById("dateText")
    .textContent=
      d.toLocaleDateString(
        "en-IN",
        {
          day:"numeric",
          month:"short",
          year:"numeric"
        }
      )+" • GyanSetu Space";

}

updateDate();


/* START */

draw();

</script>

</body>
</html>
