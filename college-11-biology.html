/* =========================
   RENDER CHAPTERS
========================= */

function renderChapters(){

  const list =
    document.getElementById("chapterList");

  list.innerHTML = "";

  chapters.forEach(function(chapter){

    const button =
      document.createElement("button");

    button.type = "button";

    button.className = "chapter-btn";

    button.innerHTML = `

      <div class="chapter-number">
        ${chapter.number}
      </div>

      <div class="chapter-info">

        <h3>
          Chapter ${chapter.number}: ${chapter.title}
        </h3>

        <p>
          Explanation पाहण्यासाठी येथे tap करा
        </p>

      </div>

      <div class="chapter-arrow">
        ›
      </div>

    `;

    button.onclick = function(){

      openChapter(chapter);

    };

    list.appendChild(button);

  });

}


/* =========================
   OPEN CHAPTER
========================= */

function openChapter(chapter){

  document.getElementById("popupTitle").textContent =
    "Chapter " + chapter.number + ": " + chapter.title;

  document.getElementById("popupIcon").textContent =
    chapter.icon;

  document.getElementById("popupIntro").textContent =
    chapter.intro;

  const explanation =
    document.getElementById("popupExplanation");

  explanation.innerHTML = "";

  chapter.lines.forEach(function(line,index){

    const div =
      document.createElement("div");

    div.className = "explanation-line";

    div.innerHTML =
      "<b>" + (index + 1) + ".</b> " + line;

    explanation.appendChild(div);

  });

  document.getElementById("popupRemember").textContent =
    chapter.remember;

  document.getElementById("popupBg").style.display =
    "flex";

  document.body.style.overflow =
    "hidden";

}


/* =========================
   CLOSE POPUP
========================= */

function closePopup(){

  document.getElementById("popupBg").style.display =
    "none";

  document.body.style.overflow =
    "";

}


/* =========================
   OUTSIDE CLICK
========================= */

function closeOutside(event){

  if(event.target.id === "popupBg"){

    closePopup();

  }

}


/* =========================
   ESC KEY
========================= */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Escape"){

      closePopup();

    }

  }
);


/* =========================
   BACK
========================= */

function goBack(){

  window.location.href =
    "college-11.html";

}


/* =========================
   START
========================= */

renderChapters();
