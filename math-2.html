function selectMedium(medium){

  currentMedium=medium;

  document.getElementById("currentMedium")
    .innerText=mediumNames[medium];

  renderChapters();

  closeModal();

}


function renderChapters(){

  const box=document.getElementById("chapters");

  if(!currentMedium){

    box.innerHTML=`

      <div class="empty">

        🌐<br><br>

        प्रथम Medium निवडा.

      </div>

    `;

    return;
  }

  box.innerHTML="";

  chaptersData.forEach(
    function(chapter,index){

      const card=document.createElement("div");

      card.className="chapter-card";

      card.onclick=function(){

        openChapter(chapter);

      };

      card.innerHTML=`

        <div class="chapter-number">
          ${String(index+1).padStart(2,"0")}
        </div>

        <div class="chapter-content">

          <h3>
            ${chapter.icon}
            ${chapter.title[currentMedium]}
          </h3>

          <p>
            ${chapter.description[currentMedium]}
          </p>

        </div>

        <div class="chapter-arrow">
          ›
        </div>

      `;

      box.appendChild(card);

    }
  );

}

      <h3>⭐ लक्षात ठेवा</h3>

      <p>
        धडा नीट समजून घ्या,
        उदाहरणे स्वतः सोडवा
        आणि नियमित सराव करा.
      </p>

    </div>

    <div class="quiz-heading">

      <h3>📝 20 प्रश्नांची Quiz</h3>

      <p>
        प्रत्येक प्रश्नाचे योग्य उत्तर निवडा.
      </p>

    </div>

  `;


  const questions=quizQuestions[currentMedium];


  questions.forEach(
    function(item,index){

      html+=`

        <div
          class="question-card"
          data-question="${index}">

          <div class="question-number">

            प्रश्न ${index+1} / 20

          </div>

          <div class="question">

            ${item[0]}

          </div>

          <div>

            ${item[1].map(
              function(option,optIndex){

                return `

                  <button
                    class="option"
                    data-option="${optIndex}"
                    onclick="
                      chooseOption(
                        ${index},
                        ${optIndex}
                      )
                    ">

                    ${option}

                  </button>

                `;

              }
            ).join("")}

          </div>

        </div>

      `;

    }
  );


  html+=`

    <button
      class="submit-btn"
      onclick="checkQuiz()">

      ✅ Quiz Submit करा

    </button>

    <div
      class="score-box"
      id="scoreBox">

      <div
        class="score-big"
        id="scoreText">
      </div>

      <p
        id="scoreMessage">
      </p>

    </div>

  `;


  document.getElementById("modalBody")
    .innerHTML=html;

  document.getElementById("modalBg")
    .classList.add("show");

}


function chooseOption(
  questionIndex,
  optionIndex
){

  if(quizSubmitted){
    return;
  }

  selectedAnswers[questionIndex]=
    optionIndex;

  const card=document.querySelector(
    '[data-question="'+
    questionIndex+
    '"]'
  );

  const options=
    card.querySelectorAll(".option");

  options.forEach(
    function(btn){

      btn.classList.remove("selected");

    }
  );

  options[optionIndex]
    .classList.add("selected");

}


function checkQuiz(){

  if(quizSubmitted){
    return;
  }

  const questions=
    quizQuestions[currentMedium];

  let score=0;

  questions.forEach(
    function(item,index){

      const card=document.querySelector(
        '[data-question="'+
        index+
        '"]'
      );

      const options=
        card.querySelectorAll(".option");

      const correct=item[2];

      options[correct]
        .classList.add("correct");

      if(
        selectedAnswers[index] ===
        correct
      ){

        score++;

      }
      else if(
        selectedAnswers[index] !==
        undefined
      ){

        options[
          selectedAnswers[index]
        ].classList.add("wrong");

      }

    }
  );


  quizSubmitted=true;


  const scoreBox=
    document.getElementById("scoreBox");

  const scoreText=
    document.getElementById("scoreText");

  const scoreMessage=
    document.getElementById("scoreMessage");


  scoreText.innerText=
    score+" / 20";


  if(score>=18){

    scoreMessage.innerText=
      "🏆 उत्कृष्ट! खूप छान!";

  }
  else if(score>=14){

    scoreMessage.innerText=
      "🌟 खूप छान! अजून थोडा सराव कर.";

  }
  else if(score>=10){

    scoreMessage.innerText=
      "👍 चांगला प्रयत्न!";

  }
  else{

    scoreMessage.innerText=
      "💪 पुन्हा सराव कर आणि Quiz दे.";

  }


  scoreBox.classList.add("show");

  scoreBox.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

}


function closeModal(){

  document.getElementById("modalBg")
    .classList.remove("show");

}


function goBack(){

  window.location.href="learn.html";

}


document.getElementById("modalBg")
  .addEventListener(
    "click",
    function(event){

      if(event.target===this){

        closeModal();

      }

    }
  );

</script>

</body>
</html>
