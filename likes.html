<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Likes - VIBRA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
      padding-bottom: 80px;
    }

    .top {
      background: white;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 1px solid #ddd;
    }

    .likes-box {
      background: white;
      margin: 20px;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
    }

    .heart {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .likes-box h2 {
      margin-bottom: 8px;
    }

    .likes-box p {
      color: #777;
    }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 65px;
      background: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #ddd;
      font-size: 28px;
    }

    .bottom a {
      color: #111;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="top">
    Likes ❤️
  </div>

  <div class="likes-box">

    <div class="heart">♡</div>

    <h2>No Likes Yet</h2>

    <p>
      Posts you like will appear here.
    </p>

  </div>

  <div class="bottom">
    <a href="index.html">⌂</a>
    <a href="search.html">⌕</a>
    <a href="create.html">＋</a>
    <span>♡</span>
    <a href="profile.html">◯</a>
  </div>

</body>
</html>
