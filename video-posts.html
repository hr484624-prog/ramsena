<!DOCTYPE html>
<html lang="mr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>GyanSetu - Video Posts</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  background:
    linear-gradient(
      145deg,
      #050505,
      #10152b,
      #24102d,
      #050505
    );
  color:white;
  font-family:Arial,sans-serif;
  min-height:100%;
}

body{
  min-height:100vh;
}


/* =========================
   HEADER
========================= */

.header{

  position:sticky;
  top:0;
  z-index:50;

  height:65px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 15px;

  background:
    linear-gradient(
      90deg,
      #050505,
      #111a3a,
      #250c27
    );

  border-bottom:
    1px solid
    rgba(255,255,255,.12);

  box-shadow:
    0 5px 25px
    rgba(0,0,0,.45);
}


.logo{

  font-size:22px;

  font-weight:900;

  background:
    linear-gradient(
      90deg,
      #2196f3,
      #e91e63,
      #ff4081
    );

  -webkit-background-clip:text;

  -webkit-text-fill-color:
    transparent;
}


.uploadBtn{

  border:0;

  padding:10px 15px;

  border-radius:12px;

  color:white;

  font-weight:bold;

  background:
    linear-gradient(
      135deg,
      #1976ff,
      #e91e63
    );

  box-shadow:
    0 5px 18px
    rgba(233,30,99,.28);

  cursor:pointer;
}

.uploadBtn:active{
  transform:scale(.96);
}


/* =========================
   CONTAINER
========================= */

.container{

  width:100%;

  max-width:650px;

  margin:auto;

  padding:
    15px
    12px
    40px;
}


/* =========================
   LOADING
========================= */

.loading{

  text-align:center;

  padding:50px 15px;

  color:#bbb;

  font-size:15px;
}


/* =========================
   POST
========================= */

.post{

  background:
    linear-gradient(
      145deg,
      #101010,
      #121a32,
      #1c1020
    );

  border:
    1px solid
    rgba(255,255,255,.09);

  border-radius:20px;

  overflow:hidden;

  margin-bottom:22px;

  box-shadow:
    0 12px 35px
    rgba(0,0,0,.45);
}


/* =========================
   USER HEADER
========================= */

.user{

  min-height:64px;

  display:flex;

  align-items:center;

  gap:10px;

  padding:12px 13px;

  border-bottom:
    1px solid
    rgba(255,255,255,.07);
}


.avatar{

  width:42px;

  height:42px;

  flex-shrink:0;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  font-weight:bold;

  font-size:17px;

  color:white;

  background:
    linear-gradient(
      135deg,
      #1976ff,
      #e91e63
    );

  box-shadow:
    0 4px 15px
    rgba(233,30,99,.25);
}


.userInfo{

  flex:1;

  min-width:0;
}


.username{

  color:white;

  font-size:15px;

  font-weight:bold;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


.userLabel{

  margin-top:3px;

  color:#999;

  font-size:11px;
}


/* =========================
   MESSAGE BUTTON
========================= */

.messageBtn{

  border:0;

  padding:
    8px
    11px;

  border-radius:10px;

  background:
    linear-gradient(
      135deg,
      #2196f3,
      #1565c0
    );

  color:white;

  font-size:12px;

  font-weight:bold;

  cursor:pointer;

  white-space:nowrap;

  box-shadow:
    0 4px 12px
    rgba(33,150,243,.25);
}

.messageBtn:active{
  transform:scale(.95);
}


/* =========================
   VIDEO
========================= */

.video{

  width:100%;

  display:block;

  background:#000;

  max-height:650px;

  object-fit:contain;
}


/* =========================
   ACTIONS
========================= */

.actions{

  display:flex;

  align-items:center;

  gap:18px;

  padding:12px 14px;

  border-bottom:
    1px solid
    rgba(255,255,255,.07);
}


.action{

  border:0;

  background:transparent;

  color:white;

  font-size:16px;

  cursor:pointer;

  padding:5px 0;
}


.action span{

  margin-left:4px;

  color:#ddd;

  font-size:14px;
}


.action:active{
  transform:scale(.94);
}


/* =========================
   COMMENTS
========================= */

.commentBox{

  padding:12px 14px 15px;
}


.comments{

  max-height:190px;

  overflow-y:auto;

  margin-bottom:10px;
}


.comment{

  padding:8px 0;

  font-size:14px;

  color:#ddd;

  line-height:1.4;

  border-bottom:
    1px solid
    rgba(255,255,255,.04);
}


.comment b{

  color:#64b5f6;

  margin-right:5px;
}


.commentInput{

  width:100%;

  padding:11px 13px;

  border:
    1px solid
    rgba(255,255,255,.14);

  border-radius:12px;

  outline:none;

  background:#080808;

  color:white;

  font-size:14px;
}


.commentInput:focus{

  border-color:#e91e63;

  box-shadow:
    0 0 0 2px
    rgba(233,30,99,.12);
}


.commentInput::placeholder{
  color:#777;
}


/* =========================
   EMPTY
========================= */

.empty{

  text-align:center;

  padding:65px 20px;

  color:#aaa;

  background:
    rgba(255,255,255,.03);

  border-radius:18px;
}


/* =========================
   MODAL
========================= */

.modal{

  display:none;

  position:fixed;

  inset:0;

  z-index:100;

  background:
    rgba(0,0,0,.82);

  align-items:center;

  justify-content:center;

  padding:18px;
}


.modalBox{

  width:100%;

  max-width:430px;

  background:
    linear-gradient(
      145deg,
      #111,
      #111a34,
      #250d21
    );

  border:
    1px solid
    rgba(255,255,255,.12);

  border-radius:20px;

  padding:20px;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.65);
}


.modalBox h2{

  margin:
    0
    0
    8px;

  font-size:21px;
}


#fileName{

  color:#aaa;

  font-size:13px;

  word-break:break-word;
}


.preview{

  width:100%;

  max-height:320px;

  margin-top:15px;

  border-radius:14px;

  background:#000;

  display:none;
}


.modalActions{

  display:flex;

  gap:10px;

  margin-top:16px;
}


.modalActions button{

  flex:1;

  padding:13px;

  border:0;

  border-radius:12px;

  font-weight:bold;

  cursor:pointer;
}


.cancel{

  background:#222;

  color:white;
}


.postNow{

  background:
    linear-gradient(
      135deg,
      #1976ff,
      #e91e63
    );

  color:white;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:430px){

  .container{
    padding:10px 7px 30px;
  }

  .post{
    border-radius:16px;
  }

  .messageBtn{
    padding:8px 9px;
    font-size:11px;
  }

}

</style>

</head>


<body>


<header class="header">

  <div class="logo">
    📚 GyanSetu
  </div>

  <button
    class="uploadBtn"
    onclick="openUpload()">

    ＋ Post Video

  </button>

</header>


<main class="container">

  <div
    id="loading"
    class="loading">

    Videos loading...

  </div>

  <div id="posts"></div>

</main>


<input
  type="file"
  id="fileInput"
  accept="video/*"
  style="display:none"
  onchange="fileSelected(event)"
>


<!-- =========================
     UPLOAD MODAL
========================= -->

<div
  class="modal"
  id="uploadModal">

  <div class="modalBox">

    <h2>
      🎥 Post Video
    </h2>

    <p id="fileName">
      Video निवडा
    </p>

    <video
      id="preview"
      class="preview"
      controls
      playsinline>
    </video>

    <div class="modalActions">

      <button
        class="cancel"
        onclick="closeUpload()">

        Cancel

      </button>

      <button
        class="postNow"
        onclick="uploadVideo()">

        Post Video

      </button>

    </div>

  </div>

</div>


<script>


/* =========================
   SUPABASE
========================= */

const supabaseClient =
supabase.createClient(

  "https://eqglttfffhvoyvrclzse.supabase.co",

  "sb_publishable_rR4xxl0dW5DJrhhjqiFHLw_uJ-HakAb"

);


let currentUser = null;

let selectedFile = null;


/* =========================
   CHECK USER
========================= */

async function checkUser(){

  const {
    data:{
      user
    }
  } =
  await supabaseClient
  .auth
  .getUser();


  if(!user){

    alert(
      "Please login to GyanSetu first."
    );

    window.location.href =
      "account.html";

    return false;

  }


  currentUser = user;

  return true;

}


/* =========================
   OPEN UPLOAD
========================= */

async function openUpload(){

  if(
    !await checkUser()
  ){
    return;
  }


  document
  .getElementById("fileInput")
  .click();

}


/* =========================
   FILE SELECT
========================= */

function fileSelected(event){

  selectedFile =
    event.target.files[0];


  if(!selectedFile){
    return;
  }


  document
  .getElementById("uploadModal")
  .style.display =
    "flex";


  document
  .getElementById("fileName")
  .innerText =
    selectedFile.name;


  const preview =
    document
    .getElementById("preview");


  preview.src =
    URL.createObjectURL(
      selectedFile
    );


  preview.style.display =
    "block";

}


/* =========================
   CLOSE MODAL
========================= */

function closeUpload(){

  document
  .getElementById("uploadModal")
  .style.display =
    "none";


  document
  .getElementById("fileInput")
  .value =
    "";


  selectedFile = null;


  const preview =
    document
    .getElementById("preview");


  preview.pause();

  preview.removeAttribute("src");

  preview.load();

}


/* =========================
   UPLOAD
========================= */

async function uploadVideo(){

  if(!selectedFile){

    alert(
      "कृपया Video निवडा."
    );

    return;

  }


  if(!currentUser){

    if(
      !await checkUser()
    ){
      return;
    }

  }


  const button =
    document
    .querySelector(".postNow");


  button.disabled = true;

  button.innerText =
    "Uploading...";


  try{

    const extension =
      selectedFile.name
      .split(".")
      .pop();


    const filePath =
      currentUser.id +
      "/" +
      Date.now() +
      "." +
      extension;


    /* =====================
       STORAGE UPLOAD
    ===================== */

    const {
      error:uploadError
    } =
    await supabaseClient
    .storage
    .from("videos")
    .upload(

      filePath,

      selectedFile,

      {
        contentType:
          selectedFile.type,

        upsert:false

      }

    );


    if(uploadError){
      throw uploadError;
    }


    /* =====================
       DATABASE POST
    ===================== */

    const {
      error:dbError
    } =
    await supabaseClient
    .from("video_posts")
    .insert({

      user_id:
        currentUser.id,

      video_path:
        filePath,

      status:
        "pending"

    });


    if(dbError){
      throw dbError;
    }


    closeUpload();


    alert(
      "✅ Video upload झाले!\n\nAI moderation तपासणी सुरू आहे."
    );


    loadPosts();

  }

  catch(error){

    console.error(error);


    alert(
      "❌ Upload failed\n\n" +
      error.message
    );

  }


  button.disabled = false;

  button.innerText =
    "Post Video";

}


/* =========================
   LOAD POSTS
========================= */

async function loadPosts(){

  const posts =
    document
    .getElementById("posts");


  const loading =
    document
    .getElementById("loading");


  loading.style.display =
    "block";


  posts.innerHTML =
    "";


  const {
    data,
    error
  } =
  await supabaseClient
  .from("video_posts")
  .select("*")
  .eq(
    "status",
    "approved"
  )
  .order(
    "created_at",
    {
      ascending:false
    }
  );


  if(error){

    console.error(error);

    loading.innerText =
      "Videos load करता आले नाहीत.";

    return;

  }


  loading.style.display =
    "none";


  if(
    !data ||
    data.length === 0
  ){

    posts.innerHTML = `

      <div class="empty">

        🎥 अजून कोणताही video नाही.

        <br><br>

        पहिला video तुम्ही post करा!

      </div>

    `;

    return;

  }


  for(
    const post of data
  ){

    await createPost(post);

  }

}


/* =========================
   CREATE POST
========================= */

async function createPost(post){

  const {
    data:urlData
  } =
  await supabaseClient
  .storage
  .from("videos")
  .createSignedUrl(

    post.video_path,

    3600

  );


  if(
    !urlData ||
    !urlData.signedUrl
  ){
    return;
  }


  const videoUrl =
    urlData.signedUrl;


  /* =====================
     PROFILE
  ===================== */

  const {
    data:profile
  } =
  await supabaseClient
  .from("Profiles")
  .select(
    "username"
  )
  .eq(
    "id",
    post.user_id
  )
  .maybeSingle();


  const username =
    profile?.username ||
    "GyanSetu User";


  /* =====================
     LIKES
  ===================== */

  const {
    count:likeCount
  } =
  await supabaseClient
  .from("video_likes")
  .select(
    "*",
    {
      count:"exact",
      head:true
    }
  )
  .eq(
    "post_id",
    post.id
  );


  /* =====================
     MY LIKE
  ===================== */

  const {
    data:myLike
  } =
  await supabaseClient
  .from("video_likes")
  .select("id")
  .eq(
    "post_id",
    post.id
  )
  .eq(
    "user_id",
    currentUser.id
  )
  .maybeSingle();


  /* =====================
     COMMENTS
  ===================== */

  const {
    data:comments
  } =
  await supabaseClient
  .from("video_comments")
  .select("*")
  .eq(
    "post_id",
    post.id
  )
  .order(
    "created_at",
    {
      ascending:true
    }
  );


  let commentsHTML = "";


  for(
    const comment of
    comments || []
  ){

    const {
      data:commentProfile
    } =
    await supabaseClient
    .from("Profiles")
    .select(
      "username"
    )
    .eq(
      "id",
      comment.user_id
    )
    .maybeSingle();


    const commentUsername =
      commentProfile?.username ||
      "User";


    commentsHTML += `

      <div class="comment">

        <b>
          ${escapeHTML(
            commentUsername
          )}
        </b>

        ${escapeHTML(
          comment.comment
        )}

      </div>

    `;

  }


  /* =====================
     POST ELEMENT
  ===================== */

  const postElement =
    document.createElement(
      "article"
    );


  postElement.className =
    "post";


  postElement.innerHTML = `

    <div class="user">

      <div class="avatar">

        ${escapeHTML(
          username
          .charAt(0)
          .toUpperCase()
        )}

      </div>


      <div class="userInfo">

        <div class="username">

          ${escapeHTML(
            username
          )}

        </div>

        <div class="userLabel">
          GyanSetu Member
        </div>

      </div>


      <!-- MESSAGE BUTTON -->

      <button
        class="messageBtn"
        onclick="openMessage(
          '${escapeJS(post.user_id)}',
          '${escapeJS(username)}'
        )">

        💬 Message

      </button>

    </div>


    <video
      class="video"
      controls
      playsinline
      preload="metadata"
      src="${videoUrl}">
    </video>


    <div class="actions">

      <button
        class="action"
        onclick="toggleLike(
          '${post.id}',
          this
        )">

        ${
          myLike
          ? "❤️"
          : "🤍"
        }

        <span>
          ${likeCount || 0}
        </span>

      </button>


      <button
        class="action"
        onclick="focusComment(
          '${post.id}'
        )">

        💬

        <span>
          ${(comments || []).length}
        </span>

      </button>

    </div>


    <div class="commentBox">

      <div
        class="comments"
        id="comments-${post.id}">

        ${commentsHTML}

      </div>


      <input
        class="commentInput"
        id="input-${post.id}"
        placeholder="Comment लिहा..."
        onkeydown="
          commentKey(
            event,
            '${post.id}'
          )
        "
      >

    </div>

  `;


  document
  .getElementById("posts")
  .appendChild(
    postElement
  );

}


/* =========================
   MESSAGE
========================= */

function openMessage(
  userId,
  username
){

  /*
    स्वतःलाच message करू नये
  */

  if(
    userId ===
    currentUser.id
  ){

    alert(
      "तुम्ही स्वतःलाच Message करू शकत नाही."
    );

    return;

  }


  /*
    message.html ला
    दुसऱ्या user ची माहिती पाठवतो
  */

  const url =
    "message.html" +
    "?user_id=" +
    encodeURIComponent(
      userId
    ) +
    "&username=" +
    encodeURIComponent(
      username
    );


  window.location.href =
    url;

}


/* =========================
   LIKE
========================= */

async function toggleLike(
  postId,
  button
){

  const {
    data:existing
  } =
  await supabaseClient
  .from("video_likes")
  .select("id")
  .eq(
    "post_id",
    postId
  )
  .eq(
    "user_id",
    currentUser.id
  )
  .maybeSingle();


  if(existing){

    await supabaseClient
    .from("video_likes")
    .delete()
    .eq(
      "id",
      existing.id
    );

  }
  else{

    await supabaseClient
    .from("video_likes")
    .insert({

      post_id:
        postId,

      user_id:
        currentUser.id

    });

  }


  loadPosts();

}


/* =========================
   ADD COMMENT
========================= */

async function addComment(
  postId
){

  const input =
    document
    .getElementById(
      "input-" + postId
    );


  const text =
    input.value.trim();


  if(!text){
    return;
  }


  const {
    error
  } =
  await supabaseClient
  .from("video_comments")
  .insert({

    post_id:
      postId,

    user_id:
      currentUser.id,

    comment:
      text

  });


  if(error){

    alert(
      error.message
    );

    return;

  }


  input.value = "";

  loadPosts();

}


/* =========================
   ENTER COMMENT
========================= */

function commentKey(
  event,
  postId
){

  if(
    event.key ===
    "Enter"
  ){

    event.preventDefault();

    addComment(
      postId
    );

  }

}


/* =========================
   FOCUS COMMENT
========================= */

function focusComment(
  postId
){

  const input =
    document.getElementById(
      "input-" + postId
    );


  if(input){

    input.focus();

  }

}


/* =========================
   SECURITY
========================= */

function escapeHTML(text){

  return String(text || "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeJS(text){

  return String(text || "")

    .replace(
      /\\/g,
      "\\\\"
    )

    .replace(
      /'/g,
      "\\'"
    )

    .replace(
      /\n/g,
      "\\n"
    )

    .replace(
      /\r/g,
      "\\r"
    );

}


/* =========================
   START
========================= */

(async function(){

  const logged =
    await checkUser();


  if(logged){

    await loadPosts();

  }

})();

</script>

</body>

</html>
