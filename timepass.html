const SUPABASE_URL="https://eqglttfffhvoyvrclzse.supabase.co";
const SUPABASE_KEY="sb_publishable_rR4xxl0dW5DJrhhjqiFHLw_uJ-HakAb";

const escA=t=>String(t??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/'/g,"&#39;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function lsGet(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}

/* ICONS */
const P={home:'<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/>',plus:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/>',reel:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M3 9h18M9 3l3 6M15 3l3 6"/><path d="M10 13l5 3-5 3z"/>',heart:'<path d="M12 21s-8-5.5-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.5-8 11-8 11z"/>',chat:'<path d="M21 12a8 8 0 01-11.5 7.2L3 21l1.8-6A8 8 0 1121 12z"/>',send:'<path d="M22 3L9.500 13.500M22 3l-7 18-5.500-7.500L2 9z"/>',mark:'<path d="M6 3h12v18l-6-5-6 5z"/>',more:'<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',back:'<path d="M15 5l-7 7 7 7"/>',x:'<path d="M5 5l14 14M19 5L5 19"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>'};

/* STATE */
let currentUser=null,currentName="GyanSetu User",videos=[],currentVideo=null;
let T="feed",sortMode="latest",SQ="",MUTE=true,FEED="all",UM="post";
let likeCount={},myLikes=new Set(),commentCount={},savedSet=new Set(),CM=[],likesReady=true,commentsReady=true;
let FL=[],ST=[],SV=[],SG=[],gi=0,vi=0,stCur=null,VSET=new Set(),followReady=true,storyReady=true;

/* USER + DATA */
async function getUser(){
  const {data}=await supabaseClient.auth.getUser();currentUser=data?.user||null;if(!currentUser)return;
  currentName=currentUser.user_metadata?.username||currentUser.user_metadata?.name||(currentUser.email?currentUser.email.split("@")[0]:"GyanSetu User");
  try{const {data:p}=await supabaseClient.from("Profiles").select("username").eq("id",currentUser.id).maybeSingle();if(p?.username)currentName=p.username}catch(e){}
}
async function loadFollows(){const {data,error}=await supabaseClient.from("Follows").select("follower_id,following_id");followReady=!error;FL=data||[]}
async function loadStories(){
  const since=new Date(Date.now()-STORY_HOURS*3600e3).toISOString();
  const {data,error}=await supabaseClient.from("Stories").select("*").gte("created_at",since).order("created_at",{ascending:true});
  storyReady=!error;ST=data||[];SV=[];
  const mine=ST.filter(s=>currentUser&&s.user_id===currentUser.id).map(s=>s.id);

}
async function loadVideos(){
  const {data,error}=await supabaseClient.from("Videos").select("*").order("created_at",{ascending:false});

  videos=data||[];

  likesReady=!l.error;commentsReady=!c.error;CM=c.data||[];

  commentCount={};CM.forEach(r=>{const k=String(r.video_id);commentCount[k]=(commentCount[k]||0)+1});
  render();notifDot();
}
function getList(q,mode){
  let L=videos.slice();q=(q||"").trim().toLowerCase();
  if(q)L=L.filter(v=>[v.title,v.description,v.username].some(x=>String(x||"").toLowerCase().includes(q)));
  if(mode==="saved")L=L.filter(v=>savedSet.has(String(v.id)));
  if(mode==="mine")L=L.filter(v=>currentUser&&v.user_id===currentUser.id);
  if(mode==="fol")L=L.filter(v=>isF(v.user_id)||(currentUser&&v.user_id===currentUser.id));
  const t=v=>new Date(v.created_at||0).getTime();

}

  openSheet(`<h3>Notifications</h3>`+(Fo?`<div class="row">👥 <span><b>${Fo}</b> जण तुम्हाला Follow करतात</span></div>`:"")+(Lk.length||C.length?Lk.map(v=>`<div class="row" onclick="closeSheet();openPlayer('${escA(v.id)}')">❤️ <span><b>${likeCount[String(v.id)]}</b> जणांना तुमचा "${esc(v.title)}" आवडला</span></div>`).join("")+C.map(c=>`<div class="row" onclick="closeSheet();openPlayer('${escA(c.video_id)}',1)">${ava(c.username,36)}<span><b>${esc(c.username||"User")}</b> ने comment केले: ${esc(c.text)}</span></div>`).join(""):(Fo?"":'<div class="empty">अजून काही नाही 💫</div>')));
  lsSet("gs_nseen",Date.now());$("nd").style.display="none";
}
function openMenu(){
  const dark=document.documentElement.dataset.theme!=="light";
  openSheet(`<h3>Menu</h3>
  <button class="row" onclick="location.href='home.html'">🏠 GyanSetu Home</button>
  <button class="row" onclick="location.href='learn.html'">📚 Learn</button>
  <button class="row" onclick="location.href='Junkfile.html'">✈️ Messages / Users</button>
  <button class="row" onclick="noteSheet()">📝 Note <small>${esc(lsGet("gs_note","")||"सेट करा")}</small></button>
  <button class="row" onclick="toggleTheme()">🌗 Theme <small>${dark?"Dark":"Light"}</small></button>
  <button class="row" onclick="MUTE=!MUTE;closeSheet();toast(MUTE?'Default: Muted':'Default: Sound on')">🔊 Video sound <small>${MUTE?"Muted":"On"}</small></button>
  <button class="row" onclick="if(confirm('Saved videos साफ करायचे?')){savedSet.clear();lsSet('gs_saved_videos',[]);closeSheet();render()}">🔖 Saved साफ करा</button>
  <button class="row" onclick="privacySheet()">🛡️ Privacy Policy</button>
  ${currentUser?`<button class="row" style="color:#ff5470" onclick="logout()">🚪 Logout</button>`:""}`);
}
function toggleTheme(){const t=document.documentElement.dataset.theme==="light"?"dark":"light";document.documentElement.dataset.theme=t;lsSet("gs_theme",t);openMenu()}
function noteSheet(){openSheet(`<h3>📝 Note</h3><p>छोटा note (60 अक्षरे) तुमच्या story वर दिसेल. हा फक्त या फोनवर साठवला जातो.</p><input type="text" id="nIn" maxlength="60" placeholder="उदा. 🎵 आज अभ्यास mode" value="${escA(lsGet("gs_note",""))}"><button class="pbtn" onclick="lsSet('gs_note',$('nIn').value.trim());closeSheet();render()">Save</button>`)}
function privacySheet(){openSheet(`<h3>🛡️ Privacy Policy</h3><p><b>आम्ही काय साठवतो:</b> तुमचे email/username, तुम्ही post केलेले videos आणि stories, likes, comments, followers आणि story कोणी पाहिली ही माहिती.</p><p><b>कुठे:</b> हा data Supabase वर साठवला जातो. आम्ही तो कोणाला विकत नाही.</p><p><b>Public content:</b> तुमचे videos, stories आणि comments इतरांना दिसतात. फोन नंबर, पैसे, पासवर्ड किंवा खाजगी माहिती टाकू नका.</p><p><b>तुमचे नियंत्रण:</b> तुम्ही तुमचे videos, stories आणि comments कधीही delete करू शकता. Stories 24 तासांनी आपोआप दिसणे बंद होतात.</p><p><b>फोनवर साठवलेले:</b> Saved videos, Note, Theme आणि पाहिलेल्या stories फक्त तुमच्या browser मध्ये साठवल्या जातात.</p><p><b>नियम:</b> अश्लील, त्रासदायक किंवा बेकायदेशीर content ला परवानगी नाही; असे content काढले जाऊ शकते.</p><p><b>लहान मुले:</b> पालकांनी मुलांच्या वापरावर लक्ष ठेवावे.</p><p style="font-size:11.5px">हा सामान्य मसुदा आहे; app प्रसिद्ध करण्यापूर्वी आपला संपर्क/email आणि कायदेशीर तपासणी जोडा.</p><button class="pbtn" onclick="closeSheet()">ठीक आहे</button>`)}
async function logout(){await supabaseClient.auth.signOut();location.reload()}

/* UPLOAD (Post किंवा Story) */
function openUpload(m){if(!currentUser)return toast("Post करण्यासाठी Login करा");UM=m==="story"?"story":"post";upSheet()}
function upSheet(){
  const p=UM==="post";
  openSheet(`<h3>नवीन ${p?"Post":"Story"}</h3><div class="chips" style="justify-content:center"><button class="chip ${p?"on":""}" onclick="UM='post';upSheet()">Post</button><button class="chip ${p?"":"on"}" onclick="UM='story';upSheet()">Story (24 तास)</button></div><div id="up">${p?'<input type="text" id="upTitle" placeholder="Title" maxlength="120">':""}<textarea id="upDesc" placeholder="${p?"Caption / Description (optional)":"Story caption (optional)"}"></textarea><input type="file" id="upFile" accept="video/*" onchange="previewFile()" style="width:100%;margin-bottom:10px;color:var(--mu)"><video id="upPreview" controls playsinline></video><button class="pbtn" id="upSubmit" onclick="submitVideo()">${p?"Share":"Story टाका"}</button></div>`);
}
function previewFile(){const f=$("upFile").files[0],pv=$("upPreview");if(!f){pv.style.display="none";return}pv.src=URL.createObjectURL(f);pv.style.display="block"}
async function submitVideo(){
  if(!currentUser)return toast("Login required");
  const isS=UM==="story",title=isS?"":$("upTitle").value.trim(),desc=$("upDesc").value.trim(),file=$("upFile").files[0];
  if(!isS&&!title)return toast("Title लिहा");if(!file)return toast("Video निवडा");
  if(!file.type.startsWith("video/"))return toast("फक्त video file चालेल");
  if(file.size>MAX_MB*1024*1024)return toast("Video "+MAX_MB+"MB पेक्षा लहान हवा");
  if(isS&&$("upPreview").duration>STORY_MAX_SEC)return toast("Story "+STORY_MAX_SEC+" सेकंदांपेक्षा लहान हवी");
  if(isS&&!storyReady)return toast("Stories table तयार नाही (setup.sql चालवा)");
  const btn=$("upSubmit");btn.disabled=true;btn.textContent="Uploading...";
  try{
    const ext=(file.name.split(".").pop()||"mp4").toLowerCase(),path=`${currentUser.id}/${isS?"s_":""}${Date.now()}.${ext}`;
    const {error:u}=await supabaseClient.storage.from(BUCKET).upload(path,file,{contentType:file.type,upsert:false});if(u)throw u;
    const {data:pub}=supabaseClient.storage.from(BUCKET).getPublicUrl(path);
    const {error:i}=isS?await supabaseClient.from("Stories").insert({video_url:pub.publicUrl,caption:desc,username:currentName,user_id:currentUser.id})
      :await supabaseClient.from("Videos").insert({title,description:desc,video_url:pub.publicUrl,username:currentName,user_id:currentUser.id});
    if(i)throw i;
    closeSheet();toast(isS?"✅ Story टाकली!":"✅ Video post झाला!");
    if(isS){await loadStories();render()}else await loadVideos();
  }catch(err){console.error(err);toast("Failed: "+(err.message||"error"));btn.disabled=false;btn.textContent=isS?"Story टाका":"Share"}
}
async function deleteVideo(id){
  const v=videos.find(x=>String(x.id)===String(id));if(!v||!currentUser||!confirm("हा video delete करायचा?"))return;
  try{await supabaseClient.from("VideoLikes").delete().eq("video_id",String(v.id))}catch(e){}
  try{await supabaseClient.from("VideoComments").delete().eq("video_id",String(v.id))}catch(e){}
  const {error}=await supabaseClient.from("Videos").delete().eq("id",v.id).eq("user_id",currentUser.id);
  if(error){console.error(error);return toast("Delete करता आला नाही")}
  try{const mk=`/${BUCKET}/`,ix=v.video_url.indexOf(mk);if(ix>-1)await supabaseClient.storage.from(BUCKET).remove([decodeURIComponent(v.video_url.substring(ix+mk.length).split("?")[0])])}catch(e){}
  savedSet.delete(String(v.id));lsSet("gs_saved_videos",[...savedSet]);toast("🗑 Video delete झाला");loadVideos();
}
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if($("sbg").classList.contains("show"))closeSheet();else if($("st").classList.contains("show"))closeStory();else if($("pl").classList.contains("show"))closePlayer()});

/* START */
async function start(){
  savedSet=new Set(lsGet("gs_saved_videos",[]).map(String));
  {const tb=new URLSearchParams(location.search).get("tab");if(tb==="search"){location.replace("vibesearch.html");return}if(tb==="reels"){location.replace("reels.html");return}}render();
  await getUser();buildNav();
  await Promise.all([loadFollows(),loadStories()]);
  await loadVideos();
  const vid=new URLSearchParams(location.search).get("v");if(vid)openPlayer(vid);
}
start();
</script>
<script>
(function(){const n=document.getElementById("nav");if(!n)return;
function go(){let i=n.querySelector(".ind");if(!i){i=document.createElement("i");i.className="ind";n.prepend(i)}
const b=n.querySelector("button.on");if(!b){i.style.width="0";return}
i.style.width=(b.offsetWidth-6)+"px";i.style.transform="translateX("+(b.offsetLeft+3)+"px)"}
new MutationObserver(go).observe(n,{childList:true,subtree:true,attributes:true,attributeFilter:["class"]});
addEventListener("resize",go);addEventListener("load",go);go()})();
</script>
